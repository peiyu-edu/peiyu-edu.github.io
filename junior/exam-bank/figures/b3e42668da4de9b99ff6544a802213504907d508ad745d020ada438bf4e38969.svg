<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 115" role="img" aria-labelledby="title desc">
<title id="title">题设图</title><desc id="desc">数轴上的a在0左侧，b在0右侧，另有未标数的刻度。</desc>
<style>:root{--ink:#172c3c;--paper:#fff;--shade:#c8d5de}text{font-family:"Noto Sans CJK SC",sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round}@media(prefers-color-scheme:dark){:root{--ink:#eff4f8;--paper:#12212d;--shade:#405969}}</style>
<rect id="theme-canvas" width="390" height="115" fill="var(--paper)"/>
<path d="M35.000,50.000 L345.000,50.000" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M335.000,45.000 L345.000,50.000 L335.000,55.000" fill="none" stroke="var(--ink)" stroke-width="2"/><path d="M115.000,44.000 L115.000,50.000" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="115" y="79" font-size="18" text-anchor="middle" transform="rotate(0 115 79)">a</text><path d="M175.000,44.000 L175.000,50.000" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="175" y="79" font-size="18" text-anchor="middle" transform="rotate(0 175 79)">0</text><path d="M275.000,44.000 L275.000,50.000" fill="none" stroke="var(--ink)" stroke-width="2"/><text x="275" y="79" font-size="18" text-anchor="middle" transform="rotate(0 275 79)">b</text></svg>