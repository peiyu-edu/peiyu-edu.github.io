<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 312" role="img" aria-labelledby="title desc"><title id="title">舒张压的频率分布直方图</title><desc id="desc">横轴为舒张压（单位 kPa），刻度 12 至 17；纵轴为频率/组距。五个矩形依次在 [12,13)、[13,14)、[14,15)、[15,16)、[16,17] 上，高度分别为 0.24、0.16、0.36、0.16、0.08，纵轴上这四个高度值处各有一条虚线连到对应矩形顶边。</desc><style>path,line,polyline,rect{fill:none;stroke:currentColor;stroke-width:2}.ax{stroke-width:1.6}.dash{stroke-dasharray:6 5;stroke-width:1.6}.arrow{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:"Times New Roman",Georgia,serif}.cjk{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><line class="ax" x1="90.0" y1="272.0" x2="520.0" y2="272.0" /><path class="arrow" d="M530,272 L518,267 L518,277 Z" /><line class="ax" x1="90.0" y1="272.0" x2="90.0" y2="22.0" /><path class="arrow" d="M90,12 L85,24 L95,24 Z" /><rect x="140" y="147.2" width="55" height="124.8" /><rect x="195" y="188.8" width="55" height="83.2" /><rect x="250" y="84.8" width="55" height="187.2" /><rect x="305" y="188.8" width="55" height="83.2" /><rect x="360" y="230.4" width="55" height="41.6" /><line class="dash" x1="90.0" y1="84.8" x2="250.0" y2="84.8" /><text x="82.0" y="90.8" text-anchor="end" font-size="16">0.36</text><line class="dash" x1="90.0" y1="147.2" x2="140.0" y2="147.2" /><text x="82.0" y="153.2" text-anchor="end" font-size="16">0.24</text><line class="dash" x1="90.0" y1="188.8" x2="305.0" y2="188.8" /><text x="82.0" y="194.8" text-anchor="end" font-size="16">0.16</text><line class="dash" x1="90.0" y1="230.4" x2="360.0" y2="230.4" /><text x="82.0" y="236.4" text-anchor="end" font-size="16">0.08</text><text x="140.0" y="296.0" text-anchor="middle" font-size="16">12</text><text x="195.0" y="296.0" text-anchor="middle" font-size="16">13</text><text x="250.0" y="296.0" text-anchor="middle" font-size="16">14</text><text x="305.0" y="296.0" text-anchor="middle" font-size="16">15</text><text x="360.0" y="296.0" text-anchor="middle" font-size="16">16</text><text x="415.0" y="296.0" text-anchor="middle" font-size="16">17</text><text x="536.0" y="296.0" text-anchor="end" font-size="15" class="cjk">舒张压/kPa</text><text x="50.0" y="26.0" text-anchor="middle" font-size="14" class="cjk">频率</text><line class="ax" x1="34.0" y1="32.0" x2="66.0" y2="32.0" /><text x="50.0" y="49.0" text-anchor="middle" font-size="14" class="cjk">组距</text></svg>
