<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 21 章 四边形 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j21-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 21 章 四边形 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j21-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j21-test", "sectionId": "j21-test", "chapterId": "j21", "title": "第 21 章 四边形 · 章末测验", "label": "章末测验", "sections": ["j21-1", "j21-2", "j21-3"], "items": [{"id": "j21-test-01-v2", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j21-1"], "pointIds": ["pyjh.quad.006"], "prompt": "一个多边形的内角和是 $1080^\\circ$，这个多边形是几边形？", "options": [{"id": "a", "text": "六边形", "feedback": "把划分得到的三角形数当成了多边形的边数，两者不是同一个量。"}, {"id": "b", "text": "七边形", "feedback": "边数与从一个顶点划分出的三角形数之间的差写错了，应回想划分方法。"}, {"id": "c", "text": "八边形", "feedback": "由 $(n-2)\\cdot180^\\circ=1080^\\circ$ 解方程求边数。"}, {"id": "d", "text": "九边形", "feedback": "内角和公式是 $(n-2)\\cdot180^\\circ$，不是 $(n-3)\\cdot180^\\circ$。"}], "correct": "c", "answer": "八边形", "reasoning": ["设边数为 $n$，$(n-2)\\cdot180=1080$。", "$n-2=6$，$n=8$，是八边形。"], "contentVersion": "sha256:6b1c2a611f73c6863efccfd943df4afcbd002c9d17e3555e73f2a61e25b04f57"}, {"id": "j21-test-02-v2", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j21-1"], "pointIds": ["pyjh.quad.007", "pyjh.quad.006"], "prompt": "正六边形的每一个内角是多少度？", "options": [{"id": "a", "text": "$60^\\circ$", "feedback": "混淆了正多边形的外角与内角。"}, {"id": "b", "text": "$120^\\circ$", "feedback": "内角和 $(6-2)\\times180^\\circ=720^\\circ$，平均分给 $6$ 个内角。"}, {"id": "c", "text": "$720^\\circ$", "feedback": "这里得到的是全部内角的和，题目问的是单个内角。"}, {"id": "d", "text": "$108^\\circ$", "feedback": "$108^\\circ$ 是正五边形的内角。"}], "correct": "b", "answer": "$120^\\circ$", "reasoning": ["正六边形内角和为 $(6-2)\\times180^\\circ=720^\\circ$。", "每个内角相等，为 $720^\\circ\\div6=120^\\circ$。"], "contentVersion": "sha256:91fae33cc84a698d8cd81cb0528108e82cbc2c48d48363866a05850bae14e61f"}, {"id": "j21-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j21-2"], "pointIds": ["pyjh.quad.009", "pyjh.quad.008"], "prompt": "在平行四边形 $ABCD$ 中，$\\angle A=70^\\circ$，$\\angle B$ 是多少度？", "options": [{"id": "a", "text": "$70^\\circ$", "feedback": "$\\angle A$ 与 $\\angle C$ 是对角；$\\angle B$ 与 $\\angle A$ 是邻角。"}, {"id": "b", "text": "$110^\\circ$", "feedback": "$AD\\parallel BC$，邻角 $\\angle A$ 与 $\\angle B$ 互补。"}, {"id": "c", "text": "$20^\\circ$", "feedback": "平行四边形的邻角互补（和为 $180^\\circ$），不是互余。"}, {"id": "d", "text": "$290^\\circ$", "feedback": "四边形内角和 $360^\\circ$ 要分给四个角，不能只减去一个角。"}], "correct": "b", "answer": "$110^\\circ$", "reasoning": ["平行四边形 $ABCD$ 中 $AD\\parallel BC$，所以 $\\angle A+\\angle B=180^\\circ$。", "$\\angle B=180^\\circ-70^\\circ=110^\\circ$。"], "contentVersion": "sha256:14048bbc4310e240719da3caab53a85211aec212817fb2f6847114e09197ec17"}, {"id": "j21-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j21-2"], "pointIds": ["pyjh.quad.014"], "prompt": "一个三角形的三边长分别为 $6$、$8$、$10$，以它的三条中位线为边组成的三角形的周长是多少？", "options": [{"id": "a", "text": "$12$", "feedback": "每条中位线等于第三边的一半，三条中位线之和是原周长的一半。"}, {"id": "b", "text": "$24$", "feedback": "这是原三角形的周长，中位线只有对应边的一半长。"}, {"id": "c", "text": "$6$", "feedback": "每条中位线是对应边的一半，不是四分之一。"}, {"id": "d", "text": "$48$", "feedback": "中位线比第三边短，是它的一半，不是两倍。"}], "correct": "a", "answer": "$12$", "reasoning": ["三角形的中位线平行于第三边，并且等于第三边的一半。", "三条中位线长为 $3$、$4$、$5$，周长为 $12$。"], "contentVersion": "sha256:5f147e3ec0abf3298340491f4134492d8c57a3c879a5145193794c690f2aa75c"}, {"id": "j21-test-05-v2", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j21-3"], "pointIds": ["pyjh.quad.016", "pyjh.quad.019", "pyjh.quad.022"], "prompt": "下列性质中，矩形具有而菱形不一定具有的是哪一项？", "options": [{"id": "a", "text": "对角线互相平分", "feedback": "矩形和菱形都是平行四边形，这条性质两者都有。"}, {"id": "b", "text": "对角线相等", "feedback": "矩形的对角线相等；菱形的对角线一般不相等。"}, {"id": "c", "text": "对角线互相垂直", "feedback": "这是菱形的性质，矩形的对角线一般不垂直。"}, {"id": "d", "text": "两组对边分别平行且相等", "feedback": "这是所有平行四边形的共同性质。"}], "correct": "b", "answer": "对角线相等", "reasoning": ["矩形、菱形都是平行四边形，都具有对边平行且相等、对角线互相平分的性质。", "矩形保证四个角都是直角、对角线相等；菱形保证四条边相等、对角线互相垂直。正方形同时是矩形和菱形，兼有这些性质；一般菱形的对角线不一定相等。"], "contentVersion": "sha256:b02b5aab450982034dd601417be75bdf2ce33482077143a91f69b97edfacaa8c"}, {"id": "j21-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j21-2"], "pointIds": ["pyjh.quad.013", "pyjh.quad.012"], "prompt": "在四边形 $ABCD$ 中，下列条件中一定能判定它是平行四边形的是哪一项？", "options": [{"id": "a", "text": "$AB\\parallel CD$，$AD=BC$", "feedback": "一组对边平行、另一组对边相等，可能是两腰相等的梯形。"}, {"id": "b", "text": "$AB\\parallel CD$，$AB=CD$", "feedback": "一组对边平行且相等的四边形是平行四边形。"}, {"id": "c", "text": "$\\angle A=\\angle B$，$\\angle C=\\angle D$", "feedback": "相等的是两组邻角，两腰相等的梯形也满足。"}, {"id": "d", "text": "$AB=AD$，$CB=CD$", "feedback": "相等的是两组邻边，这样的四边形对边不一定平行，不一定是平行四边形。"}], "correct": "b", "answer": "$AB\\parallel CD$，$AB=CD$", "reasoning": ["判定定理：一组对边平行且相等的四边形是平行四边形。", "其余三项都能找到不是平行四边形的例子（梯形、筝形），所以不能判定。"], "contentVersion": "sha256:79aa497b37a54f73a4f116408daf195755d27db4ecadd83ac987f4f38423e517"}, {"id": "j21-test-07-v2", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j21-3"], "pointIds": ["pyjh.quad.017", "pyjh.pyth.003"], "prompt": "在 $\\triangle ABC$ 中，$\\angle ACB=90^\\circ$，$AC=6$，$BC=8$，$CD$ 是斜边 $AB$ 上的中线。$CD$ 的长是多少？", "options": [{"id": "a", "text": "$5$", "feedback": "先由勾股定理求斜边 $AB=10$，斜边上的中线等于斜边的一半。"}, {"id": "b", "text": "$10$", "feedback": "把斜边的长度当成了斜边上中线的长度，混淆了两个线段。"}, {"id": "c", "text": "$\\frac{24}5$", "feedback": "这是斜边上的高，不是中线。"}, {"id": "d", "text": "$7$", "feedback": "中线长不是两直角边的平均数。"}], "correct": "a", "answer": "$5$", "reasoning": ["由勾股定理，$AB=\\sqrt{6^2+8^2}=10$。", "直角三角形斜边上的中线等于斜边的一半，$CD=\\frac12AB=5$。"], "contentVersion": "sha256:1d5348e7b5112bf058142fd3c013dd38f44093ad4c12ad246818d9dbe873485b"}, {"id": "j21-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j21-3"], "pointIds": ["pyjh.quad.019", "pyjh.pyth.003"], "prompt": "菱形的两条对角线长分别为 $6$ 和 $8$，这个菱形一条边上的高是多少？", "options": [{"id": "a", "text": "$\\frac{48}5$", "feedback": "菱形面积是两条对角线乘积的一半，不是乘积本身。"}, {"id": "b", "text": "$5$", "feedback": "$5$ 是菱形的边长，高要由面积除以边长求出。"}, {"id": "c", "text": "$\\frac{12}5$", "feedback": "面积 $24$ 已经是对角线乘积的一半，不要再除以 $2$。"}, {"id": "d", "text": "$\\frac{24}5$", "feedback": "面积 $\\frac12\\times6\\times8=24$，边长 $5$，高 $=$ 面积 $\\div$ 边长。"}], "correct": "d", "answer": "$\\frac{24}5$", "reasoning": ["菱形对角线互相垂直平分，边长 $=\\sqrt{3^2+4^2}=5$。", "面积 $=\\frac12\\times6\\times8=24$。", "设边上的高为 $h$，$5h=24$，$h=\\frac{24}5$。"], "contentVersion": "sha256:f09ff43625c65323b618b362a40bd28a436c8440b785916872330f968289a6e1"}, {"id": "j21-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j21-1"], "pointIds": ["pyjh.quad.006", "pyjh.quad.007"], "prompt": "一个多边形的内角和是它的外角和的 $4$ 倍，这个多边形是几边形？", "options": [{"id": "a", "text": "八边形", "feedback": "内角和是 $(n-2)\\cdot180^\\circ$，不是 $n\\cdot180^\\circ$。"}, {"id": "b", "text": "六边形", "feedback": "任意多边形的外角和都是 $360^\\circ$，不是 $180^\\circ$。"}, {"id": "c", "text": "十边形", "feedback": "外角和是 $360^\\circ$，列方程 $(n-2)\\cdot180=4\\times360$。"}, {"id": "d", "text": "九边形", "feedback": "内角和公式中是 $n-2$，不是 $n-1$。"}], "correct": "c", "answer": "十边形", "reasoning": ["多边形的外角和是 $360^\\circ$，所以内角和是 $4\\times360^\\circ=1440^\\circ$。", "$(n-2)\\cdot180=1440$，$n-2=8$，$n=10$。"], "contentVersion": "sha256:5deb3e34149b9c8cd62c7dbe6718720e080a23b3c06cece8f571596fac6f1cb7"}, {"id": "j21-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j21-2"], "pointIds": ["pyjh.quad.010", "pyjh.tri.005"], "prompt": "平行四边形 $ABCD$ 的对角线 $AC$、$BD$ 相交于点 $O$，$AC=10$，$BD=16$，设 $AB=x$。$x$ 的取值范围是什么？", "options": [{"id": "a", "text": "$6<x<26$", "feedback": "三角形 $AOB$ 的两边是对角线的一半 $OA=5$、$OB=8$，不是整条对角线。"}, {"id": "b", "text": "$3<x<13$", "feedback": "对角线互相平分，在 $\\triangle AOB$ 中用三边关系。"}, {"id": "c", "text": "$3\\le x\\le13$", "feedback": "三角形两边之和大于第三边，不能取等号。"}, {"id": "d", "text": "$5<x<8$", "feedback": "第三边的范围由两边之差与两边之和确定，不是夹在两边之间。"}], "correct": "b", "answer": "$3<x<13$", "reasoning": ["平行四边形的对角线互相平分，$OA=5$，$OB=8$。", "在 $\\triangle AOB$ 中，$8-5<AB<8+5$，即 $3<x<13$。"], "contentVersion": "sha256:01eec205f20a2d00bf57f6c7fb2a4cff99c66ffee52993426d8ac897a1b7783b"}, {"id": "j21-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j21-3"], "pointIds": ["pyjh.quad.016", "pyjh.pyth.006", "pyjh.pyth.003"], "prompt": "矩形 $ABCD$ 中，$AB=CD=8$，$AD=BC=10$。点 $E$ 在边 $CD$ 上，沿直线 $AE$ 折叠 $\\triangle ADE$，点 $D$ 恰好落在边 $BC$ 上的点 $F$ 处。$CE$ 的长是多少？", "options": [{"id": "a", "text": "$3$", "feedback": "$AF=AD=10$ 求出 $BF$、$FC$，再在 $\\mathrm{Rt}\\triangle ECF$ 中设 $CE=x$ 列方程。"}, {"id": "b", "text": "$5$", "feedback": "这是 $DE$（也等于 $EF$）的长，题目问的是 $CE$。"}, {"id": "c", "text": "$4$", "feedback": "$4$ 是 $FC$ 的长，不是 $CE$。"}, {"id": "d", "text": "$6$", "feedback": "$6$ 是 $BF$ 的长，不是 $CE$。"}], "correct": "a", "answer": "$3$", "reasoning": ["由折叠，$AF=AD=10$，$EF=DE$。在 $\\mathrm{Rt}\\triangle ABF$ 中，$BF=\\sqrt{10^2-8^2}=6$，所以 $FC=10-6=4$。", "设 $CE=x$，则 $EF=DE=8-x$。在 $\\mathrm{Rt}\\triangle ECF$ 中，$x^2+4^2=(8-x)^2$。", "$x^2+16=64-16x+x^2$，$16x=48$，$x=3$。"], "contentVersion": "sha256:fcb0881e3d048a791586184678f633041300e099708ee921999cade2c4e4e76c"}, {"id": "j21-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j21-2", "j21-3"], "pointIds": ["pyjh.quad.015", "pyjh.quad.020", "pyjh.quad.014"], "prompt": "顺次连接四边形 $ABCD$ 各边的中点，所得的四边形是菱形。四边形 $ABCD$ 的对角线 $AC$、$BD$ 一定满足什么条件？", "options": [{"id": "a", "text": "$AC\\perp BD$", "feedback": "对角线垂直只能使中点四边形的邻边垂直，得到的是矩形。"}, {"id": "b", "text": "$AC$ 与 $BD$ 互相平分", "feedback": "中点四边形的边长只与对角线的长度有关，与对角线是否互相平分无关。"}, {"id": "c", "text": "$AC=BD$", "feedback": "中点四边形每条边等于一条对角线的一半，四边都相等要求两条对角线相等。"}, {"id": "d", "text": "$AC\\perp BD$ 且 $AC=BD$", "feedback": "这样得到的是正方形，条件比菱形多；对角线不垂直时也可能得到菱形。"}], "correct": "c", "answer": "$AC=BD$", "reasoning": ["由三角形中位线定理，中点四边形的两组对边分别等于 $\\frac12AC$ 和 $\\frac12BD$，它总是平行四边形。", "它是菱形 $\\iff$ 邻边相等 $\\iff$ $\\frac12AC=\\frac12BD$，即 $AC=BD$。", "对角线是否垂直、是否互相平分都不是必需的。"], "contentVersion": "sha256:861a40145de1294af7be42ebc81622f59de456922abe9c89e2bab79792375602"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
