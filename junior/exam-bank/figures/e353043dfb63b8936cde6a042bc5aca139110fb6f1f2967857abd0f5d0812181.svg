<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 250" role="img"><title>矩形及其对角线</title><desc>矩形OABC的边OC在x轴上、OA在y轴上，对角线OB与AC交于P，OA长2，OC长4。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><line x1="35" y1="200" x2="335" y2="200" class=""></line><path d="M327 195 L337 200 L327 205" class=""></path><line x1="60" y1="230" x2="60" y2="40" class=""></line><path d="M55 48 L60 38 L65 48" class=""></path><polygon points="60,200 60,80 300,80 300,200" class=""></polygon><line x1="60" y1="200" x2="300" y2="80" class=""></line><line x1="60" y1="80" x2="300" y2="200" class=""></line><text x="43" y="224">O</text><text x="42" y="84">A</text><text x="312" y="78">B</text><text x="302" y="225">C</text><text x="180" y="171">P</text><text x="345" y="219">x</text><text x="44" y="35">y</text></svg>
