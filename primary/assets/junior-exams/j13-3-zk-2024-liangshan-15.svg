<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 335" width="560" height="335" role="img" aria-labelledby="title desc">
<title id="title">三角形 ABC 的高 CD 与角平分线 AE</title>
<desc id="desc">△ABC，AB 在下方水平放置，C 在上方。点 D 在边 AB 上，CD 垂直于 AB（D 处有直角记号）；点 E 在边 BC 上，连接 AE，AE 与 CD 相交。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="560" height="335" fill="white"/>
<polygon points="42.1,290.0 502.1,290.0 352.0,30.0" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="352.0" y1="30.0" x2="352.0" y2="290.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="42.1" y1="290.0" x2="422.2" y2="151.7" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<path d="M372 290v-20h-20" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="26.1" y="300.0" class="l" text-anchor="middle">A</text>
<text x="520.1" y="300.0" class="l" text-anchor="middle">B</text>
<text x="354.0" y="24.0" class="l" text-anchor="middle">C</text>
<text x="352.0" y="326.0" class="l" text-anchor="middle">D</text>
<text x="442.2" y="149.7" class="l" text-anchor="middle">E</text>
</svg>
