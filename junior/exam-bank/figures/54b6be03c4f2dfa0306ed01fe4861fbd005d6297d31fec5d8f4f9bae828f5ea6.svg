<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" role="img" aria-labelledby="title desc"><title id="title">赵爽弦图及两种拼法</title><desc id="desc">图1：赵爽弦图，四个全等的直角三角形围成一个倾斜的大正方形，中间是一个小正方形；图2：一个菱形，画有两条对角线；图3：一个大正方形，四个角上各有一个直角三角形，中间围成一个倾斜的正方形。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.s{fill:currentColor;fill-opacity:.15}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M70.00,20.00L170.00,70.00L120.00,170.00L20.00,120.00Z" /><path d="M70.00,20.00L70.00,120.00" /><path d="M170.00,70.00L70.00,70.00" /><path d="M120.00,170.00L120.00,70.00" /><path d="M20.00,120.00L120.00,120.00" /><text x="95.00" y="205.00" text-anchor="middle" font-size="22">图1</text><path d="M235.00,95.00L335.00,45.00L435.00,95.00L335.00,145.00Z" /><path d="M235.00,95.00L435.00,95.00" /><path d="M335.00,45.00L335.00,145.00" /><text x="335.00" y="205.00" text-anchor="middle" font-size="22">图2</text><path d="M490.00,20.00L640.00,20.00L640.00,170.00L490.00,170.00Z" /><path d="M590.00,20.00L640.00,120.00L540.00,170.00L490.00,70.00Z" /><text x="565.00" y="205.00" text-anchor="middle" font-size="22">图3</text></svg>
