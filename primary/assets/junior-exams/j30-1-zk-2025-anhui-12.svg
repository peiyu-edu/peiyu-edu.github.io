<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 292" width="400" height="292" role="img" aria-labelledby="title desc">
<title id="title">圆的切线与弦</title>
<desc id="desc">圆心为 O 的圆，点 A 在圆的右端，点 P 在圆外左侧，线段 PA 水平穿过圆心 O。点 B 在圆的左上方，PB 与圆相切于点 B，连接 AB。图中没有标注度数。</desc>
<style>text{fill:#17202a;font-size:30px}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic}.r{font-family:'Times New Roman',Georgia,serif}.z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="400" height="292" fill="white"/>
<circle cx="230" cy="150" r="128" fill="none" stroke="#17202a" stroke-width="3"/>
<line x1="62.9" y1="150.0" x2="358.0" y2="150.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="62.9" y1="150.0" x2="131.9" y2="67.7" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="131.9" y1="67.7" x2="358.0" y2="150.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<circle cx="230.0" cy="150.0" r="6" fill="#17202a"/>
<text class="m" x="40.9" y="160.0" text-anchor="middle">P</text>
<text class="m" x="380.0" y="160.0" text-anchor="middle">A</text>
<text class="m" x="119.9" y="53.7" text-anchor="middle">B</text>
<text class="m" x="230.0" y="190.0" text-anchor="middle">O</text>
</svg>
