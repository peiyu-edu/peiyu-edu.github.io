<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">投票结果条形统计图与扇形统计图</title><desc id="desc">左为条形统计图：纵轴人数，刻度0到250，每50一格并有虚线；羽毛球150，排球60，乒乓球没有画出，篮球90。右为扇形统计图：羽毛球所在扇形标30%，排球、乒乓球、篮球扇形只标名称。</desc><style>path,circle{fill:none;stroke:currentColor;stroke-width:1.6}.grid{stroke-dasharray:5 4;stroke-width:1}.bar{fill:var(--bar)}text{fill:currentColor;stroke:none;font-family:Georgia,'Noto Serif CJK SC',serif;font-size:15px}svg{color:#243d45;background:#fff;--bar:#d3dad9}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--bar:#3e555b}}</style><path class="grid" d="M70,210H360M70,170H360M70,130H360M70,90H360M70,50H360"/><path d="M70,250H380M372,245L380,250L372,255"/><path d="M70,250V28M65,36L70,28L75,36"/><path class="bar" d="M104,250V130H136V250"/><path class="bar" d="M169,250V202H201V250"/><path class="bar" d="M299,250V178H331V250"/><text x="62" y="255" text-anchor="end">0</text><text x="62" y="215" text-anchor="end">50</text><text x="62" y="175" text-anchor="end">100</text><text x="62" y="135" text-anchor="end">150</text><text x="62" y="95" text-anchor="end">200</text><text x="62" y="55" text-anchor="end">250</text><text x="80" y="30">人数</text><text x="120" y="124" text-anchor="middle">150</text><text x="185" y="196" text-anchor="middle">60</text><text x="315" y="165" text-anchor="middle">90</text><text x="120" y="274" text-anchor="middle">羽毛球</text><text x="185" y="274" text-anchor="middle">排球</text><text x="250" y="274" text-anchor="middle">乒乓球</text><text x="315" y="274" text-anchor="middle">篮球</text><text x="398" y="274" text-anchor="middle">球类</text><circle cx="520" cy="150" r="100"/><path d="M520,150L620,150M520,150L489.1,54.9M520,150L432.4,101.8M520,150L562.6,240.5"/><text x="555" y="96" text-anchor="middle">羽毛球</text><text x="555" y="122" text-anchor="middle">30%</text><text x="476" y="100" text-anchor="middle">排球</text><text x="478" y="190" text-anchor="middle">乒乓球</text><text x="573" y="184" text-anchor="middle">篮球</text></svg>
