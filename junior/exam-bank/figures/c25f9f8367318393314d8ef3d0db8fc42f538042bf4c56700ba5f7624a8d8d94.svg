<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 520 205" role="img" aria-labelledby="title desc"><title id="title">丢沙包示意图</title><desc id="desc">小红站在地面上向右丢沙包，出手点距地面1.5m（竖直双箭头标注，出手点下方有竖直虚线到地面）；沙包轨迹是一段先上升后下降的抛物线，只画出前一段；地面上从出手点正下方到靶心的水平距离标注为10m，靶心处有一条短竖线。</desc><style>path,circle,ellipse,line{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:5 4}.thin{stroke-width:1.5}.fill{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M30,170L480,170"/><circle cx="58" cy="66" r="8"/><path d="M58,74L64,112"/><path d="M60,88L46,96L48,104"/><path d="M60,88L76,106"/><path d="M64,112L46,170"/><path d="M64,112L72,140L68,170"/><ellipse cx="82" cy="108" rx="6" ry="4"/><path d="M88,108L114,108"/><path d="M86,104Q190,34 300,58"/><path class="d thin" d="M80,128L80,170"/><path class="thin" d="M100,114L100,164"/><path class="fill" d="M100,108L96,117L104,117Z"/><path class="fill" d="M100,170L96,161L104,161Z"/><text x="106" y="146" font-size="17">1.5m</text><path class="thin" d="M80,170L80,210"/><path class="thin" d="M460,170L460,210"/><path class="thin" d="M86,196L240,196"/><path class="thin" d="M302,196L454,196"/><path class="fill" d="M80,196L90,192L90,200Z"/><path class="fill" d="M460,196L450,192L450,200Z"/><text x="271" y="202" font-size="17" text-anchor="middle">10m</text></svg>
