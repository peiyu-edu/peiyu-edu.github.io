<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575 270" width="575" height="270" role="img" aria-labelledby="title desc">
<title id="title">全等三角形 ABC 与 DEF</title>
<desc id="desc">两个三角形并排。△ABC 的边上标着 AB=6、AC=4、BC=5；△DEF 没有标长度，D 在上方，E 在左下，F 在右下。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="575" height="270" fill="white"/>
<polygon points="227.0,39.4 20.0,222.0 250.0,222.0" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="512.0,39.4 305.0,222.0 535.0,222.0" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<text x="227.0" y="31.4" class="l" text-anchor="middle">A</text>
<text x="16.0" y="258.0" class="l" text-anchor="middle">B</text>
<text x="256.0" y="258.0" class="l" text-anchor="middle">C</text>
<text x="512.0" y="31.4" class="l" text-anchor="middle">D</text>
<text x="301.0" y="258.0" class="l" text-anchor="middle">E</text>
<text x="541.0" y="258.0" class="l" text-anchor="middle">F</text>
<text x="103.5" y="124.7" class="n" text-anchor="middle">6</text>
<text x="258.5" y="138.7" class="n" text-anchor="middle">4</text>
<text x="135.0" y="258.0" class="n" text-anchor="middle">5</text>
</svg>
