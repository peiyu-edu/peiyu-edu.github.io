<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 25 720 425" width="600" height="354" role="img" aria-labelledby="title desc">
<title id="title">标枪落点分布图</title>
<desc id="desc">投掷区示意图：下方一个圆形投掷圈，向上张开两条射线形成扇形。扇形内有两条虚线圆弧，较近的两端标 20m，较远的两端标 30m。黑点表示落点，大多聚集在 20m 弧附近，有的在弧上，有的在弧内外两侧，另有一个点明显偏向 30m 弧一侧。</desc>
