<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 378" width="590" height="378" role="img" aria-labelledby="title desc">
<title id="title">角内一点与三角形 PMN</title>
<desc id="desc">∠AOB 的顶点 O 在左下方，射线 OB 水平向右，射线 OA 向右上方。点 M 在 OA 上，点 N 在 OB 上，点 P 在角的内部，连接 PM、PN、MN 构成三角形 PMN。</desc>
<style>text { fill:#17202a; } .it { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .nm { font-family:'Times New Roman',Georgia,serif; } .zh { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="590" height="378" fill="white"/>
<g transform="translate(0 -101.1)">
<line x1="40.0" y1="440.0" x2="307.6" y2="121.1" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="40.0" y1="440.0" x2="560.0" y2="440.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="160.3" y1="296.6" x2="160.3" y2="440.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="160.3" y1="296.6" x2="357.1" y2="308.6" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="160.3" y1="440.0" x2="357.1" y2="308.6" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<text class="it" x="22.0" y="464.0" text-anchor="middle" font-size="30">O</text>
<text class="it" x="160.3" y="474.0" text-anchor="middle" font-size="30">N</text>
<text class="it" x="554.0" y="474.0" text-anchor="middle" font-size="30">B</text>
<text class="it" x="329.6" y="129.1" text-anchor="middle" font-size="30">A</text>
<text class="it" x="140.3" y="290.6" text-anchor="middle" font-size="30">M</text>
<text class="it" x="381.1" y="316.6" text-anchor="middle" font-size="30">P</text>
</g>
</svg>
