<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 310" role="img" aria-labelledby="title desc"><title id="title">八卦图</title><desc id="desc">中间为太极图，四周按方位排列八个卦象，从上方起顺时针依次为乾、巽、坎、艮、坤、震、离、兑；每卦由三个爻组成。</desc><style>path,circle,line,polyline,polygon{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-size:17px}.i{font-style:italic}.c{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif}.f{fill:currentColor;stroke:none}.b{fill:#fff;stroke:none}.bs{stroke:#fff}.g{stroke-width:1;stroke-dasharray:4 3;opacity:.6}.d{stroke-dasharray:6 4}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.b{fill:#15272d}.bs{stroke:#15272d}}</style><circle cx="160" cy="155" r="50"/><path class="f" d="M160 105 A50 50 0 0 1 160 205 A25 25 0 0 1 160 155 A25 25 0 0 0 160 105 Z"/><circle class="f" cx="160" cy="130" r="7"/><circle class="b" cx="160" cy="180" r="7"/><g transform="translate(160,155) rotate(0)"><rect class="f" x="-22" y="-94" width="44" height="8"/><rect class="f" x="-22" y="-82" width="44" height="8"/><rect class="f" x="-22" y="-70" width="44" height="8"/></g><text x="151.0" y="44.0" class="c" style="font-size:18px">乾</text><g transform="translate(160,155) rotate(45)"><rect class="f" x="-22" y="-94" width="44" height="8"/><rect class="f" x="-22" y="-82" width="44" height="8"/><rect class="f" x="-22" y="-70" width="19" height="8"/><rect class="f" x="3" y="-70" width="19" height="8"/></g><text x="234.4" y="78.6" class="c" style="font-size:18px">巽</text><g transform="translate(160,155) rotate(90)"><rect class="f" x="-22" y="-94" width="19" height="8"/><rect class="f" x="3" y="-94" width="19" height="8"/><rect class="f" x="-22" y="-82" width="44" height="8"/><rect class="f" x="-22" y="-70" width="19" height="8"/><rect class="f" x="3" y="-70" width="19" height="8"/></g><text x="269.0" y="162.0" class="c" style="font-size:18px">坎</text><g transform="translate(160,155) rotate(135)"><rect class="f" x="-22" y="-94" width="44" height="8"/><rect class="f" x="-22" y="-82" width="19" height="8"/><rect class="f" x="3" y="-82" width="19" height="8"/><rect class="f" x="-22" y="-70" width="19" height="8"/><rect class="f" x="3" y="-70" width="19" height="8"/></g><text x="234.4" y="245.4" class="c" style="font-size:18px">艮</text><g transform="translate(160,155) rotate(180)"><rect class="f" x="-22" y="-94" width="19" height="8"/><rect class="f" x="3" y="-94" width="19" height="8"/><rect class="f" x="-22" y="-82" width="19" height="8"/><rect class="f" x="3" y="-82" width="19" height="8"/><rect class="f" x="-22" y="-70" width="19" height="8"/><rect class="f" x="3" y="-70" width="19" height="8"/></g><text x="151.0" y="280.0" class="c" style="font-size:18px">坤</text><g transform="translate(160,155) rotate(225)"><rect class="f" x="-22" y="-94" width="19" height="8"/><rect class="f" x="3" y="-94" width="19" height="8"/><rect class="f" x="-22" y="-82" width="19" height="8"/><rect class="f" x="3" y="-82" width="19" height="8"/><rect class="f" x="-22" y="-70" width="44" height="8"/></g><text x="67.6" y="245.4" class="c" style="font-size:18px">震</text><g transform="translate(160,155) rotate(270)"><rect class="f" x="-22" y="-94" width="44" height="8"/><rect class="f" x="-22" y="-82" width="19" height="8"/><rect class="f" x="3" y="-82" width="19" height="8"/><rect class="f" x="-22" y="-70" width="44" height="8"/></g><text x="33.0" y="162.0" class="c" style="font-size:18px">离</text><g transform="translate(160,155) rotate(315)"><rect class="f" x="-22" y="-94" width="19" height="8"/><rect class="f" x="3" y="-94" width="19" height="8"/><rect class="f" x="-22" y="-82" width="44" height="8"/><rect class="f" x="-22" y="-70" width="44" height="8"/></g><text x="67.6" y="78.6" class="c" style="font-size:18px">兑</text></svg>
