<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 322" width="460" height="322" role="img" aria-labelledby="title desc">
<title id="title">相交直线 AB、CD 与射线 OE</title>
<desc id="desc">水平直线 AB 与直线 CD 相交于点 O，A 在左，B 在右，C 在左上，D 在右下。射线 OE 指向右上，在 OC 与 OB 之间，OC 与 OE 之间标直角记号。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="460" height="322" fill="white"/>
<line x1="50.0" y1="170.0" x2="410.0" y2="170.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="230.0" y1="170.0" x2="139.9" y2="25.8" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="230.0" y1="170.0" x2="320.1" y2="314.2" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="230.0" y1="170.0" x2="374.2" y2="79.9" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<path d="M220.5 154.7L235.7 145.2L245.3 160.5" fill="none" stroke="#17202a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30.0" y="180.0" class="m" text-anchor="middle">A</text>
<text x="432.0" y="180.0" class="m" text-anchor="middle">B</text>
<text x="208.0" y="206.0" class="m" text-anchor="middle">O</text>
<text x="165.9" y="29.8" class="m" text-anchor="middle">C</text>
<text x="344.1" y="316.2" class="m" text-anchor="middle">D</text>
<text x="390.2" y="71.9" class="m" text-anchor="middle">E</text>
</svg>
