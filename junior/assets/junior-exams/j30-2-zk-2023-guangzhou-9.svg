<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 368" width="470" height="368" role="img" aria-labelledby="title desc">
<title id="title">三角形的内切圆</title>
<desc id="desc">三角形 ABC，A 在右上方，B 在左下方，C 在右下方，BC 水平。圆 I 是它的内切圆，标出圆心 I，与 BC、CA、AB 分别相切于 D、E、F。图中连接了 FD 和 DE。</desc>
<style>text{fill:#17202a;font-size:30px}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic}.r{font-family:'Times New Roman',Georgia,serif}.z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="470" height="368" fill="white"/>
<polygon points="429.0,51.0 39.0,318.0 387.0,318.0" fill="none" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/>
<circle cx="314.2" cy="232.8" r="85.2" fill="none" stroke="#17202a" stroke-width="3"/>
<line x1="266.1" y1="162.5" x2="314.2" y2="318.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="314.2" y1="318.0" x2="398.3" y2="246.1" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<circle cx="314.2" cy="232.8" r="5" fill="#17202a"/>
<text class="m" x="435.0" y="39.0" text-anchor="middle">A</text>
<text class="m" x="23.0" y="348.0" text-anchor="middle">B</text>
<text class="m" x="393.0" y="354.0" text-anchor="middle">C</text>
<text class="m" x="308.2" y="354.0" text-anchor="middle">D</text>
<text class="m" x="422.3" y="252.1" text-anchor="middle">E</text>
<text class="m" x="244.1" y="148.5" text-anchor="middle">F</text>
<text class="m" x="336.2" y="222.8" text-anchor="middle">I</text>
</svg>
