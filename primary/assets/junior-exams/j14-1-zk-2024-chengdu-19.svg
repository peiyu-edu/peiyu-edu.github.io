<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 425" width="380" height="425" role="img" aria-labelledby="title desc">
<title id="title">全等三角形 ABC 与 CDE</title>
<desc id="desc">△ABC 与 △CDE 有公共点 C，C 在右侧。D 在上方、E 在下方，DE 竖直；A 在 C 的左上方，B 在左下方。CA、CB 都与线段 DE 相交。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="380" height="425" fill="white"/>
<polygon points="151.5,170.9 33.2,359.9 319.1,238.9" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="319.1,238.9 191.2,56.2 191.2,366.8" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<text x="137.5" y="160.9" class="l" text-anchor="middle">A</text>
<text x="27.2" y="393.9" class="l" text-anchor="middle">B</text>
<text x="339.1" y="248.9" class="l" text-anchor="middle">C</text>
<text x="187.2" y="46.2" class="l" text-anchor="middle">D</text>
<text x="191.2" y="402.8" class="l" text-anchor="middle">E</text>
</svg>
