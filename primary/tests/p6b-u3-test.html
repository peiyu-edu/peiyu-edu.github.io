<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年级下册 第三单元 圆柱与圆锥 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p6b-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>六年级下册 第三单元 圆柱与圆锥 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p6b-u3-test", "sectionId": "p6b-u3-test", "unitId": "p6b-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "六年级下册 第三单元 圆柱与圆锥 单元测评", "items": [{"id": "p6b-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "把一个圆柱的侧面沿着高剪开，展开后得到一个长方形。这个长方形的长等于圆柱的什么？", "answer": "底面周长", "reasoning": ["侧面展开后，长方形的长 = 圆柱的底面周长。", "长方形的宽 = 圆柱的高。"], "options": [{"id": "a", "text": "底面周长", "feedback": "对。长方形的长是由底面的一圈展开的。"}, {"id": "b", "text": "高", "feedback": "沿着高剪开，高是长方形的宽（另一条边）。"}, {"id": "c", "text": "底面直径", "feedback": "展开的长是底面一整圈的长度，比直径长。"}], "correct": "a", "pointIds": ["pyps.p6b.u3.001"], "contentVersion": "sha256:8f225ce49d5986421dd5d08076dd2b528d96a5e7c9ebd32517744a3e1420c247"}, {"id": "p6b-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个圆柱的底面半径是 2 厘米，高是 5 厘米。它的侧面积是多少平方厘米？（π 取 3.14）", "answer": "62.8 平方厘米", "reasoning": ["侧面积 = 底面周长 × 高。", "底面周长是 2 × 3.14 × 2，得 12.56（厘米）。", "12.56 × 5，得 62.8（平方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u3.002"], "contentVersion": "sha256:d676f558cd3453551782fbdceda1171a571eb590709ec53b991274ad3196370a"}, {"id": "p6b-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个圆柱的底面积是 30 平方厘米，高是 8 厘米。它的体积是多少立方厘米？", "answer": "30 × 8 = 240（立方厘米）", "reasoning": ["圆柱的体积 = 底面积 × 高。", "30 × 8 = 240（立方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u3.004"], "contentVersion": "sha256:0d2b776dddbb32ce3929c8781d466e00f05641f067bb9871cfe8d672fbd60a55"}, {"id": "p6b-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一个圆锥有几条高？", "answer": "1 条", "reasoning": ["圆锥的高是从顶点到底面圆心的距离。", "顶点和底面圆心都只有一个，所以圆锥只有 1 条高。"], "options": [{"id": "a", "text": "2 条", "feedback": "圆锥的顶点只有一个，从顶点到底面圆心只有 1 条高。"}, {"id": "b", "text": "1 条", "feedback": "对。从顶点到底面圆心的距离是圆锥的高，只有 1 条。"}, {"id": "c", "text": "无数条", "feedback": "无数条高的是圆柱。圆锥只有 1 条高。"}], "correct": "b", "pointIds": ["pyps.p6b.u3.006"], "contentVersion": "sha256:448c3f8ca248a16e02aef532f6ed293debe0e95a3cf183106c39c91be2c6413c"}, {"id": "p6b-u3-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "做一个无盖的圆柱形水桶，底面直径是 4 分米，高是 5 分米。至少需要铁皮多少平方分米？（π 取 3.14）", "answer": "3.14 × 4 × 5 + 3.14 ×（4 ÷ 2）×（4 ÷ 2）= 75.36（平方分米）", "reasoning": ["无盖水桶 = 侧面 + 1 个底面。", "侧面积是 3.14 × 4 × 5，得 62.8（平方分米）。", "底面积：半径 4 ÷ 2 = 2（分米），3.14 × 2 × 2，得 12.56（平方分米）。", "62.8 + 12.56 = 75.36（平方分米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u3.003"], "contentVersion": "sha256:f087de80e650cd05ecc33b3a37fbd0deb7d42c65752099a43f5d837b3e1ec488"}, {"id": "p6b-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个圆锥和一个圆柱等底等高，圆柱的体积是 36 立方厘米。圆锥的体积是多少立方厘米？", "answer": "12 立方厘米", "reasoning": ["等底等高的圆锥体积是圆柱体积的 1/3。", "36 × 1/3 = 12（立方厘米）。"], "options": [{"id": "a", "text": "36 立方厘米", "feedback": "等底等高时，圆锥只有圆柱体积的 1/3。"}, {"id": "b", "text": "12 立方厘米", "feedback": "对。等底等高的圆锥体积是圆柱的 1/3，36 × 1/3 = 12。"}, {"id": "c", "text": "108 立方厘米", "feedback": "圆锥比等底等高的圆柱小，是它的 1/3，不是 3 倍。"}], "correct": "b", "pointIds": ["pyps.p6b.u3.007"], "contentVersion": "sha256:8814736bc8092d5464d950f1254d852422599fcebec61c113d0371bd0f2804e9"}, {"id": "p6b-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个圆柱的体积是 251.2 立方厘米，底面半径是 4 厘米。它的高是多少厘米？（π 取 3.14）", "answer": "251.2 ÷（3.14 × 4 × 4）= 5（厘米）", "reasoning": ["先求底面积：3.14 × 4 × 4，得 50.24（平方厘米）。", "高 = 体积 ÷ 底面积 = 251.2 ÷ 50.24 = 5（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u3.005"], "contentVersion": "sha256:889bfb859eefc93fa5b5cc651022696048a0f5349b23b7cc45662c1e1caf48d3"}, {"id": "p6b-u3-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个圆锥形沙堆，底面直径是 6 米，高是 1.5 米。这堆沙的体积是多少立方米？（π 取 3.14）", "answer": "1/3 × 3.14 ×（6 ÷ 2）×（6 ÷ 2）× 1.5 = 14.13（立方米）", "reasoning": ["底面半径 6 ÷ 2 = 3（米），底面积是 3.14 × 3 × 3，得 28.26（平方米）。", "圆锥的体积 = 1/3 × 底面积 × 高。", "1/3 × 28.26 × 1.5 = 14.13（立方米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u3.007", "pyps.p6b.u3.006"], "contentVersion": "sha256:fbb41160114123d2d1ba448149831dbb9697c42883d8c31ca2669773e257824b"}, {"id": "p6b-u3-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个圆柱形玻璃杯，内部底面半径是 10 厘米，里面装着水。把一个铁块完全浸没在水中，水面升高了 2 厘米（水没有溢出）。这个铁块的体积是多少立方厘米？（π 取 3.14）", "answer": "628 立方厘米", "reasoning": ["铁块完全浸没且水没有溢出，铁块的体积等于水面上升后多占据的空间体积。", "这部分空间是一个底面半径 10 厘米、高 2 厘米的圆柱。", "3.14 × 10 × 10 × 2，得 628（立方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u3.008", "pyps.p6b.u3.004"], "contentVersion": "sha256:23efdca34055897322e91ef678fe1bac08a73aded709dbb213ae70fa3f4881cc"}, {"id": "p6b-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "把一个高 6 厘米的圆柱形钢坯熔铸成一个和它底面积相等的圆锥（体积不变）。圆锥的高是多少厘米？", "answer": "18 厘米", "reasoning": ["熔铸前后体积不变，底面积也相等。", "圆锥体积 = 1/3 × 底面积 × 高，要和圆柱体积相等，高要是圆柱的 3 倍。", "6 × 3 = 18（厘米）。"], "options": [{"id": "a", "text": "6 厘米", "feedback": "等底等高的圆锥只有圆柱体积的 1/3，体积不变就要更高。"}, {"id": "b", "text": "2 厘米", "feedback": "等底时，圆锥要比圆柱高才能体积一样，高是圆柱的 3 倍，不是 1/3。"}, {"id": "c", "text": "18 厘米", "feedback": "对。体积和底面积都不变，圆锥的高要是圆柱的 3 倍：6 × 3 = 18。"}], "correct": "c", "pointIds": ["pyps.p6b.u3.008", "pyps.p6b.u3.007"], "contentVersion": "sha256:0cee3440b9a98bc7267b267ac4f97848a7824832b36ea39733fdce3ffb565651"}], "contentVersion": "sha256:21b0f6f9e5491b76878f1c5f396cd35a2ccecf443004a63c74808e8bab371958"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
