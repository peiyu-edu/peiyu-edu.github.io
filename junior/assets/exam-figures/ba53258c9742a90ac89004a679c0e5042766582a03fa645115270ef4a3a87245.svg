<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 552 214" width="552" height="214" role="img" aria-labelledby="title desc">
<title id="title">三角形沿直线平移</title>
<desc id="desc">△ABC 沿 BC 所在直线向右平移得到△DEF。点 B、E、C、F 依次在同一条水平直线上，A 在 BC 上方，D 在 EF 上方，线段 AC 与 DE 相交。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="552" height="214" fill="white"/>
<line x1="30.0" y1="170.0" x2="510.0" y2="170.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<path d="M30 170L116 40L330 170" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M210 170L296 40L510 170" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="16.0" y="178.0" class="m" text-anchor="middle">B</text>
<text x="116.0" y="30.0" class="m" text-anchor="middle">A</text>
<text x="296.0" y="30.0" class="m" text-anchor="middle">D</text>
<text x="210.0" y="204.0" class="m" text-anchor="middle">E</text>
<text x="330.0" y="204.0" class="m" text-anchor="middle">C</text>
<text x="528.0" y="178.0" class="m" text-anchor="middle">F</text>
</svg>
