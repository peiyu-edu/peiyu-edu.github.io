<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 376" width="400" height="376" role="img" aria-labelledby="title desc">
<title id="title">正方形中的动点 P 与 Q</title>
<desc id="desc">正方形 ABCD，A 左上，D 右上，B 左下，C 右下，对角线 AC、BD 相交于点 O。点 P 在 OA 上，点 Q 在 CD 上，线段 PQ 已连接。AB 边上有向下的箭头，CD 边上有向上的箭头，OA 上靠近 P 处有指向 A 的箭头。</desc>
<style>text { fill:#17202a; } .it { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .nm { font-family:'Times New Roman',Georgia,serif; } .zh { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="400" height="376" fill="white"/>
<rect x="62" y="52" width="280" height="280" fill="none" stroke="#17202a" stroke-width="3"/>
<line x1="62.0" y1="52.0" x2="342.0" y2="332.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="62.0" y1="332.0" x2="342.0" y2="52.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="342.0" y1="250.8" x2="115.2" y2="105.2" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<polygon points="115.2,105.2 138.5,115.8 125.8,128.5" fill="#17202a"/>
<polygon points="62.0,205.0 53.0,181.0 71.0,181.0" fill="#17202a"/>
<polygon points="342.0,125.0 351.0,149.0 333.0,149.0" fill="#17202a"/>
<text class="it" x="44.0" y="40.0" text-anchor="middle" font-size="30">A</text>
<text class="it" x="358.0" y="40.0" text-anchor="middle" font-size="30">D</text>
<text class="it" x="44.0" y="356.0" text-anchor="middle" font-size="30">B</text>
<text class="it" x="358.0" y="356.0" text-anchor="middle" font-size="30">C</text>
<text class="it" x="202.0" y="246.0" text-anchor="middle" font-size="30">O</text>
<text class="it" x="92.0" y="142.0" text-anchor="middle" font-size="30">P</text>
<text class="it" x="368.0" y="261.8" text-anchor="middle" font-size="30">Q</text>
</svg>
