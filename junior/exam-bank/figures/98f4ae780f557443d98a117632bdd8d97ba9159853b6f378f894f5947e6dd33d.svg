<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 430" role="img" aria-labelledby="title desc"><title id="title">机器零件示意图、主视图与四个选项</title><desc id="desc">上方左边是零件的立体示意图：长方体底座上立着顶部为半圆的竖板，竖板上有前后贯通的圆孔，箭头指向正面；右边是主视图。下方为A至D四个平面图形：A为竖长方形，靠下一条实线，上部两条水平虚线；B与主视图同形，中间的圆为虚线；C为长方形，左右两侧各一条竖实线；D为竖长方形，靠下一条实线。</desc><style>path,circle,line,polyline,polygon,ellipse,rect{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.cjk{font-family:"Noto Sans CJK SC",sans-serif}.it{font-style:italic}.dash{stroke-dasharray:6 5}.thin{stroke-width:1}.grid{stroke-width:1;stroke-dasharray:4 3;opacity:.6}.dot{fill:currentColor;stroke:none}.solid{fill:currentColor}.shade{fill:currentColor;fill-opacity:.35}.shadenostroke{fill:currentColor;fill-opacity:.35;stroke:none}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M100.00,185.00L220.00,185.00L220.00,160.00L200.00,160.00L200.00,105.00A40,40 0 0 0 120.00,105.00L120.00,160.00L100.00,160.00Z"/><path d="M100.00,185.00L70.00,165.00L70.00,140.00L100.00,160.00"/><path d="M70.00,140.00L90.00,140.00"/><path d="M90.00,140.00L90.00,85.00"/><path d="M90.00,85.00A40,40 0 0 1 152.19,51.72"/><path d="M182.19,71.72L152.19,51.72"/><path d="M220.00,160.00L200.00,146.67"/><circle cx="160.00" cy="105.00" r="20"/><path class="thin" d="M144.00,117.00A20,20 0 0 1 172.00,89.00"/><path d="M190.00,232.00L172.00,196.00"/><path d="M169.00,206.00L172.00,196.00L180.00,202.00"/><text x="190.00" y="262.00" font-size="18" text-anchor="middle" class="cjk">正面</text><path d="M260,185L375,185L375,160L355,160L355,105A37.5,37.5 0 0 0 280,105L280,160L260,160Z"/><circle cx="317.5" cy="105" r="20"/><text x="317.50" y="222.00" font-size="18" text-anchor="middle" class="cjk">主视图</text><text x="28.00" y="366.00" font-size="20" text-anchor="middle">A．</text><text x="198.00" y="366.00" font-size="20" text-anchor="middle">B．</text><text x="368.00" y="366.00" font-size