<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 20 章 勾股定理 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j20-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 20 章 勾股定理 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j20-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j20-test", "sectionId": "j20-test", "chapterId": "j20", "title": "第 20 章 勾股定理 · 章末测验", "label": "章末测验", "sections": ["j20-1", "j20-2"], "items": [{"id": "j20-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j20-1"], "pointIds": ["pyjh.pyth.003", "pyjh.pyth.001"], "prompt": "一个直角三角形的两条直角边长分别为 $6$ 和 $8$，它的斜边长是多少？", "options": [{"id": "a", "text": "$14$", "feedback": "斜边不是两直角边之和，要用勾股定理 $c^2=a^2+b^2$。"}, {"id": "b", "text": "$10$", "feedback": "$6^2+8^2=100$，斜边是 $100$ 的算术平方根。"}, {"id": "c", "text": "$2\\sqrt7$", "feedback": "$6$ 和 $8$ 都是直角边，应把它们的平方相加，不是相减。"}, {"id": "d", "text": "$100$", "feedback": "$100$ 是斜边的平方，还要开平方。"}], "correct": "b", "answer": "$10$", "reasoning": ["由勾股定理，斜边 $c$ 满足 $c^2=6^2+8^2=100$。", "$c=10$。"], "contentVersion": "sha256:5829bb5359399ef9adc35ba79d899f85e0b107141f6be19aaaafc236492da7ba"}, {"id": "j20-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j20-1"], "pointIds": ["pyjh.pyth.001", "pyjh.pyth.003"], "prompt": "在 $\\triangle ABC$ 中，$\\angle C=90^\\circ$，$AB=13$，$BC=5$，求 $AC$ 的长。", "options": [{"id": "a", "text": "$\\sqrt{194}$", "feedback": "$\\angle C=90^\\circ$，它的对边 $AB$ 是斜边，不能把 $AB$ 当直角边。"}, {"id": "b", "text": "$8$", "feedback": "直角三角形的边长不是简单相减，要用平方关系。"}, {"id": "c", "text": "$144$", "feedback": "$144$ 是 $AC^2$，还要开平方。"}, {"id": "d", "text": "$12$", "feedback": "$AB$ 是斜边，$AC^2=AB^2-BC^2=169-25$。"}], "correct": "d", "answer": "$12$", "reasoning": ["$\\angle C=90^\\circ$，所以斜边是 $AB$，$AC$、$BC$ 是直角边。", "$AC^2=AB^2-BC^2=169-25=144$，$AC=12$。"], "contentVersion": "sha256:c2fe4eb997125208fb8b4517450308bc0b4a268320f9bb682a1253930b5ba8a4"}, {"id": "j20-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j20-2"], "pointIds": ["pyjh.pyth.010", "pyjh.pyth.009"], "prompt": "以下列各组数为三角形的三边长，能构成直角三角形的是哪一组？", "options": [{"id": "a", "text": "$2,\\ 3,\\ 4$", "feedback": "$2^2+3^2=13$，不等于 $4^2=16$。"}, {"id": "b", "text": "$4,\\ 6,\\ 8$", "feedback": "$4^2+6^2=52$，不等于 $8^2=64$。"}, {"id": "c", "text": "$1.5,\\ 2,\\ 2.5$", "feedback": "$1.5^2+2^2=6.25=2.5^2$，由勾股定理的逆定理可知是直角三角形。"}, {"id": "d", "text": "$5,\\ 11,\\ 12$", "feedback": "$5^2+11^2=146$，不等于 $12^2=144$。"}], "correct": "c", "answer": "$1.5,\\ 2,\\ 2.5$", "reasoning": ["勾股定理的逆定理：较短两边的平方和等于最长边的平方，这个三角形是直角三角形。", "只有 $1.5^2+2^2=2.25+4=6.25=2.5^2$ 成立。"], "contentVersion": "sha256:8a2fa61e356688d29507c137defd5d4228ce9110eb3f6f320a7f2c497fa70640"}, {"id": "j20-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j20-2"], "pointIds": ["pyjh.pyth.012"], "prompt": "下列各组数中，哪一组是勾股数？", "options": [{"id": "a", "text": "$0.3,\\ 0.4,\\ 0.5$", "feedback": "这组数满足平方关系，但勾股数必须是正整数。"}, {"id": "b", "text": "$8,\\ 15,\\ 17$", "feedback": "都是正整数，且 $8^2+15^2=289=17^2$。"}, {"id": "c", "text": "$5,\\ 6,\\ 7$", "feedback": "$5^2+6^2=61$，不等于 $7^2=49$。"}, {"id": "d", "text": "$1,\\ \\sqrt3,\\ 2$", "feedback": "这组数满足平方关系，但 $\\sqrt3$ 不是正整数。"}], "correct": "b", "answer": "$8,\\ 15,\\ 17$", "reasoning": ["能成为直角三角形三条边长的三个正整数叫勾股数。", "$8^2+15^2=64+225=289=17^2$，且三个数都是正整数。"], "contentVersion": "sha256:0b7c193083d51c5426806d053a3e7e737e5e39ebec26d7fe2e60d390e1c393c3"}, {"id": "j20-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j20-1"], "pointIds": ["pyjh.pyth.004", "pyjh.sym.011"], "prompt": "等腰三角形的腰长为 $5$，底边长为 $6$，它的面积是多少？", "options": [{"id": "a", "text": "$24$", "feedback": "三角形面积是底乘高再除以 $2$。"}, {"id": "b", "text": "$15$", "feedback": "腰不是底边上的高，要先求出高。"}, {"id": "c", "text": "$3\\sqrt{34}$", "feedback": "腰是直角三角形的斜边，高的平方应是 $5^2-3^2$。"}, {"id": "d", "text": "$12$", "feedback": "底边上的高平分底边，高 $=\\sqrt{5^2-3^2}=4$。"}], "correct": "d", "answer": "$12$", "reasoning": ["作底边上的高，由三线合一，高平分底边，得到直角边 $3$、斜边 $5$ 的直角三角形。", "高 $=\\sqrt{5^2-3^2}=4$。", "面积 $=\\frac12\\times6\\times4=12$。"], "contentVersion": "sha256:0a8301d973754f838b9f9af275c6745a91bc931462d30482d45b2c24936d66d6"}, {"id": "j20-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j20-1"], "pointIds": ["pyjh.pyth.003"], "prompt": "一个直角三角形的两边长分别为 $3$ 和 $4$，第三边的长是多少？", "options": [{"id": "a", "text": "$5$", "feedback": "没说 $4$ 是直角边，$4$ 也可能是斜边。"}, {"id": "b", "text": "$\\sqrt7$", "feedback": "$4$ 也可能是直角边，这时第三边是斜边。"}, {"id": "c", "text": "$5$ 或 $\\sqrt7$", "feedback": "分「$4$ 是直角边」和「$4$ 是斜边」两种情况。"}, {"id": "d", "text": "$5$ 或 $7$", "feedback": "$4^2-3^2=7$ 是第三边的平方，还要开平方。"}], "correct": "c", "answer": "$5$ 或 $\\sqrt7$", "reasoning": ["若 $3$、$4$ 都是直角边，第三边 $=\\sqrt{3^2+4^2}=5$。", "若 $4$ 是斜边，第三边 $=\\sqrt{4^2-3^2}=\\sqrt7$。", "所以第三边长为 $5$ 或 $\\sqrt7$。"], "contentVersion": "sha256:ccdeecdaf7ddee1c865876cdc8c66388031311c59df7b1a9d6377f08b1584096"}, {"id": "j20-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j20-1"], "pointIds": ["pyjh.pyth.006", "pyjh.pyth.003"], "prompt": "一根竖直的竹子高 $9\\ \\text{m}$，从某处折断后，竹梢落在地面上，离竹子底部 $3\\ \\text{m}$（折断处未完全断开，竹子下段仍竖直）。折断处离地面多高？", "options": [{"id": "a", "text": "$5\\ \\text{m}$", "feedback": "这是折下来那一段的长，题目问的是折断处离地面的高度。"}, {"id": "b", "text": "$3\\ \\text{m}$", "feedback": "$3\\ \\text{m}$ 是竹梢到底部的距离，不是高度。"}, {"id": "c", "text": "$4\\ \\text{m}$", "feedback": "设折断处高 $x$，折下部分长 $9-x$ 是斜边，列方程求解。"}, {"id": "d", "text": "$3\\sqrt{10}\\ \\text{m}$", "feedback": "$9\\ \\text{m}$ 是竹子原长，不是直角边。"}], "correct": "c", "answer": "$4\\ \\text{m}$", "reasoning": ["设折断处离地面 $x\\ \\text{m}$，折下部分长 $(9-x)\\ \\text{m}$，它是直角三角形的斜边。", "$x^2+3^2=(9-x)^2$，即 $x^2+9=81-18x+x^2$，得 $18x=72$，$x=4$。"], "contentVersion": "sha256:5246f1d4a087d560625e87a996acf02f3710ec927015e43e0233b71e884e8652"}, {"id": "j20-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j20-2"], "pointIds": ["pyjh.pyth.010"], "prompt": "在 $\\triangle ABC$ 中，$AB=17$，$BC=8$，$AC=15$。下列判断正确的是哪一项？", "options": [{"id": "a", "text": "$\\angle A=90^\\circ$", "feedback": "$\\angle A$ 的对边是 $BC$，它不是最长边。"}, {"id": "b", "text": "$\\angle B=90^\\circ$", "feedback": "$\\angle B$ 的对边是 $AC$，它不是最长边。"}, {"id": "c", "text": "$\\angle C=90^\\circ$", "feedback": "$BC^2+AC^2=AB^2$，直角是最长边 $AB$ 所对的角。"}, {"id": "d", "text": "不是直角三角形", "feedback": "按较短两边的平方和与最长边的平方比较一下。"}], "correct": "c", "answer": "$\\angle C=90^\\circ$", "reasoning": ["$8^2+15^2=64+225=289=17^2$，即 $BC^2+AC^2=AB^2$。", "由勾股定理的逆定理，最长边 $AB$ 所对的角是直角，即 $\\angle C=90^\\circ$。"], "contentVersion": "sha256:645cb755d20d0a2e03536a61dba90b30eabedd2f101bb3a6ba28d642d587de17"}, {"id": "j20-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j20-1"], "pointIds": ["pyjh.pyth.005"], "prompt": "在平面直角坐标系中，点 $A(-2,1)$、$B(4,9)$，线段 $AB$ 的长是多少？", "options": [{"id": "a", "text": "$14$", "feedback": "两点间的距离不是横、纵方向距离之和，要用勾股定理。"}, {"id": "b", "text": "$2\\sqrt{17}$", "feedback": "横坐标之差是 $4-(-2)=6$，不是 $4-2$。"}, {"id": "c", "text": "$10$", "feedback": "构造直角三角形，两直角边分别为横坐标之差 $6$、纵坐标之差 $8$。"}, {"id": "d", "text": "$100$", "feedback": "$100$ 是 $AB^2$，还要开平方。"}], "correct": "c", "answer": "$10$", "reasoning": ["过 $A$ 作水平线、过 $B$ 作竖直线，构成直角三角形，两直角边长为 $4-(-2)=6$、$9-1=8$。", "$AB=\\sqrt{6^2+8^2}=10$。"], "contentVersion": "sha256:435470d8ce79c1a9d66529c8480bfd7ad402cc577ac030c187374bf5cf05382b"}, {"id": "j20-test-10-v2", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j20-1", "j20-2"], "pointIds": ["pyjh.pyth.013", "pyjh.pyth.010", "pyjh.pyth.003"], "prompt": "凸四边形 $ABCD$ 中，$\\angle B=90^\\circ$，$AB=3$，$BC=4$，$CD=12$，$AD=13$。连接 $AC$，四边形 $ABCD$ 的面积是多少？", "options": [{"id": "a", "text": "$36$", "feedback": "先求 $AC=5$，再用逆定理判断 $\\angle ACD=90^\\circ$，两个直角三角形面积相加。"}, {"id": "b", "text": "$66$", "feedback": "$\\triangle ACD$ 的面积是 $\\frac12\\times5\\times12$，别漏掉 $\\frac12$。"}, {"id": "c", "text": "$84$", "feedback": "$\\triangle ACD$ 的直角在 $C$，两条直角边是 $AC$ 与 $CD$，不是 $CD$ 与 $AD$。"}, {"id": "d", "text": "$30$", "feedback": "这只是 $\\triangle ACD$ 的面积，还要加上 $\\triangle ABC$ 的面积。"}], "correct": "a", "answer": "$36$", "reasoning": ["在 $\\mathrm{Rt}\\triangle ABC$ 中，$AC=\\sqrt{3^2+4^2}=5$。", "$AC^2+CD^2=25+144=169=AD^2$，由逆定理，$\\angle ACD=90^\\circ$。", "凸四边形的对角线 $AC$ 把它分成内部不重叠的两个三角形，面积相加：$\\frac12\\times3\\times4+\\frac12\\times5\\times12=6+30=36$。"], "contentVersion": "sha256:554c32b35c424ae437419c7dbb500408a357d2872ef4d9e592f3786ff783e34f"}, {"id": "j20-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j20-1"], "pointIds": ["pyjh.pyth.006", "pyjh.pyth.003", "pyjh.sym.002"], "prompt": "在 $\\triangle ABC$ 中，$\\angle C=90^\\circ$，$AC=6$，$BC=8$。将 $\\triangle ABC$ 折叠，使点 $A$ 与点 $B$ 重合，折痕与边 $BC$ 交于点 $D$。$CD$ 的长是多少？", "options": [{"id": "a", "text": "$\\frac{25}4$", "feedback": "这是 $BD$（也等于 $AD$）的长，题目问的是 $CD$。"}, {"id": "b", "text": "$4$", "feedback": "折痕不经过 $BC$ 的中点；$D$ 满足的是 $AD=BD$。"}, {"id": "c", "text": "$5$", "feedback": "$5$ 是斜边 $AB$ 的一半，与 $CD$ 无关。"}, {"id": "d", "text": "$\\frac74$", "feedback": "设 $CD=x$，由 $AD=BD=8-x$，在 $\\mathrm{Rt}\\triangle ACD$ 中列方程。"}], "correct": "d", "answer": "$\\frac74$", "reasoning": ["折叠后 $A$、$B$ 重合，折痕是 $AB$ 的垂直平分线，所以 $AD=BD$。", "设 $CD=x$，则 $AD=BD=8-x$。在 $\\mathrm{Rt}\\triangle ACD$ 中，$6^2+x^2=(8-x)^2$。", "$36+x^2=64-16x+x^2$，$16x=28$，$x=\\frac74$。"], "contentVersion": "sha256:0bbfd7ed8659497cd4eb1aab2512f40ceb1008f457bfa7930e41d905be8ef91b"}, {"id": "j20-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j20-2"], "pointIds": ["pyjh.pyth.013", "pyjh.pyth.010"], "prompt": "甲、乙两船同时从港口出发，甲船以每小时 $16$ 海里的速度向正北方向航行，乙船以每小时 $12$ 海里的速度沿某一方向航行。$1.5$ 小时后，两船相距 $30$ 海里，且乙船在港口的东侧。乙船的航行方向是哪一项？", "options": [{"id": "a", "text": "正东方向", "feedback": "甲行 $24$ 海里、乙行 $18$ 海里，$24^2+18^2=30^2$，两船航线互相垂直。"}, {"id": "b", "text": "东北方向", "feedback": "东北方向与正北方向的夹角是 $45^\\circ$，三边不会满足 $24^2+18^2=30^2$。"}, {"id": "c", "text": "东南方向", "feedback": "东南方向与正北方向的夹角是 $135^\\circ$，不是直角。"}, {"id": "d", "text": "无法确定", "feedback": "三边长都能算出，可以用勾股定理的逆定理判断夹角。"}], "correct": "a", "answer": "正东方向", "reasoning": ["$1.5$ 小时后，甲船行 $16\\times1.5=24$ 海里，乙船行 $12\\times1.5=18$ 海里。", "$24^2+18^2=576+324=900=30^2$，由逆定理，两条航线的夹角是 $90^\\circ$。", "甲向正北，乙在港口东侧，所以乙船向正东方向航行。"], "contentVersion": "sha256:fe1bcfddf2e2488d1daee67478ebeb9a99285b058d6e23c1f6964f0d8d52f238"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
