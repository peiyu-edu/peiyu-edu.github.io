<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" role="img" aria-labelledby="title desc"><title id="title">平行线a、b被直线c所截</title><desc id="desc">水平直线a在上、b在下，直线c向右上方倾斜；∠1在c与b交点处b上方c右侧，∠2在c与a交点处a下方c左侧。</desc><style>svg{color:#243d45;background:#fff;--fill:#d5dfdf;--fill2:#a9bcbc;--bg:#fff}path,circle,ellipse,line,polyline,polygon,rect{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}text{fill:currentColor;stroke:none;font-family:Georgia,'Noto Serif CJK SC',serif}.f{fill:var(--fill)}.f2{fill:var(--fill2)}.dot{fill:currentColor}.bg{fill:var(--bg)}.thin{stroke-width:1.4}.dash{stroke-dasharray:6 5}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--fill:#405b62;--fill2:#2b4149;--bg:#15272d}}</style><path d="M30.00,70.00L300.00,70.00"/><path d="M30.00,170.00L300.00,170.00"/><path d="M75.46,235.00L255.86,20.00"/><text x="318.00" y="77.00" text-anchor="middle" font-size="22" font-style="italic">a</text><text x="318.00" y="177.00" text-anchor="middle" font-size="22" font-style="italic">b</text><text x="271.86" y="30.00" text-anchor="middle" font-size="22" font-style="italic">c</text><path d="M150.00,170.00A20,20 0 0 0 142.86,154.68" class="thin"/><path d="M193.91,70.00A20,20 0 0 0 201.05,85.32" class="thin"/><text x="167.09" y="162.02" text-anchor="middle" font-size="20">1</text><text x="177.66" y="93.90" text-anchor="middle" font-size="20">2</text></svg>