<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 195" role="img" aria-labelledby="title desc"><title id="title">矩形ABCD中的翻折</title><desc id="desc">矩形ABCD，A在左上，D在右上，B在左下，C在右下。E在AB上，F在BC上，三角形BEF沿EF翻折得到三角形B′EF，原来的EB、BF画成虚线；连接AB′，G在AB′上，连接DG。</desc><style>path,circle,line,polyline,polygon,ellipse{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.cjk{font-family:"Noto Sans CJK SC",sans-serif}.dash{stroke-dasharray:6 5}.thin{stroke-width:1}.grid{stroke-width:1;stroke-dasharray:3 3;opacity:.55}.dot{fill:currentColor;stroke:none}.bar{fill:currentColor;fill-opacity:.35}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M40.00,34.00L208.00,34.00"/><path d="M208.00,34.00L208.00,160.00"/><path d="M208.00,160.00L84.80,160.00"/><path d="M40.00,34.00L40.00,118.00"/><path class="dash" d="M40.00,118.00L40.00,160.00"/><path class="dash" d="M40.00,160.00L84.80,160.00"/><path d="M40.00,118.00L81.91,115.29"/><path d="M81.91,115.29L84.80,160.00"/><path d="M40.00,118.00L84.80,160.00"/><path d="M40.00,34.00L81.91,115.29"/><path d="M67.94,88.20L208.00,34.00"/><text x="28.00" y="36.00" text-anchor="middle" font-size="20" font-style="italic">A</text><text x="222.00" y="36.00" text-anchor="middle" font-size="20" font-style="italic">D</text><text x="34.00" y="182.00" text-anchor="middle" font-size="20" font-style="italic">B</text><text x="86.80" y="182.00" text-anchor="middle" font-size="20" font-style="italic">F</text><text x="208.00" y="182.00" text-anchor="middle" font-size="20" font-style="italic">C</text><text x="26.00" y="126.00" text-anchor="middle" font-size="20" font-style="italic">E</text><text x="51.94" y="90.20" text-anchor="middle" font-size="20" font-style="italic">G</text><text x="97.91" y="117.29" text-anchor="middle" font-size="20" font-style="italic">B′</text></svg>
