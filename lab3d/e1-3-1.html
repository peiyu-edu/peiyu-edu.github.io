    <div class="l3-card" id="info">
      <div class="l3-tabs">

        <button type="button" data-tab="quiz">练一练</button>

        <ol class="l3-steps">
          <li>上方选两个实验：平面截圆锥、丹德林双球。</li>
          <li>「平面截圆锥」里拖截面倾角 β：放平时截口是圆，越斜椭圆越扁；a、b、c、e 都从截口实量。</li>
          <li>「丹德林双球」里拖点 P 绕椭圆走：PF₁ 与 PQ₁、PF₂ 与 PQ₂ 两两相等，和始终等于两切圆之间的母线长。</li>
          <li>按住拖动可以转动模型，滚轮缩放；所有长度随时重算。</li>
        </ol>
      </div>
