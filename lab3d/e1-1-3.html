        <ol class="l3-steps">
          <li>上方选三个实验：点的坐标与对称、两点间距离、坐标判垂直。</li>
          <li>「点的坐标与对称」里拖 x、y、z，换七种对称方式：关于谁对称，谁不变，其余坐标变号。</li>
          <li>「两点间距离」沿 x、y、z 三个方向各走一段虚线，距离就是两次勾股定理。</li>
          <li>「坐标判垂直」拖 E 的位置 t：数量积 2t − 2 为 0 时两向量垂直。</li>
          <li>按住拖动可以转动模型，坐标、距离和角度随时重算；被挡住的线画成虚线。</li>
        </ol>
      </div>
