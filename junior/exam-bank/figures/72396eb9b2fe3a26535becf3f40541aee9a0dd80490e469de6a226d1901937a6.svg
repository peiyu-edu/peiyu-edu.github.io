<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">条形统计图和扇形统计图</title><desc id="desc">左图是条形统计图：纵轴“人数”刻度从0到24、每格3，横轴“活动项目”依次为舞蹈、篮球、书法、AI知识学习；舞蹈的条形高12，书法的条形高6，AI知识学习的条形高24，篮球处只有条形底部的两个短刻线，条形空缺；12、6、24处各有虚线连到纵轴。右图是扇形统计图：分为书法、舞蹈、篮球、AI知识学习四个扇形，只在舞蹈扇形中标注20%。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:7 5}.dot{fill:currentColor;stroke:none}.s{fill:currentColor;fill-opacity:.3;stroke:none}.ss{fill:currentColor;fill-opacity:.3}.b{fill:#fff}.bl{stroke:#fff}.t{stroke-width:9}text{fill:currentColor;stroke:none;font-family:'Times New Roman',Times,'Songti SC','Noto Serif CJK SC',serif;font-size:24px}.bar1{stroke-width:16;stroke-linecap:butt}.bar2{stroke:#fff;stroke-width:12}.i{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.b{fill:#15272d}.bl{stroke:#15272d}.bar2{stroke:#15272d}}</style><path d="M78,350L78,42"/><path class="dot" d="M78,42L82.08,52.22L73.92,52.22Z"/><path d="M78,350L470,350"/><path class="dot" d="M470,350L459.78,354.08L459.78,345.92Z"/><path d="M78,350L85,350"/><text x="68" y="358" text-anchor="end">0</text><path d="M78,317L85,317"/><text x="68" y="325" text-anchor="end">3</text><path d="M78,284L85,284"/><text x="68" y="292" text-anchor="end">6</text><path d="M78,251L85,251"/><text x="68" y="259" text-anchor="end">9</text><path d="M78,218L85,218"/><text x="68" y="226" text-anchor="end">12</text><path d="M78,185L85,185"/><text x="68" y="193" text-anchor="end">15</text><path d="M78,152L85,152"/><text x="68" y="160" text-anchor="end">18</text><path d="M78,119L85,119"/><text x="68" y="127" text-anchor="end">21</text><path d="M78,86L85,86"/><text x="68" y="94" text-anchor="end">24</text><text x="90" y="64" text-anchor="start">人数</text><path d="M106,350L106,218L140,218L140,350" class="ss"/><path d="M106,350L106,218L140,218L140,350"/><text x="123" y="211" text-anchor="middle">12</text><path d="M78,218L106,218" class="d"/><path d="M258,350L258,284L292,284L292,350" class="ss"/><path d="M258,350L258,284L292,284L292,350"/><text x="275" y="277" text-anchor="middle">6</text><path d="M78,284L258,284" class="d"/><path d="M348,350L348,86L382,86L382,350" class="ss"/><path d="M348,350L348,86L382,86L382,350"/><text x="365" y="79" text-anchor="middle">24</text><path d="M78,86L348,86" class="d"/><path d="M184,350L184,340"/><path d="M217,350L217,340"/><text x="123" y="380" text-anchor="middle">舞蹈</text><text x="200" y="380" text-anchor="middle">篮球</text><text x="275" y="380" text-anchor="middle">书法</text><text x="365" y="380" text-anchor="middle">AI知识</text><text x="365" y="410" text-anchor="middle">学习</text><text x="478" y="380" text-anchor="start">活动项目</text><circle cx="780" cy="190" r="155"/><path d="M780,190L780,35"/><path d="M780,190L889.6,80.4"/><path d="M780,190L925.65,243.01"/><path d="M780,190L670.4,299.6"/><text x="815" y="100" text-anchor="middle">书法</text><text x="868" y="172" text-anchor="middle">舞蹈</text><text x="868" y="204" text-anchor="middle">20%</text><text x="790" y="285" text-anchor="middle">篮球</text><text x="700" y="136" text-anchor="middle">AI知识</text><text x="700" y="168" text-anchor="middle">学习</text></svg>
