$-\\frac35x^2y$ 的系数和次数分别是多少？", "options": [{"id": "a", "text": "系数 $\\frac35$，次数 $3$", "feedback": "系数包括前面的符号。"}, {"id": "b", "text": "系数 $-\\frac35$，次数 $3$", "feedback": "系数是数字因数（含符号），次数是所有字母的指数和。"}, {"id": "c", "text": "系数 $-\\frac35$，次数 $2$", "feedback": "次数要把所有字母的指数相加，$y$ 的指数是 $1$。"}, {"id": "d", "text": "系数 $-3$，次数 $3$", "feedback": "数字因数是 $-\\frac35$ 整体，分母 $5$ 也属于系数。"}], "correct": "b", "answer": "系数 $-\\frac35$，次数 $3$", "reasoning": ["单项式中的数字因数叫系数，这里是 $-\\frac35$。", "所有字母的指数和叫次数：$x$ 的指数 $2$，$y$ 的指数 $1$，次数为 $2+1=3$。"], "contentVersion": "sha256:f9d1fdfbdf42a0fe2a43e70a5dc1ba429bf8d549c2b6d31b9e434b6b743fcf22"}, {"id": "j4-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j4-1"], "pointIds": ["pyjh.alg.012"], "prompt": "多项式 $3x^2-2xy^3+5$ 是几次几项式？", "options": [{"id": "a", "text": "三次三项式", "feedback": "多项式的次数看次数最高的项，$-2xy^3$ 的次数不是 $3$。"}, {"id": "b", "text": "四次三项式", "feedback": "次数最高的项 $-2xy^3$ 的次数是 $1+3=4$，共有三项。"}, {"id": "c", "text": "二次三项式", "feedback": "$3x^2$ 不是次数最高的项。"}, {"id": "d", "text": "四次二项式", "feedback": "常数项 $5$ 也是一项。"}], "correct": "b", "answer": "四次三项式", "reasoning": ["多项式的项是 $3x^2$，$-2xy^3$，$5$，共三项。", "各项次数分别为 $2$，$4$，$0$，最高为 $4$，所以是四次三项式。"], "contentVersion": "sha256:6e8e1ea8ca8e4e0a607b3928bf28b2abc97a75c8fe770f5102d758c5dde8aab7"}, {"id": "j4-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j4-2"], "pointIds": ["pyjh.alg.014"], "prompt": "下列各组中，两个单项式是同类项的是哪一组？", "options": [{"id": "a", "text": "$3x^2y$ 与 $3xy^2$", "feedback": "相同字母的指数不同：$x$ 的指数一个是 $2$、一个是 $1$。"}, {"id": "b", "text": "$4ab$ 与 $4abc$", "feedback": "所含字母不同，后者多了 $c$。"}, {"id": "c", "text": "$2a^2b$ 与 $-a^2b$", "feedback": "所含字母相同，相同字母的指数也相同；与系数无关。"}, {"id": "d", "text": "$5m$ 与 $5n$", "feedback": "所含字母不同。"}], "correct": "c", "answer": "$2a^2b$ 与 $-a^2b$", "reasoning": ["同类项：所含字母相同，并且相同字母的指数也相同，与系数无关。", "只有 $2a^2b$ 与 $-a^2b$ 满足这两条。"], "contentVersion": "sha256:3cbc9d18afdd5774f9d2ff3cf0615f37805469e195c313d2b7ac8c493abb73d1"}, {"id": "j4-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j4-2"], "pointIds": ["pyjh.alg.015"], "prompt": "合并同类项：$3a^2b-5a^2b+a^2b$ 的结果是什么？", "options": [{"id": "a", "text": "$-a^2b$", "feedback": "系数相加，字母和字母的指数不变。"}, {"id": "b", "text": "$9a^2b$", "feedback": "系数要带着符号相加，$-5$ 不能当成 $5$。"}, {"id": "c", "text": "$-a^6b^3$", "feedback": "合并同类项时字母的指数不变，不相加。"}, {"id": "d", "text": "$-1$", "feedback": "合并后字母部分保留，不会消掉。"}], "correct": "a", "answer": "$-a^2b$", "reasoning": ["系数相加：$3-5+1=-1$。", "字母部分 $a^2b$ 不变，结果是 $-a^2b$。"], "contentVersion": "sha256:685e6ddf0de9a01f927ffb430cf8ab37480ee08865b139ee7bde7b12f40d44f7"}, {"id": "j4-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j4-2"], "pointIds": ["pyjh.alg.016"], "prompt": "去括号：$-(2x-3y+1)$ 等于什么？", "options": [{"id": "a", "text": "$-2x-3y+1$", "feedback": "括号前是负号，括号里每一项都要变号，不只是第一项。"}, {"id": "b", "text": "$-2x+3y-1$", "feedback": "括号前是负号，去括号后括号里各项都改变符号。"}, {"id": "c", "text": "$-2x+3y+1$", "feedback": "最后一项 $+1$ 也要变号。"}, {"id": "d", "text": "$2x-3y+1$", "feedback": "去掉负号和括号时，各项都要改变符号。"}], "correct": "b", "answer": "$-2x+3y-1$", "reasoning": ["括号前是「$-$」，去括号时括号里的每一项都改变符号。", "$2x\\to-2x$，$-3y\\to+3y$，$+1\\to-1$，得 $-2x+3y-1$。"], "contentVersion": "sha256:b9b43de6330479b09e9432793a062e962a9cd498348f0a6e752e44e4ffa21268"}, {"id": "j4-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j4-2"], "pointIds": ["pyjh.alg.017", "pyjh.alg.016", "pyjh.alg.015"], "prompt": "计算 $(3x^2-2x+1)-(x^2-4x-3)$。", "options": [{"id": "a", "text": "$2x^2-6x-2$", "feedback": "减去括号时括号里的各项都要变号，$-4x$ 和 $-3$ 都要变。"}, {"id": "b", "text": "$2x^2+2x+4$", "feedback": "先去括号，再合并同类项。"}, {"id": "c", "text": "$2x^2+2x-2$", "feedback": "$-3$ 前面是减号，去括号后变成 $+3$。"}, {"id": "d", "text": "$4x^2-6x-2$", "feedback": "这是把两个多项式相加了。"}], "correct": "b", "answer": "$2x^2+2x+4$", "reasoning": ["去括号：$3x^2-2x+1-x^2+4x+3$。", "合并同类项：$(3-1)x^2+(-2+4)x+(1+3)=2x^2+2x+4$。"], "contentVersion": "sha256:98ab5f92a308dfa805193fd181744dc2f9857838f55a4445fee155f28da8bb13"}, {"id": "j4-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j4-2"], "pointIds": ["pyjh.alg.018", "pyjh.alg.017"], "prompt": "先化简，再求值：$2(a^2b+ab^2)-2(a^2b-1)-3ab^2-2$，其中 $a=-2$，$b=2$。", "options": [{"id": "a", "text": "$8$", "feedback": "先化简得 $-ab^2$，再代入。"}, {"id": "b", "text": "$-8$", "feedback": "代入 $a=-2$ 时，$-ab^2$ 前面的负号和 $a$ 的负号要一起算。"}, {"id": "c", "text": "$16$", "feedback": "化简时 $2ab^2-3ab^2=-ab^2$，系数是 $-1$。"}, {"id": "d", "text": "$0$", "feedback": "常数项 $+2$ 与 $-2$ 抵消了，但 $ab^2$ 项没有抵消。"}], "correct": "a", "answer": "$8$", "reasoning": ["去括号：$2a^2b+2ab^2-2a^2b+2-3ab^2-2$。", "合并同类项：$-ab^2$。", "代入：$-(-2)\\times2^2=8$。"], "contentVersion": "sha256:e1e95c464da4a16909858404d8f16d8c3b0d768788b9a2eccca5e8911dbdd43b"}, {"id": "j4-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j4-1", "j4-2"], "pointIds": ["pyjh.alg.014", "pyjh.alg.011"], "prompt": "若 $3x^my^3$ 与 $-2x^2y^n$ 是同类项，则 $m+n$ 等于多少？", "options": [{"id": "a", "text": "$5$", "feedback": "同类项中相同字母的指数相同。"}, {"id": "b", "text": "$6$", "feedback": "$m$ 要和 $x$ 的指数 $2$ 对应，不是 $3$。"}, {"id": "c", "text": "$4$", "feedback": "$n$ 要和 $y$ 的指数 $3$ 对应。"}, {"id": "d", "text": "$1$", "feedback": "要求的是 $m+n$，不是 $3$ 与 $2$ 的差。"}], "correct": "a", "answer": "$5$", "reasoning": ["同类项中相同字母的指数相同：$x$ 的指数 $m=2$，$y$ 的指数 $n=3$。", "$m+n=2+3=5$。"], "contentVersion": "sha256:eba63a37c56b402c589747a57716c4de3ebc7502b7269a04395a760996f3049f"}, {"id": "j4-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j4-2"], "pointIds": ["pyjh.alg.017", "pyjh.alg.016"], "prompt": "一个多项式加上 $2x^2-x+3$ 得 $x^2+2x-1$，这个多项式是什么？", "options": [{"id": "a", "text": "$3x^2+x+2$", "feedback": "所求多项式应等于和减去已知加数，不是两者相加。"}, {"id": "b", "text": "$-x^2+3x-4$", "feedback": "用 $x^2+2x-1$ 减去 $2x^2-x+3$。"}, {"id": "c", "text": "$-x^2+x+2$", "feedback": "减去括号时，$-x$ 和 $+3$ 也要变号。"}, {"id": "d", "text": "$x^2-3x+4$", "feedback": "减法的顺序弄反了。"}], "correct": "b", "answer": "$-x^2+3x-4$", "reasoning": ["所求多项式 $=(x^2+2x-1)-(2x^2-x+3)$。", "$=x^2+2x-1-2x^2+x-3=-x^2+3x-4$。"], "contentVersion": "sha256:3576d55e49522801eca462e73cafad6a984768e302185dae9376c11f8dff4f94"}, {"id": "j4-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j4-2"], "pointIds": ["pyjh.alg.018", "pyjh.alg.017", "pyjh.alg.015"], "prompt": "若式子 $(2x^2+ax-y+6)-(2bx^2-3x+5y-1)$ 的值与 $x$ 的取值无关，则 $a$，$b$ 的值分别是多少？", "options": [{"id": "a", "text": "$a=-3$，$b=1$", "feedback": "化简后令含 $x$ 的各项系数都为 $0$。"}, {"id": "b", "text": "$a=3$，$b=1$", "feedback": "$x$ 项系数是 $a+3$，令它为 $0$ 得到的 $a$ 是负数。"}, {"id": "c", "text": "$a=-3$，$b=-1$", "feedback": "$x^2$ 项系数是 $2-2b$，令它为 $0$。"}, {"id": "d", "text": "$a=3$，$b=-1$", "feedback": "两个系数都要为 $0$，再检查符号。"}], "correct": "a", "answer": "$a=-3$，$b=1$", "reasoning": ["化简：$2x^2+ax-y+6-2bx^2+3x-5y+1=(2-2b)x^2+(a+3)x-6y+7$。", "值与 $x$ 无关，则 $2-2b=0$，$a+3=0$，所以 $b=1$，$a=-3$。"], "contentVersion": "sha256:6395209ae35ebf53036f0fea52a2025bc109f6c8dee55a58341f7458ba9c168b"}, {"id": "j4-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j4-1", "j4-2"], "pointIds": ["pyjh.alg.019", "pyjh.alg.013", "pyjh.alg.017"], "prompt": "一个长方形的长是 $(3a+2b)$ 厘米，宽比长少 $(a-b)$ 厘米。这个长方形的周长是多少厘米？", "options": [{"id": "a", "text": "$(10a+10b)$ 厘米", "feedback": "先求宽 $(3a+2b)-(a-b)$，再求周长。"}, {"id": "b", "text": "$(10a+6b)$ 厘米", "feedback": "求宽时 $-(a-b)$ 去括号要变成 $-a+b$。"}, {"id": "c", "text": "$(5a+5b)$ 厘米", "feedback": "这是长与宽的和，周长还要乘 $2$。"}, {"id": "d", "text": "$(12a+8b)$ 厘米", "feedback": "宽比长少，不能把宽也当成 $3a+2b$。"}], "correct": "a", "answer": "$(10a+10b)$ 厘米", "reasoning": ["宽：$(3a+2b)-(a-b)=3a+2b-a+b=2a+3b$（厘米）。", "周长：$2[(3a+2b)+(2a+3b)]=2(5a+5b)=10a+10b$（厘米）。"], "contentVersion": "sha256:7046966ab71a744c92802d55c365845461812d41bd2639c09dab76e2e9f95074"}, {"id": "j4-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j4-2"], "pointIds": ["pyjh.alg.019", "pyjh.alg.003", "pyjh.alg.017"], "prompt": "一个两位数，十位数字是 $a$，个位数字是 $b$。交换它的十位数字与个位数字，得到一个新的两位数。原数减去新数的差化简后是哪一项？", "options": [{"id": "a", "text": "$9(b-a)$", "feedback": "减法的顺序是原数减新数，原数是 $10a+b$。"}, {"id": "b", "text": "$11(a+b)$", "feedback": "这是原数与新数的和。"}, {"id": "c", "text": "$9a-b$", "feedback": "两位数要用 $10\\times$十位数字 $+$ 个位数字表示，不能写成 $ab$ 或 $ba$。"}, {"id": "d", "text": "$9(a-b)$", "feedback": "原数 $10a+b$，新数 $10b+a$，相减后合并同类项。"}], "correct": "d", "answer": "$9(a-b)$", "reasoning": ["原数是 $10a+b$，新数是 $10b+a$。", "差：$(10a+b)-(10b+a)=9a-9b=9(a-b)$，所以差一定是 $9$ 的倍数。"], "contentVersion": "sha256:e5106c36107eb7c5f3d83e306e8ba7e48b7e92a11480c298b567c5c639972be9"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
