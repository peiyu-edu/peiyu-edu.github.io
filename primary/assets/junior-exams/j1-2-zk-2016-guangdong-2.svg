<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" role="img" aria-labelledby="title desc">
<title id="title">数轴上的 a 与 b</title>
<desc id="desc">题 2 图：向右为正方向的数轴（x 轴）。点 a 在原点 0 的左侧，点 b 在原点的右侧，b 到原点的距离比 a 到原点的距离略远。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="600" height="150" fill="white"/>
<line x1="20.0" y1="30.0" x2="585.0" y2="30.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="585.0,30.0 569.0,37.0 569.0,23.0" fill="#17202a"/>
<line x1="175.0" y1="30.0" x2="175.0" y2="18.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="290.0" y1="30.0" x2="290.0" y2="18.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="460.0" y1="30.0" x2="460.0" y2="18.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="175.0" y="66.0" class="l" text-anchor="middle">a</text>
<text x="290.0" y="66.0" class="n" text-anchor="middle">0</text>
<text x="460.0" y="66.0" class="l" text-anchor="middle">b</text>
<text x="572.0" y="66.0" class="l" text-anchor="middle">x</text>
<text x="300.0" y="135.0" class="c" text-anchor="middle">题 2 图</text>
</svg>
