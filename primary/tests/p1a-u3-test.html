<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级上册 第三单元 认识立体图形 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p1a-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级上册 第三单元 认识立体图形 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1a-u3-test", "sectionId": "p1a-u3-test", "unitId": "p1a-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级上册 第三单元 认识立体图形 单元测评", "items": [{"id": "p1a-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "篮球的形状像哪种图形？", "answer": "球", "reasoning": ["篮球圆圆的，没有平平的面。", "它的形状像球。"], "options": [{"id": "a", "text": "圆柱", "feedback": "圆柱上下有两个平平的面，篮球没有平平的面。"}, {"id": "b", "text": "球", "feedback": "对。篮球圆圆的，哪里都是弯弯的。"}, {"id": "c", "text": "正方体", "feedback": "正方体的面都是平平的，篮球是圆圆的。"}], "correct": "b", "pointIds": ["pyps.p1a.u3.001"], "contentVersion": "sha256:809e22ff3e922f0bd01fe53e839d39a0b75c42a82805e191b52f94ce6ceef5ef"}, {"id": "p1a-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "玩游戏用的骰子，形状像哪种图形？", "answer": "正方体", "reasoning": ["骰子的面都是平平的，每个面都一样大。", "它的形状像正方体。"], "options": [{"id": "a", "text": "长方体", "feedback": "骰子的每个面都一样大，像正方体。"}, {"id": "b", "text": "正方体", "feedback": "对。骰子的面都是平平的，而且都一样大。"}, {"id": "c", "text": "圆柱", "feedback": "骰子没有弯弯的面，不像圆柱。"}], "correct": "b", "pointIds": ["pyps.p1a.u3.001"], "contentVersion": "sha256:3bf11fcadc12d6bc5df16025d01897c1fc47a600ca37806208c3db98174478e2"}, {"id": "p1a-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一罐饮料的易拉罐，形状像哪种图形？", "answer": "圆柱", "reasoning": ["易拉罐上下两头是平平的，中间一圈是弯弯的。", "它的形状像圆柱。"], "options": [{"id": "a", "text": "长方体", "feedback": "易拉罐侧面是弯弯的，长方体的面都是平平的。"}, {"id": "b", "text": "球", "feedback": "易拉罐上下两头是平平的，球没有平平的面。"}, {"id": "c", "text": "圆柱", "feedback": "对。上下两头平平的，中间一圈弯弯的。"}], "correct": "c", "pointIds": ["pyps.p1a.u3.001"], "contentVersion": "sha256:f5f2965d26f7fc6b5fa39bcdcc129025c1f3a38bcace8e92494abd499f2eb3a0"}, {"id": "p1a-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "把下面的图形放在桌上，轻轻一推，哪一个最容易滚走？", "answer": "球", "reasoning": ["有弯弯的面才会滚。", "球全身都是弯弯的，所以最容易滚走。"], "options": [{"id": "a", "text": "长方体", "feedback": "长方体的面都是平平的，放得稳，不会滚。"}, {"id": "b", "text": "正方体", "feedback": "正方体的面都是平平的，推一下只会滑，不会滚。"}, {"id": "c", "text": "球", "feedback": "对。球哪里都是弯弯的，怎么放都容易滚。"}], "correct": "c", "pointIds": ["pyps.p1a.u3.002"], "contentVersion": "sha256:81f9dd418c5fbea2ed2dd8c3c8d1b9a272f46cb7bfcb7864da196ff2c72a53d4"}, {"id": "p1a-u3-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "圆柱怎样放在桌上，才能放稳不滚？", "answer": "竖着放，平平的面贴着桌子", "reasoning": ["圆柱有两个平平的面，还有一圈弯弯的面。", "让平平的面贴着桌子竖着放，就放稳了。"], "options": [{"id": "a", "text": "怎么放都会滚", "feedback": "圆柱有平平的面，竖着放就不会滚。"}, {"id": "b", "text": "横着放，弯弯的面贴着桌子", "feedback": "弯弯的面贴着桌子，一推就会滚。"}, {"id": "c", "text": "竖着放，平平的面贴着桌子", "feedback": "对。平平的面贴着桌子，就放稳了。"}], "correct": "c", "pointIds": ["pyps.p1a.u3.002"], "contentVersion": "sha256:92cf087b2d86ec1ba51620763381dcd295461bff48deabd7d6f08e47de1968d0"}, {"id": "p1a-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "牙膏盒的形状像哪种图形？", "answer": "长方体", "reasoning": ["牙膏盒的面都是平平的，盒子长长的。", "它的形状像长方体。"], "options": [{"id": "a", "text": "长方体", "feedback": "对。牙膏盒的面都是平平的，长长的。"}, {"id": "b", "text": "正方体", "feedback": "牙膏盒长长的，面不是都一样大，不像正方体。"}, {"id": "c", "text": "圆柱", "feedback": "牙膏盒没有弯弯的面，不像圆柱。"}], "correct": "a", "pointIds": ["pyps.p1a.u3.001"], "contentVersion": "sha256:0622080312cdc67fcc7791f6eff6a443d5d2969d7d338309ff1819df47ddd995"}, {"id": "p1a-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "要把积木搭得又稳又高，最下面一块用哪种最好？", "answer": "正方体", "reasoning": ["最下面的积木要放得稳，上面还要能放东西。", "正方体的面都是平平的，放得稳，最合适。"], "options": [{"id": "a", "text": "横着放的圆柱", "feedback": "横着放的圆柱弯弯的面贴着桌子，会滚。"}, {"id": "b", "text": "正方体", "feedback": "对。正方体的面平平的，上面还能放东西，最稳。"}, {"id": "c", "text": "球", "feedback": "球会滚，放在最下面上面的积木就倒了。"}], "correct": "b", "pointIds": ["pyps.p1a.u3.003"], "contentVersion": "sha256:2cc939661b3735113938be6698f785f90db7c358e37c0da64ac4a025c7596be1"}, {"id": "p1a-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用 2 个同样大的小正方体，面对面贴在一起，拼成的新图形像什么？", "answer": "长方体", "reasoning": ["2 个小正方体贴在一起，变得长长的。", "面都是平平的，像长方体。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u3.004"], "contentVersion": "sha256:0a714caa1167ecae1e9edd8e008c35be518f514822bc2775878109d1dc89929d"}, {"id": "p1a-u3-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用小正方体摆了 2 层：下面一层 3 个，上面一层也是 3 个。一共用了几个小正方体？", "answer": "6", "reasoning": ["一层一层数：下面一层 3 个，上面一层 3 个。", "3 和 3 合起来是 6，一共 6 个。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u3.005", "pyps.p1a.u2.004"], "contentVersion": "sha256:fb34bd7ee11fbcd47aa1f7c40a06498b80e0874a8a675131d53656ab6892dd64"}, {"id": "p1a-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "积木摆了 2 层：下面一层有 4 个，上面一层有 1 个，上面那个压在下面的积木上。一共有几个积木？", "answer": "5", "reasoning": ["上面的积木一定压在下面的积木上，下面被挡住的也要数。", "下面 4 个，上面 1 个，4 和 1 合起来是 5。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u3.005", "pyps.p1a.u1.006"], "contentVersion": "sha256:b8dbf46abb807944c59f057e38a9232be54683b8300d75df926930c98b9dd67d"}, {"id": "p1a-u3-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "盒子里有 2 个球、3 个圆柱、1 个正方体。哪种图形最多？有几个？", "answer": "圆柱最多，有 3 个", "reasoning": ["分一分、数一数：球 2 个，圆柱 3 个，正方体 1 个。", "3 比 2 大，也比 1 大，所以圆柱最多，有 3 个。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u3.001", "pyps.p1a.u1.003"], "contentVersion": "sha256:a7adad4f519b6cc53451b3654bfbd659ed8a4f0a4abcc4e2908a4294441cb418"}, {"id": "p1a-u3-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "乐乐说：「能滚动的都是球。」这句话对吗？", "answer": "不对，圆柱横着放也能滚", "reasoning": ["有弯弯的面就能滚，不只是球。", "圆柱有一圈弯弯的面，横着放也能滚，所以这句话不对。"], "options": [{"id": "a", "text": "不对，圆柱横着放也能滚", "feedback": "对。圆柱有弯弯的面，横着放也能滚。"}, {"id": "b", "text": "不对，正方体也能滚", "feedback": "正方体的面都是平平的，不会滚。"}, {"id": "c", "text": "对", "feedback": "想一想易拉罐横着放，推一下会不会滚？"}], "correct": "a", "pointIds": ["pyps.p1a.u3.002"], "contentVersion": "sha256:db09cc392bf2357a674c3be17c163e271c6e48e45d7c08a9e30963e410da51bb"}], "contentVersion": "sha256:440765055317fa4f4e338628b27bf08d4895496c6119a8f8c0fab2eeac2a7238"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
