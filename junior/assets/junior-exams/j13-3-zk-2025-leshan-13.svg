<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 410" width="520" height="410" role="img" aria-labelledby="title desc">
<title id="title">三角形与外角 ∠1</title>
<desc id="desc">一个三角形，左下角标着 45°，右下角标着 55°。从右下顶点出发的边经过上方顶点继续向外延长，∠1 是这条延长线与上方顶点到左下顶点的边组成的角。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="520" height="410" fill="white"/>
<line x1="30.0" y1="345.0" x2="314.4" y2="114.7" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="30.0" y1="345.0" x2="467.6" y2="391.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="467.6" y1="391.0" x2="261.1" y2="18.5" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<path d="M281.8 141.1A42 42 0 0 1 294.1 77.9" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M67.3 314.8A48 48 0 0 1 77.7 350.0" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M417.9 385.8A50 50 0 0 1 443.4 347.3" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="256.4" y="100.7" class="n" text-anchor="middle">1</text>
<text x="114.0" y="342.0" class="n" text-anchor="middle">45°</text>
<text x="385.6" y="369.0" class="n" text-anchor="middle">55°</text>
</svg>
