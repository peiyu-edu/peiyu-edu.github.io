<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 22 章 函数 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="junior" data-sec="j22-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 22 章 函数 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j22-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j22-test", "sectionId": "j22-test", "chapterId": "j22", "title": "第 22 章 函数 · 章末测验", "label": "章末测验", "sections": ["j22-1", "j22-2"], "items": [{"id": "j22-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j22-1"], "pointIds": ["pyjh.func.001"], "prompt": "一辆汽车以 $60$ km/h 的速度匀速行驶，行驶路程为 $s$ km，行驶时间为 $t$ h。在这个变化过程中，下列说法正确的是哪一项？", "options": [{"id": "a", "text": "$60$ 是常量，$s$ 和 $t$ 是变量", "feedback": "速度在行驶过程中始终不变，路程和时间都在变化。"}, {"id": "b", "text": "$s$ 是常量，$60$ 和 $t$ 是变量", "feedback": "行驶得越久，路程越长，路程的数值在变化。"}, {"id": "c", "text": "$t$ 是常量，$60$ 和 $s$ 是变量", "feedback": "时间一直在增加，它的数值在变化；匀速行驶时速度不变。"}, {"id": "d", "text": "$60$、$s$、$t$ 都是变量", "feedback": "匀速行驶时速度的数值始终不变，不是变量。"}], "correct": "a", "answer": "$60$ 是常量，$s$ 和 $t$ 是变量", "reasoning": ["在一个变化过程中，数值始终不变的量是常量，数值发生变化的量是变量。", "匀速行驶时速度 $60$ km/h 不变，是常量；$s=60t$ 中 $s$ 和 $t$ 的数值都在变化，是变量。"], "contentVersion": "sha256:f62a47e4e8ff18327e5976a23e7df6388ed781131e26312984a5e7b33034c2ec"}, {"id": "j22-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j22-1"], "pointIds": ["pyjh.func.002"], "prompt": "下列各式中，$y$ 是 $x$ 的函数的是哪一项？", "options": [{"id": "a", "text": "$|y|=x$", "feedback": "取 $x=1$，$y=1$ 和 $y=-1$ 都满足，一个 $x$ 对应了两个 $y$。"}, {"id": "b", "text": "$y^2=x+1$", "feedback": "取 $x=3$，$y=2$ 和 $y=-2$ 都满足，对应的 $y$ 不唯一。"}, {"id": "c", "text": "$y=x^2+1$", "feedback": "对于 $x$ 的每一个确定的值，$y$ 都有唯一确定的值与它对应。不同的 $x$ 对应同一个 $y$ 是允许的。"}, {"id": "d", "text": "$y=\\pm2x$", "feedback": "取 $x=1$，$y$ 可以是 $2$ 也可以是 $-2$，对应的 $y$ 不唯一。"}], "correct": "c", "answer": "$y=x^2+1$", "reasoning": ["函数要求：对于 $x$ 的每一个确定的值，$y$ 都有唯一确定的值与其对应。", "$|y|=x$、$y^2=x+1$、$y=\\pm2x$ 都能找到一个 $x$ 对应两个 $y$。", "$y=x^2+1$ 中，$x$ 取定一个值，$y$ 只有一个值；$x=1$ 与 $x=-1$ 都对应 $y=2$ 并不违反定义。"], "contentVersion": "sha256:836aa612f5127c84603b13a49ff5d714aa0962993e6f999fba3e4001fd569ddd"}, {"id": "j22-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j22-1"], "pointIds": ["pyjh.func.003"], "prompt": "对于函数 $y=\\frac{2x-1}{x+3}$，当 $x=2$ 时，函数值是多少？", "options": [{"id": "a", "text": "$\\frac35$", "feedback": "把 $x=2$ 代入：分子 $2\\times2-1=3$，分母 $2+3=5$。"}, {"id": "b", "text": "$\\frac53$", "feedback": "分子、分母弄反了，分子是 $2x-1$。"}, {"id": "c", "text": "$3$", "feedback": "只算了分子，还要除以分母 $x+3$。"}, {"id": "d", "text": "$\\frac32$", "feedback": "分母是 $x+3$，不是 $x$。"}], "correct": "a", "answer": "$\\frac35$", "reasoning": ["求函数值就是把 $x=2$ 代入解析式。", "$y=\\frac{2\\times2-1}{2+3}=\\frac35$。"], "contentVersion": "sha256:6e2b8733760838b7aa66a6dff899faeb26611b93c3d3b2416b22948e4c4e34ed"}, {"id": "j22-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j22-1"], "pointIds": ["pyjh.func.004"], "prompt": "函数 $y=\\frac{x+1}{x-2}$ 中，自变量 $x$ 的取值范围是什么？", "options": [{"id": "a", "text": "$x\\ne2$", "feedback": "分式要有意义，只需分母 $x-2\\ne0$。"}, {"id": "b", "text": "$x\\ne-1$", "feedback": "分子可以为 $0$，要求不为 $0$ 的是分母。"}, {"id": "c", "text": "$x\\ne2$ 且 $x\\ne-1$", "feedback": "分子为 $0$ 时分式的值是 $0$，仍然有意义，不用排除。"}, {"id": "d", "text": "$x>2$", "feedback": "分式只要求分母不为 $0$，$x<2$ 时式子也有意义。"}], "correct": "a", "answer": "$x\\ne2$", "reasoning": ["分式有意义的条件是分母不为 $0$。", "$x-2\\ne0$，所以 $x\\ne2$。"], "contentVersion": "sha256:5aeed2b5a1a63ea74ffce45fc7131c3932328899e70961e60cd9dd2b5babe7ea"}, {"id": "j22-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j22-2"], "pointIds": ["pyjh.func.006"], "prompt": "下列各点中，在函数 $y=x^2-2x$ 的图象上的是哪一个？", "options": [{"id": "a", "text": "$(8,4)$", "feedback": "横、纵坐标弄反了：$x=8$ 时 $y=64-16=48$。"}, {"id": "b", "text": "$(-1,1)$", "feedback": "$(-1)^2=1$，不是 $-1$：$x=-1$ 时 $y=1+2=3$。"}, {"id": "c", "text": "$(3,3)$", "feedback": "$x=3$ 时 $y=9-6=3$，这对对应值作为坐标的点在图象上。"}, {"id": "d", "text": "$(2,4)$", "feedback": "只算了 $x^2$，漏减了 $2x$：$x=2$ 时 $y=4-4=0$。"}], "correct": "c", "answer": "$(3,3)$", "reasoning": ["点 $(a,b)$ 在函数图象上，就是 $x=a$ 时的函数值等于 $b$。", "逐个代入横坐标：$x=3$ 时 $y=3^2-2\\times3=3$，与纵坐标相同；其余三点代入后都不相等。"], "contentVersion": "sha256:ef07162d201c78693e7b63afb204c17fa62fbb64516cbc0bef68500106438c35"}, {"id": "j22-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j22-1"], "pointIds": ["pyjh.func.005", "pyjh.tri.005"], "prompt": "等腰三角形的周长为 $20$ cm，腰长为 $x$ cm，底边长为 $y$ cm。$y$ 关于 $x$ 的函数解析式及自变量的取值范围是哪一项？", "options": [{"id": "a", "text": "$y=20-2x$，$5<x<10$", "feedback": "既要 $y>0$，又要两腰之和大于底边，两方面取公共部分。"}, {"id": "b", "text": "$y=20-2x$，$0<x<10$", "feedback": "只考虑了底边为正，没考虑三角形三边关系：例如 $x=4$ 时底边 $12$ 大于两腰之和 $8$。"}, {"id": "c", "text": "$y=20-2x$，$x>5$", "feedback": "漏了上限：底边长必须为正。"}, {"id": "d", "text": "$y=20-2x$，$0<x<5$", "feedback": "三边关系的不等号方向弄反了，应该是两腰之和大于底边。"}], "correct": "a", "answer": "$y=20-2x$，$5<x<10$", "reasoning": ["由周长得 $2x+y=20$，所以 $y=20-2x$。", "底边为正：$20-2x>0$，得 $x<10$。", "两腰之和大于底边：$2x>20-2x$，得 $x>5$。所以 $5<x<10$。"], "contentVersion": "sha256:c57743fbe7e53b0c46547fb77ceb179d0763c294b1c607195b4cfe48fa1f8000"}, {"id": "j22-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j22-1"], "pointIds": ["pyjh.func.004", "pyjh.rad.002"], "prompt": "函数 $y=\\frac{\\sqrt{x+2}}{x-1}$ 中，自变量 $x$ 的取值范围是什么？", "options": [{"id": "a", "text": "$x>-2$ 且 $x\\ne1$", "feedback": "被开方数可以等于 $0$，$x=-2$ 时式子有意义。"}, {"id": "b", "text": "$x\\ge-2$ 且 $x\\ne1$", "feedback": "被开方数 $x+2\\ge0$，同时分母 $x-1\\ne0$，两个条件同时满足。"}, {"id": "c", "text": "$x\\ge-2$", "feedback": "漏了分母不为 $0$：$x=1$ 时分母为 $0$。"}, {"id": "d", "text": "$x\\ne1$", "feedback": "漏了二次根式的条件：被开方数不能为负。"}], "correct": "b", "answer": "$x\\ge-2$ 且 $x\\ne1$", "reasoning": ["二次根式有意义：$x+2\\ge0$，即 $x\\ge-2$。", "分式有意义：$x-1\\ne0$，即 $x\\ne1$。", "两个条件同时满足：$x\\ge-2$ 且 $x\\ne1$。"], "contentVersion": "sha256:e44a2be7a036bfc92953357410c28e7934d83462b9b715d9de08774eddf788e8"}, {"id": "j22-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j22-2"], "pointIds": ["pyjh.func.008", "pyjh.func.009"], "prompt": "小明从家步行去图书馆，看完书后原路返回。他离家的距离 $y$（m）与出发后的时间 $x$（min）的图象由三条线段组成：从点 $(0,0)$ 到点 $(10,800)$，从点 $(10,800)$ 到点 $(25,800)$，从点 $(25,800)$ 到点 $(45,0)$。下列说法正确的是哪一项？", "options": [{"id": "a", "text": "他在图书馆停留了 $25$ min", "feedback": "停留时间是水平线段两端横坐标之差，不是第二段终点的横坐标。"}, {"id": "b", "text": "他去图书馆的平均速度是 $80$ m/min", "feedback": "去时 $10$ min 离家距离从 $0$ 增加到 $800$ m，$800\\div10=80$。"}, {"id": "c", "text": "他一共走了 $800$ m", "feedback": "纵坐标是离家距离，不是走过的总路程；去和回各走一次。"}, {"id": "d", "text": "他返回时比去时走得快", "feedback": "返回用了 $45-25=20$ min，比去时的 $10$ min 长，走得更慢。"}], "correct": "b", "answer": "他去图书馆的平均速度是 $80$ m/min", "reasoning": ["第一段：$10$ min 内离家距离从 $0$ 增至 $800$ m，去时平均速度 $80$ m/min。", "第二段是水平线段，停留 $25-10=15$ min；第三段 $20$ min 走回 $800$ m，平均速度 $40$ m/min。", "全程走了 $800\\times2=1600$ m。"], "contentVersion": "sha256:e962a74e6da293b96c38bf6fd4136d430bb9ce052151e429a5eb6f1a8d7c7bdb"}, {"id": "j22-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j22-2"], "pointIds": ["pyjh.func.010"], "prompt": "一支蜡烛点燃后，测得剩余高度 $y$（cm）与燃烧时间 $x$（min）的数据：$x=0$ 时 $y=20$，$x=2$ 时 $y=19$，$x=4$ 时 $y=18$，$x=6$ 时 $y=17$。按这个规律，下列解析式中符合表中所有数据的是哪一项？", "options": [{"id": "a", "text": "$y=20-2x$", "feedback": "每 $2$ min 减少 $1$ cm，不是每 min 减少 $2$ cm。"}, {"id": "b", "text": "$y=20+\\frac12x$", "feedback": "燃烧时高度在减少，变化量要记为负数。"}, {"id": "c", "text": "$y=20-\\frac12x$", "feedback": "起始高度 $20$ cm，每 min 减少 $\\frac12$ cm，代入四组数据都成立。"}, {"id": "d", "text": "$y=19-\\frac12x$", "feedback": "起始值应取 $x=0$ 时的 $y$，代入 $x=0$ 检验一下。"}], "correct": "c", "answer": "$y=20-\\frac12x$", "reasoning": ["起始高度（$x=0$ 时）为 $20$ cm。", "每 $2$ min 减少 $1$ cm，即每 min 减少 $\\frac12$ cm，所以 $y=20-\\frac12x$。", "代入 $x=2,4,6$ 检验，得 $19,18,17$，与数据一致。"], "contentVersion": "sha256:094a706dca9fbac554028679fca44051057c281d4a191cfe5470c93a230235d7"}, {"id": "j22-test-10-v2", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j22-1", "j22-2"], "pointIds": ["pyjh.func.006", "pyjh.func.004", "pyjh.rad.002"], "prompt": "已知函数 $y=\\sqrt{2x-a}$ 的图象经过点 $(6,2)$，这个函数中自变量 $x$ 的取值范围是什么？", "options": [{"id": "a", "text": "$x\\ge4$", "feedback": "由 $\\sqrt{12-a}=2$ 得 $12-a=4$，$a=8$；再由 $2x-8\\ge0$ 得出。"}, {"id": "b", "text": "$x>4$", "feedback": "被开方数可以为零，不能把允许取到的端点排除。"}, {"id": "c", "text": "$x\\ge5$", "feedback": "由 $\\sqrt{12-a}=2$ 应两边平方得 $12-a=4$，不是 $12-a=2$。"}, {"id": "d", "text": "$x\\ge8$", "feedback": "混淆了参数的值与自变量的范围，应回到根式有意义的条件。"}], "correct": "a", "answer": "$x\\ge4$", "reasoning": ["点 $(6,2)$ 在图象上：$\\sqrt{2\\times6-a}=2$，所以 $12-a=4$，$a=8$。", "函数为 $y=\\sqrt{2x-8}$，要求 $2x-8\\ge0$，即 $x\\ge4$。"], "contentVersion": "sha256:b4830068d7ab2e8c30e3e799640838f0814870a42d18c7af4695ae0322b0cd17"}, {"id": "j22-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j22-1", "j22-2"], "pointIds": ["pyjh.func.008", "pyjh.func.003"], "prompt": "一个水箱先进水、再保持不变、后放水。水箱中的水量 $y$（L）与时间 $x$（min）的图象由三条线段组成：从点 $(0,10)$ 到点 $(5,30)$，从点 $(5,30)$ 到点 $(10,30)$，从点 $(10,30)$ 到点 $(16,0)$。第 $13$ min 时水箱中有多少升水？", "options": [{"id": "a", "text": "$15$ L", "feedback": "放水阶段每 min 放 $30\\div6=5$ L，从第 $10$ min 起放了 $3$ min。"}, {"id": "b", "text": "$18$ L", "feedback": "用了进水阶段的速度 $4$ L/min，放水阶段的速度要按第三段重新算。"}, {"id": "c", "text": "$30$ L", "feedback": "第 $13$ min 已经过了水平段（第 $5$ 到第 $10$ min），正在放水。"}, {"id": "d", "text": "$5$ L", "feedback": "这是每分钟的放水量，还要求出此时剩下的水量。"}], "correct": "a", "answer": "$15$ L", "reasoning": ["第 $13$ min 在第三段（$10\\le x\\le16$）上，这段 $6$ min 水量从 $30$ L 降到 $0$。", "每 min 放水 $30\\div6=5$ L。", "第 $13$ min 时水量为 $30-5\\times(13-10)=15$ L。"], "contentVersion": "sha256:36bb83ab94e8538b1f87eb4ac45870f21822b52fa68da818577d72518d7d213e"}, {"id": "j22-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j22-1", "j22-2"], "pointIds": ["pyjh.func.005", "pyjh.func.006"], "prompt": "用长 $16$ cm 的铁丝围成一个长方形，设一边长为 $x$ cm，面积为 $S$ cm$^2$，则 $S=x(8-x)$。下列各点中，在这个函数的图象上的是哪一个？", "options": [{"id": "a", "text": "$(0,0)$", "feedback": "$x=0$ 时围不成长方形，$0$ 不在自变量的取值范围内。"}, {"id": "b", "text": "$(8,0)$", "feedback": "边长 $x$ 必须小于半周长 $8$，$x=8$ 时另一边为 $0$，不在取值范围内。"}, {"id": "c", "text": "$(4,15)$", "feedback": "$x=4$ 时 $S=4\\times4=16$，不是 $15$。"}, {"id": "d", "text": "$(3,15)$", "feedback": "$3$ 在取值范围 $0<x<8$ 内，且 $x=3$ 时 $S=3\\times5=15$。"}], "correct": "d", "answer": "$(3,15)$", "reasoning": ["两边长都要为正：$x>0$ 且 $8-x>0$，所以自变量的取值范围是 $0<x<8$。", "点在图象上，要求横坐标在取值范围内，且纵坐标等于对应的函数值。", "$(0,0)$、$(8,0)$ 的横坐标不在范围内；$x=4$ 时 $S=16$；只有 $(3,15)$ 符合。"], "contentVersion": "sha256:2bec4448987cda1d30422ac89490b9ee0d0b9e20d982278518930729d7d44d27"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
