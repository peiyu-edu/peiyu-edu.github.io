<line x1="68.0" y1="72.0" x2="68.0" y2="412.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="68.0" y1="412.0" x2="360.0" y2="412.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="413.0" y1="312.0" x2="413.0" y2="412.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="413.0" y1="412.0" x2="498.9" y2="412.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="28.0" y1="25.4" x2="372.0" y2="426.0" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-dasharray="13 10"/>
<polygon points="172.0,193.1 152.9,183.1 165.0,172.7" fill="#17202a"/>
<line x1="162.0" y1="19.7" x2="510.9" y2="426.0" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-dasharray="13 10"/>
<polygon points="300.0,180.4 280.9,170.5 293.0,160.0" fill="#17202a"/>
<polygon points="68,72 110,82 113,112 68,108" fill="#d5d9de" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/>
<text class="m" x="88.0" y="52.0" text-anchor="middle">A</text>
<text class="m" x="432.0" y="296.0" text-anchor="middle">D</text>
<text class="m" x="70.0" y="458.0" text-anchor="middle">B</text>
