<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 378" width="390" height="378" role="img" aria-labelledby="title desc">
<title id="title">圆中的直径与弦</title>
<desc id="desc">⊙O 中 AB 是竖直的直径，B 在上、A 在下，圆心 O 标在 AB 中点。C、D 都在直径右侧的圆上，C 靠近 A，D 在 C 的上方。图中连接了 AC、BC、AD、CD。</desc>
<style>text { fill:#17202a; } .it { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .nm { font-family:'Times New Roman',Georgia,serif; } .zh { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="390" height="378" fill="white"/>
<circle cx="195" cy="190" r="150" fill="none" stroke="#17202a" stroke-width="3"/>
<line x1="195.0" y1="340.0" x2="195.0" y2="40.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="195.0" y1="40.0" x2="291.4" y2="304.9" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="195.0" y1="340.0" x2="291.4" y2="304.9" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="195.0" y1="340.0" x2="336.0" y2="138.7" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="336.0" y1="138.7" x2="291.4" y2="304.9" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<circle cx="195.0" cy="190.0" r="4.5" fill="#17202a"/>
<text class="it" x="171.0" y="200.0" text-anchor="middle" font-size="30">O</text>
<text class="it" x="195.0" y="31.0" text-anchor="middle" font-size="30">B</text>
<text class="it" x="195.0" y="372.0" text-anchor="middle" font-size="30">A</text>
<text class="it" x="311.4" y="328.9" text-anchor="middle" font-size="30">C</text>
<text class="it" x="358.0" y="135.7" text-anchor="middle" font-size="30">D</text>
