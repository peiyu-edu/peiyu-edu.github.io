<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" width="600" height="370" role="img" aria-labelledby="title desc">
<title id="title">父子竞走的距离时间图象</title>
<desc id="desc">直角坐标系，纵轴 s/米，标出 200；横轴 t/秒，从 20 到 320 每隔 20 一个刻度。实线表示父，依次经过 (0,0)、(60,200)、(120,0)、(180,200)、(240,0)、(300,200)，之后继续下降到图的末端。虚线表示子，依次经过 (0,200)、(100,0)、(200,200)、(300,0)，之后继续上升到图的末端。</desc>
<style>text{fill:#17202a;font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:32px;}.n{font-family:'Times New Roman',Georgia,serif;font-size:30px;}.h{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;}</style>
