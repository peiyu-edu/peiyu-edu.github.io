<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 34 章 投影与视图 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j34-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 34 章 投影与视图 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j34-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j34-test", "sectionId": "j34-test", "chapterId": "j34", "title": "第 34 章 投影与视图 · 章末测验", "label": "章末测验", "sections": ["j34-1", "j34-2", "j34-3"], "items": [{"id": "j34-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j34-1"], "pointIds": ["pyjh.view.001"], "prompt": "在同一水平地面上，两根同高的竖杆都有非零影子，且影子都朝东。光源只可能是平行光或一个高于两杆顶端的点光源。仅凭“影子同向”，下列判断哪项正确？", "options": [{"id": "a", "text": "一定是平行投影", "feedback": "同向只是影子的方向信息，还需检查投影线的关系。"}, {"id": "b", "text": "一定是中心投影", "feedback": "平行光也可能产生题设的同向现象。"}, {"id": "c", "text": "一定是正投影", "feedback": "正投影要检查投影线是否垂直于地面，方向描述没有给出这个条件。"}, {"id": "d", "text": "平行投影与中心投影都有可能，尚不能判定", "feedback": "两杆在点光源灯脚的同一条射线上时，影子也可能同向。"}], "correct": "d", "answer": "平行投影与中心投影都有可能，尚不能判定", "reasoning": ["平行光从西上方照向东下方，同高竖杆的影子都可朝东。", "再构造点光源：灯高 $4$，两杆均高 $1$，杆脚在灯脚正东方距离 $1$、$2$ 处。各自的影长分别为 $1/3$、$2/3$，影子都朝东。", "两个模型都满足已知现象，不能只凭影子同向判定投影类型。正投影在此竖杆和地面条件下会缩成点，不符合非零影长。"], "contentVersion": "sha256:75dc08dad8e9457bd45a2c85f3ac6d9a3e59ea686006d91c69f8d56212c52ddc", "contentVersions": ["sha256:2ffdcce91b4df315728b28cadb36240e994a1defa32565828674a03b8b62a121", "sha256:75dc08dad8e9457bd45a2c85f3ac6d9a3e59ea686006d91c69f8d56212c52ddc"]}, {"id": "j34-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j34-1"], "pointIds": ["pyjh.view.004"], "prompt": "把同一时刻照到操场的太阳光看成平行光。两根细杆竖直立在同一水平地面上，互不遮挡；已知 $1.8$ 米高的标杆影长 $2.4$ 米，另一根杆影长 $7.2$ 米。另一根杆高多少米？", "options": [{"id": "a", "text": "$5.4$", "feedback": "在同一组相似三角形中，两种杆的高与影长按相同比例对应。"}, {"id": "b", "text": "$9.6$", "feedback": "请检查是否把标杆的物高与影长的对应次序颠倒了。"}, {"id": "c", "text": "$6.6$", "feedback": "物高与影长满足比例关系，不能把两者的差照搬给另一根杆。"}, {"id": "d", "text": "$12.96$", "feedback": "只乘标杆高度还没有组成无单位的相似比。"}], "correct": "a", "answer": "$5.4$", "reasoning": ["平行光、竖直杆和水平地面形成两组相似直角三角形，故 $H/7.2=1.8/2.4$。", "$H=7.2\\times1.8/2.4=5.4$ 米。", "检验：$H/1.8=7.2/2.4=3$，两个三角形的对应长度同比放大。"], "contentVersion": "sha256:5bdc90640690e9f4b04b5e687e7245b13c8967d558eff288ccf00f986ddae9ff"}, {"id": "j34-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j34-1"], "pointIds": ["pyjh.view.003"], "prompt": "水平桌面上方有一根长 $13$ 厘米的直木棒。两端到桌面的垂直距离分别为 $2$ 厘米和 $7$ 厘米。平行光垂直桌面照下，木棒在桌面上的正投影长多少厘米？", "options": [{"id": "a", "text": "$\\sqrt{120}$", "feedback": "用于直角三角形的竖边不是较高端到桌面的全部距离。"}, {"id": "b", "text": "$13$", "feedback": "木棒两端高度不同，不能当成平行桌面放置。"}, {"id": "c", "text": "$12$", "feedback": "两端的高度差与正投影组成直角边，木棒是斜边。"}, {"id": "d", "text": "$8$", "feedback": "斜边减去竖边不是另一条直角边的长度。"}], "correct": "c", "answer": "$12$", "reasoning": ["将较低端所在的水平面作为辅助平面，两端高度差为 $7-2=5$ 厘米。", "正投影长 $p$ 与高度差 $5$、棒长 $13$ 组成直角三角形：$p^2+5^2=13^2$。", "$p=\\sqrt{169-25}=12$ 厘米，满足 $0<p<13$。两端共同抬高不会改变正投影。"], "contentVersion": "sha256:6e19e3e3cfc0a7860d9e222ec1d114cfa551320d47f64a7da39651c12686536a"}, {"id": "j34-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j34-2"], "pointIds": ["pyjh.view.006", "pyjh.view.007"], "prompt": "一个长方体的主视图为横向长 $9$、竖向高 $4$ 的矩形，俯视图为横向长 $9$、前后宽 $6$ 的矩形（单位：厘米）。另有一个球。按相同制图比例，下列哪项同时正确描述了长方体左视图的尺寸、摆放位置，以及球的三视图？", "options": [{"id": "a", "text": "长方体左视图横向 $6$、竖向 $4$，放在主视图正左方；球的三视图是三个等大的圆", "feedback": "“从左面看”和“放在图纸左边”是两件事。"}, {"id": "b", "text": "长方体左视图横向 $6$、竖向 $4$，放在主视图正右方；球的三视图是三个等大的圆", "feedback": "左视图保留宽与高；球在三个正交观察方向上具有相同的圆形外轮廓。"}, {"id": "c", "text": "长方体左视图横向 $9$、竖向 $4$，放在主视图正右方；球的三视图是三个等大的圆", "feedback": "左视图的横向尺度不取物体的左右长度。"}, {"id": "d", "text": "长方体左视图横向 $6$、竖向 $4$，放在主视图正右方；球的三视图是三个等大的正方形", "feedback": "正方形是正放正方体的视图形状，不能把它与球的外轮廓混淆。"}], "correct": "b", "answer": "长方体左视图横向 $6$、竖向 $4$，放在主视图正右方；球的三视图是三个等大的圆", "reasoning": ["主视图给出长 $9$、高 $4$；俯视图给出长 $9$、宽 $6$，长对正。", "左视图保留宽和高，尺寸为横向 $6$、竖向 $4$。", "主视图正右方放左视图，正下方放俯视图；左视图与主视图高平齐。", "球沿任何方向的正投影外轮廓都是直径等于球直径的圆；同一比例的三视图是三个等大的圆。"], "contentVersion": "sha256:f831eb5f425530afc5a7197b48f65218d5cf5c27efd07c307030379bd93fde09", "contentVersions": ["sha256:822b257c027460b0932133b2f09203a7ed0b7735ad410a8dc45a6156af74c37f", "sha256:f831eb5f425530afc5a7197b48f65218d5cf5c27efd07c307030379bd93fde09"]}, {"id": "j34-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j34-2", "j34-3"], "pointIds": ["pyjh.view.010", "pyjh.view.011"], "prompt": "已知要做的是一个直圆柱的侧面。它的俯视图是直径 $6$ 厘米的圆，主视图高 $8$ 厘米。材料不可拉伸、不留重叠；将下列矩形纸片中两条长 $8$ 厘米的边粘合，哪张纸片能恰好围成这个侧面？", "options": [{"id": "a", "text": "$3\\pi$ 厘米 $\\times\\ 8$ 厘米", "feedback": "计算底面周长时，请区分半径、直径和整圆周长。"}, {"id": "b", "text": "$6$ 厘米 $\\times\\ 8$ 厘米", "feedback": "圆柱的主视图宽度不等于侧面展开后一整圈的长度。"}, {"id": "c", "text": "$12\\pi$ 厘米 $\\times\\ 8$ 厘米", "feedback": "俯视图给的是直径，不能再次把它当半径代入周长式。"}, {"id": "d", "text": "$6\\pi$ 厘米 $\\times\\ 8$ 厘米", "feedback": "接缝的两边保持高不变，另一边应绕底面一整圈。"}], "correct": "d", "answer": "$6\\pi$ 厘米 $\\times\\ 8$ 厘米", "reasoning": ["俯视图直径 $d=6$，底面周长为 $\\pi d=6\\pi$ 厘米。", "沿圆柱母线剪开，矩形沿接缝方向长为高 $8$，绕一周方向长为 $6\\pi$。", "将两条长 $8$ 的边无重叠粘合，圆周恰为 $6\\pi$，符合指定圆柱。这里只制作侧面，不加两个底面。"], "contentVersion": "sha256:e5374b23caea8784bee30c4d946dcbf533da902c261b5a61a3d05663b63e0865"}, {"id": "j34-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j34-1"], "pointIds": ["pyjh.view.002"], "prompt": "在一个竖直平面内，用平面坐标 $(x,z)$ 记位置：$x$ 为水平距离，$z$ 为离水平地面的高度，单位均为米，地面为 $z=0$。一个点光源照两根细竖杆，第一根杆顶为 $(4,2)$，对应影子末端为 $(6,0)$；第二根杆顶为 $(2,3)$，对应影子末端为 $(4,0)$。没有其他光源或遮挡。光源位置是哪项？", "options": [{"id": "a", "text": "$(0,6)$", "feedback": "将两组“杆顶—影端”直线向杆顶上方延长，找到公共交点。"}, {"id": "b", "text": "$(0,4)$", "feedback": "请把候选光源分别与两组杆顶、影端检查三点共线。"}, {"id": "c", "text": "$(1,5)$", "feedback": "能对上一组光线还不够，另一根杆也必须由同一点照射。"}, {"id": "d", "text": "$(6,0)$", "feedback": "影端在地面上，不能把影端当成位于杆顶上方的光源。"}], "correct": "a", "answer": "$(0,6)$", "reasoning": ["第一条光线水平向右每走 $2$ 米下降 $2$ 米，从 $(4,2)$ 向左上延长到 $x=0$ 时为 $z=6$。它所在直线为 $z=6-x$。", "第二条光线水平向右每走 $2$ 米下降 $3$ 米，所在直线为 $z=6-\\tfrac32x$。", "两式相等得 $x=0,z=6$。交点高于两个杆顶，且杆顶都位于从光源到相应影端的线段内部，符合照射方向。", "还可用相似比检查：第一杆影长 $6-4=2$，$2/(4+2)=2/6$；第二杆影长 $4-2=2$，$2/(2+2)=3/6$。"], "contentVersion": "sha256:17094deb3406f8b99f601123feb957e9d31b4f21980a1ed3baaff62687a8a4b4", "contentVersions": ["sha256:ed7dd68cf63e643569d6983ad2e8f59472e354fdbe8bdd5504af5ec6bc003121", "sha256:17094deb3406f8b99f601123feb957e9d31b4f21980a1ed3baaff62687a8a4b4"]}, {"id": "j34-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j34-2"], "pointIds": ["pyjh.view.008"], "prompt": "一个棱长 $6$ 厘米的正方体放正，正面正对观察者。沿左右方向钻一个直径 $2$ 厘米的圆柱通孔，孔轴通过正方体中心，且垂直于左面、右面；前面、后面没有开口。按可见轮廓画实线、不可见轮廓画虚线，主视图中孔的两条轮廓应怎样画？（忽略辅助中心线。）", "options": [{"id": "a", "text": "在外轮廓正方形内画两条竖直虚线", "feedback": "孔的轴向是左右方向，请先确认从正面投影后保留下来的方向。"}, {"id": "b", "text": "在外轮廓正方形内画两条水平实线", "feedback": "前表面没有开口，孔壁轮廓不能作为从正面可直接看到的边。"}, {"id": "c", "text": "在外轮廓正方形内，距底边 $2$ 和 $4$ 厘米处各画一条横贯全宽的水平虚线", "feedback": "孔轴沿左右方向，孔的上下极限轮廓被前表面挡住。"}, {"id": "d", "text": "在外轮廓正方形内画直径 $2$ 厘米的实线圆", "feedback": "只有沿孔轴方向观察才能正对圆形开口。"}], "correct": "c", "answer": "在外轮廓正方形内，距底边 $2$ 和 $4$ 厘米处各画一条横贯全宽的水平虚线", "reasoning": ["孔中心高为 $3$，半径为 $1$，故最高与最低轮廓的高度分别为 $4$、$2$。", "从正面看，左右方向仍为水平方向；孔贯穿左右两面，所以两条轮廓横贯整个正方体的宽。", "前表面无孔口，孔壁上下轮廓从正面被遮挡，故为两条水平虚线；从左面看才会出现圆形孔口。"], "contentVersion": "sha256:bf7ced53c0b6a840a9f0d6e7648874a6ae7959cf18b1325b1335b3b1b2262015"}, {"id": "j34-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j34-3"], "pointIds": ["pyjh.view.012"], "prompt": "在方格纸上先画一条横带：连续四个边长 $1$ 的正方形，左起依次叫第1、2、3、4格；再在第2格正上方沿整条边接一个同样的正方形。只补一个单位正方形，下列哪种补法能得到正方体展开图？纸片只能沿已有公共边折叠，不剪开、不伸缩，折后六个面各覆盖一次。", "options": [{"id": "a", "text": "接在第3格正上方", "feedback": "同在横带一侧的补面折起后，请检查是否会落在同一面上。"}, {"id": "b", "text": "接在第4格正右方", "feedback": "连续横带继续加长，折一圈后可能回到已覆盖的面。"}, {"id": "c", "text": "接在已接的上方正方形的正上方", "feedback": "沿一条支链再翻一次，请检查它是否与横带中的面重合。"}, {"id": "d", "text": "接在第3格正下方", "feedback": "横带绕成四个侧面，上下两格可分别封住两个未覆盖的面。"}], "correct": "d", "answer": "接在第3格正下方", "reasoning": ["四个连续正方形折成正方体的四个侧面。第2格上方的补面封住一个面。", "第3格下方的补面封住相对的另一个面，六面不重复，可沿公共边折起、在外边粘合。", "若补第3格上方，它和已有上方面折到同一面；补第4格右方，会与第1格重合；补在已有上方格的上方，会与横带第4格重合。", "因此仅第四种可行，不能只数出六个正方形就判断。"], "contentVersion": "sha256:eaab4707dbf3c2c237bcdb793d7896a12ca4487834a718d76147b2da18533c7c"}, {"id": "j34-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j34-2"], "pointIds": ["pyjh.view.009"], "prompt": "用相同的小正方体在水平桌面上的后、前两排、左、右两列中搭物体；每格只能从桌面起连续向上叠，无悬空。主视图从左到右的高度为 $3,2$，左视图从左到右的高度为 $2,3$；俯视图的四格都有方块。规定左视图的左侧对应后排。以下哪张高度表满足三个视图？每项先列后排、再列前排，行内均从左到右。", "options": [{"id": "a", "text": "后排 $(2,2)$；前排 $(3,1)$", "feedback": "各列最大值、各排最大值与四格占用情况同时相符。"}, {"id": "b", "text": "后排 $(3,2)$；前排 $(2,1)$", "feedback": "请按照左视图“后排在左、前排在右”的顺序检查每排最高层数。"}, {"id": "c", "text": "后排 $(2,2)$；前排 $(3,0)$", "feedback": "只对上主视图、左视图仍不够，俯视图还规定每格都被占用。"}, {"id": "d", "text": "后排 $(2,3)$；前排 $(3,1)$", "feedback": "主视图每一列取前后两摞的最大值，请重查右列。"}], "correct": "a", "answer": "后排 $(2,2)$；前排 $(3,1)$", "reasoning": ["主视图需要两列最大值为 $(3,2)$；左视图需要后、前两排最大值为 $(2,3)$；俯视图还要求每格至少 $1$ 个。", "第一项列最大值为 $(3,2)$、排最大值为 $(2,3)$，四格均正，搭建无悬空，全部满足。", "第二项排最大值为 $(3,2)$，左右顺序相反；第三项有 $0$，俯视图缺一格；第四项列最大值为 $(3,3)$，右列过高。"], "contentVersion": "sha256:2806672ff17e7d11926d97c5d8752e78a05efe4458c9aa80b83892b792135de5", "contentVersions": ["sha256:381417e3627a72c46df19defe7d030b4010754d9a7b3d2202081ae2e4eaa4e51", "sha256:2806672ff17e7d11926d97c5d8752e78a05efe4458c9aa80b83892b792135de5"]}, {"id": "j34-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j34-2"], "pointIds": ["pyjh.view.009"], "prompt": "相同的小正方体在水平桌面上搭成物体，每个位置只能从桌面起连续向上叠，无悬空。俯视图为后、前两排、左中右三列的完整 $2\\times3$ 格，六格都有方块；主视图从左到右为 $3,2,1$ 层；左视图从左到右（后排到前排）为 $2,3$ 层。关于所用小正方体个数，哪项正确？", "options": [{"id": "a", "text": "最少 $8$ 个，最多 $11$ 个", "feedback": "先给每格各放一个后，还需同时达到每列规定的最高层数。"}, {"id": "b", "text": "最少 $9$ 个，最多 $12$ 个", "feedback": "同一格的高度同时受所在排和所在列的最大值限制。"}, {"id": "c", "text": "最少 $9$ 个，最多 $11$ 个", "feedback": "逐格上界与一个达到下界的摆法可以共同证明这两个极值。"}, {"id": "d", "text": "三个视图已经给全，所以一定是 $11$ 个", "feedback": "同一组外轮廓和占格信息，仍可能允许内部某些格改变高度。"}], "correct": "c", "answer": "最少 $9$ 个，最多 $11$ 个", "reasoning": ["设后排为 $(a,b,c)$、前排为 $(d,e,f)$。后排最高 $2$、前排最高 $3$；各列最高分别为 $3,2,1$；六数均为正整数。", "最多：后排各格不超过 $(2,2,1)$，前排各格不超过 $(3,2,1)$，故总数不超过 $11$。这张表本身满足三视图，所以上界能达到。", "最少：六格先各放 $1$ 个，共 $6$ 个；左列达到 $3$ 层还需至少 $2$ 个，中列达到 $2$ 层还需至少 $1$ 个，这两列互不替代，故至少 $9$ 个。", "后排 $(1,2,1)$、前排 $(3,1,1)$ 合计 $9$ 个，满足全部视图，且无悬空。因此最少 $9$、最多 $11$。", "这两个不同摆法已说明三视图不能一般唯一还原小正方体总数；中间改一格还可得到 $10$ 个。"], "contentVersion": "sha256:0b180e7293f9b31c63988d808ec8ec9e09fbe93a7da9169c117bc2a367c0d4ce"}, {"id": "j34-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j34-2", "j34-3"], "pointIds": ["pyjh.view.007", "pyjh.view.011", "pyjh.circ.013"], "prompt": "要做一个底面水平、轴竖直的直圆锥封闭纸模型，已知目标主视图为底边 $10$ 厘米、高 $12$ 厘米的等腰三角形，俯视图为直径 $10$ 厘米的圆（带圆心）。不计接缝和纸厚，纸不可伸缩，扇形两半径无重叠粘合。以下哪套“侧面扇形与底面圆”材料能恰好做成目标模型？", "options": [{"id": "a", "text": "扇形半径 $12$，圆心角 $150^\\circ$；底面圆半径 $5$（长度单位：厘米）", "feedback": "弧长能对上底面圆，还要检查扇形半径围成的母线能否达到目标高度。"}, {"id": "b", "text": "扇形半径 $13$，圆心角 $\\dfrac{1800}{13}^\\circ$；底面圆半径 $5$（长度单位：厘米）", "feedback": "母线、弧长、底面直径和正高度四项可同时核对。"}, {"id": "c", "text": "扇形半径 $13$，圆心角 $180^\\circ$；底面圆半径 $5$（长度单位：厘米）", "feedback": "不能只核扇形半径，扇形弧还需与底面圆周完全匹配。"}, {"id": "d", "text": "扇形半径 $13$，圆心角 $\\dfrac{3600}{13}^\\circ$；底面圆半径 $10$（长度单位：厘米）", "feedback": "给定视图中的底边表示直径，请不要直接把它当底面半径。"}], "correct": "b", "answer": "扇形半径 $13$，圆心角 $\\dfrac{1800}{13}^\\circ$；底面圆半径 $5$（长度单位：厘米）", "reasoning": ["目标底面半径 $r=10/2=5$，高 $h=12$；母线 $l=\\sqrt{5^2+12^2}=13$。", "侧面扇形半径须为 $13$，弧长须为 $2\\pi r=10\\pi$，故圆心角 $n=360r/l=1800/13$ 度。", "正确材料满足 $0<5<13$，$0<n<360$；弧长 $n\\pi\\times13/180=10\\pi$，围成后高 $\\sqrt{13^2-5^2}=12$。", "第一套弧长虽为 $10\\pi$，但母线为 $12$，围成高为 $\\sqrt{119}$；第三套弧长为 $13\\pi$，与给定底圆不匹配；第四套对应半径为 $10$ 的圆锥，底面直径与目标不符。"], "contentVersion": "sha256:f5c50a5f98d6ae07175c6be99b7acf1f17dcb4498d40708e2daf62d372f2d78d", "contentVersions": ["sha256:4b230a7b53cdb717208dd5f12c1ecb35c882fa5ce827c62d80faff3a226a98fe", "sha256:f5c50a5f98d6ae07175c6be99b7acf1f17dcb4498d40708e2daf62d372f2d78d"]}, {"id": "j34-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j34-3"], "pointIds": ["pyjh.view.011", "pyjh.view.012", "pyjh.pyth.003"], "prompt": "一个已知的直三棱柱竖直放置，高 $7$ 厘米。它的俯视图底面三角形三个顶点可在水平面格纸上记为 $(0,0)$、$(6,0)$、$(3,4)$（每格 $1$ 厘米）。以第二坐标较小的一侧为前方，从前方沿第二坐标增大的方向看，主视图外轮廓为宽 $6$、高 $7$ 的矩形；左视图外轮廓为宽 $4$、高 $7$ 的矩形。用纸做它的封闭表面，每个面只用一层纸，不计粘贴舌头。所需纸的面积是多少平方厘米？", "options": [{"id": "a", "text": "$112$", "feedback": "封闭模型除了侧面，还需要检查两个底面是否都计入。"}, {"id": "b", "text": "$124$", "feedback": "上下两个底面是两个全等三角形，不能只计其中一个。"}, {"id": "c", "text": "$160$", "feedback": "俯视图的外接矩形不是底面本身，请核实底面三角形的面积。"}, {"id": "d", "text": "$136$", "feedback": "先按实际底面边长确定侧面矩形，再加两个三角形底面。"}], "correct": "d", "answer": "$136$", "reasoning": ["底面底边长为 $6$，对应高为 $4$；两腰均为 $\\sqrt{3^2+4^2}=5$，底面周长为 $5+5+6=16$。", "三个侧面分别为 $5\\times7$、$5\\times7$、$6\\times7$ 的矩形，总侧面积 $16\\times7=112$。", "每个底面面积为 $6\\times4/2=12$，封闭模型有两个底面，合计面积为 $112+2\\times12=136$ 平方厘米。", "可将三矩形按宽5、5、6拼成高7的横带，将两个底面三角形分别接在宽6矩形的上、下边，平面不重叠；折后各相接边等长，证明纸模型可组装。", "已知是直三棱柱且给出完整底面坐标，主、左视图的外轮廓尺寸只是交叉核对；内部棱的线型不影响本题面积。"], "contentVersion": "sha256:a193dbf90f4badc72c97374c897cad4b46b836fc885767ce61cc21c95b3f842b"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
