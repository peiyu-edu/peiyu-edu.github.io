<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 240" role="img" aria-labelledby="title desc"><title id="title">三条平行线被两条直线所截</title><desc id="desc">三条水平平行线自上而下为l1、l2、l3。左边一条直线依次交它们于A、B、C，右边一条直线依次交它们于D、E、F。</desc><style>path,circle,line,polyline,polygon,ellipse{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.cjk{font-family:"Noto Sans CJK SC",sans-serif}.dash{stroke-dasharray:6 5}.thin{stroke-width:1}.grid{stroke-width:1;stroke-dasharray:3 3;opacity:.55}.dot{fill:currentColor;stroke:none}.bar{fill:currentColor;fill-opacity:.35}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M30.00,50.00L240.00,50.00"/><path d="M30.00,100.00L240.00,100.00"/><path d="M30.00,200.00L240.00,200.00"/><path d="M102.50,12.50L60.50,222.50"/><path d="M107.00,20.00L226.70,219.50"/><text x="81.00" y="44.00" text-anchor="middle" font-size="20" font-style="italic">A</text><text x="70.00" y="94.00" text-anchor="middle" font-size="20" font-style="italic">B</text><text x="50.00" y="194.00" text-anchor="middle" font-size="20" font-style="italic">C</text><text x="141.00" y="44.00" text-anchor="middle" font-size="20" font-style="italic">D</text><text x="173.00" y="94.00" text-anchor="middle" font-size="20" font-style="italic">E</text><text x="233.00" y="194.00" text-anchor="middle" font-size="20" font-style="italic">F</text><text x="250.00" y="56.00" text-anchor="start" font-size="20" font-style="italic">l<tspan font-size="13" dy="5" font-style="normal">1</tspan></text><text x="250.00" y="106.00" text-anchor="start" font-size="20" font-style="italic">l<tspan font-size="13" dy="5" font-style="normal">2</tspan></text><text x="250.00" y="206.00" text-anchor="start" font-size="20" font-style="italic">l<tspan font-size="13" dy="5" font-style="normal">3</tspan></text></svg>
