<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 468 454" width="468" height="454" role="img" aria-labelledby="title desc">
<title id="title">线段 CD 与垂线 AM</title>
<desc id="desc">水平线段 CD，M 在 CD 上，线段 AM 竖直向上，A 在最上方，M 处标有直角记号。图中只有 A、C、D、M 四个点，其余部分待学生补全。</desc>
<style>text { fill:#17202a; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="468" height="454" fill="white"/>
<g transform="translate(-265.1 -230.6)">
<line x1="499.2" y1="281.6" x2="499.2" y2="627.2" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="294.4" y1="627.2" x2="704.0" y2="627.2" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<polyline points="515.2,627.2 515.2,611.2 499.2,611.2" fill="none" stroke="#17202a" stroke-width="2.5"/>
<text class="m" x="499.2" y="270.1" text-anchor="middle" font-size="30">A</text>
<text class="m" x="288.4" y="663.7" text-anchor="middle" font-size="30">C</text>
<text class="m" x="499.2" y="665.7" text-anchor="middle" font-size="30">M</text>
<text class="m" x="710.0" y="663.7" text-anchor="middle" font-size="30">D</text>
</g>
</svg>
