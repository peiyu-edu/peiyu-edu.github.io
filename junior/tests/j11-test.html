<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 11 章 不等式与不等式组 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j11-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 11 章 不等式与不等式组 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j11-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j11-test", "sectionId": "j11-test", "chapterId": "j11", "title": "第 11 章 不等式与不等式组 · 章末测验", "label": "章末测验", "sections": ["j11-1", "j11-2", "j11-3"], "items": [{"id": "j11-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j11-1"], "pointIds": ["pyjh.ineq.005", "pyjh.ineq.006"], "prompt": "若 $a>b$，下列不等式中错误的是哪一项？", "options": [{"id": "a", "text": "$a+2>b+2$", "feedback": "不等式两边加同一个数，不等号方向不变。"}, {"id": "b", "text": "$a-3>b-3$", "feedback": "不等式两边减同一个数，不等号方向不变。"}, {"id": "c", "text": "$-2a>-2b$", "feedback": "不等式两边乘同一个负数，不等号的方向要改变。"}, {"id": "d", "text": "$\\frac a3>\\frac b3$", "feedback": "不等式两边除以同一个正数，不等号方向不变。"}], "correct": "c", "answer": "$-2a>-2b$", "reasoning": ["不等式的性质 $3$：两边乘（或除以）同一个负数，不等号的方向改变。", "由 $a>b$ 得 $-2a<-2b$，所以 $-2a>-2b$ 是错误的；其余三项都成立。"], "contentVersion": "sha256:737caf327def400acec875c37734d21b8af975f274c5334959caf7db218cafe2"}, {"id": "j11-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j11-2"], "pointIds": ["pyjh.ineq.009", "pyjh.ineq.010"], "prompt": "不等式 $3x-5<7$ 的解集是什么？", "options": [{"id": "a", "text": "$x>4$", "feedback": "系数 $3$ 是正数，两边同除以 $3$，不等号方向不变。"}, {"id": "b", "text": "$x<4$", "feedback": "移项、合并后得 $3x<12$，再两边除以 $3$。"}, {"id": "c", "text": "$x<\\frac23$", "feedback": "移项时 $-5$ 移到右边要变成 $+5$。"}, {"id": "d", "text": "$x\\le4$", "feedback": "原不等式是「$<$」，不包含等号。"}], "correct": "b", "answer": "$x<4$", "reasoning": ["移项：$3x<7+5$，即 $3x<12$。", "两边除以正数 $3$，不等号方向不变：$x<4$。"], "contentVersion": "sha256:ede50fca4d9e5169b42bc253fad5bb56397d13b3021590b16eeb9f8062b79bb4"}, {"id": "j11-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j11-1"], "pointIds": ["pyjh.ineq.004", "pyjh.ineq.002"], "prompt": "在数轴上表示 $x\\ge-1$，正确的画法是哪一项？", "options": [{"id": "a", "text": "在 $-1$ 处画空心圆圈，向左画线", "feedback": "「$\\ge$」包含 $-1$，要用实心圆点；大于向右。"}, {"id": "b", "text": "在 $-1$ 处画空心圆圈，向右画线", "feedback": "「$\\ge$」包含 $-1$ 本身，不能用空心圆圈。"}, {"id": "c", "text": "在 $-1$ 处画实心圆点，向右画线", "feedback": "包含端点用实心圆点，「大于」向右。"}, {"id": "d", "text": "在 $-1$ 处画实心圆点，向左画线", "feedback": "$x$ 比 $-1$ 大，应向右画。"}], "correct": "c", "answer": "在 $-1$ 处画实心圆点，向右画线", "reasoning": ["「$\\ge$」表示大于或等于，$-1$ 也是解，端点画实心圆点。", "大于 $-1$ 的数在 $-1$ 的右边，所以向右画线。"], "contentVersion": "sha256:f739536208756ecc0659b32f7a98ddf1368ba65acafd4abef198d279d10f01b0"}, {"id": "j11-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j11-1"], "pointIds": ["pyjh.ineq.003"], "prompt": "下列各数中，哪一个是不等式 $2x+1>4$ 的解？", "options": [{"id": "a", "text": "$-1$", "feedback": "代入得 $-1>4$，不成立。"}, {"id": "b", "text": "$0$", "feedback": "代入得 $1>4$，不成立。"}, {"id": "c", "text": "$1$", "feedback": "代入得 $3>4$，不成立。"}, {"id": "d", "text": "$2$", "feedback": "把各数代入不等式左边，看是否大于 $4$。"}], "correct": "d", "answer": "$2$", "reasoning": ["使不等式成立的未知数的值叫不等式的解，可以逐个代入检验。", "$2\\times2+1=5>4$ 成立，其余三个数代入都不成立。"], "contentVersion": "sha256:23bee8a8d5255ecc08c4eadd7ef9c658ee81b76f19683cc7761b78dbc2ddea46"}, {"id": "j11-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j11-1"], "pointIds": ["pyjh.ineq.001", "pyjh.ineq.002"], "prompt": "「$x$ 的 $3$ 倍与 $5$ 的差不大于 $7$」用不等式表示，正确的是哪一项？", "options": [{"id": "a", "text": "$3x-5\\le7$", "feedback": "「不大于」就是「小于或等于」。"}, {"id": "b", "text": "$3x-5<7$", "feedback": "「不大于」包含等于的情况。"}, {"id": "c", "text": "$3(x-5)\\le7$", "feedback": "先求 $x$ 的 $3$ 倍，再与 $5$ 作差，不是先作差。"}, {"id": "d", "text": "$3x-5\\ge7$", "feedback": "「不大于」是 $\\le$，不是 $\\ge$。"}], "correct": "a", "answer": "$3x-5\\le7$", "reasoning": ["$x$ 的 $3$ 倍与 $5$ 的差是 $3x-5$。", "「不大于」即「$\\le$」，所以 $3x-5\\le7$。"], "contentVersion": "sha256:b711b8556b1849ebc4ba2e5f2db35a80d571f4b8802f765cad57f193c4aa847d"}, {"id": "j11-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j11-1", "j11-2"], "pointIds": ["pyjh.ineq.010", "pyjh.ineq.006"], "prompt": "解不等式 $\\frac{x-1}2-\\frac{2x+1}3\\ge1$，解集是什么？", "options": [{"id": "a", "text": "$x\\ge-11$", "feedback": "最后一步两边除以 $-1$，不等号方向要改变。"}, {"id": "b", "text": "$x\\le-6$", "feedback": "去分母时，右边的 $1$ 也要乘 $6$。"}, {"id": "c", "text": "$x\\le-11$", "feedback": "去分母、去括号、移项、合并，最后两边除以负数要变号。"}, {"id": "d", "text": "$x\\ge11$", "feedback": "合并同类项时 $x$ 的系数是 $-1$，常数项也要算准。"}], "correct": "c", "answer": "$x\\le-11$", "reasoning": ["两边乘 $6$：$3(x-1)-2(2x+1)\\ge6$。", "去括号：$3x-3-4x-2\\ge6$，合并：$-x-5\\ge6$，即 $-x\\ge11$。", "两边除以 $-1$，不等号方向改变：$x\\le-11$。"], "contentVersion": "sha256:552da88e72bd02c2b9b6d8cb7be125de444ab79c0283c117b9711d0e7a08b535"}, {"id": "j11-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j11-3"], "pointIds": ["pyjh.ineq.015", "pyjh.ineq.014"], "prompt": "不等式组 $\\begin{cases}2x+1>-3\\\\x-2\\le1\\end{cases}$ 的解集是什么？", "options": [{"id": "a", "text": "$-2\\le x<3$", "feedback": "两个端点的「包含」情况对调了：$2x+1>-3$ 不含等号。"}, {"id": "b", "text": "$x>-2$", "feedback": "这只是第一个不等式的解集，还要和第二个取公共部分。"}, {"id": "c", "text": "$-1<x\\le3$", "feedback": "第一个不等式解得的端点算错了。"}, {"id": "d", "text": "$-2<x\\le3$", "feedback": "分别解两个不等式，再在数轴上找公共部分。"}], "correct": "d", "answer": "$-2<x\\le3$", "reasoning": ["解 $2x+1>-3$：$2x>-4$，$x>-2$。", "解 $x-2\\le1$：$x\\le3$。", "公共部分为 $-2<x\\le3$。"], "contentVersion": "sha256:e8ef9311c0a50f02a55ccc08c38aa9b83af698e70e09bd87581b0d4b794af73e"}, {"id": "j11-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j11-3"], "pointIds": ["pyjh.ineq.017", "pyjh.ineq.015"], "prompt": "不等式组 $\\begin{cases}1-x<2\\\\\\frac{x+5}2\\ge x\\end{cases}$ 的所有整数解的和是多少？", "options": [{"id": "a", "text": "$10$", "feedback": "端点 $5$ 满足「$\\le$」，也是整数解。"}, {"id": "b", "text": "$15$", "feedback": "先求解集，再列出其中所有整数相加。"}, {"id": "c", "text": "$21$", "feedback": "$1-x<2$ 解得 $x>-1$，不包含 $-1$；$x$ 也不能取到 $6$。"}, {"id": "d", "text": "$6$", "feedback": "这是整数解的个数，题目问的是和。"}], "correct": "b", "answer": "$15$", "reasoning": ["解 $1-x<2$：$x>-1$；解 $\\frac{x+5}2\\ge x$：$x+5\\ge2x$，$x\\le5$。", "解集 $-1<x\\le5$，整数解为 $0,1,2,3,4,5$。", "和为 $0+1+2+3+4+5=15$。"], "contentVersion": "sha256:12e0fc8d411cbcf80b71d48fb0159c62579a14188da5b9f53c0992a8dbcc4e5a"}, {"id": "j11-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j11-3"], "pointIds": ["pyjh.ineq.016", "pyjh.ineq.014"], "prompt": "关于 $x$ 的不等式组 $\\begin{cases}x>a\\\\x<3\\end{cases}$ 无解，$a$ 的取值范围是什么？", "options": [{"id": "a", "text": "$a>3$", "feedback": "要单独检验 $a=3$ 时不等式组有没有解。"}, {"id": "b", "text": "$a\\le3$", "feedback": "$a<3$ 时，$a$ 与 $3$ 之间的数都是解，不等式组有解。"}, {"id": "c", "text": "$a\\ge3$", "feedback": "在数轴上画出两部分，看什么时候没有公共部分，并单独检验 $a=3$。"}, {"id": "d", "text": "$a<3$", "feedback": "这是不等式组有解的条件。"}], "correct": "c", "answer": "$a\\ge3$", "reasoning": ["$a<3$ 时，解集是 $a<x<3$，有解。", "$a=3$ 时，$x>3$ 与 $x<3$ 没有公共部分；$a>3$ 时也没有公共部分。", "所以 $a\\ge3$。"], "contentVersion": "sha256:44e7081da8c77555d2a5341229905a45385d6de9c4f8b308a20543b991ef9821"}, {"id": "j11-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j11-2"], "pointIds": ["pyjh.ineq.011", "pyjh.ineq.012"], "prompt": "小明有 $40$ 元，买了 $3$ 支每支 $2$ 元的笔后，用剩下的钱买每本 $5$ 元的笔记本。他最多能买几本笔记本？", "options": [{"id": "a", "text": "$8$ 本", "feedback": "先扣去买笔用的钱，再算笔记本。"}, {"id": "b", "text": "$7$ 本", "feedback": "$7$ 本笔记本加上笔共 $41$ 元，超过了 $40$ 元。"}, {"id": "c", "text": "$5$ 本", "feedback": "再多买一本，总花费是否超过 $40$ 元？钱可能还够。"}, {"id": "d", "text": "$6$ 本", "feedback": "列不等式求出解集后，在其中取最大的正整数。"}], "correct": "d", "answer": "$6$ 本", "reasoning": ["设买 $x$ 本笔记本，$5x+3\\times2\\le40$，$5x\\le34$，$x\\le6.8$。", "$x$ 是正整数，最大取 $6$。"], "contentVersion": "sha256:76862b3a1616711cfe342b061c94f5eaeb372564d38f5bc8b1ebc9dc92946c84"}, {"id": "j11-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j11-2"], "pointIds": ["pyjh.ineq.013", "pyjh.ineq.011"], "prompt": "甲商场所有商品打九折；乙商场购物不超过 $200$ 元不打折，超过 $200$ 元的部分打八折。某人购物的原价总额为 $x$ 元（$x>200$），$x$ 在什么范围内时去乙商场更省钱？", "options": [{"id": "a", "text": "$x<400$", "feedback": "比较的方向反了：乙商场更省，是乙的花费小于甲的花费。"}, {"id": "b", "text": "$x>200$", "feedback": "$x>200$ 只是乙商场开始打折的条件，还要比较两商场的花费。"}, {"id": "c", "text": "$x>360$", "feedback": "乙的花费是 $200+0.8(x-200)$，展开时常数项要算准。"}, {"id": "d", "text": "$x>400$", "feedback": "列出乙的花费小于甲的花费，再解不等式。"}], "correct": "d", "answer": "$x>400$", "reasoning": ["甲商场花费 $0.9x$ 元；乙商场花费 $200+0.8(x-200)=0.8x+40$（元）。", "乙更省：$0.8x+40<0.9x$，$0.1x>40$，$x>400$。", "$x>400$ 满足 $x>200$。"], "contentVersion": "sha256:451a982680cdc1075bc2d539056b5ed9dae0a17b759673a18bdcfdf13d8b7cda"}, {"id": "j11-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j11-3"], "pointIds": ["pyjh.ineq.017", "pyjh.ineq.015"], "prompt": "关于 $x$ 的不等式组 $\\begin{cases}x-m<0\\\\3-2x\\le1\\end{cases}$ 恰好有 $3$ 个整数解，$m$ 的取值范围是什么？", "options": [{"id": "a", "text": "$3\\le m<4$", "feedback": "两个端点都要代回检验：$m=3$ 和 $m=4$ 时各有几个整数解？"}, {"id": "b", "text": "$3<m\\le4$", "feedback": "解集为 $1\\le x<m$，整数解是 $1,2,3$，再分别检验端点 $m=3$ 和 $m=4$。"}, {"id": "c", "text": "$3<m<4$", "feedback": "右端点 $m=4$ 是否满足「恰好 $3$ 个整数解」，要代回检验。"}, {"id": "d", "text": "$3\\le m\\le4$", "feedback": "左端点 $m=3$ 是否满足「恰好 $3$ 个整数解」，要代回检验。"}], "correct": "b", "answer": "$3<m\\le4$", "reasoning": ["解 $3-2x\\le1$ 得 $x\\ge1$；解 $x-m<0$ 得 $x<m$。解集为 $1\\le x<m$。", "恰好有 $3$ 个整数解，就是 $1,2,3$，所以 $3<m\\le4$。", "检验端点：$m=4$ 时 $1\\le x<4$，整数解 $1,2,3$；$m=3$ 时只有 $1,2$。"], "contentVersion": "sha256:be3f2945f8e80168477ab51c403ae64d9960cb868b42bf78bc9506de27c6c3de"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
