<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 140" role="img" aria-labelledby="title desc"><title id="title">四个一笔画图形</title><desc id="desc">四个图形依次标 A 到 D。图 A 是五角星轮廓；图 B 是上下错开相接的两个矩形，每个矩形各画一条对角线；图 C 是一个大圆，内部有一个与它在左侧相切的小圆；图 D 是由一个尖朝上和一个尖朝下的正三角形叠成的六角星，并有一条连接上下两个尖的竖直线段。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.s{fill:currentColor;fill-opacity:.15;stroke:none}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M70.00,18.00L81.76,53.82L119.45,53.93L89.02,76.18L100.56,112.07L70.00,90.00L39.44,112.07L50.98,76.18L20.55,53.93L58.24,53.82Z" /><text x="16.00" y="76.00" text-anchor="middle" font-size="18">A.</text><rect x="206" y="66" width="62" height="36" /><rect x="240" y="30" width="62" height="36" /><path d="M206.00,102.00L268.00,66.00" /><path d="M240.00,66.00L302.00,30.00" /><text x="168.00" y="76.00" text-anchor="middle" font-size="18">B.</text><circle cx="420" cy="70" r="48" /><circle cx="397" cy="70" r="25" /><text x="346.00" y="76.00" text-anchor="middle" font-size="18">C.</text><path d="M590.00,18.00L635.03,96.00L544.97,96.00Z" /><path d="M590.00,122.00L544.97,44.00L635.03,44.00Z" /><path d="M590.00,18.00L590.00,122.00" /><text x="506.00" y="76.00" text-anchor="middle" font-size="18">D.</text></svg>
