<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 300" role="img" aria-labelledby="title desc"><title id="title">正方形 ABCD 中的线段</title><desc id="desc">正方形 ABCD，A 左上、D 右上、C 右下、B 左下；E、F、G 分别在 AB、BC、CD 上（各边中点）。画出 AF、DE、对角线 BD 和线段 MG，其中 M 为 AF 与 DE 的交点，N 为 BD 与 AF 的交点，P 为 BD 与 MG 的交点。</desc><style>path,circle,ellipse,line,polyline,polygon{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.sh{fill:currentColor;fill-opacity:.15;stroke:none}.dot{fill:currentColor;stroke:none}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M50.00,30.00L50.00,250.00L270.00,250.00L270.00,30.00Z" /><path d="M50.00,30.00L160.00,250.00" /><path d="M270.00,30.00L50.00,140.00" /><path d="M50.00,250.00L270.00,30.00" /><path d="M94.00,118.00L270.00,140.00" /><text x="38.00" y="24.00" text-anchor="middle" font-size="22" font-style="italic">A</text><text x="282.00" y="24.00" text-anchor="middle" font-size="22" font-style="italic">D</text><text x="282.00" y="270.00" text-anchor="middle" font-size="22" font-style="italic">C</text><text x="38.00" y="270.00" text-anchor="middle" font-size="22" font-style="italic">B</text><text x="36.00" y="148.00" text-anchor="middle" font-size="22" font-style="italic">E</text><text x="160.00" y="272.00" text-anchor="middle" font-size="22" font-style="italic">F</text><text x="284.00" y="148.00" text-anchor="middle" font-size="22" font-style="italic">G</text><text x="100.00" y="106.00" text-anchor="middle" font-size="22" font-style="italic">M</text><text x="98.00" y="182.00" text-anchor="middle" font-size="22" font-style="italic">N</text><text x="176.22" y="151.78" text-anchor="middle" font-size="22" font-style="italic">P</text></svg>