<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 190" role="img" aria-labelledby="title desc">
<title id="title">题设图</title><desc id="desc">四个盲盒依次对应A云雾茶、B豆丹、C沙光鱼、D东海水晶，每盒一种玩具。</desc>
<style>:root{--ink:#172c3c;--shade:#c8d5de;--strong:#6e8798;--paper:#fff}text{font-family:"Noto Sans CJK SC",sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--ink:#eff4f8;--shade:#405969;--strong:#91a8b7;--paper:#12212d}}</style>
<path d="M45.000,35.000 L145.000,35.000 L145.000,125.000 L45.000,125.000 Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2" /><path d="M45.000,55.000 L145.000,55.000" fill="none" stroke="var(--ink)" stroke-width="2" /><text x="95" y="93" font-size="18" text-anchor="middle">盲盒</text><text x="95" y="163" font-size="18" text-anchor="middle">A云雾茶</text><path d="M220.000,35.000 L320.000,35.000 L320.000,125.000 L220.000,125.000 Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2" /><path d="M220.000,55.000 L320.000,55.000" fill="none" stroke="var(--ink)" stroke-width="2" /><text x="270" y="93" font-size="18" text-anchor="middle">盲盒</text><text x="270" y="163" font-size="18" text-anchor="middle">B豆丹</text><path d="M395.000,35.000 L495.000,35.000 L495.000,125.000 L395.000,125.000 Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2" /><path d="M395.000,55.000 L495.000,55.000" fill="none" stroke="var(--ink)" stroke-width="2" /><text x="445" y="93" font-size="18" text-anchor="middle">盲盒</text><text x="445" y="163" font-size="18" text-anchor="middle">C沙光鱼</text><path d="M570.000,35.000 L670.000,35.000 L670.000,125.000 L570.000,125.000 Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2" /><path d="M570.000,55.000 L670.000,55.000" fill="none" stroke="var(--ink)" stroke-width="2" /><text x="620" y="93" font-size="18" text-anchor="middle">盲盒</text><text x="620" y="163" font-size="18" text-anchor="middle">D东海水晶</text></svg>