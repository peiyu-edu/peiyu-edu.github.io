<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 350" role="img" aria-labelledby="title desc">
<title id="title">题设图</title><desc id="desc">七年级成绩条形图：A组3人，B组m人，C组7人，D组4人；右侧列出A至D四个成绩区间。</desc>
<style>:root{--ink:#172c3c;--shade:#c8d5de;--strong:#6e8798;--paper:#fff}text{font-family:"Noto Sans CJK SC",sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--ink:#eff4f8;--shade:#405969;--strong:#91a8b7;--paper:#12212d}}</style>
<path d="M60.000,275.000 L390.000,275.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M383.000,271.000 L390.000,275.000 L383.000,279.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M60.000,275.000 L60.000,50.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M56.000,57.000 L60.000,50.000 L64.000,57.000" fill="none" stroke="var(--ink)" stroke-width="2" /><text x="47" y="297" font-size="18" text-anchor="middle">O</text><text x="400" y="298" font-size="16" text-anchor="middle">组别</text><text x="39" y="51" font-size="16" text-anchor="middle">人数</text><path d="M90.000,200.000 L125.000,200.000 L125.000,275.000 L90.000,275.000 Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2" /><text x="108" y="302" font-size="18" text-anchor="middle">A</text><path d="M160.000,125.000 L195.000,125.000 L195.000,275.000 L160.000,275.000 Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2" /><text x="178" y="302" font-size="18" text-anchor="middle">B</text><path d="M230.000,100.000 L265.000,100.000 L265.000,275.000 L230.000,275.000 Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2" /><text x="248" y="302" font-size="18" text-anchor="middle">C</text><path d="M300.000,175.000 L335.000,175.000 L335.000,275.000 L300.000,275.000 Z" fill="var(--shade)" stroke="var(--ink)" stroke-width="2" /><text x="318" y="302" font-size="18" text-anchor="middle">D</text><path d="M60.000,200.000 L340.000,200.000" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 5" /><text x="46" y="206" font-size="16" text-anchor="end">3</text><path d="M60.000,175.000 L340.000,175.000" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 5" /><text x="46" y="181" font-size="16" text-anchor="end">4</text><path d="M60.000,125.000 L340.000,125.000" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 5" /><text x="46" y="131" font-size="16" text-anchor="end">m</text><path d="M60.000,100.000 L340.000,100.000" fill="none" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 5" /><text x="46" y="106" font-size="16" text-anchor="end">7</text><text x="535" y="70" font-size="17" text-anchor="middle">A组：60≤x&lt;70</text><text x="535" y="113" font-size="17" text-anchor="middle">B组：70≤x&lt;80</text><text x="535" y="156" font-size="17" text-anchor="middle">C组：80≤x&lt;90</text><text x="535" y="199" font-size="17" text-anchor="middle">D组：90≤x≤100</text><text x="535" y="242" font-size="17" text-anchor="middle">x表示竞赛成绩</text></svg>