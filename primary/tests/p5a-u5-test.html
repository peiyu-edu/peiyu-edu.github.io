<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五年级上册 第五单元 用字母表示数和数量关系 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p5a-u5-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>五年级上册 第五单元 用字母表示数和数量关系 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p5a-u5-test", "sectionId": "p5a-u5-test", "unitId": "p5a-u5", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "五年级上册 第五单元 用字母表示数和数量关系 单元测评", "items": [{"id": "p5a-u5-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "小明今年 a 岁，爸爸比小明大 28 岁。用含有字母的式子表示爸爸今年的岁数。", "answer": "(a + 28) 岁", "reasoning": ["爸爸比小明大 28 岁，爸爸的岁数 = 小明的岁数 + 28。", "所以爸爸今年 (a + 28) 岁。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u5.001"], "contentVersion": "sha256:a4f65d38e278eec268d864711d0a28d30d38ec2dd15ec384859474a1a0ab3f14"}, {"id": "p5a-u5-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "b × 4 省略乘号，正确的写法是哪个？", "answer": "4b", "reasoning": ["数和字母相乘，乘号可以省略，数写在字母前面。", "b × 4 写成 4b。"], "options": [{"id": "a", "text": "b4", "feedback": "数要写在字母前面。"}, {"id": "b", "text": "4 + b", "feedback": "4 + b 是加法，不是乘法。"}, {"id": "c", "text": "4b", "feedback": "对。数和字母相乘，省略乘号，数写在字母前面。"}], "correct": "c", "pointIds": ["pyps.p5a.u5.002"], "contentVersion": "sha256:03a7034d114af76da06200243c089d32f6e83883249448e9ec9a8aaeb44f6bb0"}, {"id": "p5a-u5-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "a² 表示什么？", "answer": "a × a", "reasoning": ["a² 读作 a 的平方，表示 a × a。", "2a 表示 a × 2，也就是 a + a，两者意思不同。"], "options": [{"id": "a", "text": "a × 2", "feedback": "a × 2 写成 2a，表示两个 a 相加。"}, {"id": "b", "text": "a + 2", "feedback": "右上角的 2 不是加 2。"}, {"id": "c", "text": "a × a", "feedback": "对。a² 表示两个 a 相乘。"}], "correct": "c", "pointIds": ["pyps.p5a.u5.004"], "contentVersion": "sha256:7ce1fce1741ca65bc3b57142e20481b8a3abfc062877fedc05e42e9477c47ad2"}, {"id": "p5a-u5-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "正方形的边长是 a。用字母表示它的周长 C 和面积 S。", "answer": "C = 4a，S = a²", "reasoning": ["周长 = 边长 × 4，写成 C = 4a。", "面积 = 边长 × 边长，写成 S = a × a = a²。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u5.003"], "contentVersion": "sha256:a7b08abce05fb13129a7f7bd2e01ed116ca56393cf2d50f86f09be908436b915", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"45\" y=\"35\" width=\"145\" height=\"110\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><text x=\"117.5\" y=\"168\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">a<\/text><text x=\"257\" y=\"95\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\"><\/text><text x=\"117.5\" y=\"95\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\"><\/text><\/svg>"}, {"id": "p5a-u5-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "当 x = 6 时，3x + 5 的值是多少？", "answer": "23", "reasoning": ["3x 表示 3 × x，把 6 代进去：3 × 6 = 18。", "18 + 5 = 23。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u5.002"], "contentVersion": "sha256:87c2c2b581fc0d6e89a9019c82ccff2a057c1865be820f2d95a744f174a61eea"}, {"id": "p5a-u5-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "当 a = 2 时，a² 和 2a 比较，哪句话对？", "answer": "一样大", "reasoning": ["a² = a × a，a = 2 时是 2 × 2 = 4。", "2a = 2 × a，a = 2 时也是 2 × 2 = 4。", "这时两个式子一样大，但它们的意思不同：换一个数就不一定相等了。"], "options": [{"id": "a", "text": "a² 大", "feedback": "a² = 2 × 2 = 4，2a = 2 × 2 = 4，一样大。"}, {"id": "b", "text": "2a 大", "feedback": "把 2 代进去算一算，两个都是 4。"}, {"id": "c", "text": "一样大", "feedback": "对。a = 2 时，两个式子都等于 4。"}], "correct": "c", "pointIds": ["pyps.p5a.u5.004"], "contentVersion": "sha256:5fae6e95ed1d8127d52cf6426e34dbc90523bd972cf2b8d0760984ae25b808d5"}, {"id": "p5a-u5-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "已知 x + 2.4 = 7。根据等式的性质，两边同时减去 2.4，x 等于多少？", "answer": "x = 4.6", "reasoning": ["等式两边同时减去同一个数，等式仍然成立。", "x + 2.4 − 2.4 = 7 − 2.4，所以 x = 4.6。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u5.005"], "contentVersion": "sha256:39a32ccb1cd93a0a4ca696c74e7d2409e20244d88ac0079f6367b0ea0ca4b1de"}, {"id": "p5a-u5-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "已知 a = b。下面哪个式子是错的？", "answer": "a ÷ 0 = b ÷ 0", "reasoning": ["等式两边同时加、减同一个数，等式仍然成立。", "两边同时除以同一个数时，这个数不能是 0，所以 a ÷ 0 = b ÷ 0 是错的。"], "options": [{"id": "a", "text": "a + 5 = b + 5", "feedback": "两边同时加 5，等式仍然成立。"}, {"id": "b", "text": "a ÷ 0 = b ÷ 0", "feedback": "对，这个是错的。0 不能作除数。"}, {"id": "c", "text": "a − 3 = b − 3", "feedback": "两边同时减 3，等式仍然成立。"}], "correct": "b", "pointIds": ["pyps.p5a.u5.005"], "contentVersion": "sha256:ab0bbe9a5f0a7c3ee86bdcb04834e1df9cd30b4f3b65824ae0749b16799888af"}, {"id": "p5a-u5-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "用小棒连着摆三角形（相邻两个三角形共用一根）：摆 1 个用 3 根，以后每多摆 1 个，就多用 2 根。摆 n 个三角形要用多少根？摆 10 个呢？", "answer": "(2n + 1) 根；摆 10 个要用 21 根", "reasoning": ["可以看成先放 1 根，以后每摆 1 个三角形添 2 根，摆 n 个要用 (1 + 2n) 根，也就是 (2n + 1) 根。", "检验：n = 1 时，2 × 1 + 1 = 3，对。", "n = 10 时，2 × 10 + 1 = 21（根）。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u5.006", "pyps.p5a.u5.002"], "contentVersion": "sha256:9d816bc54c3e3c19c8581081ea966be31a893fa229916fb166df67d91234d3a3", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"35,120 70,50 105,120\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><polygon points=\"70,50 105,120 140,50\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><polygon points=\"105,120 140,50 175,120\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><text x=\"150\" y=\"165\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">相邻三角形共用一根小棒<\/text><\/svg>"}, {"id": "p5a-u5-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "化简：5x + 3x − x", "answer": "7x", "reasoning": ["x 就是 1x。", "照乘法分配律，把前面的数相加减：5 + 3 − 1 = 7，所以结果是 7x。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u5.007"], "contentVersion": "sha256:c31173b95c8d4b725029a4d7858d26a4c9c699fd3534c2249bdef7f03f9ad1a1"}, {"id": "p5a-u5-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "在百数表中，一个数是 a（它不在最右边一列，也不在最下面一行）。它右边的数和它正下方的数分别怎样表示？", "answer": "右边的数是 a + 1，正下方的数是 a + 10", "reasoning": ["百数表中，同一行左右相邻的数相差 1，右边的数是 a + 1。", "同一列上下相邻的数相差 10，正下方的数是 a + 10。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u5.008"], "contentVersion": "sha256:2b3f3945319c6f8fb91e81226bb69dde1e6bcde5a65632c46e9ed785be6a1df6", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"75\" y=\"32\" width=\"48\" height=\"42\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"99\" y=\"60\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">a<\/text><rect x=\"123\" y=\"32\" width=\"48\" height=\"42\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"147\" y=\"60\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">？<\/text><rect x=\"75\" y=\"74\" width=\"48\" height=\"42\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"99\" y=\"102\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">？<\/text><text x=\"150\" y=\"179\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">百数表局部<\/text><\/svg>"}, {"id": "p5a-u5-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个长方形的长是 a 米，宽是 6 米。用字母表示它的面积 S；当 a = 8.5 时，面积是多少平方米？", "answer": "S = 6a，面积是 51 平方米", "reasoning": ["长方形面积 = 长 × 宽，S = a × 6，写成 S = 6a。", "a = 8.5 时，S = 6 × 8.5 = 51（平方米）。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u5.003", "pyps.p5a.u5.002", "pyps.p5a.u2.001"], "contentVersion": "sha256:4b7a9af4565007310fb2a0b7c4aa674b76a6a938040f500bd02a4d77beeaa67e", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"45\" y=\"35\" width=\"170\" height=\"110\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><text x=\"130.0\" y=\"168\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">a 米<\/text><text x=\"257\" y=\"95\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">6 米<\/text><text x=\"130.0\" y=\"95\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\"><\/text><\/svg>"}], "contentVersion": "sha256:16dd999fa2bb408d5a981a029d3e637d99a23836c4c2b0770cce8c039bdb1754"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
