<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级下册 第一单元 认识平面图形 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p1b-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级下册 第一单元 认识平面图形 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1b-u1-test", "sectionId": "p1b-u1-test", "unitId": "p1b-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级下册 第一单元 认识平面图形 单元测评", "items": [{"id": "p1b-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一枚 1 元硬币，它平平的面是什么形状？", "answer": "圆", "reasoning": ["硬币的面圆圆的，没有尖尖的角。", "它是圆。"], "options": [{"id": "a", "text": "圆", "feedback": "对。硬币的面圆圆的，没有角。"}, {"id": "b", "text": "三角形", "feedback": "三角形有 3 个尖尖的角，硬币的面没有角。"}, {"id": "c", "text": "正方形", "feedback": "正方形有 4 个尖尖的角，硬币的面没有角。"}], "correct": "a", "pointIds": ["pyps.p1b.u1.001"], "contentVersion": "sha256:1172f00e4224a6bd61cbff1b2a9908b3f3b5bfef51c4dee6c60234b7c5a0be20"}, {"id": "p1b-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "红领巾展开铺平，像哪种图形？", "answer": "三角形", "reasoning": ["红领巾铺平后有 3 条直直的边、3 个尖尖的角。", "它像三角形。"], "options": [{"id": "a", "text": "三角形", "feedback": "对。红领巾有 3 条边、3 个角。"}, {"id": "b", "text": "长方形", "feedback": "长方形有 4 条边，红领巾只有 3 条边。"}, {"id": "c", "text": "圆", "feedback": "圆没有角，红领巾有尖尖的角。"}], "correct": "a", "pointIds": ["pyps.p1b.u1.001"], "contentVersion": "sha256:d7580a9adea18679b170ea338b405727e0d703e89a8af687a063a2bf59b7a588"}, {"id": "p1b-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "把正方体的一个面贴在纸上，沿着边描一圈，画出的是什么图形？", "answer": "正方形", "reasoning": ["正方体的面都是平平的，每个面 4 条边一样长。", "描下来是正方形。"], "options": [{"id": "a", "text": "长方形", "feedback": "正方体每个面的 4 条边一样长，画出的是正方形。"}, {"id": "b", "text": "圆", "feedback": "正方体的面是平平的，有尖尖的角，画不出圆。"}, {"id": "c", "text": "正方形", "feedback": "对。正方体的面 4 条边一样长，描出来是正方形。"}], "correct": "c", "pointIds": ["pyps.p1b.u1.002"], "contentVersion": "sha256:d923ac29cafa1c4796603e1a71047e9c1a71a1b06274f56639f827300ab23d9d"}, {"id": "p1b-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "把圆柱竖着放在纸上，沿着它下面那个平平的面描一圈，画出的是什么图形？", "answer": "圆", "reasoning": ["圆柱上下两个平平的面都是圆圆的。", "描下来是圆。"], "options": [{"id": "a", "text": "三角形", "feedback": "圆柱平平的面没有角，描出来不是三角形。"}, {"id": "b", "text": "长方形", "feedback": "圆柱平平的面没有角，描出来不是长方形。"}, {"id": "c", "text": "圆", "feedback": "对。圆柱平平的面是圆。"}], "correct": "c", "pointIds": ["pyps.p1b.u1.002"], "contentVersion": "sha256:86258c653b36242da8b9d71986ab1e6506bad76359f14f8d14523c298cba0ac9"}, {"id": "p1b-u1-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用 2 个同样大的正方形，边对边拼在一起，拼成的是什么图形？", "answer": "长方形", "reasoning": ["2 个同样的正方形并排放好。", "拼成的图形长长的，有 4 条边，是长方形。"], "options": [{"id": "a", "text": "正方形", "feedback": "拼好后一边长、一边短，不是正方形。"}, {"id": "b", "text": "长方形", "feedback": "对。2 个正方形并排，拼成长长的长方形。"}, {"id": "c", "text": "三角形", "feedback": "拼好后有 4 条边，不是三角形。"}], "correct": "b", "pointIds": ["pyps.p1b.u1.003"], "contentVersion": "sha256:98066b775023ab5629162bcbd9e3897caf7cae0e80acc3fc4a0f7713524d402a"}, {"id": "p1b-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一张正方形的纸，从一个角到对面的角剪一刀，剪成的 2 块是什么图形？", "answer": "2 个三角形", "reasoning": ["从一个角剪到对面的角，每块都只剩 3 条边。", "所以剪成 2 个三角形。"], "options": [{"id": "a", "text": "2 个长方形", "feedback": "剪开后每块只有 3 条边，不是长方形。"}, {"id": "b", "text": "2 个三角形", "feedback": "对。每块都有 3 条边、3 个角。"}, {"id": "c", "text": "2 个正方形", "feedback": "剪开后每块只有 3 条边，不是正方形。"}], "correct": "b", "pointIds": ["pyps.p1b.u1.004"], "contentVersion": "sha256:5ee29cfbdd2c3c8c41f059f6f3afa20f0bb052583b01f161b8693b183983d6a9"}, {"id": "p1b-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一副七巧板一共有几块？", "answer": "7 块", "reasoning": ["七巧板有 5 个三角形、1 个正方形、1 个平行四边形。", "5 + 1 + 1 = 7，一共 7 块。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u1.005"], "contentVersion": "sha256:451b0e9de338f7c150ffa1c46405579947baea3b668f4691ae1f7f4adf169985"}, {"id": "p1b-u1-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一副七巧板里，三角形有几块？", "answer": "5 块", "reasoning": ["七巧板的三角形有：2 个大的、1 个中的、2 个小的。", "2 + 1 + 2 = 5，一共 5 块。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u1.005"], "contentVersion": "sha256:1393346c295201aef1ff6fb97f2c41151186f718d08df7a3ac505a5a7c96cfe5"}, {"id": "p1b-u1-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用一副七巧板里的 2 个小三角形，能拼成下面哪个图形？", "answer": "正方形", "reasoning": ["把 2 个小三角形最长的那条边对齐拼在一起。", "拼成的是一个正方形。"], "options": [{"id": "a", "text": "圆", "feedback": "三角形的边都是直直的，拼不出圆。"}, {"id": "b", "text": "正方形", "feedback": "对。2 个小三角形最长的边对齐，就拼成正方形。"}, {"id": "c", "text": "什么图形也拼不成", "feedback": "试着把 2 个小三角形最长的边对齐。"}], "correct": "b", "pointIds": ["pyps.p1b.u1.006"], "contentVersion": "sha256:1bc33a035db4192c13377c69f6970017a9fc85f807e530aa072ea9ec67dd7b22"}, {"id": "p1b-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "看这串图形：○ △ □ △ ○ △ □。三角形和圆一共有几个？", "answer": "3 + 2 = 5（个）", "reasoning": ["先分别数：△ 有 3 个，○ 有 2 个。", "合起来用加法：3 + 2 = 5（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u1.001", "pyps.p1a.u1.006"], "contentVersion": "sha256:78bcefb8fd8964010421a290c170d791b13641244cf05f44541fb96a71efee66"}, {"id": "p1b-u1-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "用 4 个同样大的小正方形拼成 1 个大正方形，应该怎样摆？", "answer": "每行 2 个，摆 2 行", "reasoning": ["正方形的 4 条边一样长。", "每行摆 2 个、摆 2 行，横着和竖着一样长，拼成大正方形。"], "options": [{"id": "a", "text": "每行 2 个，摆 2 行", "feedback": "对。每行 2 个、摆 2 行，四周一样长，是大正方形。"}, {"id": "b", "text": "4 个摆成一行", "feedback": "摆成一行是长长的长方形，不是正方形。"}, {"id": "c", "text": "上面一行 3 个，下面一行 1 个", "feedback": "这样拼出来不是一个正方形。"}], "correct": "a", "pointIds": ["pyps.p1b.u1.003"], "contentVersion": "sha256:4298b33d7479cd96cba956ed5d3168784c39ba4030a48f88aa71b312e72d9916"}, {"id": "p1b-u1-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "用一副七巧板里的 3 块拼成 1 个三角形，下面哪一组可以？", "answer": "2 个小三角形和 1 个正方形", "reasoning": ["先想七巧板里有什么：5 个三角形、1 个正方形、1 个平行四边形，没有圆。", "正方形相邻的两条边上各靠一个小三角形，就拼成一个大三角形。"], "options": [{"id": "a", "text": "2 个小三角形和 1 个正方形", "feedback": "对。2 个小三角形分别靠在正方形相邻的两条边上，能拼成一个大三角形。"}, {"id": "b", "text": "1 个圆和 2 个小三角形", "feedback": "七巧板里没有圆。"}, {"id": "c", "text": "1 个大三角形和 2 个正方形", "feedback": "一副七巧板里只有 1 个正方形，拿不出 2 个。"}], "correct": "a", "pointIds": ["pyps.p1b.u1.006", "pyps.p1b.u1.005"], "contentVersion": "sha256:312630dd3086e51cd1a8eaa23d7aa9b0907f7496954bd321eded21129a14f453"}], "contentVersion": "sha256:7a5c505c2c5c2c2326ef094243d498a1171b7e81bb34e02130afdd1b3d0b6803"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
