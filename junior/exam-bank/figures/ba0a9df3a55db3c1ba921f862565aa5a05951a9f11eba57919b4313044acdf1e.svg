<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-labelledby="title desc"><title id="title">两条平行线与截线</title><desc id="desc">两条水平直线，上方为 AB，下方为 CD。斜直线 l 交 AB 于点 E，交 CD 于点 F。从 E 向右下方作一条射线，交 CD 于点 G。</desc><style>path,circle,polygon,rect,line,polyline{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.2}.g{stroke-width:.9;stroke-dasharray:5 3}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><line x1="50.00" y1="60.00" x2="350.00" y2="60.00"/><line x1="50.00" y1="150.00" x2="350.00" y2="150.00"/><line x1="80.00" y1="183.60" x2="275.00" y2="19.70"/><line x1="227.00" y1="60.00" x2="272.00" y2="183.60"/><text x="36.0" y="66.0" text-anchor="middle" font-size="18" font-style="italic">A</text><text x="364.0" y="66.0" text-anchor="middle" font-size="18" font-style="italic">B</text><text x="36.0" y="156.0" text-anchor="middle" font-size="18" font-style="italic">C</text><text x="364.0" y="156.0" text-anchor="middle" font-size="18" font-style="italic">D</text><text x="207.0" y="52.0" text-anchor="middle" font-size="18" font-style="italic">E</text><text x="132.0" y="173.0" text-anchor="middle" font-size="18" font-style="italic">F</text><text x="245.0" y="173.0" text-anchor="middle" font-size="18" font-style="italic">G</text><text x="286.0" y="22.0" text-anchor="middle" font-size="18" font-style="italic">l</text></svg>