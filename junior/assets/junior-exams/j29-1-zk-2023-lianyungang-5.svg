<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" role="img" aria-labelledby="title desc">
<title id="title">甲、乙、丙三个图形</title>
<desc id="desc">三个虚线圆，圆心都标 O。甲：圆内一条过圆心的线段（直径）、一条从直径左端点出发的弦和它们之间右侧的一段实线圆弧围成图形。乙：两条从圆心出发的半径和右侧一段实线圆弧围成图形。丙：从圆内一个不是圆心的点出发的两条线段和右上方一段实线圆弧围成图形。</desc>
<style>text { fill:#17202a; } .it { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .nm { font-family:'Times New Roman',Georgia,serif; } .zh { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="600" height="200" fill="white"/>
<circle cx="100" cy="100" r="80" fill="none" stroke="#17202a" stroke-width="3" stroke-dasharray="9 8"/>
<path d="M158.5,45.4 A80,80 0 0 1 173.1,132.5" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="26.9" y1="67.5" x2="158.5" y2="45.4" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="26.9" y1="67.5" x2="173.1" y2="132.5" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<circle cx="100.0" cy="100.0" r="4.5" fill="#17202a"/>
<text class="it" x="78.0" y="140.0" text-anchor="middle" font-size="30">O</text>
<text class="zh" x="144.0" y="95.0" text-anchor="middle" font-size="30">甲</text>
<circle cx="300" cy="100" r="80" fill="none" stroke="#17202a" stroke-width="3" stroke-dasharray="9 8"/>
<path d="M356.6,43.4 A80,80 0 0 1 359.5,153.5" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="300.0" y1="100.0" x2="356.6" y2="43.4" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="300.0" y1="100.0" x2="359.5" y2="153.5" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<circle cx="300.0" cy="100.0" r="4.5" fill="#17202a"/>
<text class="it" x="278.0" y="112.0" text-anchor="middle" font-size="30">O</text>
<text class="zh" x="348.0" y="109.0" text-anchor="middle" font-size="30">乙</text>
