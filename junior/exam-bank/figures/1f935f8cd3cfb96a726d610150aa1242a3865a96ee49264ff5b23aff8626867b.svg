<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" role="img" aria-labelledby="title desc"><title id="title">每周做家务次数条形图</title><desc id="desc">条形图，横轴为每周做家务次数0至8，纵轴为人数。次数0到8对应的人数依次为10、10、30、40、60、50、40、30、30。图例为做家务次数。</desc><style>path,line,circle,rect,polygon{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,"Songti SC",serif}.fill{fill:currentColor}.bar{fill:currentColor;fill-opacity:.45}.dash{stroke-dasharray:6 5}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><line x1="70.0" y1="300.0" x2="70.0" y2="30.0"/><polygon class="fill" points="70.0,30.0 64.9,42.0 75.1,42.0"/><line x1="70.0" y1="300.0" x2="480.0" y2="300.0"/><polygon class="fill" points="480.0,300.0 468.0,294.9 468.0,305.1"/><text x="58.0" y="306.0" text-anchor="end" font-size="18">0</text><line x1="64.0" y1="274.0" x2="70.0" y2="274.0"/><text x="58.0" y="280.0" text-anchor="end" font-size="18">10</text><line x1="64.0" y1="248.0" x2="70.0" y2="248.0"/><text x="58.0" y="254.0" text-anchor="end" font-size="18">20</text><line x1="64.0" y1="222.0" x2="70.0" y2="222.0"/><text x="58.0" y="228.0" text-anchor="end" font-size="18">30</text><line x1="64.0" y1="196.0" x2="70.0" y2="196.0"/><text x="58.0" y="202.0" text-anchor="end" font-size="18">40</text><line x1="64.0" y1="170.0" x2="70.0" y2="170.0"/><text x="58.0" y="176.0" text-anchor="end" font-size="18">50</text><line x1="64.0" y1="144.0" x2="70.0" y2="144.0"/><text x="58.0" y="150.0" text-anchor="end" font-size="18">60</text><line x1="64.0" y1="118.0" x2="70.0" y2="118.0"/><text x="58.0" y="124.0" text-anchor="end" font-size="18">70</text><line x1="64.0" y1="92.0" x2="70.0" y2="92.0"/><line x1="64.0" y1="66.0" x2="70.0" y2="66.0"/><rect class="bar" x="101" y="274.0" width="14" height="26.0"/><text x="108.0" y="324.0" text-anchor="middle" font-size="20">0</text><rect class="bar" x="143" y="274.0" width="14" height="26.0"/><text x="150.0" y="324.0" text-anchor="middle" font-size="20">1</text><rect class="bar" x="185" y="222.0" width="14" height="78.0"/><text x="192.0" y="324.0" text-anchor="middle" font-size="20">2</text><rect class="bar" x="227" y="196.0" width="14" height="104.0"/><text x="234.0" y="324.0" text-anchor="middle" font-size="20">3</text><rect class="bar" x="269" y="144.0" width="14" height="156.0"/><text x="276.0" y="324.0" text-anchor="middle" font-size="20">4</text><rect class="bar" x="311" y="170.0" width="14" height="130.0"/><text x="318.0" y="324.0" text-anchor="middle" font-size="20">5</text><rect class="bar" x="353" y="196.0" width="14" height="104.0"/><text x="360.0" y="324.0" text-anchor="middle" font-size="20">6</text><rect class="bar" x="395" y="222.0" width="14" height="78.0"/><text x="402.0" y="324.0" text-anchor="middle" font-size="20">7</text><rect class="bar" x="437" y="222.0" width="14" height="78.0"/><text x="444.0" y="324.0" text-anchor="middle" font-size="20">8</text><text x="82.0" y="40.0" text-anchor="start" font-size="20">人数</text><text x="488.0" y="306.0" text-anchor="start" font-size="18">每周做家务次数</text><rect class="bar" x="190" y="340" width="14" height="14"/><text x="212.0" y="354.0" text-anchor="start" font-size="18">做家务次数</text></svg>
