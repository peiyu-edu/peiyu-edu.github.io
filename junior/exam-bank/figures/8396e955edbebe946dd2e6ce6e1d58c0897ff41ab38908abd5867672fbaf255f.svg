<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" role="img" aria-labelledby="title desc"><title id="title">两次折叠的纸带</title><desc id="desc">一条上下边缘平行的纸带，折痕 AB 在左、折痕 CD 在右。点 A、C 在上边缘所在直线上，点 B、E、D 在下边缘所在直线上；A 到纸带左部折边之间、E 到 D 之间为虚线。左端部分沿 AB 向上折起，右端部分沿 CD 向下折起，纸带经过 C、E 继续向右下延伸。两端均有锯齿状的撕边。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.s{fill:currentColor;fill-opacity:.15;stroke:none}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M66.00,120.00L41.28,43.92" /><path d="M41.28,43.92L58.19,53.32L70.92,37.07L88.15,48.45L100.88,32.20L118.11,43.58L131.16,29.30" /><path d="M131.16,29.30L189.87,210.00" /><path d="M66.00,120.00L189.87,210.00" /><path d="M66.00,120.00L160.63,120.00" class="d" /><path d="M160.63,120.00L216.00,120.00" /><path d="M189.87,210.00L339.87,210.00" /><path d="M339.87,210.00L492.99,210.00" class="d" /><path d="M216.00,120.00L492.99,210.00" /><path d="M216.00,120.00L507.25,331.60" /><path d="M492.99,210.00L537.49,242.33" /><path d="M537.49,242.33L543.81,261.06L525.51,271.44L533.73,290.82L515.43,301.20L523.65,320.57L507.25,331.60" /><text x="50.00" y="126.00" text-anchor="middle" font-size="20" font-style="italic">A</text><text x="222.00" y="110.00" text-anchor="middle" font-size="20" font-style="italic">C</text><text x="181.87" y="234.00" text-anchor="middle" font-size="20" font-style="italic">B</text><text x="333.87" y="236.00" text-anchor="middle" font-size="20" font-style="italic">E</text><text x="502.99" y="198.00" text-anchor="middle" font-size="20" font-style="italic">D</text></svg>
