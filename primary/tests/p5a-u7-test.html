<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五年级上册 第七单元 可能性 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p5a-u7-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>五年级上册 第七单元 可能性 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p5a-u7-test", "sectionId": "p5a-u7-test", "unitId": "p5a-u7", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "五年级上册 第七单元 可能性 单元测评", "items": [{"id": "p5a-u7-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "袋子里只有 6 个红球。任意摸出 1 个，摸到的一定是红球吗？", "answer": "一定是", "reasoning": ["袋子里只有红球，摸出来的结果只有一种。", "所以一定是红球。"], "options": [{"id": "a", "text": "一定是", "feedback": "对。袋子里只有红球，摸出的一定是红球。"}, {"id": "b", "text": "可能是", "feedback": "袋子里没有别的颜色，结果只有一种。"}, {"id": "c", "text": "不可能是", "feedback": "袋子里全是红球，一定能摸到红球。"}], "correct": "a", "pointIds": ["pyps.p5a.u7.001"], "contentVersion": "sha256:e2de40cdc648e53b0f3f303e4fb110ba6f6d4d5a9d6f79ccf44d2aaca2c83989"}, {"id": "p5a-u7-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "袋子里有 3 个红球和 2 个蓝球。任意摸出 1 个，摸到绿球是一定、可能，还是不可能？", "answer": "不可能", "reasoning": ["袋子里只有红球和蓝球，没有绿球。", "所以摸到绿球是不可能的。"], "options": [{"id": "a", "text": "可能", "feedback": "袋子里没有绿球，摸不到。"}, {"id": "b", "text": "一定", "feedback": "袋子里没有绿球。"}, {"id": "c", "text": "不可能", "feedback": "对。袋子里没有绿球。"}], "correct": "c", "pointIds": ["pyps.p5a.u7.001"], "contentVersion": "sha256:66a8d84cdefa9b491532a16511a80a9b831ff190af5676ddf53d60056d108a23"}, {"id": "p5a-u7-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "袋子里有 3 个红球和 2 个蓝球。任意摸出 1 个，摸到蓝球是一定、可能，还是不可能？", "answer": "可能", "reasoning": ["摸出的结果有两种：红球或蓝球。", "所以摸到蓝球是可能的。"], "options": [{"id": "a", "text": "不可能", "feedback": "袋子里有蓝球，能摸到。"}, {"id": "b", "text": "一定", "feedback": "袋子里还有红球，不一定摸到蓝球。"}, {"id": "c", "text": "可能", "feedback": "对。可能摸到蓝球，也可能摸到红球。"}], "correct": "c", "pointIds": ["pyps.p5a.u7.001"], "contentVersion": "sha256:79fb6f1d067e06489e729ed889d4b15976b4eb72776d5c6f6f6f2a40a2b7a026"}, {"id": "p5a-u7-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "盒子里有 8 个黄球、3 个白球、1 个黑球。任意摸出 1 个，摸到哪种颜色的球可能性最大？", "answer": "黄球", "reasoning": ["哪种球的数量多，摸到它的可能性就大。", "黄球有 8 个，最多，所以摸到黄球的可能性最大。"], "options": [{"id": "a", "text": "黄球", "feedback": "对。黄球最多，摸到黄球的可能性最大。"}, {"id": "b", "text": "白球", "feedback": "白球只有 3 个，比黄球少。"}, {"id": "c", "text": "黑球", "feedback": "黑球只有 1 个，可能性最小。"}], "correct": "a", "pointIds": ["pyps.p5a.u7.002"], "contentVersion": "sha256:2dc5fe8281962485f8686effd6c770c9d66aae3e4a75cd830077bbd760d087bd"}, {"id": "p5a-u7-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个转盘平均分成 10 格：5 格红色，3 格蓝色，2 格绿色。转一次，下面哪句话对？", "answer": "停在红色的可能性最大，但不一定停在红色", "reasoning": ["红色有 5 格，最多，停在红色的可能性最大。", "蓝色和绿色也有格子，所以不是一定停在红色。"], "options": [{"id": "a", "text": "停在绿色的可能性最大", "feedback": "绿色只有 2 格，可能性最小。"}, {"id": "b", "text": "停在红色的可能性最大，但不一定停在红色", "feedback": "对。红色格子最多，但也可能停在别的颜色。"}, {"id": "c", "text": "一定停在红色", "feedback": "蓝色、绿色也有格子，不一定停在红色。"}], "correct": "b", "pointIds": ["pyps.p5a.u7.002"], "contentVersion": "sha256:1a5ba2e93df8de5d0658761d628c5b33cb3704a4f95954cf211096c1f6fc8aa1", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 225\" role=\"img\" aria-label=\"题目已知条件，所求量留空\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M150 90L150.00 27.00A63 63 0 0 1 187.03 39.03Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L187.03 39.03A63 63 0 0 1 209.92 70.53Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L209.92 70.53A63 63 0 0 1 209.92 109.47Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L209.92 109.47A63 63 0 0 1 187.03 140.97Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L187.03 140.97A63 63 0 0 1 150.00 153.00Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L150.00 153.00A63 63 0 0 1 112.97 140.97Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L112.97 140.97A63 63 0 0 1 90.08 109.47Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L90.08 109.47A63 63 0 0 1 90.08 70.53Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L90.08 70.53A63 63 0 0 1 112.97 39.03Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L112.97 39.03A63 63 0 0 1 150.00 27.00Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><circle cx=\"150\" cy=\"90\" r=\"4\" style=\"fill:var(--a);stroke:var(--fg);stroke-width:1\"/><text x=\"150\" y=\"177\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">已知平均分成 10 格<\/text><text x=\"150\" y=\"205\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">红 5 格，蓝 3 格，绿 2 格<\/text><\/svg>"}, {"id": "p5a-u7-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "小明从一个盒子里摸球，每次摸完放回去再摇匀。摸了 40 次，摸到红球 31 次，白球 9 次。盒子里哪种球可能多？", "answer": "红球可能多", "reasoning": ["摸到哪种球的次数多，盒子里这种球可能就多。", "红球摸到 31 次，白球 9 次，所以红球可能多。"], "options": [{"id": "a", "text": "红球可能多", "feedback": "对。摸到红球的次数多得多，盒子里红球可能多。"}, {"id": "b", "text": "白球可能多", "feedback": "摸到白球的次数少，白球可能少。"}, {"id": "c", "text": "两种一定一样多", "feedback": "摸到两种球的次数相差很大，不像一样多。"}], "correct": "a", "pointIds": ["pyps.p5a.u7.003"], "contentVersion": "sha256:96667add7e11ab5b0159455ac8bf715353cdcb6f165558ceff72a099bc69cddc"}, {"id": "p5a-u7-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "盒子里要放 12 个球，只有红球和白球。要让摸到红球的可能性比摸到白球大，红球至少要放几个？", "answer": "7 个", "reasoning": ["红球要比白球多。", "放 6 个红球时，白球也是 6 个，一样多；放 7 个红球时，白球 12 − 7 = 5（个），红球多。", "所以至少放 7 个。"], "options": [{"id": "a", "text": "6 个", "feedback": "6 个红球、6 个白球，两种可能性一样大。"}, {"id": "b", "text": "7 个", "feedback": "对。7 个红球、5 个白球，红球多。"}, {"id": "c", "text": "12 个", "feedback": "全放红球就一定摸到红球了，不用这么多。"}], "correct": "b", "pointIds": ["pyps.p5a.u7.002"], "contentVersion": "sha256:ad130ff8aa5258814d728768bc9ecfaa379c4a13e7bf25fe326f848c118f986d"}, {"id": "p5a-u7-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "掷一个普通的骰子（六个面上分别是 1～6 点），掷出 7 点是一定、可能，还是不可能？", "answer": "不可能", "reasoning": ["骰子六个面上是 1～6 点，没有 7 点。", "所以掷出 7 点是不可能的。"], "options": [{"id": "a", "text": "不可能", "feedback": "对。骰子上没有 7 点。"}, {"id": "b", "text": "一定", "feedback": "骰子上没有 7 点。"}, {"id": "c", "text": "可能", "feedback": "骰子上最多 6 点，没有 7 点。"}], "correct": "a", "pointIds": ["pyps.p5a.u7.001"], "contentVersion": "sha256:dedcb159000fc540153a935159b119706947b960f2b09e69b01268d8fcc915d2"}, {"id": "p5a-u7-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "同时掷两个普通的骰子，把朝上的点数加起来。下面哪个和出现的可能性最大？", "answer": "7", "reasoning": ["和是 2 只有 1 + 1 一种搭配，和是 12 只有 6 + 6 一种搭配。", "和是 7 有 1 + 6、2 + 5、3 + 4、4 + 3、5 + 2、6 + 1，6 种搭配，最多。", "所以和是 7 的可能性最大。"], "options": [{"id": "a", "text": "2", "feedback": "两个都是 1 点才能得 2，只有 1 种搭配。"}, {"id": "b", "text": "12", "feedback": "两个都是 6 点才能得 12，只有 1 种搭配。"}, {"id": "c", "text": "7", "feedback": "对。1 和 6、2 和 5、3 和 4、4 和 3、5 和 2、6 和 1，一共 6 种搭配，最多。"}], "correct": "c", "pointIds": ["pyps.p5a.u7.004"], "contentVersion": "sha256:b3d9589b30cf827293d6ce965c6088b216e082ced9229049b9f0b05fbeb71cae"}, {"id": "p5a-u7-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "游戏：转盘平均分成 8 格，红色 4 格，黄色 4 格。停在红色小华赢，停在黄色小丽赢。这个游戏公平吗？", "answer": "公平，两人赢的可能性一样大", "reasoning": ["红色 4 格，黄色 4 格，停在两种颜色的可能性一样大。", "两人赢的可能性一样大，游戏公平。"], "options": [{"id": "a", "text": "不公平，小丽赢的可能性大", "feedback": "黄色和红色一样都是 4 格。"}, {"id": "b", "text": "不公平，小华一定赢", "feedback": "每次转的结果不确定，谁都可能赢。"}, {"id": "c", "text": "公平，两人赢的可能性一样大", "feedback": "对。红色、黄色格子一样多。"}], "correct": "c", "pointIds": ["pyps.p5a.u7.002"], "contentVersion": "sha256:1e6bc0a3232bc023ad4dfb787f78082078a86bd1623fb0126e547ecc708bbe82", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 225\" role=\"img\" aria-label=\"题目已知条件，所求量留空\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M150 90L150.00 27.00A63 63 0 0 1 194.55 45.45Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L194.55 45.45A63 63 0 0 1 213.00 90.00Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L213.00 90.00A63 63 0 0 1 194.55 134.55Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L194.55 134.55A63 63 0 0 1 150.00 153.00Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L150.00 153.00A63 63 0 0 1 105.45 134.55Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L105.45 134.55A63 63 0 0 1 87.00 90.00Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L87.00 90.00A63 63 0 0 1 105.45 45.45Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><path d=\"M150 90L105.45 45.45A63 63 0 0 1 150.00 27.00Z\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><circle cx=\"150\" cy=\"90\" r=\"4\" style=\"fill:var(--a);stroke:var(--fg);stroke-width:1\"/><text x=\"150\" y=\"177\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">已知平均分成 8 格<\/text><text x=\"150\" y=\"205\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">红 4 格，黄 4 格<\/text><\/svg>"}, {"id": "p5a-u7-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "盒子里有红球和白球共 10 个。小红摸了 20 次（每次摸完放回），18 次是红球，2 次是白球。下面哪种推测最合理？", "answer": "盒子里红球多，白球少", "reasoning": ["摸到红球 18 次，比白球多得多，红球可能多。", "摸到过白球，所以盒子里一定有白球，不是只有红球。"], "options": [{"id": "a", "text": "盒子里白球多", "feedback": "白球摸到的次数很少，白球可能少。"}, {"id": "b", "text": "盒子里只有红球", "feedback": "摸到过 2 次白球，盒子里一定有白球。"}, {"id": "c", "text": "盒子里红球多，白球少", "feedback": "对。红球摸到的次数多，红球可能多；摸到过白球，说明也有白球。"}], "correct": "c", "pointIds": ["pyps.p5a.u7.003"], "contentVersion": "sha256:bae8fcd38899c3e1ec5f923f9021ade67f1181eb0a4895d82fc891ede81083c6"}], "contentVersion": "sha256:28708d942865de3eca7c08ac5194df4aa2c148f2277a65a81cc788a9c52537ee"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
