<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 18 章 分式 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j18-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 18 章 分式 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j18-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j18-test", "sectionId": "j18-test", "chapterId": "j18", "title": "第 18 章 分式 · 章末测验", "label": "章末测验", "sections": ["j18-1", "j18-2", "j18-3", "j18-4", "j18-5"], "items": [{"id": "j18-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j18-1"], "pointIds": ["pyjh.frac.002"], "prompt": "若分式 $\\frac{x^2-4}{x+2}$ 的值为 $0$，则 $x$ 的值是多少？", "options": [{"id": "a", "text": "$x=2$", "feedback": "分子为 $0$ 且分母不为 $0$。"}, {"id": "b", "text": "$x=-2$", "feedback": "$x=-2$ 时分母 $x+2=0$，分式没有意义。"}, {"id": "c", "text": "$x=\\pm2$", "feedback": "分子为 $0$ 的同时还要检查分母不为 $0$。"}, {"id": "d", "text": "$x=4$", "feedback": "$x^2-4=0$ 得 $x^2=4$，是求平方根，不是乘 $2$。"}], "correct": "a", "answer": "$x=2$", "reasoning": ["分式值为 $0$：分子 $x^2-4=0$，且分母 $x+2\\ne0$。", "$x^2=4$ 得 $x=2$ 或 $x=-2$；$x=-2$ 时分母为 $0$，舍去。所以 $x=2$。"], "contentVersion": "sha256:b3b22386d4be698cc05ff2063f9c8a96da770d3637d434a965d3c02b9377699c"}, {"id": "j18-test-02-v2", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j18-1"], "pointIds": ["pyjh.frac.004", "pyjh.fact.006"], "prompt": "约分 $\\frac{x^2-2x}{x^2-4}$，结果是什么？", "options": [{"id": "a", "text": "$\\frac{x}{x-2}$", "feedback": "约去公因式后，分母留下的因子选错了，应先完整分解再检查。"}, {"id": "b", "text": "$\\frac{x}{x+2}$", "feedback": "分子、分母先分解因式，再约去公因式 $x-2$。"}, {"id": "c", "text": "$\\frac{1}{x+2}$", "feedback": "约分时把分子的另一个因子也丢掉了，不能把它当成公因式一起约去。"}, {"id": "d", "text": "$\\frac x2$", "feedback": "约分约的是公因式，不能把分子、分母中的 $x^2$ 这一项直接约掉。"}], "correct": "b", "answer": "$\\frac{x}{x+2}$", "reasoning": ["原分母不能为零，$x\\ne2$ 且 $x\\ne-2$；约分后的结果仍须保留这些限制。", "分子 $x^2-2x=x(x-2)$，分母 $x^2-4=(x+2)(x-2)$。", "约去公因式 $x-2$，得 $\\frac{x}{x+2}$。"], "contentVersion": "sha256:03b5866b6cc82b53e8973173c9624a0194896539bf7cbe77c0822c4f575c43df"}, {"id": "j18-test-03-v2", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j18-2"], "pointIds": ["pyjh.frac.006"], "prompt": "计算 $\\frac{4x}{3y}\\div\\frac{2x^2}{9y^3}$ 的结果是什么？", "options": [{"id": "a", "text": "$\\frac{8x^3}{27y^4}$", "feedback": "除以一个分式要乘它的倒数，这里直接相乘了。"}, {"id": "b", "text": "$\\frac{x}{6y^2}$", "feedback": "被除式与除式颠倒了，乘的应是除式的倒数。"}, {"id": "c", "text": "$\\frac{6y^2}{x}$", "feedback": "颠倒除式变成乘法，再约分。"}, {"id": "d", "text": "$\\frac{6y^3}{x}$", "feedback": "约分时 $y^3$ 与 $y$ 也要约去一个 $y$。"}], "correct": "c", "answer": "$\\frac{6y^2}{x}$", "reasoning": ["分母要求 $y\\ne0$，且除式不能为零，所以还要求 $x\\ne0$。化简结果保留 $x\\ne0$，$y\\ne0$。", "$\\frac{4x}{3y}\\div\\frac{2x^2}{9y^3}=\\frac{4x}{3y}\\cdot\\frac{9y^3}{2x^2}=\\frac{36xy^3}{6x^2y}$。", "约分得 $\\frac{6y^2}{x}$。"], "contentVersion": "sha256:bc8c4b1352a38b38c43c18ec4baf3ae8672f3ec0734a285de6329632bde8fd92"}, {"id": "j18-test-04-v2", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j18-3"], "pointIds": ["pyjh.frac.009"], "prompt": "计算 $\\frac{3}{x-1}-\\frac{x+2}{x-1}$ 的结果是什么？", "options": [{"id": "a", "text": "$-1$", "feedback": "同分母相减，分子相减时把 $x+2$ 看作整体，最后约分。"}, {"id": "b", "text": "$1$", "feedback": "分子相减的顺序或约分的符号出错，应保留整体减号。"}, {"id": "c", "text": "$\\frac{5-x}{x-1}$", "feedback": "减去 $x+2$ 要给它加括号，$-(x+2)=-x-2$。"}, {"id": "d", "text": "$\\frac{x+5}{x-1}$", "feedback": "这是两个分式相加的结果，题目是相减。"}], "correct": "a", "answer": "$-1$", "reasoning": ["原分母 $x-1\\ne0$，即 $x\\ne1$；约分后仍保留这个限制。", "同分母分式相减，分母不变，分子相减：$\\frac{3-(x+2)}{x-1}=\\frac{1-x}{x-1}$。", "$1-x=-(x-1)$，约分得 $-1$。"], "contentVersion": "sha256:5322ed7859bc8f773413ef284ab074c4819a17ab13f1616f0fea00b75213aa85"}, {"id": "j18-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j18-4"], "pointIds": ["pyjh.frac.012", "pyjh.poly.008"], "prompt": "计算 $\\left(-\\frac12\\right)^{-2}+(\\pi-3)^0$ 的结果是多少？", "options": [{"id": "a", "text": "$5$", "feedback": "负整数指数幂等于正整数指数幂的倒数，非零数的 $0$ 次幂等于 $1$。"}, {"id": "b", "text": "$\\frac54$", "feedback": "$a^{-2}=\\frac{1}{a^2}$，是平方的倒数，不是平方本身。"}, {"id": "c", "text": "$4$", "feedback": "$\\pi-3\\ne0$，它的 $0$ 次幂是 $1$，不是 $0$。"}, {"id": "d", "text": "$-3$", "feedback": "负指数不改变底数的符号规律：负数的偶次幂为正。"}], "correct": "a", "answer": "$5$", "reasoning": ["$\\left(-\\frac12\\right)^{-2}=\\frac{1}{\\left(-\\frac12\\right)^2}=\\frac{1}{\\frac14}=4$。", "$\\pi-3\\ne0$，所以 $(\\pi-3)^0=1$。", "原式 $=4+1=5$。"], "contentVersion": "sha256:07706d97ec3191b3fb97ea8f6682f693328614be49464645372d1c1139af6c8c"}, {"id": "j18-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j18-4"], "pointIds": ["pyjh.frac.014"], "prompt": "某种花粉颗粒的直径约为 $0.0000305$ 米，用科学记数法表示是哪一项？", "options": [{"id": "a", "text": "$3.05\\times10^{-5}$", "feedback": "$a\\times10^{n}$ 中 $1\\le a<10$，$n$ 由小数点移动的位数确定。"}, {"id": "b", "text": "$3.05\\times10^{-6}$", "feedback": "小数点向右移动了 $5$ 位，不是 $6$ 位。"}, {"id": "c", "text": "$30.5\\times10^{-6}$", "feedback": "科学记数法要求 $1\\le a<10$，$30.5$ 不符合。"}, {"id": "d", "text": "$3.05\\times10^{5}$", "feedback": "原数小于 $1$，指数应为负数。"}], "correct": "a", "answer": "$3.05\\times10^{-5}$", "reasoning": ["小于 $1$ 的正数写成 $a\\times10^{-n}$，其中 $1\\le a<10$。", "$0.0000305$ 的小数点向右移动 $5$ 位得 $3.05$，所以 $0.0000305=3.05\\times10^{-5}$。"], "contentVersion": "sha256:dcc404b8800cf2371de9bc81e679b22214dd6f859f9ea24e26d09ac9765744d1"}, {"id": "j18-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j18-5"], "pointIds": ["pyjh.frac.015"], "prompt": "解分式方程 $\\frac{x}{x-2}-\\frac{3}{2-x}=2$，结果是什么？", "options": [{"id": "a", "text": "$x=7$", "feedback": "先把 $2-x$ 化成 $-(x-2)$，去分母后解一元一次方程，并检验。"}, {"id": "b", "text": "$x=1$", "feedback": "$-\\frac{3}{2-x}=+\\frac{3}{x-2}$，变号后是加 $3$。"}, {"id": "c", "text": "$x=-1$", "feedback": "去分母时右边的 $2$ 也要乘 $x-2$。"}, {"id": "d", "text": "$x=5$", "feedback": "右边 $2(x-2)$ 去括号得 $2x-4$，常数项算错了。"}], "correct": "a", "answer": "$x=7$", "reasoning": ["$\\frac{3}{2-x}=-\\frac{3}{x-2}$，方程化为 $\\frac{x}{x-2}+\\frac{3}{x-2}=2$。", "两边乘 $x-2$：$x+3=2(x-2)$，即 $x+3=2x-4$，解得 $x=7$。", "检验：$x=7$ 时 $x-2=5\\ne0$，所以 $x=7$ 是原方程的解。"], "contentVersion": "sha256:8c830c644085527735cc7a3253dc2a30d963cfa42a3dbe35db6b73b5bf720d52"}, {"id": "j18-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j18-5"], "pointIds": ["pyjh.frac.016", "pyjh.frac.015"], "prompt": "解分式方程 $\\frac{x}{x-1}-1=\\frac{3}{(x-1)(x+2)}$，结论正确的是哪一项？", "options": [{"id": "a", "text": "$x=1$", "feedback": "$x=1$ 使分母 $x-1$ 为 $0$，原方程在 $x=1$ 处没有意义，不能作为解。"}, {"id": "b", "text": "$x=-2$", "feedback": "去分母后的整式方程并不是 $x=-2$；而且 $x=-2$ 也使分母为 $0$。"}, {"id": "c", "text": "原方程无解", "feedback": "去分母得到的唯一的值使最简公分母为 $0$，必须检验后舍去。"}, {"id": "d", "text": "$x=5$", "feedback": "$-(x-1)(x+2)$ 去括号得 $-x^2-x+2$，常数项的符号要改变。"}], "correct": "c", "answer": "原方程无解", "reasoning": ["两边乘最简公分母 $(x-1)(x+2)$：$x(x+2)-(x-1)(x+2)=3$。", "$x^2+2x-(x^2+x-2)=3$，化简得 $x+2=3$，$x=1$。", "检验：$x=1$ 时 $(x-1)(x+2)=0$，$x=1$ 不是原方程的解，所以原方程无解。"], "contentVersion": "sha256:b8aa60293a16f9f6d81ecb273a99a67ba02af9347d98a70dd4d4d4e91deafb1b"}, {"id": "j18-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j18-4"], "pointIds": ["pyjh.frac.013"], "prompt": "计算 $(2a^{-2}b)^{-3}\\cdot a^{-2}b^3$（$a\\ne0$，$b\\ne0$），结果是什么？", "options": [{"id": "a", "text": "$\\frac{a^4}{8}$", "feedback": "积的乘方、幂的乘方、同底数幂相乘对整数指数都成立。"}, {"id": "b", "text": "$8a^4$", "feedback": "$2^{-3}=\\frac{1}{2^3}$，是 $8$ 的倒数。"}, {"id": "c", "text": "$\\frac{1}{8a^8}$", "feedback": "$(a^{-2})^{-3}$ 的指数是 $(-2)\\times(-3)$，为正。"}, {"id": "d", "text": "$-6a^4$", "feedback": "$2^{-3}$ 不是 $2\\times(-3)$，负整数指数表示倒数。"}], "correct": "a", "answer": "$\\frac{a^4}{8}$", "reasoning": ["$(2a^{-2}b)^{-3}=2^{-3}\\cdot a^{6}\\cdot b^{-3}=\\frac18a^6b^{-3}$。", "再乘 $a^{-2}b^3$：$\\frac18a^{6-2}b^{-3+3}=\\frac18a^4$，即 $\\frac{a^4}{8}$。"], "contentVersion": "sha256:c340a8cfcffa1bc54a29ba9e15e33f7bbef183fd3d6a496685299bd420dd17c3"}, {"id": "j18-test-10-v2", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j18-2", "j18-3"], "pointIds": ["pyjh.frac.010", "pyjh.frac.006"], "prompt": "化简 $\\left(\\frac{x+1}{x-1}-1\\right)\\div\\frac{2}{x^2-x}$，结果是什么？", "options": [{"id": "a", "text": "$x$", "feedback": "先算括号内的减法，再把除法变成乘除式的倒数，最后约分。"}, {"id": "b", "text": "$\\frac1x$", "feedback": "被除式与除式颠倒了，乘的应是除式的倒数。"}, {"id": "c", "text": "$0$", "feedback": "括号内 $x+1-(x-1)$ 要加括号，结果是 $2$，不是 $0$。"}, {"id": "d", "text": "$\\frac{4}{x(x-1)^2}$", "feedback": "除以一个分式要乘它的倒数，这里直接相乘了。"}], "correct": "a", "answer": "$x$", "reasoning": ["原分母要求 $x\\ne1$ 且 $x(x-1)\\ne0$，即 $x\\ne0$，$x\\ne1$；除式在此范围内也非零。化简后仍保留这些限制。", "括号内：$\\frac{x+1}{x-1}-\\frac{x-1}{x-1}=\\frac{2}{x-1}$。", "$x^2-x=x(x-1)$，所以原式 $=\\frac{2}{x-1}\\cdot\\frac{x(x-1)}{2}=x$。"], "contentVersion": "sha256:58b44806adddd5de07228644ff380915cedf97e0fa1638c8b772177330156cdd"}, {"id": "j18-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j18-3"], "pointIds": ["pyjh.frac.011", "pyjh.frac.009"], "prompt": "一项工程，甲队单独做需 $a$ 天完成，乙队单独做需 $b$ 天完成。两队合做，完成这项工程需要多少天？", "options": [{"id": "a", "text": "$\\frac{a+b}{2}$", "feedback": "合做的时间不是两个时间的平均数，要用工作效率相加。"}, {"id": "b", "text": "$\\frac{ab}{a+b}$", "feedback": "合做的工作效率是 $\\frac1a+\\frac1b$，工作总量 $1$ 除以它。"}, {"id": "c", "text": "$\\frac{a+b}{ab}$", "feedback": "这是两队每天合做的工作量，题目问的是天数。"}, {"id": "d", "text": "$a+b$", "feedback": "合做比任何一队单独做都快，天数应比 $a$、$b$ 都小。"}], "correct": "b", "answer": "$\\frac{ab}{a+b}$", "reasoning": ["把工作总量看作 $1$，甲、乙每天分别完成 $\\frac1a$、$\\frac1b$，合做每天完成 $\\frac1a+\\frac1b=\\frac{a+b}{ab}$。", "所需天数为 $1\\div\\frac{a+b}{ab}=\\frac{ab}{a+b}$。"], "contentVersion": "sha256:ef856fbe0902ed8ff1372a91883ecff1c317f9b78901d67243c04c584ed73eeb"}, {"id": "j18-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j18-5"], "pointIds": ["pyjh.frac.017", "pyjh.frac.016"], "prompt": "某车间改进工艺后，每天比原来多加工 $20$ 个零件。现在加工 $600$ 个零件所用的时间，与原来加工 $450$ 个零件所用的时间相同。原来每天加工多少个零件？", "options": [{"id": "a", "text": "$80$ 个", "feedback": "这是改进后每天加工的个数，题目问的是原来。"}, {"id": "b", "text": "$60$ 个", "feedback": "设原来每天加工 $x$ 个，按「时间相同」列分式方程，解后检验。"}, {"id": "c", "text": "$6$ 个", "feedback": "去分母后 $450\\times20=9000$，计算时少了一位。"}, {"id": "d", "text": "$120$ 个", "feedback": "代回检验：原来用时 $\\frac{450}{120}$ 天，现在用时 $\\frac{600}{140}$ 天，并不相等。"}], "correct": "b", "answer": "$60$ 个", "reasoning": ["设原来每天加工 $x$ 个，则现在每天加工 $(x+20)$ 个。由时间相同得 $\\frac{450}{x}=\\frac{600}{x+20}$。", "两边乘 $x(x+20)$：$450(x+20)=600x$，$150x=9000$，$x=60$。", "检验：$x=60$ 时 $x(x+20)\\ne0$，是原方程的解，且符合实际意义。"], "contentVersion": "sha256:07169308635bf948992e0cc12e6f5caf8e7e2ec0ff8487c7da1d373bb670554b"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
