<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 170" role="img" aria-labelledby="title desc"><title id="title">智能摇杆车驶入裂缝</title><desc id="desc">夹角为15°的裂缝：两条边相交于C，下边水平；车停在裂缝内，车头竖直杆AB与水平边垂直于B，上端A碰到裂缝上边，∠ACB标15°。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:6 5}.g{stroke-dasharray:3 4;stroke-width:1}.thin{stroke-width:1.5}.fill{fill:currentColor;stroke:none}.shade{fill:var(--shade);stroke:none}.block{fill:var(--shade)}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}text.n{font-style:normal;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}svg{color:#243d45;background:#fff;--shade:#c9d2d2}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--shade:#4a6268}}</style><path d="M40.0,130.0L420.0,130.0"/><path d="M40.0,130.0L420.0,28.2"/><path d="M170.0,130.0L170.0,95.2"/><path class="thin" d="M170.0,122.0L178.0,122.0L178.0,130.0"/><path class="thin" d="M66.0,130A26,26 0 0 0 65.1,123.3"/><path class="block" d="M170,101.2H258V118H170Z"/><circle cx="190.0" cy="124.0" r="6"/><circle cx="238.0" cy="124.0" r="6"/><text x="26.0" y="138.0" font-size="19" text-anchor="middle">C</text><text x="170.0" y="156.0" font-size="19" text-anchor="middle">B</text><text x="160.0" y="85.2" font-size="19" text-anchor="middle">A</text><text x="128.0" y="127.0" font-size="14" text-anchor="middle" class="n">15°</text></svg>
