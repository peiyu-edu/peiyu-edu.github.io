<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 258" width="600" height="258" role="img" aria-labelledby="title desc">
<title id="title">学校到书店的四条路线</title>
<desc id="desc">点 A 在左，点 B 在右，两点之间有四条路线：②是连接 A、B 的线段；③是线段上方略微拱起的弧线；④是更上方起伏的曲线；①在线段下方，是由两段直线组成的折线。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="600" height="258" fill="white"/>
<path d="M42 150C100 96 150 58 240 62C300 65 330 78 385 56C420 42 450 40 470 70C495 105 530 130 548 150" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M42 150Q295 76 548 150" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="42.0" y1="150.0" x2="548.0" y2="150.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<path d="M42 150L200 242L548 150" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="22.0" y="160.0" class="m" text-anchor="middle">A</text>
<text x="572.0" y="160.0" class="m" text-anchor="middle">B</text>
<text x="415.0" y="34.0" class="z" text-anchor="middle" font-size="28">④</text>
<text x="300.0" y="102.0" class="z" text-anchor="middle" font-size="28">③</text>
<text x="240.0" y="186.0" class="z" text-anchor="middle" font-size="28">②</text>
<text x="360.0" y="232.0" class="z" text-anchor="middle" font-size="28">①</text>
</svg>
