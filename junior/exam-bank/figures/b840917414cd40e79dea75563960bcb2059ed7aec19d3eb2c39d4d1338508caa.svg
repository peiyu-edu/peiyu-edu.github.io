<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-labelledby="title desc"><title id="title">两条平行线与两条相交直线</title><desc id="desc">水平直线m在上、n在下。一条直线自左上向右下穿过m和n；另一条线段从n上一点向右上方画到这条直线上。∠1在第一条直线与m的交点处，位于m上方、该直线左侧；∠2在线段与n的交点处，位于n上方、线段右下侧；∠3在线段与第一条直线的交点处，开口朝左，夹在两线之间。</desc><style>path,circle,line,polyline,polygon,ellipse{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.cjk{font-family:"Noto Sans CJK SC",sans-serif}.dash{stroke-dasharray:6 5}.thin{stroke-width:1}.grid{stroke-width:1;stroke-dasharray:3 3;opacity:.55}.dot{fill:currentColor;stroke:none}.bar{fill:currentColor;fill-opacity:.35}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M30.00,60.00L320.00,60.00"/><path d="M30.00,170.00L320.00,170.00"/><path d="M65.00,25.00L255.00,215.00"/><path d="M80.00,170.00L168.66,128.66"/><path d="M88.69,48.69A16,16 0 0 0 84.00,60.00"/><text x="74.57" y="54.59" text-anchor="middle" font-size="18">1</text><path d="M102.00,170.00A22,22 0 0 0 99.94,160.70"/><text x="133.34" y="161.55" text-anchor="middle" font-size="16">2</text><path d="M157.34,117.34A16,16 0 0 0 154.16,135.42"/><text x="140.93" dy="6" y="124.76" text-anchor="middle" font-size="18">3</text><text x="336.00" y="66.00" text-anchor="middle" font-size="20" font-style="italic">m</text><text x="336.00" y="176.00" text-anchor="middle" font-size="20" font-style="italic">n</text></svg>
