        <ol class="l3-steps">
          <li>上方选两个实验：平行于母线去截、丹德林球与准线。</li>
          <li>「平行于母线去截」里拖半顶角 α：截面始终和一条母线平行，截口是抛物线；焦点、准线、p 都从几何实量。</li>
          <li>「丹德林球与准线」里拖点 P：PF = PQ（切线长），PQ = PD（倾角相同），所以 P 到焦点和到准线一样远。</li>
          <li>按住拖动可以转动模型，滚轮缩放；所有长度随时重算。</li>
        </ol>
