<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 415" role="img" aria-labelledby="title desc"><title id="title">游览路线与路程时间图象</title><desc id="desc">图1是游览路线示意图：实线表示步道，虚线表示索道。观景台1到观景台2的步道长1200m，观景台2到观景台3的步道长1800m，观景台3到观景台4是步道，观景台4到观景台5是步道，观景台3到观景台5另有索道。图2中横轴x/min的刻度为5、10、…、45，纵轴y/m上标有1200、1400、2000；直线l1从原点出发，直线l2从纵轴上1200处出发；x=20时，虚线显示l1上的点的纵坐标为1400，l2上的点的纵坐标为2000。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:7 5}.dot{fill:currentColor;stroke:none}.s{fill:currentColor;fill-opacity:.3;stroke:none}.ss{fill:currentColor;fill-opacity:.3}.b{fill:#fff}.bl{stroke:#fff}.t{stroke-width:9}text{fill:currentColor;stroke:none;font-family:'Times New Roman',Times,'Songti SC','Noto Serif CJK SC',serif;font-size:24px}.bar1{stroke-width:16;stroke-linecap:butt}.bar2{stroke:#fff;stroke-width:12}.i{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.b{fill:#15272d}.bl{stroke:#15272d}.bar2{stroke:#15272d}}</style><path d="M40,68L90,68"/><text x="100" y="76" text-anchor="start">步道</text><path d="M40,110L90,110" class="d"/><text x="100" y="118" text-anchor="start">索道</text><path d="M73,303L156,252L295,214L387,135L396,96"/><path d="M295,214C330,175 365,110 396,96" class="d"/><circle cx="73" cy="303" r="8" class="dot"/><circle cx="156" cy="252" r="8" class="dot"/><circle cx="295" cy="214" r="8" class="dot"/><circle cx="387" cy="135" r="8" class="dot"/><circle cx="396" cy="96" r="8" class="dot"/><text x="72" y="272" text-anchor="middle">1200m</text><text x="212" y="216" text-anchor="middle">1800m</text><text x="80" y="344" text-anchor="middle">观景台1</text><text x="208" y="290" text-anchor="middle">观景台2</text><text x="352" y="250" text-anchor="middle">观景台3</text><text x="405" y="150" text-anchor="start">观景台4</text><text x="412" y="100" text-anchor="start">观景台5</text><text x="230" y="400" text-anchor="middle">图1</text><path d="M650,322L1090,322"/><path class="dot" d="