<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 310" role="img" aria-labelledby="title desc"><title id="title">多面体的三视图（网格纸）</title><desc id="desc">三块网格纸，每块6列4行，小正方形边长为1。左上图：直角梯形，下底长4，上底长2且与下底左端对齐，高2，右侧为从上底右端到下底右端的斜线。右上图：边长为2的正方形。左下图：长4、宽2的矩形，中间有一条竖线把它分成两个边长为2的正方形。</desc><style>path,circle{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M20,20L20,140M50,20L50,140M80,20L80,140M110,20L110,140M140,20L140,140M170,20L170,140M200,20L200,140M20,20L200,20M20,50L200,50M20,80L200,80M20,110L200,110M20,140L200,140" stroke-dasharray="2 3" style="stroke-width:1" /><path d="M50,50L110,50L170,110L50,110L50,50" /><path d="M240,20L240,140M270,20L270,140M300,20L300,140M330,20L330,140M360,20L360,140M390,20L390,140M420,20L420,140M240,20L420,20M240,50L420,50M240,80L420,80M240,110L420,110M240,140L420,140" stroke-dasharray="2 3" style="stroke-width:1" /><path d="M300,50L360,50L360,110L300,110L300,50" /><path d="M20,170L20,290M50,170L50,290M80,170L80,290M110,170L110,290M140,170L140,290M170,170L170,290M200,170L200,290M20,170L200,170M20,200L200,200M20,230L200,230M20,260L200,260M20,290L200,290" stroke-dasharray="2 3" style="stroke-width:1" /><path d="M50,200L170,200L170,260L50,260L50,200" /><path d="M110,200L110,260" /></svg>