<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 25 章 一元二次方程 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j25-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 25 章 一元二次方程 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j25-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j25-test", "sectionId": "j25-test", "chapterId": "j25", "title": "第 25 章 一元二次方程 · 章末测验", "label": "章末测验", "sections": ["j25-1", "j25-2", "j25-3"], "items": [{"id": "j25-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j25-1"], "pointIds": ["pyjh.qeq.001"], "prompt": "下列方程中，哪一个是一元二次方程？", "options": [{"id": "a", "text": "$x^2+\\frac{1}{x}=2$", "feedback": "分母里含未知数，这是分式方程，不是整式方程。"}, {"id": "b", "text": "$(x+2)^2=x^2-1$", "feedback": "展开移项后 $x^2$ 抵消，得到 $4x+5=0$，是一元一次方程。"}, {"id": "c", "text": "$3x(x-1)=2x$", "feedback": "整理得 $3x^2-5x=0$：整式方程、一个未知数、最高次数为 $2$。"}, {"id": "d", "text": "$x^2+y=1$", "feedback": "含两个未知数，不满足「一元」。"}], "correct": "c", "answer": "$3x(x-1)=2x$", "reasoning": ["三条要同时满足：整式方程、只含一个未知数、整理后最高次数是 $2$。", "$3x(x-1)=2x$ 整理为 $3x^2-5x=0$，三条都满足。", "其余三个：分母含 $x$；整理后二次项抵消；含两个未知数。"], "contentVersion": "sha256:4f55b8ff09ca68f899f782c04a48b109f5c60784f061a7350afb9ed379ee68b1"}, {"id": "j25-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j25-1"], "pointIds": ["pyjh.qeq.002"], "prompt": "把方程 $(2x-1)(x+3)=5$ 化成一般形式 $ax^2+bx+c=0$（$a>0$），$a$、$b$、$c$ 依次是多少？", "options": [{"id": "a", "text": "$2,\\ 5,\\ -8$", "feedback": "展开得 $2x^2+5x-3=5$，移项后常数项是 $-3-5$。"}, {"id": "b", "text": "$2,\\ 5,\\ 8$", "feedback": "常数项要连同符号读：$-3$ 移项减 $5$，是负数。"}, {"id": "c", "text": "$2,\\ -5,\\ -8$", "feedback": "一次项是 $6x-x$，系数为正。"}, {"id": "d", "text": "$2,\\ 5,\\ -3$", "feedback": "右边的 $5$ 还没移到左边。"}], "correct": "a", "answer": "$a=2,\\ b=5,\\ c=-8$", "reasoning": ["展开左边：$(2x-1)(x+3)=2x^2+6x-x-3=2x^2+5x-3$。", "移项：$2x^2+5x-3-5=0$，即 $2x^2+5x-8=0$。", "所以 $a=2$，$b=5$，$c=-8$。"], "contentVersion": "sha256:b993bbe8705115c0d25ac72a17adec658fdad62543a4d5c91394f276afd8c029"}, {"id": "j25-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j25-1"], "pointIds": ["pyjh.qeq.003"], "prompt": "已知 $x=2$ 是关于 $x$ 的方程 $x^2+mx-6=0$ 的一个根，$m$ 的值是多少？", "options": [{"id": "a", "text": "$-1$", "feedback": "把 $x=2$ 代入：$4+2m-6=0$，再解 $m$，注意移项变号。"}, {"id": "b", "text": "$5$", "feedback": "代入后常数项是 $4-6=-2$，不是 $4+6$。"}, {"id": "c", "text": "$1$", "feedback": "代入得 $2m-2=0$，所以 $m=1$。"}, {"id": "d", "text": "$-5$", "feedback": "代入时 $x^2=4$，常数项合并为 $-2$。"}], "correct": "c", "answer": "$m=1$", "reasoning": ["根满足方程，把 $x=2$ 代入：$2^2+2m-6=0$。", "$2m-2=0$，$m=1$。"], "contentVersion": "sha256:f7df66bdd61e1089018a2afca3018d46e130ea56fca3e1d623408641e0b94178"}, {"id": "j25-test-04-v2", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j25-2"], "pointIds": ["pyjh.qeq.006"], "prompt": "用配方法解方程 $x^2-6x+2=0$，配方后得到的方程是哪一个？", "options": [{"id": "a", "text": "$(x-3)^2=11$", "feedback": "移项后常数项的符号处理有误，请检查配方时等号两边的变化。"}, {"id": "b", "text": "$(x+3)^2=7$", "feedback": "一次项系数是 $-6$，一半是 $-3$，括号里应是减号。"}, {"id": "c", "text": "$(x-6)^2=34$", "feedback": "加的是一次项系数一半的平方 $9$，不是 $36$。"}, {"id": "d", "text": "$(x-3)^2=7$", "feedback": "移项得 $x^2-6x=-2$，两边加 $9$，得 $(x-3)^2=7$。"}], "correct": "d", "answer": "$(x-3)^2=7$", "reasoning": ["移项：$x^2-6x=-2$。", "两边加上一次项系数一半的平方 $(-3)^2=9$：$x^2-6x+9=7$。", "写成完全平方：$(x-3)^2=7$。"], "contentVersion": "sha256:b28cf23275accbf78888e798b994a22fe257860a76a0dd10fe4fd3eb7227b405"}, {"id": "j25-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j25-2"], "pointIds": ["pyjh.qeq.008"], "prompt": "关于方程 $x^2-4x+5=0$ 的根，下列判断正确的是哪一个？", "options": [{"id": "a", "text": "有两个不相等的实数根", "feedback": "先算判别式 $b^2-4ac=16-20$，它的符号决定根的情况。"}, {"id": "b", "text": "有两个相等的实数根", "feedback": "判别式等于 $0$ 才有两个相等的实数根，这里不等于 $0$。"}, {"id": "c", "text": "没有实数根", "feedback": "$\\Delta=(-4)^2-4\\times1\\times5=-4<0$。"}, {"id": "d", "text": "只有一个实数根", "feedback": "一元二次方程有实数根时总说「两个」实数根（可能相等）。"}], "correct": "c", "answer": "没有实数根", "reasoning": ["$a=1$，$b=-4$，$c=5$，$\\Delta=b^2-4ac=16-20=-4$。", "$\\Delta<0$，方程没有实数根。"], "contentVersion": "sha256:03d177f8e0b4daded5073204d6ee2c08ca19057e95dad21a16cb392d2c4d0172"}, {"id": "j25-test-06-v2", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j25-2"], "pointIds": ["pyjh.qeq.009"], "prompt": "方程 $x(x-3)=2(x-3)$ 的根是什么？", "options": [{"id": "a", "text": "$x=2$", "feedback": "直接约去可能为零的因式会丢根，需要分别讨论。"}, {"id": "b", "text": "$x_1=3,\\ x_2=2$", "feedback": "移项提公因式：$(x-3)(x-2)=0$。"}, {"id": "c", "text": "$x=3$", "feedback": "乘积为零时，不能只保留其中一个因式为零的情况。"}, {"id": "d", "text": "$x_1=3,\\ x_2=-2$", "feedback": "移项后括号外常数的符号处理有误，请重新提公因式。"}], "correct": "b", "answer": "$x_1=3,\\ x_2=2$", "reasoning": ["移项：$x(x-3)-2(x-3)=0$。", "提公因式：$(x-3)(x-2)=0$，所以 $x-3=0$ 或 $x-2=0$。", "$x_1=3$，$x_2=2$。不能两边同除以 $x-3$，那样会丢根。"], "contentVersion": "sha256:f142d7e270e415f666dda78040215ccb063c19d9adf5b3f0f1c379bffc5295d7"}, {"id": "j25-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j25-2"], "pointIds": ["pyjh.qeq.010"], "prompt": "设 $x_1$、$x_2$ 是方程 $x^2-5x+3=0$ 的两个根，$x_1^2+x_2^2$ 的值是多少？", "options": [{"id": "a", "text": "$25$", "feedback": "$(x_1+x_2)^2$ 里还含 $2x_1x_2$，要减掉。"}, {"id": "b", "text": "$31$", "feedback": "$x_1^2+x_2^2=(x_1+x_2)^2-2x_1x_2$，是减不是加。"}, {"id": "c", "text": "$19$", "feedback": "两根之和 $5$、之积 $3$，$25-6=19$。"}, {"id": "d", "text": "$22$", "feedback": "要减去 $2x_1x_2$，而不是只减一个 $x_1x_2$。"}], "correct": "c", "answer": "$19$", "reasoning": ["$\\Delta=25-12=13>0$，方程有两个实数根。", "由根与系数的关系：$x_1+x_2=5$，$x_1x_2=3$。", "$x_1^2+x_2^2=(x_1+x_2)^2-2x_1x_2=25-6=19$。"], "contentVersion": "sha256:13733c9df97ca58e55b5ff81078203012b63da44836deb941f1dcf7be73f10b7"}, {"id": "j25-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j25-1", "j25-2"], "pointIds": ["pyjh.qeq.008", "pyjh.qeq.002"], "prompt": "关于 $x$ 的一元二次方程 $(k-1)x^2+2x+1=0$ 有两个不相等的实数根，$k$ 的取值范围是什么？", "options": [{"id": "a", "text": "$k<2$", "feedback": "还要保证它是一元二次方程，二次项系数不能为 $0$。"}, {"id": "b", "text": "$k>2$", "feedback": "$\\Delta=4-4(k-1)>0$，解出来是小于号。"}, {"id": "c", "text": "$k\\le2$ 且 $k\\ne1$", "feedback": "两个不相等的实数根要求 $\\Delta>0$，不能取等号。"}, {"id": "d", "text": "$k<2$ 且 $k\\ne1$", "feedback": "$\\Delta=8-4k>0$ 得 $k<2$，又 $k-1\\ne0$。"}], "correct": "d", "answer": "$k<2$ 且 $k\\ne1$", "reasoning": ["是一元二次方程，所以 $k-1\\ne0$，$k\\ne1$。", "两个不相等的实数根：$\\Delta=2^2-4(k-1)\\times1=8-4k>0$，$k<2$。", "合起来：$k<2$ 且 $k\\ne1$。"], "contentVersion": "sha256:a8cbba0c54d48d72d858cf99fa91dd9a0716df8db2927e6c47d3fee2f32b5048"}, {"id": "j25-test-09-v2", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j25-3"], "pointIds": ["pyjh.qeq.014"], "prompt": "某果园的年产量两年内从 $2$ 万千克增加到 $2.88$ 万千克。如果每年的增长率相同，这个年平均增长率是多少？", "options": [{"id": "a", "text": "$20\\%$", "feedback": "$2(1+x)^2=2.88$，$(1+x)^2=1.44$，$1+x=1.2$。"}, {"id": "b", "text": "$44\\%$", "feedback": "$0.88\\div2=44\\%$ 是两年的总增长率，不是每年的。"}, {"id": "c", "text": "$12\\%$", "feedback": "从增长倍数求增长率时，既要正确开平方，也要区分增长倍数与增长率。"}, {"id": "d", "text": "$22\\%$", "feedback": "增长是连续两年复合的，不能把总增长率平均分成两份。"}], "correct": "a", "answer": "$20\\%$", "reasoning": ["设年平均增长率为 $x$，则 $2(1+x)^2=2.88$。", "$(1+x)^2=1.44$，$1+x=\\pm1.2$，$x_1=0.2$，$x_2=-2.2$。", "增长率不能为负，舍去 $-2.2$，所以年平均增长率是 $20\\%$。"], "contentVersion": "sha256:ffa752aac635fa0f7bfe26724ce0be63bc81afbcf7b950147e930131abb42643"}, {"id": "j25-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j25-3"], "pointIds": ["pyjh.qeq.013"], "prompt": "一块长 $20$ 米、宽 $12$ 米的矩形空地上，修一条平行于长边和一条平行于宽边的小路，两条路宽度相同，其余部分种草，草地面积为 $180$ 平方米。路宽是多少米？", "options": [{"id": "a", "text": "$30$ 米", "feedback": "路宽要比空地的宽 $12$ 米小，这个根不合题意。"}, {"id": "b", "text": "$2$ 米或 $30$ 米", "feedback": "两个根都要放回实际问题检验，比空地还宽的路要舍去。"}, {"id": "c", "text": "$2$ 米", "feedback": "$(20-x)(12-x)=180$，得 $x=2$ 或 $x=30$，$30$ 不合题意。"}, {"id": "d", "text": "$3$ 米", "feedback": "把两条路平移到边上，草地是长 $20-x$、宽 $12-x$ 的矩形，代入 $x=3$ 面积不是 $180$。"}], "correct": "c", "answer": "$2$ 米", "reasoning": ["设路宽 $x$ 米，把两条路分别平移到空地边上，草地拼成长 $(20-x)$ 米、宽 $(12-x)$ 米的矩形。", "$(20-x)(12-x)=180$，整理得 $x^2-32x+60=0$，$(x-2)(x-30)=0$。", "$x_1=2$，$x_2=30$；路宽小于 $12$ 米，舍去 $30$，路宽为 $2$ 米。"], "contentVersion": "sha256:1e6209560a3db41dd31ed65a57e2d479235a59763e35dfdee36b814ed2c447d0"}, {"id": "j25-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j25-2", "j25-3"], "pointIds": ["pyjh.qeq.017", "pyjh.qeq.009"], "prompt": "某商品每件进价 $30$ 元，按每件 $40$ 元出售时每天能卖 $200$ 件；售价每提高 $1$ 元，每天少卖 $10$ 件。商店想每天获利 $2160$ 元，并且尽量让顾客得到实惠，售价应定为每件多少元？", "options": [{"id": "a", "text": "$48$ 元", "feedback": "两个售价都能获利 $2160$ 元，要让顾客得到实惠，应取较低的售价。"}, {"id": "b", "text": "$42$ 元", "feedback": "设涨价 $x$ 元，$(10+x)(200-10x)=2160$，$x=2$ 或 $8$，取较低售价。"}, {"id": "c", "text": "$42$ 元或 $48$ 元", "feedback": "题目还要求尽量让顾客得到实惠，只能取一个。"}, {"id": "d", "text": "$32$ 元", "feedback": "$32$ 元比原售价 $40$ 元还低，是降价；本题设的是涨价，降价时的销量规律题中没有给出。"}], "correct": "b", "answer": "$42$ 元", "reasoning": ["设每件涨价 $x$ 元，每件利润 $(10+x)$ 元，每天卖 $(200-10x)$ 件。", "$(10+x)(200-10x)=2160$，整理得 $x^2-10x+16=0$，$(x-2)(x-8)=0$，$x_1=2$，$x_2=8$。", "两种售价 $42$ 元、$48$ 元都能获利 $2160$ 元；让顾客得到实惠取低价，售价定为 $42$ 元。"], "contentVersion": "sha256:b5e9ef3a2dc42381de530660b6b763712f8132949eb36dcbc741f239506e01eb"}, {"id": "j25-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j25-2"], "pointIds": ["pyjh.qeq.010", "pyjh.qeq.011"], "prompt": "关于 $x$ 的方程 $x^2+(2m-1)x+m^2=0$ 有两个实数根 $x_1$、$x_2$，并且 $x_1^2+x_2^2=7$。$m$ 的值是多少？", "options": [{"id": "a", "text": "$3$", "feedback": "$m=3$ 时 $\\Delta=1-4m<0$，方程没有实数根，要舍去。"}, {"id": "b", "text": "$3$ 或 $-1$", "feedback": "求出的字母值要回代检验判别式，有一个不满足 $\\Delta\\ge0$。"}, {"id": "c", "text": "$1$", "feedback": "由 $(1-2m)^2-2m^2=7$ 得到的是 $m^2-2m-3=0$，$1$ 不是它的根。"}, {"id": "d", "text": "$-1$", "feedback": "$m^2-2m-3=0$ 得 $m=3$ 或 $-1$，只有 $-1$ 满足 $\\Delta\\ge0$。"}], "correct": "d", "answer": "$m=-1$", "reasoning": ["$x_1+x_2=1-2m$，$x_1x_2=m^2$，所以 $x_1^2+x_2^2=(1-2m)^2-2m^2=2m^2-4m+1=7$。", "$m^2-2m-3=0$，$m_1=3$，$m_2=-1$。", "有两个实数根要 $\\Delta=(2m-1)^2-4m^2=1-4m\\ge0$，即 $m\\le\\frac14$，舍去 $3$，$m=-1$。"], "contentVersion": "sha256:b38d559b6e239d8250b7bb2d63ed48874f9de264ec481182dda8b1a8c7d3f642"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
