<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 589 380" width="589" height="380" role="img" aria-labelledby="title desc">
<title id="title">线段 DB 与两条垂线</title>
<desc id="desc">线段 DB 从左上到右下，E、F 依次在 DB 上。D、C 连成上方的水平线段，A、B 连成下方的水平线段。A 在 DB 左下方，连 AE；C 在 DB 右上方，连 CF。E、F 处都标有直角记号。</desc>
<style>text { fill:#17202a; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="589" height="380" fill="white"/>
<g transform="translate(-336.7 -417.0)">
<line x1="380.0" y1="460.0" x2="772.5" y2="460.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="380.0" y1="460.0" x2="880.0" y2="760.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="487.5" y1="760.0" x2="880.0" y2="760.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="487.5" y1="760.0" x2="591.4" y2="586.8" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="772.5" y1="460.0" x2="668.6" y2="633.2" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<polyline points="604.3,594.6 596.5,607.4 583.7,599.7" fill="none" stroke="#17202a" stroke-width="2.5"/>
<polyline points="655.7,625.4 663.5,612.6 676.3,620.3" fill="none" stroke="#17202a" stroke-width="2.5"/>
<text class="m" x="360.0" y="464.5" text-anchor="middle" font-size="30">D</text>
<text class="m" x="788.5" y="456.5" text-anchor="middle" font-size="30">C</text>
<text class="m" x="465.5" y="776.5" text-anchor="middle" font-size="30">A</text>
<text class="m" x="902.0" y="778.5" text-anchor="middle" font-size="30">B</text>
<text class="m" x="599.4" y="569.3" text-anchor="middle" font-size="30">E</text>
<text class="m" x="656.6" y="673.7" text-anchor="middle" font-size="30">F</text>
</g>
</svg>
