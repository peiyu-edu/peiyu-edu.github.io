<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 15 480 370" width="560" height="432" role="img" aria-labelledby="title desc">
<title id="title">矩形地面的花卉与草坪</title>
<desc id="desc">一个矩形，上方箭头标长 12m，右侧箭头标宽 10m。矩形中间有一个灰色小矩形标“草坪”，它四周的白色部分标“花卉”。</desc>
<style>text { fill:#17202a; font-size:30px; } .i { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .n { font-family:'Times New Roman',Georgia,serif; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect x="10" y="15" width="480" height="370" fill="white"/>
