<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级上册 第三单元 毫米、分米和千米 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p3a-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级上册 第三单元 毫米、分米和千米 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3a-u3-test", "sectionId": "p3a-u3-test", "unitId": "p3a-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级上册 第三单元 毫米、分米和千米 单元测评", "items": [{"id": "p3a-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "3 厘米 = □ 毫米", "answer": "30", "reasoning": ["1 厘米 = 10 毫米。", "3 厘米是 3 个 10 毫米：3 × 10 = 30（毫米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u3.001"], "contentVersion": "sha256:73ee52d210562be1830164f5916ff70ca3c53e1ddc0581a4305545d164122bb6"}, {"id": "p3a-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "1 米 = □ 分米", "answer": "10", "reasoning": ["1 分米 = 10 厘米，1 米 = 100 厘米。", "100 厘米里有 10 个 10 厘米，所以 1 米 = 10 分米。"], "options": [{"id": "a", "text": "1000", "feedback": "1000 是 1 千米里的米数，不是 1 米里的分米数。"}, {"id": "b", "text": "100", "feedback": "1 米 = 100 厘米，换成分米是 10 分米。"}, {"id": "c", "text": "10", "feedback": "对。1 米 = 10 分米。"}], "correct": "c", "pointIds": ["pyps.p3a.u3.002"], "contentVersion": "sha256:906a06f0d1a7855d72d4e419893f7acc641e04e3893b13d48de91a49453bc14d"}, {"id": "p3a-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "2 千米 = □ 米", "answer": "2000", "reasoning": ["1 千米 = 1000 米。", "2 千米是 2 个 1000 米，就是 2000 米。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u3.004"], "contentVersion": "sha256:0d55e23deba69ccd11e7a2d37977de0bdbf773476df32bdc934e9afce9455c48"}, {"id": "p3a-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一枚 1 元硬币大约厚 2（　）。括号里填哪个单位最合适？", "answer": "毫米", "reasoning": ["硬币很薄，比 1 厘米小得多。", "量很短的东西用毫米，所以填毫米。"], "options": [{"id": "a", "text": "米", "feedback": "2 米比大人还高，太大了。"}, {"id": "b", "text": "厘米", "feedback": "2 厘米差不多是手指那么宽，硬币没有那么厚。"}, {"id": "c", "text": "毫米", "feedback": "对。硬币很薄，用毫米作单位。"}], "correct": "c", "pointIds": ["pyps.p3a.u3.006"], "contentVersion": "sha256:b11d713f27cef647490f9433883a1b4cc0dca03648e1947fea4e5adbeba86ee0"}, {"id": "p3a-u3-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "填空：5 分米 = □ 厘米；60 毫米 = □ 厘米", "answer": "50；6", "reasoning": ["1 分米 = 10 厘米，5 分米 = 50 厘米。", "10 毫米 = 1 厘米，60 毫米里有 6 个 10 毫米，是 6 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u3.003"], "contentVersion": "sha256:419770827881fef45cc5aad6487a85d92eac8ec7ccc0954160d553d84e6ca129"}, {"id": "p3a-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面三个长度，哪个最长？", "answer": "950 毫米", "reasoning": ["都换成厘米再比。", "9 分米 = 90 厘米，950 毫米 = 95 厘米，还有 85 厘米。", "95 厘米最长，所以 950 毫米最长。"], "options": [{"id": "a", "text": "9 分米", "feedback": "9 分米 = 90 厘米，比 95 厘米短。"}, {"id": "b", "text": "85 厘米", "feedback": "85 厘米比 90 厘米、95 厘米都短。"}, {"id": "c", "text": "950 毫米", "feedback": "对。950 毫米 = 95 厘米，最长。"}], "correct": "c", "pointIds": ["pyps.p3a.u3.003"], "contentVersion": "sha256:e7d5a08a63cddd766c33c6d8cf348407f49bef1f44a51540d0ac58e42b5f314f"}, {"id": "p3a-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "小明家到外婆家坐汽车要两个多小时，两地相距大约 100（　）。括号里填哪个单位？", "answer": "千米", "reasoning": ["坐汽车走两个多小时，路很远。", "表示很远的路程用千米，所以填千米。"], "options": [{"id": "a", "text": "厘米", "feedback": "100 厘米才 1 米，太短了。"}, {"id": "b", "text": "千米", "feedback": "对。坐汽车要两个多小时的路，用千米作单位。"}, {"id": "c", "text": "米", "feedback": "100 米走一两分钟就到了，不用坐两个多小时汽车。"}], "correct": "b", "pointIds": ["pyps.p3a.u3.006"], "contentVersion": "sha256:aa97356887436d0806613a8c283ead3f27c458047c1d9742767ff2e5ccbf2a6f"}, {"id": "p3a-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "3 千米 − 800 米 = □ 米", "answer": "2200", "reasoning": ["单位不同，先化成同一个单位：3 千米 = 3000 米。", "3000 − 800 = 2200（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u3.005"], "contentVersion": "sha256:cdf119cfafc9b33a712bd1bb7476a82ab3d61e67197814d0ade13aaf0f283675"}, {"id": "p3a-u3-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "学校操场跑一圈是 400 米。小亮已经跑了 3 圈，再跑多少米就正好是 2 千米？", "answer": "800 米", "reasoning": ["3 圈是 400 + 400 + 400 = 1200（米）。", "2 千米 = 2000 米。", "2000 − 1200 = 800（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u3.005", "pyps.p3a.u3.004"], "contentVersion": "sha256:3e754d0f0077cb9d977344292678d505a0c52e52a126393c359ec16e5a0a0ed3"}, {"id": "p3a-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小红走 100 米大约要 2 分钟。她从家走到学校大约用了 10 分钟。她家到学校大约有多少米？", "answer": "大约 500 米", "reasoning": ["把 100 米当作标准，看 10 分钟里有几个 2 分钟。", "2 × 5 = 10，10 分钟里有 5 个 2 分钟。", "5 个 100 米是 500 米，所以大约 500 米。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u3.007"], "contentVersion": "sha256:1267eb3c7aef1a904f2ae21c5e52a3ddccc7e37eb5d7c36533e92a282f0eee44"}, {"id": "p3a-u3-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一根绳子长 1 米，剪下 3 分米 5 厘米，还剩多长？", "answer": "65 厘米", "reasoning": ["先都换成厘米：1 米 = 100 厘米，3 分米 5 厘米 = 35 厘米。", "100 − 35 = 65（厘米）。"], "options": [{"id": "a", "text": "7 分米", "feedback": "剪下的不止 3 分米，还有 5 厘米，剩下的比 7 分米少。"}, {"id": "b", "text": "65 厘米", "feedback": "对。100 厘米 − 35 厘米 = 65 厘米。"}, {"id": "c", "text": "75 厘米", "feedback": "3 分米 5 厘米是 35 厘米，100 − 35 不是 75。"}], "correct": "b", "pointIds": ["pyps.p3a.u3.003", "pyps.p3a.u3.002"], "contentVersion": "sha256:ce156813a3abdac7b3df1d4f5c0a5433a71b76161c8ceddc5900e474a220eee9"}], "contentVersion": "sha256:41974e65abffa509f6d7a2a8774358fa4b12088d7ef512cb7b10cb0130bc14eb"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
