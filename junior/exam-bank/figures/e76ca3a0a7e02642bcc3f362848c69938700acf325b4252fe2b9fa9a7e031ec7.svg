<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 252" role="img" aria-labelledby="title desc"><title id="title">直角梯形ABCD被折线分成两部分</title><desc id="desc">两幅图都是直角梯形ABCD：A在左上，D在右上，B在左下，C在右下，AB竖直，AD和BC水平，AD比BC短。图1中点P在形内，折线B—P—D把梯形分成左上的S1和右边的S2。图2中P、Q在形内且PQ水平，Q在P右边，折线B—P—Q—D把梯形分成上方的S1和下方的S2。</desc><style>path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M40,64L142,64L210,200L40,200ZM40,200L114.80000000000001,155.8L142,64M290,64L392,64L460,200L290,200ZM290,200L330.8,133.7L371.6,133.7L392,64"/><text x="24" y="60" font-size="17" font-style="italic">A</text><text x="138" y="58" font-size="17" font-style="italic">D</text><text x="23" y="214" font-size="17" font-style="italic">B</text><text x="214" y="214" font-size="17" font-style="italic">C</text><text x="111" y="176" font-size="17" font-style="italic">P</text><text x="74" y="112" font-size="17" font-style="italic">S<tspan font-size="11" dy="4">1</tspan></text><text x="139" y="152" font-size="17" font-style="italic">S<tspan font-size="11" dy="4">2</tspan></text><text x="111" y="240" font-size="16">图1</text><text x="274" y="60" font-size="17" font-style="italic">A</text><text x="388" y="58" font-size="17" font-style="italic">D</text><text x="273" y="214" font-size="17" font-style="italic">B</text><text x="464" y="214" font-size="17" font-style="italic">C</text><text x="334" y="153" font-size="17" font-style="italic">P</text><text x="362" y="154" font-size="17" font-style="italic">Q</text><text x="331" y="112" font-size="17" font-style="italic">S<tspan font-size="11" dy="4">1</tspan></text><text x="392" y="180" font-size="17" font-style="italic">S<tspan font-size="11" dy="4">2</tspan></text><text x="361" y="240" font-size="16">图2</text></svg>