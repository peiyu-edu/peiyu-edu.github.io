<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五年级下册 第二单元 因数与倍数 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p5b-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>五年级下册 第二单元 因数与倍数 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p5b-u2-test", "sectionId": "p5b-u2-test", "unitId": "p5b-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "五年级下册 第二单元 因数与倍数 单元测评", "items": [{"id": "p5b-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "4 × 6 = 24。下面说法对的是哪个？", "answer": "4 和 6 都是 24 的因数", "reasoning": ["4 × 6 = 24，所以 4 和 6 都是 24 的因数。", "24 是 4 的倍数，也是 6 的倍数。"], "options": [{"id": "a", "text": "4 是 6 的倍数", "feedback": "4 和 6 之间没有这样的关系。"}, {"id": "b", "text": "4 和 6 都是 24 的因数", "feedback": "对。24 是 4 的倍数，也是 6 的倍数。"}, {"id": "c", "text": "24 是 4 的因数", "feedback": "应该说 24 是 4 的倍数，4 是 24 的因数。"}], "correct": "b", "pointIds": ["pyps.p5b.u2.001"], "contentVersion": "sha256:d2d8323c637bedae2e336ee895f95e2060a07472d60fe71e66af26533b4cfb42"}, {"id": "p5b-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "写出 36 的所有因数。", "answer": "1, 2, 3, 4, 6, 9, 12, 18, 36", "reasoning": ["一对一对地找：1 × 36 = 36，2 × 18 = 36，3 × 12 = 36，4 × 9 = 36，6 × 6 = 36。", "6 × 6 只算一个 6，所以 36 的因数是 1, 2, 3, 4, 6, 9, 12, 18, 36。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u2.002"], "contentVersion": "sha256:c8eb6ab4303c1fb1fb36973105caddfe336ce4010bcf6dbf532f7ada4488d939"}, {"id": "p5b-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "写出 7 的倍数中最小的 5 个。", "answer": "7, 14, 21, 28, 35", "reasoning": ["7 的倍数中最小的是 7 本身。", "依次乘 1、2、3、4、5：7, 14, 21, 28, 35。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u2.003"], "contentVersion": "sha256:b925b7297fedc45cecd9125f6db1db65f2de52bf821bd116d37839b0b0a9799f"}, {"id": "p5b-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪个数既是 2 的倍数，又是 5 的倍数？", "answer": "70", "reasoning": ["2 的倍数个位是 0、2、4、6、8；5 的倍数个位是 0 或 5。", "个位是 0 的数同时是 2 和 5 的倍数，所以是 70。"], "options": [{"id": "a", "text": "75", "feedback": "个位是 5，不是 2 的倍数。"}, {"id": "b", "text": "52", "feedback": "个位是 2，不是 5 的倍数。"}, {"id": "c", "text": "70", "feedback": "对。个位是 0，既是 2 的倍数，又是 5 的倍数。"}], "correct": "c", "pointIds": ["pyps.p5b.u2.004", "pyps.p5b.u2.007"], "contentVersion": "sha256:a8d6ba0ff4d8c275fce9f6fd9cb16c1a0b4dec0afdfb9277fdad6c9f6050a387"}, {"id": "p5b-u2-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪个数是 3 的倍数？", "answer": "471", "reasoning": ["看各位上的数相加的和是不是 3 的倍数。", "471：4 + 7 + 1 = 12，12 是 3 的倍数，所以 471 是 3 的倍数。"], "options": [{"id": "a", "text": "471", "feedback": "对。4 + 7 + 1 = 12，12 是 3 的倍数。"}, {"id": "b", "text": "472", "feedback": "4 + 7 + 2 = 13，不是 3 的倍数。"}, {"id": "c", "text": "341", "feedback": "3 + 4 + 1 = 8，不是 3 的倍数。"}], "correct": "a", "pointIds": ["pyps.p5b.u2.006"], "contentVersion": "sha256:a1e55eab2488495c232852c2eb60d09c7f47de3003e6e31a44ae60830e40bfc4"}, {"id": "p5b-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "27、37、51 这三个数中，哪个是质数？", "answer": "37", "reasoning": ["质数只有 1 和它本身两个因数。", "37 不是 2、3、5 的倍数，也不是 7 的倍数，只有 1 和 37 两个因数，是质数。"], "options": [{"id": "a", "text": "37", "feedback": "对。37 只有 1 和 37 两个因数。"}, {"id": "b", "text": "27", "feedback": "27 = 3 × 9，除了 1 和 27 还有因数 3、9，是合数。"}, {"id": "c", "text": "51", "feedback": "51 = 3 × 17，5 + 1 = 6，是 3 的倍数，是合数。"}], "correct": "a", "pointIds": ["pyps.p5b.u2.009"], "contentVersion": "sha256:7e9e2a425ce03cded7f0b3cf44e017737f46fc64392e8c133dcf2011dcbda754"}, {"id": "p5b-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面说法对的是哪个？", "answer": "1 既不是质数，也不是合数", "reasoning": ["质数有两个因数，合数有两个以上的因数。", "1 只有 1 个因数，所以既不是质数，也不是合数。"], "options": [{"id": "a", "text": "所有的偶数都是合数", "feedback": "2 是偶数，但只有 1 和 2 两个因数，是质数。"}, {"id": "b", "text": "1 既不是质数，也不是合数", "feedback": "对。1 只有 1 个因数。"}, {"id": "c", "text": "所有的奇数都是质数", "feedback": "9 是奇数，有因数 3，是合数。"}], "correct": "b", "pointIds": ["pyps.p5b.u2.008"], "contentVersion": "sha256:ca9843d4cb24b6cb0d4bfab1bdf3cb410fc88b562c81ccd7f37b4fba155b7648"}, {"id": "p5b-u2-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "同时是 2、3、5 的倍数的三位数中，最小的是几？", "answer": "120", "reasoning": ["是 2 和 5 的倍数，个位一定是 0。", "百位最小是 1；还要是 3 的倍数，1 + □ + 0 要是 3 的倍数，□ 最小填 2。", "所以最小的是 120。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u2.007"], "contentVersion": "sha256:c3d26b3118163b52abed645711054c8d573a7ad1b76a2818465d047c9c53045f"}, {"id": "p5b-u2-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "三个奇数相加，和是奇数还是偶数？", "answer": "奇数", "reasoning": ["先看前两个：奇数 + 奇数 = 偶数。", "再加第三个：偶数 + 奇数 = 奇数。", "例如 1 + 3 + 5 = 9，是奇数。"], "options": [{"id": "a", "text": "不一定", "feedback": "不管是哪三个奇数，和都是奇数。"}, {"id": "b", "text": "奇数", "feedback": "对。奇数 + 奇数 = 偶数，偶数 + 奇数 = 奇数。"}, {"id": "c", "text": "偶数", "feedback": "两个奇数相加是偶数，再加一个奇数就变成奇数。"}], "correct": "b", "pointIds": ["pyps.p5b.u2.010"], "contentVersion": "sha256:70d5f837d196ad6e8aa55b4f1cb46fa273cb3aeae40b84e24240cb8dc1bd2033"}, {"id": "p5b-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "用 24 个同样大的正方形拼成一个长方形（拼成一整块，中间没有空）。可以拼成几种不同的长方形？（长和宽交换算同一种）", "answer": "4 种", "reasoning": ["长方形的长和宽相乘要等于 24，就是找 24 的因数，一对一对地找。", "1 × 24 = 24，2 × 12 = 24，3 × 8 = 24，4 × 6 = 24。", "所以有 4 种。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u2.002"], "contentVersion": "sha256:16945591ec2bf493bcb0f92883c670d537d056e4060acbf6ab3145bbe7623d6f", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"40\" y=\"40\" width=\"220\" height=\"100\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><text x=\"150\" y=\"94\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">24 块小正方形<\/text><text x=\"150\" y=\"170\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">行数、列数待定<\/text><\/svg>"}, {"id": "p5b-u2-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "两个质数的和是 15，这两个质数分别是几？", "answer": "2 和 13", "reasoning": ["15 是奇数，两个数的和是奇数，必须是一个奇数加一个偶数。", "偶数里只有 2 是质数，所以其中一个是 2，另一个是 15 − 2 = 13。", "13 只有 1 和 13 两个因数，是质数。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u2.008", "pyps.p5b.u2.010"], "contentVersion": "sha256:e3b7cff8da97392dcdf131367b7abad522b003fc1bac88c787b7f8e2f5f8b0ad"}, {"id": "p5b-u2-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "四位数 52□0 是 3 的倍数，□ 里最大能填几？", "answer": "8", "reasoning": ["5 + 2 + 0 = 7，7 加上 □ 要是 3 的倍数。", "□ 可以填 2、5、8（和是 9、12、15），最大填 8。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u2.006"], "contentVersion": "sha256:2447c966fd53c19e12f0a10dc9e142c40734882859e2170ae3529ae4e0f3d40d"}], "contentVersion": "sha256:4a341e31815c0cbe683f3f31c15ff9625447540ed0c132268e1768a9cba5a975"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
