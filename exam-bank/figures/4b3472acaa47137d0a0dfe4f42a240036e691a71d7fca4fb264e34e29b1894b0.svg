<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 560" role="img" aria-labelledby="title desc"><title id="title">累加算法流程图</title><desc id="desc">x←1、S←0，循环执行S←S+x/2；判断x≥4，是则输出S并结束，否则令x←x+1再返回累加。</desc><style>svg{color:#243d45;background:#fff}text{fill:currentColor;font:18px serif}path,line,polyline,polygon,rect,circle,ellipse{fill:none;stroke:currentColor;stroke-width:1.6}.dash{stroke-dasharray:6 5}.arrow{fill:currentColor;stroke:none}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><rect x="125" y="20" width="110" height="42" rx="20"/><rect x="100" y="93" width="160" height="46"/><rect x="100" y="190" width="160" height="48"/><path d="M180 280L265 325 180 370 95 325Z M125 410H260L235 455H100Z"/><rect x="125" y="495" width="110" height="42" rx="20"/><rect x="310" y="190" width="115" height="48"/><path d="M180 62V93 M180 139V190 M180 238V280 M180 370V410 M180 455V495 M265 325H367V238 M367 190V165H180"/><path class="arrow" d="M180 91l-4 -9h8Z M180 188l-4 -9h8Z M180 278l-4 -9h8Z M180 408l-4 -9h8Z M180 493l-4 -9h8Z M367 240l-4 9h8Z M181 165l9 -4v8Z"/><text x="160" y="47">开始</text><text x="113" y="123">x←1，S←0</text><text x="114" y="221">S←S+x/2</text><text x="153" y="331">x≥4</text><text x="320" y="221">x←x+1</text><text x="285" y="314">N</text><text x="195" y="395">Y</text><text x="145" y="440">输出 S</text><text x="160" y="522">结束</text></svg>
