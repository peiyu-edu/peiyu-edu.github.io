 "小林从家出发，先向正东走 400 米到书店，再从书店向北偏东 30° 方向走 300 米到公园。小林从公园沿原路回家，应该怎样走？", "answer": "先向南偏西 30° 方向走 300 米到书店，再向正西走 400 米到家。", "reasoning": ["回家时，每一段都以这一段的起点为参照点，方向和去的时候相反。", "从公园到书店：书店在公园南偏西 30° 方向 300 米处。", "从书店到家：家在书店正西方向 400 米处。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u1.007", "pyps.p6a.u1.006"], "contentVersion": "sha256:233f653a02ab25b0a7ba36ab0deec49f13bd72780056731f3322229ebafd3a58", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 280\" role=\"img\" aria-label=\"按题干顺序连接的路线\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><text x=\"245\" y=\"25\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">北 ↑<\/text><circle cx=\"38.0\" cy=\"165.0\" r=\"3\" style=\"fill:var(--b);stroke:var(--b);stroke-width:2\"/><text x=\"38.0\" y=\"153.0\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">家<\/text><circle cx=\"168.87\" cy=\"165.0\" r=\"3\" style=\"fill:var(--b);stroke:var(--b);stroke-width:2\"/><text x=\"168.87\" y=\"153.0\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">书店<\/text><path d=\"M38.0,165.0 L168.87,165.0\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><circle cx=\"217.94\" cy=\"80.0\" r=\"3\" style=\"fill:var(--b);stroke:var(--b);stroke-width:2\"/><text x=\"217.94\" y=\"68.0\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">公园<\/text><path d=\"M168.87,165.0 L217.94,80.0\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"140\" y=\"200\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">先正东 400 米<\/text><text x=\"140\" y=\"224\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">再北偏东 30°，300 米<\/text><\/svg>"}, {"id": "p6a-u1-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一辆汽车从甲地开到乙地，路程 120 千米，用了 2 小时；接着从乙地开到丙地，路程 90 千米，用了 1 小时。这辆汽车全程平均每小时行多少千米？", "answer": "（120 + 90）÷（2 + 1）= 70（千米/小时）", "reasoning": ["全程平均速度 = 总路程 ÷ 总时间。", "总路程 120 + 90 = 210（千米），总时间 2 + 1 = 3（小时）。", "210 ÷ 3 = 70（千米/小时）。不能把两段的速度 60 和 90 直接平均。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u1.008"], "contentVersion": "sha256:d6fe7df746f178691ea92a86c885ad05a7d63f33d2161d79e0f4526db188a8bd"}, {"id": "p6a-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一张地图上，每 1 厘米表示实际距离 50 米。超市在学校的北偏西 45° 方向，图上距离是 4 厘米。超市在学校的什么位置？", "answer": "北偏西 45° 方向 200 米处", "reasoning": ["以学校为参照点，超市在北偏西 45° 方向。", "实际距离 50 × 4 = 200（米）。"], "options": [{"id": "a", "text": "北偏西 45° 方向 200 米处", "feedback": "对。方向照图上读，距离 50 × 4 = 200（米）。"}, {"id": "b", "text": "南偏东 45° 方向 200 米处", "feedback": "这是学校在超市的方向。问的是超市在学校的哪个方向。"}, {"id": "c", "text": "北偏西 45° 方向 54 米处", "feedback": "不是加 4，图上有 4 个 1 厘米，要用乘法：50 × 4。"}], "correct": "a", "pointIds": ["pyps.p6a.u1.004", "pyps.p6a.u1.003"], "contentVersion": "sha256:40c77de7047f89db9dddb9dbaea4ed8cfbcc71cdce7598eef0ca38df1aab95d8", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 265\" role=\"img\" aria-label=\"已知观测点、方向和距离\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M28,112 L250,112\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M140,34 L140,185\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><text x=\"260\" y=\"118\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">东<\/text><text x=\"20\" y=\"118\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">西<\/text><text x=\"140\" y=\"27\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">北<\/text><text x=\"140\" y=\"204\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">南<\/text><circle cx=\"140\" cy=\"112\" r=\"3\" style=\"fill:var(--fg);stroke:var(--fg);stroke-width:2\"/><text x=\"210\" y=\"146\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">学校<\/text><path d=\"M140,112 L81.31,53.31\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><circle cx=\"81.31\" cy=\"53.31\" r=\"3\" style=\"fill:var(--b);stroke:var(--b);stroke-width:2\"/><text x=\"81.31\" y=\"40.31\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">超市<\/text><text x=\"140\" y=\"230\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">北偏西 45°，图上 4 厘米<\/text><text x=\"140\" y=\"254\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">1 厘米表示 50 米<\/text><\/svg>"}], "contentVersion": "sha256:d7ad0bf6232a4721b3b2a2ef941c8e2fc9fc12e31396f4f75cce198b9f14e337"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
