<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 338" width="530" height="338" role="img" aria-labelledby="title desc">
<title id="title">平行线与角 1、角 2</title>
<desc id="desc">AB 在上方水平，A 在左。从 B 向左下连 BC，CD 从 C 水平向右。直线 EF 与 BC 平行，E 在右上，F 在左下，与 CD 相交。∠ABC 标为∠1；EF 与 CD 的交点处，CD 下方、靠 D 一侧的角标为∠2。</desc>
