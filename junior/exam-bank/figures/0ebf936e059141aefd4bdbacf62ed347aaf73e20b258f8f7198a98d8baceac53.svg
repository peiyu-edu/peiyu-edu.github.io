<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" role="img"><title>平行线间的支撑结构</title><desc>AB与CD平行，一条斜线分别与AB、CD相交，另一条线段从AB连到斜线上；∠1在CD与斜线之间，∠2在两条斜线之间，∠3在AB与较陡线段之间。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><line x1="40" y1="60" x2="320" y2="60" class=""></line><line x1="60" y1="220" x2="320" y2="220" class=""></line><line x1="40" y1="244" x2="212" y2="39" class=""></line><line x1="130" y1="136.58" x2="143.5" y2="60" class=""></line><path d="M88.14 220 A28 28 0 0 0 78.14 198.55"></path><path d="M135.21 107.04 A30 30 0 0 1 149.28 113.60"></path><path d="M119.5 60 A24 24 0 0 0 139.33 83.64"></path><text x="25" y="67">A</text><text x="334" y="67">B</text><text x="50" y="217">C</text><text x="334" y="227">D</text><text x="97" y="211">1</text><text x="154" y="95">2</text><text x="111" y="102">3</text></svg>
