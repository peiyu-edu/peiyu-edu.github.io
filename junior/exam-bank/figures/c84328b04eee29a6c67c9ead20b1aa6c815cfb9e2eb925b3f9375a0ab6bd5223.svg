<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img"><title>四幅字母组合图形</title><desc>四个选项按两行排列。A图上部为一条横线和左、中、右三条竖线，横线下方接两个凹口向上的圆弧；中央下方接尖角朝上的折线，两端向外下方伸出，底部接弧线。B图左下部有从同一端点伸出的斜线、折线和水平线，右侧连着向内盘绕的螺旋曲线。C图是并排的实心字母A和B，A中间有尖角朝上的空白，B右侧有上下两个圆弧状空白。D图顶部为两条斜向下展开的曲线，下方有一条竖线，竖线右侧伸出上下两个圆弧形部分。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><g transform="translate(25 25)" style="stroke-width:5"><path d="M30 8 V42 Q30 65 75 54 Q120 65 120 42 V8 M30 18 H120 M75 18 V54" class=""></path><path d="M75 48 L39 105 L75 72 L111 105 Z" class="shade"></path><path d="M53 91 Q75 109 97 91" class=""></path></g><text x="100" y="168">A</text><g transform="translate(225 25)"><path d="M18 83 L64 120 L44 58 M64 120 Q75 79 104 113 M64 120 H126 M104 113 C87 80 95 35 128 31 C170 23 193 75 164 96 C138 119 109 92 127 68 C140 50 162 61 153 76 C146 86 137 79 141 72" class=""></path></g><text x="300" y="168">B</text><g transform="translate(45 210)"><path d="M0 5 H50 V110 L25 5 L0 110 Z" style="fill:var(--ink);stroke:none"></path><path d="M65 5 H100 V110 H65 Q98 108 97 82 Q96 59 67 57 Q96 55 97 31 Q95 8 65 5" style="fill:var(--ink);stroke:none"></path></g><text x="100" y="350">C</text><g transform="translate(235 210)"><path d="M15 39 Q45 31 70 6 Q97 29 124 38 M49 26 H91 M56 38 L54 110 M57 42 Q106 37 100 59 L58 65 M57 78 Q111 69 102 99 L56 104" class=""></path></g><text x="300" y="350">D</text></svg>
