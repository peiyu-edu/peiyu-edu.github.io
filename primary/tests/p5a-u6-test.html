 {"id": "b", "text": "24 平方厘米", "feedback": "对。底 6 厘米对应的高是 4 厘米，6 × 4 = 24。"}, {"id": "c", "text": "20 平方厘米", "feedback": "4 厘米是 6 厘米这条底上的高，不能和 5 厘米相乘。"}], "correct": "b", "pointIds": ["pyps.p5a.u6.001"], "contentVersion": "sha256:e9e92a118931bcdce0d3ff53d91c325ab6eff65ad765d88337ffb20a4ed4dd05", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"45,140 225,140 260,45 80,45\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><line x1=\"85\" y1=\"45\" x2=\"85\" y2=\"140\" style=\"stroke:var(--b);stroke-width:2;stroke-dasharray:5 4\"/><line x1=\"85\" y1=\"130\" x2=\"95\" y2=\"130\" style=\"stroke:var(--b);stroke-width:2\"/><line x1=\"95\" y1=\"130\" x2=\"95\" y2=\"140\" style=\"stroke:var(--b);stroke-width:2\"/><text x=\"95\" y=\"100\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">4 厘米<\/text><text x=\"150\" y=\"166\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">6 厘米<\/text><text x=\"35\" y=\"65\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">5 厘米<\/text><\/svg>"}, {"id": "p5a-u6-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个平行四边形的面积是 54 平方米，底是 9 米。它的高是多少米？", "answer": "6 米", "reasoning": ["平行四边形的面积 = 底 × 高，所以高 = 面积 ÷ 底。", "54 ÷ 9 = 6（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u6.002"], "contentVersion": "sha256:9b449e82917540179cb61d435f0048430617ccda9b6279787191bda716e97166", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"45,140 225,140 260,45 80,45\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><line x1=\"85\" y1=\"45\" x2=\"85\" y2=\"140\" style=\"stroke:var(--b);stroke-width:2;stroke-dasharray:5 4\"/><line x1=\"85\" y1=\"130\" x2=\"95\" y2=\"130\" style=\"stroke:var(--b);stroke-width:2\"/><line x1=\"95\" y1=\"130\" x2=\"95\" y2=\"140\" style=\"stroke:var(--b);stroke-width:2\"/><text x=\"95\" y=\"100\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">高？<\/text><text x=\"150\" y=\"166\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">9 米<\/text><text x=\"185\" y=\"125\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">S = 54 m²<\/text><\/svg>"}, {"id": "p5a-u6-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "两个完全一样的三角形正好拼成一个平行四边形，这个平行四边形的面积是 36 平方厘米。每个三角形的面积是多少？", "answer": "18 平方厘米", "reasoning": ["两个完全一样的三角形拼成平行四边形，每个三角形的面积是平行四边形的一半。", "36 ÷ 2 = 18（平方厘米）。"], "options": [{"id": "a", "text": "72 平方厘米", "feedback": "三角形比拼成的平行四边形小，不能乘 2。"}, {"id": "b", "text": "18 平方厘米", "feedback": "对。每个三角形是平行四边形的一半，36 ÷ 2 = 18。"}, {"id": "c", "text": "36 平方厘米", "feedback": "36 平方厘米是两个三角形合起来的面积。"}], "correct": "b", "pointIds": ["pyps.p5a.u6.004"], "contentVersion": "sha256:ccfd1a05d25f1de9dac67394666357d5ec5024665868ec7b5a5a68c50b93cf74", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"45,145 220,145 255,50 80,50\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><line x1=\"45\" y1=\"145\" x2=\"255\" y2=\"50\" style=\"stroke:var(--b);stroke-width:2;stroke-dasharray:5 4\"/><text x=\"150\" y=\"181\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">拼成后面积 36 cm²<\/text><\/svg>"}, {"id": "p5a-u6-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个三角形的面积是 30 平方厘米，底是 12 厘米。这条底上的高是多少厘米？", "answer": "5 厘米", "reasoning": ["三角形的面积 = 底 × 高 ÷ 2，所以底 × 高 = 30 × 2 = 60。", "高 = 60 ÷ 12 = 5（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u6.004", "pyps.p5a.u6.002"], "contentVersion": "sha256:83e69ba856a13672a41e9315839e1c688cdbd45041121cfa176bb3f2b2ec7103", dle\" style=\"fill:var(--fg);font-size:16px\">8 米<\/text><text x=\"218\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">4 米<\/text><text x=\"268\" y=\"65\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">3 米<\/text><\/svg>"}, {"id": "p5a-u6-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一块梯形菜地，上底 300 米，下底 500 米，高 200 米。它的面积是多少公顷？", "answer": "8 公顷", "reasoning": ["先求面积：300 + 500 = 800，800 × 200 = 160000，160000 ÷ 2 = 80000（平方米）。", "1 公顷 = 10000 平方米，80000 平方米是 8 公顷。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u6.005", "pyps.p5a.u6.003"], "contentVersion": "sha256:fc63c4895639e1543ddb84a15597cf1269faa35b6d39971c8eba80d2a1cd0e0e", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"45,140 255,140 215,45 85,45\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><line x1=\"85\" y1=\"45\" x2=\"85\" y2=\"140\" style=\"stroke:var(--b);stroke-width:2;stroke-dasharray:5 4\"/><line x1=\"85\" y1=\"130\" x2=\"95\" y2=\"130\" style=\"stroke:var(--b);stroke-width:2\"/><line x1=\"95\" y1=\"130\" x2=\"95\" y2=\"140\" style=\"stroke:var(--b);stroke-width:2\"/><text x=\"95\" y=\"100\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">200 米<\/text><text x=\"150\" y=\"166\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">500 米<\/text><text x=\"150\" y=\"30\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">300 米<\/text><\/svg>"}, {"id": "p5a-u6-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "在方格纸上估一片树叶的面积，每个方格 1 平方厘米。树叶盖住的满格有 20 个，不满一格的有 12 个。这片树叶的面积大约是多少平方厘米？", "answer": "大约 26 平方厘米", "reasoning": ["满格的算 1 格，有 20 格；不满一格的算半格，12 个算 12 ÷ 2 = 6（格）。", "20 + 6 = 26，大约 26 平方厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u6.007"], "contentVersion": "sha2
