": "sha256:7f8e761a14ac725a1438df979c149bdebdbc40552692a0a1a77dc0f6a2325ff2"}, {"id": "p4b-u8-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "5 名同学中，最高的身高 142 厘米，最矮的 128 厘米。他们的平均身高可能是多少？", "answer": "135 厘米", "reasoning": ["移多补少后，高的变矮，矮的变高。", "所以平均数比最小的数大，比最大的数小，只有 135 厘米在 128 和 142 之间。"], "options": [{"id": "a", "text": "125 厘米", "feedback": "平均数不会比最矮的 128 厘米还矮。"}, {"id": "b", "text": "145 厘米", "feedback": "平均数不会比最高的 142 厘米还高。"}, {"id": "c", "text": "135 厘米", "feedback": "对。平均数在最小的数和最大的数之间。"}], "correct": "c", "pointIds": ["pyps.p4b.u8.002"], "contentVersion": "sha256:2adb0c4c131326d285edc83dd94a9cbb709e3659546250cac9ad66eefb54ca13"}, {"id": "p4b-u8-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "三堆书分别有 7 本、12 本、8 本。移多补少，让每堆一样多，每堆有几本？", "answer": "9 本", "reasoning": ["一共有 7 + 12 + 8 = 27（本）。", "平均分成 3 堆：27 ÷ 3 = 9（本）。", "也可以从 12 本那堆拿 2 本给 7 本那堆，拿 1 本给 8 本那堆，每堆都是 9 本。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u8.001"], "contentVersion": "sha256:34152d56f57ca4eaba4577d27de1000ee95f768462fbd0d253830facd5768310", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 235\" role=\"img\" aria-label=\"七本、十二本和八本的三堆书，尚未移多补少\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"38\" y=\"175\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"38\" y=\"164\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"38\" y=\"153\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"38\" y=\"142\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"38\" y=\"131\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"38\" y=\"120\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"38\" y=\"109\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><text x=\"65\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">7 本<\/text><rect x=\"123\" y=\"175\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"164\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"153\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"142\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"131\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"120\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"109\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"98\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"87\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"76\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"65\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"123\" y=\"54\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><text x=\"150\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">12 本<\/text><rect x=\"208\" y=\"175\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"208\" y=\"164\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"208\" y=\"153\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"208\" y=\"142\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"208\" y=\"131\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"208\" y=\"120\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"208\" y=\"109\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><rect x=\"208\" y=\"98\" width=\"54\" height=\"9\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:1.5\" /><text x=\"235\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">8 本<\/text><\/svg>"}, {"id": "p4b-u8-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一张复式条形统计图每格代表 5 人。四年级男生的直条高 8 格，女生的直条高 7 格。四年级男生、女生各有多少人？", "answer": "男生 40 人，女生 35 人", "reasoning": ["男生：5 × 8 = 40（人）。", "女生：5 × 7 = 35（人）。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u8.004"], "contentVersion": "sha256:aae337c5162de04249aa74321582afa7d5a2b5aab541330554724ea96d3641ea", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 289\" role=\"img\" aria-label=\"条形统计图；男生；女生；四年级；每小格 1 格\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M43,205 L285,205\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"210\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">0<\/text><path d=\"M43,186.25 L285,186.25\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"191.25\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">1<\/text><path d=\"M43,167.5 L285,167.5\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"172.5\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">2<\/text><path d=\"M43,148.75 L285,148.75\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"153.75\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">3<\/text><path d=\"M43,130 L285,130\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"135\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">4<\/text><path d=\"M43,111.25 L285,111.25\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"116.25\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">5<\/text><path d=\"M43,92.5 L285,92.5\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"97.5\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">6<\/text><path d=\"M43,73.75 L285,73.75\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"78.75\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">7<\/text><path d=\"M43,55 L285,55\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"60\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">8<\/text><text x=\"43\" y=\"24\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">格<\/text><rect x=\"133\" y=\"55\" width=\"30\" height=\"150\" style=\"fill:var(--a);stroke:var(--a);stroke-width:1.5\" /><rect x=\"163\" y=\"73.75\" width=\"30\" height=\"131.25\" style=\"fill:var(--b);stroke:var(--b);stroke-width:1.5\" /><text x=\"163\" y=\"231\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">四年级<\/text><rect x=\"60\" y=\"27\" width=\"13\" height=\"13\" style=\"fill:var(--a);stroke:var(--a);stroke-width:1.5\" /><text x=\"80\" y=\"40\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">男生<\/text><rect x=\"185\" y=\"27\" width=\"13\" height=\"13\" style=\"fill:var(--b);stroke:var(--b);stroke-width:1.5\" /><text x=\"205\" y=\"40\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">女生<\/text><text x=\"150\" y=\"271\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">每格代表 5 人<\/text><\/svg>"}, {"id": "p4b-u8-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "4 名同学平均每人捐了 15 本书。他们一共捐了多少本？", "answer": "60 本", "reasoning": ["平均数 × 份数 = 总数。", "15 × 4 = 60（本）。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u8.003"], "contentVersion": "sha256:f268153d5362244136e27445bd3056f273fea65b1abdb8b2103aea8af89733d3"}, {"id": "p4b-u8-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "甲组 5 人一共做了 80 朵纸花，乙组 6 人一共做了 90 朵。哪组平均每人做得多？", "answer": "甲组", "reasoning": ["甲组平均每人：80 ÷ 5 = 16（朵）。", "乙组平均每人：90 ÷ 6 = 15（朵）。", "16 > 15，甲组平均每人做得多。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u8.003"], "contentVersion": "sha256:363519a1449f8e2e6aebd006a3dde4c280275e498c525c083f64d259cc360524"}, {"id": "p4b-u8-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个班同学的平均身高是 136 厘米。根据这条信息，下面哪种说法一定正确？", "answer": "可能有同学比 136 厘米矮", "reasoning": ["平均数表示一组数据的一般水平，不能由平均身高断定每个人的身高。", "同学们可能有高有矮，也可能都一样高。因此「可能有同学比 136 厘米矮」正确，另两项都不能由已知信息断定。"], "options": [{"id": "a", "text": "可能有同学比 136 厘米矮", "feedback": "对。可能有同学比 136 厘米矮，也有同学比 136 厘米高；也可能每个人都是 136 厘米。"}, {"id": "b", "text": "每个同学都是 136 厘米", "feedback": "不能断定每个同学都是 136 厘米；也可能有人高、有人矮，平均仍是 136 厘米。"}, {"id": "c", "text": "没有同学比 136 厘米高", "feedback": "不能断定没有同学比 136 厘米高；如果有人比平均数矮，就一定有人比平均数高。"}], "correct": "a", "pointIds": ["pyps.p4b.u8.002"], "contentVersion": "sha256:25666c4a70c1294e7b61f7263e862c0789cfae0a7c2d4d274117a82a3666a6fa"}, {"id": "p4b-u8-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小林前 3 次单元测评的平均分是 88 分，第 4 次得了 96 分。这 4 次的平均分是多少？", "answer": "90 分", "reasoning": ["前 3 次一共：88 × 3 = 264（分）。", "4 次一共：264 + 96 = 360（分）。", "平均分：360 ÷ 4 = 90（分）。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u8.003", "pyps.p4b.u8.001"], "contentVersion": "sha256:a20313e55d2f6d0b81427c2a3f202cdc5390fd835792afa72f74be68ff70067a"}, {"id": "p4b-u8-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一张条形统计图每格代表 10 千克，记录了一个小组 3 天回收的废纸：第一天 3 格，第二天 5 格，第三天 4 格。平均每天回收多少千克？", "answer": "40 千克", "reasoning": ["三天分别是 30 千克、50 千克、40 千克。", "一共 30 + 50 + 40 = 120（千克）。", "120 ÷ 3 = 40（千克）。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u8.001", "pyps.p4a.u6.002"], "contentVersion": "sha256:51d66d7bef2b72554334c810a7e29f61949b1fbad3845d6dc5f0e29e1189394a", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 264\" role=\"img\" aria-label=\"条形统计图；第一天、第二天、第三天；每小格 1 格\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M43,180 L285,180\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"185\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">0<\/text><path d=\"M43,150 L285,150\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"155\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">1<\/text><path d=\"M43,120 L285,120\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"125\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">2<\/text><path d=\"M43,90 L285,90\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"95\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">3<\/text><path d=\"M43,60 L285,60\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"65\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">4<\/text><path d=\"M43,30 L285,30\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"35\" y=\"35\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:16px\">5<\/text><text x=\"43\" y=\"24\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">格<\/text><rect x=\"68\" y=\"90\" width=\"30\" height=\"90\" style=\"fill:var(--a);stroke:var(--a);stroke-width:1.5\" /><text x=\"83\" y=\"206\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">第一天<\/text><rect x=\"148\" y=\"30\" width=\"30\" height=\"150\" style=\"fill:var(--a);stroke:var(--a);stroke-width:1.5\" /><text x=\"163\" y=\"206\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">第二天<\/text><rect x=\"228\" y=\"60\" width=\"30\" height=\"120\" style=\"fill:var(--a);stroke:var(--a);stroke-width:1.5\" /><text x=\"243\" y=\"206\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">第三天<\/text><text x=\"150\" y=\"246\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">每格代表 10 千克<\/text><\/svg>"}, {"id": "p4b-u8-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一个小组 5 人平均每人跳绳 120 下。组长说：「我们组每个人都至少跳了 120 下。」这句话对吗？", "answer": "不一定对，可能有人跳得比 120 下少", "reasoning": ["平均数在最小数和最大数之间。", "只知道平均数，不能确定每个人都不少于它，所以组长的话不一定对。"], "options": [{"id": "a", "text": "一定对，因为平均每人 120 下", "feedback": "平均数不是最少的数，有人可能比它少。"}, {"id": "b", "text": "一定不对，一定有人跳得比 120 下少", "feedback": "如果 5 人正好都跳了 120 下，组长的话也对，所以不能说一定不对。"}, {"id": "c", "text": "不一定对，可能有人跳得比 120 下少", "feedback": "对。平均每人 120 下，可能有人多、有人少。"}], "correct": "c", "pointIds": ["pyps.p4b.u8.002"], "contentVersion": "sha256:4df79a2ede1f8ad4f7ba5d8c2a5bfc1fc35e641e288bd12444ac7459411b8644"}], "contentVersion": "sha256:396a8a1641648ecf9a7d2bfb0e230bcd7ecf2e507e385b966298a734459d5454"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
