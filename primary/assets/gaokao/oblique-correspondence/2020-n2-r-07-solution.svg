<svg xmlns="http://www.w3.org/2000/svg" width="500" height="1090" viewBox="0 0 500 1090" role="img" aria-labelledby="title desc">
  <title id="title">逐点构造同一端点，再从左侧回投</title>
  <desc id="desc">作答后解图。第一步按横向不缩、纵深沿45度缩半画底面，N确定底点P0。第二步按正视M的高度竖直抬起得到实体端点P。模型为两错层块的相容示例，左块底面在h1而不在h0；模型不唯一。第三步从左向右看，后侧投到侧图左边，P投在上排左点E。EF为被左块遮挡的虚线，GH为实线。</desc>
  <!-- Drawing units only, no numerical dimensions are given to the student.
       Oblique map: (x,y,z) -> origin + .8*(x+y/(2sqrt2), -z-y/(2sqrt2)).
       Profile: (0,h3),(a,h3),(a,h2),(a+b,h2),(a+b,h0),(a,h0),(a,h1),(0,h1).
       Compatible model = [0,a]x[0,d]x[h1,h3] UNION [a,a+b]x[0,d]x[h0,h2].
       P=(a,d,h2). Left view: horizontal d-y, vertical z, so P maps to back/left h2. -->
  <rect width="500" height="1090" rx="12" fill="#fff"/>
  <g fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="250" y="38" text-anchor="middle">① 横同、纵半45°，画底面</text>
  </g>
  <polygon id="floor-frame" points="90.000000000,230.000000000 291.600000000,230.000000000 327.238181772,194.361818228 125.638181772,194.361818228" fill="#f3f6f8" stroke="#69818e" stroke-width="2.5"/>
  <path id="floor-divider" d="M 195.600000000 230.000000000 L 231.238181772 194.361818228" fill="none" stroke="#69818e" stroke-width="2.5"/>
  <g fill="none" stroke="#69818e" stroke-width="2">
    <path d="M 90 230 H 369 M 90 230 L 148 172"/>
    <path d="M 361 225 L 369 230 L 361 235 M 148 181 L 148 172 L 139 172"/>
    <path d="M 125 230 A 35 35 0 0 0 114.748737 205.251263"/>
  </g>
  <circle id="floor-p0" cx="231.238181772" cy="194.361818228" r="5" fill="#b55132"/>
  <g fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="137" y="226">45°</text><text x="380" y="242">横向</text>
    <text x="156" y="169">纵深</text>
    <text x="242.238181772" y="182.361818228" fill="#a4472b">P₀</text>
    <text x="250" y="286" text-anchor="middle">用俯视 N 确定底点 P₀</text>
    <text x="250" y="347" text-anchor="middle">② 竖高不变，抬出端点 P</text>
  </g>
  <polygon id="model-left-top" points="90.000000000,452.000000000 195.600000000,452.000000000 231.238181772,416.361818228 125.638181772,416.361818228" fill="#dce8f3"/><polygon id="model-right-top" points="195.600000000,495.200000000 291.600000000,495.200000000 327.238181772,459.561818228 231.238181772,459.561818228" fill="#e4efde"/><polygon id="model-right-face" points="291.600000000,495.200000000 291.600000000,620.000000000 327.238181772,584.361818228 327.238181772,459.561818228" fill="#bed5b0"/><polygon id="model-inner-wall" points="195.600000000,452.000000000 195.600000000,495.200000000 231.238181772,459.561818228 231.238181772,416.361818228" fill="#b9cfdf"/><polygon id="model-front-face" points="90.000000000,452.000000000 195.600000000,452.000000000 195.600000000,495.200000000 291.600000000,495.200000000 291.600000000,620.000000000 195.600000000,620.000000000 195.600000000,576.800000000 90.000000000,576.800000000" fill="#edf3f7"/>
  <g fill="none" stroke="#8095a0" stroke-width="2.2" stroke-dasharray="7 5"><path d="M 195.600000000 620.000000000 L 231.238181772 584.361818228"/><path d="M 195.600000000 576.800000000 L 231.238181772 541.161818228"/><path d="M 90.000000000 576.800000000 L 125.638181772 541.161818228"/><path d="M 327.238181772 584.361818228 L 231.238181772 584.361818228"/><path d="M 231.238181772 584.361818228 L 231.238181772 541.161818228"/><path d="M 231.238181772 541.161818228 L 125.638181772 541.161818228"/><path d="M 125.638181772 541.161818228 L 125.638181772 416.361818228"/></g>
  <g fill="none" stroke="#345b75" stroke-width="2.8" stroke-linejoin="round">
    <path id="model-front-profile" d="M 90.000000000 452.000000000 L 195.600000000 452.000000000 L 195.600000000 495.200000000 L 291.600000000 495.200000000 L 291.600000000 620.000000000 L 195.600000000 620.000000000 L 195.600000000 576.800000000 L 90.000000000 576.800000000 Z"/><path d="M 90.000000000 452.000000000 L 125.638181772 416.361818228"/><path d="M 195.600000000 452.000000000 L 231.238181772 416.361818228"/><path d="M 195.600000000 495.200000000 L 231.238181772 459.561818228"/><path d="M 291.600000000 495.200000000 L 327.238181772 459.561818228"/><path d="M 291.600000000 620.000000000 L 327.238181772 584.361818228"/><path d="M 125.638181772 416.361818228 L 231.238181772 416.361818228"/><path d="M 231.238181772 416.361818228 L 231.238181772 459.561818228"/><path d="M 231.238181772 459.561818228 L 327.238181772 459.561818228"/><path d="M 327.238181772 459.561818228 L 327.238181772 584.361818228"/>
  </g>
  <g fill="none" stroke="#c6a381" stroke-width="2" stroke-dasharray="3 5">
    <path d="M 57 452 V 620"/><path d="M 57 620.000000000 H 83"/><path d="M 57 576.800000000 H 83"/><path d="M 57 495.200000000 H 83"/><path d="M 57 452.000000000 H 83"/>
    <path id="height-from-m" d="M 57 495.200000000 H 195.600000000"/>
  </g>
  <path id="lift-p0-to-p" d="M 231.238181772 584.361818228 L 231.238181772 459.561818228" fill="none" stroke="#b55132" stroke-width="3" stroke-dasharray="6 4"/>
  <circle id="model-p0" cx="231.238181772" cy="584.361818228" r="4.5" fill="#b55132"/>
  <circle id="model-p" cx="231.238181772" cy="459.561818228" r="6" fill="#b55132" stroke="#fff" stroke-width="2"/>
  <g fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="48" y="628.000000000" text-anchor="end">h₀</text><text x="48" y="584.800000000" text-anchor="end">h₁</text><text x="48" y="503.200000000" text-anchor="end">h₂</text><text x="48" y="460.000000000" text-anchor="end">h₃</text>
    <text x="246.238181772" y="449.561818228" fill="#a4472b">P</text>
    <text x="244.238181772" y="615.361818228" fill="#a4472b">P₀</text>
    <text x="250" y="694" text-anchor="middle">按 M 的高度，把 P₀ 竖直抬起</text>
    <text x="250" y="755" text-anchor="middle">③ 左侧观察：后侧投到左边</text>
    <text x="250" y="796" text-anchor="middle">从实体左边向右看</text>
  </g>
  <g fill="none" stroke="#253b47" stroke-width="2.7">
    <path id="result-side-outline" d="M 200 832 H 300.8 V 1000 H 200 Z"/>
    <path id="result-side-ef" d="M 200 875.2 H 300.8" stroke-dasharray="8 6"/>
    <path id="result-side-gh" d="M 200 956.8 H 300.8"/>
  </g>
  <circle id="result-e" cx="200" cy="875.2" r="7" fill="#b55132"/>
  <g fill="#253b47" font-family="Georgia,'Times New Roman',serif" font-size="30" font-style="italic">
    <text x="213" y="909" fill="#a4472b">E</text><text x="288" y="909" text-anchor="end">F</text>
    <text x="213" y="947">G</text><text x="288" y="947" text-anchor="end">H</text>
  </g>
  <g fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="200" y="1041" text-anchor="middle">后侧</text><text x="300.8" y="1041" text-anchor="middle">前侧</text>
  </g>
</svg>
