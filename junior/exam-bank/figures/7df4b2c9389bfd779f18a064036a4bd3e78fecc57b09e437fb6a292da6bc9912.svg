<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70" role="img" aria-labelledby="title desc"><title id="title">数轴</title><desc id="desc">向右为正方向的数轴，从左到右依次标有 a、0、b，b 到 0 的距离大于 a 到 0 的距离。</desc><style>path,circle,ellipse,polygon,rect,line,polyline{fill:none;stroke:currentColor;stroke-width:1.8}.d{stroke-dasharray:6 5}.t{stroke-width:1.2}.s{fill:currentColor;fill-opacity:.15}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}.i{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><line x1="10.00" y1="26.00" x2="290.00" y2="26.00"/><polygon class="f" points="292.00,26.00 281.00,30.00 281.00,22.00"/><line x1="50.00" y1="18.00" x2="50.00" y2="26.00"/><text x="50.00" y="54.00" font-size="19" text-anchor="middle" class="i">a</text><line x1="90.00" y1="18.00" x2="90.00" y2="26.00"/><text x="90.00" y="54.00" font-size="19" text-anchor="middle">0</text><line x1="235.00" y1="18.00" x2="235.00" y2="26.00"/><text x="235.00" y="54.00" font-size="19" text-anchor="middle" class="i">b</text></svg>