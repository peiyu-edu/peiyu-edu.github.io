<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="title desc"><title id="title">水平放置的正六棱柱与四个选项图形</title><desc id="desc">上方是正六棱柱，一个正六边形底面正对前方，上下两边水平，侧面向右上方后退并涂灰。下方是四个选项：图A为长方形被两条竖线分成三格，中间一格最宽；图B为长方形；图C为两个正方形上下拼成的竖长方形；图D为正六边形，左右两端是顶点。</desc><style>path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.f1{fill:currentColor;fill-opacity:.12}.f2{fill:currentColor;fill-opacity:.3}.f3{fill:currentColor;fill-opacity:.48}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path class="f2" d="M62.5,42.4L117.5,42.4L135.5,24.4L80.5,24.4Z"/><path class="f3" d="M117.5,42.4L145,90L163,72L135.5,24.4Z"/><path class="f3" d="M145,90L117.5,137.6L135.5,119.6L163,72Z"/><path class="f1" d="M35,90L62.5,42.4L117.5,42.4L145,90L117.5,137.6L62.5,137.6Z"/><text x="12" y="252" font-size="20">A</text><path d="M37,222L137,222L137,274L37,274Z M63.5,222L63.5,274 M114.5,222L114.5,274"/><text x="172" y="252" font-size="20">B</text><path d="M197,221L301,221L301,275L197,275Z"/><text x="336" y="252" font-size="20">C</text><path d="M368,210.5L411,210.5L411,285.5L368,285.5Z M368,248L411,248"/><text x="470" y="252" font-size="20">D</text><path d="M496,248L520,206.4L568,206.4L592,248L568,289.6L520,289.6Z"/></svg>
