<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="title desc"><title id="title">四个开关、电源和灯泡组成的电路</title><desc id="desc">开关A与B上下并联成一组，开关C与D上下并联成另一组，两组串联，再与右侧的灯泡和下方的电源连成回路；四个开关都画成断开状态。</desc><style>path,circle{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M60,70L20,70L20,170L165,170M175,170L330,170L330,132M330,108L330,70L280,70M150,70L190,70"/><path d="M60,40L60,100M150,40L150,100M190,40L190,100M280,40L280,100"/><path d="M60,40L88,40M125,40L150,40M60,100L88,100M125,100L150,100M190,40L218,40M255,40L280,40M190,100L218,100M255,100L280,100"/><circle cx="91" cy="40" r="3"/><circle cx="122" cy="40" r="3"/><circle cx="91" cy="100" r="3"/><circle cx="122" cy="100" r="3"/><circle cx="221" cy="40" r="3"/><circle cx="252" cy="40" r="3"/><circle cx="221" cy="100" r="3"/><circle cx="252" cy="100" r="3"/><path d="M93,38L124,26M93,98L124,86M223,38L254,26M223,98L254,86"/><circle cx="330" cy="120" r="12"/><path d="M321.5,111.5L338.5,128.5M338.5,111.5L321.5,128.5"/><path d="M165,152L165,188M175,160L175,180"/><text x="100" y="22" font-size="20">A</text><text x="100" y="82" font-size="20">B</text><text x="230" y="22" font-size="20">C</text><text x="230" y="82" font-size="20">D</text></svg>
