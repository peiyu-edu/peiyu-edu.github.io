<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 766" width="540" height="766" role="img" aria-labelledby="title desc">
<title id="title">古算诗与红莲示意图</title>
<desc id="desc">图①是一个卷轴，上面写着诗文：波平如镜一湖面，半尺高处生红莲，亭亭多姿湖中立，突遭狂风吹一边．离开原处二尺远，花贴湖面象睡莲。图②是示意图：上下两条水平线分别表示湖面和湖底。A 在湖底，C 在湖面上且在 A 的正上方，C 处标有直角记号；莲花原在 C 正上方的 B 处，竖直线连 A、B；莲花倒后落在湖面上的 B′ 处，连接 AB′。</desc>
<style>text { fill:#17202a; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="540" height="766" fill="white"/>
<g transform="translate(2.0 14.0)">
<path d="M 36 22 H 486 M 500 24 V 200 Q 500 212 488 212 H 54 M 36 22 Q 14 22 14 42 V 226 Q 14 242 36 242 Q 54 242 54 224 V 212 M 36 22 Q 54 22 54 40 V 212 M 486 22 Q 522 0 522 16 Q 522 30 500 28" fill="none" stroke="#17202a" stroke-width="2.6" stroke-linecap="round"/>
<text class="z" x="72.0" y="66.2" text-anchor="start" font-size="29">诗文：波平如镜一湖面，半尺高</text>
<text class="z" x="72.0" y="110.2" text-anchor="start" font-size="29">处生红莲，亭亭多姿湖中立，突</text>
<text class="z" x="72.0" y="154.2" text-anchor="start" font-size="29">遭狂风吹一边．离开原处二尺</text>
<text class="z" x="72.0" y="198.2" text-anchor="start" font-size="29">远，花贴湖面象睡莲。</text>
<text class="z" x="260.0" y="281.8" text-anchor="middle" font-size="28">图①</text>
<line x1="160.3" y1="409.1" x2="473.5" y2="409.1" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="160.3" y1="658.5" x2="473.5" y2="658.5" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="258.9" y1="658.5" x2="258.9" y2="383.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="258.9" y1="658.5" x2="389.4" y2="409.1" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<polyline points="273.9,409.1 273.9,424.1 258.9,424.1" fill="none" stroke="#17202a" stroke-width="2.5"/>
<ellipse cx="258.9" cy="383.0" rx="8" ry="12" transform="rotate(0 258.9 383.0)" fill="white" stroke="#17202a" stroke-width="2.5"/>
<ellipse cx="389.4" cy="414.9" rx="8" ry="12" transform="rotate(28 389.4 414.9)" fill="white" stroke="#17202a" stroke-width="2.5"/>
<text class="m" x="258.9" y="361.5" text-anchor="middle" font-size="30">B</text>
<text class="m" x="236.9" y="441.6" text-anchor="middle" font-size="30">C</text>
<text class="m" x="415.4" y="393.6" text-anchor="middle" font-size="30">B'</text>
<text class="m" x="258.9" y="695.0" text-anchor="middle" font-size="30">A</text>
<text class="z" x="316.9" y="734.3" text-anchor="middle" font-size="28">图②</text>
</g>
</svg>
