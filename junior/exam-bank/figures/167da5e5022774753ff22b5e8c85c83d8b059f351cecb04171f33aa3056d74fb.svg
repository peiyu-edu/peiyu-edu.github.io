<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 235" role="img"><title>直线外一点与邻角</title><desc>点P在直线AB外，C在直线AB上，连接CP，CP两侧分别标有∠1与∠2。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><line x1="45" y1="170" x2="325" y2="170" class=""></line><line x1="180" y1="170" x2="280" y2="70" class=""></line><path d="M155 170 A25 25 0 0 1 205 170" class=""></path><text x="36" y="197">A</text><text x="333" y="197">B</text><text x="180" y="200">C</text><text x="295" y="65">P</text><text x="165" y="139">1</text><text x="230" y="161">2</text></svg>
