<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 28 章 旋转 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j28-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 28 章 旋转 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j28-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j28-test", "sectionId": "j28-test", "chapterId": "j28", "title": "第 28 章 旋转 · 章末测验", "label": "章末测验", "sections": ["j28-1", "j28-2"], "items": [{"id": "j28-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j28-1"], "pointIds": ["pyjh.rot.001"], "prompt": "钟表上从 $3$ 点整到 $3$ 点 $20$ 分，分针绕钟面中心旋转了多少度？", "options": [{"id": "a", "text": "$20^\\circ$", "feedback": "分针每分钟转 $6^\\circ$，不是 $1^\\circ$。"}, {"id": "b", "text": "$120^\\circ$", "feedback": "$20\\times6^\\circ=120^\\circ$。"}, {"id": "c", "text": "$60^\\circ$", "feedback": "$60^\\circ$ 是分针走 $10$ 分钟转过的角度。"}, {"id": "d", "text": "$100^\\circ$", "feedback": "分针 $60$ 分钟转一周 $360^\\circ$，每分钟 $6^\\circ$。"}], "correct": "b", "answer": "$120^\\circ$", "reasoning": ["分针 $60$ 分钟转 $360^\\circ$，每分钟转 $6^\\circ$。", "$20$ 分钟转 $20\\times6^\\circ=120^\\circ$。"], "contentVersion": "sha256:36a6c8d4489efc72f4fb9c35e5077952e1ec4344a4ad3899d5c0b23e8579bd0d"}, {"id": "j28-test-02-v2", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j28-1"], "pointIds": ["pyjh.rot.002"], "prompt": "把 $\\triangle ABC$ 绕点 $A$ 旋转得到 $\\triangle ADE$（$B$ 的对应点是 $D$，$C$ 的对应点是 $E$）。下列结论中不一定成立的是哪一个？", "options": [{"id": "a", "text": "$AB=AD$", "feedback": "对应点到旋转中心的距离相等，一定成立。"}, {"id": "b", "text": "$\\angle BAD=\\angle CAE$", "feedback": "对应点与旋转中心连线所成的角都等于旋转角，一定成立。"}, {"id": "c", "text": "$BC=DE$", "feedback": "旋转前后的图形全等，对应线段相等，一定成立。"}, {"id": "d", "text": "$BC\\parallel DE$", "feedback": "对应线段长度相等，但旋转后所在直线不一定平行。"}], "correct": "d", "answer": "$BC\\parallel DE$", "reasoning": ["旋转的性质：对应点到旋转中心距离相等；对应点与中心连线的夹角等于旋转角；旋转前后图形全等。", "对应线段 $BC$ 与 $DE$ 相等，但所在直线一般相交成旋转角，不一定平行。"], "contentVersion": "sha256:d18c75a6a38d850e6b9bd4e1f7ed759f94453b71039408928a66942ee672708d"}, {"id": "j28-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j28-2"], "pointIds": ["pyjh.rot.006"], "prompt": "下列图形中，是中心对称图形但不是轴对称图形的是哪一个？", "options": [{"id": "a", "text": "等边三角形", "feedback": "它是轴对称图形，但不是中心对称图形。"}, {"id": "b", "text": "正方形", "feedback": "它既是中心对称图形，又是轴对称图形。"}, {"id": "c", "text": "不是矩形也不是菱形的平行四边形", "feedback": "绕对角线交点旋转 $180^\\circ$ 与自身重合，但找不到对称轴。"}, {"id": "d", "text": "圆", "feedback": "它既是中心对称图形，又是轴对称图形。"}], "correct": "c", "answer": "不是矩形也不是菱形的平行四边形", "reasoning": ["平行四边形绕对角线交点旋转 $180^\\circ$ 能与自身重合，是中心对称图形。", "一般的平行四边形（不是矩形、菱形）没有对称轴。", "正方形、圆两者都是；等边三角形只是轴对称图形。"], "contentVersion": "sha256:a50a45d0bc704a5545a671a9e23b689dc8dcb1283828c0477dacddecfd69269f"}, {"id": "j28-test-04-v2", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j28-2"], "pointIds": ["pyjh.rot.007"], "prompt": "点 $P(-3,2)$ 关于原点对称的点的坐标是什么？", "options": [{"id": "a", "text": "$(3,2)$", "feedback": "这是关于另一条坐标轴对称的结果，仍保留了一个不该保留的坐标。"}, {"id": "b", "text": "$(-3,-2)$", "feedback": "这是关于另一条坐标轴对称的结果，仍保留了一个不该保留的坐标。"}, {"id": "c", "text": "$(3,-2)$", "feedback": "关于原点对称，横、纵坐标都取相反数。"}, {"id": "d", "text": "$(2,-3)$", "feedback": "横、纵坐标各自变号，不交换位置。"}], "correct": "c", "answer": "$(3,-2)$", "reasoning": ["关于原点对称的两点，横坐标互为相反数，纵坐标也互为相反数。", "$P(-3,2)$ 的对称点是 $(3,-2)$。"], "contentVersion": "sha256:c282a743bca15bd2c79f79fad05e7c0a7878ac85e5adcb05e0c44c056ac5dba5"}, {"id": "j28-test-05-v2", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j28-2"], "pointIds": ["pyjh.rot.005"], "prompt": "线段 $AB$ 与线段 $A'B'$ 关于点 $O$ 成中心对称（$A$ 与 $A'$ 对应）。已知点 $O$ 不在直线 $AB$ 上，下列说法错误的是哪一个？", "options": [{"id": "a", "text": "点 $O$ 是线段 $AA'$ 的中点", "feedback": "对称点连线经过对称中心，并被对称中心平分，这句是对的。"}, {"id": "b", "text": "$AB=A'B'$", "feedback": "成中心对称的两个图形全等，这句是对的。"}, {"id": "c", "text": "$AB\\parallel A'B'$ 或 $AB$、$A'B'$ 在同一条直线上", "feedback": "对应线段平行或共线，这句是对的。"}, {"id": "d", "text": "$\\triangle OAB$ 与 $\\triangle OA'B'$ 不一定全等", "feedback": "$OA=OA'$，$OB=OB'$，$\\angle AOB=\\angle A'OB'$，两个三角形全等。"}], "correct": "d", "answer": "「$\\triangle OAB$ 与 $\\triangle OA'B'$ 不一定全等」是错的", "reasoning": ["点 $O$ 不在直线 $AB$ 上，所讨论的两个三角形均不退化。", "中心对称的性质：对称点连线被对称中心平分；对应线段相等，且平行或共线。", "$OA=OA'$，$OB=OB'$，对顶角 $\\angle AOB=\\angle A'OB'$，由「边角边」两三角形全等。", "所以说它们「不一定全等」是错的。"], "contentVersion": "sha256:f64d804a2306f5dbfde0c89b31930cc0fbbddac23b098ea08c2f463295f7183c"}, {"id": "j28-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j28-1"], "pointIds": ["pyjh.rot.004", "pyjh.coord.004"], "prompt": "在平面直角坐标系中，把点 $A(2,1)$ 绕原点 $O$ 逆时针旋转 $90^\\circ$，得到点 $A'$。$A'$ 的坐标是什么？", "options": [{"id": "a", "text": "$(-1,2)$", "feedback": "过 $A$、$A'$ 作 $x$ 轴的垂线，得到两个全等的直角三角形，两段长度交换位置。"}, {"id": "b", "text": "$(1,-2)$", "feedback": "这是顺时针旋转 $90^\\circ$ 的结果。"}, {"id": "c", "text": "$(-2,1)$", "feedback": "这是关于 $y$ 轴对称的点，不是旋转 $90^\\circ$。"}, {"id": "d", "text": "$(-2,-1)$", "feedback": "这是旋转 $180^\\circ$（关于原点对称）的结果。"}], "correct": "a", "answer": "$(-1,2)$", "reasoning": ["$A(2,1)$ 在第一象限，逆时针转 $90^\\circ$ 后落在第二象限。", "过 $A$ 作 $x$ 轴的垂线，得直角三角形两直角边 $2$、$1$；旋转后对应直角三角形与它全等，两边交换位置。", "所以 $A'(-1,2)$；可验证 $OA'=OA=\\sqrt5$，且 $OA\\perp OA'$。"], "contentVersion": "sha256:e3156f70cf78ab12d4467a8645d85ff83d4cdc9c126ce685b65dc70f1b735d96"}, {"id": "j28-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j28-1"], "pointIds": ["pyjh.rot.002", "pyjh.quad.021", "pyjh.pyth.003"], "prompt": "正方形 $ABCD$ 的边长为 $4$，点 $E$ 在边 $BC$ 上，$BE=1$。把 $\\triangle ABE$ 绕点 $A$ 旋转 $90^\\circ$，使 $AB$ 与 $AD$ 重合，得到 $\\triangle ADF$（点 $F$ 在 $CD$ 的延长线上）。$EF$ 的长是多少？", "options": [{"id": "a", "text": "$\\sqrt{17}$", "feedback": "$\\sqrt{17}$ 是 $AE$ 的长，$EF$ 是等腰直角三角形 $AEF$ 的斜边。"}, {"id": "b", "text": "$5$", "feedback": "$5$ 是 $CF$ 的长，$EF$ 是以 $CE$、$CF$ 为直角边的斜边。"}, {"id": "c", "text": "$\\sqrt{26}$", "feedback": "$CE=4-1=3$，不是 $1$。"}, {"id": "d", "text": "$\\sqrt{34}$", "feedback": "$CE=3$，$CF=CD+DF=5$，$EF=\\sqrt{3^2+5^2}$。"}], "correct": "d", "answer": "$\\sqrt{34}$", "reasoning": ["旋转前后对应线段相等：$DF=BE=1$，所以 $CF=4+1=5$；又 $CE=4-1=3$。", "在直角三角形 $ECF$ 中，$EF=\\sqrt{CE^2+CF^2}=\\sqrt{9+25}=\\sqrt{34}$。", "也可看等腰直角三角形 $AEF$：$AE=AF=\\sqrt{17}$，$EF=\\sqrt{17}\\times\\sqrt2=\\sqrt{34}$。"], "contentVersion": "sha256:d0fa6c26b82d28968531f2b877039d282ed43edbd7a8c92e77e858276edae91f"}, {"id": "j28-test-08-v2", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j28-2"], "pointIds": ["pyjh.rot.007"], "prompt": "点 $A(a+1,\\,3)$ 与点 $B(-2,\\,b-1)$ 关于原点对称，$a+b$ 的值是多少？", "options": [{"id": "a", "text": "$3$", "feedback": "解纵坐标对应的方程时，移项符号处理有误。"}, {"id": "b", "text": "$-1$", "feedback": "$a+1=2$，$b-1=-3$，$a=1$，$b=-2$。"}, {"id": "c", "text": "$-3$", "feedback": "解横坐标对应的方程时，没有正确处理相反数与移项。"}, {"id": "d", "text": "$1$", "feedback": "只处理横坐标不够，纵坐标也应满足对称关系。"}], "correct": "b", "answer": "$a+b=-1$", "reasoning": ["关于原点对称：$a+1=-(-2)=2$，$b-1=-3$。", "$a=1$，$b=-2$，$a+b=-1$。"], "contentVersion": "sha256:fc210824ad5713b61fed48e3cd29c5e3318319e01bea69f20178ed6f7c29dc06"}, {"id": "j28-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j28-1"], "pointIds": ["pyjh.rot.004", "pyjh.rot.002"], "prompt": "线段 $AB$ 绕某一点旋转 $90^\\circ$ 后与线段 $A'B'$ 重合，其中 $A(2,0)$ 对应 $A'(0,2)$，$B(3,1)$ 对应 $B'(-1,3)$。旋转中心的坐标是什么？", "options": [{"id": "a", "text": "$(1,1)$", "feedback": "$(1,1)$ 到 $A$、$A'$ 距离相等，但到 $B$、$B'$ 的距离不等。"}, {"id": "b", "text": "$(2,2)$", "feedback": "绕 $(2,2)$ 顺时针旋转 $90^\\circ$ 时 $A$ 能落到 $A'$，但 $B$ 落不到 $B'$。"}, {"id": "c", "text": "$(0,0)$", "feedback": "旋转中心在 $AA'$、$BB'$ 的垂直平分线上，两条垂直平分线交于原点。"}, {"id": "d", "text": "$(0,2)$", "feedback": "旋转中心到 $A$ 与到 $A'$ 的距离要相等，$(0,2)$ 就是 $A'$ 本身。"}], "correct": "c", "answer": "$(0,0)$", "reasoning": ["旋转中心到每对对应点的距离相等，所以既在 $AA'$ 的垂直平分线上，又在 $BB'$ 的垂直平分线上。", "$AA'$ 的垂直平分线是直线 $y=x$；$BB'$ 的中点是 $(1,2)$，垂直平分线是直线 $y=2x$；两线交于原点。", "检验：$OA=OA'=2$，$OB=OB'=\\sqrt{10}$，$\\angle AOA'=90^\\circ$，绕原点逆时针旋转 $90^\\circ$ 恰好把 $A$、$B$ 转到 $A'$、$B'$。"], "contentVersion": "sha256:ef439e860357378b1ce11e6e35d1a9881bfe1292c6159c515c920125762ccf73"}, {"id": "j28-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j28-1"], "pointIds": ["pyjh.rot.002", "pyjh.pyth.003"], "prompt": "在 $\\triangle ABC$ 中，$\\angle C=90^\\circ$，$AC=3$，$BC=4$。把 $\\triangle ABC$ 绕点 $B$ 顺时针旋转 $90^\\circ$ 得到 $\\triangle A'BC'$。线段 $AA'$ 的长是多少？", "options": [{"id": "a", "text": "$5$", "feedback": "$5$ 是 $AB$ 的长；$AA'$ 是等腰直角三角形 $ABA'$ 的斜边。"}, {"id": "b", "text": "$7$", "feedback": "$AA'$ 不是 $AC$ 与 $BC$ 的和。"}, {"id": "c", "text": "$5\\sqrt2$", "feedback": "$BA=BA'=5$，$\\angle ABA'=90^\\circ$，$AA'=\\sqrt{5^2+5^2}$。"}, {"id": "d", "text": "$10$", "feedback": "$\\angle ABA'=90^\\circ$，$A$、$B$、$A'$ 不共线，$AA'$ 不是 $2AB$。"}], "correct": "c", "answer": "$5\\sqrt2$", "reasoning": ["$AB=\\sqrt{3^2+4^2}=5$。", "旋转后 $BA'=BA=5$，旋转角 $\\angle ABA'=90^\\circ$，$\\triangle ABA'$ 是等腰直角三角形。", "$AA'=\\sqrt{5^2+5^2}=5\\sqrt2$。"], "contentVersion": "sha256:f49f568cc0a92c22d2fcd128dff3efbd89976ea0ec7383a6b5db0a99106f15f1"}, {"id": "j28-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j28-1", "j28-2"], "pointIds": ["pyjh.rot.007", "pyjh.rot.004"], "prompt": "把点 $A(2,3)$ 绕原点顺时针旋转 $90^\\circ$ 得到点 $B$，再作点 $B$ 关于原点的对称点 $C$。点 $C$ 的坐标是什么？", "options": [{"id": "a", "text": "$(3,-2)$", "feedback": "这是点 $B$，还要再作关于原点的对称点。"}, {"id": "b", "text": "$(-2,-3)$", "feedback": "这是 $A$ 关于原点的对称点，第一步的旋转没算进去。"}, {"id": "c", "text": "$(2,-3)$", "feedback": "顺时针旋转 $90^\\circ$ 后横、纵坐标的绝对值要交换位置。"}, {"id": "d", "text": "$(-3,2)$", "feedback": "$B(3,-2)$，关于原点对称得 $C(-3,2)$；相当于 $A$ 逆时针转 $90^\\circ$。"}], "correct": "d", "answer": "$(-3,2)$", "reasoning": ["顺时针旋转 $90^\\circ$：由全等直角三角形，$A(2,3)$ 转到第四象限的 $B(3,-2)$。", "关于原点对称：$C(-3,2)$。", "检验：顺时针 $90^\\circ$ 再转 $180^\\circ$，等于逆时针转 $90^\\circ$，$A(2,3)\\to(-3,2)$。"], "contentVersion": "sha256:07a4ceea1a22061b7dae6bdafa5cc8606335059195808080a81ac8589b62d318"}, {"id": "j28-test-12-v2", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j28-1"], "pointIds": ["pyjh.rot.002", "pyjh.quad.021", "pyjh.pyth.010"], "prompt": "点 $P$ 在正方形 $ABCD$ 内部，$PA=2$，$PB=4$，$PC=6$。$\\angle APB$ 是多少度？", "options": [{"id": "a", "text": "$120^\\circ$", "feedback": "把 $\\triangle PBC$ 绕点 $B$ 旋转 $90^\\circ$ 到 $\\triangle P'BA$，先看 $\\triangle PBP'$ 的形状。"}, {"id": "b", "text": "$150^\\circ$", "feedback": "等腰直角三角形中的锐角大小判断有误。"}, {"id": "c", "text": "$90^\\circ$", "feedback": "把辅助三角形中的直角当成了所求角，漏掉了另一部分角。"}, {"id": "d", "text": "$135^\\circ$", "feedback": "旋转得 $BP'=4$、$\\angle PBP'=90^\\circ$、$AP'=6$，再用勾股定理的逆定理。"}], "correct": "d", "answer": "$135^\\circ$", "reasoning": ["把 $\\triangle PBC$ 绕点 $B$ 旋转 $90^\\circ$，使 $BC$ 与 $BA$ 重合，得 $\\triangle P'BA$：$BP'=BP=4$，$AP'=PC=6$，$\\angle PBP'=90^\\circ$。", "$\\triangle PBP'$ 是等腰直角三角形，$PP'^2=4^2+4^2=32$，$\\angle BPP'=45^\\circ$。", "在 $\\triangle APP'$ 中，$PA^2+PP'^2=4+32=36=AP'^2$，所以 $\\angle APP'=90^\\circ$。", "$\\angle APB=\\angle APP'+\\angle BPP'=90^\\circ+45^\\circ=135^\\circ$。"], "contentVersion": "sha256:4f4e7ff8f22cf5d38e27e07b4cd43e6dee6acc50b71f156641c58da5a5b02256"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
