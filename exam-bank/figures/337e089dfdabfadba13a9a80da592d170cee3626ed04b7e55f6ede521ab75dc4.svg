<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc"><title id="title">算法流程图</title><desc id="desc">开始，输入 x，判断 x>0；是则 y←2 的 x 次方，否则 y←x+1；然后输出 y，结束。</desc><style>path,line,circle,polygon{fill:none;stroke:currentColor;stroke-width:2}.ax{stroke-width:1.5}.d{stroke-dasharray:6 5}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.it{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style>
<path d="M291 8H349Q355 8 355 14V34Q355 40 349 40H291Q285 40 285 34V14Q285 8 291 8Z"/><text x="320" y="30" font-size="17" text-anchor="middle">开始</text>
<line x1="320" y1="40" x2="320" y2="62"/><polygon points="320,62 315,52 325,52" style="fill:currentColor"/>
<polygon points="275,62 385,62 365,98 255,98"/><text x="320" y="86" font-size="17" text-anchor="middle">输入<tspan class="it">x</tspan></text>
<line x1="320" y1="98" x2="320" y2="120"/><polygon points="320,120 315,110 325,110" style="fill:currentColor"/>
<polygon points="320,120 400,152 320,184 240,152"/><text x="320" y="158" font-size="17" text-anchor="middle" class="it" style="font-family:'Times New Roman',Times,serif">x&gt;0</text>
<path d="M240 152H140V205"/><polygon points="140,205 135,195 145,195" style="fill:currentColor"/><text x="205" y="142" font-size="16">Y</text>
<path d="M400 152H500V205"/><polygon points="500,205 495,195 505,195" style="fill:currentColor"/><text x="420" y="142" font-size="16">N</text>
<polygon points="80,205 200,205 200,250 80,250"/><text x="140" y="234" font-size="17" text-anchor="middle"><tspan class="it">y</tspan>←2<tspan class="it" font-size="14" dy="-7">x</tspan></text>
<polygon points="430,205 570,205 570,250 430,250"/><text x="500" y="234" font-size="17" text-anchor="middle"><tspan class="it">y</tspan>←<tspan class="it">x</tspan>+1</text>
<path d="M140 250V285H320"/><polygon points="320,285 310,280 310,290" style="fill:currentColor"/>
<path d="M500 250V285H320"/><polygon points="320,285 330,280 330,290" style="fill:currentColor"/>
<line x1="320" y1="285" x2="320" y2="312"/><polygon points="320,312 315,302 325,302" style="fill:currentColor"/>
<polygon points="275,312 385,312 365,348 255,348"/><text x="320" y="336" font-size="17" text-anchor="middle">输出<tspan class="it">y</tspan></text>
<line x1="320" y1="348" x2="320" y2="372"/><polygon points="320,372 315,362 325,362" style="fill:currentColor"/>
<path d="M291 372H349Q355 372 355 378V398Q355 404 349 404H291Q285 404 285 398V378Q285 372 291 372Z"/><text x="320" y="394" font-size="17" text-anchor="middle">结束</text>
</svg>
