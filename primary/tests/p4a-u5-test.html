<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级上册 第五单元 平行四边形和梯形 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p4a-u5-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>四年级上册 第五单元 平行四边形和梯形 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p4a-u5-test", "sectionId": "p4a-u5-test", "unitId": "p4a-u5", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "四年级上册 第五单元 平行四边形和梯形 单元测评", "items": [{"id": "p4a-u5-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "在同一个平面内，两条直线不相交，它们的位置关系是什么？", "answer": "互相平行", "reasoning": ["在同一个平面内，两条直线的位置关系只有相交和不相交两种。", "不相交的两条直线互相平行。"], "options": [{"id": "a", "text": "说不清", "feedback": "在同一个平面内，两条直线不是相交就是平行。不相交，就是平行。"}, {"id": "b", "text": "互相平行", "feedback": "对。在同一个平面内不相交的两条直线叫平行线。"}, {"id": "c", "text": "互相垂直", "feedback": "互相垂直的两条直线是相交的，相交成直角。"}], "correct": "b", "pointIds": ["pyps.p4a.u5.001"], "contentVersion": "sha256:76a3886fbdc0499051586a7be9889c70de606698df491525033cd8de2b05b3fb", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 160\" role=\"img\" aria-label=\"同一平面内两条不相交的直线\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M25,55 L275,55\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><path d=\"M25,125 L275,125\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><\/svg>"}, {"id": "p4a-u5-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "两条直线相交成直角，下面说法对的是哪一项？", "answer": "这两条直线互相垂直，交点叫垂足", "reasoning": ["两条直线相交成直角，就说这两条直线互相垂直。", "它们的交点叫垂足。"], "options": [{"id": "a", "text": "这两条直线互相平行", "feedback": "平行线不相交，这两条直线相交了。"}, {"id": "b", "text": "只有横着和竖着的两条直线才能互相垂直", "feedback": "斜着放的两条直线，只要相交成直角，也互相垂直。"}, {"id": "c", "text": "这两条直线互相垂直，交点叫垂足", "feedback": "对。相交成直角就是互相垂直，交点叫垂足。"}], "correct": "c", "pointIds": ["pyps.p4a.u5.002"], "contentVersion": "sha256:ce97431b5e3e66cd63c8c88762c4343e80cbbfa70e3f7cb4be4276bfb675f9f2", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"两条直线在一点相交\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M35,95 L265,95\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><path d=\"M150,15 L150,175\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><\/svg>"}, {"id": "p4a-u5-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "从直线外的点 P 向这条直线画了三条线段：PA 长 4 厘米，PB 长 3 厘米并且和直线垂直，PC 长 5 厘米。点 P 到这条直线的距离是多少？", "answer": "3 厘米", "reasoning": ["从直线外一点到直线的所有线段里，垂直线段最短。", "这条垂直线段的长度叫点到直线的距离，PB = 3 厘米。"], "options": [{"id": "a", "text": "3 厘米", "feedback": "对。点到直线的距离是垂直线段的长度，PB 和直线垂直。"}, {"id": "b", "text": "4 厘米", "feedback": "PA 不和直线垂直，它的长度不是距离。"}, {"id": "c", "text": "5 厘米", "feedback": "PC 是最长的一条，也不和直线垂直。"}], "correct": "a", "pointIds": ["pyps.p4a.u5.004"], "contentVersion": "sha256:083515be64991e35f10958a1d40b39185f5a981424534a24216c850a2ea5ca09", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 205\" role=\"img\" aria-label=\"P 到直线上的 A、B、C 的线段长为四、三、五厘米；PB 垂直\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M15,155 L285,155\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><circle cx=\"110\" cy=\"35\" r=\"3.5\" style=\"fill:var(--fg)\" /><text x=\"110\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">P<\/text><path d=\"M110,35 L4.16995,155\" style=\"fill:none;stroke:var(--a);stroke-width:2\" /><path d=\"M110,35 L110,155\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><path d=\"M110,35 L270,155\" style=\"fill:none;stroke:var(--c);stroke-width:2\" /><path d=\"M110,141 H124 V155\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"18\" y=\"180\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A<\/text><text x=\"110\" y=\"180\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B<\/text><text x=\"270\" y=\"180\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C<\/text><text x=\"40\" y=\"95\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">4 厘米<\/text><text x=\"145\" y=\"100\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">3 厘米<\/text><text x=\"230\" y=\"85\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">5 厘米<\/text><\/svg>"}, {"id": "p4a-u5-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个平行四边形，从一条底上的不同位置向对边画高（必要时把对边延长），一共能画出多少条？", "answer": "无数条", "reasoning": ["把对边的两端延长成一条直线。从底上的任意一点向这条直线画垂线，这点到垂足的线段就是这条底所对应的高。", "底上有无数个点，每个点都能画出一条这样的垂线段，所以能画出无数条高。有些高的垂足在对边的延长线上。", "底与对边平行，平行线之间的垂直距离相等，所以这些高都一样长。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u5.008"], "contentVersion": "sha256:aae7057f4ef603158178c82688c7050f7aa7ed17443a1137a743555260b46fdf", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 205\" role=\"img\" aria-label=\"平行四边形的已知边与条件\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"32.5,150 232.5,150 267.5,50 67.5,50\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><text x=\"132.5\" y=\"179\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">底<\/text><text x=\"30\" y=\"95\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">边<\/text><\/svg>"}, {"id": "p4a-u5-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪一项是平行四边形一定有的特征？", "answer": "两组对边分别平行，而且分别相等", "reasoning": ["平行四边形的两组对边分别平行。", "量一量，它的两组对边也分别相等。"], "options": [{"id": "a", "text": "四个角都是直角", "feedback": "长方形才四个角都是直角；一般的平行四边形不是。"}, {"id": "b", "text": "两组对边分别平行，而且分别相等", "feedback": "对。这是平行四边形的特征。"}, {"id": "c", "text": "只有一组对边平行", "feedback": "只有一组对边平行的四边形是梯形。"}], "correct": "b", "pointIds": ["pyps.p4a.u5.007"], "contentVersion": "sha256:ec4bd61e6c093adea3e9e7669b4e073cb32a89cdb48466ebcd44f93c34c66381", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 205\" role=\"img\" aria-label=\"平行四边形的已知边与条件\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"32.5,150 232.5,150 267.5,50 67.5,50\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><\/svg>"}, {"id": "p4a-u5-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个等腰梯形，上底 6 厘米，下底 12 厘米，一条腰长 5 厘米。它的周长是多少厘米？", "answer": "28 厘米", "reasoning": ["等腰梯形的两条腰一样长，都是 5 厘米。", "周长：6 + 12 + 5 + 5 = 28（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u5.009"], "contentVersion": "sha256:cb55680544346edaa01b47bfb1815d5cba3d2c3b31a016a0b173f5a6eba34789", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 205\" role=\"img\" aria-label=\"题目中的梯形，标出已知边和底\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"101.25,85 198.75,85 247.5,150 52.5,150\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><text x=\"150\" y=\"71\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">6 厘米<\/text><text x=\"150\" y=\"178\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">12 厘米<\/text><text x=\"30.5\" y=\"117.5\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">5 厘米<\/text><text x=\"269.5\" y=\"117.5\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">?<\/text><\/svg>"}, {"id": "p4a-u5-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪句话是错的？", "answer": "梯形是特殊的平行四边形", "reasoning": ["平行四边形要两组对边分别平行。", "梯形只有一组对边平行，所以梯形不是平行四边形。"], "options": [{"id": "a", "text": "长方形是特殊的平行四边形", "feedback": "这句话对。长方形两组对边分别平行，四个角又都是直角。"}, {"id": "b", "text": "梯形是特殊的平行四边形", "feedback": "对，这句是错的。梯形只有一组对边平行，不是平行四边形。"}, {"id": "c", "text": "正方形是特殊的长方形", "feedback": "这句话对。正方形四个角都是直角，四条边还都相等。"}], "correct": "b", "pointIds": ["pyps.p4a.u5.010"], "contentVersion": "sha256:4dd49099c7b4ab49212c223a0f47a0f8d9eae6abcf2e083388b234ae465bd1ac"}, {"id": "p4a-u5-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "两条平行线之间画了三条和它们都垂直的线段，其中一条长 4 厘米。另外两条各长多少厘米？", "answer": "都是 4 厘米", "reasoning": ["两条平行线之间的垂直线段都一样长。", "所以另外两条也都是 4 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u5.005"], "contentVersion": "sha256:bcc63a9e0eab3b91b63865b78ea7897eedc2fa60cce0d529855dee86f7773199", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 205\" role=\"img\" aria-label=\"平行线间三条垂直线段，只给第一条长度\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M25,40 L275,40\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><path d=\"M25,145 L275,145\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><path d=\"M60,40 L60,145\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><path d=\"M150,40 L150,145\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><path d=\"M240,40 L240,145\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"60\" y=\"180\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">4 厘米<\/text><text x=\"150\" y=\"180\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">?<\/text><text x=\"240\" y=\"180\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">?<\/text><\/svg>"}, {"id": "p4a-u5-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "画一个长 5 厘米、宽 3 厘米的长方形：先画一条 5 厘米的线段，再在这条线段的同一侧，从它的两个端点各画一条和它□的 3 厘米线段，最后把两条线段的另一端连起来。□里填什么？", "answer": "垂直", "reasoning": ["长方形的四个角都是直角，所以宽要和长互相垂直，□里填「垂直」。", "两条 3 厘米线段画在 5 厘米线段的同一侧，且都与它垂直，再连接另一端，就得到所要求的长方形。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u5.006", "pyps.p4a.u5.003"], "contentVersion": "sha256:a7cb1e7c5d96bf739bcdb90e11452ececb75e00369d9a51a0b5d7c90022265a7", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 178.0\" role=\"img\" aria-label=\"题目中的长方形或正方形，边上仅标已知条件\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"60\" y=\"35\" width=\"180\" height=\"108\" style=\"fill:none;stroke:var(--fg);stroke-width:1.5\" /><text x=\"150\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">5 厘米<\/text><text x=\"270\" y=\"94\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">3 厘米<\/text><\/svg>"}, {"id": "p4a-u5-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一个四边形只有一组对边平行，另外两条边长度相等。它是什么图形？", "answer": "等腰梯形", "reasoning": ["只有一组对边平行的四边形是梯形，不平行的那两条边是腰。", "两条腰相等的梯形叫等腰梯形。"], "options": [{"id": "a", "text": "长方形", "feedback": "长方形两组对边都平行。"}, {"id": "b", "text": "等腰梯形", "feedback": "对。只有一组对边平行是梯形，两条腰相等是等腰梯形。"}, {"id": "c", "text": "平行四边形", "feedback": "平行四边形两组对边都平行，这个四边形只有一组。"}], "correct": "b", "pointIds": ["pyps.p4a.u5.009", "pyps.p4a.u5.010"], "contentVersion": "sha256:e60fdbe509cc5a64164dbd1be13e7ec551c8501c6a9829b3aaa24dc318097e38", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 205\" role=\"img\" aria-label=\"只有一组对边平行、另外两条边等长的四边形\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"95,45 205,45 247.5,150 52.5,150\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><\/svg>"}, {"id": "p4a-u5-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一个平行四边形不是长方形，相邻的两条边分别长 8 厘米和 6 厘米。以 8 厘米的边为底画高，高可能是多少？", "answer": "5 厘米", "reasoning": ["以 8 厘米的边为底，高从对边上一点垂直画到底。", "从同一点画到底的线段里，垂直线段最短，所以高比斜着的 6 厘米边短。", "三个选项里只有 5 厘米比 6 厘米短。"], "options": [{"id": "a", "text": "5 厘米", "feedback": "对。高和底垂直，6 厘米的边是斜着的，垂直线段比它短，所以高比 6 厘米短。"}, {"id": "b", "text": "6 厘米", "feedback": "高是 6 厘米，6 厘米的边就和底垂直了，这个平行四边形就成了长方形。"}, {"id": "c", "text": "7 厘米", "feedback": "高要比斜着的 6 厘米边还短，不能是 7 厘米。"}], "correct": "a", "pointIds": ["pyps.p4a.u5.008", "pyps.p4a.u5.004"], "contentVersion": "sha256:91925e1bfcbdc42fac672e06271572c91db6a7bc91041f08929da5a3b1357588", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 205\" role=\"img\" aria-label=\"平行四边形的已知边与条件\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"60.1503,150 202.486,150 239.85,50 97.5135,50\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><text x=\"131.318\" y=\"179\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">8 厘米<\/text><text x=\"58.8319\" y=\"95\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">6 厘米<\/text><\/svg>"}], "contentVersion": "sha256:6c10360a1cb6f8766049d818953ff3a79666e02f65ac0595adc70285aadbb9fe"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
