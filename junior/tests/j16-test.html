<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 16 章 整式的乘法 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="junior" data-sec="j16-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 16 章 整式的乘法 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j16-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j16-test", "sectionId": "j16-test", "chapterId": "j16", "title": "第 16 章 整式的乘法 · 章末测验", "label": "章末测验", "sections": ["j16-1", "j16-2", "j16-3"], "items": [{"id": "j16-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j16-1"], "pointIds": ["pyjh.poly.001", "pyjh.poly.002", "pyjh.poly.003"], "prompt": "下列运算中，正确的是哪一项？", "options": [{"id": "a", "text": "$a^2\\cdot a^3=a^6$", "feedback": "同底数幂相乘，底数不变，指数相加，不是相乘。"}, {"id": "b", "text": "$(a^3)^2=a^6$", "feedback": "幂的乘方，底数不变，指数相乘：$3\\times2=6$。"}, {"id": "c", "text": "$(2a)^3=6a^3$", "feedback": "积的乘方要把每个因式分别乘方，系数 $2$ 也要乘方。"}, {"id": "d", "text": "$a^3+a^3=a^6$", "feedback": "这是合并同类项，系数相加、字母和指数不变，不是幂的乘法。"}], "correct": "b", "answer": "$(a^3)^2=a^6$", "reasoning": ["同底数幂相乘指数相加：$a^2\\cdot a^3=a^5$；积的乘方：$(2a)^3=8a^3$；合并同类项：$a^3+a^3=2a^3$。", "幂的乘方指数相乘：$(a^3)^2=a^{3\\times2}=a^6$，所以只有这一项正确。"], "contentVersion": "sha256:40d3d4da1f1efeef6a6200ac2ff2cabf54d7b262b0553af53279e7af3b653d02"}, {"id": "j16-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j16-1"], "pointIds": ["pyjh.poly.003", "pyjh.poly.002"], "prompt": "计算 $(-2x^2y)^3$ 的结果是什么？", "options": [{"id": "a", "text": "$-6x^6y^3$", "feedback": "系数 $-2$ 也要立方，不是乘 $3$。"}, {"id": "b", "text": "$-8x^5y^3$", "feedback": "$(x^2)^3$ 是幂的乘方，指数相乘，不是相加。"}, {"id": "c", "text": "$8x^6y^3$", "feedback": "负数的奇次幂是负数，$(-2)^3$ 的符号要算准。"}, {"id": "d", "text": "$-8x^6y^3$", "feedback": "积的乘方把 $-2$、$x^2$、$y$ 分别立方再相乘。"}], "correct": "d", "answer": "$-8x^6y^3$", "reasoning": ["积的乘方：$(-2x^2y)^3=(-2)^3\\cdot(x^2)^3\\cdot y^3$。", "$(-2)^3=-8$，$(x^2)^3=x^6$，所以结果为 $-8x^6y^3$。"], "contentVersion": "sha256:e0590fe4ad1d590c243cd8dfc059b52e195008e8b7fcec9edc4ed577d6badb9e"}, {"id": "j16-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j16-2"], "pointIds": ["pyjh.poly.005"], "prompt": "计算 $(-3x^2y)\\cdot 2xy^3$ 的结果是什么？", "options": [{"id": "a", "text": "$-6x^3y^4$", "feedback": "系数相乘、同底数幂分别相乘，符号也一并处理。"}, {"id": "b", "text": "$-6x^2y^3$", "feedback": "同底数幂相乘指数要相加，$x^2\\cdot x$ 与 $y\\cdot y^3$ 都要算。"}, {"id": "c", "text": "$-x^3y^4$", "feedback": "单项式相乘，系数要相乘，不是相加。"}, {"id": "d", "text": "$6x^3y^4$", "feedback": "$-3$ 与 $2$ 相乘得负数，符号错了。"}], "correct": "a", "answer": "$-6x^3y^4$", "reasoning": ["系数相乘：$(-3)\\times2=-6$。", "同底数幂相乘：$x^2\\cdot x=x^3$，$y\\cdot y^3=y^4$，所以结果为 $-6x^3y^4$。"], "contentVersion": "sha256:85ae1ba9e5d0e64cd94913c5cecdad7b7b70a20d3c874e541c6e0c3881dfae9c"}, {"id": "j16-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j16-2"], "pointIds": ["pyjh.poly.007"], "prompt": "计算 $(x+2)(x-3)$ 的结果是什么？", "options": [{"id": "a", "text": "$x^2-6$", "feedback": "多项式乘多项式要用一个多项式的每一项乘另一个的每一项，漏了两个一次项。"}, {"id": "b", "text": "$x^2+x-6$", "feedback": "一次项是 $-3x+2x$，符号算反了。"}, {"id": "c", "text": "$x^2-x-6$", "feedback": "四项乘积相加后合并同类项。"}, {"id": "d", "text": "$x^2-5x-6$", "feedback": "一次项应是 $2x$ 与 $-3x$ 的和，不是相减。"}], "correct": "c", "answer": "$x^2-x-6$", "reasoning": ["$(x+2)(x-3)=x\\cdot x+x\\cdot(-3)+2\\cdot x+2\\cdot(-3)$。", "$=x^2-3x+2x-6=x^2-x-6$。"], "contentVersion": "sha256:8480b8d803de702903234c50f45f83a68f4f071ede61650ecd286790f83b267e"}, {"id": "j16-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j16-3"], "pointIds": ["pyjh.poly.012"], "prompt": "计算 $(2a-b)^2$ 的结果是什么？", "options": [{"id": "a", "text": "$4a^2-b^2$", "feedback": "完全平方不等于各项平方的差，漏了中间的乘积项。"}, {"id": "b", "text": "$4a^2-2ab+b^2$", "feedback": "中间项是两数积的 $2$ 倍：$2\\cdot2a\\cdot b$。"}, {"id": "c", "text": "$4a^2-4ab+b^2$", "feedback": "用完全平方公式 $(m-n)^2=m^2-2mn+n^2$，其中 $m=2a$，$n=b$。"}, {"id": "d", "text": "$2a^2-4ab+b^2$", "feedback": "$(2a)^2$ 要把系数 $2$ 也平方。"}], "correct": "c", "answer": "$4a^2-4ab+b^2$", "reasoning": ["把 $2a$ 看作 $m$、$b$ 看作 $n$，用 $(m-n)^2=m^2-2mn+n^2$。", "$(2a-b)^2=(2a)^2-2\\cdot2a\\cdot b+b^2=4a^2-4ab+b^2$。"], "contentVersion": "sha256:2fb1dfe567c2c9b9bdd7c5845f2e25f3c9e9271c123c5337dc51c917df91fd98"}, {"id": "j16-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j16-1"], "pointIds": ["pyjh.poly.004", "pyjh.poly.001", "pyjh.poly.002"], "prompt": "已知 $m$、$n$ 是正整数，$x^m=4$，$x^n=8$，求 $x^{2m+n}$ 的值。", "options": [{"id": "a", "text": "$32$", "feedback": "这是 $x^{m+n}$ 的值，指数里还有 $2m$。"}, {"id": "b", "text": "$64$", "feedback": "$x^{2m}=(x^m)^2$，是平方，不是乘 $2$。"}, {"id": "c", "text": "$128$", "feedback": "逆用幂的运算性质，把 $x^{2m+n}$ 拆成已知的幂。"}, {"id": "d", "text": "$16$", "feedback": "同底数幂相乘对应指数相加，不是幂的值相加。"}], "correct": "c", "answer": "$128$", "reasoning": ["逆用同底数幂的乘法：$x^{2m+n}=x^{2m}\\cdot x^n$。", "逆用幂的乘方：$x^{2m}=(x^m)^2=4^2=16$。", "所以 $x^{2m+n}=16\\times8=128$。"], "contentVersion": "sha256:17ab223c3a1a965ffd708422f41fd79f9485369f62a36172aac34c6f17f26170"}, {"id": "j16-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j16-2"], "pointIds": ["pyjh.poly.007"], "prompt": "若 $(x^2+mx+1)(x-2)$ 的展开式中不含 $x^2$ 项，则 $m$ 的值是多少？", "options": [{"id": "a", "text": "$-2$", "feedback": "展开后 $x^2$ 项的系数是 $m-2$，令它为 $0$ 时符号要算准。"}, {"id": "b", "text": "$2$", "feedback": "展开后合并 $x^2$ 项，令其系数为 $0$。"}, {"id": "c", "text": "$\\frac12$", "feedback": "$x^2$ 项由 $x^2\\cdot(-2)$ 和 $mx\\cdot x$ 两部分合并而来，是相加，不是相乘。"}, {"id": "d", "text": "$0$", "feedback": "$m=0$ 时还有 $x^2\\cdot(-2)=-2x^2$，展开式仍含 $x^2$ 项。"}], "correct": "b", "answer": "$2$", "reasoning": ["展开：$(x^2+mx+1)(x-2)=x^3-2x^2+mx^2-2mx+x-2$。", "$x^2$ 项为 $(m-2)x^2$，不含 $x^2$ 项就是 $m-2=0$。", "所以 $m=2$。"], "contentVersion": "sha256:f55bdd70cb0ab1396705332cb57c152ec8ec65eb77b68129639561d17c7846e0"}, {"id": "j16-test-08-v2", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j16-2"], "pointIds": ["pyjh.poly.009", "pyjh.poly.008"], "prompt": "计算 $(12a^3b^2-6a^2b)\\div(-3a^2b)$ 的结果是什么？", "options": [{"id": "a", "text": "$-4ab+2$", "feedback": "多项式除以单项式，每一项都除以 $-3a^2b$，注意符号。"}, {"id": "b", "text": "$-4ab-2$", "feedback": "$-6a^2b\\div(-3a^2b)$ 是负数除以负数，商为正。"}, {"id": "c", "text": "$-4ab$", "feedback": "第二项 $-6a^2b$ 除以 $-3a^2b$ 得常数，不能丢掉。"}, {"id": "d", "text": "$4ab-2$", "feedback": "除数是负的，每一项商的符号都要改变。"}], "correct": "a", "answer": "$-4ab+2$", "reasoning": ["原式除数 $-3a^2b$ 不能为零，因此 $a\\ne0$，$b\\ne0$。", "多项式除以单项式：先用多项式的每一项除以这个单项式，再把商相加。", "$12a^3b^2\\div(-3a^2b)=-4ab$，$-6a^2b\\div(-3a^2b)=2$（$a^0=1$，$b^0=1$）。", "所以结果为 $-4ab+2$。"], "contentVersion": "sha256:dd6e291e71c91b51cb5066c4b6a4ae7b09fc72a8e4eb9d22acb059131004658c"}, {"id": "j16-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j16-3"], "pointIds": ["pyjh.poly.011", "pyjh.poly.014"], "prompt": "计算 $(a+b-c)(a-b+c)$ 的结果是什么？", "options": [{"id": "a", "text": "$a^2-b^2+2bc-c^2$", "feedback": "添括号写成 $[a+(b-c)][a-(b-c)]$，再用平方差公式。"}, {"id": "b", "text": "$a^2-b^2-c^2$", "feedback": "$(b-c)^2$ 展开时漏了中间项。"}, {"id": "c", "text": "$a^2-b^2-2bc-c^2$", "feedback": "括号前是负号，$-(b-c)^2$ 展开后中间项符号要改变。"}, {"id": "d", "text": "$a^2-2ab+b^2-c^2$", "feedback": "两个因式中相同的项只有 $a$，相反的是 $b-c$，分组分错了。"}], "correct": "a", "answer": "$a^2-b^2+2bc-c^2$", "reasoning": ["添括号：$(a+b-c)(a-b+c)=[a+(b-c)][a-(b-c)]$。", "用平方差公式：$=a^2-(b-c)^2=a^2-(b^2-2bc+c^2)$。", "去括号：$=a^2-b^2+2bc-c^2$。"], "contentVersion": "sha256:0b4526a55de07419a7ea2136a010fc518f24119c405dc24191de067725777591"}, {"id": "j16-test-10-v2", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j16-2", "j16-3"], "pointIds": ["pyjh.poly.010", "pyjh.poly.012", "pyjh.poly.011"], "prompt": "先化简，再求值：$[(x+2y)^2-(x+y)(x-y)-5y^2]\\div2x$，其中 $x=2026$，$y=-3$。", "options": [{"id": "a", "text": "$-6$", "feedback": "在原式有意义的范围内，化简结果与 $x$ 无关，再代入 $y$ 的值。"}, {"id": "b", "text": "$-12$", "feedback": "除法时漏掉了除数中的系数，应把整个除数一起处理。"}, {"id": "c", "text": "$0$", "feedback": "$(x+2y)^2$ 展开时漏了中间项 $4xy$。"}, {"id": "d", "text": "$6$", "feedback": "化简结果正确的话，代入时 $y=-3$ 的符号要保留。"}], "correct": "a", "answer": "$-6$", "reasoning": ["原式要除以 $2x$，因此 $x\\ne0$；给定的 $x=2026$ 满足条件。", "$(x+2y)^2=x^2+4xy+4y^2$，$(x+y)(x-y)=x^2-y^2$。", "中括号内：$x^2+4xy+4y^2-x^2+y^2-5y^2=4xy$。", "$4xy\\div2x=2y$（$x\\ne0$），代入 $y=-3$ 得 $-6$。在原式有意义的范围内，化简结果与 $x$ 的取值无关。"], "contentVersion": "sha256:b7c3222fec5d27c17ec005254e17d04cc8ed39c9a4fb98ca4ea60faba584f76b"}, {"id": "j16-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j16-3"], "pointIds": ["pyjh.poly.015", "pyjh.poly.012"], "prompt": "已知 $a-b=3$，$ab=2$，求 $(a+b)^2$ 的值。", "options": [{"id": "a", "text": "$13$", "feedback": "这是 $a^2+b^2$ 的值，$(a+b)^2$ 还要再加 $2ab$。"}, {"id": "b", "text": "$17$", "feedback": "$(a+b)^2$ 与 $(a-b)^2$ 相差 $4ab$。"}, {"id": "c", "text": "$11$", "feedback": "$(a+b)^2=(a-b)^2+4ab$，加的是 $4ab$，不是 $ab$。"}, {"id": "d", "text": "$5$", "feedback": "$(a+b)^2$ 比 $(a-b)^2$ 大 $4ab$，是加不是减。"}], "correct": "b", "answer": "$17$", "reasoning": ["$(a+b)^2=a^2+2ab+b^2$，$(a-b)^2=a^2-2ab+b^2$，两式相差 $4ab$。", "所以 $(a+b)^2=(a-b)^2+4ab=3^2+4\\times2=17$。"], "contentVersion": "sha256:13836765229bdf307e3408a4d1405f7c4e049d31bcdc91caf0b3acf3415c705b"}, {"id": "j16-test-12-v2", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j16-2", "j16-3"], "pointIds": ["pyjh.poly.013", "pyjh.poly.007"], "prompt": "有三种卡片，其中 $a>0$，$b>0$：A 型是边长为 $a$ 的正方形，B 型是边长为 $b$ 的正方形，C 型是长为 $a$、宽为 $b$ 的长方形（允许旋转）。固定使用 A 型 $2$ 张、B 型 $2$ 张，再配若干张 C 型卡片，不重叠、无缝隙地拼成一个长为 $2a+b$、宽为 $a+2b$ 的大长方形，需要 C 型卡片多少张？", "options": [{"id": "a", "text": "$2$ 张", "feedback": "这里把正方形卡片的固定用量当成了长方形卡片的用量，应检查尚未覆盖的面积。"}, {"id": "b", "text": "$3$ 张", "feedback": "长、宽中某些系数的和不能直接作为卡片张数，应根据剩余面积列式。"}, {"id": "c", "text": "$4$ 张", "feedback": "计算大长方形的面积时漏了交叉乘积，应完整展开后再扣除已用正方形面积。"}, {"id": "d", "text": "$5$ 张", "feedback": "先扣除固定使用的正方形面积，再除以每张 C 型卡片的面积。"}], "correct": "d", "answer": "$5$ 张", "reasoning": ["设 C 型卡片用 $n$ 张。由总面积相等，$2a^2+2b^2+nab=(2a+b)(a+2b)=2a^2+5ab+2b^2$。", "所以 $nab=5ab$。由于 $a>0$，$b>0$，可除以 $ab$，得 $n=5$，不依赖 $a$、$b$ 的具体数值。", "这种拼法可以实现：把长分成 $a$，$a$，$b$ 三列，宽分成 $a$，$b$，$b$ 三行。第一行放两张 A 和一张旋转后的 C，后两行各放两张 C 和一张 B，恰好符合用量。"], "contentVersion": "sha256:1f34d4d410e77cdc0be18e9730582390ac9126fc77960c970cd2c99cb1cd87f2"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
