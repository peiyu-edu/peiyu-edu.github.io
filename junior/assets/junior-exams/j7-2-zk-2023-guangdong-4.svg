<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 262" width="580" height="262" role="img" aria-labelledby="title desc">
<title id="title">街道拐弯示意图</title>
<desc id="desc">一条拐弯的街道，用两条实线和中间一条虚线表示。街道从左侧水平向右，拐弯后斜向右上，再拐弯水平向右。下侧实线上，左边拐角处是点 B，右边拐角处是点 C；A 在左端，D 在右端。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="580" height="262" fill="white"/>
<path d="M70 214.0H240L380.0 83.4H530" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70 164.0H220L360.0 33.4H530" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M70 189.0H230L370.0 58.4H530" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 10"/>
<text x="46.0" y="199.0" class="m" text-anchor="middle">A</text>
<text x="252.0" y="250.0" class="m" text-anchor="middle">B</text>
<text x="404.0" y="122.0" class="m" text-anchor="middle">C</text>
<text x="556.0" y="94.0" class="m" text-anchor="middle">D</text>
</svg>
