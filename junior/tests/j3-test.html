<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 3 章 代数式 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=c412b14433eb"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=9f35dd2cb533"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=960b69da9959"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=2def94435483"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=9e04f871a3b0"></script></head><body data-stage="junior" data-sec="j3-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 3 章 代数式 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j3-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j3-test", "sectionId": "j3-test", "chapterId": "j3", "title": "第 3 章 代数式 · 章末测验", "label": "章末测验", "sections": ["j3-1", "j3-2"], "items": [{"id": "j3-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j3-1"], "pointIds": ["pyjh.alg.001"], "prompt": "下列式子中，哪一个是代数式？", "options": [{"id": "a", "text": "$2x+1=5$", "feedback": "含有等号，是等式（方程），不是代数式。"}, {"id": "b", "text": "$a>b$", "feedback": "含有不等号，表示大小关系，不是代数式。"}, {"id": "c", "text": "$\\frac{m-n}3$", "feedback": "它只用运算符号把字母和数连接起来，没有等号或不等号。"}, {"id": "d", "text": "$3<5$", "feedback": "含有不等号，不是代数式。"}], "correct": "c", "answer": "$\\frac{m-n}3$", "reasoning": ["用运算符号把数或表示数的字母连接起来的式子叫代数式；含 $=$、$>$、$<$ 的式子不是代数式。", "只有 $\\frac{m-n}3$ 不含等号和不等号。"], "contentVersion": "sha256:0f92ebfb7793373addf076e87e6c493954460b8abedbfdab50faa8ac05e84827"}, {"id": "j3-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j3-1"], "pointIds": ["pyjh.alg.002"], "prompt": "下列代数式的书写中，符合书写规范的是哪一个？", "options": [{"id": "a", "text": "$a\\times3$", "feedback": "数字与字母相乘，乘号省略，数字写在字母前面。"}, {"id": "b", "text": "$1\\frac12x$", "feedback": "带分数与字母相乘时，带分数要化成假分数。"}, {"id": "c", "text": "$\\frac43ab$", "feedback": "数字因数写在前面，乘号省略，分数系数写成假分数。"}, {"id": "d", "text": "$a\\div b$", "feedback": "除法运算一般写成分数的形式。"}], "correct": "c", "answer": "$\\frac43ab$", "reasoning": ["规范：数与字母相乘省略乘号、数写在前；带分数化成假分数；除法写成分数形式。", "$a\\times3$ 应写 $3a$，$1\\frac12x$ 应写 $\\frac32x$，$a\\div b$ 应写 $\\frac ab$；只有 $\\frac43ab$ 规范。"], "contentVersion": "sha256:2c11bee5702c7c45663820aef30c3aa25cafc432d58fc20198abb4d27521fd30"}, {"id": "j3-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j3-1"], "pointIds": ["pyjh.alg.003"], "prompt": "一支笔 $a$ 元，一本笔记本 $b$ 元。买 $3$ 支笔和 $2$ 本笔记本共需多少元？", "options": [{"id": "a", "text": "$(3a+2b)$ 元", "feedback": "分别算出笔的总价和笔记本的总价，再相加。"}, {"id": "b", "text": "$5ab$ 元", "feedback": "两种商品的总价应相加，不是把数量和单价全部相乘。"}, {"id": "c", "text": "$6ab$ 元", "feedback": "$3a$ 与 $2b$ 应该相加，不是相乘。"}, {"id": "d", "text": "$(2a+3b)$ 元", "feedback": "数量和单价对应错了：$3$ 支的是笔。"}], "correct": "a", "answer": "$(3a+2b)$ 元", "reasoning": ["笔的总价是 $3a$ 元，笔记本的总价是 $2b$ 元。", "共需 $(3a+2b)$ 元；和或差作结果时加括号再写单位。"], "contentVersion": "sha256:1354dd51bb344478d60dc209d799a2f3f9962315bda7dae2aa3ec07d06de5736"}, {"id": "j3-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j3-2"], "pointIds": ["pyjh.alg.007", "pyjh.rat.023"], "prompt": "当 $x=-2$ 时，代数式 $x^2-3x+1$ 的值是多少？", "options": [{"id": "a", "text": "$11$", "feedback": "代入负数时要加括号：$(-2)^2-3\\times(-2)+1$。"}, {"id": "b", "text": "$3$", "feedback": "$(-2)^2$ 等于 $4$，不是 $-4$；代入时要给负数加括号。"}, {"id": "c", "text": "$-1$", "feedback": "$-3\\times(-2)$ 是正数，不能算成 $-6$。"}, {"id": "d", "text": "$-9$", "feedback": "平方项和一次项的符号都算错了。"}], "correct": "a", "answer": "$11$", "reasoning": ["代入：$(-2)^2-3\\times(-2)+1$。", "$=4+6+1=11$。"], "contentVersion": "sha256:2c7aafabec465ea9619ed94d39a8eaefa62f8116f9777d15b65472a88871abab"}, {"id": "j3-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j3-1"], "pointIds": ["pyjh.alg.004"], "prompt": "代数式 $2(a+b)$ 表示的意义是什么？", "options": [{"id": "a", "text": "$a$ 的 $2$ 倍与 $b$ 的和", "feedback": "这表示 $2a+b$，没有括号的含义。"}, {"id": "b", "text": "$a$ 与 $b$ 的 $2$ 倍的和", "feedback": "这表示 $a+2b$。"}, {"id": "c", "text": "$a$ 与 $b$ 的和的 $2$ 倍", "feedback": "括号说明先求和，再求它的 $2$ 倍。"}, {"id": "d", "text": "$a$ 与 $b$ 的积的 $2$ 倍", "feedback": "这表示 $2ab$，括号里是加法不是乘法。"}], "correct": "c", "answer": "$a$ 与 $b$ 的和的 $2$ 倍", "reasoning": ["括号里 $a+b$ 是 $a$ 与 $b$ 的和，先算。", "再乘 $2$，所以是「$a$ 与 $b$ 的和的 $2$ 倍」。"], "contentVersion": "sha256:cc208da17b6e076dff679c10f8f4901507cb273570fb3a3d6a567e83ff6fc968"}, {"id": "j3-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j3-1"], "pointIds": ["pyjh.alg.003", "pyjh.alg.004"], "prompt": "某商品原价 $m$ 元，先提价 $10\\%$，再降价 $10\\%$，现价是多少元？", "options": [{"id": "a", "text": "$m$ 元", "feedback": "提价和降价的基数不同：降价是在提价后的价格上降的。"}, {"id": "b", "text": "$0.99m$ 元", "feedback": "提价后为 $1.1m$ 元，再在此基础上降 $10\\%$。"}, {"id": "c", "text": "$1.01m$ 元", "feedback": "先提后降，最后的价格比原价低。"}, {"id": "d", "text": "$0.9m$ 元", "feedback": "只算了降价，漏了先提价这一步。"}], "correct": "b", "answer": "$0.99m$ 元", "reasoning": ["提价 $10\\%$ 后：$m(1+10\\%)=1.1m$（元）。", "再降价 $10\\%$：$1.1m(1-10\\%)=1.1m\\times0.9=0.99m$（元）。"], "contentVersion": "sha256:7c679bb680f09c82cec4898f8a44f414da848622a5a3e31aeabfe76b111dd639"}, {"id": "j3-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j3-1", "j3-2"], "pointIds": ["pyjh.alg.007", "pyjh.alg.004"], "prompt": "已知 $a-2b=3$，则代数式 $2a-4b+5$ 的值是多少？", "options": [{"id": "a", "text": "$11$", "feedback": "$2a-4b=2(a-2b)$，整体代入。"}, {"id": "b", "text": "$8$", "feedback": "$2a-4b$ 是 $a-2b$ 的 $2$ 倍，不等于 $3$。"}, {"id": "c", "text": "$6$", "feedback": "求出了 $2a-4b$，但还要加 $5$。"}, {"id": "d", "text": "$-1$", "feedback": "$2(a-2b)$ 是正数 $6$，再加 $5$。"}], "correct": "a", "answer": "$11$", "reasoning": ["$2a-4b=2(a-2b)=2\\times3=6$。", "$2a-4b+5=6+5=11$。"], "contentVersion": "sha256:57f8d8e7932e3d45b2c4ba9fb9cd54ebfc640372bad5c604ebcecf39697e1d60"}, {"id": "j3-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j3-1"], "pointIds": ["pyjh.alg.005"], "prompt": "用火柴棒按下面的方式摆正方形：摆 $1$ 个正方形用 $4$ 根，摆成一排 $2$ 个用 $7$ 根，摆成一排 $3$ 个用 $10$ 根……照这样摆成一排 $n$ 个正方形，需要多少根火柴棒？", "options": [{"id": "a", "text": "$4n$", "feedback": "相邻两个正方形共用一根火柴棒，不是每个都要 $4$ 根。"}, {"id": "b", "text": "$3n+1$", "feedback": "第一个正方形用 $4$ 根，以后每多一个正方形增加 $3$ 根。"}, {"id": "c", "text": "$4n-1$", "feedback": "用 $n=3$ 检验：$4\\times3-1=11$，与 $10$ 根不符。"}, {"id": "d", "text": "$3n+4$", "feedback": "用 $n=1$ 检验：$3+4=7$，与 $4$ 根不符。"}], "correct": "b", "answer": "$3n+1$", "reasoning": ["根数依次为 $4,7,10,\\dots$，每多一个正方形多 $3$ 根。", "$n$ 个正方形需 $4+3(n-1)=3n+1$ 根；检验 $n=1,2,3$ 分别为 $4,7,10$。"], "contentVersion": "sha256:b444df660e9e40d7f5940a5d44abb2b68079c8a5a595d4ba7c951256b01a1a1d"}, {"id": "j3-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j3-2"], "pointIds": ["pyjh.alg.008"], "prompt": "要使代数式 $\\frac1{x-3}$ 有意义，$x$ 应满足什么条件？", "options": [{"id": "a", "text": "$x\\ne0$", "feedback": "要看的是分母 $x-3$，不是 $x$ 本身。"}, {"id": "b", "text": "$x>3$", "feedback": "$x<3$ 时分母也不为 $0$，代数式同样有意义。"}, {"id": "c", "text": "$x\\ne3$", "feedback": "分母不能为 $0$，只要 $x-3\\ne0$ 即可。"}, {"id": "d", "text": "$x=3$", "feedback": "此时分母为 $0$，代数式没有意义。"}], "correct": "c", "answer": "$x\\ne3$", "reasoning": ["分数的分母不能为 $0$，要求 $x-3\\ne0$。", "所以 $x\\ne3$；$x$ 取其他任何数，代数式都有意义。"], "contentVersion": "sha256:e52e34cfdaaec2e7928ed90264c5f2be0b21dc845997233db56b3742edcd8755"}, {"id": "j3-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j3-1", "j3-2"], "pointIds": ["pyjh.alg.009", "pyjh.alg.003", "pyjh.rat.023"], "prompt": "一个圆环的外圆半径为 $R$，内圆半径为 $r$，圆环面积 $S=\\pi R^2-\\pi r^2$。当 $R=5\\,\\text{cm}$，$r=3\\,\\text{cm}$ 时，圆环的面积是多少？（结果保留 $\\pi$）", "options": [{"id": "a", "text": "$16\\pi\\,\\text{cm}^2$", "feedback": "分别代入求两个圆的面积，再相减。"}, {"id": "b", "text": "$4\\pi\\,\\text{cm}^2$", "feedback": "$R^2-r^2$ 不等于 $(R-r)^2$，应先分别平方再相减。"}, {"id": "c", "text": "$34\\pi\\,\\text{cm}^2$", "feedback": "圆环面积是两圆面积的差，不是和。"}, {"id": "d", "text": "$2\\pi\\,\\text{cm}^2$", "feedback": "公式里是半径的平方，不能直接用半径相减。"}], "correct": "a", "answer": "$16\\pi\\,\\text{cm}^2$", "reasoning": ["代入：$S=\\pi\\times5^2-\\pi\\times3^2=25\\pi-9\\pi$。", "$S=16\\pi\\,(\\text{cm}^2)$。"], "contentVersion": "sha256:0abb489a342cd3bf9f8c9cc37906cc058a80697596b1e3ebf56d2ed43ef8ff43"}, {"id": "j3-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j3-1", "j3-2"], "pointIds": ["pyjh.alg.006", "pyjh.alg.007"], "prompt": "小明带 $60$ 元去买某种水果，水果每千克 $p$ 元，钱恰好用完时能买 $y$ 千克，则 $y=\\frac{60}p$。当 $p=7.5$ 时，$y$ 是多少？", "options": [{"id": "a", "text": "$52.5$", "feedback": "总钱数一定时，单价与数量的乘积是 $60$，不是两者的差。"}, {"id": "b", "text": "$450$", "feedback": "应该用总钱数除以单价，不是相乘。"}, {"id": "c", "text": "$8$", "feedback": "代入 $y=\\frac{60}{7.5}$ 计算。"}, {"id": "d", "text": "$0.125$", "feedback": "被除数和除数弄反了：是 $60\\div7.5$。"}], "correct": "c", "answer": "$8$", "reasoning": ["代入 $p=7.5$：$y=\\frac{60}{7.5}$。", "$y=8$，即能买 $8$ 千克；检验 $7.5\\times8=60$。"], "contentVersion": "sha256:cd5cb0e834c869b7a5cfc7db3fd1fdee1bce3601be6ea8497fa53da178686e3b"}, {"id": "j3-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j3-1"], "pointIds": ["pyjh.alg.005", "pyjh.alg.003", "pyjh.alg.004"], "prompt": "在月历上，同一竖列中上下相邻的三个日期，中间一个是 $x$。这三个日期之和用含 $x$ 的式子表示是哪一项？", "options": [{"id": "a", "text": "$3x+21$", "feedback": "把 $x$ 当成了最上面的日期；$x$ 是中间的那个。"}, {"id": "b", "text": "$x+14$", "feedback": "三个日期都要相加，不能只写两个数的差。"}, {"id": "c", "text": "$3x$", "feedback": "上面一个是 $x-7$，下面一个是 $x+7$，相加时 $-7$ 与 $+7$ 抵消。"}, {"id": "d", "text": "$3x-21$", "feedback": "把 $x$ 当成了最下面的日期。"}], "correct": "c", "answer": "$3x$", "reasoning": ["月历上同一竖列相邻两个日期相差 $7$，三个日期是 $x-7$，$x$，$x+7$。", "和为 $(x-7)+x+(x+7)=3x$。"], "contentVersion": "sha256:10b058d93eb63bdd63a15a5b23b62235fdb93fe06cfc352d54352bb6551a8999"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
