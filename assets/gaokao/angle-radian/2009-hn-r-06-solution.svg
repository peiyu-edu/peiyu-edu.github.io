<svg xmlns="http://www.w3.org/2000/svg" width="500" height="480" viewBox="0 0 500 480" role="img" aria-labelledby="title desc">
  <title id="title">右侧圆弧与解题辅助三角形</title>
  <desc id="desc">作答后解题图。横纵坐标使用相同尺度，每单位60像素。O为原点，圆的半径为2；D由y不小于负x除以3且y不大于x除以2给定，是右侧夹域。橙色是D内的小弧。为求夹角，另外构造圆外辅助点A(2,1)、B(3,-1)，三角形OAB在A处为直角，O角为45度。辅助点并非原题给定点或圆弧端点。</desc>
  <!-- Exact map: (x,y) -> (150+60*x,230-60*y). O=(0,0), A=(2,1), B=(3,-1).
       Circle endpoints U=(4/sqrt(5),2/sqrt(5)), L=(6/sqrt(10),-2/sqrt(10)).
       Both lie on x*x+y*y=4 and the appropriate positive boundary ray. -->
  <rect width="500" height="480" rx="12" fill="#fff"/>
  <text x="250" y="36" text-anchor="middle" fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">解题辅助构造</text>
  <path id="feasible-region" d="M 150 230 L 500 55 L 500 346.666667 Z" fill="#e9f2eb"/>
  <path d="M 150 230 L 257.331262920 176.334368540 A 120 120 0 0 1 263.841995766 267.947331922 Z" fill="#d4e6d8"/>
  <g fill="none" stroke="#9ba8ac" stroke-width="2">
    <path d="M 15 230 H 470 M 150 392 V 76"/>
    <path d="M 462 225 L 470 230 L 462 235 M 145 84 L 150 76 L 155 84"/>
    <circle id="given-circle" cx="150" cy="230" r="120"/>
  </g>
  <g fill="none" stroke="#345b75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path id="boundary-rays" d="M 150 230 L 475 67.5 M 150 230 L 475 338.333333"/>
    <path id="helper-segment-ab" d="M 270 170 L 330 290"/>
  </g>
  <path id="target-arc" d="M 257.331262920 176.334368540 A 120 120 0 0 1 263.841995766 267.947331922" fill="none" stroke="#c76b35" stroke-width="7" stroke-linecap="round"/>
  <path d="M 261.055728090 174.472135955 L 265.527864045 183.416407865 L 274.472135955 178.944271910" fill="none" stroke="#345b75" stroke-width="2.5"/>
  <path d="M 190.249223595 209.875388203 A 45 45 0 0 1 192.690748412 244.230249471" fill="none" stroke="#345b75" stroke-width="2.5"/>
  <g fill="#345b75">
    <circle id="point-o" cx="150" cy="230" r="4"/><circle id="point-a" cx="270" cy="170" r="4"/><circle id="point-b" cx="330" cy="290" r="4"/>
  </g>
  <g fill="none" stroke="#7b8e99" stroke-width="1.5" stroke-dasharray="4 3">
    <path d="M 270 164 L 270 131 M 330 296 L 330 324"/>
  </g>
  <path d="M 275 218 L 319 204" fill="none" stroke="#c76b35" stroke-width="2"/>
  <rect x="199" y="211" width="61" height="31" rx="4" fill="#d4e6d8"/>
  <g fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="478" y="242" font-style="italic">x</text>
    <text x="143" y="66" font-style="italic">y</text>
    <text x="136" y="269" text-anchor="end">O(0,0)</text>
    <text x="220" y="120">A(2,1)</text>
    <text x="340" y="359" text-anchor="middle">B(3,−1)</text>
    <text x="350" y="70">y=x/2</text>
    <text x="331" y="393">y=−x/3</text>
    <text x="207" y="236">45°</text>
    <text x="50" y="391">x²+y²=4</text>
    <text x="250" y="435" text-anchor="middle">区域 D：−x/3 ≤ y ≤ x/2</text>
    <text x="250" y="472" text-anchor="middle">A、B 均为圆外辅助点</text>
  </g>
  <text x="324" y="202" fill="#ad5726" font-family="Arial,'PingFang SC',sans-serif" font-size="30">所求小弧</text>
</svg>
