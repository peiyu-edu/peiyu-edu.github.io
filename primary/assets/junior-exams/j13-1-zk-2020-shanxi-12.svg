<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" role="img" aria-labelledby="title desc">
<title id="title">由正三角形组成的一组规律图案</title>
<desc id="desc">四个图案排成两行，由边长相等的正三角形组成。第 1 个有 4 个三角形：中间一个正立白色三角形，上方、左下、右下各连一个倒立深色三角形。之后每个图案向右多一个单元，相邻单元共用下方的倒立三角形，第 2、3、4 个分别有 7、10、13 个三角形。</desc>
<style>text { fill:#17202a; font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; font-size:30px; }</style>
<rect width="600" height="350" fill="white"/>
