<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280" role="img"><title>四边形中的翻折</title><desc>四边形ABCD中AD与BC平行，BC为AD的3倍，AE与DC平行；三角形ABE沿AE翻折至AB′E，直线B′A、B′E分别与DC交于M、N。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><line x1="100" y1="60" x2="180" y2="60" class=""></line><line x1="180" y1="60" x2="260" y2="220" class=""></line><line x1="180" y1="220" x2="260" y2="220" class=""></line><line x1="100" y1="60" x2="180" y2="220" class=""></line><line x1="100" y1="60" x2="20" y2="220" class="dash"></line><line x1="20" y1="220" x2="180" y2="220" class="dash"></line><line x1="100" y1="60" x2="276" y2="92" class=""></line><line x1="180" y1="220" x2="276" y2="92" class=""></line><text x="91" y="45">A</text><text x="190" y="45">D</text><text x="18" y="248">B</text><text x="278" y="245">C</text><text x="180" y="247">E</text><text x="305" y="97">B′</text><text x="170" y="103">M</text><text x="209" y="162">N</text></svg>
