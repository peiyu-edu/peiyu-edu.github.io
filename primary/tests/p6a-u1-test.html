<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年级上册 第一单元 确定位置 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p6a-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>六年级上册 第一单元 确定位置 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p6a-u1-test", "sectionId": "p6a-u1-test", "unitId": "p6a-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "六年级上册 第一单元 确定位置 单元测评", "items": [{"id": "p6a-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "教室里，小雨坐在第 3 列第 5 行。按「先列后行」，她的位置用有序数对表示是哪一个？", "answer": "（3，5）", "reasoning": ["有序数对先写列，再写行。", "第 3 列第 5 行写成（3，5）。"], "options": [{"id": "a", "text": "（3，3）", "feedback": "列是 3 对了，行应该是 5。"}, {"id": "b", "text": "（3，5）", "feedback": "对。先写列 3，再写行 5。"}, {"id": "c", "text": "（5，3）", "feedback": "顺序反了。要先写列，再写行。"}], "correct": "b", "pointIds": ["pyps.p6a.u1.001"], "contentVersion": "sha256:0de3335d2986c9516ee1569fc8184a74dafcfa57295356ad9633dd6cee0a7b88"}, {"id": "p6a-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "方格图里，列从左往右数，行从下往上数。点 A 在（4，2），把它向上平移 3 格得到点 B。点 B 用有序数对表示是（□，□）。", "answer": "（4，5）", "reasoning": ["向上平移，列不变，还是 4。", "行从下往上数，向上 3 格，行数加 3：2 + 3 = 5。", "点 B 是（4，5）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u1.002"], "contentVersion": "sha256:396962af5287f15206a70561caa8f0cb51e218aff063e0e4b091fc270354d6c3"}, {"id": "p6a-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "「图书馆在学校北偏东 30° 方向 500 米处。」这句话是以哪里为参照点来描述的？", "answer": "学校", "reasoning": ["「A 在 B 的什么方向」，B 是参照点。", "这里说的是图书馆在学校的什么方向，参照点是学校。"], "options": [{"id": "a", "text": "图书馆", "feedback": "图书馆是要找的地方，不是参照点。"}, {"id": "b", "text": "正北方向", "feedback": "正北是用来量角度的方向，不是参照点。"}, {"id": "c", "text": "学校", "feedback": "对。「在学校……方向」，学校就是参照点。"}], "correct": "c", "pointIds": ["pyps.p6a.u1.003"], "contentVersion": "sha256:41b84226f087799c899d61b07ee018d53ea7532219e473b7505e746bf95377e8"}, {"id": "p6a-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一张地图上，每 1 厘米表示实际距离 200 米。在图上量得学校到车站是 3 厘米，学校到车站实际有多少米？", "answer": "200 × 3 = 600（米）", "reasoning": ["图上有 3 个 1 厘米，每 1 厘米表示 200 米。", "实际距离 = 200 × 3 = 600（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u1.004"], "contentVersion": "sha256:40209b9464de0a52ca1c64ba1a305c9ac6178c22f8aa4dcf0879bfdc7bba2338"}, {"id": "p6a-u1-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "学校在图书馆南偏西 40° 方向 300 米处。那么图书馆在学校的什么位置？", "answer": "北偏东 40° 方向 300 米处", "reasoning": ["换成以学校为参照点，方向正好相反。", "南变北，西变东，度数 40° 和距离 300 米都不变。", "图书馆在学校北偏东 40° 方向 300 米处。"], "options": [{"id": "a", "text": "南偏西 40° 方向 300 米处", "feedback": "参照点换了，方向要反过来：南变北，西变东。"}, {"id": "b", "text": "北偏东 40° 方向 300 米处", "feedback": "对。参照点换了，南变北、西变东，度数和距离不变。"}, {"id": "c", "text": "北偏东 50° 方向 300 米处", "feedback": "方向反过来，但度数不变，还是 40°。"}], "correct": "b", "pointIds": ["pyps.p6a.u1.006"], "contentVersion": "sha256:40aa281c078bb0e14024d1ace1cc4aecd8a8180d465fa2939d9d830cccf0ba3d"}, {"id": "p6a-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "小红的位置是（2，4）（先列后行）。小刚和小红坐在同一行，小刚的位置可能是哪一个？", "answer": "（5，4）", "reasoning": ["有序数对的第二个数是行。", "同一行，行数相同，都是 4，列可以不同。", "（5，4）的行是 4，和小红同一行。"], "options": [{"id": "a", "text": "（2，6）", "feedback": "这是和小红同一列，不是同一行。"}, {"id": "b", "text": "（4，2）", "feedback": "这个位置第 4 列第 2 行，和小红既不同列也不同行。"}, {"id": "c", "text": "（5，4）", "feedback": "对。同一行，第二个数（行）相同，都是 4。"}], "correct": "c", "pointIds": ["pyps.p6a.u1.002"], "contentVersion": "sha256:92738cc95f0649ca43353c1e464affebfe50f2f8f2c2c65e0fdd42fd8284fd58"}, {"id": "p6a-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用量角器在图上画「北偏东 60°」的方向时，量角器的 0° 线应该对准哪个方向？", "answer": "正北方向", "reasoning": ["「北偏东 60°」第一个字是「北」，从正北方向开始量。", "0° 线对准正北，再向东偏 60°。"], "options": [{"id": "a", "text": "正东方向", "feedback": "从正东量 60° 画出的是「东偏北 60°」，和北偏东 60° 不同。"}, {"id": "b", "text": "正南方向", "feedback": "这里说的是北偏东，和南没有关系。"}, {"id": "c", "text": "正北方向", "feedback": "对。「北偏东」先说北，0° 线对准正北，再向东量 60°。"}], "correct": "c", "pointIds": ["pyps.p6a.u1.005"], "contentVersion": "sha256:a91c65a7fc69d181bc2bff471f9da5db337c27d14a370a7968f9d0e1d145dc43"}, {"id": "p6a-u1-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小林从家出发，先向正东走 400 米到书店，再从书店向北偏东 30° 方向走 300 米到公园。小林从公园沿原路回家，应该怎样走？", "answer": "先向南偏西 30° 方向走 300 米到书店，再向正西走 400 米到家。", "reasoning": ["回家时，每一段都以这一段的起点为参照点，方向和去的时候相反。", "从公园到书店：书店在公园南偏西 30° 方向 300 米处。", "从书店到家：家在书店正西方向 400 米处。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u1.007", "pyps.p6a.u1.006"], "contentVersion": "sha256:6acde215b2b5e9c9d51693d88eeb6d8ea74b3a7acf9831d2c8a92d5b34d33be5"}, {"id": "p6a-u1-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一辆汽车从甲地开到乙地，路程 120 千米，用了 2 小时；接着从乙地开到丙地，路程 90 千米，用了 1 小时。这辆汽车全程平均每小时行多少千米？", "answer": "（120 + 90）÷（2 + 1）= 70（千米/小时）", "reasoning": ["全程平均速度 = 总路程 ÷ 总时间。", "总路程 120 + 90 = 210（千米），总时间 2 + 1 = 3（小时）。", "210 ÷ 3 = 70（千米/小时）。不能把两段的速度 60 和 90 直接平均。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u1.008"], "contentVersion": "sha256:d6fe7df746f178691ea92a86c885ad05a7d63f33d2161d79e0f4526db188a8bd"}, {"id": "p6a-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一张地图上，每 1 厘米表示实际距离 50 米。超市在学校的北偏西 45° 方向，图上距离是 4 厘米。超市在学校的什么位置？", "answer": "北偏西 45° 方向 200 米处", "reasoning": ["以学校为参照点，超市在北偏西 45° 方向。", "实际距离 50 × 4 = 200（米）。"], "options": [{"id": "a", "text": "北偏西 45° 方向 200 米处", "feedback": "对。方向照图上读，距离 50 × 4 = 200（米）。"}, {"id": "b", "text": "南偏东 45° 方向 200 米处", "feedback": "这是学校在超市的方向。问的是超市在学校的哪个方向。"}, {"id": "c", "text": "北偏西 45° 方向 54 米处", "feedback": "不是加 4，图上有 4 个 1 厘米，要用乘法：50 × 4。"}], "correct": "a", "pointIds": ["pyps.p6a.u1.004", "pyps.p6a.u1.003"], "contentVersion": "sha256:50cbb29fb5b511bb0c0682add46decfe6e2e6482bdc04ff72a3433330ce507ca"}], "contentVersion": "sha256:22a1f2c368168f982d87884cca065e65e11e5141b36f6c1cc89e52e18ba1e352"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
