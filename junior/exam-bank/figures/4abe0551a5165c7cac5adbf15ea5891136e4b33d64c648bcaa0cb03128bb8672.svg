<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 265" role="img"><title>正方形分成六个矩形</title><desc>一个边长为a的正方形由一条纵向和两条横向分割线分成六个全等矩形，右侧展示分开的六个矩形。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><polygon points="20,80 160,80 160,220 20,220" class=""></polygon><line x1="90" y1="80" x2="90" y2="220" class="dash"></line><line x1="20" y1="126.667" x2="160" y2="126.667" class="dash"></line><line x1="20" y1="173.333" x2="160" y2="173.333" class="dash"></line><line x1="169" y1="150" x2="190" y2="150" class=""></line><path d="M182 145 L192 150 L182 155" class=""></path><rect x="205" y="72" width="70" height="46.667"></rect><rect x="205" y="127" width="70" height="46.667"></rect><rect x="205" y="182" width="70" height="46.667"></rect><rect x="283" y="72" width="70" height="46.667"></rect><rect x="283" y="127" width="70" height="46.667"></rect><rect x="283" y="182" width="70" height="46.667"></rect></svg>
