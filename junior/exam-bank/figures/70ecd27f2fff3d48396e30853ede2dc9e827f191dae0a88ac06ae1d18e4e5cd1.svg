<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 205" role="img" aria-labelledby="title desc"><title id="title">正方形网格中的三角形</title><desc id="desc">8×4的正方形网格中有三角形ABC，顶点B、C在格点上，线段MN的两端分别在AB、AC上。</desc><style>path,circle,line,polyline,polygon{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-size:17px}.i{font-style:italic}.c{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif}.f{fill:currentColor;stroke:none}.b{fill:#fff;stroke:none}.bs{stroke:#fff}.g{stroke-width:1;stroke-dasharray:4 3;opacity:.6}.d{stroke-dasharray:6 4}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.b{fill:#15272d}.bs{stroke:#15272d}}</style><line x1="20.0" y1="20.0" x2="20.0" y2="180.0" class="g"/><line x1="60.0" y1="20.0" x2="60.0" y2="180.0" class="g"/><line x1="100.0" y1="20.0" x2="100.0" y2="180.0" class="g"/><line x1="140.0" y1="20.0" x2="140.0" y2="180.0" class="g"/><line x1="180.0" y1="20.0" x2="180.0" y2="180.0" class="g"/><line x1="220.0" y1="20.0" x2="220.0" y2="180.0" class="g"/><line x1="260.0" y1="20.0" x2="260.0" y2="180.0" class="g"/><line x1="300.0" y1="20.0" x2="300.0" y2="180.0" class="g"/><line x1="340.0" y1="20.0" x2="340.0" y2="180.0" class="g"/><line x1="20.0" y1="20.0" x2="340.0" y2="20.0" class="g"/><line x1="20.0" y1="60.0" x2="340.0" y2="60.0" class="g"/><line x1="20.0" y1="100.0" x2="340.0" y2="100.0" class="g"/><line x1="20.0" y1="140.0" x2="340.0" y2="140.0" class="g"/><line x1="20.0" y1="180.0" x2="340.0" y2="180.0" class="g"/><polygon points="100.0,41.4 20.0,180.0 340.0,180.0"/><line x1="60.0" y1="110.7" x2="220.0" y2="110.7"/><text x="82.0" y="40.0" class="i" >A</text><text x="30.0" y="122.0" class="i" >M</text><text x="202.0" y="94.0" class="i" >N</text><text x="4.0" y="196.0" class="i" >B</text><text x="345.0" y="196.0" class="i" >C</text></svg>
