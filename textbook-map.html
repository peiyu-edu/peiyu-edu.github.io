<body><div class="wrap">

<h1>全册路线</h1>
<div class="route-intro">
  <p>按人教 A 版课本的册、章、节排列，选学内容单独标出。点击节名进入学习页。</p>
  <p class="small">页面内容是培玉自编释义、例题和互动。</p>
</div>
<div id="route" aria-live="polite"><p class="small">正在加载路线……</p></div>
<footer>培玉智能 · 全册路线索引。<span class="credit">设计：余博西 · 武江铮 · 赵亭朴</span></footer>
</div>
<script>
(function(){
  "use strict";
  var out=document.getElementById("route");
  function list(v){return Array.isArray(v)?v:[]}
  function esc(v){return String(v==null?"":v).replace(/[&<>\"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c]})}
  function render(data){
    var books=list(data.books);
    if(!books.length && Array.isArray(data)){
      var byBook={};
      data.forEach(function(sec){
        if(!sec || !sec.id)return;
        var book=byBook[sec.book]||(byBook[sec.book]={name:sec.book,chapters:[]});
        var chapterTitle=(sec.chapter||'').replace(/^第\d+章\s*/,''), chapterNo=(sec.chapter||'').replace(/^第(\d+)章.*$/,'$1');
        var ch=book.chapters.filter(function(x){return x.title===chapterTitle})[0];
        if(!ch){ch={no:chapterNo||'?',title:chapterTitle,sections:[]};book.chapters.push(ch)}
        ch.sections.push(sec);
      });
      books=Object.keys(byBook).map(function(k){return byBook[k]});
    }
    if(!books.length){out.innerHTML='<p class="small">路线资料暂时不可用。</p>';return}
    var html=[];
    books.forEach(function(book){
      html.push('<section class="book-route"><h2>'+esc(book.name)+'</h2>');
      if(book.note)html.push('<p class="book-note">'+esc(book.note)+'</p>');
      list(book.chapters).forEach(function(ch){
        html.push('<div class="chapter-route"><h3>第 '+esc(ch.no)+' 章 '+esc(ch.title)+'</h3>');
        if(ch.goal)html.push('<p>'+esc(ch.goal)+'</p>');
        html.push('<ul class="section-route">');
        list(ch.sections).forEach(function(sec){
          html.push('<li id="'+esc(sec.id)+'"><a href="lessons/'+encodeURIComponent(sec.id)+'.html">'+esc(sec.section)+'</a>');
          if(sec.optional || sec.level==='optional')html.push('<span class="tag">选学</span>');
          if(list(sec.concepts).length)html.push('<span class="focus">抓住：'+esc(list(sec.concepts).slice(0,2).join('、'))+'</span>');
          html.push('</li>');
        });
        html.push('</ul></div>');
      });
      html.push('</section>');
    });
    out.innerHTML=html.join('');
  }
  fetch('data/textbook-route.json').then(function(r){if(!r.ok)throw Error(r.status);return r.json()}).then(render).catch(function(){out.innerHTML='<p class="small">路线资料暂时不可用，请稍后再试。</p>'});
}());
</script></body></html>
