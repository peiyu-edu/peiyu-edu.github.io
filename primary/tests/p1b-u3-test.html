<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级下册 第三单元 100以内数的认识 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p1b-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级下册 第三单元 100以内数的认识 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1b-u3-test", "sectionId": "p1b-u3-test", "unitId": "p1b-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级下册 第三单元 100以内数的认识 单元测评", "items": [{"id": "p1b-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "4 个十和 7 个一组成的数是 □。", "answer": "47", "reasoning": ["4 个十是 40。", "40 和 7 个一合起来是 47。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.002"], "contentVersion": "sha256:93a8cbe77a6698b47c77f9399c256aed867cf3b7c2d1543585b623214e5655fe"}, {"id": "p1b-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "六十八写作 □。", "answer": "68", "reasoning": ["六十八有 6 个十和 8 个一。", "十位写 6，个位写 8，写作 68。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.003"], "contentVersion": "sha256:175d86f9bfda8ce4faea9757358cae7fffd50cd77308d36936826796874f5b3a"}, {"id": "p1b-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "90 读作 □。", "answer": "九十", "reasoning": ["90 的十位是 9，个位是 0。", "个位的 0 不读，读作九十。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.003"], "contentVersion": "sha256:d856456dc165a3067cb90bb7940e377a4d74bf71babd607492b680a28f8c80ab"}, {"id": "p1b-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "在 ○ 里填 >、< 还是 =？ 56 ○ 65", "answer": "<", "reasoning": ["两个都是两位数，先比十位：5 个十比 6 个十少。", "所以 56 < 65。"], "options": [{"id": "a", "text": "<", "feedback": "对。十位上 5 比 6 小，所以 56 < 65。"}, {"id": "b", "text": "=", "feedback": "56 和 65 数字一样，但位置不同，大小不一样。"}, {"id": "c", "text": ">", "feedback": "先比十位：5 个十比 6 个十少，56 比 65 小。"}], "correct": "a", "pointIds": ["pyps.p1b.u3.007"], "contentVersion": "sha256:12c9621699f1dc661d780d711a07898e25ea19ac3786acd1ef7ca64f6f4eb7fe"}, {"id": "p1b-u3-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "99 添上 1 是 □。", "answer": "100", "reasoning": ["99 添上 1，个位满十，变成 10 个十。", "10 个十是 100。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.005"], "contentVersion": "sha256:a547b68776562337aa1ca38c7fe3746b679821c6e815bc408afbc9b7999294c0"}, {"id": "p1b-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "73 里的 7 在 □ 位上，表示 7 个 □。", "answer": "十位，7 个十", "reasoning": ["两位数从右往左，第一位是个位，第二位是十位。", "7 在十位上，表示 7 个十。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.004"], "contentVersion": "sha256:cfb06d0712d5de23b2790e20b1ae132cb4f2157868e64da721edd82bbd8f7c62"}, {"id": "p1b-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "按顺序填数：48、49、□、51", "answer": "50", "reasoning": ["49 再数 1 个，个位满十，是 50。", "50 再数 1 个是 51，对上了。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.001"], "contentVersion": "sha256:64245caa572593ba9ad692e2b2b160405d80563f4063fbe77c4ab0b83d63ece2"}, {"id": "p1b-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在百数表里，45 正下方的一格是几？", "answer": "55", "reasoning": ["百数表每行 10 个数，往下一格就多 10。", "45 多 10 是 55。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.006"], "contentVersion": "sha256:0054b470a0283855e0c8171c849a8f34876d6bb8bf621c4abd88538ec41bcd10", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 110\" role=\"img\" aria-label=\"百数表局部，四十五下方的数留空\" style=\"max-width:280px\"><rect x=\"10\" y=\"12\" width=\"26\" height=\"26\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"23\" y=\"31\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">34<\/text><rect x=\"36\" y=\"12\" width=\"26\" height=\"26\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"49\" y=\"31\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">35<\/text><rect x=\"62\" y=\"12\" width=\"26\" height=\"26\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"75\" y=\"31\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">36<\/text><rect x=\"10\" y=\"38\" width=\"26\" height=\"26\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"23\" y=\"57\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">44<\/text><rect x=\"36\" y=\"38\" width=\"26\" height=\"26\" rx=\"3\" style=\"fill:var(--hl-soft);stroke:var(--muted);stroke-width:2\"/><text x=\"49\" y=\"57\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">45<\/text><rect x=\"62\" y=\"38\" width=\"26\" height=\"26\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"75\" y=\"57\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">46<\/text><rect x=\"10\" y=\"64\" width=\"26\" height=\"26\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"23\" y=\"83\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">54<\/text><rect x=\"36\" y=\"64\" width=\"26\" height=\"26\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"49\" y=\"83\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">?<\/text><rect x=\"62\" y=\"64\" width=\"26\" height=\"26\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"75\" y=\"83\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">56<\/text><\/svg>"}, {"id": "p1b-u3-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "妹妹有 12 张贴纸，姐姐的贴纸比妹妹多得多。姐姐可能有几张？", "answer": "70 张", "reasoning": ["「多得多」是说比 12 多很多。", "13 只多一点，11 比 12 少，70 比 12 多很多，选 70 张。"], "options": [{"id": "a", "text": "70 张", "feedback": "对。70 比 12 多很多，是「多得多」。"}, {"id": "b", "text": "11 张", "feedback": "11 比 12 还少。"}, {"id": "c", "text": "13 张", "feedback": "13 只比 12 多一点点，是「多一些」。"}], "correct": "a", "pointIds": ["pyps.p1b.u3.008"], "contentVersion": "sha256:0183393ff88590861ccd1d759b321b8c3112df1e036d52bca061a043e7961671"}, {"id": "p1b-u3-t10", "number": 10, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "30 + 40 = □，50 + 6 = □", "answer": "70，56", "reasoning": ["3 个十加 4 个十是 7 个十，就是 70。", "5 个十和 6 个一合起来是 56。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.009", "pyps.p1b.u3.010"], "contentVersion": "sha256:b2017ed4bf5186fca1f42a10af002930fa10ebd72ef6529e80c89ea8afb537bf"}, {"id": "p1b-u3-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个两位数，个位上是 3，十位上的数比个位上的数大 2。这个两位数是几？", "answer": "53", "reasoning": ["个位是 3，十位比 3 大 2，十位是 5。", "十位写 5，个位写 3，这个数是 53。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.004"], "contentVersion": "sha256:6d5bec8c495777b1c630ed3354b9d106d5a523c3938abddb6dd51899cc15c8ad"}, {"id": "p1b-u3-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "有 3 个圆片，全部摆在计数表的十位和个位上（有一位可以不摆），能摆出哪些两位数？", "answer": "30、21、12", "reasoning": ["按十位上的圆片从多到少摆：十位 3 个、个位 0 个是 30；十位 2 个、个位 1 个是 21；十位 1 个、个位 2 个是 12。", "十位 0 个、个位 3 个是 3，不是两位数。所以能摆出 30、21、12。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u3.011"], "contentVersion": "sha256:5457fd394d4f1b5cc08c626c209474bf10a670be463f9ca03957e1e1b12bd704", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 220\" role=\"img\" aria-label=\"三个待摆圆片与空的十位、个位表\" style=\"max-width:280px\"><text x=\"140\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">待摆圆片<\/text><circle cx=\"40\" cy=\"52\" r=\"9\" style=\"fill:var(--a);stroke:var(--a);stroke-width:2\"/><circle cx=\"72\" cy=\"52\" r=\"9\" style=\"fill:var(--a);stroke:var(--a);stroke-width:2\"/><circle cx=\"104\" cy=\"52\" r=\"9\" style=\"fill:var(--a);stroke:var(--a);stroke-width:2\"/><rect x=\"40\" y=\"78\" width=\"85\" height=\"105\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2;stroke-dasharray:4 3\"/><text x=\"82\" y=\"207\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">十位<\/text><rect x=\"155\" y=\"78\" width=\"85\" height=\"105\" rx=\"3\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2;stroke-dasharray:4 3\"/><text x=\"197\" y=\"207\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">个位<\/text><\/svg>"}], "contentVersion": "sha256:a88fcaaf609c23ad7e21f6a1c73af9285bcee324390f1f9bce3bb95e9f7ab811"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
