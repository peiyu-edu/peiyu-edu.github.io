<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二年级下册 第三单元 万以内数的认识 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p2b-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>二年级下册 第三单元 万以内数的认识 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p2b-u3-test", "sectionId": "p2b-u3-test", "unitId": "p2b-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "二年级下册 第三单元 万以内数的认识 单元测评", "items": [{"id": "p2b-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "填空：10 个一百是 ____。", "answer": "一千（1000）", "reasoning": ["一百一百地数，数 10 个一百。", "10 个一百是一千，写作 1000。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u3.001"], "contentVersion": "sha256:d80e7815b187ce77a958a91e1c9a50a7e1f767920d19e70f8aea9d5e10c4fd29"}, {"id": "p2b-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个数由 3 个千、5 个百、2 个十和 7 个一组成，这个数写作 ____。", "answer": "3527", "reasoning": ["千位写 3，百位写 5，十位写 2，个位写 7。", "这个数是 3527。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u3.002"], "contentVersion": "sha256:0e84f1adc4455210e0f719748fd12731b058441d425cf8bfe0c5ef988d2ef8ca"}, {"id": "p2b-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "填空：10 个一千是 ____；9999 再添上 1 是 ____。", "answer": "一万（10000），一万（10000）", "reasoning": ["一千一千地数，10 个一千是一万，写作 10000。", "9999 再添 1，个位、十位、百位、千位都满十进一，得 10000。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u3.003"], "contentVersion": "sha256:4a7806932c07f73c0ee43e0f4d3945274289eb736e11f0f472e84c569b6b78a1"}, {"id": "p2b-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "读出 6050。", "answer": "六千零五十", "reasoning": ["从高位读起：千位 6 读六千，百位是 0，读一个「零」。", "十位 5 读五十，个位的 0 不读，所以读作六千零五十。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u3.004", "pyps.p2b.u3.002"], "contentVersion": "sha256:eb67531b9b7f0a5bf545a19cbb00fbc27c1e42acf579b95f6f20f5e9f3292cb9"}, {"id": "p2b-u3-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "写出「四千零八」。", "answer": "4008", "reasoning": ["千位写 4。", "没有百和十，百位、十位都写 0 占位，个位写 8，写作 4008。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u3.005"], "contentVersion": "sha256:593a036643c04574974c33dabc94dc193e1f92f2be5c19490afa54b5dd7135c1"}, {"id": "p2b-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在横线上填 >、< 或 =：3099 ____ 3109；　5600 ____ 5060；　7000 ____ 6999", "answer": "<，>，>", "reasoning": ["位数相同，从最高位比起：3099 和 3109 千位都是 3，百位 0 < 1，所以 3099 < 3109。", "5600 和 5060 百位 6 > 0，填 >；7000 和 6999 千位 7 > 6，填 >。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u3.006"], "contentVersion": "sha256:da51d28b965505fb57144923fe1786b1986c3b19261b54fde74419bebd90cfe6"}, {"id": "p2b-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪句话里的数是近似数？", "answer": "体育馆大约能坐 3000 人", "reasoning": ["和实际数量完全一样的是准确数，和实际数量接近的是近似数。", "「大约能坐 3000 人」说的是接近 3000，是近似数。"], "options": [{"id": "a", "text": "体育馆大约能坐 3000 人", "feedback": "对。「大约」说明 3000 是近似数。"}, {"id": "b", "text": "小明今年 8 岁", "feedback": "年龄是准确的，8 是准确数。"}, {"id": "c", "text": "这本书有 248 页", "feedback": "书的页数可以数清楚，248 是准确数。"}], "correct": "a", "pointIds": ["pyps.p2b.u3.007"], "contentVersion": "sha256:fb280b0aa0da15f8181f7262129c87fa872bb14428760b3ce721cd3e1230559e"}, {"id": "p2b-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "口算：600 + 300 = ？　5000 − 2000 = ？　800 + 700 = ？", "answer": "900，3000，1500", "reasoning": ["6 个百加 3 个百是 9 个百，得 900；5 个千减 2 个千是 3 个千，得 3000。", "8 个百加 7 个百是 15 个百，就是 1500。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u3.008"], "contentVersion": "sha256:d0eba98fde344e0319ed098f32c8cde2010cc77eff9437fccbf1883c8005b4d5"}, {"id": "p2b-u3-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "3980 更接近 3000 还是 4000？", "answer": "更接近 4000", "reasoning": ["3980 是 3 个千、9 个百、8 个十，再添 2 个十就是 4000。", "3980 比 3900 还大，离 3000 有 9 个多百，所以更接近 4000。"], "options": [{"id": "a", "text": "更接近 3000", "feedback": "3980 比 3900 还大，离 3000 有 9 个多百那么远。"}, {"id": "b", "text": "更接近 4000", "feedback": "对。3980 再添 2 个十就是 4000，离 4000 很近。"}, {"id": "c", "text": "离 3000 和 4000 一样近", "feedback": "3980 离 4000 只差 2 个十，离 3000 却有 9 个多百，不一样近。"}], "correct": "b", "pointIds": ["pyps.p2b.u3.007", "pyps.p2b.u3.006"], "contentVersion": "sha256:d3aaaab24288b407869e1e0c710aabead19a60266b0c7f7f0a304a3fd437e0e5"}, {"id": "p2b-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个四位数，千位是 5，百位是 0，十位是 3，个位是 0。这个数写作 ____，读作 ____。", "answer": "5030，五千零三十", "reasoning": ["按数位写：千位 5、百位 0、十位 3、个位 0，写作 5030。", "读的时候中间的 0 读一个「零」，末尾的 0 不读：五千零三十。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u3.005", "pyps.p2b.u3.002", "pyps.p2b.u3.004"], "contentVersion": "sha256:eb1e3e3752bc2c4270bb18542ea75a9b4e3e69fb217efd7a1809e76d9b609a5f"}, {"id": "p2b-u3-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "用 2、0、7、5 这四张数字卡片，每张用一次，组成四位数。最大的四位数是 ____，最小的四位数是 ____。", "answer": "7520，2057", "reasoning": ["最大：从高位起依次放大的数，7、5、2、0，得 7520。", "最小：0 不能放在千位，千位放 2，后面依次放小的 0、5、7，得 2057。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u3.006", "pyps.p2b.u3.005"], "contentVersion": "sha256:107bb96907413bbd72bd05ad48a6f4d17703d6b36987edc630acdefd95aac500"}], "contentVersion": "sha256:2500952aa7829cb6542587b352a1936b20f3652aa0a3becba3c6fe97582ce44e"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
