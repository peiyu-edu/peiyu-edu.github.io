<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 270" role="img"><title>平行四边形与线段AE</title><desc>平行四边形ABCD，点E在BC上，连接AE。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><polygon points="120,60 60,210 260,210 320,60" class=""></polygon><line x1="120" y1="60" x2="145" y2="210" class=""></line><text x="113" y="45">A</text><text x="42" y="231">B</text><text x="269" y="234">C</text><text x="334" y="56">D</text><text x="144" y="238">E</text></svg>
