<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 490" width="600" height="490" role="img" aria-labelledby="title desc">
<title id="title">公园用地面积的频数分布直方图</title>
<desc id="desc">频数分布直方图：横轴为面积（公顷），分点 0、4、8、12、16、20；纵轴为频数（公园个数），刻度从 2 到 16。五组上方依次标着 4、a、16、12、8。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="600" height="490" fill="white"/>
<line x1="75.0" y1="440.0" x2="75.0" y2="15.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="75.0,15.0 82.0,31.0 68.0,31.0" fill="#17202a"/>
<line x1="75.0" y1="440.0" x2="465.0" y2="440.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="465.0,440.0 449.0,447.0 449.0,433.0" fill="#17202a"/>
<line x1="66.0" y1="395.0" x2="75.0" y2="395.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="61.0" y="405.0" class="n" text-anchor="end">2</text>
<line x1="66.0" y1="350.0" x2="75.0" y2="350.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="61.0" y="360.0" class="n" text-anchor="end">4</text>
<line x1="66.0" y1="305.0" x2="75.0" y2="305.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="61.0" y="315.0" class="n" text-anchor="end">6</text>
<line x1="66.0" y1="260.0" x2="75.0" y2="260.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="61.0" y="270.0" class="n" text-anchor="end">8</text>
<line x1="66.0" y1="215.0" x2="75.0" y2="215.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="61.0" y="225.0" class="n" text-anchor="end">10</text>
<line x1="66.0" y1="170.0" x2="75.0" y2="170.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="61.0" y="180.0" class="n" text-anchor="end">12</text>
<line x1="66.0" y1="125.0" x2="75.0" y2="125.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="61.0" y="135.0" class="n" text-anchor="end">14</text>
<line x1="66.0" y1="80.0" x2="75.0" y2="80.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="61.0" y="90.0" class="n" text-anchor="end">16</text>
<text x="89.0" y="38.0" class="c" text-anchor="start">频数(公园个数)</text>
<rect x="75.0" y="350.0" width="72.0" height="90.0" fill="none" stroke="#17202a" stroke-width="2.5"/>
<text x="111.0" y="341.0" class="n" text-anchor="middle">4</text>
<rect x="147.0" y="215.0" width="72.0" height="225.0" fill="none" stroke="#17202a" stroke-width="2.5"/>
<text x="183.0" y="206.0" class="l" text-anchor="middle">a</text>
<rect x="219.0" y="80.0" width="72.0" height="360.0" fill="none" stroke="#17202a" stroke-width="2.5"/>
<text x="255.0" y="71.0" class="n" text-anchor="middle">16</text>
<rect x="291.0" y="170.0" width="72.0" height="270.0" fill="none" stroke="#17202a" stroke-width="2.5"/>
<text x="327.0" y="161.0" class="n" text-anchor="middle">12</text>
<rect x="363.0" y="260.0" width="72.0" height="180.0" fill="none" stroke="#17202a" stroke-width="2.5"/>
<text x="399.0" y="251.0" class="n" text-anchor="middle">8</text>
<text x="75.0" y="476.0" class="n" text-anchor="middle">0</text>
<text x="147.0" y="476.0" class="n" text-anchor="middle">4</text>
