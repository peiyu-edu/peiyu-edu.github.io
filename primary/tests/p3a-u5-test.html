<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级上册 第五单元 线和角 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p3a-u5-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级上册 第五单元 线和角 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3a-u5-test", "sectionId": "p3a-u5-test", "unitId": "p3a-u5", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级上册 第五单元 线和角 单元测评", "items": [{"id": "p3a-u5-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "射线有几个端点？", "answer": "1 个", "reasoning": ["线段有 2 个端点，射线有 1 个端点，直线没有端点。", "所以射线有 1 个端点。"], "options": [{"id": "a", "text": "1 个", "feedback": "对。射线从一个端点出发，向一边无限延伸。"}, {"id": "b", "text": "没有端点", "feedback": "没有端点的是直线。"}, {"id": "c", "text": "2 个", "feedback": "有 2 个端点的是线段。"}], "correct": "a", "pointIds": ["pyps.p3a.u5.001"], "contentVersion": "sha256:5b1ac7dcbebf578f03f1e09c2674fc35e2f96654da443db80972fcb6898d241f"}, {"id": "p3a-u5-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪句话是对的？", "answer": "线段可以量出长度", "reasoning": ["线段有两个端点，可以量出长度。", "射线和直线都能无限延伸，量不出长度，也不能比长短。"], "options": [{"id": "a", "text": "射线可以量出长度", "feedback": "射线向一边无限延伸，量不出长度。"}, {"id": "b", "text": "直线比射线长", "feedback": "直线和射线都是无限长的，不能比长短。"}, {"id": "c", "text": "线段可以量出长度", "feedback": "对。线段有两个端点，长度是一定的。"}], "correct": "c", "pointIds": ["pyps.p3a.u5.001"], "contentVersion": "sha256:b37836ddfad3f80556075c97bb6c3d974b9b16bfc1137c3e3f398e89070c6b09"}, {"id": "p3a-u5-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "角的大小和什么有关？", "answer": "两条边张开的大小", "reasoning": ["角的大小看两条边张开得多大。", "和边画得长短、角放在哪里都没有关系。"], "options": [{"id": "a", "text": "两条边张开的大小", "feedback": "对。张口越大，角越大。"}, {"id": "b", "text": "两条边画得长不长", "feedback": "边画长一点或短一点，张口不变，角的大小就不变。"}, {"id": "c", "text": "顶点在纸上的位置", "feedback": "把角挪个地方，张口不变，大小也不变。"}], "correct": "a", "pointIds": ["pyps.p3a.u5.005"], "contentVersion": "sha256:dade76eaa320fe29449b1177c8816ba4be734078d3e44aaaa71d752569613bdd"}, {"id": "p3a-u5-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "钟面上，哪个整时时针和分针正好组成直角？", "answer": "3 时", "reasoning": ["整时分针都指着 12。", "3 时时针指着 3，用三角尺的直角比一比，两针正好组成直角。"], "options": [{"id": "a", "text": "3 时", "feedback": "对。3 时分针指 12，时针指 3，正好组成直角。"}, {"id": "b", "text": "6 时", "feedback": "6 时两针成一条直线，不是直角。"}, {"id": "c", "text": "4 时", "feedback": "4 时两针张开得比直角大。"}], "correct": "a", "pointIds": ["pyps.p3a.u5.006"], "contentVersion": "sha256:a8a92426767412727e743796aea80dafea37948fc1c0e8b980d317b6a4698c1d"}, {"id": "p3a-u5-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在一条直线上依次点上 A、B、C 三个点。以这三个点为端点的线段有几条？", "answer": "3 条", "reasoning": ["以 A 为左端点：AB、AC，有 2 条。", "以 B 为左端点：BC，有 1 条。", "2 + 1 = 3（条）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u5.003"], "contentVersion": "sha256:5b6184a4bc1614213101c49662691a8902f3951c9a363ba3b815705fbed267e5"}, {"id": "p3a-u5-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一条直线上依次有 A、B、C、D 四个点。以这些点为端点的线段有几条？射线有几条？", "answer": "6 条线段，8 条射线", "reasoning": ["数线段：以 A 为左端点有 3 条，以 B 为左端点有 2 条，以 C 为左端点有 1 条，3 + 2 + 1 = 6（条）。", "数射线：每个点都能向左、向右各引出 1 条射线，4 × 2 = 8（条）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u5.003"], "contentVersion": "sha256:7cdbf7478c268a5812876ef02d3b16aad6d696dc0dcb3e8a0e073725892ef248"}, {"id": "p3a-u5-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "钟面上 5 时整，时针和分针组成的角是什么角？", "answer": "钝角", "reasoning": ["3 时两针组成直角。", "5 时时针指着 5，比 3 时张开得更大，但没有到 6 时那样成一条直线。", "比直角大，所以是钝角。"], "options": [{"id": "a", "text": "直角", "feedback": "3 时才是直角，5 时张口更大。"}, {"id": "b", "text": "钝角", "feedback": "对。5 时两针张开得比直角大，又没有成一条直线。"}, {"id": "c", "text": "锐角", "feedback": "锐角比直角小。5 时两针张开得比 3 时还大。"}], "correct": "b", "pointIds": ["pyps.p3a.u5.007", "pyps.p3a.u5.006"], "contentVersion": "sha256:c1c1ece6facb7a484f6c1afd9e433d3e1b626024f616c56cbff7ee0419e7c938"}, {"id": "p3a-u5-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "经过纸上的一个点，可以画几条直线？", "answer": "无数条", "reasoning": ["经过一个点，直线可以朝各个方向画。", "转一转直尺就能再画一条，所以能画无数条。", "经过两个点，只能画 1 条直线。"], "options": [{"id": "a", "text": "1 条", "feedback": "经过两个点才只能画 1 条直线。"}, {"id": "b", "text": "2 条", "feedback": "转一转直尺还能画更多，不止 2 条。"}, {"id": "c", "text": "无数条", "feedback": "对。过一点可以朝各个方向画，画不完。"}], "correct": "c", "pointIds": ["pyps.p3a.u5.002"], "contentVersion": "sha256:9a8d2d9c5aba99bc90efe92b319ad11b35efedf288d7716d6b880e85ff0c11bb"}, {"id": "p3a-u5-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用圆规比较线段 AB 和 CD：圆规两脚分别对准 A 和 B，张开的大小不变，移到 CD 上。一只脚放在 C，另一只脚落在 C 和 D 之间。哪条线段长？", "answer": "CD 长", "reasoning": ["圆规两脚张开的大小就是 AB 的长度。", "移到 CD 上，另一只脚落在 C 和 D 之间，说明 AB 只有 CD 的一部分那么长。", "所以 CD 长。"], "options": [{"id": "a", "text": "一样长", "feedback": "一样长时，另一只脚正好落在 D 上。"}, {"id": "b", "text": "AB 长", "feedback": "如果 AB 长，另一只脚会落到 D 的外面。"}, {"id": "c", "text": "CD 长", "feedback": "对。AB 的长度只到 CD 中间，CD 还有一截，所以 CD 长。"}], "correct": "c", "pointIds": ["pyps.p3a.u5.004"], "contentVersion": "sha256:4ef7545f2e7474ece212132e918c0e3fb642000a15e2600bb3341d143d7ef2f2"}, {"id": "p3a-u5-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "把一块三角尺的直角和另一块三角尺的一个锐角紧挨着拼在一起：顶点重合，一条边重合，两个角分别在这条边的两侧，内部不重叠。两条不重合的边之间拼成的角是什么角？", "answer": "钝角", "reasoning": ["两个角在公共边两侧，内部不重叠，拼成的角是直角再加上一个锐角，比直角大。", "三角尺上的锐角比直角小，拼起来也没有成一条直线。", "所以拼成的是钝角。"], "options": [{"id": "a", "text": "锐角", "feedback": "拼进来一个直角，拼出的角至少有直角那么大，不可能是锐角。"}, {"id": "b", "text": "钝角", "feedback": "对。直角再加上一个锐角，比直角大，又没有拼成一条直线，是钝角。"}, {"id": "c", "text": "直角", "feedback": "直角上又加了一个锐角，比直角大了。"}], "correct": "b", "pointIds": ["pyps.p3a.u5.008", "pyps.p3a.u5.007"], "contentVersion": "sha256:cc75a4b624cbc7c912e1daa362054c65dc6f97de769cf2895d41c498610df30a"}, {"id": "p3a-u5-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小明在一条直线上点了 5 个点。以这些点为端点，一共可以数出几条线段？", "answer": "10 条", "reasoning": ["从最左边的点数起：第 1 个点向右有 4 条，第 2 个点有 3 条，第 3 个点有 2 条，第 4 个点有 1 条。", "4 + 3 + 2 + 1 = 10（条）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u5.003", "pyps.p3a.u5.001"], "contentVersion": "sha256:2b437c41c44119622e1bdd1284856a2096b7f3dd3e8452bbb5109825792c7772"}, {"id": "p3a-u5-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "钟面上 1 时、3 时、5 时整，时针和分针组成三个角。按从小到大排，顺序是哪一个？", "answer": "1 时、3 时、5 时", "reasoning": ["1 时两针张开得比直角小，是锐角。", "3 时是直角，5 时比直角大，是钝角。", "锐角 < 直角 < 钝角，所以顺序是 1 时、3 时、5 时。"], "options": [{"id": "a", "text": "1 时、3 时、5 时", "feedback": "对。1 时是锐角，3 时是直角，5 时是钝角。"}, {"id": "b", "text": "3 时、1 时、5 时", "feedback": "1 时两针张开得比 3 时小。"}, {"id": "c", "text": "5 时、3 时、1 时", "feedback": "这是从大到小排的。"}], "correct": "a", "pointIds": ["pyps.p3a.u5.007", "pyps.p3a.u5.006"], "contentVersion": "sha256:3132382e63b4728431fb8e1c3e140b4cb7c3171e5bfd16f9d2f33793f77113e8"}], "contentVersion": "sha256:4663720db2622513c68a44ffc2b47daf8bffaff7c3b619cf4d03116a01586fac"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
