<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 245" role="img"><title>轴对称的两个三角形</title><desc>三角形ABC与A′B′C′关于直线l对称，∠C为直角，AC长8，BC长6。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><polygon points="50,130 130,70 95,190" class=""></polygon><polygon points="290,130 210,70 245,190" class=""></polygon><line x1="170" y1="40" x2="170" y2="220" class=""></line><path d="M58 124 L64 132 L56 138" class=""></path><text x="130" y="57">A</text><text x="36" y="134">C</text><text x="94" y="214">B</text><text x="210" y="57">A′</text><text x="311" y="134">C′</text><text x="245" y="214">B′</text><text x="180" y="29">l</text></svg>
