"], "prompt": "$\\odot O$ 的半径为 $4$，圆心 $O$ 到直线 $l$ 的距离为 $3$。直线 $l$ 与 $\\odot O$ 的位置关系是什么？", "options": [{"id": "a", "text": "相切", "feedback": "相切要求圆心到直线的距离等于半径。"}, {"id": "b", "text": "相离", "feedback": "相离要求圆心到直线的距离大于半径。"}, {"id": "c", "text": "相交", "feedback": "$d=3<4=r$。"}, {"id": "d", "text": "无法确定", "feedback": "已知 $d$ 和 $r$，比较大小就能确定。"}], "correct": "c", "answer": "相交", "reasoning": ["比较圆心到直线的距离 $d$ 与半径 $r$：$d<r$ 相交，$d=r$ 相切，$d>r$ 相离。", "$d=3<4$，直线与圆相交。"], "contentVersion": "sha256:4bcf42e73729f6daf88fa77c790d805cc066517b0ee45deb09e1316419cbb59f"}, {"id": "j30-test-02-v2", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j30-1"], "pointIds": ["pyjh.cline.002"], "prompt": "$PA$ 与 $\\odot O$ 相切于点 $A$，$OA=3$，$OP=5$。切线长 $PA$ 是多少？", "options": [{"id": "a", "text": "$\\sqrt{34}$", "feedback": "把直角边与斜边的位置弄反了，请先确定勾股定理中的斜边。"}, {"id": "b", "text": "$4$", "feedback": "切线垂直于过切点的半径，$PA=\\sqrt{5^2-3^2}$。"}, {"id": "c", "text": "$2$", "feedback": "$5-3$ 不是直角边的长，要用勾股定理。"}, {"id": "d", "text": "$8$", "feedback": "$PA$ 是直角边，比斜边 $OP$ 短。"}], "correct": "b", "answer": "$4$", "reasoning": ["切线垂直于过切点的半径，$OA\\perp PA$。", "在直角三角形 $OAP$ 中，$PA=\\sqrt{OP^2-OA^2}=\\sqrt{25-9}=4$。"], "contentVersion": "sha256:09a1a1a5869d1e9b65dde406da74da89f5bdc7d2cffe825b0b95b45ce0f4c0a9"}, {"id": "j30-test-03-v2", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j30-1"], "pointIds": ["pyjh.cline.003"], "prompt": "下列直线中，一定是 $\\odot O$ 的切线的是哪一个？", "options": [{"id": "a", "text": "经过半径外端的直线", "feedback": "只检查了过点条件，缺少方向条件，不能保证直线是切线。"}, {"id": "b", "text": "垂直于半径的直线", "feedback": "垂直于半径但不过外端，可能与圆相交或相离。"}, {"id": "c", "text": "与圆有公共点的直线", "feedback": "相交的直线与圆也有公共点。"}, {"id": "d", "text": "经过半径的外端并且垂直于这条半径的直线", "feedback": "这就是切线的判定定理：两个条件缺一不可。"}], "correct": "d", "answer": "经过半径的外端并且垂直于这条半径的直线", "reasoning": ["切线的判定定理：经过半径的外端并且垂直于这条半径的直线是圆的切线。", "只满足其中一个条件都不够。"], "contentVersion": "sha256:f819cbaff84fed27ae77d5926cdc80ced4b2e9fb0de87fdbb57fa121efe8eab4"}, {"id": "j30-test-04-v2", "text": "$\\frac{12}{5}$", "feedback": "$\\frac{12}{5}$ 是斜边上的高的一半。"}, {"id": "d", "text": "$2$", "feedback": "斜边 $10$，$r=\\frac{6+8-10}{2}$。"}], "correct": "d", "answer": "$2$", "reasoning": ["斜边 $c=\\sqrt{6^2+8^2}=10$。", "由切线长定理，$r=\\frac{a+b-c}{2}=\\frac{6+8-10}{2}=2$。", "或用面积：$\\frac12\\times6\\times8=\\frac12r(6+8+10)$，$r=2$。"], "contentVersion": "sha256:04a2c15a051f2a3693d9e19fde3a420b4c8f5ddf4ffe2461f46cfef52ac5c261"}, {"id": "j30-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j30-2"], "pointIds": ["pyjh.cline.004", "pyjh.cline.005"], "prompt": "$\\triangle ABC$ 的内切圆分别与 $BC$、$CA$、$AB$ 相切于点 $D$、$E$、$F$，$AB=7$，$BC=8$，$CA=9$。$BD$ 的长是多少？", "options": [{"id": "a", "text": "$4$", "feedback": "$4$ 是 $AF$（$=AE$）的长。"}, {"id": "b", "text": "$5$", "feedback": "$5$ 是 $CD$（$=CE$）的长。"}, {"id": "c", "text": "$3$", "feedback": "设 $BD=BF=y$，由三条边列方程得 $y=\\frac{7+8-9}{2}$。"}, {"id": "d", "text": "$\\frac72$", "feedback": "切点不一定是边的中点。"}], "correct": "c", "answer": "$3$", "reasoning": ["由切线长定理：$AF=AE=x$，$BF=BD=y$，$CD=CE=z$。", "$x+y=7$，$y+z=8$，$z+x=9$，三式相加得 $x+y+z=12$。", "$y=12-9=3$，即 $BD=3$。"], "contentVersion": "sha256:164467dc9886512aa2bb5ed50f3d6496215f1b0db3dc4f8df77cf86bc8e08bcf"}, {"id": "j30-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j30-1"], "pointIds": ["pyjh.cline.002", "pyjh.circ.008"], "prompt": "$AB$ 是 $\\odot O$ 的直径，点 $C$ 在 $\\odot O$ 上，过点 $C$ 的切线与 $AB$ 的延长线交于点 $D$（$D$ 在 $B$ 的外侧）。$\\angle CAB=25^\\circ$，$\\angle D$ 是多少度？", "options": [{"id": "a", "text": "$50^\\circ$", "feedback": "$50^\\circ$ 是 $\\angle COD$。"}, {"id": "b", "text": "$65^\\circ$", "feedback": "$65^\\circ$ 是 $\\angle ABC$。"}, {"id": "c", "text": "$25^\\circ$", "feedback": "要先由圆周角求圆心角 $\\angle COD$。"}, {"id": "d", "text": "$40^\\circ$", "feedback": "$\\angle COD=2\\times25^\\circ=50^\\circ$，$OC\\perp CD$，$\\angle D=90^\\circ-50^\\circ$。"}], "correct": "d", "answer": "$40^\\circ$", "reasoning": ["连接 $OC$，切线垂直于过切点的半径：$\\angle OCD=90^\\circ$。", "$\\angle COB=2\\angle CAB=50^\\circ$（同弧 $BC$ 所对圆心角是圆周角的 $2$ 倍）。", "$\\angle D=90^\\circ-50^\\circ=40^\\circ$。"], "contentVersion": "sha256:91451743e3c528351f67f0da93487691daf8c6e41ce617cc0886b24325f76bc7"}, {"id": "j30-test-09-v2", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j30-1"], "pointIds": ["pyjh.cline.001", "pyjh.coord.005"], "prompt": "在平面直角坐标系中，$\\odot P$ 的圆心为 $P(2,3)$，半径为 $3$。$\\odot P$ 与 $x$ 轴、$y$ 轴的位置关系分别是什么？", "options": [{"id": "a", "text": "与 $x$ 轴相交，与 $y$ 轴相切", "feedback": "把圆心到两条坐标轴的距离对应反了。"}, {"id": "b", "text": "与两条坐标轴都相切", "feedback": "圆心到 $y$ 轴的距离 $2$ 小于半径。"}, {"id": "c", "text": "与 $x$ 轴相切，与 $y$ 轴相交", "feedback": "到 $x$ 轴距离 $3=r$，到 $y$ 轴距离 $2<r$。"}, {"id": "d", "text": "与 $x$ 轴相切，与 $y$ 轴相离", "feedback": "到 $y$ 轴的距离 $2$ 比半径 $3$ 小，不是相离。"}], "correct": "c", "answer": "与 $x$ 轴相切，与 $y$ 轴相交", "reasoning": ["圆心 $P(2,3)$ 到 $x$ 轴的距离是 $|3|=3$，到 $y$ 轴的距离是 $|2|=2$。", "$3=r$，与 $x$ 轴相切；$2<r$，与 $y$ 轴相交。"], "contentVersion": "sha256:d5ae4ec71a618f41cc0d4bf6e6434ea911f996b15472469b599d3a324601b137"}, {"id": "j30-test-10-v2", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j30-2"], "pointIds": ["pyjh.cline.006", "pyjh.pyth.004"], "prompt": "在 $\\triangle ABC$ 中，$AB=AC=5$，$BC=6$。$\\triangle ABC$ 的内切圆半径是多少？", "options": [{"id": "a", "text": "$2$", "feedback": "内切圆半径与面积、周长之间的数量关系代入或计算有误。"}, {"id": "b", "text": "$\\frac{25}{8}$", "feedback": "$\\frac{25}{8}$ 是外接圆半径。"}, {"id": "c", "text": "$\\frac32$", "feedback": "$S=12$，$S=\\frac12r(5+5+6)$，$r=\\frac{24}{16}$。"}, {"id": "d", "text": "$3$", "feedback": "$3$ 是底边的一半。"}], "correct": "c", "answer": "$\\frac32$", "reasoning": ["底边上的高 $=\\sqrt{5^2-3^2}=4$，面积 $S=\\frac12\\times6\\times4=12$。", "把三角形分成以内心为顶点的三个小三角形：$S=\\frac12r(AB+BC+CA)=8r$。", "$8r=12$，$r=\\frac32$。"], "contentVersion": "sha256:966c1ab6c0bf6c207467c1059a5fc2478b74dad58aa6bf866a6b4cb188327c9a"}, {"id": "j30-test-11-v2", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j30-3"], "pointIds": ["pyjh.cline.009", "pyjh.cline.008"], "prompt": "半径为 $2$ 的圆，它的内接正六边形和内接正方形的面积分别是多少？", "options": [{"id": "a", "text": "$6\\sqrt3$ 与 $16$", "feedback": "内接正方形的对角线与边长混淆了。"}, {"id": "b", "text": "$3\\sqrt3$ 与 $8$", "feedback": "正六边形分割后的面积没有计全。"}, {"id": "c", "text": "$12\\sqrt3$ 与 $4$", "feedback": "正六边形的分割计数和正方形的边长关系均需检查。"}, {"id": "d", "text": "$6\\sqrt3$ 与 $8$", "feedback": "正六边形 $=6\\times\\sqrt3$，正方形对角线 $4$，面积 $8$。"}], "correct": "d", "answer": "正六边形 $6\\sqrt3$，正方形 $8$", "reasoning": ["内接正六边形边长等于半径 $2$，由 $6$ 个边长为 $2$ 的等边三角形组成，面积 $6\\times\\frac{\\sqrt3}{4}\\times4=6\\sqrt3$。", "内接正方形的对角线是直径 $4$，面积 $\\frac12\\times4\\times4=8$。"], "contentVersion": "sha256:ea188612ed0e983cb141b30dfe346868577f7f33fe3e5fac170bca96cc6939d7"}, {"id": "j30-test-12-v2", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j30-2"], "pointIds": ["pyjh.cline.004"], "prompt": "$PA$、$PB$ 分别与 $\\odot O$ 相切于点 $A$、$B$，$PA=8$。点 $C$ 在劣弧 $AB$ 上（不与 $A$、$B$ 重合），过 $C$ 作 $\\odot O$ 的切线，分别交线段 $PA$、$PB$ 的内部于点 $D$、$E$。$\\triangle PDE$ 的周长是多少？", "options": [{"id": "a", "text": "$8$", "feedback": "$8$ 只是 $PA$ 的长；$\\triangle PDE$ 的三条边都要算上，再用切线长定理转化。"}, {"id": "b", "text": "$12$", "feedback": "没有正确利用同一点引出的两条切线长相等来拼接周长。"}, {"id": "c", "text": "$16$", "feedback": "$DC=DA$，$EC=EB$，周长 $=PA+PB=16$。"}, {"id": "d", "text": "$24$", "feedback": "周长不是三条切线长 $PA$ 的和。"}], "correct": "c", "answer": "$16$", "reasoning": ["由题设 $D$、$E$ 分别在线段 $PA$、$PB$ 的内部，且 $C$ 位于线段 $DE$ 上。", "由切线长定理：$PA=PB=8$，$DA=DC$，$EB=EC$。", "$\\triangle PDE$ 的周长 $=PD+DC+CE+PE=PD+DA+EB+PE=PA+PB=16$。"], "contentVersion": "sha256:bda5e0a2d92b48fb75835c9404efd5c672f1cc649dbcfea77c6e3f77d2d90970"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
