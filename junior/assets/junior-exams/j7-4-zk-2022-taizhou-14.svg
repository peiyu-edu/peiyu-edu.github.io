<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 386" width="500" height="386" role="img" aria-labelledby="title desc">
<title id="title">三角形平移示意图</title>
<desc id="desc">△ABC 竖直向上平移得到△A′B′C′，左侧有向上的箭头。BC 在下方水平，B′C′ 在上方水平，BB′、CC′ 为实线竖直段。△ABC 用虚线画，点 A 在四边形 BCC′B′ 内部；△A′B′C′ 的 A′B′、A′C′ 为实线，A′ 在 B′C′ 上方。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="500" height="386" fill="white"/>
<path d="M78 352V172H438V352" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M78 172L310 46L438 172" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M78 352L310 226L438 352Z" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"/>
