<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 10 章 二元一次方程组 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=c412b14433eb"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=9f35dd2cb533"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=960b69da9959"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=2def94435483"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=9e04f871a3b0"></script></head><body data-stage="junior" data-sec="j10-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 10 章 二元一次方程组 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j10-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j10-test", "sectionId": "j10-test", "chapterId": "j10", "title": "第 10 章 二元一次方程组 · 章末测验", "label": "章末测验", "sections": ["j10-1", "j10-2", "j10-3"], "items": [{"id": "j10-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j10-1"], "pointIds": ["pyjh.eq.101"], "prompt": "下列方程中，哪一个是二元一次方程？", "options": [{"id": "a", "text": "$x+y^2=1$", "feedback": "含未知数的项 $y^2$ 的次数是 $2$。"}, {"id": "b", "text": "$xy=3$", "feedback": "含未知数的项 $xy$ 的次数是 $1+1=2$。"}, {"id": "c", "text": "$2x-3y=5$", "feedback": "含两个未知数，含未知数的项的次数都是 $1$，两边都是整式。"}, {"id": "d", "text": "$x+\\frac1y=2$", "feedback": "未知数在分母里，左边不是整式。"}], "correct": "c", "answer": "$2x-3y=5$", "reasoning": ["二元一次方程：含有两个未知数，含未知数的项的次数都是 $1$，并且是整式方程。", "只有 $2x-3y=5$ 满足这三条。"], "contentVersion": "sha256:a6daebd907a85ce78755329db4536322700d87908a64e1b23d1405c11d5ea2bf"}, {"id": "j10-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j10-1"], "pointIds": ["pyjh.eq.102"], "prompt": "下列各组数中，哪一组是方程 $2x+y=7$ 的解？", "options": [{"id": "a", "text": "$x=1$，$y=5$", "feedback": "代入左边得 $2\\times1+5$，与右边比较。"}, {"id": "b", "text": "$x=2$，$y=2$", "feedback": "代入左边得 $6$，不等于 $7$。"}, {"id": "c", "text": "$x=3$，$y=-2$", "feedback": "代入左边得 $4$，不等于 $7$。"}, {"id": "d", "text": "$x=0$，$y=8$", "feedback": "代入左边得 $8$，不等于 $7$。"}], "correct": "a", "answer": "$x=1$，$y=5$", "reasoning": ["使方程两边相等的一对未知数的值是二元一次方程的解，逐组代入检验。", "$2\\times1+5=7$，只有这一组使两边相等。"], "contentVersion": "sha256:e1c1c099655f7a4036397736773341490d6883ddae9e06b49afd0afd33b4126b"}, {"id": "j10-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j10-2"], "pointIds": ["pyjh.eq.106"], "prompt": "用代入法解方程组 $\\begin{cases}y=2x-1\\\\3x+y=9\\end{cases}$，解是哪一项？", "options": [{"id": "a", "text": "$\\begin{cases}x=2\\\\y=3\\end{cases}$", "feedback": "把第一个方程代入第二个，消去 $y$。"}, {"id": "b", "text": "$\\begin{cases}x=3\\\\y=5\\end{cases}$", "feedback": "代入第二个方程检验：$9+5\\ne9$。"}, {"id": "c", "text": "$\\begin{cases}x=\\frac85\\\\y=\\frac{11}5\\end{cases}$", "feedback": "代入时 $2x-1$ 要整体代入，$-1$ 不能变成 $+1$。"}, {"id": "d", "text": "$\\begin{cases}x=2\\\\y=5\\end{cases}$", "feedback": "求出 $x$ 后要代回 $y=2x-1$ 求 $y$。"}], "correct": "a", "answer": "$x=2$，$y=3$", "reasoning": ["把 $y=2x-1$ 代入 $3x+y=9$：$3x+2x-1=9$，$5x=10$，$x=2$。", "代回：$y=2\\times2-1=3$。", "检验：$3\\times2+3=9$。"], "contentVersion": "sha256:8d593ae17227cb2288899059484083d7ca1685123d8ba526e296677c0ff18ffe"}, {"id": "j10-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j10-2"], "pointIds": ["pyjh.eq.108"], "prompt": "解方程组 $\\begin{cases}x+y=7\\\\x-y=1\\end{cases}$，解是哪一项？", "options": [{"id": "a", "text": "$\\begin{cases}x=3\\\\y=4\\end{cases}$", "feedback": "代入 $x-y=1$ 检验：$3-4\\ne1$。"}, {"id": "b", "text": "$\\begin{cases}x=4\\\\y=3\\end{cases}$", "feedback": "两个方程相加可以消去 $y$。"}, {"id": "c", "text": "$\\begin{cases}x=4\\\\y=6\\end{cases}$", "feedback": "求出 $x$ 后代回 $x+y=7$ 求 $y$。"}, {"id": "d", "text": "$\\begin{cases}x=6\\\\y=1\\end{cases}$", "feedback": "这组数满足第一个方程，但不满足第二个。"}], "correct": "b", "answer": "$x=4$，$y=3$", "reasoning": ["两式相加：$2x=8$，$x=4$。", "代入 $x+y=7$：$y=3$。检验 $4-3=1$。"], "contentVersion": "sha256:249171f79d1d28983065afb3915bb8ae2d25e42195a45484f52aa7ed415a2cfb"}, {"id": "j10-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j10-1"], "pointIds": ["pyjh.eq.104", "pyjh.eq.103"], "prompt": "笼子里有鸡和兔共 $30$ 只，脚共 $84$ 只。设鸡有 $x$ 只、兔有 $y$ 只，下列方程组正确的是哪一项？", "options": [{"id": "a", "text": "$\\begin{cases}x+y=30\\\\4x+2y=84\\end{cases}$", "feedback": "鸡有 $2$ 只脚、兔有 $4$ 只脚，系数和未知数对应反了。"}, {"id": "b", "text": "$\\begin{cases}x+y=84\\\\2x+4y=30\\end{cases}$", "feedback": "只数之和是 $30$，脚数之和才是 $84$。"}, {"id": "c", "text": "$\\begin{cases}x+y=30\\\\2x+4y=84\\end{cases}$", "feedback": "一个相等关系来自只数，另一个来自脚数。"}, {"id": "d", "text": "$\\begin{cases}x+y=30\\\\2x+2y=84\\end{cases}$", "feedback": "兔有 $4$ 只脚。"}], "correct": "c", "answer": "$\\begin{cases}x+y=30\\\\2x+4y=84\\end{cases}$", "reasoning": ["只数：鸡的只数 $+$ 兔的只数 $=30$，即 $x+y=30$。", "脚数：$2x+4y=84$。", "解得 $x=18$，$y=12$；检验 $18+12=30$，$36+48=84$。"], "contentVersion": "sha256:92d9012829cb4cb37c79a74d8bb6e28dfd06225252203e773e9d2f3188454be5"}, {"id": "j10-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j10-2"], "pointIds": ["pyjh.eq.109"], "prompt": "解方程组 $\\begin{cases}3x+2y=7\\\\5x-3y=-1\\end{cases}$，解是哪一项？", "options": [{"id": "a", "text": "$\\begin{cases}x=-1\\\\y=5\\end{cases}$", "feedback": "代入第二个方程检验：$-5-15\\ne-1$。"}, {"id": "b", "text": "$\\begin{cases}x=2\\\\y=\\frac12\\end{cases}$", "feedback": "这组数满足第一个方程，但不满足第二个。"}, {"id": "c", "text": "$\\begin{cases}x=1\\\\y=-2\\end{cases}$", "feedback": "代入第一个方程检验：$3-4\\ne7$。"}, {"id": "d", "text": "$\\begin{cases}x=1\\\\y=2\\end{cases}$", "feedback": "先把两个方程分别乘适当的数，使 $y$ 的系数互为相反数，再相加。"}], "correct": "d", "answer": "$x=1$，$y=2$", "reasoning": ["第一个方程乘 $3$：$9x+6y=21$；第二个方程乘 $2$：$10x-6y=-2$。", "相加：$19x=19$，$x=1$；代入 $3x+2y=7$，$y=2$。", "检验：$5\\times1-3\\times2=-1$。"], "contentVersion": "sha256:3a33479828f5c22ea2f88647be338feee013c3bb49e2166002e326c6797c4a6d"}, {"id": "j10-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j10-2"], "pointIds": ["pyjh.eq.111"], "prompt": "已知 $\\begin{cases}x=2\\\\y=1\\end{cases}$ 是方程组 $\\begin{cases}ax+by=7\\\\bx-ay=-1\\end{cases}$ 的解，则 $a$，$b$ 的值分别是多少？", "options": [{"id": "a", "text": "$a=1$，$b=3$", "feedback": "代入后得到关于 $a$，$b$ 的方程组，检验第二个方程：$6-1\\ne-1$。"}, {"id": "b", "text": "$a=3$，$b=1$", "feedback": "把 $x=2$，$y=1$ 代入，得到关于 $a$，$b$ 的二元一次方程组。"}, {"id": "c", "text": "$a=-3$，$b=1$", "feedback": "代入第一个方程检验：$-6+1\\ne7$。"}, {"id": "d", "text": "$a=2$，$b=3$", "feedback": "代入第一个方程检验：$4+3=7$ 成立，但第二个方程不成立。"}], "correct": "b", "answer": "$a=3$，$b=1$", "reasoning": ["代入得 $\\begin{cases}2a+b=7\\\\2b-a=-1\\end{cases}$。", "由第一个方程 $b=7-2a$，代入第二个：$14-4a-a=-1$，$a=3$，$b=1$。"], "contentVersion": "sha256:4d4fd47fe9c9be86a61136f42d6fce5f7ef17ca3f87e61954fd50f9cc89ea269"}, {"id": "j10-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j10-2"], "pointIds": ["pyjh.eq.110", "pyjh.eq.108"], "prompt": "解方程组 $\\begin{cases}\\frac x2+\\frac y3=3\\\\3x-2y=6\\end{cases}$，解是哪一项？", "options": [{"id": "a", "text": "$\\begin{cases}x=4\\\\y=3\\end{cases}$", "feedback": "先把第一个方程去分母，化成整数系数，再选择消元方法。"}, {"id": "b", "text": "$\\begin{cases}x=3\\\\y=4\\end{cases}$", "feedback": "代入 $3x-2y=6$ 检验：$9-8\\ne6$。"}, {"id": "c", "text": "$\\begin{cases}x=2\\\\y=0\\end{cases}$", "feedback": "这组数满足第二个方程，但不满足第一个。"}, {"id": "d", "text": "$\\begin{cases}x=6\\\\y=0\\end{cases}$", "feedback": "这组数满足第一个方程，但不满足第二个。"}], "correct": "a", "answer": "$x=4$，$y=3$", "reasoning": ["第一个方程两边乘 $6$：$3x+2y=18$。", "与 $3x-2y=6$ 相加：$6x=24$，$x=4$；代入得 $y=3$。", "检验：$\\frac42+\\frac33=3$，$12-6=6$。"], "contentVersion": "sha256:f0b9336e28a36ad091cc14bd8b31c0def734ada3a5be27b882a7813658f46fee"}, {"id": "j10-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j10-3"], "pointIds": ["pyjh.eq.114", "pyjh.eq.112"], "prompt": "甲、乙两人相距 $30$ 千米。若两人同时出发相向而行，$2$ 小时相遇；若两人同时同向而行（甲在后追乙），$6$ 小时甲追上乙。甲、乙的速度分别是每小时多少千米？", "options": [{"id": "a", "text": "甲 $5$，乙 $10$", "feedback": "甲能追上乙，甲的速度应比乙快。"}, {"id": "b", "text": "甲 $9$，乙 $6$", "feedback": "代入追及关系检验：$6\\times(9-6)=18\\ne30$。"}, {"id": "c", "text": "甲 $10$，乙 $5$", "feedback": "相向：路程和等于 $30$；追及：路程差等于 $30$。"}, {"id": "d", "text": "甲 $12$，乙 $3$", "feedback": "代入相遇关系检验：$2\\times(12+3)=30$ 成立，但追及关系不成立。"}], "correct": "c", "answer": "甲每小时 $10$ 千米，乙每小时 $5$ 千米", "reasoning": ["设甲每小时 $x$ 千米，乙每小时 $y$ 千米。", "相向：$2(x+y)=30$；追及：$6(x-y)=30$。", "即 $x+y=15$，$x-y=5$，解得 $x=10$，$y=5$。"], "contentVersion": "sha256:938af2e53f900d37396c1a64263940a3f13e5eb1a871df0616d4d865e64bc89e"}, {"id": "j10-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j10-3"], "pointIds": ["pyjh.eq.112", "pyjh.eq.113"], "prompt": "买 $3$ 件 $A$ 种奖品和 $2$ 件 $B$ 种奖品共需 $60$ 元；买 $5$ 件 $A$ 种奖品和 $4$ 件 $B$ 种奖品共需 $106$ 元。$A$，$B$ 两种奖品的单价分别是多少元？", "options": [{"id": "a", "text": "$A$ 种 $14$ 元，$B$ 种 $9$ 元", "feedback": "设两种单价，由两次购买分别列出相等关系。"}, {"id": "b", "text": "$A$ 种 $9$ 元，$B$ 种 $14$ 元", "feedback": "代入第一次购买检验：$27+28\\ne60$。"}, {"id": "c", "text": "$A$ 种 $12$ 元，$B$ 种 $12$ 元", "feedback": "代入第二次购买检验：$60+48\\ne106$。"}, {"id": "d", "text": "$A$ 种 $16$ 元，$B$ 种 $6$ 元", "feedback": "满足第一次购买，但第二次是 $80+24=104\\ne106$。"}], "correct": "a", "answer": "$A$ 种每件 $14$ 元，$B$ 种每件 $9$ 元", "reasoning": ["设 $A$ 种每件 $x$ 元，$B$ 种每件 $y$ 元：$\\begin{cases}3x+2y=60\\\\5x+4y=106\\end{cases}$。", "第一个方程乘 $2$ 得 $6x+4y=120$，减去第二个方程：$x=14$，代入得 $y=9$。", "检验：$42+18=60$，$70+36=106$。"], "contentVersion": "sha256:2ae9f58d66a43aa5c40d331296675ff4a828753ffa736a8154f7e0ba2dc9dc57"}, {"id": "j10-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j10-1", "j10-3"], "pointIds": ["pyjh.eq.117", "pyjh.eq.102"], "prompt": "用 $20$ 元钱买单价 $2$ 元和 $3$ 元的两种笔，钱恰好用完，并且两种笔都要买。一共有几种购买方案？", "options": [{"id": "a", "text": "$2$ 种", "feedback": "把 $y$ 的可能取值都试一遍，不要漏掉。"}, {"id": "b", "text": "$3$ 种", "feedback": "列出 $2x+3y=20$，在正整数范围内找出所有解。"}, {"id": "c", "text": "$4$ 种", "feedback": "两种笔都要买，$x$，$y$ 都不能为 $0$。"}, {"id": "d", "text": "$6$ 种", "feedback": "$20-3y$ 必须是正偶数，$y$ 只能取部分值。"}], "correct": "b", "answer": "$3$ 种", "reasoning": ["设买 $2$ 元的笔 $x$ 支、$3$ 元的笔 $y$ 支，$2x+3y=20$，$x$，$y$ 都是正整数。", "$x=\\frac{20-3y}2$，$y$ 要使 $20-3y$ 是正偶数：$y=2$ 时 $x=7$；$y=4$ 时 $x=4$；$y=6$ 时 $x=1$。", "共 $3$ 种方案。"], "contentVersion": "sha256:6a577e5380f09d1615a159875be67c84b5e62447e26ba91e35f66c6eeefd710c"}, {"id": "j10-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j10-3"], "pointIds": ["pyjh.eq.115", "pyjh.eq.116", "pyjh.eq.112"], "prompt": "木工组有 $27$ 名工人做桌子，每人每天可以做桌面 $3$ 个或桌腿 $6$ 条，一个桌面配 $4$ 条桌腿。为使每天做的桌面和桌腿恰好配套，应安排多少人做桌面、多少人做桌腿？", "options": [{"id": "a", "text": "做桌面 $18$ 人，做桌腿 $9$ 人", "feedback": "代入检验：桌面 $54$ 个需桌腿 $216$ 条，只做出 $54$ 条。"}, {"id": "b", "text": "做桌面 $9$ 人，做桌腿 $18$ 人", "feedback": "人数和为 $27$；桌腿条数是桌面个数的 $4$ 倍。"}, {"id": "c", "text": "做桌面 $13.5$ 人，做桌腿 $13.5$ 人", "feedback": "人数必须是整数；配套关系也不是人数相等。"}, {"id": "d", "text": "做桌面 $3$ 人，做桌腿 $24$ 人", "feedback": "代入检验：桌面 $9$ 个只需桌腿 $36$ 条，桌腿做多了。"}], "correct": "b", "answer": "做桌面 $9$ 人，做桌腿 $18$ 人", "reasoning": ["设 $x$ 人做桌面，$y$ 人做桌腿：$x+y=27$；配套要求桌腿条数 $=4\\times$桌面个数，即 $6y=4\\times3x$。", "由 $6y=12x$ 得 $y=2x$，代入得 $3x=27$，$x=9$，$y=18$。", "检验：桌面 $27$ 个，桌腿 $108$ 条，$108=4\\times27$；人数是正整数，符合实际。"], "contentVersion": "sha256:23b42e89e09c760a95459097beae0e5d05443247e266299883d62450c758885f"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
