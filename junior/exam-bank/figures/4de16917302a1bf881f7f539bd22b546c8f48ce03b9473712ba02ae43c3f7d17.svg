<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 360" role="img"><title>广东第2题图</title><desc>四个图形依次为：A为直角三角形，B为等腰梯形，C为长方形，D为正五边形。</desc><style>:root{color:#173b40}@media(prefers-color-scheme:dark){:root{color:#e5eeeb}}line,path,polygon,polyline,circle,rect{stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:"Times New Roman","Songti SC",serif}</style><polygon points="60,155 130,155 130,50" fill="none"/><polygon points="210,155 310,155 280,85 240,85" fill="none"/><polygon points="60,265 170,265 170,320 60,320" fill="none"/><polygon points="260,245 303,276 286,326 234,326 217,276" fill="none"/><text x="25" y="110" font-size="20">A</text><text x="180" y="110" font-size="20">B</text><text x="25" y="295" font-size="20">C</text><text x="180" y="295" font-size="20">D</text></svg>
