<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 470" role="img" aria-labelledby="title desc"><title id="title">原题三视图的结构重绘</title><desc id="desc">正视图为带一条实横线的矩形；侧视图上边从高端斜降再接低水平段；俯视图为带一条横向分界线的矩形。均无尺寸或中点标记。</desc><rect width="500" height="470" rx="16" fill="#f7fafb"/>
<polygon points="45.00,30.00 215.00,30.00 215.00,180.00 45.00,180.00" fill="#fff" stroke="#3b5262" stroke-width="2.7" stroke-linejoin="round"/>
<line x1="45.00" y1="118.00" x2="215.00" y2="118.00" stroke="#3b5262" stroke-width="2.7"/>
<text x="130" y="220" font-family="sans-serif" font-size="30" fill="#263b48" text-anchor="middle">正视图</text>
<polygon points="280.00,30.00 370.00,118.00 430.00,118.00 430.00,180.00 280.00,180.00" fill="#fff" stroke="#3b5262" stroke-width="2.7" stroke-linejoin="round"/>
<text x="355" y="220" font-family="sans-serif" font-size="30" fill="#263b48" text-anchor="middle">侧视图</text>
<polygon points="45.00,270.00 215.00,270.00 215.00,420.00 45.00,420.00" fill="#fff" stroke="#3b5262" stroke-width="2.7" stroke-linejoin="round"/>
<line x1="45.00" y1="360.00" x2="215.00" y2="360.00" stroke="#3b5262" stroke-width="2.7"/>
<text x="130" y="456" font-family="sans-serif" font-size="30" fill="#263b48" text-anchor="middle">俯视图</text>
</svg>
