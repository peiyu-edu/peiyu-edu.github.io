<svg xmlns="http://www.w3.org/2000/svg" width="500" height="520" viewBox="0 0 500 520" role="img" aria-labelledby="title desc">
  <title id="title">多面体的三视图与候选对应点</title>
  <desc id="desc">按同期归档原图重绘。左上是正视图，轮廓有两处错层；左下是俯视图；右上是侧视图。M在正视图上凹角，N在俯视图内分界线的上端。侧图上横EF为虚线，下横GH为实线。</desc>
  <rect width="500" height="520" rx="12" fill="#fff"/>
  <g fill="none" stroke="#253b47" stroke-width="3" stroke-linejoin="miter">
    <path id="front-outline" d="M 25 50 H 157 V 104 H 277 V 260 H 157 V 206 H 25 Z"/>
    <path id="side-outline" d="M 349 50 H 475 V 260 H 349 Z"/>
    <path id="side-ef" d="M 349 104 H 475" stroke-dasharray="8 6"/>
    <path id="side-gh" d="M 349 206 H 475"/>
    <path id="plan-outline" d="M 25 330 H 277 V 456 H 25 Z"/>
    <path id="plan-divider" d="M 157 330 V 456"/>
  </g>
  <g fill="#253b47" font-family="Georgia,'Times New Roman',serif" font-size="30" font-style="italic">
    <text x="142" y="137" text-anchor="end">M</text>
    <text x="142" y="365" text-anchor="end">N</text>
    <text x="364" y="137">E</text><text x="460" y="137" text-anchor="end">F</text>
    <text x="364" y="196">G</text><text x="460" y="196" text-anchor="end">H</text>
  </g>
  <g fill="#4d6470" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="151" y="303" text-anchor="middle">正视图</text>
    <text x="412" y="303" text-anchor="middle">侧视图</text>
    <text x="151" y="502" text-anchor="middle">俯视图</text>
  </g>
</svg>
