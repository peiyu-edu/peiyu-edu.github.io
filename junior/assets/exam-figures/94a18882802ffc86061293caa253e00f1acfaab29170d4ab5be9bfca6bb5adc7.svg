<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 274" width="360" height="274" role="img" aria-labelledby="title desc">
<title id="title">正方体展开图</title>
<desc id="desc">正方体展开图，共三行。第一行只有最左一格“建”；第二行从左到右四格“设、人、才、强”，“设”在“建”正下方；第三行只有最右一格“国”，在“强”正下方。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="360" height="274" fill="white"/>
<rect x="8" y="8" width="86" height="86" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="51.0" y="66.0" class="z" text-anchor="middle" font-size="42">建</text>
<rect x="8" y="94" width="86" height="86" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="51.0" y="152.0" class="z" text-anchor="middle" font-size="42">设</text>
<rect x="94" y="94" width="86" height="86" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="137.0" y="152.0" class="z" text-anchor="middle" font-size="42">人</text>
<rect x="180" y="94" width="86" height="86" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="223.0" y="152.0" class="z" text-anchor="middle" font-size="42">才</text>
<rect x="266" y="94" width="86" height="86" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="309.0" y="152.0" class="z" text-anchor="middle" font-size="42">强</text>
<rect x="266" y="180" width="86" height="86" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="309.0" y="238.0" class="z" text-anchor="middle" font-size="42">国</text>
</svg>
