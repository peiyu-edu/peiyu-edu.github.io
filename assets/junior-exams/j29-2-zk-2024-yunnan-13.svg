<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 375" width="340" height="375" role="img" aria-labelledby="title desc">
<title id="title">圆 O 与直径 CD、线段 OA、弦 DB</title>
<desc id="desc">圆心为 O 的圆，直径 CD 竖直，D 在上、C 在下。圆上的点 A 在直径左侧、点 B 在直径右侧，都在圆的下半部。图中画出线段 OA 和弦 DB。</desc>
<style>text{fill:#17202a;font-size:30px}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic}.r{font-family:Georgia,'Times New Roman',serif}.z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px}line,path,polyline,polygon,circle,rect,ellipse{stroke-linejoin:round}</style>
<rect width="340" height="375" fill="white"/>
<circle cx="170" cy="195" r="140" fill="none" stroke="#17202a" stroke-width="2.5"/>
<line x1="170.0" y1="55.0" x2="170.0" y2="335.0" stroke="#17202a" stroke-width="2.5"/>
<line x1="170.0" y1="195.0" x2="87.7" y2="308.3" stroke="#17202a" stroke-width="2.5"/>
<line x1="170.0" y1="55.0" x2="252.3" y2="308.3" stroke="#17202a" stroke-width="2.5"/>
<circle cx="170" cy="195" r="5" fill="#17202a"/>
<text class="m" x="170.0" y="47.0" text-anchor="middle">D</text>
<text class="m" x="170.0" y="365.0" text-anchor="middle">C</text>
<text class="m" x="148.0" y="197.0" text-anchor="middle">O</text>
<text class="m" x="79.7" y="334.3" text-anchor="middle">A</text>
<text class="m" x="262.3" y="334.3" text-anchor="middle">B</text>
</svg>
