<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年级上册 第五单元 百分数 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p6a-u5-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>六年级上册 第五单元 百分数 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p6a-u5-test", "sectionId": "p6a-u5-test", "unitId": "p6a-u5", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "六年级上册 第五单元 百分数 单元测评", "items": [{"id": "p6a-u5-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪句话里的百分数用得对？", "answer": "六年级近视的人数占全年级人数的 30%", "reasoning": ["百分数表示一个数是另一个数的百分之几，后面不带单位。", "只有「占全年级人数的 30%」是两个数比较的关系。"], "options": [{"id": "a", "text": "小明的身高是 150%", "feedback": "身高是一个具体的量，要用「厘米」这样的单位，不能用百分数。"}, {"id": "b", "text": "一根绳子长 45% 米", "feedback": "百分数表示两个数的关系，后面不能带单位「米」。"}, {"id": "c", "text": "六年级近视的人数占全年级人数的 30%", "feedback": "对。表示近视人数是全年级人数的百分之三十。"}], "correct": "c", "pointIds": ["pyps.p6a.u5.001"], "contentVersion": "sha256:a589bab17840215ef5aab158f29fcb9530c0abadc33e17093a568b4330084933"}, {"id": "p6a-u5-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "0.35 = □%；3/4 = □%；120% 化成小数是 □。", "answer": "35%；75%；1.2", "reasoning": ["小数化百分数：小数点向右移动两位，添上 %，0.35 = 35%。", "3/4 = 0.75 = 75%。", "百分数化小数：去掉 %，小数点向左移动两位，120% = 1.2。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u5.005", "pyps.p6a.u5.002"], "contentVersion": "sha256:cb3256f279dd834c664f8a8544b6d6ba1904d70341bd2e3ac425e7637d444653"}, {"id": "p6a-u5-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "六（1）班有 50 人，今天到校 48 人。今天的出勤率是多少？", "answer": "48 ÷ 50 × 100% = 96%", "reasoning": ["出勤率 = 出勤人数 ÷ 总人数 × 100%。", "48 ÷ 50 = 0.96 = 96%。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u5.003"], "contentVersion": "sha256:fee34e8532d0649fea68feae642c12f4ee76fad0e959a49b280194d5e699e133"}, {"id": "p6a-u5-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪个百分率可能超过 100%？", "answer": "今年的产量是去年产量的百分之几", "reasoning": ["部分量不会超过总量，出勤率、发芽率最多是 100%。", "今年的产量可以比去年多，这时就超过 100%。"], "options": [{"id": "a", "text": "全班的出勤率", "feedback": "出勤的人不会比全班人数还多，最多 100%。"}, {"id": "b", "text": "今年的产量是去年产量的百分之几", "feedback": "对。今年比去年多时，今年的产量就超过去年的 100%。"}, {"id": "c", "text": "种子的发芽率", "feedback": "发芽的种子不会比种下的还多，最多 100%。"}], "correct": "b", "pointIds": ["pyps.p6a.u5.004"], "contentVersion": "sha256:45b48e7de9ef35b71dafa6cfdc4d141e8a2f470471ad85815429612e972b9866"}, {"id": "p6a-u5-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一本书有 240 页，小芳已经看了 35%。她看了多少页？", "answer": "240 × 35% = 84（页）", "reasoning": ["求 240 的 35% 是多少，用乘法。", "240 × 35% = 240 × 0.35 = 84（页）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u5.006"], "contentVersion": "sha256:6fc42f2522cce50e41cc4130e18fc97190ff4bcb2e84b806daccc69ec7200c88"}, {"id": "p6a-u5-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一件衣服原价 300 元，打八五折出售。现价是多少元？", "answer": "255 元", "reasoning": ["八五折就是按原价的 85% 出售。", "300 × 85% = 255（元）。"], "options": [{"id": "a", "text": "45 元", "feedback": "这是便宜的钱：300 − 255 = 45（元），不是现价。"}, {"id": "b", "text": "255 元", "feedback": "对。八五折是 85%，300 × 85% = 255（元）。"}, {"id": "c", "text": "215 元", "feedback": "八五折不是减去 85 元，是按原价的 85% 卖。"}], "correct": "b", "pointIds": ["pyps.p6a.u5.007"], "contentVersion": "sha256:742d96260b6d5b589cc6d0f6b76e82e67a1f33570ae2065fb55a16ca44d08c0e"}, {"id": "p6a-u5-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "王阿姨把 5000 元存入银行，存期 2 年，年利率是 2.10%。到期时可以得到利息多少元？", "answer": "5000 × 2.10% × 2 = 210（元）", "reasoning": ["利息 = 本金 × 利率 × 存期。", "5000 × 2.10% = 105（元），这是一年的利息。", "105 × 2 = 210（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u5.008"], "contentVersion": "sha256:5d7c76fab5f9b5e4f5c07d94859cebc80290fdd8510597bce35090c141c3d94a"}, {"id": "p6a-u5-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "学校去年植树 400 棵，今年植树 500 棵。今年比去年多植树百分之几？", "answer": "（500 − 400）÷ 400 × 100% = 25%", "reasoning": ["和去年比，去年是单位「1」。", "多植了 500 − 400 = 100（棵）。", "100 ÷ 400 = 0.25 = 25%。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u5.009"], "contentVersion": "sha256:6e49ddde15a686232b57a298ea990b1cb990bf196adc74fb98ba3580aed6cfb9"}, {"id": "p6a-u5-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一台电脑降价 20% 后，现价是 4000 元。这台电脑原价是多少元？", "answer": "4000 ÷（1 − 20%）= 5000（元）", "reasoning": ["原价是单位「1」，还不知道。", "降价 20% 后，现价是原价的 1 − 20% = 80%。", "4000 ÷ 80% = 5000（元）。检验：5000 × 80% = 4000，对。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u5.010"], "contentVersion": "sha256:17aa2e412ce88f11cc0acd4342952bce3f4980dc070d9c9b984795c08c2de2e7"}, {"id": "p6a-u5-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一件商品先提价 10%，再降价 10%。现在的价格和原价比，怎么样？", "answer": "比原价低了", "reasoning": ["把原价看成 1。提价 10% 后是 1 × 110% = 1.1。", "再降价 10%，以 1.1 为单位「1」：1.1 × 90% = 0.99。", "0.99 < 1，现价比原价低了 1%。"], "options": [{"id": "a", "text": "和原价一样", "feedback": "两次的 10% 不是同一个单位「1」。降价时以提价后的价格为单位「1」，降的钱更多。"}, {"id": "b", "text": "比原价高了", "feedback": "第二次降的 10% 是按提价后更高的价格算的，降掉的钱比提价时加的钱多。"}, {"id": "c", "text": "比原价低了", "feedback": "对。第二次以提价后的价格为单位「1」，降得比提的多：现价是原价的 110% × 90% = 99%。"}], "correct": "c", "pointIds": ["pyps.p6a.u5.011"], "contentVersion": "sha256:ce67642cd7b52bf1e880b476872e94f636c6bee4dac75814bab3b3ff05214c63"}, {"id": "p6a-u5-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "六（2）班 40 人参加跳绳测试，成绩分段人数是：90 分及以上 8 人，80～89 分 14 人，70～79 分 12 人，70 分以下 6 人。老师想让至少 50% 的同学达标，达标线只能从 70 分、80 分、90 分中选一个，最高可以选多少分？", "answer": "80 分", "reasoning": ["至少要有 40 × 50% = 20（人）达标。", "定在 90 分：只有 8 人达标，不到 20 人。", "定在 80 分：达标的是 80 分及以上各段之和，8 + 14 = 22（人），够 20 人。", "70 分时有 8 + 14 + 12 = 34（人）达标，也符合要求；在给定的三条候选线中，最高可选 80 分。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u5.012", "pyps.p6a.u5.006"], "contentVersion": "sha256:128a0c77188f7eeac966c84fc5ef37be57fd1090682a2144786ba9f54b93c59c", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 175\" role=\"img\" aria-label=\"题干给出的成绩统计表，不增列达标人数\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><rect x=\"20\" y=\"15\" width=\"240\" height=\"36\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M185,15 L185,51\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><text x=\"100\" y=\"39\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">90 分及以上<\/text><text x=\"221\" y=\"39\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">8 人<\/text><rect x=\"20\" y=\"51\" width=\"240\" height=\"36\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M185,51 L185,87\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><text x=\"100\" y=\"75\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">80～89 分<\/text><text x=\"221\" y=\"75\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">14 人<\/text><rect x=\"20\" y=\"87\" width=\"240\" height=\"36\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M185,87 L185,123\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><text x=\"100\" y=\"111\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">70～79 分<\/text><text x=\"221\" y=\"111\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">12 人<\/text><rect x=\"20\" y=\"123\" width=\"240\" height=\"36\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M185,123 L185,159\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><text x=\"100\" y=\"147\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">70 分以下<\/text><text x=\"221\" y=\"147\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">6 人<\/text><\/svg>"}], "contentVersion": "sha256:1dda9deb0446447522f3b1fcb7c8fa739262d95ddeeb51ea5fb97e8058bf3140"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
