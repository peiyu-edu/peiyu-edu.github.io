<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 23 章 一次函数 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="junior" data-sec="j23-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 23 章 一次函数 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j23-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j23-test", "sectionId": "j23-test", "chapterId": "j23", "title": "第 23 章 一次函数 · 章末测验", "label": "章末测验", "sections": ["j23-1", "j23-2", "j23-3", "j23-4"], "items": [{"id": "j23-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j23-1"], "pointIds": ["pyjh.lin.001", "pyjh.lin.002"], "prompt": "下列函数中，是一次函数但不是正比例函数的是哪一个？", "options": [{"id": "a", "text": "$y=-\\frac{x}{2}$", "feedback": "它是 $y=kx$ 的形式，$k=-\\frac12$，是正比例函数。"}, {"id": "b", "text": "$y=\\frac2x$", "feedback": "自变量在分母上，不是 $y=kx+b$ 的形式，不是一次函数。"}, {"id": "c", "text": "$y=2(x-1)+2$", "feedback": "先整理：$2(x-1)+2=2x$，常数项为 $0$，是正比例函数。"}, {"id": "d", "text": "$y=3-x$", "feedback": "整理成 $y=-x+3$，$k=-1\\ne0$，$b=3\\ne0$，是一次函数而不是正比例函数。"}], "correct": "d", "answer": "$y=3-x$", "reasoning": ["形如 $y=kx+b$（$k\\ne0$）是一次函数，其中 $b=0$ 时是正比例函数。", "$y=2(x-1)+2$ 整理后是 $y=2x$；$y=-\\frac x2$ 也是正比例函数；$y=\\frac2x$ 不是一次函数。", "$y=3-x=-x+3$，$b=3\\ne0$，是一次函数但不是正比例函数。"], "contentVersion": "sha256:82998868d7316eb4420a95d6f842a000aec59d5e8e700db75596e56ed7aac4f9"}, {"id": "j23-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j23-1"], "pointIds": ["pyjh.lin.004"], "prompt": "若函数 $y=(m-2)x+m^2-4$ 是正比例函数，则 $m$ 的值是多少？", "options": [{"id": "a", "text": "$m=2$", "feedback": "$m=2$ 时 $x$ 的系数 $m-2=0$，函数变成 $y=0$，不是正比例函数。"}, {"id": "b", "text": "$m=-2$", "feedback": "常数项 $m^2-4=0$ 且系数 $m-2=-4\\ne0$，两个条件同时满足。"}, {"id": "c", "text": "$m=\\pm2$", "feedback": "只解了常数项为 $0$，还要检验 $x$ 的系数不为 $0$。"}, {"id": "d", "text": "$m=0$", "feedback": "$m=0$ 时 $y=-2x-4$，常数项不为 $0$，不是正比例函数。"}], "correct": "b", "answer": "$m=-2$", "reasoning": ["正比例函数要求常数项为 $0$ 且 $x$ 的系数不为 $0$。", "$m^2-4=0$，得 $m=2$ 或 $m=-2$；又 $m-2\\ne0$，所以 $m\\ne2$。", "因此 $m=-2$，此时 $y=-4x$。"], "contentVersion": "sha256:f452c5dc3f6523fc12e9cc414759f9d3bc90598fef6690c32bd16ae170d34793"}, {"id": "j23-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j23-2"], "pointIds": ["pyjh.lin.008"], "prompt": "一次函数 $y=-3x+2$ 的图象经过哪些象限？", "options": [{"id": "a", "text": "第一、三、四象限", "feedback": "$k=-3<0$，直线从左向右下降，不会同时经过第一、三象限。"}, {"id": "b", "text": "第二、三、四象限", "feedback": "直线与 $y$ 轴交于 $(0,2)$，在 $x$ 轴上方，再看 $b$ 的符号。"}, {"id": "c", "text": "第一、二、四象限", "feedback": "$k<0$ 直线下降，又与 $y$ 轴交于正半轴 $(0,2)$，所以经过这三个象限。"}, {"id": "d", "text": "第一、二、三象限", "feedback": "这是 $k>0$、$b>0$ 时的情形，这里 $k=-3$ 为负。"}], "correct": "c", "answer": "第一、二、四象限", "reasoning": ["$k=-3<0$，直线从左向右下降。", "$b=2>0$，直线与 $y$ 轴交于正半轴上的点 $(0,2)$。", "画草图可知直线经过第一、二、四象限。"], "contentVersion": "sha256:1a61aec574b31510c2d7c238a7216de64b023166d2ea76b114531cc171917eb1"}, {"id": "j23-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j23-2"], "pointIds": ["pyjh.lin.010"], "prompt": "直线 $y=2x-6$ 与 $x$ 轴的交点坐标是什么？", "options": [{"id": "a", "text": "$(0,-6)$", "feedback": "这是令 $x=0$ 得到的与 $y$ 轴的交点。"}, {"id": "b", "text": "$(-3,0)$", "feedback": "解 $2x-6=0$ 时移项符号出错。"}, {"id": "c", "text": "$(3,0)$", "feedback": "与 $x$ 轴的交点纵坐标为 $0$：令 $y=0$，解 $2x-6=0$。"}, {"id": "d", "text": "$(0,3)$", "feedback": "与 $x$ 轴的交点在 $x$ 轴上，纵坐标应为 $0$，横、纵坐标写反了。"}], "correct": "c", "answer": "$(3,0)$", "reasoning": ["与 $x$ 轴的交点纵坐标为 $0$，令 $y=0$。", "$2x-6=0$，$x=3$，交点为 $(3,0)$。"], "contentVersion": "sha256:ef7ebecd061693a9cc0f17ceb34c10d645e0dccf8651bfd71bab891899684675"}, {"id": "j23-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j23-3"], "pointIds": ["pyjh.lin.014", "pyjh.lin.013"], "prompt": "一次函数 $y=kx+b$ 的图象与 $x$ 轴交于点 $(2,0)$，且 $y$ 随 $x$ 的增大而减小。关于 $x$ 的不等式 $kx+b>0$ 的解集是什么？", "options": [{"id": "a", "text": "$x>2$", "feedback": "$y$ 随 $x$ 增大而减小，交点右边的部分在 $x$ 轴下方。"}, {"id": "b", "text": "$x<2$", "feedback": "直线下降，交点 $(2,0)$ 左边的部分在 $x$ 轴上方，函数值大于 $0$。"}, {"id": "c", "text": "$x\\le2$", "feedback": "$x=2$ 时函数值等于 $0$，不满足严格不等号 $>0$。"}, {"id": "d", "text": "$x>0$", "feedback": "分界点是直线与 $x$ 轴交点的横坐标 $2$，不是 $0$。"}], "correct": "b", "answer": "$x<2$", "reasoning": ["$kx+b>0$ 的解集，就是直线在 $x$ 轴上方部分的点的横坐标的范围。", "直线下降并过 $(2,0)$，在 $x<2$ 时位于 $x$ 轴上方。", "不等号是严格的，不含分界点，解集为 $x<2$。"], "contentVersion": "sha256:412470fd19d867412a17023bfa1402bd79cd0d37a62fcdf8b3482c0e525dd2a8"}, {"id": "j23-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j23-1"], "pointIds": ["pyjh.lin.003"], "prompt": "已知 $y-1$ 与 $x+2$ 成正比例，且 $x=1$ 时 $y=7$。当 $x=-3$ 时，$y$ 的值是多少？", "options": [{"id": "a", "text": "$-\\frac73$", "feedback": "设成了 $y=k(x+2)$，与 $x+2$ 成正比例的是 $y-1$，不是 $y$。"}, {"id": "b", "text": "$-1$", "feedback": "设 $y-1=k(x+2)$，由 $6=3k$ 得 $k=2$，再代入 $x=-3$。"}, {"id": "c", "text": "$-17$", "feedback": "是 $y-1$ 与 $x+2$ 成正比例，不是与 $x$ 成正比例。"}, {"id": "d", "text": "$-2$", "feedback": "求出了 $y-1$ 的值，还要再加 $1$。"}], "correct": "b", "answer": "$-1$", "reasoning": ["设 $y-1=k(x+2)$（$k\\ne0$），代入 $x=1$、$y=7$：$6=3k$，$k=2$。", "所以 $y=2(x+2)+1=2x+5$。", "当 $x=-3$ 时，$y=-6+5=-1$。"], "contentVersion": "sha256:9c558a03d032addb0055e52dd43d00d84c83480a8557d65ae5f0b3b98364dfe4"}, {"id": "j23-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j23-2"], "pointIds": ["pyjh.lin.009", "pyjh.lin.008"], "prompt": "点 $A(-1,y_1)$、$B(2,y_2)$ 都在直线 $y=-(m^2+1)x+3$ 上，其中 $m$ 是常数。$y_1$ 与 $y_2$ 的大小关系是什么？", "options": [{"id": "a", "text": "$y_1>y_2$", "feedback": "$k=-(m^2+1)<0$，$y$ 随 $x$ 增大而减小，而 $-1<2$。"}, {"id": "b", "text": "$y_1<y_2$", "feedback": "横坐标大的点纵坐标不一定大，要先看 $k$ 的符号。"}, {"id": "c", "text": "$y_1=y_2$", "feedback": "$k\\ne0$，横坐标不同的两点纵坐标不会相等。"}, {"id": "d", "text": "无法确定，与 $m$ 的值有关", "feedback": "$m^2+1$ 总是正数，$k$ 的符号是确定的。"}], "correct": "a", "answer": "$y_1>y_2$", "reasoning": ["$m^2\\ge0$，所以 $m^2+1>0$，$k=-(m^2+1)<0$。", "$k<0$ 时 $y$ 随 $x$ 的增大而减小。", "$-1<2$，所以 $y_1>y_2$。"], "contentVersion": "sha256:5f1574f426f8e69015c5265d2037dc09e0ca864edd6efa330bc2725bfce42756"}, {"id": "j23-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j23-2"], "pointIds": ["pyjh.lin.007", "pyjh.lin.006"], "prompt": "把直线 $y=2x-1$ 向上平移 $3$ 个单位长度后，得到的直线经过点 $(m,6)$，$m$ 的值是多少？", "options": [{"id": "a", "text": "$5$", "feedback": "向上平移要在常数项上加 $3$，不是减 $3$。"}, {"id": "b", "text": "$\\frac12$", "feedback": "上下平移改变的是常数项，不是把 $x$ 换成 $x+3$。"}, {"id": "c", "text": "$\\frac72$", "feedback": "代入的是平移前的直线，要先写出平移后的解析式。"}, {"id": "d", "text": "$2$", "feedback": "平移后直线为 $y=2x+2$，由 $2m+2=6$ 解出。"}], "correct": "d", "answer": "$2$", "reasoning": ["向上平移 $3$ 个单位长度，常数项加 $3$：$y=2x-1+3=2x+2$。", "点 $(m,6)$ 在直线上：$2m+2=6$，$m=2$。"], "contentVersion": "sha256:ba774c06af14e617b68bf973fafdc55b81ed609fffbed118551c32d642e638ed"}, {"id": "j23-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j23-3", "j23-4"], "pointIds": ["pyjh.lin.017", "pyjh.lin.019"], "prompt": "某通信公司有两种计费方式：甲方式每月收月租 $30$ 元，另外每分钟通话费 $0.1$ 元；乙方式不收月租，每分钟通话费 $0.2$ 元。设每月通话 $x$ min，选择甲方式更省钱时，$x$ 的范围是什么？", "options": [{"id": "a", "text": "$x<300$", "feedback": "不等号方向弄反了：通话时间短时，不收月租的乙方式更省。"}, {"id": "b", "text": "$x\\ge300$", "feedback": "$x=300$ 时两种方式费用相等，并不是甲更省，要单独说。"}, {"id": "c", "text": "$x>150$", "feedback": "月租 $30$ 元要用每分钟的差价 $0.1$ 元去抵，不是除以 $0.2$。"}, {"id": "d", "text": "$x>300$", "feedback": "由 $30+0.1x<0.2x$ 解得，且通话时间超过 $300$ min 时甲方式更省。"}], "correct": "d", "answer": "$x>300$", "reasoning": ["甲方式费用 $y_1=30+0.1x$，乙方式费用 $y_2=0.2x$（$x\\ge0$）。", "令 $y_1=y_2$：$30+0.1x=0.2x$，$x=300$，此时两种方式一样。", "甲更省即 $30+0.1x<0.2x$，解得 $x>300$。"], "contentVersion": "sha256:9acfae36b762be56e13acf9ff37d00ced5ed896e9ed3c1005ef4ac7e331bb9d1"}, {"id": "j23-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j23-2", "j23-3"], "pointIds": ["pyjh.lin.016", "pyjh.lin.010"], "prompt": "直线 $y=2x-1$ 与直线 $y=-x+5$ 相交于点 $P$，这两条直线与 $x$ 轴围成一个三角形。这个三角形的面积是多少？", "options": [{"id": "a", "text": "$\\frac{27}{2}$", "feedback": "三角形面积是底乘高再除以 $2$，漏了除以 $2$。"}, {"id": "b", "text": "$6$", "feedback": "这是两条直线与 $y$ 轴围成的三角形的面积，题目要的是与 $x$ 轴围成的。"}, {"id": "c", "text": "$\\frac{33}{4}$", "feedback": "直线 $y=2x-1$ 与 $x$ 轴交点的横坐标解错了符号，应解 $2x-1=0$。"}, {"id": "d", "text": "$\\frac{27}{4}$", "feedback": "交点 $P(2,3)$，两直线与 $x$ 轴交于 $(\\frac12,0)$、$(5,0)$，底 $\\frac92$、高 $3$。"}], "correct": "d", "answer": "$\\frac{27}{4}$", "reasoning": ["解方程组 $\\begin{cases}y=2x-1\\\\y=-x+5\\end{cases}$ 得 $x=2$，$y=3$，交点 $P(2,3)$。", "令 $y=0$：两直线与 $x$ 轴分别交于 $(\\frac12,0)$ 和 $(5,0)$，底边长 $5-\\frac12=\\frac92$。", "高是点 $P$ 的纵坐标 $3$，面积 $\\frac12\\times\\frac92\\times3=\\frac{27}4$。"], "contentVersion": "sha256:76701f5d4befa8f8fe8cfc8dc2452a5f9cb71116a102da3695a86295773bbc70"}, {"id": "j23-test-11-v2", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j23-1", "j23-4"], "pointIds": ["pyjh.lin.020", "pyjh.lin.005"], "prompt": "学校组织 $240$ 名师生外出，计划租用甲、乙两种客车共 $6$ 辆。甲种车每辆可坐 $45$ 人，租金 $400$ 元；乙种车每辆可坐 $30$ 人，租金 $280$ 元。要让所有人都有座位，租车总费用最少是多少元？", "options": [{"id": "a", "text": "$1680$ 元", "feedback": "全租乙种车只有 $180$ 个座位，坐不下 $240$ 人，先由座位数求出甲种车辆数的范围。"}, {"id": "b", "text": "$2400$ 元", "feedback": "总费用随甲种车辆数增加而增加，最省应取辆数范围的最小值，不是全租甲种车。"}, {"id": "c", "text": "$2280$ 元", "feedback": "座位够用不等于费用最少，应检查能否在满足座位要求的前提下减少较贵车型的辆数。"}, {"id": "d", "text": "$2160$ 元", "feedback": "甲种车至少 $4$ 辆，费用 $w=120x+1680$ 随 $x$ 增大而增大，$x=4$ 时最少。"}], "correct": "d", "answer": "$2160$ 元", "reasoning": ["设租甲种车 $x$ 辆，则乙种车 $(6-x)$ 辆。座位够用：$45x+30(6-x)\\ge240$，得 $x\\ge4$；又 $x\\le6$，$x$ 为整数。", "总费用 $w=400x+280(6-x)=120x+1680$，$k=120>0$，$w$ 随 $x$ 的增大而增大。", "$x=4$ 时 $w$ 最小，为 $120\\times4+1680=2160$ 元。"], "contentVersion": "sha256:f8ff0d0290743d1239e1ab36818a5b8e22cecffe326e4fb3803b95b3556b1fa0"}, {"id": "j23-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j23-2", "j23-4"], "pointIds": ["pyjh.lin.018", "pyjh.lin.012"], "prompt": "某地居民用水按月分段收费：每户每月用水不超过 $10$ 吨时，每吨 $3$ 元；超过 $10$ 吨的部分，每吨 $5$ 元。某户本月交水费 $55$ 元，这户本月用水多少吨？", "options": [{"id": "a", "text": "$11$ 吨", "feedback": "把全部用水都按每吨 $5$ 元算了，前 $10$ 吨只收每吨 $3$ 元。"}, {"id": "b", "text": "$15$ 吨", "feedback": "$55>30$，用水超过 $10$ 吨，由 $30+5(x-10)=55$ 解出。"}, {"id": "c", "text": "$21$ 吨", "feedback": "超出部分的水费应是 $55-30=25$ 元，没有先减去前 $10$ 吨的 $30$ 元。"}, {"id": "d", "text": "$\\frac{55}{3}$ 吨", "feedback": "超过 $10$ 吨的部分单价是 $5$ 元，不能全部按 $3$ 元算。"}], "correct": "b", "answer": "$15$ 吨", "reasoning": ["设用水 $x$ 吨、水费 $y$ 元：$0\\le x\\le10$ 时 $y=3x$，最多 $30$ 元；$x>10$ 时 $y=30+5(x-10)=5x-20$。", "$55>30$，所以用水超过 $10$ 吨，在第二段上。", "$5x-20=55$，$x=15$。"], "contentVersion": "sha256:64acab463a46dfbd00fbe9dc258399fc4edc77cbe7920d9d0529b77da988a5c7"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
