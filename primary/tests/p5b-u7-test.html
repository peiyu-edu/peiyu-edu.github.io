，表示的数越大。"}, {"id": "c", "text": "这一天的气温变化越快", "feedback": "变化快不快要看线段升降得陡不陡，不是看一个点。"}], "correct": "a", "pointIds": ["pyps.p5b.u7.001"], "contentVersion": "sha256:927fc4dab789ce1f1cfef803bd49d2aec0c19fa5c1e77faa0988a176a6af5924", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><line x1=\"65\" y1=\"145\" x2=\"65\" y2=\"35\" style=\"stroke:var(--fg);stroke-width:2\"/><line x1=\"65\" y1=\"145\" x2=\"245\" y2=\"145\" style=\"stroke:var(--fg);stroke-width:2\"/><circle cx=\"110\" cy=\"110\" r=\"4\" style=\"fill:var(--a);stroke:var(--fg);stroke-width:1\"/><circle cx=\"210\" cy=\"60\" r=\"4\" style=\"fill:var(--a);stroke:var(--fg);stroke-width:1\"/><text x=\"150\" y=\"175\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">同一张图的两个点<\/text><\/svg>"}, {"id": "p5b-u7-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "要表示一位病人一天里体温的变化情况，选哪种统计图更合适？", "answer": "折线统计图", "reasoning": ["要看的是体温怎样变化。", "折线统计图不但能表示数量的多少，还能清楚地看出增减变化，所以选折线统计图。"], "options": [{"id": "a", "text": "条形统计图", "feedback": "条形统计图便于比较数量多少，看变化不如折线统计图清楚。"}, {"id": "b", "text": "折线统计图", "feedback": "对。折线统计图能清楚地看出数量的增减变化。"}, {"id": "c", "text": "两种都不能用", "feedback": "折线统计图正适合表示变化情况。"}], "correct": "b", "pointIds": ["pyps.p5b.u7.003"], "contentVersion": "sha256:4ecaebcc89f7357e2c1dff07f377d16fa42bfff17648f97635f311b3ced8383f"}, {"id": "p5b-u7-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "要比较五年级四个班各有多少人，选哪种统计图更合适？", "answer": "条形统计图", "reasoning": ["四个班的人数是并列的，不是随时间变化的数据。", "比较数量的多少，选条形统计图更合适。"], "options": [{"id": "a", "text": "条形统计图", "feedback": "对。各班人数没有先后变化的关系，比较多少用条形统计图。"}, {"id": "b", "text": "两种一样合适", "feedback": "折线是表示变化的，比较几个班的多少更适合用条形统计图。"}, {"id": "c", "text": "折线统计图", "feedback": "四个班之间不是随时间的变化，用折线连起来没有意义。"}], "correct": "a", "pointIds": ["pyps.p5b.u7.003"], "contentVersion": "sha256:60f1d7765e7e81cfbc5281280789876ed5c80f214f98742b3d1ba0c43528488e"}, {"id": "p5b-u7-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "小明 6～10 岁的身高：6 岁 115 厘米，7 岁 121 厘米，8 岁 126 厘米，9 岁 133 厘米，10 岁 138 厘米（画成折线统计图）。哪一年里长得最快？长了几厘米？", "answer": "8 岁到 9 岁，长了 7 厘米", "reasoning": ["算出每一年长了多少：121 − 115 = 6，126 − 121 = 5，133 − 126 = 7，138 − 133 = 5。", "8 岁到 9 岁长了 7 厘米，最多，折线上这一段也最陡。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u7.001"], "contentVersion": "sha256:615d19f4555a71eb3e2ff8f4eb83451c070e9af1e40565b4a971f64bb1bfcbd4", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件，所求量留空\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><text x=\"150\" y=\"23\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">6 至 10 岁已知身高<\/text><rect x=\"17.5\" y=\"43\" width=\"45\" height=\"32\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"40.0\" y=\"65\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\"><\/text><rect x=\"62.5\" y=\"43\" width=\"44\" height=\"32\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"84.5\" y=\"65\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">6<\/text><rect x=\"106.5\" y=\"43\" width=\"44\" height=\"32\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"128.5\" y=\"65\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">7<\/text><rect x=\"150.5\" y=\"43\" width=\"44\" height=\"32\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"172.5\" y=\"65\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">8<\/text><rect x=\"194.5\" y=\"43\" width=\"44\" height=\"32\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"216.5\" y=\"65\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">9<\/text><rect x=\"238.5\" y=\"43\" width=\"44\" height=\"32\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2
