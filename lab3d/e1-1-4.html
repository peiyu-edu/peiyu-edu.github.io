          <li>「法向量与点面距离」：法向量 n 与 BD、BA₁ 的数量积始终是 0；换点看到平面 A₁BD 的距离。</li>

          <li>「二面角」拖 AP 的高 h：法向量算出的角和几何法 tan∠POA 一致。</li>
          <li>按住拖动可以转动模型，法向量、距离和角度随时重算；被挡住的线画成虚线。</li>
