<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级上册 第二单元 混合运算 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p3a-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级上册 第二单元 混合运算 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3a-u2-test", "sectionId": "p3a-u2-test", "unitId": "p3a-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级上册 第二单元 混合运算 单元测评", "items": [{"id": "p3a-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：56 − 18 + 24", "answer": "62", "reasoning": ["只有加减，从左往右算。", "56 − 18 = 38，38 + 24 = 62。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u2.001"], "contentVersion": "sha256:a6058c272e539291ef32f4a451533db270fa50d66f8d2f4bfffdb848cb5c5cc7"}, {"id": "p3a-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：72 ÷ 8 × 6", "answer": "54", "reasoning": ["只有乘除，从左往右算。", "先算 72 ÷ 8，得 9；再算 9 × 6 = 54。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u2.001"], "contentVersion": "sha256:2a1ac892692725e5308d8683fe14d375b8863e11c43bf7554139151e0d95089d"}, {"id": "p3a-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：35 + 7 × 5", "answer": "70", "reasoning": ["既有乘法又有加法，先算乘法。", "7 × 5 = 35，再算 35 + 35 = 70。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u2.002"], "contentVersion": "sha256:49e8fffda8e917d0c11687490dbd679043492792fb510fdb36367b3a03e05e8f"}, {"id": "p3a-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：(64 − 28) ÷ 4", "answer": "9", "reasoning": ["有括号，先算括号里的：64 − 28 = 36。", "再算 36 ÷ 4，想四九三十六，得 9。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u2.003"], "contentVersion": "sha256:ef2190a7ae12bd54dbaaea5848994f824ad9cf97af865e037cc68ed00020737a"}, {"id": "p3a-u2-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪道算式要先算加法？", "answer": "(40 + 8) × 2", "reasoning": ["有括号先算括号里的；没有括号，先乘除后加减。", "只有 (40 + 8) × 2 里的加法在括号里，要先算。"], "options": [{"id": "a", "text": "48 − 6 × 3", "feedback": "这道题没有加法，要先算乘法。"}, {"id": "b", "text": "40 + 8 × 2", "feedback": "没有括号，要先算乘法 8 × 2。"}, {"id": "c", "text": "(40 + 8) × 2", "feedback": "对。加法在括号里，要先算。"}], "correct": "c", "pointIds": ["pyps.p3a.u2.003", "pyps.p3a.u2.002"], "contentVersion": "sha256:92c3a7d482df35a1478e93761ea6102b523a8708781277319477315ad94de01f"}, {"id": "p3a-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "小红算 40 − 4 × 5 时，先算 40 − 4 得 36，再算 36 × 5 得 180。她错在哪里？", "answer": "应该先算 4 × 5，再用 40 去减", "reasoning": ["算式里既有减法又有乘法，要先算乘法。", "4 × 5 = 20，40 − 20 = 20，正确得数是 20。"], "options": [{"id": "a", "text": "没有错，从左往右算就对了", "feedback": "从左往右只用在同一级的算式里，这里有减法也有乘法。"}, {"id": "b", "text": "应该先算 40 × 5", "feedback": "40 和 5 中间没有乘号，不能这样算。"}, {"id": "c", "text": "应该先算 4 × 5，再用 40 去减", "feedback": "对。先乘除后加减，得数是 20。"}], "correct": "c", "pointIds": ["pyps.p3a.u2.002"], "contentVersion": "sha256:02dff5c6f79d3802245e57dfeaba60d73bee5dd3732520fd25675eed6778f70f"}, {"id": "p3a-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在算式里添上括号，使等式成立：48 − 18 ÷ 6 = 5", "answer": "(48 − 18) ÷ 6 = 5", "reasoning": ["如果不加括号，先算 18 ÷ 6，得 3，48 − 3 = 45，不等于 5。", "加上括号先算 48 − 18 = 30，再算 30 ÷ 6，得 5。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u2.003"], "contentVersion": "sha256:abb7326a573daaa12736fa6a25fa32f6752875070955890e0945428344704774"}, {"id": "p3a-u2-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "书架上有 85 本书，上午借走 27 本，下午借走 23 本。还剩多少本？用两种方法列综合算式。", "answer": "85 − 27 − 23 = 35（本）；85 − (27 + 23) = 35（本）", "reasoning": ["方法一：一次一次地减，85 − 27 − 23 = 35（本）。", "方法二：先算一共借走多少本，27 + 23 = 50（本），再算 85 − 50 = 35（本）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u2.004"], "contentVersion": "sha256:0b0063a3670c1d13af61336e2f3f85a1fe3cc453e2442f5e68d8ee516927aa5c"}, {"id": "p3a-u2-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "每盒彩笔有 6 支，老师买了 6 盒，平均分给 4 个小组。每个小组分到多少支？", "answer": "6 × 6 ÷ 4 = 9（支）", "reasoning": ["先求一共有多少支：6 × 6 = 36（支）。", "再平均分给 4 个小组：36 ÷ 4，想四九三十六，每组 9 支。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u2.005"], "contentVersion": "sha256:c44f40af7c2cc63b1ee33ac2e323c0f78bef75e7767ad459a534420a8dab9aa7"}, {"id": "p3a-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小明买了 4 本笔记本，小红买了 5 本，每本 6 元。两人一共花了多少元？用两种方法解答。", "answer": "(4 + 5) × 6 = 54（元）；4 × 6 + 5 × 6 = 54（元）", "reasoning": ["方法一：先算两人一共买了几本，4 + 5 = 9（本），再算 9 × 6 = 54（元）。", "方法二：先各算各的，小明 4 × 6 = 24（元），小红 5 × 6 = 30（元），再合起来 24 + 30 = 54（元）。", "两种方法得数相同。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u2.006", "pyps.p3a.u2.003"], "contentVersion": "sha256:72494a4984a366392685ba962ea4ac07dfb7b90173c747d4dc4d79a37fb08db6"}, {"id": "p3a-u2-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一本故事书 9 元，一个文具盒的价钱是故事书的 3 倍。买一个文具盒和一本故事书，一共要多少元？", "answer": "9 × 3 + 9 = 36（元）", "reasoning": ["先求文具盒多少元：9 × 3 = 27（元）。", "再加上故事书：27 + 9 = 36（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u2.005", "pyps.p3a.u2.002"], "contentVersion": "sha256:56f5168a45aade9d7343e2a3540c1b3e4e3b6dd7109c9a51837ed7239c17fbcc"}], "contentVersion": "sha256:a39dd7bbe8d75e355b265594ab132285afa5a785097416da4a2ff8ded95c19b9"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
