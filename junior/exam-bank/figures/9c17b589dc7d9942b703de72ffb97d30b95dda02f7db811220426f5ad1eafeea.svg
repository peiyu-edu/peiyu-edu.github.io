<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 390" role="img"><title>坐标系中的两块阴影</title><desc>平面直角坐标系的两轴均标有1、2、3，虚线标出相应的水平线和竖直线。两条上升斜线分别经过O与(1,3)、(1,0)与(2,3)；两条下降斜线分别连接(0,2)与(3,1)、(0,3)与(3,2)。阴影m在两条上升斜线之间，下边位于y=1的水平虚线上，上边位于从(0,2)到(3,1)的下降斜线上；阴影n也在两条上升斜线之间，下边位于y=2的水平虚线上，上边位于从(0,3)到(3,2)的下降斜线上。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><polygon points="76.66666666666666,250 156.66666666666666,250 170.0,210.0 98.0,186.0" class="shade"></polygon><polygon points="103.33333333333333,170 183.33333333333334,170 194.0,138.0 122.0,114.0" class="shade"></polygon><line x1="50" y1="250" x2="290" y2="250" class="dash"></line><line x1="130" y1="330" x2="130" y2="90" class="dash"></line><text x="130" y="361">1</text><text x="29" y="257">1</text><line x1="50" y1="170" x2="290" y2="170" class="dash"></line><line x1="210" y1="330" x2="210" y2="90" class="dash"></line><text x="210" y="361">2</text><text x="29" y="177">2</text><line x1="50" y1="90" x2="290" y2="90" class="dash"></line><line x1="290" y1="330" x2="290" y2="90" class="dash"></line><text x="290" y="361">3</text><text x="29" y="97">3</text><line x1="50" y1="330" x2="330" y2="330" class=""></line><line x1="50" y1="330" x2="50" y2="55" class=""></line><path d="M322 325 L332 330 L322 335" class=""></path><path d="M45 63 L50 53 L55 63" class=""></path><line x1="50" y1="330" x2="130" y2="90" class=""></line><line x1="130" y1="330" x2="210" y2="90" class=""></line><line x1="50" y1="170" x2="290" y2="250" class=""></line><line x1="50" y1="90" x2="290" y2="170" class=""></line><text x="111" y="233">m</text><text x="155" y="151">n</text><text x="32" y="360">O</text><text x="341" y="358">x</text><text x="35" y="49">y</text></svg>
