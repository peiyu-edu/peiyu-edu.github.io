<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年级上册 第二单元 分数乘法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p6a-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>六年级上册 第二单元 分数乘法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p6a-u2-test", "sectionId": "p6a-u2-test", "unitId": "p6a-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "六年级上册 第二单元 分数乘法 单元测评", "items": [{"id": "p6a-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "2/9 × 3 = □", "answer": "2/3", "reasoning": ["整数 3 和分母 9 先约分：3 变成 1，9 变成 3。", "分子 2 不变，结果是 2/3。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u2.001"], "contentVersion": "sha256:b5bfffd97448f3ab0175b0d6680d472737df14e605c20336b5a25fcbb267d6d5"}, {"id": "p6a-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一桶油重 20 千克，用去了它的 3/4。用去了多少千克？", "answer": "15 千克", "reasoning": ["求 20 千克的 3/4 是多少，用乘法：20 × 3/4。", "20 和 4 约分得 5，5 × 3 = 15（千克）。"], "options": [{"id": "a", "text": "15 千克", "feedback": "对。20 × 3/4 = 15（千克）。"}, {"id": "b", "text": "60 千克", "feedback": "20 只乘了分子 3，忘了除以分母 4。"}, {"id": "c", "text": "5 千克", "feedback": "这是 20 千克的 1/4，还要再乘 3。"}], "correct": "a", "pointIds": ["pyps.p6a.u2.002"], "contentVersion": "sha256:53d8d7606388a4c922303aed2bf38c09b38f7f4970431e0b914cdadb285b83ba"}, {"id": "p6a-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "5/6 × 3/10 = □", "answer": "1/4", "reasoning": ["分子乘分子，分母乘分母，能约分的先约分。", "5 和 10 约分得 1 和 2，3 和 6 约分得 1 和 2。", "1/2 × 1/2 = 1/4。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u2.003"], "contentVersion": "sha256:12d9cf0c7386c941972be76e95c0a0076d9cf2b4ec14a11428369917aac7414f"}, {"id": "p6a-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "不计算，下面哪个算式的积小于 7/8？", "answer": "7/8 × 2/5", "reasoning": ["一个正数乘大于 0 且小于 1 的数，积比这个正数小；乘大于 1 的数，积比这个正数大。", "2/5 < 1，所以 7/8 × 2/5 < 7/8。"], "options": [{"id": "a", "text": "7/8 × 4/3", "feedback": "4/3 比 1 大，积比 7/8 大。"}, {"id": "b", "text": "7/8 × 2/5", "feedback": "对。2/5 比 1 小，积就比 7/8 小。"}, {"id": "c", "text": "7/8 × 1", "feedback": "乘 1，积等于 7/8，不是小于。"}], "correct": "b", "pointIds": ["pyps.p6a.u2.004"], "contentVersion": "sha256:4a606c9107d9121f7e5bd74f0270c3376f72aa35b311cb7d6e61007cc6051ce7"}, {"id": "p6a-u2-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "0.6 × 5/12 = □（用分数表示）", "answer": "1/4", "reasoning": ["把 0.6 化成分数 3/5。", "3/5 × 5/12：5 和 5 约分，3 和 12 约分得 1 和 4。", "结果是 1/4（也就是 0.25）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u2.005"], "contentVersion": "sha256:1333870375e2d2f3d842e47966b4dd4ad587e50991188973de388211197c8505"}, {"id": "p6a-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "3/4 × 8/9 + 1/6 = □", "answer": "5/6", "reasoning": ["先算乘法，再算加法。", "3/4 × 8/9 = 2/3。", "2/3 + 1/6 = 4/6 + 1/6 = 5/6。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u2.006"], "contentVersion": "sha256:9766801575281e1da83a783b3f535c415a611b0d7ae75d8d856d3649224976d5"}, {"id": "p6a-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用简便方法计算：（1/4 + 1/6）× 12", "answer": "5", "reasoning": ["用乘法分配律：（1/4 + 1/6）× 12 = 1/4 × 12 + 1/6 × 12。", "1/4 × 12 得 3，1/6 × 12 得 2。", "3 + 2 = 5。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u2.007"], "contentVersion": "sha256:726e352950bf3c202065d4ec1f4c455beed71f1439e0c96c294f1709ad351ffa"}, {"id": "p6a-u2-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一根绳子长 3 米。第一次剪去它的 1/3，第二次剪去 1/3 米。哪一次剪去的多？", "answer": "第一次剪去的多", "reasoning": ["「它的 1/3」不带单位，是绳长的 1/3：3 × 1/3 = 1（米）。", "「1/3 米」带单位，就是 1/3 米。", "1 米 > 1/3 米，第一次剪去的多。"], "options": [{"id": "a", "text": "第二次剪去的多", "feedback": "第二次剪去的 1/3 米不到 1 米，比第一次少。"}, {"id": "b", "text": "两次一样多", "feedback": "「它的 1/3」是分率，「1/3 米」是带单位的长度，意思不同。"}, {"id": "c", "text": "第一次剪去的多", "feedback": "对。第一次剪去 3 × 1/3 = 1（米），第二次只剪去 1/3 米。"}], "correct": "c", "pointIds": ["pyps.p6a.u2.010"], "contentVersion": "sha256:7f0d2c9a043118d65e9ec40491022393dd6248d6546b259c1c92f4a23718f609"}, {"id": "p6a-u2-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "学校图书室有 600 本书，其中 2/5 是故事书，故事书中的 1/4 是童话书。童话书有多少本？", "answer": "600 × 2/5 × 1/4 = 60（本）", "reasoning": ["先求故事书：600 × 2/5 = 240（本）。", "再求童话书，这时单位「1」是故事书：240 × 1/4 = 60（本）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u2.008"], "contentVersion": "sha256:100cb42f61f38952339f29f216f95ccda67622dd61f6b37bc4ac2104dd012ae9"}, {"id": "p6a-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一辆自行车原价 480 元，现在的价格比原价便宜 1/6。现在的价格是多少元？", "answer": "480 ×（1 − 1/6）= 400（元）", "reasoning": ["比原价便宜 1/6，原价是单位「1」。", "现价是原价的 1 − 1/6 = 5/6。", "480 × 5/6 = 400（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u2.009", "pyps.p6a.u2.002"], "contentVersion": "sha256:f2e887a6574dce6458ede15c392d6e34b075aa5a7344ca3fe41ed91b52fe8db8"}, {"id": "p6a-u2-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "果园里有苹果树 120 棵，梨树比苹果树多 1/4。梨树有多少棵？", "answer": "120 ×（1 + 1/4）= 150（棵）", "reasoning": ["梨树比苹果树多 1/4，苹果树是单位「1」。", "梨树是苹果树的 1 + 1/4 = 5/4。", "120 × 5/4 = 150（棵）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u2.009", "pyps.p6a.u2.010"], "contentVersion": "sha256:6b753b04db6b8a44b79393f9ec603445fb8571e480355b7388910e825b046b2d"}], "contentVersion": "sha256:d6d4baefee189514e80075c6508873ee413902b600ac9840c12406160a320e1c"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
