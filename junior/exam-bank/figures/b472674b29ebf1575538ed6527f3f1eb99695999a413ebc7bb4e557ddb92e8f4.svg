<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-labelledby="title desc"><title id="title">四组图形选项</title><desc id="desc">A：两个五边形，左边的顶点朝上，右边的顶点朝下；B：两个底边水平的钝角三角形，顶点都在左上方，一个在左下、一个在右上；C：一小一大两个正方形；D：两个半圆，直径边相对，弧分别朝左和朝右。</desc><style>path,circle,line,polyline,polygon,rect,ellipse{fill:none;stroke:currentColor;stroke-width:2}.f{fill:#fff}.s{fill:currentColor;fill-opacity:.15}.d{stroke-dasharray:6 5}.t{stroke-width:1.4}.dot{fill:currentColor}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.f{fill:#15272d}}</style><path d="M96.95,20.00L125.00,43.10L120.60,77.20L75.50,77.20L70.00,44.20Z"/><path d="M160.75,26.60L205.30,26.60L210.80,59.60L184.40,84.35L155.80,62.35Z"/><text x="30.00" y="62.00" text-anchor="middle" font-size="22">A.</text><path d="M370.00,40.35L466.25,81.60L385.95,81.60Z"/><path d="M429.40,20.00L525.65,60.70L444.80,60.70Z"/><text x="330.00" y="62.00" text-anchor="middle" font-size="22">B.</text><path d="M70.00,129.05L108.50,129.05L108.50,167.00L70.00,167.00Z"/><path d="M120.60,112.00L185.50,112.00L185.50,175.80L120.60,175.80Z"/><text x="30.00" y="160.00" text-anchor="middle" font-size="22">C.</text><path d="M415.85,112.00A47.85,47.85 0 0 0 415.85,207.70Z"/><path d="M425.85,112.00A47.85,47.85 0 0 1 425.85,207.70Z"/><text x="330.00" y="160.00" text-anchor="middle" font-size="22">D.</text></svg>