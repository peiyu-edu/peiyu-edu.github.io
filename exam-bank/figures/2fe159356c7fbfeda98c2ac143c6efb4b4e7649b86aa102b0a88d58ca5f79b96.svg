<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 395" role="img" aria-labelledby="title desc"><title id="title">正视图与四个侧视图选项</title><desc id="desc">正视图为正方形，左下角斜线为虚线。选项A正方形右下角实斜线；B左下角虚斜线；C右下角虚斜线；D左下角实斜线。斜线连接相应两边中点。</desc><style>:root{color:#202c37;background:#fff}text{fill:currentColor;font-family:"Noto Serif CJK SC",serif}@media(prefers-color-scheme:dark){:root{color:#e8edf1;background:#17212b}}</style><rect x="45" y="20" width="120" height="120" fill="none" stroke="currentColor" stroke-width="2"/><path d="M 45 80 L 105 140" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4"/><text x="105" y="166" text-anchor="middle" font-size="18">正视图</text><rect x="35" y="220" width="120" height="120" fill="none" stroke="currentColor" stroke-width="2"/><path d="M 95 340 L 155 280" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="95" y="366" text-anchor="middle" font-size="18">A</text><rect x="195" y="220" width="120" height="120" fill="none" stroke="currentColor" stroke-width="2"/><path d="M 195 280 L 255 340" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4"/><text x="255" y="366" text-anchor="middle" font-size="18">B</text><rect x="355" y="220" width="120" height="120" fill="none" stroke="currentColor" stroke-width="2"/><path d="M 415 340 L 475 280" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4"/><text x="415" y="366" text-anchor="middle" font-size="18">C</text><rect x="515" y="220" width="120" height="120" fill="none" stroke="currentColor" stroke-width="2"/><path d="M 515 280 L 575 340" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="575" y="366" text-anchor="middle" font-size="18">D</text></svg>
