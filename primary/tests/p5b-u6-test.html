<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五年级下册 第六单元 分数的加法和减法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p5b-u6-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>五年级下册 第六单元 分数的加法和减法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p5b-u6-test", "sectionId": "p5b-u6-test", "unitId": "p5b-u6", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "五年级下册 第六单元 分数的加法和减法 单元测评", "items": [{"id": "p5b-u6-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "3/8 + 1/8 = □（结果写成最简分数）", "answer": "1/2", "reasoning": ["分母不变，分子相加：3/8 + 1/8 = 4/8。", "约分：4/8 = 1/2。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.001"], "contentVersion": "sha256:d6c4bb6a89435591308d586636ba78e7d18767e7e41a3e771e66e556dbef3ff9"}, {"id": "p5b-u6-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "9/10 − 3/10 = □（结果写成最简分数）", "answer": "3/5", "reasoning": ["分母不变，分子相减：9/10 − 3/10 = 6/10。", "约分：6/10 = 3/5。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.001"], "contentVersion": "sha256:23c9841da36f00463de731b902a2816a16570c0db56cbb9d39109424a7e7c1ff"}, {"id": "p5b-u6-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "5/6 + 5/6 = □（结果化成带分数，分数部分要最简）", "answer": "1 又 2/3（即 5/3）", "reasoning": ["分母不变，分子相加：5/6 + 5/6 = 10/6。", "约分：10/6 = 5/3。", "5 ÷ 3 = 1……2，5/3 = 1 又 2/3。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.002"], "contentVersion": "sha256:8a1544d19ad435715467d2c34875adb95a122be86a57b35225b6cd44791ec69a"}, {"id": "p5b-u6-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "1/2 + 1/3 = □", "answer": "5/6", "reasoning": ["分母不同，先通分，公分母用 6：1/2 = 3/6，1/3 = 2/6。", "3/6 + 2/6 = 5/6。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.003"], "contentVersion": "sha256:30594908b00259f937d3871301ff3c84acca4e3a6ec8b1988b9d01f01b4ad341"}, {"id": "p5b-u6-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "3/4 − 1/6 = □", "answer": "7/12", "reasoning": ["4 和 6 的最小公倍数是 12：3/4 = 9/12，1/6 = 2/12。", "9/12 − 2/12 = 7/12。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.003"], "contentVersion": "sha256:0a037ece4b3308dd620b83939fc362df323073d3deb0f59a1cd0d17f2608b326"}, {"id": "p5b-u6-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "7/10 + 1/6 = □（结果写成最简分数）", "answer": "13/15", "reasoning": ["10 和 6 的最小公倍数是 30：7/10 = 21/30，1/6 = 5/30。", "21/30 + 5/30 = 26/30。", "约分：26/30 = 13/15。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.003"], "contentVersion": "sha256:65384a3d05ea91d93b07844bb27b551bdc7134d6cf41df3e057413028f1b653f"}, {"id": "p5b-u6-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "1 − 3/8 − 1/4 = □", "answer": "3/8", "reasoning": ["从左往右算，先通分：1 = 8/8，1/4 = 2/8。", "8/8 − 3/8 − 2/8 = 3/8。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.004"], "contentVersion": "sha256:884fd52b01fde0d1bbcc661c29c0761321ebc67617097200b2e7130afbb0fe5a"}, {"id": "p5b-u6-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用简便方法计算：2/9 + 3/7 + 7/9", "answer": "1 又 3/7", "reasoning": ["交换 3/7 和 7/9 的位置，先把同分母的 2/9 和 7/9 加起来：2/9 + 7/9 = 9/9，就是 1。", "再加 3/7，得 1 又 3/7。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.006"], "contentVersion": "sha256:6afc9f1835f2ebe0a5bb79f87e98b2a6c9025a58f856cfdd717ace9906c1fff3"}, {"id": "p5b-u6-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一桶油，第一次用去全桶的 2/5，第二次用去全桶的 1/4。还剩全桶的几分之几？", "answer": "7/20", "reasoning": ["把一桶油看作单位「1」。", "通分，公分母用 20：1 = 20/20，2/5 = 8/20，1/4 = 5/20。", "20/20 − 8/20 − 5/20 = 7/20。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.005", "pyps.p5b.u6.004"], "contentVersion": "sha256:58b851d9576c8b3565e5b6f63500e15484593ac3acdc4ef2fd8c4bbf0ea617ed"}, {"id": "p5b-u6-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一根绳子长 3 米，剪去 1/3 米。还剩多少米？", "answer": "2 又 2/3 米", "reasoning": ["1/3 米带着单位「米」，是一个具体的长度。", "把 3 写成 9/3：9/3 − 1/3 = 8/3。", "8 ÷ 3 = 2……2，8/3 = 2 又 2/3，还剩 2 又 2/3 米。"], "options": [{"id": "a", "text": "2 又 2/3 米", "feedback": "对。3 − 1/3 = 8/3，就是 2 又 2/3 米。"}, {"id": "b", "text": "2/3 米", "feedback": "3 米只剪去 1/3 米，剩下的比 2 米还多。"}, {"id": "c", "text": "2 米", "feedback": "剪去的是 1/3 米，是一个具体的长度，不是全长的 1/3。"}], "correct": "a", "pointIds": ["pyps.p5b.u6.005"], "contentVersion": "sha256:2f98b9214edfb19e0c51ac363aa6b6566b673b409de52495a5129ecf02398f9c"}, {"id": "p5b-u6-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小明看一本书，第一天看了全书的 1/4，第二天比第一天多看了全书的 1/12。两天一共看了全书的几分之几？", "answer": "7/12", "reasoning": ["第二天看了：1/4 + 1/12 = 3/12 + 1/12 = 4/12，约分是 1/3。", "两天一共：1/4 + 1/3 = 3/12 + 4/12 = 7/12。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u6.005", "pyps.p5b.u6.003"], "contentVersion": "sha256:e390ee94bf190e6192fd7215db9da44c6c2ae8c00d38abf093e697811e770e5f"}], "contentVersion": "sha256:2aa725760448441ad7a41d0441445edf54cb591a59cacfc8616b800656ce7a2c"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
