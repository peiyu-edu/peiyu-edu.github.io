<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 380" role="img"><title>广东第10题图</title><desc>直角三角形ABC在B处为直角，AB=6，BC=8；绕A逆时针旋转90°后B、C分别对应B′、C′，另连接B′C。</desc><style>:root{color:#173b40}@media(prefers-color-scheme:dark){:root{color:#e5eeeb}}line,path,polygon,polyline,circle,rect{stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:"Times New Roman","Songti SC",serif}</style><polygon points="60,210 60,330 220,330" fill="none"/><polygon points="60,210 180,210 180,50" fill="none"/><line x1="180" y1="210" x2="220" y2="330"/><polyline points="60,318 72,318 72,330" fill="none"/><polyline points="168,210 168,198 180,198" fill="none"/><text x="36" y="210" font-size="20">A</text><text x="35" y="351" font-size="20">B</text><text x="229" y="350" font-size="20">C</text><text x="188" y="215" font-size="20">B′</text><text x="187" y="49" font-size="20">C′</text></svg>
