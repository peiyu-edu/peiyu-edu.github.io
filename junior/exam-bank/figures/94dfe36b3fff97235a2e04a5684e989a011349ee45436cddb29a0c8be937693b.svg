<style>:root{--ink:#172c3c;--shade:#c8d5de;--strong:#6e8798;--paper:#fff}text{font-family:"Noto Sans CJK SC",sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--ink:#eff4f8;--shade:#405969;--strong:#91a8b7;--paper:#12212d}}</style>
<path d="M65.000,55.000 L65.000,175.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M65.000,175.000 L330.000,175.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M330.000,175.000 L330.000,55.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M330.000,55.000 L65.000,55.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M65.000,175.000 L145.000,55.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M330.000,55.000 L250.000,175.000" fill="none" stroke="var(--ink)" stroke-width="2" /><text x="49" y="50" font-size="18" text-anchor="middle">A</text><text x="49" y="198" font-size="18" text-anchor="middle">B</text><text x="345" y="198" font-size="18" text-anchor="middle">C</text><text x="345" y="50" font-size="18" text-anchor="middle">D</text><text x="145" y="41" font-size="18" text-anchor="middle">E</text><text x="250" y="203" font-size="18" text-anchor="middle">F</text></svg>