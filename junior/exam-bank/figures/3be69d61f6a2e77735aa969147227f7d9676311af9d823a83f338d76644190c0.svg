<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 365 125" role="img"><title>待表示解集的数轴</title><desc>数轴上从左到右依次标出-3、-2、-1、0、1、2、3。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><line x1="20" y1="65" x2="340" y2="65" class=""></line><path d="M330 60 L342 65 L330 70" class=""></path><line x1="54" y1="65" x2="54" y2="58" class=""></line><text x="54" y="97">-3</text><line x1="96" y1="65" x2="96" y2="58" class=""></line><text x="96" y="97">-2</text><line x1="138" y1="65" x2="138" y2="58" class=""></line><text x="138" y="97">-1</text><line x1="180" y1="65" x2="180" y2="58" class=""></line><text x="180" y="97">0</text><line x1="222" y1="65" x2="222" y2="58" class=""></line><text x="222" y="97">1</text><line x1="264" y1="65" x2="264" y2="58" class=""></line><text x="264" y="97">2</text><line x1="306" y1="65" x2="306" y2="58" class=""></line><text x="306" y="97">3</text></svg>
