条是正方形的。长方形斜着对折，两边不能完全重合。"}, {"id": "c", "text": "1 条", "feedback": "横着、竖着对折都能完全重合，有 2 条。"}], "correct": "a", "pointIds": ["pyps.p5a.u4.001"], "contentVersion": "sha256:23b49bd4248729284f7626bc9c3e843ea8b4c573356ea052274a43beca248b0d", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"45\" y=\"35\" width=\"170\" height=\"110\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><text x=\"130.0\" y=\"168\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">6 厘米<\/text><text x=\"257\" y=\"95\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">4 厘米<\/text><text x=\"130.0\" y=\"95\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\"><\/text><\/svg>"}, {"id": "p5a-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪个图形一定是轴对称图形？", "answer": "等腰三角形", "reasoning": ["对折后两边能完全重合的图形，才是轴对称图形。", "等腰三角形对折后两条腰正好重合，所以是轴对称图形。"], "options": [{"id": "a", "text": "没有直角、相邻两条边又不一样长的平行四边形", "feedback": "这样的平行四边形怎么对折都不能完全重合。"}, {"id": "b", "text": "三条边都不一样长的三角形", "feedback": "三条边都不一样长，怎么对折都不能完全重合。"}, {"id": "c", "text": "等腰三角形", "feedback": "对。沿底边的中点和顶点所在的直线对折，两边完全重合。"}], "correct": "c", "pointIds": ["pyps.p5a.u4.001"], "contentVersion": "sha256:9fd42719fcb57dd6ea93809680802dd17bb5caafd4cd607426ccb330d36194ab"}, {"id": "p5a-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "方格纸上有一条竖着的对称轴，点 A 在对称轴左边 3 格。补全轴对称图形时，A 的对应点在哪里？", "answer": "和 A 在同一行，对称轴右边 3 格", "reasoning": ["对应点到对称轴的格数相等，连线和对称轴垂直。", "对称轴是竖着的，所以对应点和 A 在同一行，在对称轴右边 3 格。"], "options": [{"id": "a", "text": "和 A 在同一列，对称轴下面 3 格", "feedback": "对称轴是竖着的，对应点要在对称轴的另一边，和 A 在同一行。"}, {"id": "b", "text": "和 A 在同一行，对称轴右边 6 格", "feedback": "6 格是两个点之间的距离，对应点到对称轴是 3 格。"}, {"id": "c", "text": "和 A 在同一行，对称轴右边 3 格", "feedback": "对。对应点到对称轴的格数相等。"}], "correct": "c", "pointIds": ["pyps.p5a.u4.002"], "conte =\"4\" style=\"fill:var(--a);stroke:var(--fg);stroke-width:1\"/><text x=\"78\" y=\"87\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A<\/text><\/svg>"}, {"id": "p5a-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "方格纸上，一个三角形的顶点 P 原来在第 2 列，向右平移后到了第 7 列（行不变）。这个三角形向右平移了几格？", "answer": "5 格", "reasoning": ["看同一个点移动了几格：从第 2 列到第 7 列。", "7 − 2 = 5，向右平移了 5 格。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u4.003"], "contentVersion": "sha256:014ff4f724030bd63667bf62daa32a80454b6b88d8553922669317d15ed1afc6", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 210\" role=\"img\" aria-label=\"题目已知条件，所求量留空\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><line x1=\"45\" y1=\"76\" x2=\"78\" y2=\"76\" style=\"stroke:var(--fg);stroke-width:2\"/><line x1=\"222\" y1=\"76\" x2=\"255\" y2=\"76\" style=\"stroke:var(--fg);stroke-width:2\"/><circle cx=\"60\" cy=\"76\" r=\"4\" style=\"fill:var(--a);stroke:var(--fg);stroke-width:1\"/><circle cx=\"240\" cy=\"76\" r=\"4\" style=\"fill:var(--a);stroke:var(--fg);stroke-width:1\"/><text x=\"150\" y=\"80\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">…<\/text><text x=\"60\" y=\"46\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">P<\/text><text x=\"240\" y=\"46\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">P′<\/text><text x=\"60\" y=\"114\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">第 2 列<\/text><text x=\"240\" y=\"114\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">第 7 列<\/text><text x=\"150\" y=\"166\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">同一行，中间刻度省略<\/text><\/svg>"}, {"id": "p5a-u4-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "钟面上的分针从 12 走到 3，是怎样旋转的？", "answer": "绕钟面中心顺时针旋转 90°", "reasoning": ["分针绕钟面中心，按钟表转的方向转，是顺时针。", "从 12 到 3 有 3 个大格，每个大格 30°，3 × 30 = 90，转了 90°。"], "options": [{"id": "a", "text": "绕  格，再向下平移 2 格。下面说法对的是哪个？", "answer": "形状、大小、方向都没变，只是位置变了", "reasoning": ["平移不改变图形的形状、大小和方向，只改变位置。", "本题用横、竖格数描述这次移动：向右 3 格，再向下 2 格；也可以看成一次斜向平移。"], "options": [{"id": "a", "text": "形状、大小、方向都没变，只是位置变了", "feedback": "对。两次都是平移，只改变位置。"}, {"id": "b", "text": "相当于斜着平移了 5 格", "feedback": "本题按横、竖方向数格，不能把两个方向的格数相加当成斜向的格数。"}, {"id": "c", "text": "图形的方向变了", "feedback": "平移只改变位置，方向不变。"}], "correct": "a", "pointIds": ["pyps.p5a.u4.004"], "contentVersion": "sha256:a0954be71d87da4cf5566246396792a9d06ca25336180a0916deca0c79fe88cc", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 210\" role=\"img\" aria-label=\"题目已知条件，所求量留空\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"35,110 80,110 55,65\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><text x=\"58\" y=\"140\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">原图<\/text><text x=\"195\" y=\"68\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">先向右 3 格<\/text><text x=\"195\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">再向下 2 格<\/text><text x=\"150\" y=\"183\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">不预画运动后的结果<\/text><\/svg>"}, {"id": "p5a-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "方格纸上，点 A 在点 O 右边 3 格。把线段 OA 绕点 O 逆时针旋转 90°，点 A 到了哪里？", "answer": "点 O 上面 3 格", "reasoning": ["绕点 O 旋转，点 O 不动，OA 的长度不变，还是 3 格。", "从向右的方向逆时针转 90°，就朝上了，所以 A 到了 O 上面 3 格。"], "options": [{"id": "a", "text": "点 O 下面 3 格", "feedback": "这是顺时针旋转 90° 的结果。"}, {"id": "b", "text": "点 O 左边 3 格", "feedback": "这是旋转了 180°。"}, {"id": "c", "text": "点 O 上面 3 格", "feedback": "对。从右边按逆时针转 90°，转到上面，长度不变。"}], "correct": "c", "pointIds": ["pyps.p5a.u4.007"], "contentVersion": "sha256:57ed9049ae33fad0db362585a3169bb681da47156997c455fc3b38bb1b586a96", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:a pe": "fill", "prompt": "一个图形：在长 8 厘米、宽 5 厘米的长方形上边凸出一个小三角形，下边正好在它的正下方有一个三角形缺口。把凸出的小三角形向下平移 5 厘米，恰好与缺口完全重合。这个图形的面积是多少？", "answer": "40 平方厘米", "reasoning": ["把上边凸出的小三角形向下平移 5 厘米，正好补进下边的缺口。", "图形变成长 8 厘米、宽 5 厘米的长方形：8 × 5 = 40（平方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u4.005"], "contentVersion": "sha256:37e6239145ca073d9dbb2e6ce461d037dad898ffc38cd64332196217f2fec085", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"45,55 110,55 140,20 170,55 255,55 255,150 170,150 140,115 110,150 45,150\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><text x=\"150\" y=\"180\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">8 厘米<\/text><text x=\"268\" y=\"105\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">5<\/text><text x=\"150\" y=\"104\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">上下两三角形全等<\/text><\/svg>"}, {"id": "p5a-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "用一个小三角形拼风车：把它绕一个顶点顺时针旋转 90°，得到第二个；再照这样转两次，一共 4 个小三角形拼成风车。这个图案是怎样运动得到的？", "answer": "旋转，一共转了 3 次", "reasoning": ["每个新三角形的方向都变了，是旋转得到的。", "原来有 1 个，另外 3 个是转出来的：4 − 1 = 3，转了 3 次。"], "options": [{"id": "a", "text": "平移，一共平移了 3 次", "feedback": "每个三角形的方向都变了，平移不改变方向。"}, {"id": "b", "text": "旋转，一共转了 3 次", "feedback": "对。每次绕同一个点顺时针转 90°，转了 3 次。"}, {"id": "c", "text": "旋转，一共转了 4 次", "feedback": "第一个三角形是原来的，转出另外 3 个只用了 3 次。"}], "correct": "b", "pointIds": ["pyps.p5a.u4.009", "pyps.p5a.u4.008"], "contentVersion": "sha256:9fed200d42b52e5ef0e53c2928c7abd74ba65cfb802ac045129ac118cf13be0a", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 210\" role=\"img\" aria-label=\"题目已知条件，所求量留空\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"90,145 90,50 175,50\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><circle cx=\"90\" cy=\"145\" r=\"4\" style=\"fill:var(--a);stroke:var(--fg);stroke-width:1\"/><text x=\"75\" y=\"168\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">绕的顶点<\/text><text x=\"150\" y=\"195\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">每次顺时针 90°；完成 4 个图形<\/text><\/svg>"}, {"id": "p5a-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "两面完全一样的小旗，第二面和第一面朝向相同，只是在第一面右边 4 格的地方。第二面是由第一面经过什么运动得到的？", "answer": "向右平移 4 格", "reasoning": ["两面旗形状、大小、朝向都相同，只是位置不同。", "平移不改变方向，所以是向右平移了 4 格。"], "options": [{"id": "a", "text": "沿竖线对折", "feedback": "对折后旗子的朝向会反过来。"}, {"id": "b", "text": "绕旗杆底端旋转 90°", "feedback": "旋转会改变方向，这两面旗朝向相同。"}, {"id": "c", "text": "向右平移 4 格", "feedback": "对。方向没变，只是位置向右移了 4 格。"}], "correct": "c", "pointIds": ["pyps.p5a.u4.008"], "contentVersion": "sha256:9b6bae86e45e4190eb449d2ab97894708ae122b392af65d6c523c4b6f0e14727", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><line x1=\"20\" y1=\"32\" x2=\"20\" y2=\"130\" style=\"stroke:var(--muted);stroke-width:2\"/><line x1=\"37\" y1=\"32\" x2=\"37\" y2=\"130\" style=\"stroke:var(--muted);stroke-width:2\"/><line x1=\"54\" y1=\"32\" x2=\"54\" y2=\"130\" style=\"stroke:var(--muted);stroke-width:2\"/><line x1=\"71\" y1=\"32\" x2=\"71\" y2=\"130\" style=\"stroke:var(--muted);stroke-width:2\"/><line x1=\"88\" y1=\"32\" x2=\"88\" y2=\"130\" style=\"stroke:var(--muted);stroke-width:2\"/><line x1=\"105\" y1=\"32\" x2=\"105\" y2=\"130\" style=\"stroke:var(--muted);stroke-width:2\"/><line x1=\"122\" y1=\"32\" x2=\"122\" y2=\"130\" style=\"stroke:var(--muted);stroke-width:2\"/><line x1=\"20\" y1=\"130\" x2=\"20\" y2=\"40\" style=\"stroke:var(--a);stroke-width:2\"/><polygon points=\"20,40 54,58 20,76\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\"/><line x1=\"88\" y1=\"130\" x2=\"88\" y2=\"40\" style=\"str
