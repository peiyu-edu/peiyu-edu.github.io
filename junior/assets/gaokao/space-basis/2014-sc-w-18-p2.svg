<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 375" role="img" aria-labelledby="title desc"><title id="title">矩形侧面多面体与中点D、E</title><desc id="desc">ABB₁A₁与ACC₁A₁都是矩形；D、E分别为BC、CC₁中点，M在AB上待确定。</desc>
<rect width="500" height="375" rx="16" fill="#f7fafb"/>
<line x1="70" y1="250" x2="400" y2="250" stroke="#82939f" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="70" y1="250" x2="230" y2="320" stroke="#3c5363" stroke-width="2.5"/>
<line x1="230" y1="320" x2="400" y2="250" stroke="#3c5363" stroke-width="2.5"/>
<line x1="70" y1="250" x2="70" y2="55" stroke="#3c5363" stroke-width="2.5"/>
<line x1="230" y1="320" x2="230" y2="125" stroke="#3c5363" stroke-width="2.5"/>
<line x1="400" y1="250" x2="400" y2="55" stroke="#3c5363" stroke-width="2.5"/>
