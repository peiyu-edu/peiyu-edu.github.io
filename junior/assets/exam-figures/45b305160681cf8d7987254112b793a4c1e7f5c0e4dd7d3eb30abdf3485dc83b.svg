<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 445" width="530" height="445" role="img" aria-labelledby="title desc">
<title id="title">三角形中的平行线 DE、FG</title>
<desc id="desc">△ABC，A 在上方。点 D、F 在边 AB 上，D 离 A 较近；点 E 在 AC 上，点 G 在 BC 上；连接 DE、FG。D 处标着 120°，是 DB 与 DE 组成的角；F 处标着 115°，是 FD 与 FG 组成的角。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="530" height="445" fill="white"/>
<polygon points="237.9,34.9 30.0,395.0 490.0,395.0" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="183.8" y1="128.6" x2="303.4" y2="128.6" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="96.5" y1="279.8" x2="177.2" y2="395.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<path d="M171.8 149.3A24 24 0 0 0 207.8 128.6" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M109.5 257.3A26 26 0 0 1 111.4 301.1" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="237.9" y="26.9" class="l" text-anchor="middle">A</text>
<text x="24.0" y="431.0" class="l" text-anchor="middle">B</text>
<text x="496.0" y="431.0" class="l" text-anchor="middle">C</text>
<text x="161.8" y="134.6" class="l" text-anchor="middle">D</text>
<text x="325.4" y="134.6" class="l" text-anchor="middle">E</text>
<text x="72.5" y="285.8" class="l" text-anchor="middle">F</text>
<text x="177.2" y="431.0" class="l" text-anchor="middle">G</text>
<text x="249.8" y="172.6" class="n" text-anchor="middle">120°</text>
<text x="166.5" y="289.8" class="n" text-anchor="middle">115°</text>
</svg>
