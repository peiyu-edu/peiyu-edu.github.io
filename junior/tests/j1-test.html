<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 1 章 有理数 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j1-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 1 章 有理数 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j1-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j1-test", "sectionId": "j1-test", "chapterId": "j1", "title": "第 1 章 有理数 · 章末测验", "label": "章末测验", "sections": ["j1-1", "j1-2"], "items": [{"id": "j1-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j1-1"], "pointIds": ["pyjh.rat.001"], "prompt": "规定海平面以上为正。一名潜水员在海平面以下 $12$ 米处，他所在的位置应记作什么？", "options": [{"id": "a", "text": "$+12$ 米", "feedback": "海平面以下与约定的正方向相反，不能记正。"}, {"id": "b", "text": "$-12$ 米", "feedback": "海平面以上为正，以下就记负，数值 $12$ 表示离海平面的距离。"}, {"id": "c", "text": "$12$ 米", "feedback": "只写数值没有表示方向，看不出在海平面以上还是以下。"}, {"id": "d", "text": "$-(-12)$ 米", "feedback": "$-(-12)$ 是 $-12$ 的相反数，表示的是正数，方向反了。"}], "correct": "b", "answer": "$-12$ 米", "reasoning": ["约定海平面以上为正，那么与它相反的「海平面以下」记为负。", "离海平面 $12$ 米，数值部分是 $12$，所以记作 $-12$ 米。"], "contentVersion": "sha256:7920f4d016606562d047da540dd8e0d68350fcffe8359a1cdbf882e9f117e490"}, {"id": "j1-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j1-2"], "pointIds": ["pyjh.rat.003"], "prompt": "下列各数中，哪一个是负分数？", "options": [{"id": "a", "text": "$-3$", "feedback": "$-3$ 是负整数，不是分数。"}, {"id": "b", "text": "$-0.5$", "feedback": "有限小数可以写成分数，$-0.5=-\\frac12$，它小于 $0$。"}, {"id": "c", "text": "$0$", "feedback": "$0$ 是整数，既不是正数也不是负数。"}, {"id": "d", "text": "$\\frac14$", "feedback": "$\\frac14$ 是分数，但它大于 $0$，是正分数。"}], "correct": "b", "answer": "$-0.5$", "reasoning": ["负分数要同时满足两点：小于 $0$；不是整数（有限小数也算分数）。", "$-0.5=-\\frac12$，满足两点；$-3$ 是整数，$0$ 不是负数，$\\frac14$ 是正数。"], "contentVersion": "sha256:5d4f6e646c5c7b2a65bf1324146add2fa51518ec51066e85ea4de027bfbb2d42"}, {"id": "j1-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j1-2"], "pointIds": ["pyjh.rat.006"], "prompt": "$|-7|$ 的值是多少？", "options": [{"id": "a", "text": "$7$", "feedback": "绝对值是数轴上的点到原点的距离，$-7$ 到原点有 $7$ 个单位长度。"}, {"id": "b", "text": "$-7$", "feedback": "绝对值表示距离，距离不会是负数。"}, {"id": "c", "text": "$\\pm7$", "feedback": "一个数的绝对值是一个确定的数，不会同时取两个值。"}, {"id": "d", "text": "$0$", "feedback": "只有表示 $0$ 的点到原点的距离是 $0$。"}], "correct": "a", "answer": "$7$", "reasoning": ["$|a|$ 表示数轴上表示 $a$ 的点到原点的距离。", "表示 $-7$ 的点在原点左侧 $7$ 个单位长度处，所以 $|-7|=7$。"], "contentVersion": "sha256:10bf554dd9d2f0b5833e74144950a33e61ce9ae6127476cdb1b3f877f23d3aee"}, {"id": "j1-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j1-2"], "pointIds": ["pyjh.rat.005"], "prompt": "$-2.5$ 的相反数是多少？", "options": [{"id": "a", "text": "$2.5$", "feedback": "只有符号不同的两个数互为相反数。"}, {"id": "b", "text": "$-2.5$", "feedback": "一个数和它本身不是相反数（$0$ 除外）。"}, {"id": "c", "text": "$-\\frac25$", "feedback": "$2.5=\\frac52$，不是 $\\frac25$；而且相反数要改变符号。"}, {"id": "d", "text": "$\\frac25$", "feedback": "$2.5=\\frac52$，不是 $\\frac25$，分子分母弄反了。"}], "correct": "a", "answer": "$2.5$", "reasoning": ["只有符号不同的两个数互为相反数，在数轴上它们位于原点两侧、到原点距离相等。", "把 $-2.5$ 的负号去掉换成正号，得它的相反数。"], "contentVersion": "sha256:408c5d816b0fab3e4ec349efd1ce1ecdadfa774f0a880a3650db66c0868b0081"}, {"id": "j1-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j1-2"], "pointIds": ["pyjh.rat.004"], "prompt": "数轴上的点 $A$ 在原点左侧，到原点的距离是 $4$ 个单位长度。点 $A$ 表示的数是多少？", "options": [{"id": "a", "text": "$-4$", "feedback": "原点左侧的点表示负数，距离 $4$ 给出数值部分。"}, {"id": "b", "text": "$4$", "feedback": "$4$ 对应的点在原点右侧。"}, {"id": "c", "text": "$\\pm4$", "feedback": "题目已经说明点在原点左侧，只能是一个数。"}, {"id": "d", "text": "$-(-4)$", "feedback": "$-(-4)$ 表示的是正数，对应的点在原点右侧。"}], "correct": "a", "answer": "$-4$", "reasoning": ["数轴上原点左侧的点表示负数，右侧的点表示正数。", "点 $A$ 在左侧、距原点 $4$ 个单位长度，所以表示 $-4$。"], "contentVersion": "sha256:eaf44772af8777ee043e4d94b918e7034c30a55a3f79ca24c7b970a5a5cdb0e6"}, {"id": "j1-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j1-2"], "pointIds": ["pyjh.rat.007", "pyjh.rat.006"], "prompt": "在 $-\\frac23$，$-\\frac34$，$-0.7$，$0$ 这四个数中，最小的数是哪一个？", "options": [{"id": "a", "text": "$-\\frac23$", "feedback": "三个负数中它的绝对值最小，所以它在三个负数里最大。"}, {"id": "b", "text": "$-\\frac34$", "feedback": "两个负数比较，绝对值大的反而小；三个负数中它的绝对值最大。"}, {"id": "c", "text": "$-0.7$", "feedback": "把三个负数都化成小数再比较绝对值，它不是绝对值最大的。"}, {"id": "d", "text": "$0$", "feedback": "负数都小于 $0$。"}], "correct": "b", "answer": "$-\\frac34$", "reasoning": ["负数都小于 $0$，所以最小的数在三个负数中。", "绝对值：$\\frac23\\approx0.667$，$\\frac34=0.75$，$0.7$，其中 $\\frac34$ 最大。", "两个负数比较，绝对值大的反而小，所以 $-\\frac34$ 最小。"], "contentVersion": "sha256:594dd2e184f34913aa388248d478b9ec6e5b8d8573eb4453d021b72414336f82"}, {"id": "j1-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j1-2"], "pointIds": ["pyjh.rat.006", "pyjh.rat.005"], "prompt": "绝对值等于 $5$ 的数是什么？", "options": [{"id": "a", "text": "$5$", "feedback": "漏掉了原点另一侧到原点距离同样为 $5$ 的点。"}, {"id": "b", "text": "$-5$", "feedback": "漏掉了原点右侧的那个点。"}, {"id": "c", "text": "$5$ 和 $-5$", "feedback": "到原点距离为 $5$ 的点在原点两侧各有一个，它们表示的数互为相反数。"}, {"id": "d", "text": "$0$ 和 $5$", "feedback": "$|0|=0$，不等于 $5$。"}], "correct": "c", "answer": "$5$ 和 $-5$", "reasoning": ["绝对值等于 $5$，就是数轴上到原点距离为 $5$ 的点表示的数。", "这样的点在原点左右各一个，表示 $-5$ 和 $5$。"], "contentVersion": "sha256:18b842e651571bde6b8621c7a9869dceb1fc66c906feb638d2ebdd3d3ebe8ff5"}, {"id": "j1-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j1-1", "j1-2"], "pointIds": ["pyjh.rat.002", "pyjh.rat.003"], "prompt": "下列说法中，正确的是哪一项？", "options": [{"id": "a", "text": "$0$ 既不是正数，也不是负数", "feedback": "$0$ 是正数和负数的分界，它本身不属于任何一边。"}, {"id": "b", "text": "有理数分为正有理数和负有理数两类", "feedback": "这样分类漏掉了 $0$，$0$ 也是有理数。"}, {"id": "c", "text": "在一个数前面添上负号，得到的一定是负数", "feedback": "例如在 $-3$ 前添负号得 $-(-3)$，它是正数。"}, {"id": "d", "text": "整数都是正数", "feedback": "负整数和 $0$ 也是整数。"}], "correct": "a", "answer": "$0$ 既不是正数，也不是负数", "reasoning": ["$0$ 是正、负数的分界，既不是正数也不是负数。", "有理数按正负分为正有理数、$0$、负有理数三类；添负号得到的是原数的相反数，不一定是负数；整数包括正整数、$0$、负整数。"], "contentVersion": "sha256:ec3a04480d61fcdae5d9ceeab8d326bb1b6e6adf904b0a8492e5f185bbac4127"}, {"id": "j1-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j1-2"], "pointIds": ["pyjh.rat.004", "pyjh.rat.006"], "prompt": "数轴上到原点的距离小于 $3$ 的点中，表示整数的点共有几个？", "options": [{"id": "a", "text": "$2$ 个", "feedback": "只数了原点右侧的点。"}, {"id": "b", "text": "$3$ 个", "feedback": "原点本身也满足条件，左右两侧还各有点。"}, {"id": "c", "text": "$5$ 个", "feedback": "原点和左右两侧各两个整数点都满足，且距离为 $3$ 的点不算。"}, {"id": "d", "text": "$7$ 个", "feedback": "距离恰好为 $3$ 的点不满足「小于 $3$」。"}], "correct": "c", "answer": "$5$ 个", "reasoning": ["到原点距离小于 $3$，即绝对值小于 $3$。", "这样的整数是 $-2,-1,0,1,2$，共 $5$ 个；$\\pm3$ 到原点的距离等于 $3$，不算。"], "contentVersion": "sha256:52e6412af453f89528f29067aae6868506ae0b21effaea8e020310c822ccb40a"}, {"id": "j1-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j1-2"], "pointIds": ["pyjh.rat.005", "pyjh.rat.006", "pyjh.rat.007"], "prompt": "已知 $a$ 的相反数是 $-6$，$b$ 的绝对值是 $2$ 且 $b$ 是负数。把 $a$，$b$，$0$ 按从小到大的顺序排列，正确的是哪一项？", "options": [{"id": "a", "text": "$b<0<a$", "feedback": "先求出 $a$、$b$ 的具体值，再按数轴上从左到右的顺序排列。"}, {"id": "b", "text": "$a<0<b$", "feedback": "$a$ 的相反数是负数，$a$ 本身是正数；$b$ 是负数。"}, {"id": "c", "text": "$a<b<0$", "feedback": "$a$ 是正数，比 $0$ 大。"}, {"id": "d", "text": "$0<b<a$", "feedback": "题目说明 $b$ 是负数，比 $0$ 小。"}], "correct": "a", "answer": "$b<0<a$", "reasoning": ["$a$ 的相反数是 $-6$，所以 $a=6$。", "$|b|=2$ 且 $b<0$，所以 $b=-2$。", "数轴上从左到右依次是 $-2$，$0$，$6$，所以 $b<0<a$。"], "contentVersion": "sha256:6ec28f04e6250188fc2b111e264b13b1a39e27c79c01f1dea12f054c26e68a4f"}, {"id": "j1-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j1-1", "j1-2"], "pointIds": ["pyjh.rat.001", "pyjh.rat.002", "pyjh.rat.007"], "prompt": "某仓库以每天傍晚存货 $200$ 箱为基准，多于基准记为正。周一到周四傍晚的记录依次是 $+15$，$-8$，$0$，$-3$（单位：箱）。哪一天傍晚存货最少？", "options": [{"id": "a", "text": "周一", "feedback": "$+15$ 表示比基准多，是四天中最多的。"}, {"id": "b", "text": "周二", "feedback": "负数表示比基准少，四个记录中这个数最小。"}, {"id": "c", "text": "周三", "feedback": "$0$ 表示恰好等于基准，不是最少。"}, {"id": "d", "text": "周四", "feedback": "它也比基准少，但少得没有另一天多。"}], "correct": "b", "answer": "周二", "reasoning": ["记录越小，存货越少，只需比较 $+15$，$-8$，$0$，$-3$ 的大小。", "负数小于 $0$ 和正数；两个负数比较，$|-8|>|-3|$，所以 $-8<-3$。", "最小的记录是 $-8$，对应周二。"], "contentVersion": "sha256:d47c4d9636024882463a4f2cc143d3c1456d9c587174fd178a8bbc5013917dd2"}, {"id": "j1-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j1-2"], "pointIds": ["pyjh.rat.006", "pyjh.rat.007", "pyjh.rat.004"], "prompt": "若 $|x|=4$，且在数轴上表示 $x$ 的点位于表示 $-2$ 的点的左侧，则 $x$ 等于多少？", "options": [{"id": "a", "text": "$4$", "feedback": "表示 $4$ 的点在 $-2$ 的右侧，不符合位置条件。"}, {"id": "b", "text": "$-4$", "feedback": "绝对值为 $4$ 的数有两个，再用位置条件筛选。"}, {"id": "c", "text": "$\\pm4$", "feedback": "其中一个不满足「在 $-2$ 左侧」。"}, {"id": "d", "text": "$-2$", "feedback": "$|-2|=2$，不满足绝对值条件。"}], "correct": "b", "answer": "$-4$", "reasoning": ["$|x|=4$，所以 $x=4$ 或 $x=-4$。", "点在 $-2$ 的左侧，表示的数小于 $-2$；$4>-2$ 舍去，$-4<-2$ 符合。"], "contentVersion": "sha256:95ba3072442162f23bb4eb06a7e3434880acd37333ddb502fbf51886b1966a3b"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
