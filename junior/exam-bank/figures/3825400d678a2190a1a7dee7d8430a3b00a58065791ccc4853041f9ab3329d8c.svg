<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 350" role="img" aria-labelledby="title desc"><title id="title">圆的三条切线</title><desc id="desc">⊙O的上方有水平线段AB，与⊙O相切于E，B在E的右侧；下方有水平线段DC，与⊙O相切于G，C在G的右侧；线段BC从右侧与⊙O相切于F。图中连接了OB、OC。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:7 5}.dot{fill:currentColor;stroke:none}.s{fill:currentColor;fill-opacity:.3;stroke:none}.ss{fill:currentColor;fill-opacity:.3}.b{fill:#fff}.bl{stroke:#fff}.t{stroke-width:9}text{fill:currentColor;stroke:none;font-family:'Times New Roman',Times,'Songti SC','Noto Serif CJK SC',serif;font-size:24px}.bar1{stroke-width:16;stroke-linecap:butt}.bar2{stroke:#fff;stroke-width:12}.i{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.b{fill:#15272d}.bl{stroke:#15272d}.bar2{stroke:#15272d}}</style><circle cx="248" cy="180" r="130"/><path d="M65,50L345,50L422.23,310L65,310"/><path d="M345,50L248,180L422.23,310"/><circle cx="248" cy="180" r="5" class="dot"/><text x="45" y="58" text-anchor="middle" class="i">A</text><text x="45" y="318" text-anchor="middle" class="i">D</text><text x="248" y="38" text-anchor="middle" class="i">E</text><text x="349" y="38" text-anchor="middle" class="i">B</text><text x="396.62" y="140.98" text-anchor="middle" class="i">F</text><text x="248" y="342" text-anchor="middle" class="i">G</text><text x="426.23" y="342" text-anchor="middle" class="i">C</text><text x="228" y="210" text-anchor="middle" class="i">O</text></svg>
