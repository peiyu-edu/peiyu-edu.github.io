<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级上册 第四单元 11～20的认识 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p1a-u4-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级上册 第四单元 11～20的认识 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1a-u4-test", "sectionId": "p1a-u4-test", "unitId": "p1a-u4", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级上册 第四单元 11～20的认识 单元测评", "items": [{"id": "p1a-u4-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "10 个一是 □ 个十。", "answer": "1", "reasoning": ["10 根小棒捆成一捆，一捆就是 1 个十。", "所以 10 个一是 1 个十。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.001"], "contentVersion": "sha256:e0e0e39e362fc98f3673d31037c4daadeb8c4d08c363bd85ec4c5a2a29034539"}, {"id": "p1a-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "1 个十和 6 个一合起来是 □。", "answer": "16", "reasoning": ["1 个十是 10，再加 6 个一。", "合起来是 16。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.002"], "contentVersion": "sha256:30f3550258a6e097709ed091399546e78017cf6d08d641e9db189721ce77180e"}, {"id": "p1a-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "18 里面有 □ 个十和 □ 个一。", "answer": "1 个十和 8 个一", "reasoning": ["18 左边的 1 表示 1 个十。", "右边的 8 表示 8 个一。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.002"], "contentVersion": "sha256:a0114d0f4ed2650637d8b2a219e8173bdbbb95ef72d4c2dfccb694c2323d5078"}, {"id": "p1a-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "在 ○ 里填 >、< 还是 =？ 17 ○ 14", "answer": ">", "reasoning": ["数数时 14、15、16、17，17 在 14 的后面。", "17 比 14 大，写 17 > 14。"], "options": [{"id": "a", "text": ">", "feedback": "对。数数时 17 在 14 的后面，17 比 14 大。"}, {"id": "b", "text": "=", "feedback": "17 和 14 不一样大。"}, {"id": "c", "text": "<", "feedback": "开口朝着大的数。17 比 14 大，开口要朝 17。"}], "correct": "a", "pointIds": ["pyps.p1a.u4.003"], "contentVersion": "sha256:45c15d979ae98e1c78ce9107e917fad5dd36243e010b0a0f9a361bcff6e21138"}, {"id": "p1a-u4-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "10 + 7 = □", "answer": "17", "reasoning": ["1 个十和 7 个一合起来。", "是 17，所以 10 + 7 = 17。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.004"], "contentVersion": "sha256:ac9b51dbd8dbd327125bce4af2878d399ce2e3eef2aaf301a073c5fec218eb06"}, {"id": "p1a-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "15 − 5 = □", "answer": "10", "reasoning": ["15 是 1 个十和 5 个一。", "去掉 5 个一，还剩 1 个十，就是 10。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.004"], "contentVersion": "sha256:92437c933811680bfbcae60b19b41c5ef3a5ed51158ed8601ae231155d1d003d"}, {"id": "p1a-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "13 + 4 = □", "answer": "17", "reasoning": ["13 是 1 个十和 3 个一，先算一和一：3 + 4 = 7。", "1 个十和 7 个一是 17。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.004"], "contentVersion": "sha256:6f0ee335fa6652e15526c6e03d346475984099bffd9e65b1f3270f7f5040474a"}, {"id": "p1a-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "19 − 6 = □", "answer": "13", "reasoning": ["19 是 1 个十和 9 个一，先算一和一：9 − 6 = 3。", "1 个十和 3 个一是 13。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.004"], "contentVersion": "sha256:4d7efcfd0501d7f6906c89abeabc9bf68d64832aec5013671d69c1b4b0dccc18"}, {"id": "p1a-u4-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "在算式 12 + 5 = 17 里，12 和 5 叫什么？", "answer": "加数", "reasoning": ["加法算式里，加号两边的数叫加数，得数叫和。", "12 和 5 是加数，17 是和。"], "options": [{"id": "a", "text": "和", "feedback": "等号后面的 17 才叫和。"}, {"id": "b", "text": "减数", "feedback": "这是加法算式，没有减数。"}, {"id": "c", "text": "加数", "feedback": "对。加号两边的 12 和 5 都叫加数。"}], "correct": "c", "pointIds": ["pyps.p1a.u4.005"], "contentVersion": "sha256:e371e1d9fb0e882e4c7a02acc6d1004640d90aa11eb971faeff80c61d1b235eb"}, {"id": "p1a-u4-t10", "number": 10, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "比 15 大、又比 18 小的数有哪些？", "answer": "16、17", "reasoning": ["按顺序数：15、16、17、18。", "在 15 和 18 中间的是 16 和 17。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.003"], "contentVersion": "sha256:220194b25cbaa45a8cad62a7a4680ae43d058ad3663fbba9c76a23162178f6ec"}, {"id": "p1a-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小朋友排成一队。从前往后数，丽丽排第 5，强强排第 9。丽丽和强强之间有几人？", "answer": "3 人", "reasoning": ["丽丽和强强之间的人，排第 6、第 7、第 8。", "丽丽和强强自己不算，一共 3 人。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.006"], "contentVersion": "sha256:b8de3aa724107f6982014f2c6d476f69be3078b3492a5b188d13faabc88a5298", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 115\" role=\"img\" aria-label=\"仅画题给两端，中间数量未知，用省略号表示\" style=\"max-width:280px\"><circle cx=\"50\" cy=\"38\" r=\"17\" style=\"fill:var(--card);stroke:var(--a);stroke-width:2\"/><text x=\"50\" y=\"44\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">5<\/text><circle cx=\"230\" cy=\"38\" r=\"17\" style=\"fill:var(--card);stroke:var(--a);stroke-width:2\"/><text x=\"230\" y=\"44\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">9<\/text><text x=\"140\" y=\"45\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:22px\">……<\/text><text x=\"50\" y=\"87\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">丽丽<\/text><text x=\"230\" y=\"87\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">强强<\/text><\/svg>"}, {"id": "p1a-u4-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "妈妈买了 14 个鸡蛋，做饭用去 3 个。还剩几个鸡蛋？", "answer": "14 − 3 = 11（个）", "reasoning": ["一共 14 个，用去的 3 个要去掉，用减法。", "4 − 3 = 1，1 个十和 1 个一是 11：14 − 3 = 11（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u4.004"], "contentVersion": "sha256:040e1be8dff87d7af89eee1ebbfb9436d97a7eeb09c5268c08eb0cfb428ad939"}], "contentVersion": "sha256:35e9eb266e5becb1d9db11101af659c5943dd660a4c06516d0cab899a69788f7"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
