<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 472" width="530" height="472" role="img" aria-labelledby="title desc">
<title id="title">旗杆与标杆的影长</title>
<desc id="desc">水平地面上，左边是直立的旗杆 AB，A 为顶端，B 为底端，顶端画有一面小旗；右边是直立的标杆 DE，D 为顶端，E 为底端。B、C、E、F 从左到右在同一直线上。两条互相平行、带箭头的虚线表示太阳光：一条过 A、C，一条过 D、F。AB⊥BC，DE⊥EF。图中未标数值。</desc>
<style>text{fill:#17202a;font-size:30px}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic}.r{font-family:'Times New Roman',Georgia,serif}.z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
