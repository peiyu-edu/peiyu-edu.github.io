<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 560" role="img" aria-labelledby="title desc"><title id="title">包装盒ABCD-EFGH的直观图</title><desc id="desc">底面为正方形ABCD，在四条边上分别立起正三角形EAB、FBC、GCD、HDA，顶点E、F、G、H依次连成四边形EFGH。看得见的棱用实线画出：AB、BC、AE、EB、BF、FC、AH、HE、EF、FG、GH；被挡住的棱用虚线画出：AD、DC、DH、DG、GC。</desc><style>path,circle{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M52,508L403,508" /><path d="M403,508L527,382" /><path d="M52,508L227,202" /><path d="M227,202L403,508" /><path d="M403,508L468,138" /><path d="M468,138L527,382" /><path d="M52,508L117,135" /><path d="M117,135L227,202" /><path d="M227,202L468,138" /><path d="M468,138L355,72" /><path d="M355,72L117,135" /><path d="M52,508L175,382" stroke-dasharray="8 6" /><path d="M175,382L527,382" stroke-dasharray="8 6" /><path d="M175,382L117,135" stroke-dasharray="8 6" /><path d="M175,382L355,72" stroke-dasharray="8 6" /><path d="M355,72L527,382" stroke-dasharray="8 6" /><text x="40" y="538" text-anchor="middle" font-size="26" font-style="italic">A</text><text x="403" y="540" text-anchor="middle" font-size="26" font-style="italic">B</text><text x="551" y="390" text-anchor="middle" font-size="26" font-style="italic">C</text><text x="193" y="414" text-anchor="middle" font-size="26" font-style="italic">D</text><text x="229" y="186" text-anchor="middle" font-size="26" font-style="italic">E</text><text x="490" y="140" text-anchor="middle" font-size="26" font-style="italic">F</text><text x="355" y="58" text-anchor="middle" font-size="26" font-style="italic">G</text><text x="95" y="135" text-anchor="middle" font-size="26" font-style="italic">H</text></svg>