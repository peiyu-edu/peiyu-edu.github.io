那么大，4 个那么大的邮票太大了。"}, {"id": "c", "text": "平方米", "feedback": "4 平方米比一张床还大，太大了。"}], "correct": "a", "pointIds": ["pyps.p3b.u4.002"], "contentVersion": "sha256:d5c77a685eb333a291828798c85b51a7c489c89f94995a1ba3edee88a76f93c3"}, {"id": "p3b-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个长方形，长 9 厘米，宽 6 厘米。它的面积是多少？", "answer": "9 × 6 = 54（平方厘米）", "reasoning": ["长方形的面积 = 长 × 宽。", "9 × 6 = 54（平方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003"], "contentVersion": "sha256:0affd1c6b0694fdaaeba5473a30300379f98968a5c1abe8a7f34fe1961a198a4", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形及给定长度和面积条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">长 9 厘米<\/text><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">宽 6 厘米<\/text><\/svg>"}, {"id": "p3b-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个正方形，边长 8 米。它的面积是多少？", "answer": "8 × 8 = 64（平方米）", "reasoning": ["正方形的面积 = 边长 × 边长。", "8 × 8 = 64（平方米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003"], "contentVersion": "sha256:40b97a3b0d5eb85e4a5c5d3410d80e059688ce0a510741118daccd2108509e4f", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形及给定长度和面积条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"85\" y=\"38\" width=\"110\" height=\"110\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">边长 8 米<\/text><text x=\"140\" y=\"174\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><\/svg>"}, {"id": "p3b-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "图形甲正好铺满 12 个同样大的小方格，图形乙正好铺满 10 个这样的小方格。哪个图形的面积大？", "answer": "甲大", "reasoning": ["用同样大的小方格比面积，看谁占的格子多。", "甲 12 格，乙 10 格，12 > 10，甲的面积大。"], "options": [{"id": "a", "text": "一样大", "feedback": "12 格和 10 格不一样多。"}, {"id": "b", "text": "乙大", "feedback": "乙只有 10 格，比甲的 12 格少。"}, {"id": "c", "text": "甲大", "feedback": "对。小方格一样大，甲占的格子多，面积大。"}], "correct": "c", "pointIds": ["pyps.p3b.u4.001"], "contentVersion": "sha256:1c5881357a71bd01a4e34090ae7c780b9604e6dcae9704d2e51dceadfc05097b", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 185\" role=\"img\" aria-label=\"图形甲铺12个小方格，图形乙铺10个同样小方格\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"20\" y=\"20\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"45\" y=\"20\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"70\" y=\"20\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"95\" y=\"20\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"20\" y=\"45\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"45\" y=\"45\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"70\" y=\"45\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"95\" y=\"45\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"20\" y=\"70\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"45\" y=\"70\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"70\" y=\"70\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"95\" y=\"70\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"195\" y=\"20\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"220\" y=\"20\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"195\" y=\"45\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"220\" y=\"45\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"195\" y=\"70\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"220\" y=\"70\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"195\" y=\"95\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"220\" y=\"95\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"195\" y=\"120\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"220\" y=\"120\" width=\"25\" height=\"25\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"70\" y=\"161\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">甲<\/text><text x=\"220\" y=\"161\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">乙<\/text><\/svg>"}, {"id": "p3b-u4-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "填空：3 平方米 = □ 平方分米；500 平方厘米 = □ 平方分米", "answer": "300；5", "reasoning": ["1 平方米 = 100 平方分米，3 平方米 = 300 平方分米。", "100 平方厘米 = 1 平方分米，500 平方厘米里有 5 个 100 平方厘米，是 5 平方分米。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.004"], "contentVersion": "sha256:35f0e5231f832fc185c0610e315603584b6577dfa94ccf35516b6c9773614b9e"}, {"id": "p3b-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个正方形边长 4 厘米。关于它的周长和面积，下面哪句话对？", "answer": "周长 16 厘米，面积 16 平方厘米，两个量不能比大小", "reasoning": ["周长：4 × 4 = 16（厘米）。面积：4 × 4 = 16（平方厘米）。", "周长是长度，面积是面的大小，单位不同，不能比大小。"], "options": [{"id": "a", "text": "周长 16 厘米，面积 16 平方厘米，两个量不能比大小", "feedback": "对。周长是长度，面积是面的大小，单位不同，不能比。"}, {"id": "b", "text": "周长和面积相等", "feedback": "数相同，但一个是厘米、一个是平方厘米，意思不一样，不能说相等。"}, {"id": "c", "text": "面积比周长大", "feedback": "周长和面积不是同一种量，不能比大小。"}], "correct": "a", "pointIds": ["pyps.p3b.u4.003", "pyps.p3b.u4.002", "pyps.p3b.u3.003"], "contentVersion": "sha256:a5d4f1556c2f2d6c1447060dd5bf69938ca930eb6586a76c64853c54137f677a", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形及给定长度和面积条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"85\" y=\"38\" width=\"110\" height=\"110\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">边长 4 厘米<\/text><text x=\"140\" y=\"174\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><\/svg>"}, {"id": "p3b-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个长方形的面积是 48 平方厘米，长是 8 厘米。它的宽是多少厘米？", "answer": "6 厘米", "reasoning": ["面积 = 长 × 宽，8 × 宽 = 48。", "想六八四十八，宽是 6 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003"], "contentVersion": "sha256:b385f91872acde5579233bed8f06e4860ccd312ac0824b5cecd5493516ba27ff", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形及给定长度和面积条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">长 8 厘米<\/text><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">面积48平方厘米<\/text><\/svg>"}, {"id": "p3b-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪个换算是对的？", "answer": "1 平方分米 = 100 平方厘米", "reasoning": ["1 平方分米是边长 1 分米的正方形，边长也就是 10 厘米。", "面积是 10 × 10 = 100（平方厘米）。"], "options": [{"id": "a", "text": "1 平方米 = 10 平方分米", "feedback": "边长 1 米 = 10 分米，面积是 10 × 10 = 100 平方分米。"}, {"id": "b", "text": "1 平方分米 = 10 平方厘米", "feedback": "长度单位差 10，面积单位差 100。"}, {"id": "c", "text": "1 平方分米 = 100 平方厘米", "feedback": "对。边长 1 分米就是 10 厘米，10 × 10 = 100。"}], "correct": "c", "pointIds": ["pyps.p3b.u4.004"], "contentVersion": "sha256:7c7b6206f0f0bd4a33cc5626d43a4f8df331acec3a102f062370db1d83b3bd56"}, {"id": "p3b-u4-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一块长方形菜地，长 15 米，宽 6 米。它的面积和周长各是多少？", "answer": "面积 90 平方米，周长 42 米", "reasoning": ["面积：15 × 6 = 90（平方米）。", "周长：(15 + 6) × 2 = 42（米）。", "面积用平方米，周长用米，别把单位写混。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003", "pyps.p3b.u3.003"], "contentVersion": "sha256:a557f62e75a10f5089f44530157fb18c3eb591ec1e37c8c47f072b11cf4039f6", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形及给定长度和面积条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">长 15 米<\/text><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">宽 6 米<\/text><\/svg>"}, {"id": "p3b-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "用边长 2 分米的正方形方砖，铺一块长 8 分米、宽 6 分米的长方形地面。正好要多少块？", "answer": "12 块", "reasoning": ["沿长边一排能铺 8 ÷ 2，是 4 块；沿宽边能铺 6 ÷ 2，是 3 排。", "4 × 3 = 12（块）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003", "pyps.p3b.u4.001"], "contentVersion": "sha256:c02fe4a75c76367b15a52b414bd941d5683159171f07012d97f2965c5c668e8a", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形及给定长度和面积条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">长 8 分米<\/text><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">宽 6 分米<\/text><text x=\"140\" y=\"91.5\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">方砖边长2分米<\/text><\/svg>"}, {"id": "p3b-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一张长方形纸，长 9 厘米，宽 5 厘米。从中剪下一个最大的正方形，剩下部分的面积是多少？", "answer": "20 平方厘米", "reasoning": ["最大的正方形边长和宽一样，是 5 厘米，面积 5 × 5 = 25（平方厘米）。", "整张纸面积 9 × 5 = 45（平方厘米）。", "剩下：45 − 25 = 20（平方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003"], "contentVersion": "sha256:b663ecbcaf8c5521e4b0722d6d2053342eb3f6c4ffb1e1234f960ad1031f6e8b", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"9厘米乘5厘米纸，正方形剪裁由学生确定\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">长 9 厘米<\/text><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">宽 5 厘米<\/text><\/svg>"}], "contentVersion": "sha256:a19c550559e38c19c3ca0fe4465a98f80dfcb9ba39ab0375f3d47260012cdde7"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a>
