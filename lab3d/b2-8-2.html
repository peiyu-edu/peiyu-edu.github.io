        <ol class="l3-steps">
          <li>上方左边一组是水平放置的平面图形，右边一组是立体图形。</li>
          <li>点「画成直观图」，或拖「画法进度」：镜头转到正前方，同时把进深方向斜成 \(45^\circ\)、长度压成一半，实物一步步变成课本上的直观图。</li>
          <li>平面图形一开始是<b>从正上方往下看</b>，看到的就是它的真实形状。</li>
          <li>拖动尺寸滑块，右边的长度、面积和面积比马上重算；被挡住的棱画成虚线。</li>
        </ol>
