<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级上册 第一单元 万以上数的认识 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p4a-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>四年级上册 第一单元 万以上数的认识 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p4a-u1-test", "sectionId": "p4a-u1-test", "unitId": "p4a-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "四年级上册 第一单元 万以上数的认识 单元测评", "items": [{"id": "p4a-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "10 个一百万是多少？", "answer": "一千万", "reasoning": ["相邻两个计数单位之间的进率是 10。", "百万的下一个计数单位是千万，所以 10 个一百万是一千万。"], "options": [{"id": "a", "text": "十万", "feedback": "十万比一百万小。10 个一万才是十万。"}, {"id": "b", "text": "一千万", "feedback": "对。一百万、一百万地数，数到 10 个满十进一，就是一千万。"}, {"id": "c", "text": "一亿", "feedback": "10 个一千万才是一亿。一百万和一亿之间还隔着千万。"}], "correct": "b", "pointIds": ["pyps.p4a.u1.001"], "contentVersion": "sha256:f0b90cc7d2b36c5d06996b4bc571e615587e9ed7b88d92bdc3ad820479ab7f30"}, {"id": "p4a-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "在 52830000 中，数字 2 在什么位上？表示多少？", "answer": "百万位，表示 2 个百万", "reasoning": ["52830000 是八位数，从右往左依次是个位、十位、百位、千位、万位、十万位、百万位、千万位。", "2 在第 7 位，也就是百万位，表示 2 个百万。"], "options": [{"id": "a", "text": "十万位，表示 2 个十万", "feedback": "十万位是第 6 位，上面是 8。"}, {"id": "b", "text": "千万位，表示 2 个千万", "feedback": "从右往左数，千万位是第 8 位，上面是 5，不是 2。"}, {"id": "c", "text": "百万位，表示 2 个百万", "feedback": "对。2 在从右数的第 7 位，是百万位。"}], "correct": "c", "pointIds": ["pyps.p4a.u1.002"], "contentVersion": "sha256:ce7ec61cae79e8c12e503a75ed36d23165ef3133adbbc5b009c275f24eb0df32"}, {"id": "p4a-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪句话是对的？", "answer": "0 是自然数", "reasoning": ["一个物体也没有，用 0 表示；0 也是自然数。", "最小的自然数是 0，自然数一个接一个，没有最大的。"], "options": [{"id": "a", "text": "最大的自然数是一亿", "feedback": "一亿后面还有一亿零一、一亿零二……自然数没有最大的。"}, {"id": "b", "text": "最小的自然数是 1", "feedback": "0 也是自然数，它比 1 小。"}, {"id": "c", "text": "0 是自然数", "feedback": "对。表示物体个数的 0、1、2、3……都是自然数。"}], "correct": "c", "pointIds": ["pyps.p4a.u1.003"], "contentVersion": "sha256:90281855437e9e5890bbf96d0b0a4ad95417756ef76a10323c5ce319749f7272"}, {"id": "p4a-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "读出 30060500 这个数。", "answer": "三千零六万零五百", "reasoning": ["从右往左每四位分一级：3006 | 0500。", "先读万级：三千零六万；再读个级：0500 读作零五百。", "合起来是三千零六万零五百。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u1.004"], "contentVersion": "sha256:b0996d217d2ac73a14a363c8a5ba99792c36b819a8a363f425aa286bb1eebd54"}, {"id": "p4a-u1-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "写出这个数：四千零二十万七千。", "answer": "40207000", "reasoning": ["万级是四千零二十，写作 4020；个级是七千，写作 7000。", "合起来写作 40207000。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u1.005"], "contentVersion": "sha256:0f981fe18421d912707379e7e812138195c093375a3b394f8eae3040ff2d3452"}, {"id": "p4a-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "把 6700000 改写成用「万」作单位的数；把 900000000 改写成用「亿」作单位的数。", "answer": "670万，9亿", "reasoning": ["6700000 的个级是四个 0，去掉它们，后面写「万」：670万。", "900000000 的亿级是 9，亿位后面的 8 个 0 去掉，写「亿」：9亿。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u1.010"], "contentVersion": "sha256:fa3bbb28e23dee80e608ac03aaefadb5d986dcea2e0943c2eb42abaf76afbb03"}, {"id": "p4a-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用四舍五入法，把 3849600 省略万位后面的尾数，约是多少万？", "answer": "385万", "reasoning": ["万位是 4，看它右边的千位：千位是 9。", "9 比 5 大，向万位进 1，384 万变成 385 万。", "所以 3849600 约是 385万。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u1.011"], "contentVersion": "sha256:30100de44d3f67c34c9eb3c98e4f852a0f2f5c8985da4fb0b06ec1f2b535d258"}, {"id": "p4a-u1-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "读出 304000060000 这个数。", "answer": "三千零四十亿零六万", "reasoning": ["从右往左每四位分一级：3040 | 0006 | 0000。", "亿级读作三千零四十亿，万级 0006 读作零六万，个级全是 0，不读。", "合起来是三千零四十亿零六万。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u1.007"], "contentVersion": "sha256:ce62985c22574b307ce7653672d521ea7da297f511cbf0d8edf78a4ea1ff89b2"}, {"id": "p4a-u1-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "2706□500 用四舍五入法省略万位后面的尾数，约是 2707 万。□里可以填哪些数字？", "answer": "5、6、7、8、9", "reasoning": ["约成 2707 万，比原来万级上的 2706 多了 1，说明千位向万位进了 1。", "进 1 要求千位上的数是 5 或比 5 大。", "所以□里可以填 5、6、7、8、9。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u1.012"], "contentVersion": "sha256:d06870d031ef9855f07940d32dad97c5e1f50380463ace85b6a3a8d60fc08c25"}, {"id": "p4a-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个八位数，千万位上是 7，十万位上是 4，其余各位都是 0。这个数写作多少？改写成用「万」作单位的数是多少？", "answer": "70400000，7040万", "reasoning": ["八位数最高位是千万位。千万位写 7，百万位写 0，十万位写 4，万位写 0，个级四位都写 0：70400000。", "个级都是 0，是整万数，去掉个级的四个 0，写成 7040万。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u1.005", "pyps.p4a.u1.002", "pyps.p4a.u1.010"], "contentVersion": "sha256:d17100786946608a1f14d5dd5cf7634a5981f6c00e97f5220b4800a03d36708f"}, {"id": "p4a-u1-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一个数省略亿位后面的尾数约是 5 亿。下面哪个数可能是它？", "answer": "549000000", "reasoning": ["省略亿位后面的尾数，看千万位。", "549000000：千万位是 4，舍去，约是 5 亿。", "559000000 约是 6 亿，440000000 约是 4 亿。"], "options": [{"id": "a", "text": "549000000", "feedback": "对。亿位是 5，千万位是 4，4 比 5 小，舍去，约是 5 亿。"}, {"id": "b", "text": "559000000", "feedback": "千万位是 5，要向亿位进 1，约是 6 亿。"}, {"id": "c", "text": "440000000", "feedback": "千万位是 4，舍去，约是 4 亿，不是 5 亿。"}], "correct": "a", "pointIds": ["pyps.p4a.u1.011", "pyps.p4a.u1.009"], "contentVersion": "sha256:fe373da2ccc8a499f52efb677dfa2f7709fe79b6f8b8b1e970d509149eb78eb8"}], "contentVersion": "sha256:3bacceaab9566ccc37e3404dda9f93c49da14beb93f125f64f775724b331f9ce"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
