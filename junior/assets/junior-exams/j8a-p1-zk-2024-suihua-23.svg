<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 262" width="376" height="262" role="img" aria-labelledby="title desc">
<title id="title">三角形 ABC</title>
<desc id="desc">一个没有特殊标记的三角形 ABC：A 在上方偏右，B 在左下方，C 在右下方，BC 水平。图中没有标注长度和角度。</desc>
<style>text{fill:#17202a;font-size:30px}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic}.r{font-family:'Times New Roman',Georgia,serif}.z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="376" height="262" fill="white"/>
<polygon points="264,48 45,240 327,240" fill="none" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/>
<text class="m" x="270.0" y="36.0" text-anchor="middle">A</text>
<text class="m" x="22.0" y="250.0" text-anchor="middle">B</text>
<text class="m" x="350.0" y="250.0" text-anchor="middle">C</text>
</svg>
