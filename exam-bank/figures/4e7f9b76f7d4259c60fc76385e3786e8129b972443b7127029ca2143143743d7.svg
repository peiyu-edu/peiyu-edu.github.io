<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 446" role="img" aria-labelledby="title desc"><title id="title">程序框图</title><desc id="desc">开始；输入a=1, b=1, n=1；执行b=b+2a；执行a=b−a, n=n+1；判断|b²/a²−2|&lt;0.01，否则返回到b=b+2a之前，是则输出n；结束。</desc><style>path,rect,polygon{fill:none;stroke:currentColor;stroke-width:1.8}.ar{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,'Noto Serif CJK SC',serif;font-size:17px}.s{font-size:15px}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style>
<rect x="110" y="10" width="80" height="34" rx="17"/><text x="150" y="33" text-anchor="middle">开始</text>
<path d="M150,44V58"/><polygon class="ar" points="145,56 155,56 150,66"/>
<polygon points="60,100 80,66 250,66 230,100"/><text x="155" y="89" text-anchor="middle">输入<tspan font-style="italic">a</tspan>=1, <tspan font-style="italic">b</tspan>=1, <tspan font-style="italic">n</tspan>=1</text>
<path d="M150,100V120"/><polygon class="ar" points="145,118 155,118 150,128"/>
<rect x="105" y="128" width="90" height="32"/><text x="150" y="150" text-anchor="middle" font-style="italic">b=b+2a</text>
<path d="M150,160V170"/><polygon class="ar" points="145,168 155,168 150,178"/>
<rect x="80" y="178" width="140" height="32"/><text x="150" y="200" text-anchor="middle"><tspan font-style="italic">a=b</tspan>−<tspan font-style="italic">a</tspan>, <tspan font-style="italic">n=n</tspan>+1</text>
<path d="M150,210V224"/><polygon class="ar" points="145,222 155,222 150,232"/>
<polygon points="150,232 250,274 150,316 50,274"/>
<path d="M104,255V295M158,255V295M109,272H131"/>
<text x="120" y="266" text-anchor="middle" class="s"><tspan font-style="italic">b</tspan><tspan dy="-6" font-size="10">2</tspan></text>
<text x="120" y="292" text-anchor="middle" class="s"><tspan font-style="italic">a</tspan><tspan dy="-6" font-size="10">2</tspan></text>
<text x="134" y="278" class="s">−2</text><text x="162" y="278" class="s">&lt;0.01</text>
<path d="M50,274H20V114H140"/><polygon class="ar" points="140,109 140,119 150,114"/><text x="24" y="298">否</text>
<path d="M150,316V336"/><polygon class="ar" points="145,334 155,334 150,344"/><text x="160" y="336">是</text>
<polygon points="95,376 115,344 215,344 195,376"/><text x="155" y="366" text-anchor="middle">输出<tspan font-style="italic">n</tspan></text>
<path d="M150,376V390"/><polygon class="ar" points="145,388 155,388 150,398"/>
<rect x="110" y="398" width="80" height="34" rx="17"/><text x="150" y="421" text-anchor="middle">结束</text>
</svg>
