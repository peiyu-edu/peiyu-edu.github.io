[{"id": "a", "text": "不是，因为下面没有封口", "feedback": "轴对称图形不一定要封口，关键是对折后能否完全重合。"}, {"id": "b", "text": "是，沿上端交点和横线中点所在的直线对折能完全重合", "feedback": "对。两条斜线能重合，横线的左右两半也能重合。"}, {"id": "c", "text": "不能确定，要先知道图样有多大", "feedback": "只要保持题中三条线段的位置关系，放大或缩小都不影响对折后完全重合。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.001"], "contentVersion": "sha256:a5e25f30e5124a233afc16e847d407acd7da74046449fcd7b3ee3cb64acaade9", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 175\" role=\"img\" aria-label=\"两条等长斜线顶端相接，中点用水平线连接的A形\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><path d=\"M70 140L140 25L210 140M105 82.5H175\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><\/svg>"}, {"id": "p3b-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一个正方形有几条对称轴？", "answer": "4 条", "reasoning": ["正方形横着对折、竖着对折都能完全重合，有 2 条。", "沿两个相对的角斜着对折也能完全重合，又有 2 条。", "一共 4 条。"], "options": [{"id": "a", "text": "4 条", "feedback": "对。横着、竖着对折各 1 条，沿两条斜线对折各 1 条。"}, {"id": "b", "text": "2 条", "feedback": "还漏了沿两条斜线对折的 2 条。"}, {"id": "c", "text": "1 条", "feedback": "正方形不止一种对折方法能完全重合。"}], "correct": "a", "pointIds": ["pyps.p3b.u1.002"], "contentVersion": "sha256:0bd000854ad718dffe39c26b5495c86fa926336dc497078e02d97d23899fc984", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"一个正方形，未画对称轴\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"85\" y=\"38\" width=\"110\" height=\"110\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><text x=\"140\" y=\"174\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><\/svg>"}, {"id": "p3b-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪一个是平移现象？", "answer": "电梯在楼里上下运动", "reasoning": ["平移是沿着直线移动，物体的朝向不变。", "电梯上下运动是平移；风车和指针都在绕着一个点转，是旋转。"], "options": [{"id": "a", "text": "钟面上的指针走动", "feedback": "指针绕着中心转，是旋转。"}, {"id": "b", "text": "电梯在楼里上下运动", "feedback": "对。电梯沿直线移动，朝向不变，是平移。"}, {"id": "c", "text": "风车转动", "feedback": "风车绕着中间转，是旋转。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.003", "pyps.p3b.u1.004"], "contentVersion": "sha256:c0bef330a9e02c3a87e68e9cec536d991e787b36910b0a1814ec66205183b5ad", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"物体朝向不变沿直线移动\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"20\" y=\"55\" width=\"45\" height=\"45\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"205\" y=\"55\" width=\"45\" height=\"45\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><path d=\"M78 78L190 78\" style=\"stroke:var(--b);fill:none;stroke-width:2\" /><path d=\"M181.896 74.0853L190 78L181.896 81.9147\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"140\" y=\"136\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">形状和朝向保持不变<\/text><\/svg>"}, {"id": "p3b-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "钟面上的分针从指着 12 走到指着 3，分针是怎样运动的？", "answer": "顺时针旋转", "reasoning": ["分针绕着钟面中心转，是旋转。", "钟表指针走的方向叫顺时针，所以是顺时针旋转。"], "options": [{"id": "a", "text": "逆时针旋转", "feedback": "逆时针是和钟表指针走的方向相反。"}, {"id": "b", "text": "顺时针旋转", "feedback": "对。分针和钟表指针走的方向一样，是顺时针。"}, {"id": "c", "text": "平移", "feedback": "分针绕着钟面中心转，不是沿直线移动。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.004"], "contentVersion": "sha256:9e85543ebe3209c9c29bc68161812ec2d35de70f39726dfe49a4547b91588fff", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 195\" role=\"img\" aria-label=\"分针从12走到3的位置\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><circle cx=\"140\" cy=\"86\" r=\"62\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\" /><text x=\"164\" y=\"49.4308\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">1<\/text><text x=\"181.569\" y=\"67\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">2<\/text><text x=\"188\" y=\"91\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">3<\/text><text x=\"181.569\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">4<\/text><text x=\"164\" y=\"132.569\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">5<\/text><text x=\"140\" y=\"139\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">6<\/text><text x=\"116\" y=\"132.569\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">7<\/text><text x=\"98.4308\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">8<\/text><text x=\"92\" y=\"91\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">9<\/text><text x=\"98.4308\" y=\"67\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">10<\/text><text x=\"116\" y=\"49.4308\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">11<\/text><text x=\"140\" y=\"43\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">12<\/text><path d=\"M140 86L140 44\" style=\"stroke:var(--b);fill:none;stroke-width:2\" /><path d=\"M140 86L140 56.86\" style=\"stroke:var(--fg);fill:none;stroke-width:2\" /><circle cx=\"140\" cy=\"86\" r=\"3\" style=\"fill:var(--fg);stroke:var(--fg);stroke-width:2\" /><path d=\"M140 86L182 86\" style=\"stroke:var(--b);fill:none;stroke-width:2\" /><text x=\"140\" y=\"173\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">分针：12 → 3<\/text><\/svg>"}, {"id": "p3b-u1-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个长方形（长和宽不一样长）有几条对称轴？", "answer": "2 条", "reasoning": ["长方形横着对折、竖着对折都能完全重合。", "沿两个相对的角斜着对折，两边对不上。", "所以长方形有 2 条对称轴。"], "options": [{"id": "a", "text": "2 条", "feedback": "对。横着对折、竖着对折各 1 条。"}, {"id": "b", "text": "1 条", "feedback": "横着、竖着对折都能完全重合，有 2 条。"}, {"id": "c", "text": "4 条", "feedback": "斜着沿两个角对折，长方形两边对不上，所以只有 2 条。"}], "correct": "a", "pointIds": ["pyps.p3b.u1.002"], "contentVersion": "sha256:3c00e9d159956fa37081524113851bb4afb4eabd15b5b2ec80745e8ed56f506a", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"长宽不相等的长方形，未画对称轴\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><\/svg>"}, {"id": "p3b-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用线段画一个「中」形图样：先画一个长和宽不一样长的长方形边框，再画一条竖线穿过上、下两条边的中点，竖线向上、向下伸出边框的长度相同。沿下面哪条线对折，两边能完全重合？", "answer": "中间竖线所在的直线", "reasoning": ["题中的竖线穿过上、下两条边的中点，把长方形边框分成左右相同的两半。", "沿中间竖线对折，左右边框重合，上、下两边各自的两半重合，中间竖线也重合。"], "options": [{"id": "a", "text": "左边框所在的直线", "feedback": "沿左边框对折，右侧的图样会折到左边空白处，不能完全重合。"}, {"id": "b", "text": "中间竖线所在的直线", "feedback": "对。长方形的左右两半能重合，中间竖线也重合。"}, {"id": "c", "text": "右边框所在的直线", "feedback": "沿右边框对折，左侧的图样会折到右边空白处，不能完全重合。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.001"], "contentVersion": "sha256:2933bdd226bcc63aba7b28c257645d0084874466e341fa973d9cc6001bd03c47", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"长宽不同的边框，中线竖直穿过上下中点，伸出等长\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"65\" y=\"50\" width=\"150\" height=\"70\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><path d=\"M140 20L140 150\" style=\"stroke:var(--fg);fill:none;stroke-width:2\" /><\/svg>"}, {"id": "p3b-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一扇门的一侧用合页固定在门框上。关门时，这扇门绕着装合页的那条边转动。它的运动属于哪一种？", "answer": "旋转", "reasoning": ["题中门的一侧用合页固定，关门时门绕着这一侧转动。", "这种绕着固定的一侧转动的运动是旋转。"], "options": [{"id": "a", "text": "旋转", "feedback": "对。门绕着门轴转动，是旋转。"}, {"id": "b", "text": "平移", "feedback": "这扇门绕着装合页的一侧转动，是旋转；沿直轨道滑动的推拉门才是平移。"}, {"id": "c", "text": "既不是平移，也不是旋转", "feedback": "门绕着一条边（门轴）转动，是旋转。"}], "correct": "a", "pointIds": ["pyps.p3b.u1.004", "pyps.p3b.u1.003"], "contentVersion": "sha256:2f0bf1fe1d685fabe65d138f6fcabf3425e5e5f360b10462df715bba1d8e1759", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"门绕固定的合页边转动\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"40\" y=\"25\" width=\"155\" height=\"115\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\" /><path d=\"M40 25L115 50V165L40 140Z\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><circle cx=\"105\" cy=\"105\" r=\"4\" style=\"fill:var(--b);stroke:var(--fg);stroke-width:2\" /><text x=\"207\" y=\"148\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">合页在左<\/text><\/svg>"}, {"id": "p3b-u1-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "把长方形纸条横放，每次都把右半边向左对折，边缘叠齐，共折 2 次。在四层纸上画半个纸人：以最后一次形成的右折边为纸人的中线，头和身体贴着右折边，手臂向左伸到纸的左边。折剪示意：〔左边：手端留连接〕—手臂—〔右折边：半个头和身体〕。沿半个纸人的外轮廓剪，右折边上头和身体处不剪开，左边手端留一小段不剪开，其余多余的纸剪去。全部展开，能得到几个手拉手的纸人？", "answer": "2 个", "reasoning": ["每次把右半边向左折，最后形成的右折边叠着两处纸人的中线。", "头和身体处的折边不剪开，相邻两层展开合成 1 个完整纸人，四层共得到 2 个。", "纸条中间折痕处的手端没有剪断，所以两个纸人手拉手。"], "options": [{"id": "a", "text": "4 个", "feedback": "4 是叠好的纸的层数。按题中画法，相邻两层展开才合成 1 个完整纸人。"}, {"id": "b", "text": "1 个", "feedback": "只展开最后一次对折时，看到的是 1 个完整纸人的双层叠样；再全部展开，还会有另 1 个纸人。"}, {"id": "c", "text": "2 个", "feedback": "对。相邻两层展开合成 1 个纸人，四层全部展开得到 2 个；手端留下的连接使两个纸人手拉手。"}], "correct": "c", "pointIds": ["pyps.p3b.u1.005"], "contentVersion": "sha256:e2eb42363055c5625de0259195cce2395f3f9f41d6d256f209669d96de1086e8", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 220\" role=\"img\" aria-label=\"对折纸右边为折边，半个头和身体靠右，左侧手端留连接\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"75\" y=\"25\" width=\"130\" height=\"115\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><path d=\"M205 25L205 140\" style=\"stroke:var(--b);fill:none;stroke-width:2;stroke-dasharray:5 4\" /><text x=\"232\" y=\"23\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">折边<\/text><text x=\"44\" y=\"23\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">纸左边<\/text><path d=\"M205 38Q170 38 176 60L180 80L75 83V95L182 91L170 133H205\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><path d=\"M75 83L75 95\" style=\"stroke:var(--fg);fill:none;stroke-width:2\" /><text x=\"140\" y=\"186\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">左侧手端留连接，不剪开<\/text><text x=\"140\" y=\"164\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">对折后的剪纸示意<\/text><\/svg>"}, {"id": "p3b-u1-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "长和宽不一样长的长方形、正方形、三条边一样长的三角形，这三个图形中，哪个的对称轴最多？", "answer": "正方形", "reasoning": ["长和宽不一样长的长方形，横着、竖着对折各有 1 条对称轴，共 2 条。", "正方形横着、竖着对折各有 1 条，沿两个相对的角对折各有 1 条，共 4 条。", "三条边一样长的三角形，从每个顶点到与它相对的那条边的中点的直线都是对称轴，共 3 条。", "比较 2、4、3，正方形的对称轴最多。"], "options": [{"id": "a", "text": "长和宽不一样长的长方形", "feedback": "这种长方形有 2 条对称轴，比正方形的 4 条少。"}, {"id": "b", "text": "正方形", "feedback": "对。正方形有 4 条，题中的长方形有 2 条，三条边一样长的三角形有 3 条。"}, {"id": "c", "text": "三条边一样长的三角形", "feedback": "这种三角形有 3 条对称轴，比正方形的 4 条少。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.002", "pyps.p3b.u1.001"], "contentVersion": "sha256:1553084a90eebfd1341373e6d98e6232375d0c7919ee68cbd38e02e9dd736193", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 180\" role=\"img\" aria-label=\"题给长方形、正方形和三条边相等的三角形，不画对称轴\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"10\" y=\"60\" width=\"75\" height=\"45\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"110\" y=\"40\" width=\"55\" height=\"55\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><path d=\"M225 35.718L185 105H265Z\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><\/svg>"}, {"id": "p3b-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一辆汽车在平直的公路上向前开，车身保持朝向不变。看车身相对于地面的运动，再看车轮绕着车轴的转动，分别属于哪一种运动？", "answer": "车身相对地面平移，车轮绕车轴旋转", "reasoning": ["相对于地面，车身沿直线前进，朝向不变，是平移。", "看车轮绕车轴的转动，它是旋转。", "同时，车轮还随车轴一起向前移动；车轮相对地面的整个运动，包含向前移动和绕车轴转动。"], "options": [{"id": "a", "text": "车身相对地面平移，车轮绕车轴旋转", "feedback": "对。车身相对地面沿直线向前且朝向不变；车轮绕车轴转动。同时，车轮也随车轴一起向前移动。"}, {"id": "b", "text": "车身相对地面平移，车轮绕车轴也平移", "feedback": "车轮虽然随车轴向前移动，但题目问的是绕车轴的转动，这属于旋转。"}, {"id": "c", "text": "车身相对地面旋转，车轮绕车轴平移", "feedback": "车身保持朝向不变、沿直线前进，是平移；车轮绕车轴的转动是旋转。"}], "correct": "a", "pointIds": ["pyps.p3b.u1.003", "pyps.p3b.u1.004"], "contentVersion": "sha256:6feeac55fd9857f36c95af5ea02add03fc877b66f366bc8cca5fc28b393351ff", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"汽车向前移动，车轮绕车轴转动\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"35\" y=\"60\" width=\"150\" height=\"50\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"65\" y=\"35\" width=\"75\" height=\"25\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\" /><circle cx=\"65\" cy=\"110\" r=\"18\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\" /><circle cx=\"160\" cy=\"110\" r=\"18\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\" /><circle cx=\"65\" cy=\"110\" r=\"3\" style=\"fill:var(--b);stroke:var(--fg);stroke-width:2\" /><circle cx=\"160\" cy=\"110\" r=\"3\" style=\"fill:var(--b);stroke:var(--fg);stroke-width:2\" /><path d=\"M200 80L260 80\" style=\"stroke:var(--b);fill:none;stroke-width:2\" /><path d=\"M251.896 76.0853L260 80L251.896 83.9147\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><\/svg>"}, {"id": "p3b-u1-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "钟的分针现在指着 12。要把它拨到指着 9，怎样拨走过的格数最少？", "answer": "逆时针拨", "reasoning": ["顺时针从 12 走到 9，要经过 1、2……一直到 9，走 9 个大格。", "逆时针从 12 往回走到 9，只走 3 个大格。", "所以逆时针拨走得少。"], "options": [{"id": "a", "text": "顺时针拨", "feedback": "顺时针从 12 到 9 要走 9 个大格，多了。"}, {"id": "b", "text": "逆时针拨", "feedback": "对。逆时针从 12 拨到 9 只走 3 个大格。"}, {"id": "c", "text": "两种拨法一样多", "feedback": "顺时针要走 9 个大格，逆时针只要 3 个大格，不一样多。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.004"], "contentVersion": "sha256:55d482de92dfdff291c01bb871c3d5ca48208d02cd47ec40bb1a2793b63490f6", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"分针起点12和目标9，未标转动路线\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><circle cx=\"140\" cy=\"86\" r=\"62\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\" /><text x=\"164\" y=\"49.4308\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">1<\/text><text x=\"181.569\" y=\"67\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">2<\/text><text x=\"188\" y=\"91\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">3<\/text><text x=\"181.569\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">4<\/text><text x=\"164\" y=\"132.569\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">5<\/text><text x=\"140\" y=\"139\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">6<\/text><text x=\"116\" y=\"132.569\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">7<\/text><text x=\"98.4308\" y=\"115\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">8<\/text><text x=\"92\" y=\"91\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">9<\/text><text x=\"98.4308\" y=\"67\" text-anchor=\"middle\" style=\"fill:var(--f
