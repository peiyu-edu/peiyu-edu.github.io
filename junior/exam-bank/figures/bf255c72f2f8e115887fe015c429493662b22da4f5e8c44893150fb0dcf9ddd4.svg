<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 280" role="img"><title>广东第13题图</title><desc>A、O、B依次位于同一水平直线上，BC垂直AB，C在B上方；OD指向左上方，OC指向右上方，过O的竖直虚线分别与OD、OC形成相等的∠1、∠2；tan∠AOD=3/4，OB=8。</desc><style>:root{color:#173b40}@media(prefers-color-scheme:dark){:root{color:#e5eeeb}}line,path,polygon,polyline,circle,rect{stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:"Times New Roman","Songti SC",serif}</style><line x1="40" y1="230" x2="360" y2="230"/><line x1="200" y1="230" x2="80" y2="140"/><line x1="200" y1="230" x2="360" y2="110"/><line x1="360" y1="110" x2="360" y2="230"/><line x1="200" y1="230" x2="200" y2="100" stroke-dasharray="6 5"/><polyline points="348,230 348,218 360,218" fill="none"/><polyline points="200,218 212,218 212,230" fill="none"/><text x="24" y="251" font-size="20">A</text><text x="187" y="256" font-size="20">O</text><text x="365" y="251" font-size="20">B</text><text x="368" y="105" font-size="20">C</text><text x="62" y="133" font-size="20">D</text><text x="171" y="193" font-size="20">1</text><text x="213" y="193" font-size="20">2</text></svg>
