<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二年级下册 第一单元 有余数的除法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p2b-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>二年级下册 第一单元 有余数的除法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p2b-u1-test", "sectionId": "p2b-u1-test", "unitId": "p2b-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "二年级下册 第一单元 有余数的除法 单元测评", "items": [{"id": "p2b-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "有 13 个草莓，每 4 个装一盒，可以装满几盒？还剩几个？", "answer": "装满 3 盒，还剩 1 个", "reasoning": ["4 个、4 个地装：装 3 盒用去 4 × 3 = 12（个）。", "13 − 12 = 1，剩下 1 个不够再装一盒。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u1.001"], "contentVersion": "sha256:41810b17bc8dc43a8c2973004477cd4a2a038ec357a2348a889c556eec42e30c"}, {"id": "p2b-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "17 支铅笔，每人分 5 支，17 ÷ 5 = 3（人）……2（支）。这里的 3 和 2 各表示什么？", "answer": "3 表示分给了 3 人，2 表示还剩 2 支铅笔", "reasoning": ["每人 5 支，分了 3 人，用去 5 × 3 = 15（支）。", "17 − 15 = 2，余下 2 支铅笔。"], "options": [{"id": "a", "text": "3 表示每人 3 支，2 表示 2 个人没分到", "feedback": "题目说每人 5 支；2 是剩下的铅笔，不是人。"}, {"id": "b", "text": "3 表示剩下 3 支，2 表示分给了 2 人", "feedback": "说反了：商是分到的人数，余数是剩下的铅笔。"}, {"id": "c", "text": "3 表示分给了 3 人，2 表示还剩 2 支铅笔", "feedback": "对。商 3 是分到铅笔的人数，余数 2 是剩下的铅笔。"}], "correct": "c", "pointIds": ["pyps.p2b.u1.002"], "contentVersion": "sha256:ff65510decf9263dbd7ea91e3320b65b19740c1f79b1fa0bc1abec353375dbff"}, {"id": "p2b-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一道有余数的除法，除数是 6。余数可能是几？", "answer": "5", "reasoning": ["余数要比除数小。", "除数是 6，余数只能是 1、2、3、4、5 中的一个，所以选 5。"], "options": [{"id": "a", "text": "6", "feedback": "余数是 6 时还能再分一份，余数要比除数小。"}, {"id": "b", "text": "5", "feedback": "对。余数要比除数 6 小，5 可以。"}, {"id": "c", "text": "7", "feedback": "7 比除数 6 大，还能再分。"}], "correct": "b", "pointIds": ["pyps.p2b.u1.003"], "contentVersion": "sha256:645251fea086b8ac165391b2dca0a8f3542d68578aad2424638eec00980fd346"}, {"id": "p2b-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：29 ÷ 6 = ？……？　38 ÷ 7 = ？……？　50 ÷ 8 = ？……？", "answer": "4……5，5……3，6……2", "reasoning": ["想口诀找最接近又不超过的积：四六二十四，29 − 24 = 5，29 ÷ 6 = 4……5。", "五七三十五，38 − 35 = 3；六八四十八，50 − 48 = 2。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u1.006", "pyps.p2b.u1.005"], "contentVersion": "sha256:24b2ea64331f1b0c65016da70cf6f67432f278ff8cc8b417375bd99860a0598e"}, {"id": "p2b-u1-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "除数是 7 时，余数最大是几？", "answer": "6", "reasoning": ["余数要比除数小。", "比 7 小的数里最大的是 6，所以余数最大是 6。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u1.004"], "contentVersion": "sha256:cde268f30d4306ac463ea0c495f5292cd150e3f66bf6a9443f1da88ce2aaec0b"}, {"id": "p2b-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "____ ÷ 5 = 4 …… ★。★ 最大是几？这时被除数是几？", "answer": "★ 最大是 4，被除数是 24", "reasoning": ["除数是 5，余数比 5 小，最大是 4。", "分了 4 份，每份 5 个，用去 5 × 4 = 20，再加余下的 4：20 + 4 = 24。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u1.004"], "contentVersion": "sha256:191443deb0ac7f665c87542b3a472f9030138f8bc37c2f349298a5f174a5acd7"}, {"id": "p2b-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用竖式计算 23 ÷ 4：商写 5，在 23 下面写 4 × 5 的积 20，再算 23 − 20 = 3。竖式里的 20 表示什么？", "answer": "已经分掉的 20 个", "reasoning": ["竖式里商下面的乘积，表示已经分掉的数量。", "4 × 5 = 20 是分掉的，23 − 20 = 3 是剩下的，所以 23 ÷ 4 = 5……3。"], "options": [{"id": "a", "text": "剩下的 20 个", "feedback": "剩下的是最下面的 3。"}, {"id": "b", "text": "已经分掉的 20 个", "feedback": "对。20 是 5 份、每份 4 个，一共分掉的个数。"}, {"id": "c", "text": "一共有 20 个", "feedback": "一共有 23 个，写在最上面。"}], "correct": "b", "pointIds": ["pyps.p2b.u1.005", "pyps.p2b.u1.006"], "contentVersion": "sha256:ff9008cb261699df52241b200c33a9ff22ddc6465089e4903b387c6f4b4b0274", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 180\" role=\"img\" aria-label=\"23除以4的竖式，商5、积20、余3，商与个位对齐\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\">\n      <text x=\"200\" y=\"33\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:23px\">5<\/text><line x1=\"115\" y1=\"48\" x2=\"218\" y2=\"48\" style=\"stroke:var(--fg);stroke-width:2;stroke-linecap:round\" /><line x1=\"115\" y1=\"48\" x2=\"105\" y2=\"125\" style=\"stroke:var(--fg);stroke-width:2;stroke-linecap:round\" /><text x=\"80\" y=\"77\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:23px\">4<\/text><text x=\"200\" y=\"77\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:23px\">23<\/text><text x=\"200\" y=\"116\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:23px\">20<\/text><line x1=\"130\" y1=\"128\" x2=\"218\" y2=\"128\" style=\"stroke:var(--fg);stroke-width:2;stroke-linecap:round\" /><text x=\"200\" y=\"157\" text-anchor=\"end\" style=\"fill:var(--fg);font-size:23px\">3<\/text>\n    <\/svg>"}, {"id": "p2b-u1-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "26 个同学去划船，每条船最多坐 4 人。至少要租几条船？", "answer": "7 条", "reasoning": ["26 ÷ 4 = 6（条）……2（人）：坐满 6 条船，还剩 2 人。", "剩下的 2 人也要坐船，要再租 1 条：6 + 1 = 7（条）。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u1.007"], "contentVersion": "sha256:509468cf319b8c6b7352035a800ed343fd8169dfe92f869ff426c5016a43e505"}, {"id": "p2b-u1-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个本子 4 元。小明有 30 元，最多能买几个本子？", "answer": "7 个", "reasoning": ["30 ÷ 4 = 7（个）……2（元）。", "剩下的 2 元不够再买一个，所以最多买 7 个。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u1.007"], "contentVersion": "sha256:f73e192f7d7049a1783dbbc45525d8edf6fab419e16469cf35f885bfa5e9fcab"}, {"id": "p2b-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "按「红、红、黄、绿」的顺序一直重复串珠子。第 22 颗珠子是什么颜色？", "answer": "红色", "reasoning": ["每 4 颗是一组：红、红、黄、绿。", "22 ÷ 4 = 5（组）……2（颗），排完 5 组后是下一组的第 2 颗，是红色。"], "options": [{"id": "a", "text": "黄色", "feedback": "黄色是每组的第 3 颗，第 22 颗是一组里的第 2 颗。"}, {"id": "b", "text": "红色", "feedback": "对。22 ÷ 4 = 5……2，是一组里的第 2 颗，是红色。"}, {"id": "c", "text": "绿色", "feedback": "绿色是每组的第 4 颗，余数是 2 时不是绿色。"}], "correct": "b", "pointIds": ["pyps.p2b.u1.008", "pyps.p2b.u1.006"], "contentVersion": "sha256:3a9429b7544529eed57527107fd9b45f7f99395ccf92a365401a5092dcfd5c5a", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 177\" role=\"img\" aria-label=\"串珠按红、红、黄、绿重复，图示前8颗\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\">\n      <circle cx=\"35\" cy=\"28\" r=\"12\" style=\"fill:var(--no)\"/><text x=\"35\" y=\"62\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">红<\/text><circle cx=\"105\" cy=\"28\" r=\"12\" style=\"fill:var(--no)\"/><text x=\"105\" y=\"62\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">红<\/text><circle cx=\"175\" cy=\"28\" r=\"12\" style=\"fill:var(--hl)\"/><text x=\"175\" y=\"62\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">黄<\/text><circle cx=\"245\" cy=\"28\" r=\"12\" style=\"fill:var(--a)\"/><text x=\"245\" y=\"62\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">绿<\/text><circle cx=\"35\" cy=\"94\" r=\"12\" style=\"fill:var(--no)\"/><text x=\"35\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">红<\/text><circle cx=\"105\" cy=\"94\" r=\"12\" style=\"fill:var(--no)\"/><text x=\"105\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">红<\/text><circle cx=\"175\" cy=\"94\" r=\"12\" style=\"fill:var(--hl)\"/><text x=\"175\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">黄<\/text><circle cx=\"245\" cy=\"94\" r=\"12\" style=\"fill:var(--a)\"/><text x=\"245\" y=\"128\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">绿<\/text><text x=\"260\" y=\"157\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">…<\/text>\n    <\/svg>"}], "contentVersion": "sha256:03ab42437c4a99abeb926c7868306becb30b7f539fd2a1a4d6ce3b48d5b7264f"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
