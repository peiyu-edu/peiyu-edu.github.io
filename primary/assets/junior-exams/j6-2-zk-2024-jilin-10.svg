<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 770" width="600" height="770" role="img" aria-labelledby="title desc">
<title id="title">长春站到胜利公园的街道地图</title>
<desc id="desc">长春市局部街道地图。上方是长春站，下方是胜利公园，公园为左下方的绿色区域。一条红色的人民大街从长春站笔直向下到达胜利公园，其他道路纵横交错。图中还标有杭州路、四平路、西广场、嫩江路和天新饭店。</desc>
