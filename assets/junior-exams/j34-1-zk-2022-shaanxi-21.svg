<title id="title">用影子测建筑物顶部旗杆高的示意图</title>
<desc id="desc">示意图：水平地面上从左到右依次为 G、F、D、C、O。右侧 O 处是竖直的建筑物，楼顶为 B，楼顶的旗杆顶端为 A，A、B、O 在一条竖直线上。左侧小明站在 F 处，头顶为 E，EF 竖直。虚线连接 A 与 D、B 与 C、E 与 G，这些虚线表示阳光；地面上 FG 和 OD 加粗，表示影子。</desc>
