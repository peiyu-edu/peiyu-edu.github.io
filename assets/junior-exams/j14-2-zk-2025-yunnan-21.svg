<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 405" width="450" height="405" role="img" aria-labelledby="title desc">
<title id="title">AB 与 CD 相交于点 O</title>
<desc id="desc">线段 AB 水平，线段 CD 从左上到右下，两者相交于点 O。C 在左上方，D 在右下方，A 在 O 的左边，B 在 O 的右边；连接 AC、BD。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="450" height="405" fill="white"/>
<line x1="39.0" y1="200.0" x2="411.0" y2="200.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="69.0" y1="44.0" x2="381.0" y2="356.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="39.0" y1="200.0" x2="69.0" y2="44.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="411.0" y1="200.0" x2="381.0" y2="356.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="69.0" y="34.0" class="l" text-anchor="middle">C</text>
<text x="19.0" y="210.0" class="l" text-anchor="middle">A</text>
<text x="431.0" y="210.0" class="l" text-anchor="middle">B</text>
<text x="381.0" y="392.0" class="l" text-anchor="middle">D</text>
<text x="229.0" y="186.0" class="l" text-anchor="middle">O</text>
</svg>
