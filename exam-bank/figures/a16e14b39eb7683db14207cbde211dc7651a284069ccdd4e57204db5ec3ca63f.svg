<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" role="img" aria-labelledby="title desc"><title id="title">程序框图</title><desc id="desc">程序框图：开始；输入 n=1，S=0；执行 S=S+n；判断 S≤100，是则执行 n=n+2 后返回 S=S+n，否则输出 n；结束。</desc><style>path,line,circle,polygon{fill:none;stroke:currentColor;stroke-width:2}.ax{stroke-width:1.5}.d{stroke-dasharray:6 5}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.it{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><rect x="260" y="8" width="80" height="28" rx="14" fill="none" stroke="currentColor" stroke-width="2"/><text x="300" y="28" font-size="15" text-anchor="middle">开始</text><line x1="300" y1="36" x2="300" y2="52"/><polygon style="fill:currentColor;stroke:none" points="300,58 295,49 305,49"/><polygon points="215,88 235,58 395,58 375,88"/><text x="305" y="78" font-size="15" text-anchor="middle">输入 <tspan class="it">n</tspan>=1，<tspan class="it">S</tspan>=0</text><line x1="300" y1="88" x2="300" y2="112"/><polygon style="fill:currentColor;stroke:none" points="300,118 295,109 305,109"/><rect x="245" y="118" width="110" height="30" fill="none" stroke="currentColor" stroke-width="2"/><text x="300" y="138" font-size="15" text-anchor="middle"><tspan class="it">S</tspan>=<tspan class="it">S</tspan>+<tspan class="it">n</tspan></text><line x1="300" y1="148" x2="300" y2="160"/><polygon style="fill:currentColor;stroke:none" points="300,166 295,157 305,157"/><polygon points="225,196 300,166 375,196 300,226"/><text x="300" y="201" font-size="15" text-anchor="middle"><tspan class="it">S</tspan>≤100</text><rect x="85" y="118" width="110" height="30" fill="none" stroke="currentColor" stroke-width="2"/><text x="140" y="138" font-size="15" text-anchor="middle"><tspan class="it">n</tspan>=<tspan class="it">n</tspan>+2</text><line x1="225" y1="196" x2="140" y2="196"/><line x1="140" y1="196" x2="140" y2="157"/><polygon style="fill:currentColor;stroke:none" points="140,148 135,157 145,157"/><text x="190" y="189" font-size="15" text-anchor="middle">是</text><line x1="140" y1="118" x2="140" y2="100"/><line x1="140" y1="100" x2="291" y2="100"/><polygon style="fill:currentColor;stroke:none" points="300,100 291,95 291,105"/><line x1="300" y1="226" x2="300" y2="250"/><polygon style="fill:currentColor;stroke:none" points="300,256 295,247 305,247"/><text x="316" y="244" font-size="15" text-anchor="middle">否</text><polygon points="235,286 255,256 365,256 345,286"/><text x="300" y="276" font-size="15" text-anchor="middle">输出 <tspan class="it">n</tspan></text><line x1="300" y1="286" x2="300" y2="310"/><polygon style="fill:currentColor;stroke:none" points="300,316 295,307 305,307"/><rect x="260" y="316" width="80" height="28" rx="14" fill="none" stroke="currentColor" stroke-width="2"/><text x="300" y="336" font-size="15" text-anchor="middle">结束</text></svg>