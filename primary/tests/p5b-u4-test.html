back": "是平均分成 8 份，不是 5 份。"}, {"id": "c", "text": "1/8", "feedback": "对。平均分成 8 段，每段是全长的 1/8。"}], "correct": "c", "pointIds": ["pyps.p5b.u4.001"], "contentVersion": "sha256:55a4f290e764d59f1f5b48a0235c26ebd30bb82118c31a1225a8ee3c01d1e4d9", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"30.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"60.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"90.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"120.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"150.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"180.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"210.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"240.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"150\" y=\"122\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">全长 5 米，平均分成 8 段<\/text><\/svg>"}, {"id": "p5b-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "把一根 5 米长的绳子平均分成 8 段，每段长多少米？", "answer": "5/8 米", "reasoning": ["求每段长多少米，用除法：5 ÷ 8。", "5 ÷ 8 = 5/8（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u4.003"], "contentVersion": "sha256:7f02e83bca515c0240bc7360371d445f0e3ee856e9db76cbbb98809c8a67c9ad", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 190\" role=\"img\" aria-label=\"题目已知条件示意\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"30.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"60.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"90.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"120.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"150.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"180.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"210.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><rect x=\"240.0\" y=\"60\" width=\"30.0\" height=\"34\" style=\"fill:var(--card);stroke:var(--fg);stroke-width:2\"/><text x=\"150\" y=\"122\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">全长 5 米，平均分成 8 段<\/text><\/svg>"}, {"id": "p5b-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "7/9 的分数单位是什么？它有几个这样的分数单位？", "answer": "分数单位是 1/9，有 7 个", "reasoning": ["分母是 9，分数单位是 1/9。", "分子是 7，就有 7 个 1/9。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u4.002"], "contentVersion": "sha256:2238fa0a65d69fe359f72d8686a5a0128a14fb1d39430775fb0b6c4c579d2b16"}, {"id": "p5b-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪个是假分数？", "answer": "9/9", "reasoning": ["分子比分母小的是真分数；分子比分母大或者和分母相等的是假分数。", "9/9 分子等于分母，是假分数。"], "options": [{"id": "a", "text": "9/9", "feedback": "对。分子等于分母，也是假分数。"}, {"id": "b", "text": "8/9", "feedback": "分子比分母小，是真分数。"}, {"id": "c", "text": "1/9", "feedback": "分子比分母小，是真分数。"}], "correct": "a", "pointIds": ["pyps.p5b.u4.005"], "contentVersion": "sha256:9bcde46930e4d1a7d27e26a8efa202f4ded5a1bc13283be2c2e718e704d6ac0b"}, {"id": "p5b-u4-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "把 17/5 化成带分数；把 2 又 3/4 化成假分数。", "answer": "3 又 2/5；11/4", "reasoning": ["17 ÷ 5 = 3……2，所以 17/5 = 3 又 2/5。", "2 又 3/4：分子是 4 × 2 + 3 = 11，分母不变，是 11/4。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u4.006"], "contentVersion": "sha256:8815bff0f11a2a18e7cdfceaf7cdd0221e11a6c79d088aa48e350533e9956f7c"}, {"id": "p5b-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "把 18/24 约分成最简分数。", "answer": "3/4", "reasoning": ["18 和 24 的最大公因数是 6。", "分子、分母同时除以 6：18 ÷ 6 = 3，24 ÷ 6 = 4，得 3/4。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u4.010", "pyps.p5b.u4.008"], "contentVersion": "sha256:1bdf04e7f4d74546d7de8b6211dc980a5fa98abb51c7ee00168459dfbbca7bbd"}, {"id": "p5b-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "6 和 8 的最小公倍数是几？", "answer": "24", "reasoning": ["6 的倍数：6, 12, 18, 24, …", "8 的倍数：8, 16, 24, …", "第一个相同的是 24。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u4.011"], "contentVersion": "sha256:eb1d6bc54a5b6132a91cb3bf4f37ea540c85b735753956c4a071882d349fb551"}, {"id": "p5b-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "8 和 9 的最大公因数和最小公倍数分别是几？", "answer": "1 和 72", "reasoning": ["8 的因数：1, 2, 4, 8；9 的因数：1, 3, 9。公因数只有 1，最大公因数是 1。", "只有公因数 1 的两个数，最小公倍数就是它们的积：8 × 9 = 72。"], "options": [{"id": "a", "text": "1 和 17", "feedback": "17 是 8 和 9 的和，不是它们的公倍数。"}, {"id": "b", "text": "1 和 72", "feedback": "对。8 和 9 只有公因数 1，最小公倍数就是它们的积。"}, {"id": "c", "text": "8 和 72", "feedback": "8 不是 9 的因数，不是公因数。"}], "correct": "b", "pointIds": ["pyps.p5b.u4.009", "pyps.p5b.u4.012"], "contentVersion": "sha256:c4abfcf3cb999fecbc3074909bbfbf81452ed8d78702995812cacc723f4ad4d9"}, {"id": "p5b-u4-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "比较 5/6 和 7/9 的大小。", "answer": "5/6 > 7/9", "reasoning": ["6 和 9 的最小公倍数是 18，用 18 作公分母。", "5/6 = 15/18，7/9 = 14/18。", "15/18 > 14/18，所以 5/6 > 7/9。"], "options": [{"id": "a", "text": "5/6 > 7/9", "feedback": "对。5/6 = 15/18，7/9 = 14/18，15/18 > 14/18。"}, {"id": "b", "text": "5/6 < 7/9", "feedback": "通分后比一比，5/6 = 15/18，7/9 = 14/18。"}, {"id": "c", "text": "5/6 = 7/9", "feedback": "通分后分子不同，两个分数不相等。"}], "correct": "a", "pointIds": ["pyps.p5b.u4.013"], "contentVersion": "sha256:1fd1413146798c171660925a764fdc99996ed9a858ad88ba7c349fdcf4d0f636"}, {"id": "p5b-u4-t10", "number": 10, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "把 0.45 化成分数（最简）；把 3/8 化成小数。", "answer": "9/20；0.375", "reasoning": ["0.45 有两位小数，写成 45/100，再约分：45/100 = 9/20。", "3/8 化成小数，用分子除以分母：3 ÷ 8 = 0.375。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u4.014", "pyps.p5b.u4.015"], "contentVersion": "sha256:1d70305e3317cae11f98e3acf528ebc152b8e3574051a662a32973d5ff2ea8bf"}, {"id": "p5b-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "五（1）班有男生 24 人，女生 21 人。男生人数占全班人数的几分之几？（写成最简分数）", "answer": "8/15", "reasoning": ["全班人数：24 + 21 = 45（人）。", "男生占全班的 24/45。", "24 和 45 的最大公因数是 3，约分得 8/15。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u4.004", "pyps.p5b.u4.010"], "contentVersion": "sha256:caf47cfc09e275a2e0383fd793cb416b151a4bc24238d7b384ab72807e981b58"}, {"id": "p5b-u4-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个分数的分母是 21，约分后是 2/7。原来的分数是多少？请用约分检验。", "answer": "6/21", "reasoning": ["分母从 7 变成 21，乘了 3；分子也要乘 3，分数的大小才不变。", "2 × 3 = 6，所以原来的分数是 6/21。", "检验：6 和 21 同时除以公因数 3，6 ÷ 3 = 2，21 ÷ 3 = 7，约分后是 2/7。"], "options": [], "correct": null, "pointIds": ["pyps.p5b.u4.007", "pyps.p5b.u4.010"], "contentVersion": "sha256:2ea6ace0daaccd0f18092adaa3cb4628cc5c688f3bdca47764d7bbc616695d59"}], "contentVersion": "sha256:e398c3586d2200d13936f47410be30b6b11e018c7f6c554eac142f7f13fa8b26"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="
