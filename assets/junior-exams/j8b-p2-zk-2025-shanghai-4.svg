<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 437" width="600" height="437" role="img" aria-labelledby="title desc">
<title id="title">体育测试分数条形统计图</title>
<desc id="desc">条形统计图，纵轴为人数，横轴为分数 75、80、85、90、95。75 分 5 人，80 分 12 人，85 分 21 人；90 分与 95 分的柱子一样高，都低于 12 人，纵轴没有标出它们的人数。</desc>
<style>text { fill:#17202a; } .it { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .nm { font-family:'Times New Roman',Georgia,serif; } .zh { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="600" height="437" fill="white"/>
<line x1="105.0" y1="387.5" x2="105.0" y2="37.5" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<polygon points="105.0,12.5 113.0,32.5 97.0,32.5" fill="#17202a"/>
<line x1="105.0" y1="387.5" x2="557.5" y2="387.5" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<polygon points="582.5,387.5 562.5,395.5 562.5,379.5" fill="#17202a"/>
