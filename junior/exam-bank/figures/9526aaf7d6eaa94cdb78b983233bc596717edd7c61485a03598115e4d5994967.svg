<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" role="img" aria-labelledby="title desc"><title id="title">分拣数量与时间的图象</title><desc id="desc">横轴为 x（分钟），纵轴为 y（件）。甲的图象是折线 O—A—B—C：A 的横坐标为 30、纵坐标为 450，B 的横坐标为 a、纵坐标为 450（AB 水平），C 的横坐标为 180、纵坐标为 2250。乙的图象是从横轴上 30 处出发的线段，终点横坐标为 180、纵坐标为 3000。图中有虚线连接各点到坐标轴。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.s{fill:currentColor;fill-opacity:.15;stroke:none}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M70.00,230.00L368.00,230.00" /><polygon points="370.00,230.00 360.00,226.00 360.00,234.00" class="f" /><path d="M70.00,230.00L70.00,22.00" /><polygon points="70.00,20.00 66.00,30.00 74.00,30.00" class="f" /><path d="M70.00,230.00L112.00,200.75L154.00,200.75L322.00,83.75" /><path d="M112.00,230.00L322.00,35.00" /><path d="M70.00,200.75L112.00,200.75" class="d" /><path d="M112.00,200.75L112.00,230.00" class="d" /><path d="M154.00,200.75L154.00,230.00" class="d" /><path d="M70.00,35.00L322.00,35.00" class="d" /><path d="M70.00,83.75L322.00,83.75" class="d" /><path d="M322.00,35.00L322.00,230.00" class="d" /><text x="62.00" y="205.75" text-anchor="end" font-size="15">450</text><text x="62.00" y="88.75" text-anchor="end" font-size="15">2250</text><text x="62.00" y="40.00" text-anchor="end" font-size="15">3000</text><text x="58.00" y="250.00" text-anchor="middle" font-size="17" font-style="italic">O</text><text x="112.00" y="250.00" text-anchor="middle" font-size="15">30</text><text x="154.00" y="250.00" text-anchor="middle" font-size="16" font-style="italic">a</text><text x="322.00" y="250.00" text-anchor="middle" font-size="15">180</text><text x="385.00" y="252.00" text-anchor="middle" font-size="15">x/分钟</text><text x="40.00" y="22.00" text-anchor="middle" font-size="15">y/件</text><text x="106.00" y="192.75" text-anchor="middle" font-size="16" font-style="italic">A</text><text x="166.00" y="218.75" text-anchor="middle" font-size="16" font-style="italic">B</text><text x="334.00" y="85.75" text-anchor="middle" font-size="16" font-style="italic">C</text><text x="212.00" y="108.00" text-anchor="middle" font-size="16">乙</text><text x="268.00" y="152.00" text-anchor="middle" font-size="16">甲</text></svg>