<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 230" role="img" aria-labelledby="title desc"><title id="title">平行四边形ABCD中的尺规作图痕迹</title><desc id="desc">平行四边形ABCD，AB在下，DC在上；E在AB上，连接DE。以E为圆心的弧交AE于M、交DE于N；以B为圆心的弧交AB于P；以P为圆心的弧与它交于Q；射线BQ交DC于F。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:6 5}.g{stroke-dasharray:3 4;stroke-width:1}.thin{stroke-width:1.5}.fill{fill:currentColor;stroke:none}.shade{fill:var(--shade);stroke:none}.block{fill:var(--shade)}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}text.n{font-style:normal;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}svg{color:#243d45;background:#fff;--shade:#c9d2d2}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--shade:#4a6268}}</style><path d="M40.0,190.0L330.0,190.0L394.0,28.0L104.0,28.0Z"/><path d="M104.0,28.0L160.0,190.0"/><path d="M330.0,190.0L274.0,28.0"/><path d="M155.4,138.2A52,52 0 0 0 108.3,195.4"/><path d="M325.4,138.2A52,52 0 0 0 278.3,195.4"/><path d="M323.2,150.0A60.3419715099561,60.3419715099561 0 0 0 301.1,134.2"/><text x="26.0" y="196.0" font-size="19" text-anchor="middle">A</text><text x="344.0" y="208.0" font-size="19" text-anchor="middle">B</text><text x="408.0" y="30.0" font-size="19" text-anchor="middle">C</text><text x="92.0" y="22.0" font-size="19" text-anchor="middle">D</text><text x="160.0" y="214.0" font-size="19" text-anchor="middle">E</text><text x="276.0" y="20.0" font-size="19" text-anchor="middle">F</text><text x="106.0" y="214.0" font-size="19" text-anchor="middle">M</text><text x="276.0" y="214.0" font-size="19" text-anchor="middle">P</text><text x="159.0" y="132.9" font-size="19" text-anchor="middle">N</text><text x="333.0" y="122.9" font-size="19" text-anchor="middle">Q</text></svg>
