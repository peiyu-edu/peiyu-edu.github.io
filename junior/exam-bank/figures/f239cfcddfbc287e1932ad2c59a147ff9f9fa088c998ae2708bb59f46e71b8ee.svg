<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 290" role="img" aria-labelledby="title desc"><title id="title">长方体与四种硬纸片</title><desc id="desc">上方是一个长方体的直观图。下方四种硬纸片：A 中间一块被两条横虚线分成三条，左边连一小块，右边连一长条，长条末端再连一小块。B 一块被三条横虚线分成四条，第二条左右各连一小块。C 一块被三条横虚线分成四条，第一条和第四条的左侧各连一小块。D 上排一长条被三条竖虚线分成四块，第三块下方依次连两块长条。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.s{fill:currentColor;fill-opacity:.15;stroke:none}.f{fill:currentColor;stroke:none}.g{fill:currentColor;fill-opacity:.55;stroke:currentColor}.th{stroke-width:1}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M22.00,27.50L203.50,27.50L203.50,79.00L22.00,79.00Z" /><path d="M22.00,27.50L48.00,13.00L229.50,13.00L203.50,27.50" /><path d="M229.50,13.00L229.50,65.00L203.50,79.00" /><path d="M48.00,13.00L48.00,65.00" class="d" /><path d="M48.00,65.00L229.50,65.00" class="d" /><path d="M48.00,65.00L22.00,79.00" class="d" /><path d="M64.00,123.00L64.00,104.50L157.00,104.50L157.00,123.00L267.50,123.00L267.50,141.50L157.00,141.50L157.00,160.00L64.00,160.00L64.00,141.50L45.50,141.50L45.50,123.00Z" /><path d="M64.00,123.00L157.00,123.00" class="d" /><path d="M64.00,141.50L157.00,141.50" class="d" /><path d="M64.00,123.00L64.00,141.50" class="d" /><path d="M157.00,123.00L157.00,141.50" class="d" /><path d="M249.00,123.00L249.00,141.50" class="d" /><path d="M434.00,110.50L434.00,93.50L517.00,93.50L517.00,110.50L533.50,110.50L533.50,127.00L517.00,127.00L517.00,160.00L434.00,160.00L434.00,127.00L417.00,127.00L417.00,110.50Z" /><path d="M434.00,110.50L517.00,110.50" class="d" /><path d="M434.00,127.00L517.00,127.00" class="d" /><path d="M434.00,143.50L517.00,143.50" class="d" /><path d="M434.00,110.50L434.00,127.00" class="d" /><path d="M517.00,110.50L517.00,127.00" class="d" /><path d="M45.00,198.50L162.50,198.50L1