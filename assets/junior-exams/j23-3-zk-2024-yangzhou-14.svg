<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 345" width="560" height="345" role="img" aria-labelledby="title desc">
<title id="title">一次函数图象与坐标轴</title>
<desc id="desc">平面直角坐标系中一条从左下向右上的直线，与 x 轴的负半轴交于点 A，与 y 轴的正半轴交于点 B，原点为 O。图中没有标数值。</desc>
<style>text { fill:#17202a; font-size:30px; } .i { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .n { font-family:'Times New Roman',Georgia,serif; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect x="0" y="0" width="560" height="345" fill="white"/>
<line x1="25.0" y1="250.0" x2="515.0" y2="250.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><polygon points="530.0,250.0 515.0,256.3 515.0,243.7" fill="#17202a"/><line x1="345.0" y1="335.0" x2="345.0" y2="30.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><polygon points="345.0,15.0 351.3,30.0 338.7,30.0" fill="#17202a"/><line x1="22.0" y1="304.5" x2="490.0" y2="70.5" stroke="#17202a" stroke-width="3.5" stroke-linecap="round"/><text class="i" x="125" y="292" text-anchor="middle">A</text><text class="i" x="320" y="292" text-anchor="middle">O</text><text class="i" x="320" y="128" text-anchor="middle">B</text><text class="i" x="525" y="293" text-anchor="middle">x</text><text class="i" x="372" y="38" text-anchor="middle">y</text>
</svg>
