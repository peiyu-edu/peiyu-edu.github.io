<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二年级上册 第四单元 厘米和米 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p2a-u4-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>二年级上册 第四单元 厘米和米 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p2a-u4-test", "sectionId": "p2a-u4-test", "unitId": "p2a-u4", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "二年级上册 第四单元 厘米和米 单元测评", "items": [{"id": "p2a-u4-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用尺子量一支铅笔：铅笔的一头对准刻度 0，另一头对准刻度 7。这支铅笔长几厘米？", "answer": "7 厘米", "reasoning": ["从 0 刻度量起，另一头对着几就是几厘米。", "另一头对着 7，铅笔长 7 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u4.002"], "contentVersion": "sha256:71ed9a31f33d6bd2b4e3d1584ee82f9bbe1abe3e44964bed4b16537e5700e100"}, {"id": "p2a-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "填空：1 米 = ____ 厘米。", "answer": "100", "reasoning": ["1 米里有 100 个 1 厘米。", "所以 1 米 = 100 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u4.003"], "contentVersion": "sha256:bb3ff1d9b57665b104ccb52ae937c51e39564683a8f3a6de39031f2d25d39494"}, {"id": "p2a-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "填上「厘米」或「米」：课桌高约 70 ____；教室的门高约 2 ____；一支新铅笔长约 18 ____。", "answer": "厘米，米，厘米", "reasoning": ["量比较短的东西用厘米，量比较长的东西用米。", "课桌高约 70 厘米，门高约 2 米，铅笔长约 18 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u4.005"], "contentVersion": "sha256:d61a429c952ba18db35d981d48f33d20ccfc36ff44ac721d0b72522881d32f53"}, {"id": "p2a-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪一条是线段？", "answer": "一条直直的线，两头各有一个端点", "reasoning": ["线段有两个特点：是直的，有两个端点。", "只有选项 c「一条直直的线，两头各有一个端点」两样都符合。"], "options": [{"id": "a", "text": "一条弯弯的线，两头各有一个端点", "feedback": "线段是直的，弯的线不是线段。"}, {"id": "b", "text": "一条围成一圈的线，没有端点", "feedback": "围成一圈没有端点，也不是直的，不是线段。"}, {"id": "c", "text": "一条直直的线，两头各有一个端点", "feedback": "对。线段是直的，有两个端点。"}], "correct": "c", "pointIds": ["pyps.p2a.u4.004"], "contentVersion": "sha256:f8b9e18abd939ff093856d0990965289c1b747acda344d69033c16cda2fc8aaa"}, {"id": "p2a-u4-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用尺子量一根小棒：小棒的一头对准刻度 2，另一头对准刻度 9。这根小棒长几厘米？", "answer": "7 厘米", "reasoning": ["没有从 0 开始量，要数中间有几个 1 厘米。", "从 2 到 9 有 9 − 2 = 7 个 1 厘米，长 7 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u4.002"], "contentVersion": "sha256:c0c62ff1c4b75b150bb8062d57f16913b57d4d3b2c7b66276ca12b42cc109a72"}, {"id": "p2a-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个三角形由几条线段围成？一个长方形呢？", "answer": "三角形 3 条，长方形 4 条", "reasoning": ["三角形有 3 条直直的边，每条边都是线段。", "长方形有 4 条边，所以由 4 条线段围成。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u4.004"], "contentVersion": "sha256:f2a06a3b4b08f78f5d767601811fb5149713f49588f53fa836ffcdbe257852a3"}, {"id": "p2a-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在横线上填 >、< 或 =：1 米 ____ 90 厘米；　60 厘米 + 40 厘米 ____ 1 米；　50 厘米 ____ 1 米", "answer": ">，=，<", "reasoning": ["1 米 = 100 厘米，100 厘米比 90 厘米长，填 >。", "60 + 40 = 100（厘米），正好 1 米，填 =；50 厘米比 100 厘米短，填 <。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u4.003"], "contentVersion": "sha256:ffe3ab100be7f9ebf2a3976ca9655306ea39020c71c5698ebe77edc5b0d9ae0b"}, {"id": "p2a-u4-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "要画一条比 6 厘米长 2 厘米的线段，应该画多长？", "answer": "8 厘米", "reasoning": ["比 6 厘米长 2 厘米，就是 6 + 2。", "6 + 2 = 8（厘米），从尺子的 0 画到 8。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u4.004", "pyps.p2a.u4.002"], "contentVersion": "sha256:83dd8426cf624f6f7dafa0b72e4fe2e3475132240b612741a1a74a1c5cf74dac"}, {"id": "p2a-u4-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一根绳子长 1 米，剪去 30 厘米，还剩多少厘米？", "answer": "70 厘米", "reasoning": ["单位不一样，先把 1 米换成 100 厘米。", "100 − 30 = 70（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u4.003"], "contentVersion": "sha256:8a1143d350731b9b642728e5cd3c5a8512f29705e882ac5e17fc8288fd6b6889"}, {"id": "p2a-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一块橡皮长 3 厘米。把 5 块同样的橡皮一块接一块排成一排，一共长多少厘米？", "answer": "15 厘米", "reasoning": ["5 块橡皮，每块 3 厘米，就是 5 个 3 厘米。", "3 × 5 = 15（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u4.001", "pyps.p2a.u2.003"], "contentVersion": "sha256:de9e979214c2212aa3e817608763c83816112530b0436e525ecf05ec31c8e6ac"}], "contentVersion": "sha256:32677e8d381cfdf873c3c0d67099fd7b64580f041a90e0dea04beedfe22950b5"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href=".
