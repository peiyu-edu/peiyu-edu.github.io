<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 514" width="600" height="514" role="img" aria-labelledby="title desc">
<title id="title">甲乙投篮成绩折线图</title>
<desc id="desc">标题为“两名同学近六周定点投篮测试成绩折线图”，横轴是周次 1 到 6，纵轴是成绩（命中次数）0 到 10，每格有虚线。甲为带圆点的虚线，六周依次是 8、7、6、7、8、6；乙为带菱形点的实线，六周依次是 3、4、7、8、10、10。</desc>
