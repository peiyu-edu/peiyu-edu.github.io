<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 610" role="img" aria-labelledby="title desc">
  <title id="title">误差判断循环程序框图</title>
  <desc id="desc">输入a=1、b=1、n=1，依次执行b=b+2a及a=b-a、n=n+1；判断绝对值b平方除以a平方减2是否小于0.01，是则输出n结束，否则返回循环。</desc>
  <style>svg{color:#243b42;background:#fff}path,rect{fill:none;stroke:currentColor;stroke-width:1.5}text{fill:currentColor;font:20px 'Noto Sans CJK SC',serif;text-anchor:middle}@media(prefers-color-scheme:dark){svg{color:#e6f0f2;background:#14242c}}</style>
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" style="fill:currentColor;stroke:none"/></marker></defs>
  <rect x="160" y="20" width="80" height="35" rx="10"/><text x="200" y="45">开始</text>
  <path d="M100 95H330L300 135H70Z"/><text x="200" y="121" style="font-size:18px">输入 a=1, b=1, n=1</text>
  <rect x="135" y="180" width="130" height="40"/><text x="200" y="207">b=b+2a</text>
  <rect x="100" y="255" width="200" height="40"/><text x="200" y="282">a=b-a, n=n+1</text>
  <path d="M200 320L350 370L200 420L50 370Z"/><text x="200" y="377" style="font-size:18px">|b²/a²-2| &lt; 0.01</text>
  <path d="M145 455H285L255 495H115Z"/><text x="200" y="482">输出 n</text>
  <rect x="160" y="540" width="80" height="40" rx="10"/><text x="200" y="567">结束</text>
  <g marker-end="url(#arr)"><path d="M200 55V95"/><path d="M200 135V180"/><path d="M200 220V255"/><path d="M200 295V320"/><path d="M200 420V455"/><path d="M200 495V540"/><path d="M50 370H30V155H197"/></g>
  <text x="224" y="445" style="font-size:18px">是</text><text x="51" y="402" style="font-size:18px">否</text>
</svg>
