<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">蒙古包几何体与四个选项</title><desc id="desc">左侧是蒙古包抽象出的几何体：下部圆柱、上部圆锥。右侧是四个选项图形：图A为三角形；图B为三角形下接矩形；图C为矩形；图D为中心有一点的圆。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:6 5}.g{stroke-dasharray:3 4;stroke-width:1}.thin{stroke-width:1.5}.fill{fill:currentColor;stroke:none}.shade{fill:var(--shade);stroke:none}.block{fill:var(--shade)}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}text.n{font-style:normal;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}svg{color:#243d45;background:#fff;--shade:#c9d2d2}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--shade:#4a6268}}</style><path class="block" d="M40,62L120,18L200,62A80,16 0 0 1 40,62Z"/><path class="block" d="M40,62V100A80,16 0 0 0 200,100V62"/><path d="M40,62A80,16 0 0 0 200,62"/><path d="M250.0,60.0L310.0,20.0L370.0,60.0Z"/><text x="310.0" y="84.0" font-size="18" text-anchor="middle" class="n">A</text><path d="M420.0,60.0L480.0,20.0L540.0,60.0Z"/><path d="M420,60V96H540V60"/><text x="480.0" y="120.0" font-size="18" text-anchor="middle" class="n">B</text><path d="M250,150H370V190H250Z"/><text x="310.0" y="214.0" font-size="18" text-anchor="middle" class="n">C</text><circle cx="480.0" cy="170.0" r="38"/><circle class="fill" cx="480.0" cy="170.0" r="3"/><text x="480.0" y="230.0" font-size="18" text-anchor="middle" class="n">D</text></svg>
