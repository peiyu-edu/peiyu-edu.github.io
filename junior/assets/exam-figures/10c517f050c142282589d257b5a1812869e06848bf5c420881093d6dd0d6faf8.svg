<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 604" width="590" height="604" role="img" aria-labelledby="title desc">
<title id="title">圆柱与四个侧面展开图</title>
<desc id="desc">上方是圆柱：上底面直径为 AB，A 在左、B 在右，高为 AC，C 在下底面左端；一条实线从 C 沿侧面弯曲上升到 B。下方是 A、B、C、D 四个矩形。A：从左下角到右上角的线段。B：从左下角到上边中点的线段。C：从左下角到上边中点、再到右下角的折线。D：从左下角弯曲到上边中点的曲线。</desc>
<style>text { fill:#17202a; } .it { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .nm { font-family:'Times New Roman',Georgia,serif; } .zh { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="590" height="604" fill="white"/>
<ellipse cx="149.0" cy="50" rx="99.0" ry="36.0" fill="none" stroke="#17202a" stroke-width="3"/>
<line x1="50.0" y1="50.0" x2="50.0" y2="276.5" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="248.0" y1="50.0" x2="248.0" y2="276.5" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<path d="M50.0,276.5 A99.0,36.0 0 0 0 248.0,276.5" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M50.0,276.5 A99.0,36.0 0 0 1 248.0,276.5" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"/>
<path d="M50.0,276.5 C140.0,282.5 213.0,186.5 248.0,50" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text class="it" x="30.0" y="56.0" text-anchor="middle" font-size="30">A</text>
<text class="it" x="268.0" y="56.0" text-anchor="middle" font-size="30">B</text>
<text class="it" x="30.0" y="288.5" text-anchor="middle" font-size="30">C</text>
<rect x="50" y="336" width="220" height="112" fill="none" stroke="#17202a" stroke-width="3"/>
<text class="nm" x="40.0" y="402.0" text-anchor="end" font-size="30">A.</text>
<line x1="50.0" y1="448.0" x2="270.0" y2="336.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<rect x="346" y="336" width="220" height="112" fill="none" stroke="#17202a" stroke-width="3"/>
<text class="nm" x="336.0" y="402.0" text-anchor="end" font-size="30">B.</text>
<line x1="346.0" y1="448.0" x2="456.0" y2="336.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<rect x="50" y="472" width="220" height="112" fill="none" stroke="#17202a" stroke-width="3"/>
<text class="nm" x="40.0" y="538.0" text-anchor="end" font-size="30">C.</text>
<line x1="50.0" y1="584.0" x2="160.0" y2="472.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="160.0" y1="472.0" x2="270.0" y2="584.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<rect x="346" y="472" width="220" height="112" fill="none" stroke="#17202a" stroke-width="3"/>
