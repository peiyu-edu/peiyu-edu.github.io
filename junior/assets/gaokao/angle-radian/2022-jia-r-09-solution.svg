<svg xmlns="http://www.w3.org/2000/svg" width="500" height="760" viewBox="0 0 500 760" role="img" aria-labelledby="title desc">
  <title id="title">同母线圆锥的展开扇形与过轴剖面</title>
  <desc id="desc">作答后解题图。甲、乙圆锥母线同为g，展开为同半径扇形。甲着色部分是240度优弧扇形，乙是120度小扇形。两段展开弧分别对应各自底圆周长。下方甲乙的过轴剖面各取一半，分别标出母线g、高h和底半径r及直角。四个图均以g为100像素使用相同长度尺度，甲底半径2g/3、高根号5倍g/3，乙底半径g/3、高2根号2倍g/3。</desc>
  <!-- Both sector radii and both section hypotenuses are exactly g=100.
       Major-sector start/end math angles: -120 -> +120, swept +240 degrees.
       Minor-sector start/end math angles: -60 -> +60, swept +120 degrees.
       SVG y is down, so sweep=0. The major-sector large-arc flag is 1. -->
  <rect width="500" height="760" rx="12" fill="#fff"/>
  <g fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="125" y="42" text-anchor="middle">甲的展开扇形</text>
    <text x="375" y="42" text-anchor="middle">乙的展开扇形</text>
  </g>
  <path id="sector-major" d="M 125 180 L 75.000000000 266.602540378 A 100.0 100.0 0 1 0 75.000000000 93.397459622 Z" fill="#dceaf2" stroke="#345b75" stroke-width="3" stroke-linejoin="round"/>
  <path id="sector-minor" d="M 375 180 L 425.000000000 266.602540378 A 100.0 100.0 0 0 0 425.000000000 93.397459622 Z" fill="#e6eddf" stroke="#547344" stroke-width="3" stroke-linejoin="round"/>
  <path id="angle-major" d="M 110.000000000 205.980762114 A 30.0 30.0 0 1 0 110.000000000 154.019237886" fill="none" stroke="#345b75" stroke-width="2.5"/>
  <path id="angle-minor" d="M 390.000000000 205.980762114 A 30.0 30.0 0 0 0 390.000000000 154.019237886" fill="none" stroke="#547344" stroke-width="2.5"/>
  <g fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="105" y="140" font-style="italic">g</text>
    <text x="380" y="133" font-style="italic">g</text>
    <text x="169" y="191">θ甲</text>
    <text x="412" y="191">θ乙</text>
    <text x="125" y="321" text-anchor="middle">θ甲 = 4π/3</text>
    <text x="375" y="321" text-anchor="middle">θ乙 = 2π/3</text>
    <text x="250" y="363" text-anchor="middle">展开弧长 = 底圆周长</text>
    <text x="250" y="403" text-anchor="middle">gθ甲=2πr甲；gθ乙=2πr乙</text>
  </g>
  <path d="M 24 426 H 476" stroke="#dce2e3" stroke-width="2"/>
  <g fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="250" y="470" text-anchor="middle">过轴剖面的一半</text>
    <text x="115" y="520" text-anchor="middle">甲</text>
    <text x="340" y="520" text-anchor="middle">乙</text>
  </g>
  <path id="section-major" d="M 80.0 650.0 L 80.0 575.464400750 L 146.666666667 650.0 Z" fill="#f1f6f9" stroke="#345b75" stroke-width="3" stroke-linejoin="round"/>
  <path id="section-minor" d="M 320.0 650.0 L 320.0 555.719095842 L 353.333333333 650.0 Z" fill="#f3f6ef" stroke="#547344" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 80 639 L 91 639 L 91 650 M 320 639 L 331 639 L 331 650" fill="none" stroke="#253b47" stroke-width="2"/>
  <g fill="#253b47" font-family="Arial,'PingFang SC',sans-serif" font-size="30">
    <text x="22" y="619">h甲</text>
    <text x="262" y="619">h乙</text>
    <text x="129" y="598" font-style="italic">g</text>
    <text x="360" y="598" font-style="italic">g</text>
    <text x="113" y="691" text-anchor="middle">r甲</text>
    <text x="337" y="691" text-anchor="middle">r乙</text>
    <text x="250" y="742" text-anchor="middle">r² + h² = g²</text>
  </g>
</svg>
