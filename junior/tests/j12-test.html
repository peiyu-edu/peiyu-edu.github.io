<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 12 章 数据的收集、整理与描述 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=c412b14433eb"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=9f35dd2cb533"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=960b69da9959"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=9e04f871a3b0"></script></head><body data-stage="junior" data-sec="j12-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 12 章 数据的收集、整理与描述 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j12-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j12-test", "sectionId": "j12-test", "chapterId": "j12", "title": "第 12 章 数据的收集、整理与描述 · 章末测验", "label": "章末测验", "sections": ["j12-1", "j12-2"], "items": [{"id": "j12-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j12-1"], "pointIds": ["pyjh.stat.001"], "prompt": "下列调查中，最适合采用全面调查的是哪一项？", "options": [{"id": "a", "text": "调查一批灯泡的使用寿命", "feedback": "这种检测有破坏性，不能逐一检测，只能抽样。"}, {"id": "b", "text": "了解全国七年级学生的视力情况", "feedback": "调查对象太多，全面调查成本太高。"}, {"id": "c", "text": "了解某班学生的身高", "feedback": "对象少、容易逐一测量，适合全面调查。"}, {"id": "d", "text": "检测某条河流的水质", "feedback": "河水无法逐一检测，只能抽取水样。"}], "correct": "c", "answer": "了解某班学生的身高", "reasoning": ["选择调查方式要看：能否逐一调查（有无破坏性）、总体大小、成本和精确要求。", "一个班人数少、测量无破坏性，适合全面调查；其余三项适合抽样调查。"], "contentVersion": "sha256:d41eb888008b2f74333d30188e24f8c77be20f4e522f6cb0827d320aed4d1587"}, {"id": "j12-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j12-1"], "pointIds": ["pyjh.stat.002"], "prompt": "为了解某区 $5\\,000$ 名七年级学生的体重情况，从中随机抽取 $200$ 名学生的体重进行统计。这个问题中的样本容量是什么？", "options": [{"id": "a", "text": "$200$ 名学生", "feedback": "样本容量是样本中个体的数目，不带单位。"}, {"id": "b", "text": "$200$", "feedback": "样本中个体的数目，只是一个数。"}, {"id": "c", "text": "$5\\,000$", "feedback": "$5\\,000$ 名学生的体重是总体，不是样本。"}, {"id": "d", "text": "$200$ 名学生的体重", "feedback": "这是样本，样本容量是它所含个体的数目。"}], "correct": "b", "answer": "$200$", "reasoning": ["总体：$5\\,000$ 名学生的体重；个体：每名学生的体重；样本：抽取的 $200$ 名学生的体重。", "样本容量是样本中个体的数目，为 $200$，不带单位。"], "contentVersion": "sha256:16b30a785c6684d5828a4b83341e808279e4378e40afb52d22aeb8dacc6827f6"}, {"id": "j12-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j12-2"], "pointIds": ["pyjh.stat.006"], "prompt": "在扇形图中，表示某一部分的扇形占整体的 $30\\%$，这个扇形的圆心角是多少度？", "options": [{"id": "a", "text": "$30^\\circ$", "feedback": "百分比不能直接当作度数，整个圆是 $360^\\circ$。"}, {"id": "b", "text": "$108^\\circ$", "feedback": "圆心角 $=360^\\circ\\times$所占百分比。"}, {"id": "c", "text": "$120^\\circ$", "feedback": "$120^\\circ$ 对应的是三分之一。"}, {"id": "d", "text": "$54^\\circ$", "feedback": "要用 $360^\\circ$ 乘百分比，不是 $180^\\circ$。"}], "correct": "b", "answer": "$108^\\circ$", "reasoning": ["扇形的圆心角 $=360^\\circ\\times$该部分所占的百分比。", "$360^\\circ\\times30\\%=108^\\circ$。"], "contentVersion": "sha256:8310ae8bee4f521f236eb4d497c74baf497e28b184be835e52ca0365a7508bb6"}, {"id": "j12-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j12-2"], "pointIds": ["pyjh.stat.008"], "prompt": "一组数据中最大值是 $98$，最小值是 $61$。若取组距为 $5$，应把这组数据分成几组？", "options": [{"id": "a", "text": "$7$ 组", "feedback": "$37\\div5=7.4$，$7$ 组装不下所有数据。"}, {"id": "b", "text": "$8$ 组", "feedback": "先求最大值与最小值的差，再除以组距，商不是整数时进一。"}, {"id": "c", "text": "$37$ 组", "feedback": "$37$ 是最大值与最小值的差，还要除以组距。"}, {"id": "d", "text": "$9$ 组", "feedback": "商 $7.4$ 进一取整即可。"}], "correct": "b", "answer": "$8$ 组", "reasoning": ["最大值与最小值的差：$98-61=37$。", "$37\\div5=7.4$，不是整数，进一取整，分成 $8$ 组。"], "contentVersion": "sha256:6dc53166678a5a702e19bf23bc75cf70426339c9c0cb619e8940572ebf593a69"}, {"id": "j12-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j12-2"], "pointIds": ["pyjh.stat.012", "pyjh.stat.011"], "prompt": "要直观地表示某地一周内每天最高气温的变化趋势，最适合选用哪种统计图？", "options": [{"id": "a", "text": "扇形图", "feedback": "扇形图表示各部分占整体的百分比，不反映变化。"}, {"id": "b", "text": "条形图", "feedback": "条形图便于比较各个数量的多少，变化趋势不如另一种图直观。"}, {"id": "c", "text": "折线图", "feedback": "折线的起伏能直观反映数量随时间变化的趋势。"}, {"id": "d", "text": "频数分布直方图", "feedback": "直方图表示数据在各组的分布情况，不表示随时间的变化。"}], "correct": "c", "answer": "折线图", "reasoning": ["扇形图看占比，条形图看多少，折线图看变化趋势，直方图看分布。", "气温随日期的变化趋势适合用折线图表示。"], "contentVersion": "sha256:92ff015987e8e6e6f3379d8d2bcee5db41141eea5f1552171f0f5f0c87071849"}, {"id": "j12-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j12-1"], "pointIds": ["pyjh.stat.004", "pyjh.stat.003"], "prompt": "某校有 $1\\,200$ 名学生，随机抽取 $80$ 名进行调查，其中有 $24$ 名学生最喜欢篮球。估计全校最喜欢篮球的学生约有多少名？", "options": [{"id": "a", "text": "$24$ 名", "feedback": "这是样本中的人数，要用样本的比例估计总体。"}, {"id": "b", "text": "$300$ 名", "feedback": "$\\frac{24}{80}=30\\%$，不是 $25\\%$。"}, {"id": "c", "text": "$4\\,000$ 名", "feedback": "比例弄反了：应是 $\\frac{24}{80}$，结果不能超过全校人数。"}, {"id": "d", "text": "$360$ 名", "feedback": "用样本中喜欢篮球的百分比估计全校的情况。"}], "correct": "d", "answer": "约 $360$ 名", "reasoning": ["样本中最喜欢篮球的占 $\\frac{24}{80}=30\\%$。", "估计全校：$1\\,200\\times30\\%=360$（名）。这是估计值，不是准确值。"], "contentVersion": "sha256:e515dedb640fcb0f79f5eda63572a11d867f1e77922d6bf565928703b49d7e75"}, {"id": "j12-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j12-2"], "pointIds": ["pyjh.stat.009", "pyjh.stat.010"], "prompt": "某班 $40$ 名学生一分钟跳绳次数分成五组，第一至第五组的频数依次是 $4$，$10$，$14$，$x$，$3$（组别越大次数越多）。第三组及以上（含第三组）的人数占全班的百分之几？", "options": [{"id": "a", "text": "$65\\%$", "feedback": "先由频数之和为 $40$ 求 $x$，再把第三、四、五组相加。"}, {"id": "b", "text": "$35\\%$", "feedback": "这是第三组单独所占的百分比。"}, {"id": "c", "text": "$42.5\\%$", "feedback": "第三组也要包括在内。"}, {"id": "d", "text": "$30\\%$", "feedback": "第四组的频数 $x$ 要先求出来，不能当作 $0$。"}], "correct": "a", "answer": "$65\\%$", "reasoning": ["频数之和等于总数：$4+10+14+x+3=40$，$x=9$。", "第三组及以上：$14+9+3=26$（人），$\\frac{26}{40}=65\\%$。"], "contentVersion": "sha256:f00de90d10cb3ad853c45853897d597da4765b81905eae32d7758fd5d0250289"}, {"id": "j12-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j12-1"], "pointIds": ["pyjh.stat.003"], "prompt": "要了解全校学生每天的睡眠时间，下列抽样方式中最合适的是哪一项？", "options": [{"id": "a", "text": "在七年级一个班里调查所有学生", "feedback": "只覆盖一个班，样本不能代表全校。"}, {"id": "b", "text": "从全校各年级、各班中随机抽取部分学生调查", "feedback": "随机抽取并兼顾各年级，样本具有代表性。"}, {"id": "c", "text": "只调查住校的学生", "feedback": "住校生的作息可能与走读生不同，样本有偏差。"}, {"id": "d", "text": "在晚上九点到校门口问路过的学生", "feedback": "这时候能遇到的学生不具有代表性。"}], "correct": "b", "answer": "从全校各年级、各班中随机抽取部分学生调查", "reasoning": ["用样本估计总体，要求样本具有代表性，每个个体被抽到的机会相等。", "从各年级、各班随机抽取，比只调查某个班级或某类学生更有代表性。"], "contentVersion": "sha256:bab58e6b972304ff6aa34a33b78dbe3a615cdd417f4cd7df740d633bcb3101f3"}, {"id": "j12-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j12-2"], "pointIds": ["pyjh.stat.007"], "prompt": "甲、乙两地各调查了一部分学生的运动爱好，并分别画出扇形图：甲地最喜欢足球的占 $30\\%$，乙地最喜欢足球的占 $25\\%$。下列说法正确的是哪一项？", "options": [{"id": "a", "text": "甲地最喜欢足球的学生一定比乙地多", "feedback": "扇形图只反映占比，不知道两地各调查了多少人。"}, {"id": "b", "text": "乙地最喜欢足球的学生一定比甲地多", "feedback": "同样缺少两地的调查总人数。"}, {"id": "c", "text": "两地最喜欢足球的学生一样多", "feedback": "不知道调查总人数，无法比较人数。"}, {"id": "d", "text": "仅凭这两个扇形图，无法比较两地最喜欢足球的人数", "feedback": "扇形图只表示部分占整体的百分比；人数 $=$ 总数 $\\times$ 百分比，总数未知。"}], "correct": "d", "answer": "仅凭这两个扇形图，无法比较两地最喜欢足球的人数", "reasoning": ["扇形图表示各部分占整体的百分比，不表示具体数量。", "某部分人数 $=$ 调查总人数 $\\times$ 百分比，两地总人数未知，人数无法比较。"], "contentVersion": "sha256:5dc055f56e7a97262a085fdc0186d638353a8da7f75193a58aef1ec49bc43d77"}, {"id": "j12-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j12-1", "j12-2"], "pointIds": ["pyjh.stat.006", "pyjh.stat.002"], "prompt": "调查 $200$ 名学生最喜欢的运动，结果：篮球 $70$ 人，足球 $50$ 人，跳绳若干人，其他 $30$ 人。在扇形图中，「跳绳」对应的扇形圆心角是多少度？", "options": [{"id": "a", "text": "$50^\\circ$", "feedback": "$50$ 是人数，要换成占比再乘 $360^\\circ$。"}, {"id": "b", "text": "$90^\\circ$", "feedback": "先求跳绳人数和它的占比，再乘 $360^\\circ$。"}, {"id": "c", "text": "$25^\\circ$", "feedback": "$25\\%$ 是占比，还要乘 $360^\\circ$。"}, {"id": "d", "text": "$180^\\circ$", "feedback": "跳绳人数占总数的比例算错了。"}], "correct": "b", "answer": "$90^\\circ$", "reasoning": ["跳绳人数：$200-70-50-30=50$（人），占 $\\frac{50}{200}=25\\%$。", "圆心角：$360^\\circ\\times25\\%=90^\\circ$。"], "contentVersion": "sha256:878be60b46d78948990313a315b9fe6f9560c34da748c2953ea2eed8336c87d6"}, {"id": "j12-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j12-1", "j12-2"], "pointIds": ["pyjh.stat.010", "pyjh.stat.004", "pyjh.stat.009"], "prompt": "从某年级随机抽取 $40$ 名学生的测试成绩，整理成组距为 $10$ 的频数分布直方图：$50\\sim60$ 分 $2$ 人，$60\\sim70$ 分 $6$ 人，$70\\sim80$ 分 $12$ 人，$80\\sim90$ 分 $15$ 人，$90\\sim100$ 分 $5$ 人（每组含最低分、不含最高分，最后一组含 $100$ 分）。成绩不低于 $80$ 分为优秀，该年级共 $600$ 人，估计优秀人数约是多少？", "options": [{"id": "a", "text": "$300$ 人", "feedback": "先求样本中的优秀率，再估计全年级。"}, {"id": "b", "text": "$225$ 人", "feedback": "$90\\sim100$ 分的学生也是优秀。"}, {"id": "c", "text": "$20$ 人", "feedback": "这是样本中的优秀人数，要估计的是全年级。"}, {"id": "d", "text": "$75$ 人", "feedback": "$80\\sim90$ 分的学生也是优秀。"}], "correct": "a", "answer": "约 $300$ 人", "reasoning": ["样本中不低于 $80$ 分的有 $15+5=20$（人），优秀率 $\\frac{20}{40}=50\\%$。", "估计全年级优秀人数：$600\\times50\\%=300$（人）。"], "contentVersion": "sha256:ed8190ecd5b9cc7c432eb1ad19d634f1cc06c66c99ee9b4f530f4a3bece25c15"}, {"id": "j12-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j12-1", "j12-2"], "pointIds": ["pyjh.stat.011", "pyjh.stat.004"], "prompt": "某书店 $1$ 至 $5$ 月的销售额（单位：万元）依次是 $10$，$12$，$14$，$16$，$18$。画出趋势图后，按这个趋势估计 $6$ 月的销售额，下列说法合理的是哪一项？", "options": [{"id": "a", "text": "约 $20$ 万元", "feedback": "每月大约增加 $2$ 万元，按趋势延伸做预测；预测值只是估计。"}, {"id": "b", "text": "一定是 $20$ 万元", "feedback": "趋势预测只是估计，实际销售额还会受其他因素影响。"}, {"id": "c", "text": "约 $18$ 万元", "feedback": "这是 $5$ 月的销售额，趋势是逐月增加的。"}, {"id": "d", "text": "约 $22$ 万元", "feedback": "按每月增加 $2$ 万元，只延伸一个月。"}], "correct": "a", "answer": "约 $20$ 万元", "reasoning": ["销售额每月增加 $2$ 万元，趋势线是一条上升的直线。", "延伸一个月：$18+2=20$（万元）。这是根据趋势作出的估计，不是确定的结果。"], "contentVersion": "sha256:3bbd063c078770fbced65ce0e0972e464a361606a2170a3aebd047e506b93ad9"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
