<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1020" viewBox="0 0 560 1020" role="img" aria-labelledby="title desc">
  <title id="title">四个路程 s 关于时间 t 的候选图象</title>
  <desc id="desc">各图均以横轴 t、纵轴 s，原点 O，无数字刻度。A先平后陡再平且持续上升；B先陡后缓再陡；C先陡，中部近水平，再变陡；D先升后降回横轴。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#17202a"/>
    </marker>
    <g id="axes" fill="none" stroke="#17202a" stroke-width="3.5" marker-end="url(#arrow)">
      <path d="M120 210 H490"/>
      <path d="M120 210 V25"/>
    </g>
    <style>
      text { fill: #17202a; font-family: Georgia, 'Times New Roman', serif; font-size: 36px; }
      .letter { font-family: Arial, sans-serif; font-weight: 700; font-size: 36px; }
      .curve { fill: none; stroke: #17202a; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .divider { stroke: #d6dce3; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="560" height="1020" fill="white"/>
  <g transform="translate(0 5)">
    <text class="letter" x="27" y="135">A</text>
    <use href="#axes"/>
    <text x="82" y="240">O</text><text x="500" y="223" font-style="italic">t</text><text x="87" y="40" font-style="italic">s</text>
    <path class="curve" d="M120 210 C185 210 217 199 242 155 L285 79 C311 40 394 40 450 40"/>
  </g>
  <path class="divider" d="M25 258 H535"/>
  <g transform="translate(0 260)">
    <text class="letter" x="27" y="135">B</text>
    <use href="#axes"/>
    <text x="82" y="240">O</text><text x="500" y="223" font-style="italic">t</text><text x="87" y="40" font-style="italic">s</text>
    <path class="curve" d="M120 210 C154 154 221 149 278 130 C368 100 418 102 450 40"/>
  </g>
  <path class="divider" d="M25 513 H535"/>
  <g transform="translate(0 515)">
    <text class="letter" x="27" y="135">C</text>
    <use href="#axes"/>
    <text x="82" y="240">O</text><text x="500" y="223" font-style="italic">t</text><text x="87" y="40" font-style="italic">s</text>
    <path class="curve" d="M120 210 C164 112 191 112 259 112 C342 112 416 118 450 40"/>
  </g>
  <path class="divider" d="M25 768 H535"/>
  <g transform="translate(0 770)">
    <text class="letter" x="27" y="135">D</text>
    <use href="#axes"/>
    <text x="82" y="240">O</text><text x="500" y="223" font-style="italic">t</text><text x="87" y="40" font-style="italic">s</text>
    <path class="curve" d="M120 210 C156 116 194 112 276 112 C361 112 381 122 408 210"/>
  </g>
</svg>
