<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 445" role="img" aria-labelledby="title desc"><title id="title">两个绝对值函数的图像</title><desc id="desc">实线为f的V形图像，顶点(2,0)；虚线为g的折线图像，左端水平y=-4，中段从(-3/2,-4)连接(1/2,4)，右端水平y=4。</desc><style>:root{color:#202c37;background:#fff}text{fill:currentColor;font-family:"Noto Serif CJK SC",serif}@media(prefers-color-scheme:dark){:root{color:#e8edf1;background:#17212b}}</style><path d="M 110 280 L 610 280" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M 300 410 L 300 90" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="602,275 610,280 602,285" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="295,98 300,90 305,98" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="140,140 364,280 556,160" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="140,360 252.0,360 316.0,200 556,200" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="5 4"/><text x="364" y="317" text-anchor="middle" font-size="16">2</text><text x="252" y="270" text-anchor="middle" font-size="16">−3/2</text><text x="316.0" y="317" text-anchor="middle" font-size="16">1/2</text><text x="280" y="205" text-anchor="middle" font-size="16">4</text><text x="279" y="365" text-anchor="middle" font-size="16">−4</text><text x="623" y="285" text-anchor="middle" font-size="16">x</text><text x="313" y="90" text-anchor="middle" font-size="16">y</text><text x="390" y="35" text-anchor="middle" font-size="17">实线：f(x)=|x−2|</text><text x="390" y="65" text-anchor="middle" font-size="17">虚线：g(x)=|2x+3|−|2x−1|</text></svg>
