<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 336" width="510" height="336" role="img" aria-labelledby="title desc">
<title id="title">相交直线 AB、CD 与 EO 垂直</title>
<desc id="desc">水平直线 AB 与直线 CD 相交于点 O，A 在左，B 在右，C 在左上，D 在右下。射线 OE 指向右上，OC 与 OE 之间标直角记号。OE 与 OB 之间的角标为∠1，OC 与 OA 之间的角标为∠2。</desc>
