<style>text{fill:#17202a;font-size:30px}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic}.r{font-family:'Times New Roman',Georgia,serif}.z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="490" height="340" fill="white"/>
<line x1="20.0" y1="240.0" x2="455.0" y2="240.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<polygon points="478.0,240.0 458.0,248.0 458.0,232.0" fill="#17202a"/>
<line x1="110.0" y1="330.0" x2="110.0" y2="45.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<polygon points="110.0,22.0 118.0,42.0 102.0,42.0" fill="#17202a"/>
<circle cx="338.0" cy="240.0" r="6" fill="#17202a"/>
<text class="m" x="84.0" y="282.0" text-anchor="middle">O</text>
<text class="m" x="320.0" y="282.0" text-anchor="middle">A</text>
<text class="m" x="455.0" y="282.0" text-anchor="middle">x</text>
