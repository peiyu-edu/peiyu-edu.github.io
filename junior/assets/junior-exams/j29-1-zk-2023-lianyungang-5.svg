<line x1="511.0" y1="94.0" x2="578.3" y2="83.4" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<circle cx="500.0" cy="100.0" r="4.5" fill="#17202a"/>
<text class="it" x="482.0" y="130.0" text-anchor="middle" font-size="30">O</text>
<text class="zh" x="545.0" y="76.0" text-anchor="middle" font-size="30">丙</text>
