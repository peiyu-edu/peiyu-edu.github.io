<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 356" width="560" height="356" role="img" aria-labelledby="title desc">
<title id="title">三角形 ABC 中连接 DE</title>
<desc id="desc">△ABC，A 在上方，B 在左下，C 在右下。点 E 在边 AB 上，点 D 在边 AC 上，连接 DE。</desc>
<style>text { fill:#17202a; font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; font-size:28px; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .sub { font-size:21px; }</style>
<rect width="560" height="356" fill="white"/>
<polygon points="371,45 45,323 512,323" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="147.4" y1="235.7" x2="441.5" y2="184.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="371" y="34" text-anchor="middle" class="m">A</text>
<text x="20" y="344" text-anchor="start" class="m">B</text>
<text x="518" y="344" text-anchor="start" class="m">C</text>
<text x="139.4" y="229.7" text-anchor="end" class="m">E</text>
<text x="451.5" y="186.0" text-anchor="start" class="m">D</text>
</svg>
