<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 352" role="img" aria-labelledby="title desc"><title id="title">10位居民讲座前后问卷正确率散点图</title><desc id="desc">横轴为居民编号1到10，纵轴为正确率，从60%到100%每隔5%一条虚线，纵轴在0与60%之间有折断号。星号表示讲座前，圆点表示讲座后。讲座前：1号65%，2号60%，3号70%，4号60%，5号65%，6号75%，7号90%，8号85%，9号80%，10号95%。讲座后：1号90%，2号85%，3号80%，4号90%，5号85%，6号85%，7号95%，8号100%，9号85%，10号100%。</desc><style>path,circle{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M90,296L90,20" /><path d="M85,28L90,18L95,28" /><path d="M90,296L518,296" /><path d="M508,291L518,296L508,301" /><path d="M90,290l-6,-4l12,-4l-12,-4l6,-3" style="stroke-width:1.5;fill:none" /><path d="M96,268.0L484,268.0" stroke-dasharray="4 4" style="stroke-width:1.2" /><text x="80" y="274.0" text-anchor="end" font-size="17">60%</text><path d="M96,246.0L484,246.0" stroke-dasharray="4 4" style="stroke-width:1.2" /><text x="80" y="252.0" text-anchor="end" font-size="17">65%</text><path d="M96,224.0L484,224.0" stroke-dasharray="4 4" style="stroke-width:1.2" /><text x="80" y="230.0" text-anchor="end" font-size="17">70%</text><path d="M96,202.0L484,202.0" stroke-dasharray="4 4" style="stroke-width:1.2" /><text x="80" y="208.0" text-anchor="end" font-size="17">75%</text><path d="M96,180.0L484,180.0" stroke-dasharray="4 4" style="stroke-width:1.2" /><text x="80" y="186.0" text-anchor="end" font-size="17">80%</text><path d="M96,158.0L484,158.0" stroke-dasharray="4 4" style="stroke-width:1.2" /><text x="80" y="164.0" text-anchor="end" font-size="17">85%</text><path d="M96,136.0L484,136.0" stroke-dasharray="4 4" style="stroke-width:1.2" /><text x="80" y="142.0" text-anchor="end" font-size="17">90%</text><path d="M96,114.0L484,114.0" stroke-dasharray="4 4" style="stroke-width:1.2" /><text x="80" y="120.0" text-anchor="end" font-size="17">95%</text><path d="M96,92.0L484,92