<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" role="img" aria-labelledby="title desc"><title id="title">湖中小岛A、B与观测点C、D</title><desc id="desc">平面示意图：灰色区域表示湖中小岛所在处，A、B在其中。A在C正北，CA为实线；D在A正东，AD为实线；连接CD，C处标56°（CA与CD的夹角）。A处有向北的虚线，虚线AB与它的夹角标37°；D处有南北向虚线，实线DB与向北方向的夹角标53°。右上角有指北、指东的方向标。</desc><style>path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.d{stroke-dasharray:6 5;stroke-width:1.5}.i{fill:currentColor;fill-opacity:.22;stroke-width:1.5}.ar{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.v{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path class="i" d="M80,300C40,290 30,230 50,170C70,110 130,50 190,48C240,46 245,95 220,125C195,155 150,175 130,215C118,245 115,305 80,300Z"/><path d="M100,400L100,215L374,215ZM374,215L199,84"/><path class="d" d="M100,215V70M100,215L199,84M374,90V290"/><path d="M100.0,189.0A26,26 0 0 1 115.6,194.2M356.4,201.8A22,22 0 0 1 374.0,193.0M100.0,374.0A26,26 0 0 1 121.6,385.5"/><text x="106" y="150" font-size="18">37°</text><text x="322" y="150" font-size="18">53°</text><text x="108" y="356" font-size="18">56°</text><text class="v" x="76" y="222" font-size="20">A</text><text class="v" x="192" y="76" font-size="20">B</text><text class="v" x="92" y="428" font-size="20">C</text><text class="v" x="384" y="222" font-size="20">D</text><path d="M410,90V40M390,62H450"/><path class="ar" d="M410,32l-5,12h10ZM458,62l-12,-5v10Z"/><text x="400" y="26" font-size="18">北</text><text x="462" y="68" font-size="18" text-anchor="start">东</text></svg>