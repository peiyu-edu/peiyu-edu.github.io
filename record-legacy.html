<table class="rec"><thead><tr><th>节</th><th>真题做了</th><th>做对</th><th>先猜猜对</th><th>最近一次</th></tr></thead><tbody id="rows"></tbody></table>

<script>
var NAMES = {"b1-1-1": "1.1 集合的概念", "b1-1-2": "1.2 集合间的基本关系", "b1-1-3": "1.3 集合的基本运算", "b1-1-4": "1.4 充分条件与必要条件", "b1-1-5": "1.5 全称量词与存在量词", "b1-2-1": "2.1 等式性质与不等式性质", "b1-2-2": "2.2 基本不等式", "b1-2-3": "2.3 二次函数与一元二次方程、不等式", "b1-3-1": "3.1 函数的概念及其表示", "b1-3-2": "3.2 函数的基本性质", "b1-3-3": "3.3 幂函数", "b1-3-4": "3.4 函数的应用（一）", "b1-4-1": "4.1 指数", "b1-4-2": "4.2 指数函数", "b1-4-3": "4.3 对数", "b1-4-4": "4.4 对数函数", "b1-4-5": "4.5 函数的应用（二）", "b1-5-1": "5.1 任意角和弧度制", "b1-5-2": "5.2 三角函数的概念", "b1-5-3": "5.3 诱导公式", "b1-5-4": "5.4 三角函数的图象与性质", "b1-5-5": "5.5 三角恒等变换", "b1-5-6": "5.6 函数 y=Asin(ωx+φ)", "b1-5-7": "5.7 三角函数的应用", "b2-6-1": "6.1 平面向量的概念", "b2-6-2": "6.2 平面向量的运算", "b2-6-3": "6.3 平面向量基本定理及坐标表示", "b2-6-4": "6.4 平面向量的应用", "b2-7-1": "7.1 复数的概念", "b2-7-2": "7.2 复数的四则运算", "b2-7-3": "7.3 复数的三角表示（选学）", "b2-8-1": "8.1 基本立体图形", "b2-8-2": "8.2 立体图形的直观图", "b2-8-3": "8.3 简单几何体的表面积与体积", "b2-8-4": "8.4 空间点、直线、平面之间的位置关系", "b2-8-5": "8.5 空间直线、平面的平行", "b2-8-6": "8.6 空间直线、平面的垂直", "b2-9-1": "9.1 随机抽样", "b2-9-2": "9.2 用样本估计总体", "b2-9-3": "9.3 统计案例", "b2-10-1": "10.1 随机事件与概率", "b2-10-2": "10.2 事件的相互独立性", "b2-10-3": "10.3 频率与概率", "e1-1-1": "1.1 空间向量及其运算", "e1-1-2": "1.2 空间向量基本定理", "e1-1-3": "1.3 空间向量及其运算的坐标表示", "e1-1-4": "1.4 空间向量的应用", "e1-2-1": "2.1 直线的倾斜角与斜率", "e1-2-2": "2.2 直线的方程", "e1-2-3": "2.3 直线的交点坐标与距离公式", "e1-2-4": "2.4 圆的方程", "e1-2-5": "2.5 直线与圆、圆与圆的位置关系", "e1-3-1": "3.1 椭圆", "e1-3-2": "3.2 双曲线", "e1-3-3": "3.3 抛物线", "e2-4-1": "4.1 数列的概念", "e2-4-2": "4.2 等差数列", "e2-4-3": "4.3 等比数列", "e2-4-4": "4.4 数学归纳法（选学）", "e2-5-1": "5.1 导数的概念及其意义", "e2-5-2": "5.2 导数的运算", "e2-5-3": "5.3 导数在研究函数中的应用", "e3-6-1": "6.1 分类加法计数原理与分步乘法计数原理", "e3-6-2": "6.2 排列与组合", "e3-6-3": "6.3 二项式定理", "e3-7-1": "7.1 条件概率与全概率公式", "e3-7-2": "7.2 离散型随机变量及其分布列", "e3-7-3": "7.3 离散型随机变量的数字特征", "e3-7-4": "7.4 二项分布与超几何分布", "e3-7-5": "7.5 正态分布", "e3-8-1": "8.1 成对数据的统计相关性", "e3-8-2": "8.2 一元线性回归模型及其应用", "e3-8-3": "8.3 列联表与独立性检验"};
var L=[];try{L=JSON.parse(localStorage.getItem('peiyu.hs.log')||'[]')}catch(e){}
var nm=document.getElementById('name');try{nm.value=localStorage.getItem('peiyu.hs.name')||''}catch(e){}
nm.oninput=function(){try{localStorage.setItem('peiyu.hs.name',nm.value)}catch(e){};dump()};
var by={};L.forEach(function(e){var s=by[e.sec]||(by[e.sec]={n:0,ok:0,p:0,pok:0,t:0,seen:{}});s.t=Math.max(s.t,e.t);
 if(e.kind==='answer'&&!s.seen[e.id]){s.seen[e.id]=1;s.n++;if(e.correct)s.ok++}
 if(e.kind==='predict'){s.p++;if(e.correct)s.pok++}});
var rows=document.getElementById('rows'),keys=Object.keys(by).filter(function(k){return NAMES[k]}).sort();
if(!keys.length)rows.innerHTML='<tr><td colspan="5" class="small">还没有记录。</td></tr>';
keys.forEach(function(k){var s=by[k],d=new Date(s.t);rows.insertAdjacentHTML('beforeend','<tr><td><a href="lessons/'+k+'.html">'+NAMES[k]+'</a></td><td>'+s.n+'</td><td>'+s.ok+'</td><td>'+s.pok+'/'+s.p+'</td><td>'+(d.getMonth()+1)+'-'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2)+'</td></tr>')});
function dump(){var ev=L.filter(function(e){return e.kind!=='open'}).map(function(e){return [e.t,e.sec,e.kind,e.id||e.step||'',e.choice||'',e.correct===undefined?'':(e.correct?1:0)]});
 document.getElementById('out').value=JSON.stringify({name:nm.value,v:1,events:ev})}
dump();
document.getElementById('copy').onclick=function(){var o=document.getElementById('out');o.select();
 (navigator.clipboard?navigator.clipboard.writeText(o.value):Promise.reject()).then(function(){msg('已复制，粘贴到微信发给老师')},function(){document.execCommand('copy');msg('已复制')})};
function msg(t){document.getElementById('msg').textContent=t}
document.getElementById('clear').onclick=function(){if(confirm('确定清空？清空后找不回来。')){try{localStorage.removeItem('peiyu.hs.log')}catch(e){};location.reload()}};
</script>
