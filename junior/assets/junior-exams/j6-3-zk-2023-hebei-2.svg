<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 352" width="600" height="352" role="img" aria-labelledby="title desc">
<title id="title">淇淇家与西柏坡方位图</title>
<desc id="desc">左上角方向标指示上北、右东。淇淇家在右上，西柏坡在左下，两点用线段连接，两点处各画虚线十字方向线。在淇淇家处，向南的虚线与连到西柏坡的线段之间标 70°。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="600" height="352" fill="white"/>
<line x1="420.0" y1="150.0" x2="166.3" y2="242.3" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="420.0" y1="80.0" x2="420.0" y2="240.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="8 7"/>
<line x1="330.0" y1="150.0" x2="515.0" y2="150.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="8 7"/>
<line x1="166.3" y1="157.3" x2="166.3" y2="342.3" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="8 7"/>
<line x1="61.3" y1="242.3" x2="261.3" y2="242.3" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="8 7"/>
<path d="M420.0 190.0A40 40 0 0 1 382.4 163.7" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="376.0" y="226.0" class="n" text-anchor="middle" font-size="28">70°</text>
<text x="435.0" y="136.0" class="z" text-anchor="start" font-size="30">淇淇家</text>
<text x="152.3" y="284.3" class="z" text-anchor="end" font-size="30">西柏坡</text>
<line x1="60.0" y1="122.0" x2="60.0" y2="62.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="60.0,50.0 54.0,64.8 66.0,64.8" fill="#17202a"/>
<line x1="20.0" y1="82.0" x2="96.0" y2="82.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="108.0,82.0 93.2,76.0 93.2,88.0" fill="#17202a"/>
<text x="60.0" y="42.0" class="z" text-anchor="middle" font-size="28">北</text>
<text x="132.0" y="92.0" class="z" text-anchor="middle" font-size="28">东</text>
</svg>
