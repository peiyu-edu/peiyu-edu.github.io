<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 590" width="560" height="590" role="img" aria-labelledby="title desc">
<title id="title">选择结果统计表和扇形统计图</title>
<desc id="desc">统计表：元宇宙 16 人，脑机接口 a 人，人形机器人 14 人。扇形统计图分元宇宙、脑机接口、人形机器人三块，只标出元宇宙占 40%。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="560" height="590" fill="white"/>
<rect x="110.0" y="12.0" width="340.0" height="208.0" fill="none" stroke="#17202a" stroke-width="2.5"/>
<line x1="325.0" y1="12.0" x2="325.0" y2="220.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="387.5" y="48.0" class="c" text-anchor="middle">人数</text>
<line x1="110.0" y1="64.0" x2="450.0" y2="64.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="217.5" y="100.0" class="c" text-anchor="middle">元宇宙</text>
<text x="387.5" y="100.0" class="n" text-anchor="middle">16</text>
<line x1="110.0" y1="116.0" x2="450.0" y2="116.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="217.5" y="152.0" class="c" text-anchor="middle">脑机接口</text>
<text x="387.5" y="152.0" class="l" text-anchor="middle">a</text>
<line x1="110.0" y1="168.0" x2="450.0" y2="168.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="217.5" y="204.0" class="c" text-anchor="middle">人形机器人</text>
<text x="387.5" y="204.0" class="n" text-anchor="middle">14</text>
<circle cx="280.0" cy="405.0" r="170" fill="none" stroke="#17202a" stroke-width="2.5"/>
<line x1="280.0" y1="405.0" x2="329.7" y2="242.4" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="280.0" y1="405.0" x2="144.2" y2="507.3" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="280.0" y1="405.0" x2="382.3" y2="540.8" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="204.6" y="348.2" class="c" text-anchor="middle">元宇宙</text>
<text x="204.6" y="382.2" class="n" text-anchor="middle">40%</text>
<text x="265.4" y="519.0" class="c" text-anchor="middle">脑机接口</text>
<text x="373.6" y="384.5" class="c" text-anchor="middle">人形</text>
<text x="373.6" y="418.5" class="c" text-anchor="middle">机器人</text>
</svg>
