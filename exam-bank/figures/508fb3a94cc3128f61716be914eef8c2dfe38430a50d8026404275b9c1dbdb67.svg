<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 390" role="img" aria-labelledby="title desc"><title id="title">正视图与四个侧视图选项</title><desc id="desc">正视图的正方形左下角有一条虚斜线。选项A为右下实斜线，B为左下虚斜线，C为右下虚斜线，D为左下实斜线。</desc><style>svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}rect,path{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;font:18px "Noto Sans CJK SC",serif}.dash{stroke-dasharray:6 5}</style>
<rect x="200" y="15" width="120" height="120"/>
<path class="dash" d="M200 75 L260 135"/>
<text x="260" y="160" text-anchor="middle">正视图</text>
<rect x="10" y="210" width="120" height="120"/>
<path d="M70 330 L130 270"/>
<text x="70" y="355" text-anchor="middle">A</text>
<rect x="140" y="210" width="120" height="120"/>
<path class="dash" d="M140 270 L200 330"/>
<text x="200" y="355" text-anchor="middle">B</text>
<rect x="270" y="210" width="120" height="120"/>
<path class="dash" d="M330 330 L390 270"/>
<text x="330" y="355" text-anchor="middle">C</text>
<rect x="400" y="210" width="120" height="120"/>
<path d="M400 270 L460 330"/>
<text x="460" y="355" text-anchor="middle">D</text>
</svg>
