<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc"><title id="title">圆形剪纸图案</title><desc id="desc">一个大圆内有四个大小相同的小圆，分别位于上下左右，都经过大圆圆心并与大圆相切；相邻小圆重叠的四片月牙形和小圆外、大圆内的部分涂灰，其余为空白。</desc><style>path,circle{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.g{fill:var(--g);stroke:none}.w{fill:var(--bg);stroke:none}svg{color:#243d45;background:#fff;--bg:#fff;--g:#b9c2c2}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--bg:#15272d;--g:#4e6469}}</style><circle class="g" cx="160" cy="160" r="120"/><circle class="w" cx="220" cy="160" r="60"/><circle class="w" cx="160" cy="100" r="60"/><circle class="w" cx="100" cy="160" r="60"/><circle class="w" cx="160" cy="220" r="60"/><path class="g" d="M160,160A60,60 0 0 1 220,100A60,60 0 0 1 160,160Z"/><path class="g" d="M160,160A60,60 0 0 1 100,100A60,60 0 0 1 160,160Z"/><path class="g" d="M160,160A60,60 0 0 1 100,220A60,60 0 0 1 160,160Z"/><path class="g" d="M160,160A60,60 0 0 1 220,220A60,60 0 0 1 160,160Z"/><circle cx="160" cy="160" r="120"/><circle cx="220" cy="160" r="60"/><circle cx="160" cy="100" r="60"/><circle cx="100" cy="160" r="60"/><circle cx="160" cy="220" r="60"/></svg>
