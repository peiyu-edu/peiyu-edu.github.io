<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级上册 第三单元 多位数乘两位数 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p4a-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>四年级上册 第三单元 多位数乘两位数 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p4a-u3-test", "sectionId": "p4a-u3-test", "unitId": "p4a-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "四年级上册 第三单元 多位数乘两位数 单元测评", "items": [{"id": "p4a-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "口算：23 × 3 = □，14 × 5 = □。", "answer": "69，70", "reasoning": ["23 × 3：20 × 3 = 60，3 × 3 = 9，60 + 9 = 69。", "14 × 5：10 × 5 = 50，4 × 5 = 20，50 + 20 = 70。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u3.001"], "contentVersion": "sha256:25486390b9dd0d3daee7e8521d998eb5a034d787e6cc09a47db9193322a51fe1"}, {"id": "p4a-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "口算：30 × 40 = □，12 × 30 = □。", "answer": "1200，360", "reasoning": ["30 × 40：先算 3 × 4 = 12，两个乘数末尾一共有 2 个 0，在 12 后面添 2 个 0，得 1200。", "12 × 30：先算 12 × 3 = 36，再在后面添 1 个 0，得 360。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u3.002"], "contentVersion": "sha256:9cf791c0cdd90e562e000ed76fb584616e93342587222bac07e56c3976f94e75"}, {"id": "p4a-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "笔算 32 × 23。", "answer": "736", "reasoning": ["先用 3 去乘 32：32 × 3 = 96。", "再用十位上的 2 去乘 32，表示 20 个 32：32 × 20 = 640，末位和十位对齐。", "最后相加：96 + 640 = 736。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u3.003"], "contentVersion": "sha256:467c5310120f442089354a8d51aba5ce85235e349380d75be9b8b2971577e8af"}, {"id": "p4a-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "笔算 47 × 36。", "answer": "1692", "reasoning": ["47 × 6 = 282。", "47 × 30 = 1410。", "282 + 1410 = 1692。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u3.004"], "contentVersion": "sha256:e3dd570d42a13cb2818f24e51957a7c4a40e03ff693d8501be2a1ea4210f5c1a"}, {"id": "p4a-u3-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "笔算 305 × 26。", "answer": "7930", "reasoning": ["305 × 6 = 1830：个位 5 × 6 = 30，个位写 0，向十位进 3；十位 0 × 6 = 0，加上进来的 3，十位写 3；百位 3 × 6 = 18。", "305 × 20 = 6100。", "1830 + 6100 = 7930。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u3.005"], "contentVersion": "sha256:72213ec316f780f10d2e39b7ce07cde2cb7e535bda5ecf9e4baf01fa6e7e0611"}, {"id": "p4a-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "计算 240 × 50。", "answer": "12000", "reasoning": ["先算 24 × 5 = 120。", "两个乘数末尾一共有 2 个 0，在 120 后面再添 2 个 0，得 12000。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u3.006"], "contentVersion": "sha256:64812d60fec960d61a29f86f59c5d5eeee6eaf13bc1e4f140365d4ad171b68bf"}, {"id": "p4a-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "已知 25 × 16 = 400，那么 25 × 48 等于多少？", "answer": "1200", "reasoning": ["比较两个算式：25 没变，16 变成 48，16 × 3 = 48。", "一个乘数不变，另一个乘数乘 3，积也乘 3：400 × 3 = 1200。"], "options": [{"id": "a", "text": "432", "feedback": "不是把积加上 32。另一个乘数乘了 3，积也要乘 3。"}, {"id": "b", "text": "1200", "feedback": "对。48 是 16 的 3 倍，一个乘数不变，另一个乘数乘 3，积也乘 3：400 × 3 = 1200。"}, {"id": "c", "text": "1600", "feedback": "48 是 16 的 3 倍，不是 4 倍，积应该乘 3。"}], "correct": "b", "pointIds": ["pyps.p4a.u3.007"], "contentVersion": "sha256:5a213cc98d9a482f3f5d59bb70be1b061722f6888f60154ddc6fdf65218afe4f"}, {"id": "p4a-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "学校买 28 套桌椅，每套 196 元。带 6000 元够不够？", "answer": "够", "reasoning": ["把 196 往大估成 200，把 28 往大估成 30。", "200 × 30 = 6000，往大估的钱数也没有超过 6000 元。", "实际要付的钱比往大估的还少，所以 6000 元够。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u3.009"], "contentVersion": "sha256:29cd074c2649589672f66e9bc59aab9bfeaed0edac89c86c47f334ece6c42667"}, {"id": "p4a-u3-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "58 × 34 的积是多少？", "answer": "1972", "reasoning": ["58 × 4 = 232。", "58 × 30 = 1740。", "232 + 1740 = 1972。"], "options": [{"id": "a", "text": "1972", "feedback": "对。58 × 4 = 232，58 × 30 = 1740，232 + 1740 = 1972。"}, {"id": "b", "text": "406", "feedback": "用十位上的 3 去乘，得到的是 174 个十，也就是 1740，末位要和十位对齐，不能和个位对齐。"}, {"id": "c", "text": "1962", "feedback": "相加时进位算错了。232 + 1740 = 1972。"}], "correct": "a", "pointIds": ["pyps.p4a.u3.004"], "contentVersion": "sha256:f3370839c6efc87e18d7e9a414791e0bbd3f795a7a1f0c4542eb2f029ffbd549"}, {"id": "p4a-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "用计算器算出：11 × 11 = 121，111 × 111 = 12321。照这个规律，不用计算器写出 1111 × 1111 的积。", "answer": "1234321", "reasoning": ["11 × 11 = 121，积从 1 数到 2 再数回 1；111 × 111 = 12321，从 1 数到 3 再数回 1。", "本题猜想由四个 1 组成的数与自身相乘时，积从 1 数到 4，再数回 1，得到 1234321。", "用乘法检验：1111 × 1111 = 1111000 + 111100 + 11110 + 1111 = 1234321。", "这个规律只适用于 1 至 9 个 1 组成的数与自身相乘；到 10 个 1 时会发生进位，不能照搬。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u3.008"], "contentVersion": "sha256:1f88ffc9c5b5340a6b06f4d0461f80fb7e1f88ab793fd9fdf99308ccfcdb4d74"}, {"id": "p4a-u3-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "每箱牛奶有 24 盒，学校买了 35 箱，要分给 820 名同学每人 1 盒。够不够？还剩几盒或还差几盒？", "answer": "够，还剩 20 盒", "reasoning": ["先求一共有多少盒：24 × 35 = 840（盒）。", "840 比 820 多，够分。", "840 − 820 = 20，还剩 20 盒。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u3.004", "pyps.p4a.u3.003"], "contentVersion": "sha256:ed2e8f8f32f2ca39afa69c460434f285e3d79bcfeef09e737408dbb0426d32cf"}], "contentVersion": "sha256:f83e10a7a018ca2b11b63fd5a51c6b220d4168a6687320b728af03f839db1afa"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
