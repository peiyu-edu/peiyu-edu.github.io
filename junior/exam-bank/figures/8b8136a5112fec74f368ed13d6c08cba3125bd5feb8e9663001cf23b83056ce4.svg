<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 295 195" role="img" aria-labelledby="title desc"><title id="title">圆与菱形</title><desc id="desc">圆O中AD为直径，四边形OABC的顶点B、C在圆上，AD延长到点P，连接PC。</desc><style>path,circle,line,polyline,polygon{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-size:17px}.i{font-style:italic}.c{font-family:"Noto Sans CJK SC","PingFang SC",sans-serif}.f{fill:currentColor;stroke:none}.b{fill:#fff;stroke:none}.bs{stroke:#fff}.g{stroke-width:1;stroke-dasharray:4 3;opacity:.6}.d{stroke-dasharray:6 4}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.b{fill:#15272d}.bs{stroke:#15272d}}</style><circle cx="120" cy="110" r="75"/><line x1="45.0" y1="110.0" x2="270.0" y2="110.0"/><polygon points="120.0,110.0 45.0,110.0 82.5,45.0 157.5,45.0"/><line x1="157.5" y1="45.0" x2="270.0" y2="110.0"/><circle class="f" cx="120" cy="110" r="3"/><text x="26.0" y="116.0" class="i" >A</text><text x="70.0" y="36.0" class="i" >B</text><text x="162.0" y="36.0" class="i" >C</text><text x="114.0" y="132.0" class="i" >O</text><text x="200.0" y="132.0" class="i" >D</text><text x="270.0" y="132.0" class="i" >P</text></svg>
