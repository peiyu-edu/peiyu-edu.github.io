<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" role="img" aria-labelledby="title desc"><title id="title">四个几何体选项</title><desc id="desc">按A至D顺序画出四个立体图形的线条：A的上下各有一个椭圆，两条竖直线连接两个椭圆的左右两端；B由上方一点向下方一个椭圆的左右两端各引一条线；C的外轮廓为圆，内部有一条椭圆，椭圆上半部虚线、下半部实线；D由上方一点向下方三个点各引一条线，三个点两两相连；看不见的线画成虚线。</desc><style>path,circle,line,polyline,polygon,ellipse{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.cjk{font-family:"Noto Sans CJK SC",sans-serif}.dash{stroke-dasharray:6 5}.thin{stroke-width:1}.grid{stroke-width:1;stroke-dasharray:3 3;opacity:.55}.dot{fill:currentColor;stroke:none}.shade{fill:currentColor;fill-opacity:.28;stroke:none}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><text x="28.00" y="92.00" text-anchor="middle" font-size="20">A</text><text x="198.00" y="92.00" text-anchor="middle" font-size="20">B</text><text x="368.00" y="92.00" text-anchor="middle" font-size="20">C</text><text x="538.00" y="92.00" text-anchor="middle" font-size="20">D</text><ellipse cx="105" cy="40" rx="36" ry="10"/><path d="M69.00,40.00L69.00,140.00"/><path d="M141.00,40.00L141.00,140.00"/><path d="M69.00,140.00A36,10 0 0 0 141.00,140.00"/><path class="dash" d="M69.00,140.00A36,10 0 0 1 141.00,140.00"/><path d="M275.00,28.00L233.00,138.00"/><path d="M275.00,28.00L317.00,138.00"/><path d="M233.00,138.00A42,11 0 0 0 317.00,138.00"/><path class="dash" d="M233.00,138.00A42,11 0 0 1 317.00,138.00"/><circle cx="445" cy="88" r="50"/><path d="M395.00,88.00A50,13 0 0 0 495.00,88.00"/><path class="dash" d="M395.00,88.00A50,13 0 0 1 495.00,88.00"/><path d="M615.00,30.00L573.00,128.00"/><path d="M615.00,30.00L625.00,146.00"/><path d="M615.00,30.00L657.00,126.00"/><path d="M573.00,128.00L625.00,146.00"/><path d="M625.00,146.00L657.00,126.00"/><path class="dash" d="M573.00,128.00L657.00,126.00"/></svg>
