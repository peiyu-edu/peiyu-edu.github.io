<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 310" width="590" height="310" role="img" aria-labelledby="title desc">
<title id="title">手抄报获奖作品条形图</title>
<desc id="desc">条形图：横轴为等级，依次是一等奖、二等奖、三等奖、优胜奖；纵轴为作品数，刻度标 10、a、50。一等奖和优胜奖的条形高到 10，二等奖高到 a，三等奖高到 50。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="590" height="310" fill="white"/>
<line x1="90.0" y1="260.0" x2="90.0" y2="15.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="90.0,15.0 97.0,31.0 83.0,31.0" fill="#17202a"/>
<line x1="90.0" y1="260.0" x2="532.0" y2="260.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="532.0,260.0 516.0,267.0 516.0,253.0" fill="#17202a"/>
<text x="104.0" y="38.0" class="c" text-anchor="start">作品数</text>
<text x="76.0" y="270.0" class="n" text-anchor="end">0</text>
<text x="76.0" y="230.0" class="n" text-anchor="end">10</text>
<text x="76.0" y="150.0" class="l" text-anchor="end">a</text>
<text x="76.0" y="70.0" class="n" text-anchor="end">50</text>
<line x1="90.0" y1="60.0" x2="321.0" y2="60.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<line x1="90.0" y1="140.0" x2="213.0" y2="140.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<line x1="90.0" y1="220.0" x2="105.0" y2="220.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<line x1="185.0" y1="220.0" x2="213.0" y2="220.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<line x1="401.0" y1="220.0" x2="429.0" y2="220.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<rect x="105.0" y="220.0" width="80.0" height="40.0" fill="white" stroke="#17202a" stroke-width="2.5"/>
<text x="145.0" y="296.0" class="c" text-anchor="middle">一等奖</text>
<rect x="213.0" y="140.0" width="80.0" height="120.0" fill="white" stroke="#17202a" stroke-width="2.5"/>
<text x="253.0" y="296.0" class="c" text-anchor="middle">二等奖</text>
<rect x="321.0" y="60.0" width="80.0" height="200.0" fill="white" stroke="#17202a" stroke-width="2.5"/>
<text x="361.0" y="296.0" class="c" text-anchor="middle">三等奖</text>
<rect x="429.0" y="220.0" width="80.0" height="40.0" fill="white" stroke="#17202a" stroke-width="2.5"/>
<text x="469.0" y="296.0" class="c" text-anchor="middle">优胜奖</text>
<text x="520.0" y="296.0" class="c" text-anchor="start">等级</text>
</svg>
