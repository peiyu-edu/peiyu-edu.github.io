<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级下册 第六单元 数量间的加减关系 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p1b-u6-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级下册 第六单元 数量间的加减关系 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1b-u6-test", "sectionId": "p1b-u6-test", "unitId": "p1b-u6", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级下册 第六单元 数量间的加减关系 单元测评", "items": [{"id": "p1b-u6-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "红花有 8 朵，黄花有 6 朵。一共有几朵花？", "answer": "8 + 6 = 14（朵）", "reasoning": ["求一共，就是把红花和黄花合起来。", "求总数用加法：8 + 6 = 14（朵）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u6.001"], "contentVersion": "sha256:8cb4771072a13f835a24e88208adee588b202fac72f7f147462d570561279b54"}, {"id": "p1b-u6-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一共有 15 个气球，其中红气球有 9 个，其余是蓝气球。蓝气球有几个？", "answer": "15 − 9 = 6（个）", "reasoning": ["15 个分成红气球和蓝气球两部分。", "求一部分，用总数减去另一部分：15 − 9 = 6（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u6.001"], "contentVersion": "sha256:fd2778b529069076185f6ee0759206d81370804cde6e9be4867c2efd47795e2d"}, {"id": "p1b-u6-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "小明有 12 颗糖，小丽有 7 颗糖。小明比小丽多几颗？", "answer": "12 − 7 = 5（颗）", "reasoning": ["把小明的糖分成两部分：和小丽同样多的 7 颗，和多出来的部分。", "求多几颗，用减法：12 − 7 = 5（颗）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u6.002"], "contentVersion": "sha256:8d7ac76caa1e5eb206659a103c68ed8f1683d1e43081662d01c25729fa18d3ae"}, {"id": "p1b-u6-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "小猫钓了 9 条鱼，小狗比小猫多钓 4 条。小狗钓了几条鱼？", "answer": "9 + 4 = 13（条）", "reasoning": ["小狗钓的 = 和小猫同样多的 9 条，再多 4 条。", "求比 9 多 4 的数，用加法：9 + 4 = 13（条）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u6.003"], "contentVersion": "sha256:9f1878a77121b048e8b36fccfdc16852b4000036b66fb29a4e134ca186700a7b"}, {"id": "p1b-u6-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "哥哥有 35 本书，弟弟比哥哥少 12 本。弟弟有几本书？", "answer": "35 − 12 = 23（本）", "reasoning": ["弟弟比哥哥少 12 本，就是从 35 本里去掉 12 本。", "求比 35 少 12 的数，用减法：35 − 12 = 23（本）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u6.003"], "contentVersion": "sha256:6939d3989ed9db4f530d154a134603cb901154845b55e5b737410245ed478d5c"}, {"id": "p1b-u6-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "果园里有苹果树 26 棵，梨树 40 棵。苹果树比梨树少几棵？", "answer": "40 − 26 = 14（棵）", "reasoning": ["求少几棵，就是求两种树相差几棵，用多的减去少的。", "梨树多，40 − 26 = 14（棵）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u6.002"], "contentVersion": "sha256:7c5c895209224411aae2a69a561e003f63cfe41d3fe5fba49bd0794df1e39f9d"}, {"id": "p1b-u6-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "小明有 8 张画片，小丽比小明多 3 张。求小丽有几张画片，应该怎样列式？", "answer": "8 + 3", "reasoning": ["小丽的画片 = 和小明同样多的 8 张，再多 3 张。", "列式 8 + 3 = 11（张）。"], "options": [{"id": "a", "text": "8 − 3", "feedback": "小丽比小明多，小丽的画片要比 8 张多，应该用加法。"}, {"id": "b", "text": "3 + 3", "feedback": "3 是多出来的张数，要在小明的 8 张上再加 3。"}, {"id": "c", "text": "8 + 3", "feedback": "对。比 8 多 3，用 8 + 3 = 11（张）。"}], "correct": "c", "pointIds": ["pyps.p1b.u6.003"], "contentVersion": "sha256:cd756e199b3229db477663c7f5f7288a3ce6d0fe706b892ef8bf2e1d0d5c4259"}, {"id": "p1b-u6-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "公交车上有一些人，到站下去 18 人后，车上还剩 25 人。车上原来有几人？", "answer": "25 + 18 = 43（人）", "reasoning": ["原来的人分成两部分：下去的 18 人和还剩的 25 人。", "求总数用加法：25 + 18 = 43（人）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u6.001"], "contentVersion": "sha256:a96fe09c29bc83fa88e33f4d869a844ba693d388b19cb7c75af796c980f3c029"}, {"id": "p1b-u6-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "比 40 少 3 的数是几？", "answer": "37", "reasoning": ["比 40 少 3，用减法。", "40 − 3 = 37。"], "options": [{"id": "a", "text": "43", "feedback": "43 是比 40 多 3 的数。"}, {"id": "b", "text": "37", "feedback": "对。比 40 少 3，用 40 − 3 = 37。"}, {"id": "c", "text": "7", "feedback": "40 是 4 个十，不是 4 个一。40 − 3 = 37。"}], "correct": "b", "pointIds": ["pyps.p1b.u6.003"], "contentVersion": "sha256:cadba71d655557d50d4068bde33b34be0b05a1705a87e6c07707ca490fade880"}, {"id": "p1b-u6-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "果园里摘了 32 个桃，摘的梨比桃多 15 个。(1) 摘了几个梨？(2) 桃和梨一共摘了几个？", "answer": "(1) 32 + 15 = 47（个）；(2) 32 + 47 = 79（个）", "reasoning": ["(1) 梨比桃多 15 个，求比 32 多 15 的数：32 + 15 = 47（个）。", "(2) 用第一问的得数，把桃和梨合起来：32 + 47 = 79（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u6.004", "pyps.p1b.u6.003"], "contentVersion": "sha256:425750fdb1a0e55a0ed427d1267cf04b168a2f3b80e6472b1077c00b5f8af96b"}, {"id": "p1b-u6-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "妈妈买了 50 个鸡蛋，第一周吃了 12 个，第二周吃了 9 个。(1) 两周一共吃了几个？(2) 还剩几个？", "answer": "(1) 12 + 9 = 21（个）；(2) 50 − 21 = 29（个）", "reasoning": ["(1) 两周吃的合起来：12 + 9 = 21（个）。", "(2) 一共 50 个，去掉吃了的 21 个：50 − 21 = 29（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u6.004", "pyps.p1b.u6.001"], "contentVersion": "sha256:447a65deb1dd9406af0212c0817f0f7676f43c6b39669c30fff50bea8e07d441"}], "contentVersion": "sha256:2889bf3b1c1d0d32a11ad4123febf0dd7a1838c6e86be3521a257784b0211987"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
