<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 9 章 平面直角坐标系 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=c412b14433eb"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=9f35dd2cb533"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=960b69da9959"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=9e04f871a3b0"></script></head><body data-stage="junior" data-sec="j9-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 9 章 平面直角坐标系 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j9-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j9-test", "sectionId": "j9-test", "chapterId": "j9", "title": "第 9 章 平面直角坐标系 · 章末测验", "label": "章末测验", "sections": ["j9-1", "j9-2"], "items": [{"id": "j9-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j9-1"], "pointIds": ["pyjh.coord.004"], "prompt": "点 $P(-3,5)$ 在第几象限？", "options": [{"id": "a", "text": "第一象限", "feedback": "第一象限内点的横坐标为正，这里横坐标是负数。"}, {"id": "b", "text": "第二象限", "feedback": "横坐标为负、纵坐标为正的点在第二象限。"}, {"id": "c", "text": "第三象限", "feedback": "第三象限内点的纵坐标为负，这里纵坐标是正数。"}, {"id": "d", "text": "第四象限", "feedback": "第四象限内点的横坐标为正、纵坐标为负。"}], "correct": "b", "answer": "第二象限", "reasoning": ["各象限内点的坐标符号：一 $(+,+)$，二 $(-,+)$，三 $(-,-)$，四 $(+,-)$。", "$-3<0$，$5>0$，所以点 $P$ 在第二象限。"], "contentVersion": "sha256:826fbcaea847241d1d6d493118adb8cae38680ed93c20ddfa8cb4b6298480b80"}, {"id": "j9-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j9-1"], "pointIds": ["pyjh.coord.003"], "prompt": "点 $(0,-4)$ 在平面直角坐标系中的什么位置？", "options": [{"id": "a", "text": "$x$ 轴的负半轴上", "feedback": "$x$ 轴上点的纵坐标为 $0$，这里横坐标为 $0$。"}, {"id": "b", "text": "$y$ 轴的负半轴上", "feedback": "横坐标为 $0$ 的点在 $y$ 轴上，纵坐标为负，在原点下方。"}, {"id": "c", "text": "第三象限", "feedback": "坐标轴上的点不属于任何象限。"}, {"id": "d", "text": "第四象限", "feedback": "坐标轴上的点不属于任何象限。"}], "correct": "b", "answer": "$y$ 轴的负半轴上", "reasoning": ["横坐标为 $0$ 的点在 $y$ 轴上，不属于任何象限。", "纵坐标 $-4<0$，所以在 $y$ 轴的负半轴上。"], "contentVersion": "sha256:57b0ba71b928d3f4b24c64fd8c074dd13f92251711b628b78d51ecb7fa45ef0e"}, {"id": "j9-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j9-1"], "pointIds": ["pyjh.coord.005"], "prompt": "点 $M(-2,-7)$ 到 $x$ 轴的距离是多少？", "options": [{"id": "a", "text": "$2$", "feedback": "这是点到 $y$ 轴的距离；到 $x$ 轴的距离看纵坐标。"}, {"id": "b", "text": "$-7$", "feedback": "距离不能是负数，要取纵坐标的绝对值。"}, {"id": "c", "text": "$7$", "feedback": "点到 $x$ 轴的距离等于纵坐标的绝对值。"}, {"id": "d", "text": "$9$", "feedback": "点到 $x$ 轴的距离只与纵坐标有关。"}], "correct": "c", "answer": "$7$", "reasoning": ["点 $(a,b)$ 到 $x$ 轴的距离是 $|b|$，到 $y$ 轴的距离是 $|a|$。", "$|-7|=7$。"], "contentVersion": "sha256:d9e1906b05f1dd8461844a7ddb1f4b3ebdf685fce6226025e99469d5b8f67a99"}, {"id": "j9-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j9-2"], "pointIds": ["pyjh.coord.010"], "prompt": "把点 $A(2,-1)$ 先向左平移 $3$ 个单位长度，再向上平移 $4$ 个单位长度，得到的点的坐标是什么？", "options": [{"id": "a", "text": "$(-1,3)$", "feedback": "左右平移改变横坐标（左减右加），上下平移改变纵坐标（上加下减）。"}, {"id": "b", "text": "$(5,3)$", "feedback": "向左平移横坐标要减小。"}, {"id": "c", "text": "$(-1,-5)$", "feedback": "向上平移纵坐标要增大。"}, {"id": "d", "text": "$(5,-5)$", "feedback": "向左应减、向上应加，两个方向都弄反了。"}], "correct": "a", "answer": "$(-1,3)$", "reasoning": ["向左平移 $3$ 个单位：横坐标 $2-3=-1$。", "向上平移 $4$ 个单位：纵坐标 $-1+4=3$，得 $(-1,3)$。"], "contentVersion": "sha256:60ac9a1850abef51d2e2aaf1e5350f79d7c7b8271a03f942b120b0c7ed6ff79e"}, {"id": "j9-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j9-1"], "pointIds": ["pyjh.coord.004", "pyjh.coord.005"], "prompt": "点 $Q$ 在 $x$ 轴的下方、$y$ 轴的右侧，到 $x$ 轴的距离是 $3$，到 $y$ 轴的距离是 $2$。点 $Q$ 的坐标是什么？", "options": [{"id": "a", "text": "$(-3,2)$", "feedback": "在 $y$ 轴右侧，横坐标为正。"}, {"id": "b", "text": "$(3,-2)$", "feedback": "到 $x$ 轴的距离由纵坐标决定，应是 $3$。"}, {"id": "c", "text": "$(2,-3)$", "feedback": "先由位置定符号，再由距离定绝对值。"}, {"id": "d", "text": "$(-2,3)$", "feedback": "在 $x$ 轴下方纵坐标为负，在 $y$ 轴右侧横坐标为正。"}], "correct": "c", "answer": "$(2,-3)$", "reasoning": ["在 $x$ 轴下方、$y$ 轴右侧，点在第四象限，横坐标为正、纵坐标为负。", "到 $x$ 轴距离 $3$，纵坐标为 $-3$；到 $y$ 轴距离 $2$，横坐标为 $2$。"], "contentVersion": "sha256:90b644260899bba75a5e353c769fe87210a1fb03ec9d6924347fc8869c79f02a"}, {"id": "j9-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j9-1"], "pointIds": ["pyjh.coord.006"], "prompt": "已知点 $A(2,-3)$，线段 $AB\\parallel x$ 轴，且 $AB=4$。点 $B$ 的坐标是什么？", "options": [{"id": "a", "text": "$(6,-3)$", "feedback": "点 $B$ 也可能在点 $A$ 的左侧。"}, {"id": "b", "text": "$(6,-3)$ 或 $(-2,-3)$", "feedback": "平行于 $x$ 轴的直线上点的纵坐标相同，$B$ 可以在 $A$ 的左边或右边。"}, {"id": "c", "text": "$(2,1)$ 或 $(2,-7)$", "feedback": "这是 $AB\\parallel y$ 轴时的情况。"}, {"id": "d", "text": "$(6,-3)$ 或 $(2,1)$", "feedback": "$AB$ 平行于 $x$ 轴，纵坐标不变，只能左右移动。"}], "correct": "b", "answer": "$(6,-3)$ 或 $(-2,-3)$", "reasoning": ["$AB\\parallel x$ 轴，所以 $B$ 的纵坐标也是 $-3$。", "$AB=4$，$B$ 的横坐标为 $2+4=6$ 或 $2-4=-2$。"], "contentVersion": "sha256:802985c045df47a13fa274747ff77afe5e97c9679c758e78fa5c65e86a5e3a46"}, {"id": "j9-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j9-1"], "pointIds": ["pyjh.coord.003", "pyjh.eq.009"], "prompt": "点 $P(m+2,\\,m-1)$ 在 $x$ 轴上，点 $P$ 的坐标是什么？", "options": [{"id": "a", "text": "$(0,-3)$", "feedback": "这是 $P$ 在 $y$ 轴上时的结果。"}, {"id": "b", "text": "$(2,-1)$", "feedback": "这是 $m=0$ 时的点，它不在 $x$ 轴上。"}, {"id": "c", "text": "$(1,0)$", "feedback": "$1$ 是 $m$ 的值，还要代入求横坐标。"}, {"id": "d", "text": "$(3,0)$", "feedback": "$x$ 轴上点的纵坐标为 $0$，先求出 $m$。"}], "correct": "d", "answer": "$(3,0)$", "reasoning": ["$x$ 轴上点的纵坐标为 $0$：$m-1=0$，$m=1$。", "横坐标 $m+2=3$，所以 $P(3,0)$。"], "contentVersion": "sha256:9459c622aa585eaad297cf4a0d429b04f8da71fcb24c42772ec2ac8922317bc5"}, {"id": "j9-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j9-1"], "pointIds": ["pyjh.coord.007", "pyjh.coord.003"], "prompt": "已知 $A(-2,0)$，$B(4,0)$，$C(1,3)$，三角形 $ABC$ 的面积是多少？", "options": [{"id": "a", "text": "$18$", "feedback": "三角形面积要乘 $\\frac12$。"}, {"id": "b", "text": "$9$", "feedback": "以 $AB$ 为底，点 $C$ 到 $x$ 轴的距离为高。"}, {"id": "c", "text": "$6$", "feedback": "这是底 $AB$ 的长，还要乘高再除以 $2$。"}, {"id": "d", "text": "$3$", "feedback": "$AB$ 的长是 $4-(-2)=6$，不是 $4-2$。"}], "correct": "b", "answer": "$9$", "reasoning": ["$A$，$B$ 在 $x$ 轴上，$AB=4-(-2)=6$。", "点 $C$ 到 $x$ 轴的距离是 $3$，即 $AB$ 边上的高为 $3$。", "面积 $=\\frac12\\times6\\times3=9$。"], "contentVersion": "sha256:1bb3e398666b327b6233165ac5b48698c2e03b5aecf0e10eca7548b47dd14ab7"}, {"id": "j9-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j9-2"], "pointIds": ["pyjh.coord.009"], "prompt": "学校在小明家的北偏东 $30^\\circ$ 方向、距离 $500\\,\\text{m}$ 处。那么小明家在学校的什么位置？", "options": [{"id": "a", "text": "北偏东 $30^\\circ$ 方向 $500\\,\\text{m}$ 处", "feedback": "观测点换成了学校，方向要反过来。"}, {"id": "b", "text": "南偏西 $30^\\circ$ 方向 $500\\,\\text{m}$ 处", "feedback": "两地互看，南北、东西都对调，角度和距离不变。"}, {"id": "c", "text": "南偏东 $30^\\circ$ 方向 $500\\,\\text{m}$ 处", "feedback": "东西也要对调：小明家在学校的西侧。"}, {"id": "d", "text": "南偏西 $60^\\circ$ 方向 $500\\,\\text{m}$ 处", "feedback": "方向角从南北方向量起，角度仍是 $30^\\circ$。"}], "correct": "b", "answer": "南偏西 $30^\\circ$ 方向 $500\\,\\text{m}$ 处", "reasoning": ["学校在小明家的北偏东，那么小明家在学校的南偏西。", "两处的南北方向线平行，夹角仍是 $30^\\circ$，距离也不变。"], "contentVersion": "sha256:38701a188649d6b82607cb78afdb0494a3166108e3ac262988127a8906146275"}, {"id": "j9-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j9-1"], "pointIds": ["pyjh.coord.007", "pyjh.coord.002"], "prompt": "已知 $A(-1,-1)$，$B(3,1)$，$C(1,4)$，三角形 $ABC$ 的面积是多少？", "options": [{"id": "a", "text": "$20$", "feedback": "这是外面的长方形的面积，还要减去三个直角三角形。"}, {"id": "b", "text": "$12$", "feedback": "这是要减去的三个直角三角形的面积之和。"}, {"id": "c", "text": "$10$", "feedback": "三个直角三角形的面积要分别算准，再从长方形面积里减去。"}, {"id": "d", "text": "$8$", "feedback": "用割补法：画出包含三角形、边平行于坐标轴的长方形，再减去三个直角三角形。"}], "correct": "d", "answer": "$8$", "reasoning": ["作边平行于坐标轴的长方形，横向从 $-1$ 到 $3$（长 $4$），纵向从 $-1$ 到 $4$（宽 $5$），面积 $20$。", "减去三个直角三角形：$\\frac12\\times4\\times2=4$，$\\frac12\\times2\\times3=3$，$\\frac12\\times2\\times5=5$，共 $12$。", "三角形 $ABC$ 的面积 $=20-12=8$。"], "contentVersion": "sha256:14c4ee4bbd5900c6fab6bf89c60ae859e75be06e4e003bdc181560f9908bde36"}, {"id": "j9-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j9-2"], "pointIds": ["pyjh.coord.011", "pyjh.coord.010"], "prompt": "三角形 $ABC$ 经过平移，点 $A(1,2)$ 移到了 $A_1(-2,5)$。按同样的平移，点 $B(3,-1)$ 移到的点 $B_1$ 的坐标是什么？", "options": [{"id": "a", "text": "$(0,2)$", "feedback": "先由 $A$ 到 $A_1$ 读出平移方式，再用到点 $B$ 上。"}, {"id": "b", "text": "$(6,-4)$", "feedback": "平移方向弄反了：$A$ 是向左、向上移动的。"}, {"id": "c", "text": "$(0,-4)$", "feedback": "纵坐标应增加 $3$，不是减少。"}, {"id": "d", "text": "$(-2,5)$", "feedback": "这是 $A_1$ 的坐标；不同的点平移后到达不同的位置。"}], "correct": "a", "answer": "$(0,2)$", "reasoning": ["横坐标 $1\\to-2$，减少 $3$；纵坐标 $2\\to5$，增加 $3$。平移方式是向左 $3$ 个单位、向上 $3$ 个单位。", "$B_1$ 的坐标：$(3-3,\\,-1+3)=(0,2)$。"], "contentVersion": "sha256:c350826919823c5ca3888201bd0e901a0d76631f60db3f6e3056dc1d4095da4f"}, {"id": "j9-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j9-1"], "pointIds": ["pyjh.coord.005", "pyjh.coord.004", "pyjh.eq.009"], "prompt": "点 $P(2a-4,\\,a+1)$ 在第二象限，并且到两条坐标轴的距离相等。点 $P$ 的坐标是什么？", "options": [{"id": "a", "text": "$(6,6)$", "feedback": "由 $2a-4=a+1$ 得到的点在第一象限，不符合条件。"}, {"id": "b", "text": "$(2,-2)$", "feedback": "第二象限的点横坐标为负、纵坐标为正。"}, {"id": "c", "text": "$(-2,2)$", "feedback": "第二象限点的横坐标为负，距离相等即 $-(2a-4)=a+1$。"}, {"id": "d", "text": "$(-2,-2)$", "feedback": "这个点在第三象限。"}], "correct": "c", "answer": "$(-2,2)$", "reasoning": ["在第二象限，$2a-4<0$，$a+1>0$；到两轴距离相等，$|2a-4|=|a+1|$，即 $-(2a-4)=a+1$。", "$-2a+4=a+1$，$a=1$，$P(-2,2)$。", "检验：横坐标 $-2<0$，纵坐标 $2>0$，在第二象限，到两轴距离都是 $2$。"], "contentVersion": "sha256:4ffb2fdcc3260be0d532b16e0cfbb250bd90f799c8ce7a75ddf6561c4043448e"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
