<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 290" role="img" aria-labelledby="title desc">
  <title id="title">带固定坐标标记的三角形匀质薄板</title>
  <desc id="desc">三角形顶点A为原点，B在横轴12处，C在纵轴6处，坐标单位为厘米；AB、AC分别位于两条坐标轴上。</desc>
  <style>
    :root{--ink:#253930;--fill:#e2eee7;--bg:#fff}text{fill:var(--ink);font:20px sans-serif}path{stroke:var(--ink);stroke-width:2;fill:none}.plate{fill:var(--fill)}.bg{fill:var(--bg)}
    @media(prefers-color-scheme:dark){:root{--ink:#e7eee9;--fill:#243c30;--bg:#15231c}}
  </style>
  <rect class="bg" width="440" height="290"/>
  <path class="plate" d="M84 210H348L84 78Z"/>
  <path d="M84 236V46M84 210H386M78 54L84 46L90 54M378 204L386 210L378 216"/>
  <text x="20" y="266">A(0,0)</text><text x="304" y="266">B(12,0)</text>
  <text x="103" y="77">C(0,6)</text><text x="392" y="218">x</text>
  <text x="78" y="30">y</text>
</svg>
