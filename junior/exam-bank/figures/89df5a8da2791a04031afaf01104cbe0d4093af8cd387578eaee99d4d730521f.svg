<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 180" role="img" aria-labelledby="title desc">
<title id="title">题设图</title><desc id="desc">数轴标有-3、0、2；-3处实心点向右延伸，2处空心点向左延伸。</desc>
<style>:root{--ink:#193e47;--paper:#fffdf7;--shade:#d5dedc}@media(prefers-color-scheme:dark){:root{--ink:#eff7f1;--paper:#183038;--shade:#425e64}}text{fill:var(--ink);stroke:none;font-family:"Songti SC","Noto Serif CJK SC",serif}path,circle,ellipse{stroke:var(--ink);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}.bg{fill:var(--paper);stroke:none}</style>
<path class="bg" d="M0,0H500V180H0Z"/>
<path d="M 40.00,115.00 L 460.00,115.00" fill="none"/><path d="M 452.00,111.00 L 460.00,115.00 L 452.00,119.00" fill="none"/><path d="M 110.00,110.00 L 110.00,115.00" fill="none"/><text x="110" y="143" font-size="18" text-anchor="middle">-3</text><path d="M 260.00,110.00 L 260.00,115.00" fill="none"/><text x="260" y="143" font-size="18" text-anchor="middle">0</text><path d="M 360.00,110.00 L 360.00,115.00" fill="none"/><text x="360" y="143" font-size="18" text-anchor="middle">2</text><path d="M 110.00,115.00 L 110.00,85.00 L 430.00,85.00" fill="none"/><path d="M 360.00,115.00 L 360.00,55.00 L 65.00,55.00" fill="none"/><circle cx="110" cy="115" r="3" fill="var(--ink)"/><circle cx="360" cy="115" r="3" fill="var(--paper)"/>
</svg>
