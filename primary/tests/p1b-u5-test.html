<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级下册 第五单元 100以内的笔算加、减法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p1b-u5-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级下册 第五单元 100以内的笔算加、减法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1b-u5-test", "sectionId": "p1b-u5-test", "unitId": "p1b-u5", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级下册 第五单元 100以内的笔算加、减法 单元测评", "items": [{"id": "p1b-u5-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：32 + 45 = □", "answer": "77", "reasoning": ["相同数位对齐，从个位算起：2 + 5 = 7，个位写 7。", "十位：3 + 4 = 7，十位写 7，得 77。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u5.001"], "contentVersion": "sha256:6028f9f7162614e46c8516d9dfc88e41bcfd69ff00be2762683d83584b1b989d"}, {"id": "p1b-u5-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：38 + 47 = □", "answer": "85", "reasoning": ["个位：8 + 7 = 15，个位写 5，向十位进 1。", "十位：3 + 4 + 1 = 8，十位写 8，得 85。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u5.002"], "contentVersion": "sha256:172752452a063320356f6b030fb16cbbb69217e2ae18b3cb307533d343068a6c"}, {"id": "p1b-u5-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：86 − 54 = □", "answer": "32", "reasoning": ["个位：6 − 4 = 2，个位写 2。", "十位：8 − 5 = 3，十位写 3，得 32。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u5.003"], "contentVersion": "sha256:2b897d62d21113d4cac06bcb40c94a96a266ff411788cf32a24b58f2aa5743b6"}, {"id": "p1b-u5-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：72 − 38 = □", "answer": "34", "reasoning": ["个位 2 不够减 8，从十位退 1，个位：12 − 8 = 4。", "十位：7 退了 1 还剩 6，6 − 3 = 3，得 34。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u5.004"], "contentVersion": "sha256:c75b515b07f2f24e864c05ea966d8d7ecc24f569b46ca186ab2eb9e92e9016bb"}, {"id": "p1b-u5-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：60 − 24 = □", "answer": "36", "reasoning": ["个位 0 不够减 4，从十位退 1，个位：10 − 4 = 6。", "十位：6 退了 1 还剩 5，5 − 2 = 3，得 36。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u5.004"], "contentVersion": "sha256:1c134457c2598d8bcbe0575e026a042ea5e98f5ff7600e09af44e300ddf1ad0c"}, {"id": "p1b-u5-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用竖式计算 43 + 5 时，5 应该写在哪个数的下面？", "answer": "3 的下面", "reasoning": ["竖式要相同数位对齐。", "5 是个位上的数，写在个位 3 的下面。"], "options": [{"id": "a", "text": "4 的下面", "feedback": "4 在十位上，5 是 5 个一，要和个位对齐。"}, {"id": "b", "text": "4 和 3 中间", "feedback": "竖式要相同数位对齐，5 要对准个位。"}, {"id": "c", "text": "3 的下面", "feedback": "对。5 是 5 个一，和个位上的 3 对齐。"}], "correct": "c", "pointIds": ["pyps.p1b.u5.001"], "contentVersion": "sha256:2297c32df817f7b243ea2acc799b8659d84a984f753a27033e64c5acd0aed0df"}, {"id": "p1b-u5-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用竖式计算 56 + 28，个位上 6 + 8 = 14。接下来应该怎么写？", "answer": "个位写 4，向十位进 1", "reasoning": ["个位满十，个位写 4，向十位进 1。", "十位：5 + 2 + 1 = 8，56 + 28 = 84。"], "options": [{"id": "a", "text": "个位写 4，向十位进 1", "feedback": "对。满十进一，十位算的时候要再加上进的 1。"}, {"id": "b", "text": "个位写 14", "feedback": "一个数位上只能写一个数字，14 要个位写 4、向十位进 1。"}, {"id": "c", "text": "个位写 4，进的 1 不用管", "feedback": "进的 1 是 1 个十，十位要加上它，不然会少 10。"}], "correct": "a", "pointIds": ["pyps.p1b.u5.002"], "contentVersion": "sha256:abd9f5e0c1ce007029b041714591bfc4784d6da9b54ceb1d55442b930f7a0ce4"}, {"id": "p1b-u5-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "东东用竖式算 63 − 27，得 44。他错在哪里？", "answer": "个位不够减，他倒过来用 7 − 3", "reasoning": ["个位 3 不够减 7，要从十位退 1：13 − 7 = 6。", "十位退 1 后剩 5，5 − 2 = 3，正确得数是 36。"], "options": [{"id": "a", "text": "个位不够减，他倒过来用 7 − 3", "feedback": "对。个位 3 不够减 7，要从十位退 1，算 13 − 7 = 6，正确得数是 36。"}, {"id": "b", "text": "十位忘了减", "feedback": "十位他也减了，问题出在个位不够减时没有退 1。"}, {"id": "c", "text": "没有错", "feedback": "验算一下：44 + 27 = 71，不等于 63，说明算错了。"}], "correct": "a", "pointIds": ["pyps.p1b.u5.004"], "contentVersion": "sha256:c560758df5d1ceb6dcc030d33ae24ce1e55b337e1f630f8b4c7f819c4b130b3e"}, {"id": "p1b-u5-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "竖式 □6 + 37 = 83，□ 里是几？", "answer": "4", "reasoning": ["个位：6 + 7 = 13，个位写 3，向十位进 1。", "十位：□ + 3 + 1 = 8，4 + 3 + 1 = 8，所以 □ 里是 4。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u5.002"], "contentVersion": "sha256:030a43b0f53b3d403a93d8e74fa33ea04a7a81f59bd2910bf50021f2d9a53dc0"}, {"id": "p1b-u5-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "体育室有 45 个足球，借出去 18 个。还剩几个足球？", "answer": "45 − 18 = 27（个）", "reasoning": ["一共 45 个，借出去的要减掉。", "个位 5 不够减 8，退 1 后 15 − 8 = 7，十位 3 − 1 = 2：45 − 18 = 27（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u5.004"], "contentVersion": "sha256:51384c5583dec8351ea5fc3c94601228a92c7f2addaeb2da529b4ec9dc04115e"}, {"id": "p1b-u5-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一班有 28 人，二班有 34 人。两个班一共有几人？", "answer": "28 + 34 = 62（人）", "reasoning": ["求一共，把两个班的人数合起来，用加法。", "个位 8 + 4 = 12，写 2 进 1，十位 2 + 3 + 1 = 6：28 + 34 = 62（人）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u5.002"], "contentVersion": "sha256:135d19e09a684c78691a9e888256eb0a21541358cbabfcde20d7f88978b92385"}, {"id": "p1b-u5-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "笔算 90 − 36 = 54。用加法验算：54 + 36 = □。算得对吗？", "answer": "90，算得对", "reasoning": ["个位 4 + 6 = 10，写 0 进 1；十位 5 + 3 + 1 = 9，得 90。", "加回来正好是 90，说明 90 − 36 = 54 算得对。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u5.004", "pyps.p1b.u5.002"], "contentVersion": "sha256:73f451ab5753ae0a767a02ac835446d9f6fb7c3a4c9ddb9f0e5c314597f40e14"}], "contentVersion": "sha256:ea8e83e925b32ad9fc201b76219ef01c2bd3421fb8547f44c76693d9fe412665"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
