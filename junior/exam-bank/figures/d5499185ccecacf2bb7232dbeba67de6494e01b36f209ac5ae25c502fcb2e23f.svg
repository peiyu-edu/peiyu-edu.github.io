<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 190" role="img" aria-labelledby="title desc"><title id="title">无人机测量跨湖桥</title><desc id="desc">无人机先在C处，再水平飞到D处，CD为水平虚线。从C向右下方的桥头A画虚线，标俯角60°；从D向左下方的桥头B画虚线，标俯角42°。A、B在地面水平虚线上，两点之间是湖泊（同心椭圆），A左边是阅览室，B右边是篮球场。</desc><style>path,circle,line,polyline,polygon,ellipse{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.cjk{font-family:"Noto Sans CJK SC",sans-serif}.dash{stroke-dasharray:6 5}.thin{stroke-width:1}.grid{stroke-width:1;stroke-dasharray:3 3;opacity:.55}.dot{fill:currentColor;stroke:none}.bar{fill:currentColor;fill-opacity:.35}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M46.00,36.00L74.00,36.00"/><path d="M52.00,36.00L54.00,42.00L66.00,42.00L68.00,36.00Z"/><path d="M42.00,32.00L50.00,32.00"/><path d="M70.00,32.00L78.00,32.00"/><path d="M46.00,32.00L46.00,36.00"/><path d="M74.00,32.00L74.00,36.00"/><path d="M346.00,36.00L374.00,36.00"/><path d="M352.00,36.00L354.00,42.00L366.00,42.00L368.00,36.00Z"/><path d="M342.00,32.00L350.00,32.00"/><path d="M370.00,32.00L378.00,32.00"/><path d="M346.00,32.00L346.00,36.00"/><path d="M374.00,32.00L374.00,36.00"/><path class="dash" d="M60.00,50.00L360.00,50.00"/><path class="dash" d="M60.00,50.00L112.00,145.00"/><path class="dash" d="M360.00,50.00L260.00,145.00"/><path class="dash" d="M40.00,145.00L380.00,145.00"/><ellipse cx="186.0" cy="145" rx="74.0" ry="34"/><ellipse cx="186.0" cy="145" rx="44" ry="18"/><ellipse cx="186.0" cy="145" rx="18" ry="7"/><path d="M71.00,69.05A22,22 0 0 0 82.00,50.00"/><path d="M338.00,50.00A22,22 0 0 0 343.65,64.72"/><text x="46.00" y="68.00" text-anchor="middle" font-size="20" font-style="italic">C</text><text x="376.00" y="68.00" text-anchor="middle" font-size="20" font-style="italic">D</text><text x="104.00" y="74.00" text-anchor="middle" font-size="17">60°</text><text x="314.00" y="74.00" text-anchor="middle" 