<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 165" width="580" height="165" role="img" aria-labelledby="title desc">
<title id="title">数轴上的点 A 和 B</title>
<desc id="desc">图 1：向右为正方向的数轴。从左到右依次是点 A（标着 −6）、原点 0、点 B（没有标数）。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="580" height="165" fill="white"/>
<line x1="20.0" y1="70.0" x2="560.0" y2="70.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="560.0,70.0 544.0,77.0 544.0,63.0" fill="#17202a"/>
<line x1="120.0" y1="70.0" x2="120.0" y2="58.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="290.0" y1="70.0" x2="290.0" y2="58.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="460.0" y1="70.0" x2="460.0" y2="58.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="120.0" y="48.0" class="l" text-anchor="middle">A</text>
<text x="460.0" y="48.0" class="l" text-anchor="middle">B</text>
<text x="120.0" y="106.0" class="n" text-anchor="middle">−6</text>
<text x="290.0" y="106.0" class="n" text-anchor="middle">0</text>
<text x="290.0" y="150.0" class="c" text-anchor="middle">图 1</text>
</svg>
