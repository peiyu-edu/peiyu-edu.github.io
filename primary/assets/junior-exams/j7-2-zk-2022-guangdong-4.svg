<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 380" width="460" height="380" role="img" aria-labelledby="title desc">
<title id="title">平行线 a、b 被直线 c 所截</title>
<desc id="desc">水平直线 a 在上、b 在下，直线 c 从左下斜向右上与两线相交。c 与 a 的交点处，a 上方、c 右侧的角标为∠1；c 与 b 的交点处，b 上方、c 右侧的角标为∠2。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="460" height="380" fill="white"/>
<line x1="26.0" y1="118.0" x2="420.0" y2="118.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="26.0" y1="288.0" x2="420.0" y2="288.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="278.7" y1="41.0" x2="107.3" y2="365.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<path d="M264.0 118.0A28 28 0 0 0 249.6 93.5" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M178.0 288.0A28 28 0 0 0 163.6 263.5" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="276.0" y="104.0" class="n" text-anchor="middle">1</text>
<text x="188.0" y="274.0" class="n" text-anchor="middle">2</text>
<text x="442.0" y="128.0" class="m" text-anchor="middle">a</text>
<text x="442.0" y="298.0" class="m" text-anchor="middle">b</text>
<text x="256.7" y="49.0" class="m" text-anchor="middle">c</text>
</svg>
