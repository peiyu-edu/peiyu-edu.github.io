<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 535 755" role="img" aria-labelledby="title desc"><title id="title">计算S的程序框图</title><desc id="desc">程序从i=1、S=0开始；按i的奇偶进入不同分支，偶数时j=i/2并累加i·2的j次幂，奇数时累加i；更新i后判断i≥4，满足时输出S，否则继续循环。</desc><style>:root{color:#202c37;background:#fff}text{fill:currentColor;font-family:Georgia,"Noto Serif CJK SC",serif}@media(prefers-color-scheme:dark){:root{color:#e8edf1;background:#17212b}}</style><rect x="170" y="25" width="100" height="40" rx="20" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="220" y="52" text-anchor="middle" font-size="18">开始</text><rect x="170" y="680" width="100" height="40" rx="20" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="220" y="707" text-anchor="middle" font-size="18">结束</text><path d="M 220.000 65.000 L 220.000 90.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="223.000,83.000 220.000,90.000 217.000,83.000" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="120" y="90" width="200" height="42" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="220" y="118" text-anchor="middle" font-size="18">i=1，S=0</text><path d="M 220.000 132.000 L 220.000 170.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="223.000,163.000 220.000,170.000 217.000,163.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="220.000,170.000 330.000,210.000 220.000,250.000 110.000,210.000 220.000,170.000" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="220" y="217" text-anchor="middle" font-size="18">i为偶数？</text><path d="M 220.000 250.000 L 220.000 280.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="223.000,273.000 220.000,280.000 217.000,273.000" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="242" y="272" text-anchor="middle" font-size="16">是</text><rect x="145" y="280" width="150" height="42" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="220" y="308" text-anchor="middle" font-size="18">j=i/2</text><path d="M 220.000 322.000 L 220.000 350.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="223.000,343.000 220.000,350.000 217.000,343.000" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="120" y="350" width="200" height="45" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="220" y="380" text-anchor="middle" font-size="18">S=S+i·2<tspan dy="-7" font-size="13">j</tspan></text><polyline points="330.000,210.000 415.000,210.000 415.000,279.000" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M 415.000 279.000 L 415.000 295.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="418.000,288.000 415.000,295.000 412.000,288.000" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="355" y="198" text-anchor="middle" font-size="16">否</text><rect x="342" y="295" width="146" height="45" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="415" y="325" text-anchor="middle" font-size="18">S=S+i</text><polyline points="415.000,340.000 415.000,420.000 220.000,420.000" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M 220.000 395.000 L 220.000 440.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="223.000,433.000 220.000,440.000 217.000,433.000" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="130" y="440" width="180" height="42" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="220" y="468" text-anchor="middle" font-size="18">i=i+1</text><path d="M 220.000 482.000 L 220.000 515.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="223.000,508.000 220.000,515.000 217.000,508.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="220.000,515.000 330.000,555.000 220.000,595.000 110.000,555.000 220.000,515.000" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="220" y="563" text-anchor="middle" font-size="18">i≥4？</text><polyline points="110.000,555.000 65.000,555.000 65.000,155.000 220.000,155.000" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="91" y="539" text-anchor="middle" font-size="16">否</text><path d="M 220.000 595.000 L 220.000 640.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="223.000,633.000 220.000,640.000 217.000,633.000" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="245" y="622" text-anchor="middle" font-size="16">是</text><polyline points="140.000,640.000 320.000,640.000 300.000,670.000 120.000,670.000 140.000,640.000" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="220" y="662" text-anchor="middle" font-size="18">输出S</text><path d="M 220.000 670.000 L 220.000 680.000" fill="none" stroke="currentColor" stroke-width="1.8"/><polyline points="223.000,673.000 220.000,680.000 217.000,673.000" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
