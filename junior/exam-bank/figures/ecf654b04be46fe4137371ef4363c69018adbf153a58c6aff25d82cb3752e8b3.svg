<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 280" role="img" aria-labelledby="title desc">
<title id="title">题设图</title><desc id="desc">平行直线a、b被c所截；角1在上交点左下方，角2在下交点右上方。</desc>
<style>:root{--ink:#172c3c;--shade:#c8d5de;--strong:#6e8798;--paper:#fff}text{font-family:"Noto Sans CJK SC",sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--ink:#eff4f8;--shade:#405969;--strong:#91a8b7;--paper:#12212d}}</style>
<path d="M40.000,65.000 L300.000,65.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M40.000,205.000 L300.000,205.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M100.000,245.000 L225.000,25.000" fill="none" stroke="var(--ink)" stroke-width="2" /><text x="310" y="70" font-size="18" text-anchor="middle">a</text><text x="310" y="210" font-size="18" text-anchor="middle">b</text><text x="234" y="26" font-size="18" text-anchor="middle">c</text><text x="171" y="100" font-size="18" text-anchor="middle">1</text><text x="155" y="190" font-size="18" text-anchor="middle">2</text></svg>