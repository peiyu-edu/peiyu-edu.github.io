<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 645" role="img"><title>地下车库改造示意图</title><desc>图1中C、B、D共线，E、A、F共线，两直线平行，坡道AB长10米，∠BAF为26.4°；图2中B沿BD移到B′，∠B′AF为18.4°；限高标志为2.7米和待填数值。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><line x1="20" y1="190" x2="60" y2="190" class=""></line><line x1="60" y1="190" x2="365" y2="190" class="dash"></line><line x1="100" y1="100" x2="240" y2="100" class="dash"></line><line x1="240" y1="100" x2="390" y2="100" class=""></line><line x1="60" y1="190" x2="240" y2="100" class=""></line><text x="100" y="85">C</text><text x="240" y="85">B</text><text x="390" y="85">D</text><text x="25" y="218">E</text><text x="60" y="218">A</text><text x="365" y="218">F</text><text x="210" y="260">图1</text><line x1="20" y1="490" x2="60" y2="490" class=""></line><line x1="60" y1="490" x2="365" y2="490" class="dash"></line><line x1="100" y1="400" x2="330" y2="400" class="dash"></line><line x1="330" y1="400" x2="390" y2="400" class=""></line><line x1="60" y1="490" x2="240" y2="400" class="dash"></line><line x1="60" y1="490" x2="330" y2="400" class=""></line><text x="100" y="385">C</text><text x="240" y="385">B</text><text x="390" y="385">D</text><text x="25" y="518">E</text><text x="60" y="518">A</text><text x="365" y="518">F</text><text x="330" y="385">B′</text><text x="210" y="560">图2</text><text x="210" y="610">限高：2.7 m → ? m</text></svg>
