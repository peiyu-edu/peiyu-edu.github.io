<polyline points="44.0,306.0 544.0,306.0 337.4,59.8 44.0,306.0" fill="none" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/>
<line x1="294.0" y1="96.2" x2="294.0" y2="306.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="294.0" y1="96.2" x2="544.0" y2="306.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<polyline points="294.0,290.0 310.0,290.0 310.0,306.0" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<polyline points="325.2,70.1 335.4,82.3 347.7,72.1" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<text x="24.0" y="316.0" text-anchor="middle" class="m">A</text>
<text x="564.0" y="316.0" text-anchor="middle" class="m">B</text>
<text x="349.4" y="49.8" text-anchor="middle" class="m">C</text>
<text x="294.0" y="342.0" text-anchor="middle" class="m">D</text>
<text x="276.0" y="84.2" text-anchor="middle" class="m">E</text>
</svg>
