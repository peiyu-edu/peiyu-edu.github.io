<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" role="img" aria-labelledby="title desc"><title id="title">频数分布直方图与扇形统计图</title><desc id="desc">左图是抽取的学生一周阅读时间的频数分布直方图，分组A组20≤x＜40、B组40≤x＜60、C组60≤x＜80、D组80≤x≤100，已画出A组频数10、B组频数45、D组频数20，C组未画。右图是扇形统计图，A组占10%，B组占m%，C组、D组未标百分比。</desc>
