<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年级下册 第四单元 比例 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p6b-u4-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>六年级下册 第四单元 比例 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p6b-u4-test", "sectionId": "p6b-u4-test", "unitId": "p6b-u4", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "六年级下册 第四单元 比例 单元测评", "items": [{"id": "p6b-u4-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "把 18∶24 化成最简单的整数比是 □，比值是 □。", "answer": "3∶4；3/4", "reasoning": ["比的前项和后项同时除以 6，比值不变：18∶24 = 3∶4。", "比值 = 3 ÷ 4 = 3/4。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u4.001"], "contentVersion": "sha256:d502e711a2afbc3e3f2c58d05dedf23237de06b113d1a6362804ea3c8d4e3cce"}, {"id": "p6b-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪两个比能组成比例？", "answer": "2∶3 和 4∶6", "reasoning": ["比值相等的两个比才能组成比例。", "2∶3 = 2/3，4∶6 = 2/3，比值相等。"], "options": [{"id": "a", "text": "2∶3 和 3∶2", "feedback": "2∶3 的比值是 2/3，3∶2 的比值是 3/2，不相等。"}, {"id": "b", "text": "2∶3 和 4∶6", "feedback": "对。两个比的比值都是 2/3，能组成比例 2∶3 = 4∶6。"}, {"id": "c", "text": "2∶3 和 6∶4", "feedback": "6∶4 的比值是 3/2，和 2/3 不相等。"}], "correct": "b", "pointIds": ["pyps.p6b.u4.002"], "contentVersion": "sha256:ff5fa8743cbd5e90b5afb8ff3bf758a979a00cf3f2b77b0cb75536cf962e6835"}, {"id": "p6b-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "在比例 3∶5 = 12∶20 中，两个外项的积是 □，两个内项的积是 □。", "answer": "60；60", "reasoning": ["两端的 3 和 20 是外项，中间的 5 和 12 是内项。", "外项的积 3 × 20 = 60，内项的积 5 × 12 = 60。", "在比例里，两个外项的积等于两个内项的积。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u4.003"], "contentVersion": "sha256:b4f16936e8ef7b266fcbdf0032aa177f5fce707e8c03b81666fb5899562b2740"}, {"id": "p6b-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "求比例中的未知项：x∶8 = 3∶4，x 是多少？", "answer": "6", "reasoning": ["两个外项的积等于两个内项的积：x × 4 = 8 × 3 = 24。", "x = 24 ÷ 4 = 6。", "检验：6∶8 = 3∶4，比值都是 3/4，对。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u4.004"], "contentVersion": "sha256:35d00494abdeda5110833bc92e093ccc89faad912288d79b51ccb6b31e2b01bd"}, {"id": "p6b-u4-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪两种量成正比例？", "answer": "单价一定，总价和数量", "reasoning": ["两种相关联的量，比值一定，就成正比例。", "总价 ÷ 数量 = 单价，单价一定，所以总价和数量成正比例。"], "options": [{"id": "a", "text": "长方形面积一定，长和宽", "feedback": "长 × 宽 = 面积（一定），是乘积一定，成反比例。"}, {"id": "b", "text": "单价一定，总价和数量", "feedback": "对。总价 ÷ 数量 = 单价（一定），比值一定，成正比例。"}, {"id": "c", "text": "一个人的身高和体重", "feedback": "身高和体重没有固定的比值或乘积，不成比例。"}], "correct": "b", "pointIds": ["pyps.p6b.u4.005"], "contentVersion": "sha256:fd8930a43d7962a2042b4899165eaade19d266a265741b0c802efbd58bf880a7"}, {"id": "p6b-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪两种量成反比例？", "answer": "路程一定，速度和时间", "reasoning": ["两种相关联的量，乘积一定，就成反比例。", "速度 × 时间 = 路程，路程一定，速度和时间成反比例。"], "options": [{"id": "a", "text": "速度一定，路程和时间", "feedback": "路程 ÷ 时间 = 速度（一定），比值一定，成正比例。"}, {"id": "b", "text": "圆的半径和周长", "feedback": "周长 ÷ 半径 = 2π，比值一定，成正比例。"}, {"id": "c", "text": "路程一定，速度和时间", "feedback": "对。速度 × 时间 = 路程（一定），乘积一定，成反比例。"}], "correct": "c", "pointIds": ["pyps.p6b.u4.007"], "contentVersion": "sha256:0009c5b66740b5a1dabfda4499ac3af46fc7541705b42fea2dd7e342fc3ed4c6"}, {"id": "p6b-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "铅笔每支 2 元，把购买的数量和总价在方格纸上描成点（数量 0 支时总价 0 元）。这些点有什么特点？", "answer": "都在经过两种量都是 0 的点的同一条直线上", "reasoning": ["数量大于 0 时，总价 ÷ 数量 = 2（一定），总价和数量成正比例。", "购买数量是整数，描出的点都在同一条直线上；0 支对应 0 元，这一点也在这条直线上。", "用直尺把这些点依次连起来是直的；数量为 0 时不用总价除以数量。"], "options": [{"id": "a", "text": "都在经过两种量都是 0 的点的同一条直线上", "feedback": "对。购买数量取整数，各点都在同一条直线上，数量 0 支、总价 0 元的点也在这条直线上。"}, {"id": "b", "text": "都在不经过两种量都是 0 的点的同一条直线上", "feedback": "买 0 支时总价是 0 元，所描的点包括这一点。"}, {"id": "c", "text": "依次连起来是一条弯曲的线", "feedback": "每多买 1 支，总价就多 2 元；这些点依次连起来是直的。"}], "correct": "a", "pointIds": ["pyps.p6b.u4.006", "pyps.p6b.u4.005"], "contentVersion": "sha256:d4ac3377ebebec7bff90b76e39732cbc654c66f021981ae1b1e54c06e8f805c6", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 258\" role=\"img\" aria-label=\"空白坐标方格，待描点和连线\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M32,30 L32,198\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M32,30 L200,30\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M60,30 L60,198\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M32,58 L200,58\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M88,30 L88,198\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M32,86 L200,86\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M116,30 L116,198\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M32,114 L200,114\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M144,30 L144,198\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M32,142 L200,142\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M172,30 L172,198\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M32,170 L200,170\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M200,30 L200,198\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M32,198 L200,198\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><text x=\"235\" y=\"206\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">列<\/text><text x=\"32\" y=\"20\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">行<\/text><text x=\"32\" y=\"216\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">0<\/text><text x=\"140\" y=\"242\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">根据题干数据自己描点<\/text><\/svg>"}, {"id": "p6b-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在一幅地图上，用 5 厘米表示实际距离 100 千米。这幅地图的比例尺是多少？", "answer": "1∶2000000", "reasoning": ["先统一单位：100 千米 = 10000000 厘米。", "比例尺 = 图上距离∶实际距离 = 5∶10000000。", "前后都除以 5，化简为 1∶2000000。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u4.008"], "contentVersion": "sha256:005d5d47e533e3b2dd17849a626b5cbafead667ce0d56b1e09dea5b346273f0c", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 145\" role=\"img\" aria-label=\"图上距离与题干比例条件，不用尺上格数给出结果\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M35,65 L245,65\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M35,57 L35,73\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><path d=\"M245,57 L245,73\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><text x=\"140\" y=\"39\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">图上 5 厘米<\/text><text x=\"140\" y=\"113\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">实际 100 千米<\/text><\/svg>"}, {"id": "p6b-u4-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在比例尺是 1∶5000000 的地图上，量得两座城市之间的距离是 6 厘米。两城的实际距离是多少千米？", "answer": "300 千米", "reasoning": ["比例尺 1∶5000000 表示图上 1 厘米代表实际 5000000 厘米。", "实际距离 = 6 × 5000000 = 30000000（厘米）。", "30000000 厘米 = 300 千米。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u4.009"], "contentVersion": "sha256:3617ea127994f05891099358a05f3da88ec9db724ccd64373153cade1a23ba4e", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 145\" role=\"img\" aria-label=\"图上距离与题干比例条件，不用尺上格数给出结果\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M35,65 L245,65\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M35,57 L35,73\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><path d=\"M245,57 L245,73\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><text x=\"140\" y=\"39\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">图上距离 6 厘米<\/text><text x=\"140\" y=\"113\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">比例尺 1∶5000000<\/text><\/svg>"}, {"id": "p6b-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "把一个长 4 厘米、宽 2 厘米的长方形按 3∶1 放大。放大后的长方形长和宽各是多少？", "answer": "长 12 厘米，宽 6 厘米", "reasoning": ["按 3∶1 放大，每条边都变成原来的 3 倍。", "长 4 × 3 = 12（厘米），宽 2 × 3 = 6（厘米）。"], "options": [{"id": "a", "text": "长 12 厘米，宽 6 厘米", "feedback": "对。长和宽都扩大到原来的 3 倍。"}, {"id": "b", "text": "长 7 厘米，宽 5 厘米", "feedback": "按 3∶1 放大是乘 3，不是加 3。"}, {"id": "c", "text": "长 12 厘米，宽 2 厘米", "feedback": "放大时每条边都要扩大到原来的 3 倍，宽也要变。"}], "correct": "a", "pointIds": ["pyps.p6b.u4.010"], "contentVersion": "sha256:3d2d57b09f3d37477980d860db5792e6ec60d1c1dec6ec4f55654b7447986d13", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"原长方形尺寸与放大比例，结果留空\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><rect x=\"50\" y=\"45\" width=\"180\" height=\"90\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"140\" y=\"174\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">原长方形：长 4 cm，宽 2 cm<\/text><text x=\"140\" y=\"201\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">按 3∶1 放大<\/text><\/svg>"}, {"id": "p6b-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一台打印机 3 分钟打印 45 页。照这样计算，打印 120 页需要几分钟？", "answer": "8 分钟", "reasoning": ["每分钟打印的页数一定，打印的页数和时间成正比例。", "45∶3 = 120∶x，两个外项的积等于两个内项的积：45 × x = 3 × 120 = 360。", "x = 360 ÷ 45 = 8（分钟）。也可以先算每分钟 45 ÷ 3 = 15（页），120 ÷ 15 = 8（分钟）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u4.011", "pyps.p6b.u4.005"], "contentVersion": "sha256:9200b544aae47b0ef192d20fc59208f0f447c16cc4f6c29f98c08ece390fed02"}, {"id": "p6b-u4-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "修一条路，每天修 60 米，15 天修完。如果每天修 75 米，需要几天修完？", "answer": "12 天", "reasoning": ["路的总长一定，每天修的米数和天数成反比例。", "路长 60 × 15 = 900（米）。", "900 ÷ 75 = 12（天）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u4.011", "pyps.p6b.u4.007"], "contentVersion": "sha256:67c4a031ce6935f16e5de37a64a2cf327271eb7794f1081ca3e0ed496e560d92"}], "contentVersion": "sha256:b07cd1fa690fb191b47ce560942ae80db3d794f8d0fdd7fa5a387ad5b59e674d"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
