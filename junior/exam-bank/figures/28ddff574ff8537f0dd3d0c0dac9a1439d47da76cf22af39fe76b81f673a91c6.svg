<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 380" role="img" aria-labelledby="title desc">
<title id="title">题设图</title><desc id="desc">等腰三角形ABC中AD落在BC上，E位于AD中点；CE延长至F，AF平行BC，画有AB、AC、BF。</desc>
<style>:root{--ink:#193e47;--paper:#fffdf7;--shade:#d5dedc}@media(prefers-color-scheme:dark){:root{--ink:#eff7f1;--paper:#183038;--shade:#425e64}}text{fill:var(--ink);stroke:none;font-family:"Songti SC","Noto Serif CJK SC",serif}path,circle,ellipse{stroke:var(--ink);stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}.bg{fill:var(--paper);stroke:none}</style>
<path class="bg" d="M0,0H410V380H0Z"/>
<path d="M 210.00,50.00 L 60.00,310.00" fill="none"/><path d="M 210.00,50.00 L 360.00,310.00" fill="none"/><path d="M 60.00,310.00 L 360.00,310.00" fill="none"/><path d="M 210.00,50.00 L 210.00,310.00" fill="none"/><path d="M 360.00,310.00 L 60.00,50.00" fill="none"/><path d="M 210.00,50.00 L 60.00,50.00" fill="none"/><path d="M 60.00,310.00 L 60.00,50.00" fill="none"/><text x="220" y="38" font-size="18" text-anchor="middle">A</text><text x="48" y="335" font-size="18" text-anchor="middle">B</text><text x="372" y="335" font-size="18" text-anchor="middle">C</text><text x="210" y="336" font-size="18" text-anchor="middle">D</text><text x="227" y="182" font-size="18" text-anchor="middle">E</text><text x="46" y="38" font-size="18" text-anchor="middle">F</text>
</svg>
