<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" role="img" aria-labelledby="title desc"><title id="title">从底面分区到斜二测实体的解题辅助图</title><desc id="desc">上图按俯视图把底面分为前部平低台与后部斜坡面区域；下图按横向不变、纵向半长45度、竖高不变构造一个相容实体。所有尺寸和分界位置均仅示意。</desc><rect width="500" height="700" rx="16" fill="#f7fafb"/>
<text x="250" y="36" font-family="sans-serif" font-size="30" fill="#263b48" text-anchor="middle">先按俯视图分区</text>
<polygon points="125.00,70.00 365.00,70.00 365.00,230.00 125.00,230.00" fill="#eef4f7" stroke="#3b5262" stroke-width="2.7" stroke-linejoin="round"/>
<polygon points="125.00,70.00 365.00,70.00 365.00,166.00 125.00,166.00" fill="#d1e8ee" stroke="#3b5262" stroke-width="2.7" stroke-linejoin="round"/>
<line x1="125.00" y1="166.00" x2="365.00" y2="166.00" stroke="#147d92" stroke-width="3.2"/>
<text x="245" y="125" font-family="sans-serif" font-size="30" fill="#263b48" text-anchor="middle">后部斜面</text>
<text x="245" y="210" font-family="sans-serif" font-size="30" fill="#263b48" text-anchor="middle">前部低台</text>
<text x="245" y="280" font-family="sans-serif" font-size="30" fill="#263b48" text-anchor="middle">底面分区（示意）</text>
<text x="250" y="350" font-family="sans-serif" font-size="30" fill="#263b48" text-anchor="middle">再立竖高、连出坡面</text>
<polygon points="335.00,630.00 391.57,573.43 391.57,413.43 357.63,542.37 335.00,565.00" fill="#dbe7ed" stroke="#3b5262" stroke-width="2.7" stroke-linejoin="round"/><polygon points="95.00,565.00 335.00,565.00 357.63,542.37 117.63,542.37" fill="#eef4f7" stroke="#3b5262" stroke-width="2.7" stroke-linejoin="round"/><polygon points="117.63,542.37 357.63,542.37 391.57,413.43 151.57,413.43" fill="#d1e8ee" stroke="#3b5262" stroke-width="2.7" stroke-linejoin="round"/><polygon points="95.00,630.00 335.00,630.00 335.00,565.00 95.00,565.00" fill="#e7eff3" stroke="#3b5262" stroke-width="2.7" stroke-linejoin="round"/><line x1="95.00" y1="630.00" x2="151.57" y2="573.43" stroke="#728b9b" stroke-width="2.3" stroke-dasharray="6 5"/><line x1="151.57" y1="573.43" x2="391.57" y2="573.43" stroke="#728b9b" stroke-width="2.3" stroke-dasharray="6 5"/><line x1="151.57" y1="573.43" x2="151.57" y2="413.43" stroke="#728b9b" stroke-width="2.3" stroke-dasharray="6 5"/>
<text x="250" y="680" font-family="sans-serif" font-size="30" fill="#263b48" text-anchor="middle">横同 · 纵半45° · 竖高不变</text>
</svg>
