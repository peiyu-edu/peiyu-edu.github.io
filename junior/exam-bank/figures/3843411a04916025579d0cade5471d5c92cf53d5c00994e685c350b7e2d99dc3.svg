<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" aria-labelledby="title desc"><title id="title">圆柱与三棱柱组成的几何体及四个选项</title><desc id="desc">左边是几何体：下部是圆柱，上部是竖立在圆柱上的三棱柱，三棱柱的一条棱在后面，用虚线表示；右边是选项图A至D。A：上下两个等宽矩形，上方矩形中间有实线；B：上方较窄矩形，中间无线；C：上方较窄矩形，中间有实线；D：上方较窄矩形，中间有虚线。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.s{fill:currentColor;fill-opacity:.15}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M28,175 A72,18 0 0 0 172,175" /><path d="M28,175 A72,18 0 0 1 172,175" class="d" /><path d="M28,265 A72,18 0 0 0 172,265" /><path d="M28,265 A72,18 0 0 1 172,265" class="d" /><path d="M28.00,175.00L28.00,265.00" /><path d="M172.00,175.00L172.00,265.00" /><path d="M60.00,92.00L140.00,92.00" /><path d="M60.00,92.00L100.00,66.00L140.00,92.00" /><path d="M60.00,92.00L60.00,186.00" /><path d="M140.00,92.00L140.00,186.00" /><path d="M60.00,186.00L140.00,186.00" /><path d="M100.00,66.00L100.00,170.00" class="d" /><path d="M60.00,186.00L100.00,170.00L140.00,186.00" class="d" /><path d="M225.00,190.00L295.00,190.00L295.00,235.00L225.00,235.00Z" /><path d="M225.00,145.00L295.00,145.00L295.00,190.00L225.00,190.00Z" /><path d="M260.00,145.00L260.00,190.00" /><text x="260.00" y="268.00" text-anchor="middle" font-size="22">A</text><path d="M340.00,190.00L410.00,190.00L410.00,235.00L340.00,235.00Z" /><path d="M348.00,190.00L348.00,145.00L402.00,145.00L402.00,190.00" /><text x="375.00" y="268.00" text-anchor="middle" font-size="22">B</text><path d="M455.00,190.00L525.00,190.00L525.00,235.00L455.00,235.00Z" /><path d="M463.00,190.00L463.00,145.00L517.00,145.00L517.00,190.00" /><path d="M490.00,145.00L490.00,190.00" /><text x="490.00" y="268.00" text-anchor="middle" font-size="22">C</text><path d="M570.00,190.00L640.00,1