<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">椭圆与过焦点的割线示意图</title>
  <desc id="desc">椭圆中心 O，左焦点 F，过 F 的直线交椭圆于 P、Q，OP 的延长线交椭圆于 R。</desc>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="280" cy="155" rx="190" ry="105" stroke="#2F7A56" stroke-width="3"/>
    <path d="M60 155 H500 M280 25 V285" stroke="#A39D90" stroke-width="2" stroke-dasharray="7 7"/>
    <path d="M195 155 L455 65 L105 245" stroke="#966524" stroke-width="3"/>
    <path d="M280 155 L455 65 M280 155 L105 245" stroke="#3E5C76" stroke-width="2" stroke-dasharray="6 6"/>
  </g>
  <g fill="#1A2822" font-family="sans-serif" font-size="20">
    <text x="185" y="181">F</text><text x="287" y="181">O</text>
    <text x="460" y="62">P</text><text x="84" y="254">Q</text><text x="92" y="279">R</text>
  </g>
</svg>
