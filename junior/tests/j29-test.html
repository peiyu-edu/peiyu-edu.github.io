<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 29 章 圆 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j29-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 29 章 圆 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j29-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j29-test", "sectionId": "j29-test", "chapterId": "j29", "title": "第 29 章 圆 · 章末测验", "label": "章末测验", "sections": ["j29-1", "j29-2", "j29-3"], "items": [{"id": "j29-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j29-1"], "pointIds": ["pyjh.circ.001"], "prompt": "下列说法正确的是哪一个？", "options": [{"id": "a", "text": "弦是直径", "feedback": "直径是过圆心的弦；不过圆心的弦不是直径。"}, {"id": "b", "text": "直径是弦", "feedback": "直径的两个端点都在圆上，符合弦的定义。"}, {"id": "c", "text": "半圆是最长的弧", "feedback": "同一个圆中，优弧比半圆长。"}, {"id": "d", "text": "长度相等的两条弧是等弧", "feedback": "等弧要在同圆或等圆中、能够完全重合，只看长度不够。"}], "correct": "b", "answer": "直径是弦", "reasoning": ["连接圆上任意两点的线段叫弦；直径经过圆心，两端点在圆上，所以直径是弦。", "反过来弦不一定是直径；优弧比半圆长；等弧必须在同圆或等圆中能够重合。"], "contentVersion": "sha256:465b8214550eb892942a3cb759a04056fed40d4767e4ac4beb35300896f3b12e"}, {"id": "j29-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j29-1"], "pointIds": ["pyjh.circ.002"], "prompt": "$\\odot O$ 的半径为 $5$，点 $P$ 到圆心 $O$ 的距离为 $4$。点 $P$ 与 $\\odot O$ 的位置关系是什么？", "options": [{"id": "a", "text": "点 $P$ 在圆上", "feedback": "点在圆上要求 $OP$ 等于半径。"}, {"id": "b", "text": "点 $P$ 在圆外", "feedback": "点在圆外要求 $OP$ 大于半径。"}, {"id": "c", "text": "点 $P$ 在圆内", "feedback": "$OP=4<5=r$。"}, {"id": "d", "text": "无法确定", "feedback": "已知 $OP$ 与半径 $r$，比较大小就能确定。"}], "correct": "c", "answer": "点 $P$ 在圆内", "reasoning": ["比较点到圆心的距离 $d$ 与半径 $r$：$d<r$ 在圆内，$d=r$ 在圆上，$d>r$ 在圆外。", "$d=4<5$，点 $P$ 在圆内。"], "contentVersion": "sha256:6f93acc28a9c72c1c841ad0cc9a40f9e888865685b61abda3d6366e84711ab4c"}, {"id": "j29-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j29-2"], "pointIds": ["pyjh.circ.006"], "prompt": "$\\odot O$ 的半径为 $5$，弦 $AB=8$。圆心 $O$ 到弦 $AB$ 的距离是多少？", "options": [{"id": "a", "text": "$4$", "feedback": "$4$ 是半弦长，所求是弦心距。"}, {"id": "b", "text": "$3$", "feedback": "垂径定理：弦心距 $=\\sqrt{5^2-4^2}$。"}, {"id": "c", "text": "$\\sqrt{39}$", "feedback": "直角三角形的斜边是半径 $5$，不能算 $8^2-5^2$；直角边要用半弦长。"}, {"id": "d", "text": "$\\sqrt{89}$", "feedback": "半径 $OA$ 是斜边，不能把半径与弦长的平方相加。"}], "correct": "b", "answer": "$3$", "reasoning": ["过 $O$ 作 $OM\\perp AB$ 于 $M$，由垂径定理 $AM=\\frac12AB=4$。", "在直角三角形 $OAM$ 中，$OM=\\sqrt{OA^2-AM^2}=\\sqrt{25-16}=3$。"], "contentVersion": "sha256:b99c7f93e223b87f3a3381fd1fd93af653224be7a2b4facea7bfa639e7bcb71f"}, {"id": "j29-test-04-v2", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j29-2"], "pointIds": ["pyjh.circ.008"], "prompt": "在 $\\odot O$ 中，圆心角 $\\angle AOB=100^\\circ$，点 $C$ 在优弧 $AB$ 上。$\\angle ACB$ 是多少度？", "options": [{"id": "a", "text": "$100^\\circ$", "feedback": "混淆了同弧所对的圆心角与圆周角。"}, {"id": "b", "text": "$50^\\circ$", "feedback": "$\\angle ACB=\\frac12\\angle AOB$。"}, {"id": "c", "text": "$130^\\circ$", "feedback": "$C$ 在劣弧上时才是 $130^\\circ$；这里 $C$ 在优弧上。"}, {"id": "d", "text": "$80^\\circ$", "feedback": "圆周角与圆心角不是互补关系。"}], "correct": "b", "answer": "$50^\\circ$", "reasoning": ["$C$ 在优弧 $AB$ 上，$\\angle ACB$ 与 $\\angle AOB$ 都对着劣弧 $AB$。", "由圆周角定理，$\\angle ACB=\\frac12\\times100^\\circ=50^\\circ$。"], "contentVersion": "sha256:714e3bad3a7d3b491d3125ddc1880c4787d14d4d1937445cdbb636adb43001a1"}, {"id": "j29-test-05-v2", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j29-3"], "pointIds": ["pyjh.circ.011"], "prompt": "半径为 $6$、圆心角为 $120^\\circ$ 的扇形，弧长是多少？", "options": [{"id": "a", "text": "$12\\pi$", "feedback": "把整个圆的周长当成了该扇形的弧长。"}, {"id": "b", "text": "$2\\pi$", "feedback": "公式是 $\\frac{n\\pi r}{180}$，分母是 $180$，不是 $360$。"}, {"id": "c", "text": "$4\\pi$", "feedback": "$l=\\frac{120\\pi\\times6}{180}=4\\pi$。"}, {"id": "d", "text": "$12$", "feedback": "弧长公式里有 $\\pi$。"}], "correct": "c", "answer": "$4\\pi$", "reasoning": ["弧长公式 $l=\\frac{n\\pi r}{180}$。", "$l=\\frac{120\\times\\pi\\times6}{180}=4\\pi$。"], "contentVersion": "sha256:70f5ea02891d1692c0f210b5eac73c390d248071f2285cefffe21f3d3e20b1e7"}, {"id": "j29-test-06-v2", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j29-2"], "pointIds": ["pyjh.circ.010"], "prompt": "四边形 $ABCD$ 内接于圆，$\\angle A:\\angle B:\\angle C=2:3:7$。$\\angle D$ 是多少度？", "options": [{"id": "a", "text": "$60^\\circ$", "feedback": "把另一个顶点处的角当成了所求角，请核对对角关系。"}, {"id": "b", "text": "$140^\\circ$", "feedback": "$140^\\circ$ 是 $\\angle C$。"}, {"id": "c", "text": "$120^\\circ$", "feedback": "$\\angle A+\\angle C=180^\\circ$ 定出每份 $20^\\circ$，$\\angle D=180^\\circ-\\angle B$。"}, {"id": "d", "text": "$100^\\circ$", "feedback": "比例 $2:3:7$ 里 $\\angle A$ 与 $\\angle C$ 是对角，它们的和是 $180^\\circ$。"}], "correct": "c", "answer": "$120^\\circ$", "reasoning": ["圆内接四边形对角互补：$\\angle A+\\angle C=180^\\circ$，即 $9$ 份是 $180^\\circ$，每份 $20^\\circ$。", "$\\angle B=3\\times20^\\circ=60^\\circ$。", "$\\angle D=180^\\circ-\\angle B=120^\\circ$。"], "contentVersion": "sha256:33055029ad6ae1820f6facc3a3d61ed818b98b5b8574f60870330f4dca114ac1"}, {"id": "j29-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j29-2"], "pointIds": ["pyjh.circ.006", "pyjh.circ.005"], "prompt": "$\\odot O$ 的半径为 $10$，弦 $AB\\parallel CD$，$AB=12$，$CD=16$。$AB$ 与 $CD$ 之间的距离是多少？", "options": [{"id": "a", "text": "$2$", "feedback": "两条弦也可能分在圆心两侧。"}, {"id": "b", "text": "$14$", "feedback": "两条弦也可能在圆心同侧。"}, {"id": "c", "text": "$2$ 或 $14$", "feedback": "弦心距分别为 $8$、$6$，同侧相减、异侧相加。"}, {"id": "d", "text": "$10$", "feedback": "要先分别求两条弦的弦心距，再分两种位置讨论。"}], "correct": "c", "answer": "$2$ 或 $14$", "reasoning": ["弦心距：$AB$ 为 $\\sqrt{10^2-6^2}=8$，$CD$ 为 $\\sqrt{10^2-8^2}=6$。", "两弦在圆心同侧时距离为 $8-6=2$；在圆心两侧时距离为 $8+6=14$。", "所以距离是 $2$ 或 $14$。"], "contentVersion": "sha256:5512c22054690353aaef408df1904ea34ec70e99b4f18ef75c172af1f890c1b5"}, {"id": "j29-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j29-2"], "pointIds": ["pyjh.circ.009", "pyjh.circ.008"], "prompt": "$AB$ 是 $\\odot O$ 的直径，点 $C$、$D$ 在 $\\odot O$ 上，且分别位于 $AB$ 的两侧。$\\angle BAC=25^\\circ$，$\\angle ADC$ 是多少度？", "options": [{"id": "a", "text": "$25^\\circ$", "feedback": "$\\angle ADC$ 对着弧 $AC$，与它相等的是 $\\angle ABC$，不是 $\\angle BAC$。"}, {"id": "b", "text": "$65^\\circ$", "feedback": "$\\angle ACB=90^\\circ$，$\\angle ABC=65^\\circ$，同弧 $AC$ 所对的圆周角相等。"}, {"id": "c", "text": "$115^\\circ$", "feedback": "$D$ 与 $B$ 在弦 $AC$ 的同一侧，两角相等而不是互补。"}, {"id": "d", "text": "$50^\\circ$", "feedback": "$50^\\circ$ 是弧 $BC$ 所对的圆心角。"}], "correct": "b", "answer": "$65^\\circ$", "reasoning": ["$AB$ 是直径，$\\angle ACB=90^\\circ$，所以 $\\angle ABC=90^\\circ-25^\\circ=65^\\circ$。", "$D$ 在 $AB$ 另一侧，与 $B$ 在弦 $AC$ 的同侧，$\\angle ADC$ 与 $\\angle ABC$ 都对着弧 $AC$。", "$\\angle ADC=\\angle ABC=65^\\circ$。"], "contentVersion": "sha256:729ecec58fe1f1fab19b4badbdc4f1ec434b6222593f6610cd230bbe9b197d1c"}, {"id": "j29-test-09-v2", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j29-3"], "pointIds": ["pyjh.circ.012", "pyjh.circ.011"], "prompt": "一个扇形的半径为 $3$，弧长为 $2\\pi$。这个扇形的面积是多少？", "options": [{"id": "a", "text": "$6\\pi$", "feedback": "把弧长与半径的乘积直接当成了扇形面积。"}, {"id": "b", "text": "$9\\pi$", "feedback": "$9\\pi$ 是整个圆的面积。"}, {"id": "c", "text": "$3\\pi$", "feedback": "$S=\\frac12lr=\\frac12\\times2\\pi\\times3$。"}, {"id": "d", "text": "$2\\pi$", "feedback": "$2\\pi$ 是弧长，不是面积。"}], "correct": "c", "answer": "$3\\pi$", "reasoning": ["扇形面积 $S=\\frac12lr=\\frac12\\times2\\pi\\times3=3\\pi$。", "也可先求圆心角：$\\frac{n\\pi\\times3}{180}=2\\pi$，$n=120$，$S=\\frac{120\\pi\\times3^2}{360}=3\\pi$。"], "contentVersion": "sha256:753e21017a4d76a9e55514f42881f7c48b07fd58d85c899ad697f1fe20ecba65"}, {"id": "j29-test-10-v2", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j29-3"], "pointIds": ["pyjh.circ.013", "pyjh.circ.011"], "prompt": "一个圆锥的底面半径为 $2$，母线长为 $6$。它的侧面展开图（扇形）的圆心角和圆锥的侧面积分别是多少？", "options": [{"id": "a", "text": "$60^\\circ$，$12\\pi$", "feedback": "圆心角没有满足展开图弧长与底面周长的对应关系。"}, {"id": "b", "text": "$120^\\circ$，$24\\pi$", "feedback": "侧面积 $=\\pi rl$，不是 $2\\pi rl$。"}, {"id": "c", "text": "$240^\\circ$，$6\\pi$", "feedback": "展开扇形的半径是母线 $6$，不是底面半径。"}, {"id": "d", "text": "$120^\\circ$，$12\\pi$", "feedback": "$n=\\frac{360r}{l}=120$，侧面积 $\\pi rl=12\\pi$。"}], "correct": "d", "answer": "圆心角 $120^\\circ$，侧面积 $12\\pi$", "reasoning": ["展开扇形的半径是母线 $6$，弧长等于底面周长 $2\\pi\\times2=4\\pi$。", "$\\frac{n\\pi\\times6}{180}=4\\pi$，$n=120$。", "侧面积 $=\\frac12\\times4\\pi\\times6=12\\pi$。"], "contentVersion": "sha256:778033cade2c4f9fcf74d9ab4e8a6145747b4a8764ee2704bfb5878320072c19"}, {"id": "j29-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j29-1", "j29-2"], "pointIds": ["pyjh.circ.004", "pyjh.circ.005", "pyjh.pyth.003"], "prompt": "在 $\\triangle ABC$ 中，$AB=AC=5$，$BC=6$。$\\triangle ABC$ 外接圆的半径是多少？", "options": [{"id": "a", "text": "$\\frac52$", "feedback": "外接圆半径不是腰长的一半；圆心在底边的高上。"}, {"id": "b", "text": "$4$", "feedback": "$4$ 是底边上的高，外心不在顶点或底边上。"}, {"id": "c", "text": "$3$", "feedback": "$3$ 是底边的一半。"}, {"id": "d", "text": "$\\frac{25}{8}$", "feedback": "设半径 $R$，$R^2=3^2+(4-R)^2$。"}], "correct": "d", "answer": "$\\frac{25}{8}$", "reasoning": ["作 $AD\\perp BC$ 于 $D$，$BD=3$，$AD=\\sqrt{25-9}=4$；外心 $O$ 在 $AD$ 上（$BC$ 的垂直平分线）。", "设半径为 $R$，$OB=OA=R$，$OD=4-R$；在直角三角形 $OBD$ 中 $R^2=3^2+(4-R)^2$。", "$8R=25$，$R=\\frac{25}{8}$。"], "contentVersion": "sha256:1e593a483a158186beaeebc81d6a350c128be5072a53705e3debfe669a380d82"}, {"id": "j29-test-12-v2", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j29-3"], "pointIds": ["pyjh.circ.012"], "prompt": "$\\odot O$ 的半径为 $2$，弦 $AB$ 所对的圆心角 $\\angle AOB=90^\\circ$。劣弧 $AB$ 与弦 $AB$ 围成的弓形面积是多少？", "options": [{"id": "a", "text": "$\\pi$", "feedback": "$\\pi$ 是扇形 $OAB$ 的面积，还要减去 $\\triangle OAB$。"}, {"id": "b", "text": "$\\pi-4$", "feedback": "三角形面积计算时漏掉了面积系数。"}, {"id": "c", "text": "$2\\pi-4$", "feedback": "扇形所占整圆的比例与三角形面积均需重新检查。"}, {"id": "d", "text": "$\\pi-2$", "feedback": "扇形 $\\pi$ 减去直角三角形 $2$。"}], "correct": "d", "answer": "$\\pi-2$", "reasoning": ["扇形 $OAB$ 面积：$\\frac{90\\pi\\times2^2}{360}=\\pi$。", "$\\triangle OAB$ 是直角三角形，面积 $\\frac12\\times2\\times2=2$。", "弓形面积 $=\\pi-2$。"], "contentVersion": "sha256:f4fdbd7a1d17a6911afbc982367ea694e7f9d1521c812cd621d5eab89d4dbb9e"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
