<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 206" role="img" aria-labelledby="title desc"><title id="title">直角三角形ABC</title><desc id="desc">三角形ABC，A在左下、B在右下，AB水平；C在上方偏右，∠ACB是直角，AC比BC长。图中没有其他点和线。</desc><style>path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M30,180L234,40L330,180Z"/><text x="234" y="28" font-size="20" text-anchor="middle">C</text><text x="16" y="194" font-size="20" text-anchor="middle">A</text><text x="344" y="194" font-size="20" text-anchor="middle">B</text></svg>
