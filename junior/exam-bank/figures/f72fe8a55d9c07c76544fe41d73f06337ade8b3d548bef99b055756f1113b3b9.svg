<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 720" role="img"><title>吉林第4题图</title><desc>一个小正方体放在大正方体顶面的后左角，箭头标明正面；A、B分别在大正方形外部左上、右上连接小正方形，C、D分别在大正方形内部左上、右上画小正方形。</desc><style>:root{color:#173b40}@media(prefers-color-scheme:dark){:root{color:#e5eeeb}}line,path,polygon,polyline,circle,rect{stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:"Times New Roman","Songti SC",serif}</style><polygon points="80,160 220,160 220,300 80,300" fill="none"/><polyline points="220,160 280,100 280,240 220,300" fill="none"/><line x1="80" y1="160" x2="116" y2="124"/><line x1="196" y1="100" x2="280" y2="100"/><polygon points="116,68 172,68 172,124 116,124" fill="none"/><polyline points="116,68 140,44 196,44 172,68" fill="none"/><polyline points="172,68 196,44 196,100 172,124" fill="none"/><line x1="130" y1="341" x2="151" y2="284"/><polygon points="151,284 142,293 151,297" fill="currentColor"/><text x="107" y="368" font-size="20">正面</text><polygon points="35,452 125,452 125,542 35,542" fill="none"/><polyline points="35,452 35,416 71,416 71,452" fill="none"/><text x="11" y="508" font-size="20">A</text><polygon points="205,452 295,452 295,542 205,542" fill="none"/><polyline points="259,452 259,416 295,416 295,452" fill="none"/><text x="181" y="508" font-size="20">B</text><polygon points="35,600 125,600 125,690 35,690" fill="none"/><text x="11" y="656" font-size="20">C</text><polyline points="35,636 71,636 71,600" fill="none"/><polygon points="205,600 295,600 295,690 205,690" fill="none"/><text x="181" y="656" font-size="20">D</text><polyline points="259,600 259,636 295,636" fill="none"/></svg>
