<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 355" width="590" height="355" role="img" aria-labelledby="title desc">
<title id="title">三角形与构造的四边形</title>
<desc id="desc">三角形 ABC，B、D、C 依次在下方水平边上，D 在 BC 上。E、A 在上方同一水平线上，E 在左。线段 AB 与 ED 交于点 O。图中连接了 EA、AC、AB、AD、ED、EB。</desc>
<style>text { fill:#17202a; font-size:30px; } .i { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .n { font-family:'Times New Roman',Georgia,serif; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect x="0" y="0" width="590" height="355" fill="white"/>
<polyline points="50.0,45.0 255.0,45.0 564.0,305.0 154.0,305.0 50.0,45.0" fill="none" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/><line x1="255.0" y1="45.0" x2="154.0" y2="305.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><line x1="255.0" y1="45.0" x2="359.0" y2="305.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><line x1="50.0" y1="45.0" x2="359.0" y2="305.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><text class="i" x="26" y="50" text-anchor="middle">E</text><text class="i" x="262" y="28" text-anchor="middle">A</text><text class="i" x="154" y="342" text-anchor="middle">B</text><text class="i" x="359" y="342" text-anchor="middle">D</text><text class="i" x="564" y="342" text-anchor="middle">C</text><text class="i" x="170" y="192" text-anchor="middle">O</text>
</svg>
