<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" role="img" aria-labelledby="title desc"><title id="title">平行四边形ABCD与线段AM（图1、图2）</title><desc id="desc">图1：平行四边形ABCD，A在左下、B在右下、C在右上、D在左上，AB约为AD的2倍；M为CD中点，连接AM。图2：同一平行四边形与线段AM；P在AM上，过P作PE垂直CD于E（E在D、M之间），作PF垂直BC于F；过M作MN垂直BC于N，N在F上方。</desc><style>path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.v{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M30.0,160.0L270.0,160.0L311.0,47.0L71.0,47.0ZM30.0,160.0L191.0,47.0"/><text class="v" x="24.0" y="184.0" font-size="20">A</text><text class="v" x="264.0" y="184.0" font-size="20">B</text><text class="v" x="309.0" y="37.0" font-size="20">C</text><text class="v" x="63.0" y="37.0" font-size="20">D</text><text class="v" x="183.0" y="37.0" font-size="20">M</text><text x="150" y="214" font-size="19" text-anchor="middle">图1</text><path d="M390.0,160.0L630.0,160.0L671.0,47.0L431.0,47.0ZM390.0,160.0L551.0,47.0"/><path d="M486.6,92.2L486.6,47.0M486.6,92.2L635.1,146.1M551.0,47.0L657.0,85.5"/><text class="v" x="384.0" y="184.0" font-size="20">A</text><text class="v" x="624.0" y="184.0" font-size="20">B</text><text class="v" x="669.0" y="37.0" font-size="20">C</text><text class="v" x="423.0" y="37.0" font-size="20">D</text><text class="v" x="543.0" y="37.0" font-size="20">M</text><text class="v" x="464.6" y="94.2" font-size="20">P</text><text class="v" x="478.6" y="37.0" font-size="20">E</text><text class="v" x="643.1" y="158.1" font-size="20">F</text><text class="v" x="665.0" y="93.5" font-size="20">N</text><text x="510" y="214" font-size="19" text-anchor="middle">图2</text></svg>