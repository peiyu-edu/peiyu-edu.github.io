<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年级上册 第四单元 圆 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p6a-u4-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>六年级上册 第四单元 圆 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p6a-u4-test", "sectionId": "p6a-u4-test", "unitId": "p6a-u4", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "六年级上册 第四单元 圆 单元测评", "items": [{"id": "p6a-u4-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "在同一个圆里，直径是 8 厘米，半径是多少厘米？", "answer": "4 厘米", "reasoning": ["同一个圆里，d = 2r。", "半径 = 8 ÷ 2 = 4（厘米）。"], "options": [{"id": "a", "text": "4 厘米", "feedback": "对。同一个圆里直径是半径的 2 倍，8 ÷ 2 = 4。"}, {"id": "b", "text": "8 厘米", "feedback": "8 厘米是直径，半径只有它的一半。"}, {"id": "c", "text": "16 厘米", "feedback": "把直径和半径弄反了。直径是半径的 2 倍。"}], "correct": "a", "pointIds": ["pyps.p6a.u4.001"], "contentVersion": "sha256:e691e77e88a6051c52af2ceb753bb98670944b76198afec2fa5f6c6426851e03", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 225\" role=\"img\" aria-label=\"圆的已知尺寸或条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><circle cx=\"140\" cy=\"100\" r=\"70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M70,100 L210,100\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><circle cx=\"140\" cy=\"100\" r=\"2\" style=\"fill:var(--fg);stroke:var(--fg);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">直径 8 厘米<\/text><\/svg>"}, {"id": "p6a-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "用圆规画一个直径是 6 厘米的圆，圆规两脚之间的距离应该是多少？", "answer": "3 厘米", "reasoning": ["圆规两脚之间的距离就是半径。", "半径 = 6 ÷ 2 = 3（厘米）。"], "options": [{"id": "a", "text": "12 厘米", "feedback": "两脚间的距离是半径，比直径还短，不是直径的 2 倍。"}, {"id": "b", "text": "3 厘米", "feedback": "对。圆规两脚间的距离是半径，6 ÷ 2 = 3。"}, {"id": "c", "text": "6 厘米", "feedback": "6 厘米是直径。两脚间的距离是半径。"}], "correct": "b", "pointIds": ["pyps.p6a.u4.002"], "contentVersion": "sha256:ade3886a359c0d2ac5e9b35eb2a2f04a38fc69bcab5f7cf9100e0269507f2850", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 225\" role=\"img\" aria-label=\"圆的已知尺寸或条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><circle cx=\"140\" cy=\"100\" r=\"70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M70,100 L210,100\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><circle cx=\"140\" cy=\"100\" r=\"2\" style=\"fill:var(--fg);stroke:var(--fg);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">直径 6 厘米<\/text><\/svg>"}, {"id": "p6a-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一个圆有几条对称轴？", "answer": "无数条", "reasoning": ["沿圆的任意一条直径对折，两边完全重合。", "圆有无数条直径，所以有无数条对称轴。"], "options": [{"id": "a", "text": "无数条", "feedback": "对。每条直径所在的直线都是圆的对称轴，直径有无数条。"}, {"id": "b", "text": "2 条", "feedback": "不止横竖两条，每条直径所在的直线都是对称轴。"}, {"id": "c", "text": "1 条", "feedback": "沿任何一条直径对折，两边都能完全重合，不止 1 条。"}], "correct": "a", "pointIds": ["pyps.p6a.u4.003"], "contentVersion": "sha256:78b5ccccc986605f8f644d438ad6c0d169cec39db22a9cc00dfa82f82fc0e023", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 225\" role=\"img\" aria-label=\"圆的已知尺寸或条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><circle cx=\"140\" cy=\"100\" r=\"70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">请在圆上思考对称轴<\/text><\/svg>"}, {"id": "p6a-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个圆的直径是 10 厘米，它的周长是多少厘米？（π 取 3.14）", "answer": "31.4 厘米", "reasoning": ["圆的周长 C = πd。", "3.14 × 10，得 31.4（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u4.007"], "contentVersion": "sha256:bc245d8ee2ea5144628f50d5fbce71b9a536d5fffbb2397e9c959c772ef8a7c6", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 225\" role=\"img\" aria-label=\"圆的已知尺寸或条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><circle cx=\"140\" cy=\"100\" r=\"70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M70,100 L210,100\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><circle cx=\"140\" cy=\"100\" r=\"2\" style=\"fill:var(--fg);stroke:var(--fg);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">直径 10 厘米<\/text><\/svg>"}, {"id": "p6a-u4-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个圆的半径是 3 分米，它的面积是多少平方分米？（π 取 3.14）", "answer": "28.26 平方分米", "reasoning": ["圆的面积 S = πr²。", "r² = 3 × 3 = 9。", "3.14 × 9，得 28.26（平方分米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u4.010"], "contentVersion": "sha256:be043c2f6a3908f722fc63c5cc2e2b6a06f01e6f19417c2f7545d5e39100ca9f", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 225\" role=\"img\" aria-label=\"圆的已知尺寸或条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><circle cx=\"140\" cy=\"100\" r=\"70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M140,100 L210,100\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><circle cx=\"140\" cy=\"100\" r=\"2\" style=\"fill:var(--fg);stroke:var(--fg);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">半径 3 分米<\/text><\/svg>"}, {"id": "p6a-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个圆形花坛的周长是 25.12 米，它的半径是多少米？（π 取 3.14）", "answer": "25.12 ÷ 3.14 ÷ 2 = 4（米）", "reasoning": ["已知周长求直径：d = C ÷ π = 25.12 ÷ 3.14 = 8（米）。", "半径 r = 8 ÷ 2 = 4（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u4.008"], "contentVersion": "sha256:67f65ac214c3be2264a939dbbd5ac4f3f325c40ead383d9311c3b8d8f6cdae1d", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 225\" role=\"img\" aria-label=\"圆的已知尺寸或条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><circle cx=\"140\" cy=\"100\" r=\"70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">花坛周长 25.12 米<\/text><\/svg>"}, {"id": "p6a-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个半圆的直径是 4 分米，这个半圆的周长是多少分米？（π 取 3.14）", "answer": "10.28 分米", "reasoning": ["半圆的周长 = 圆周长的一半 + 一条直径。", "3.14 × 4 ÷ 2 = 6.28（分米）。", "6.28 + 4，得 10.28（分米）。"], "options": [{"id": "a", "text": "6.28 分米", "feedback": "这只是半条弧线，半圆的周长还要加上那条直径。"}, {"id": "b", "text": "12.56 分米", "feedback": "这是整个圆的周长，半圆只有一半的圆周再加直径。"}, {"id": "c", "text": "10.28 分米", "feedback": "对。半个圆周 3.14 × 4 ÷ 2 = 6.28，再加直径 4，共 10.28 分米。"}], "correct": "c", "pointIds": ["pyps.p6a.u4.009"], "contentVersion": "sha256:e2d8009eb70e0bc1ff434714667c6a4738bcde861b0ccd1ca44c00b378202eb8", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"圆环、半圆或挖去小圆的已知条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M60,115 A80,80 0 0 1 220,115 Z\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">半圆直径 4 分米<\/text><\/svg>"}, {"id": "p6a-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "在同一个圆里画两个扇形，一个的圆心角是 120°，另一个的圆心角是 60°。哪个扇形大？", "answer": "圆心角 120° 的扇形大", "reasoning": ["在同一个圆里，扇形的大小由圆心角决定。", "120° > 60°，圆心角 120° 的扇形大。"], "options": [{"id": "a", "text": "一样大", "feedback": "半径一样，但圆心角不一样，扇形大小也不一样。"}, {"id": "b", "text": "圆心角 120° 的扇形大", "feedback": "对。同一个圆里，圆心角越大，扇形越大。"}, {"id": "c", "text": "圆心角 60° 的扇形大", "feedback": "同一个圆里，圆心角越小，扇形越小。"}], "correct": "b", "pointIds": ["pyps.p6a.u4.005"], "contentVersion": "sha256:a6c3280010b3dd44a6f3a27be69196f9801e92bb48d832f37687bbf7232b941f"}, {"id": "p6a-u4-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个圆的周长是 18.84 厘米，它的面积是多少平方厘米？（π 取 3.14）", "answer": "28.26 平方厘米", "reasoning": ["先求半径：18.84 ÷ 3.14 ÷ 2 = 3（厘米）。", "再求面积：3.14 × 3 × 3，得 28.26（平方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u4.011", "pyps.p6a.u4.008"], "contentVersion": "sha256:2dd7d969879f06204ea9b5828a992c4199b0daf9c256a50880c47e8d91635b50", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 225\" role=\"img\" aria-label=\"圆的已知尺寸或条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><circle cx=\"140\" cy=\"100\" r=\"70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">圆周长 18.84 厘米<\/text><\/svg>"}, {"id": "p6a-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个圆环，外圆半径是 5 米，内圆半径是 3 米。这个圆环的面积是多少平方米？（π 取 3.14）", "answer": "3.14 ×（5 × 5 − 3 × 3）= 50.24（平方米）", "reasoning": ["圆环面积 = 大圆面积 − 小圆面积。", "5 × 5 = 25，3 × 3 = 9，25 − 9 = 16。", "3.14 × 16，得 50.24（平方米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u4.012"], "contentVersion": "sha256:cb023f6dcb5e40cbf034035f29d3e0e73663e070392e05f8a32fcce375c67b29", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"圆环、半圆或挖去小圆的已知条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><circle cx=\"140\" cy=\"100\" r=\"70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><circle cx=\"140\" cy=\"100\" r=\"42\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">外半径 5 米，内半径 3 米<\/text><\/svg>"}, {"id": "p6a-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "在一个面积是 20 平方厘米的正方形里画一个最大的圆。这个圆的面积是多少平方厘米？（结果保留 π）", "answer": "5π 平方厘米", "reasoning": ["最大的圆的直径等于正方形的边长，边长 = 2r。", "正方形面积 = 2r × 2r = 4r² = 20，所以 r² = 20 ÷ 4 = 5。", "圆的面积 = πr² = 5π（平方厘米）。不用求出 r 本身。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u4.014", "pyps.p6a.u4.010"], "contentVersion": "sha256:e9fdd243feba84eaaa9794a4a53086acdea8415195f495cc102819b215f15dc2", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 230\" role=\"img\" aria-label=\"外方内圆或外圆内方的相切位置\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><circle cx=\"140\" cy=\"100\" r=\"70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><rect x=\"70\" y=\"30\" width=\"140\" height=\"140\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"140\" y=\"202\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">正方形面积 20 平方厘米<\/text><\/svg>"}, {"id": "p6a-u4-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个长方形长 8 厘米、宽 4 厘米。以它的一条长边为直径，在长方形里面画一个半圆（半圆最高处正好碰到对面的长边）。长方形里半圆以外部分的面积是多少平方厘米？（π 取 3.14）", "answer": "8 × 4 − 3.14 × 4 × 4 ÷ 2 = 6.88（平方厘米）", "reasoning": ["半圆的直径是 8 厘米，半径是 4 厘米，正好等于宽。", "长方形面积 8 × 4 = 32（平方厘米）。", "半圆面积 3.14 × 4 × 4 ÷ 2 = 25.12（平方厘米）。", "32 − 25.12 = 6.88（平方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u4.013", "pyps.p6a.u4.010"], "contentVersion": "sha256:f49683452e38bee918e7a81e3cc4b88da29c63881bcbbb7f3178b6518968aef6", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 185\" role=\"img\" aria-label=\"长边为直径的半圆位于长方形内部\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><rect x=\"60\" y=\"40\" width=\"160\" height=\"80\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M60,40 A80,80 0 0 0 220,40\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"140\" y=\"155\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">长 8 厘米，宽 4 厘米<\/text><\/svg>"}], "contentVersion": "sha256:f03d171c021b0fbd3f2815a53ff48cf0b69b0e4e50467ade772249cd426f4b64"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
