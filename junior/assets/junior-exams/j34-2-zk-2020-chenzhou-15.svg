<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 285" width="370" height="285" role="img" aria-labelledby="title desc">
<title id="title">标有母线长的圆锥</title>
<desc id="desc">直立的圆锥。底面圆心为 O，后半底面圆弧画成虚线，顶点到 O 的高和 O 到底面右端的半径也画成虚线；右侧母线上标有 10。</desc>
<style>text { fill:#17202a; font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; font-size:28px; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .sub { font-size:21px; }</style>
<rect width="370" height="285" fill="white"/>
<line x1="190" y1="28" x2="30" y2="225" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="190" y1="28" x2="350" y2="225" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="190" y1="28" x2="190" y2="225" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<line x1="190" y1="225" x2="350" y2="225" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<path d="M30 225 A160 40 0 0 1 350 225" fill="none" stroke="#17202a" stroke-width="2.5" stroke-dasharray="9 7"/>
<path d="M30 225 A160 40 0 0 0 350 225" fill="none" stroke="#17202a" stroke-width="2.5"/>
<text x="190" y="258" text-anchor="middle" class="m">O</text>
<text x="270" y="112" text-anchor="start" class="n">10</text>
</svg>
