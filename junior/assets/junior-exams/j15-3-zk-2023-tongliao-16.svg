<title id="title">等边三角形中的动点</title>
<desc id="desc">等边三角形 ABC，A 在上方，BC 水平在下方。P 在 AB 上，Q 在 AC 上，连接 PQ，P 处标有直角记号。三角形 PQD 的顶点 D 在三角形 ABC 内部、PQ 的下方，此时 D 尚未落到 BC 上。</desc>
<style>text { fill:#17202a; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
