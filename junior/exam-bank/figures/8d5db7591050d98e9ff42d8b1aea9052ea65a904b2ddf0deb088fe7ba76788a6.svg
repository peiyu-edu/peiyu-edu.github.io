<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 945" role="img" aria-labelledby="title desc"><title id="title">平行四边形连杆</title><desc id="desc">第一行左边是平行四边形连杆实物的简化示意：四根带铰接点的长杆交叉连接，两端分别压在两张纸上，纸上各有一块灰色图形，右边纸上的图形较大。第一行右边是对应的几何图：四边形AFDE为平行四边形，F在线段AB上，E在线段AC上。图1：虚线连接BD、CD，∠1是∠BDF，∠2是∠FDE，∠3是∠EDC。图2：△ABC中F在AB上，E在AC上，D在BC上，图中连接了FD、DE、EF。图3：点D不动，虚线表示原来的A、F、B、E、C所在的杆，实线表示移动后的A′、F′、B′、E′、C′所在的杆；实线还连接B与B′、C与C′。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:7 5}.dot{fill:currentColor;stroke:none}.s{fill:currentColor;fill-opacity:.3;stroke:none}.ss{fill:currentColor;fill-opacity:.3}.b{fill:#fff}.bl{stroke:#fff}.t{stroke-width:9}text{fill:currentColor;stroke:none;font-family:'Times New Roman',Times,'Songti SC','Noto Serif CJK SC',serif;font-size:24px}.bar1{stroke-width:16;stroke-linecap:butt}.bar2{stroke:#fff;stroke-width:12}.i{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.b{fill:#15272d}.bl{stroke:#15272d}.bar2{stroke:#15272d}}</style><path d="M18.72,130.9L74.1,130.9L117,171.46L46.8,171.46Z"/><path d="M310.44,105.16L411.84,105.16L450.84,162.88L351,162.88Z"/><path d="M46.8,138.7C58.5,130.9 74.1,138.7 87.36,144.16C81.9,158.2 58.5,150.4 48.36,154.3Z" class="ss"/><path d="M341.64,127C366.6,119.2 390,123.1 393.9,111.4L407.16,134.8L397.8,146.5C374.4,134.8 358.8,141.04 347.1,142.6Z" class="ss"/><path d="M62.4,134.8L222.3,25.6" class="bar1"/><path d="M74.1,68.5L198.9,130.9" class="bar1"/><path d="M162.24,130.9L323.7,25.6" class="bar1"/><path d="M196.56,27.16L382.2,123.1" class="bar1"/><path d="M62.4,134.8L222.3,25.6" class="bar2"/><path d="M74.1,68.5L198.9,130.9" class="bar2"/><path d="M162.24,130.9L323.7,25.6" class="bar2"/><path d="M196.56,27.16L382.2,123.1" class="bar2"/><circle cx="120.9" cy="93.46" r="4" class="dot"/><circle cx="177.84" cy="123.1" r="4" class="dot"/><circle cx="267.54" cy="63.04" r="4" class="dot"/><circle cx="210.6" cy="34.96" r="