<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1450" width="600" height="1450" role="img" aria-labelledby="title desc">
<title id="title">一周最高气温统计表和四个统计图</title>
<desc id="desc">统计表：星期一至星期日的最高气温依次为 25、25、28、30、33、30、29（℃）。A 是条形图，横轴为最高气温 25、28、29、30、33（℃），纵轴为天数，条形高依次为 2、1、1、2、1。B 是频数分布直方图，分组 25～28、28～31、31～34（℃），频数（天数）依次为 2、4、1。C 是折线图，横轴为星期一至星期日，纵轴为最高气温，各点依次标 25、25、28、30、33、30、29。D 是扇形图：25℃ 占 28.6%，33℃ 占 14.3%，30℃ 占 28.5%，29℃ 占 14.3%，28℃ 占 14.3%。</desc>
