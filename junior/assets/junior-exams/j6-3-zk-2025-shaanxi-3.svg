<line x1="230.0" y1="226.0" x2="113.0" y2="76.3" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="230.0" y1="226.0" x2="276.0" y2="41.6" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<path d="M202.0 226.0A28 28 0 0 1 212.8 203.9" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M258.0 226.0A28 28 0 0 0 236.8 198.8" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
