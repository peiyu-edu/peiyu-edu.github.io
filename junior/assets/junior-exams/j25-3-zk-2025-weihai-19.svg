<title id="title">矩形种植园与小路</title>
<desc id="desc">长 20m、宽 14m 的矩形种植园，图上方和右侧分别标出长和宽。阴影部分是宽度相同的小路，沿四周一圈，内部横竖各两条，把园子分成 3 行 3 列共 9 个白色矩形地块。图中未标小路宽度。</desc>
