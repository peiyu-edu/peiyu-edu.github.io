<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 346 516" width="346" height="516" role="img" aria-labelledby="title desc">
<title id="title">折断的竹子搭到墙上</title>
<desc id="desc">水平地面上有一堵竖直的墙，墙脚为 O，墙上有点 P。地面上墙左侧有点 A，竖直线段 AB 立在 A 处，再由 B 斜向上连到墙上的 P，B 比 P 低。</desc>
<style>text { fill:#17202a; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="346" height="516" fill="white"/>
<g transform="translate(-658.0 -1780.0)">
<polygon points="861.0,1794.0 921.0,1794.0 921.0,2220.0 861.0,2220.0" fill="#a7adb4" stroke="#17202a" stroke-width="2.6" stroke-linejoin="round"/>
<line x1="672.0" y1="2223.0" x2="930.0" y2="2223.0" stroke="#17202a" stroke-width="6" stroke-linecap="round"/>
<line x1="738.0" y1="2223.0" x2="738.0" y2="2034.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="738.0" y1="2034.0" x2="861.0" y2="1896.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<text class="m" x="716.0" y="2213.5" text-anchor="middle" font-size="30">A</text>
<text class="m" x="841.0" y="2213.5" text-anchor="middle" font-size="30">O</text>
<text class="m" x="845.0" y="1886.5" text-anchor="middle" font-size="30">P</text>
<text class="m" x="718.0" y="2036.5" text-anchor="middle" font-size="30">B</text>
<text class="z" x="975.0" y="2023.5" text-anchor="middle" font-size="30">墙</text>
<text class="z" x="948.0" y="2277.5" text-anchor="middle" font-size="30">地面</text>
</g>
</svg>
