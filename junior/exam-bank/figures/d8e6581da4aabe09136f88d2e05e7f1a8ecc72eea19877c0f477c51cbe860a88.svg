<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 545" role="img" aria-labelledby="title desc"><title id="title">螺栓及四个选项图</title><desc id="desc">上方为螺栓的立体图：下部是正六棱柱底座，上部是竖立在底座中央的圆柱；箭头标出俯视（从上向下）、左视（从左向右）、主视（从前向后）三个方向。下方四个选项图：图A是正六边形内有一个同心圆；图B是一个竖直矩形立在一个分成三格（左右窄、中间宽）的扁矩形之上；图C是一个竖直矩形立在一个分成左右相等两格的扁矩形之上；图D是一个分成三格的扁矩形在上，一个竖直矩形在其下方。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:7 5}.dot{fill:currentColor;stroke:none}.s{fill:currentColor;fill-opacity:.3;stroke:none}.ss{fill:currentColor;fill-opacity:.3}.b{fill:#fff}.bl{stroke:#fff}.t{stroke-width:9}text{fill:currentColor;stroke:none;font-family:'Times New Roman',Times,'Songti SC','Noto Serif CJK SC',serif;font-size:24px}.bar1{stroke-width:16;stroke-linecap:butt}.bar2{stroke:#fff;stroke-width:12}.i{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.b{fill:#15272d}.bl{stroke:#15272d}.bar2{stroke:#15272d}}</style><path d="M368,218L330,239L368,260L440,260L477,239L440,218"/><path d="M330,239L330,261L368,282L440,282L477,261L477,239"/><path d="M368,260L368,282"/><path d="M440,260L440,282"/><path d="M367,154L367,242"/><path d="M441,154L441,242"/><ellipse cx="404" cy="154" rx="37" ry="12"/><path d="M367,242A37,12 0 0 0 441,242"/><path d="M404,72L404,130"/><path class="dot" d="M404,130L399.92,119.78L408.08,119.78Z"/><text x="404" y="64" text-anchor="middle">俯视</text><path d="M260,250L308,250"/><path class="dot" d="M308,250L297.78,254.08L297.78,245.92Z"/><text x="220" y="259" text-anchor="middle">左视</text><path d="M440,326L404,290"/><path class="dot" d="M404,290L414.11,294.34L408.34,300.11Z"/><text x="446" y="356" text-anchor="middle">主视</text><path d="M147,445L121,490.03L69,490.03L43,445L69,399.97L121,399.97Z"/><circle cx="95" cy="445" r="23"/><text x="95" y="530" text-anchor="middle">A</text><path d="M292,460L292,398L352,398L352,460"/><path d="M265,460L379,460L379,490L265,490Z"/><path d="M292,460L292,490"