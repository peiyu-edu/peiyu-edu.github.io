<title id="title">木杆平衡实验装置与四个函数图象选项</title>
<desc id="desc">上方是实验装置：水平木杆中点 O 用细绳吊起，O 左侧距离 L1 处挂一个重物，O 右侧距离 L 处挂弹簧秤，手向下拉弹簧秤。下方是四个函数图象选项，横轴 L(cm)，纵轴 F(N)。A：下降的线段，左端在纵轴上，右端到横轴 50 处，虚线标出横坐标 35、纵坐标 7 的点。B：下降的曲线，虚线标出横坐标 35、纵坐标 7 的点，曲线右端横坐标 50，也有虚线连到两轴。C：下降的曲线，虚线标出横坐标 45、纵坐标 5 的点，曲线右端横坐标 50，也有虚线连到两轴。D：从原点出发上升的曲线，虚线标出横坐标 35、纵坐标 7 的点，曲线右端横坐标 50，也有虚线连到两轴。</desc>
