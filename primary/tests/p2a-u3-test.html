<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二年级上册 第三单元 1～6 的表内除法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p2a-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>二年级上册 第三单元 1～6 的表内除法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p2a-u3-test", "sectionId": "p2a-u3-test", "unitId": "p2a-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "二年级上册 第三单元 1～6 的表内除法 单元测评", "items": [{"id": "p2a-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "有 12 个橘子，每 3 个放一盘。可以放几盘？", "answer": "4 盘", "reasoning": ["每 3 个一份地分，3 个、3 个地数。", "3、6、9、12，数了 4 次，可以放 4 盘。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u3.001"], "contentVersion": "sha256:4d86eeafa0641c57043e4c493c9cef40d9305210f7a92fc4244e33b9e29e72e0"}, {"id": "p2a-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "10 块饼干平均分给 5 个小朋友，每人分几块？", "answer": "2 块", "reasoning": ["平均分就是每人分得一样多。", "每人 2 块，5 个人正好分 10 块：2 × 5 = 10。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u3.002"], "contentVersion": "sha256:b777207e4d4850892364a2e682c52ae7f0b0523ccf4095c0bdbcabe0fb664152"}, {"id": "p2a-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "把 6 个苹果分成 3 份，下面哪种分法是平均分？", "answer": "2 个、2 个、2 个", "reasoning": ["每份分得同样多，才叫平均分。", "2 个、2 个、2 个，每份一样多，合起来 2 + 2 + 2 = 6 个。"], "options": [{"id": "a", "text": "2 个、2 个、2 个", "feedback": "对。每份都是 2 个，一样多，是平均分。"}, {"id": "b", "text": "3 个、3 个、0 个", "feedback": "有一份一个也没有，三份不一样多。"}, {"id": "c", "text": "1 个、2 个、3 个", "feedback": "三份不一样多，不是平均分。"}], "correct": "a", "pointIds": ["pyps.p2a.u3.001"], "contentVersion": "sha256:85dca6771f716a0d1e7f9ca156b33440f6c3bda907ff0544482281e4ce2b1419"}, {"id": "p2a-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "18 ÷ 3 = 6 应该怎样读？", "answer": "18 除以 3 等于 6", "reasoning": ["÷ 读作「除以」，从左往右读。", "所以读作「18 除以 3 等于 6」。"], "options": [{"id": "a", "text": "3 除以 18 等于 6", "feedback": "要从左往右读，先读 18。"}, {"id": "b", "text": "18 减 3 等于 6", "feedback": "÷ 是除号，不是减号；18 − 3 也不等于 6。"}, {"id": "c", "text": "18 除以 3 等于 6", "feedback": "对。÷ 读作「除以」。"}], "correct": "c", "pointIds": ["pyps.p2a.u3.003"], "contentVersion": "sha256:0bee6731c4612f68a947b66ad274a48b4bf9fb75bd2b6e914d9888ccf9ddbb6e"}, {"id": "p2a-u3-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "在 24 ÷ 4 = 6 里，被除数是几？除数是几？商是几？", "answer": "被除数是 24，除数是 4，商是 6", "reasoning": ["除号前面的数叫被除数，后面的数叫除数，等号后面的得数叫商。", "所以被除数是 24，除数是 4，商是 6。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u3.004"], "contentVersion": "sha256:5eb651177f2468ae023c521775134bc74838bc7943d942ac4967d1a9c7fef0a3"}, {"id": "p2a-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "直接写得数：15 ÷ 5 = ？　24 ÷ 6 = ？　12 ÷ 4 = ？　30 ÷ 6 = ？", "answer": "3，4，3，5", "reasoning": ["想乘法口诀：三五十五，15 ÷ 5 = 3；四六二十四，24 ÷ 6 = 4。", "三四十二，12 ÷ 4 = 3；五六三十，30 ÷ 6 = 5。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u3.005"], "contentVersion": "sha256:aaedf295f04e83a8eb274390183ea92d2c9f9de67aa8085a81990a5b622a981b"}, {"id": "p2a-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用口诀「五六三十」写出两道除法算式。", "answer": "30 ÷ 5 = 6，30 ÷ 6 = 5", "reasoning": ["五六三十表示 5 个 6 或 6 个 5 是 30。", "所以 30 ÷ 5 = 6，30 ÷ 6 = 5。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u3.006"], "contentVersion": "sha256:086618246db8c10c835a8c5ce0719a614759df6a70e9fef21dc9721bfc37467a"}, {"id": "p2a-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "图书角有 20 本书，每个同学借 4 本，可以借给几个同学？", "answer": "5 个同学", "reasoning": ["求 20 里有几个 4，用除法：20 ÷ 4。", "想口诀四五二十，20 ÷ 4 = 5（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u3.007", "pyps.p2a.u3.005"], "contentVersion": "sha256:6c1807d05d5409213b1857dbc7c4e644946855a9b6bd5849ac4d2961a612b42b"}, {"id": "p2a-u3-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "有 18 朵花。每 3 朵扎一束，能扎几束？如果每 6 朵扎一束，能扎几束？", "answer": "每 3 朵一束扎 6 束，每 6 朵一束扎 3 束", "reasoning": ["每 3 朵一束：18 ÷ 3 = 6（束），想三六十八。", "每 6 朵一束：18 ÷ 6 = 3（束），也想三六十八。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u3.007", "pyps.p2a.u3.006"], "contentVersion": "sha256:ef6f1c730f089c2ebd285658d24f139133f3875b4c4acdf2e3f91ba42431e400"}, {"id": "p2a-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "在横线上填数：____ × 4 = 20，　20 ÷ 4 = ____", "answer": "5，5", "reasoning": ["想口诀四五二十，5 × 4 = 20。", "同一句口诀也能算除法：20 ÷ 4 = 5。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u3.006", "pyps.p2a.u3.004"], "contentVersion": "sha256:c2f00cf4b744ee7b389f62aea4d7b16d0afeba93cbf025114edbc23549a35029"}], "contentVersion": "sha256:91a52fc186145938eb41b0db577337c86c3019af5e4bdb07737433c138664a23"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
