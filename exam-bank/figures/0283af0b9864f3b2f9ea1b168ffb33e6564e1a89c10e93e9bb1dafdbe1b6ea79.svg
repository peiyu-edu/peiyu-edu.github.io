<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="title desc"><title id="title">三棱锥A-BCD的题设图</title><desc id="desc">三棱锥A-BCD的题设图：A在上方，B、O、D在一条直线上且O在中间，C在前下方，E在棱AD上；实线画AB、AC、AD、BC、CD、CE，虚线画BD、AO、OC、BE。</desc><style>path{fill:none;stroke:currentColor;stroke-width:2.5}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic;font-weight:bold}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M388,40L40,370" /><path d="M388,40L454,490" /><path d="M388,40L718,370" /><path d="M40,370L454,490" /><path d="M454,490L718,370" /><path d="M454,490L498,150" /><path d="M40,370L718,370" stroke-dasharray="8 6" /><path d="M388,40L388,370" stroke-dasharray="8 6" /><path d="M388,370L454,490" stroke-dasharray="8 6" /><path d="M40,370L498,150" stroke-dasharray="8 6" /><text x="388" y="28" text-anchor="middle" font-size="28">A</text><text x="24" y="398" text-anchor="middle" font-size="28">B</text><text x="366" y="400" text-anchor="middle" font-size="28">O</text><text x="744" y="382" text-anchor="middle" font-size="28">D</text><text x="454" y="526" text-anchor="middle" font-size="28">C</text><text x="524" y="146" text-anchor="middle" font-size="28">E</text></svg>
