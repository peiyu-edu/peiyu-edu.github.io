<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 14 章 全等三角形 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j14-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 14 章 全等三角形 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j14-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j14-test", "sectionId": "j14-test", "chapterId": "j14", "title": "第 14 章 全等三角形 · 章末测验", "label": "章末测验", "sections": ["j14-1", "j14-2", "j14-3"], "items": [{"id": "j14-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j14-1"], "pointIds": ["pyjh.cong.002", "pyjh.cong.004", "pyjh.tri.009"], "prompt": "已知 $\\triangle ABC\\cong\\triangle DEF$，$\\angle A=50^\\circ$，$\\angle E=60^\\circ$，$\\angle F$ 是多少度？", "options": [{"id": "a", "text": "$60^\\circ$", "feedback": "$\\angle E$ 对应的是 $\\angle B$，不是 $\\angle F$ 本身的度数。"}, {"id": "b", "text": "$50^\\circ$", "feedback": "$\\angle A$ 对应的是 $\\angle D$，不是 $\\angle F$。"}, {"id": "c", "text": "$70^\\circ$", "feedback": "按字母顺序对应：$\\angle F=\\angle C$，再用内角和求 $\\angle C$。"}, {"id": "d", "text": "$130^\\circ$", "feedback": "这是 $180^\\circ-50^\\circ$，还要再减去 $\\angle B$。"}], "correct": "c", "answer": "$70^\\circ$", "reasoning": ["全等式按对应顺序书写：$A$ 对 $D$，$B$ 对 $E$，$C$ 对 $F$，所以 $\\angle B=\\angle E=60^\\circ$，$\\angle F=\\angle C$。", "$\\angle C=180^\\circ-50^\\circ-60^\\circ=70^\\circ$，所以 $\\angle F=70^\\circ$。"], "contentVersion": "sha256:fd545d5960e68ad40dafe2f4533b2b6213db06fcd454eddfbd5bab8f023d6512"}, {"id": "j14-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j14-1"], "pointIds": ["pyjh.cong.004", "pyjh.cong.002"], "prompt": "已知 $\\triangle ABC\\cong\\triangle DEF$，$AB=5$，$BC=7$，$\\triangle ABC$ 的周长是 $18$。边 $DF$ 的长是多少？", "options": [{"id": "a", "text": "$5$", "feedback": "$5$ 是 $AB$ 的长，$AB$ 对应 $DE$，不是 $DF$。"}, {"id": "b", "text": "$7$", "feedback": "$7$ 是 $BC$ 的长，$BC$ 对应 $EF$，不是 $DF$。"}, {"id": "c", "text": "$12$", "feedback": "这是 $AB+BC$，还要用周长减去它。"}, {"id": "d", "text": "$6$", "feedback": "$DF$ 对应 $AC$，$AC=18-5-7$。"}], "correct": "d", "answer": "$6$", "reasoning": ["由对应顺序，$DF$ 的对应边是 $AC$，全等三角形的对应边相等。", "$AC=18-5-7=6$，所以 $DF=6$。"], "contentVersion": "sha256:6b53355ccd508902a30b85acb6e992b117d1ad4d35280e99cc518d154fce7b47"}, {"id": "j14-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j14-2"], "pointIds": ["pyjh.cong.008", "pyjh.cong.005", "pyjh.cong.006", "pyjh.cong.007"], "prompt": "下列各组条件中，不能判定 $\\triangle ABC\\cong\\triangle DEF$ 的是哪一组？", "options": [{"id": "a", "text": "$AB=DE$，$BC=EF$，$\\angle B=\\angle E$", "feedback": "两边和它们的夹角分别相等，符合“边角边”。"}, {"id": "b", "text": "$\\angle A=\\angle D$，$AB=DE$，$\\angle B=\\angle E$", "feedback": "两角和它们的夹边分别相等，符合“角边角”。"}, {"id": "c", "text": "$AB=DE$，$BC=EF$，$\\angle A=\\angle D$", "feedback": "$\\angle A$ 不是 $AB$ 与 $BC$ 的夹角，这是“边边角”，不能保证全等。"}, {"id": "d", "text": "$AB=DE$，$BC=EF$，$AC=DF$", "feedback": "三边分别相等，符合“边边边”。"}], "correct": "c", "answer": "$AB=DE$，$BC=EF$，$\\angle A=\\angle D$", "reasoning": ["判定方法有“边角边”“角边角”“角角边”“边边边”，用“边角边”时角必须是两边的夹角。", "条件 $AB=DE$，$BC=EF$，$\\angle A=\\angle D$ 中，$\\angle A$ 是边 $BC$ 的对角，属于“边边角”，两边及其中一边的对角分别相等的两个三角形不一定全等。"], "contentVersion": "sha256:b4869f5df223c658a8896800c96a6e4c49493e93aa6c7a561731d28f9110141c", "contentVersions": ["sha256:77f3963917f1fdcfbd5c5e5109dbc219caa3016aac391b85c1619a81480a6893", "sha256:b4869f5df223c658a8896800c96a6e4c49493e93aa6c7a561731d28f9110141c"]}, {"id": "j14-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j14-2"], "pointIds": ["pyjh.cong.009", "pyjh.cong.008"], "prompt": "在 $\\mathrm{Rt}\\triangle ABC$ 和 $\\mathrm{Rt}\\triangle DEF$ 中，$\\angle C=\\angle F=90^\\circ$。再添加下列哪一组条件，不能判定这两个三角形全等？", "options": [{"id": "a", "text": "$AB=DE$，$AC=DF$", "feedback": "斜边和一条直角边分别相等，符合“斜边、直角边”。"}, {"id": "b", "text": "$AC=DF$，$BC=EF$", "feedback": "两条直角边和它们的夹角（直角）分别相等，符合“边角边”。"}, {"id": "c", "text": "$\\angle A=\\angle D$，$\\angle B=\\angle E$", "feedback": "三个角分别相等只能说明形状相同，大小可以不同，没有一组边相等就不能判定全等。"}, {"id": "d", "text": "$AB=DE$，$\\angle A=\\angle D$", "feedback": "加上直角，两角和其中一角的对边分别相等，符合“角角边”。"}], "correct": "c", "answer": "$\\angle A=\\angle D$，$\\angle B=\\angle E$", "reasoning": ["判定直角三角形全等，除“斜边、直角边”外，一般三角形的判定方法同样适用。", "只给 $\\angle A=\\angle D$，$\\angle B=\\angle E$ 时只有角相等，相当于“角角角”，至少要有一组边相等才可能判定全等。"], "contentVersion": "sha256:4224ebee99bc5aa933d63fa151a09a52a69a0767a367d2b325d5a7c132766ed5", "contentVersions": ["sha256:6df955e3eb612758b4a15f1e39fe06fd4ab02f9fe894b711c8ef84ea2e3f4820", "sha256:4224ebee99bc5aa933d63fa151a09a52a69a0767a367d2b325d5a7c132766ed5"]}, {"id": "j14-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j14-3"], "pointIds": ["pyjh.cong.013"], "prompt": "在 $\\triangle ABC$ 中，$\\angle C=90^\\circ$，$AD$ 平分 $\\angle BAC$ 交 $BC$ 于点 $D$，$BC=10$，$BD=6$。点 $D$ 到 $AB$ 的距离是多少？", "options": [{"id": "a", "text": "$6$", "feedback": "$BD$ 不垂直于 $AB$，它不是点 $D$ 到 $AB$ 的距离。"}, {"id": "b", "text": "$4$", "feedback": "$DC\\perp AC$，角平分线上的点到角两边的距离相等，所求距离等于 $DC$。"}, {"id": "c", "text": "$10$", "feedback": "$10$ 是整条 $BC$ 的长，点 $D$ 在 $BC$ 中间。"}, {"id": "d", "text": "$5$", "feedback": "$D$ 不是 $BC$ 的中点，不能取 $BC$ 的一半。"}], "correct": "b", "answer": "$4$", "reasoning": ["$\\angle C=90^\\circ$，所以 $DC\\perp AC$，$DC$ 是点 $D$ 到 $AC$ 的距离，$DC=10-6=4$。", "点 $D$ 在 $\\angle BAC$ 的平分线上，它到 $AB$ 的距离等于到 $AC$ 的距离，也是 $4$。"], "contentVersion": "sha256:d28acf3097413f0a96c756a6d0ed373d21237a1b33d391a1fa5bb9c11949ad22"}, {"id": "j14-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j14-1"], "pointIds": ["pyjh.cong.003", "pyjh.cong.004"], "prompt": "已知 $\\triangle ABC\\cong\\triangle ADE$，点 $B$ 与 $D$、点 $C$ 与 $E$ 是对应顶点。射线 $AD$，$AC$ 都在 $\\angle BAE$ 的内部，并且按 $AB$，$AD$，$AC$，$AE$ 的顺序排列。若 $\\angle BAE=100^\\circ$，$\\angle DAC=40^\\circ$，$\\angle BAC$ 是多少度？", "options": [{"id": "a", "text": "$30^\\circ$", "feedback": "这是 $\\angle BAD$，$\\angle BAC$ 还包括 $\\angle DAC$。"}, {"id": "b", "text": "$50^\\circ$", "feedback": "把 $\\angle BAE$ 直接平分了；$\\angle BAC$ 与 $\\angle DAE$ 有公共部分 $\\angle DAC$。"}, {"id": "c", "text": "$60^\\circ$", "feedback": "这是 $\\angle BAD$ 与 $\\angle CAE$ 的和。"}, {"id": "d", "text": "$70^\\circ$", "feedback": "$\\angle BAC=\\angle DAE$，去掉公共部分得 $\\angle BAD=\\angle CAE$，先求出它。"}], "correct": "d", "answer": "$70^\\circ$", "reasoning": ["由全等，$\\angle BAC=\\angle DAE$，两边都减去公共部分 $\\angle DAC$，得 $\\angle BAD=\\angle CAE$。", "$\\angle BAD+\\angle CAE=100^\\circ-40^\\circ=60^\\circ$，所以 $\\angle BAD=30^\\circ$。", "$\\angle BAC=\\angle BAD+\\angle DAC=30^\\circ+40^\\circ=70^\\circ$。"], "contentVersion": "sha256:e18fe25202dcb2e8ea47b001433aa4ecf7db549e63ee972ebd26f484fdbd4c58"}, {"id": "j14-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j14-2"], "pointIds": ["pyjh.cong.005", "pyjh.cong.010"], "prompt": "池塘两端 $A$，$B$ 之间不能直接测量。在池塘外的平地上取一点 $C$，连接 $AC$ 并延长到点 $D$，使 $CD=CA$；连接 $BC$ 并延长到点 $E$，使 $CE=CB$。量得 $DE=35$ 米。$AB$ 的长和得到它的依据是什么？", "options": [{"id": "a", "text": "$35$ 米，依据“边边边”", "feedback": "只知道 $CA=CD$，$CB=CE$ 两组边相等，$AB$ 与 $DE$ 是否相等正是要求的，不能当条件用。"}, {"id": "b", "text": "$35$ 米，依据“边角边”", "feedback": "$CA=CD$，$CB=CE$，夹角 $\\angle ACB=\\angle DCE$ 是对顶角，所以两个三角形全等。"}, {"id": "c", "text": "$70$ 米，依据“边角边”", "feedback": "$\\triangle ABC$ 与 $\\triangle DEC$ 全等，对应边 $AB$ 与 $DE$ 相等，不是 $2$ 倍关系。"}, {"id": "d", "text": "$35$ 米，依据“角边角”", "feedback": "已知的是两组边和它们的夹角，没有两组角分别相等。"}], "correct": "b", "answer": "$35$ 米，依据“边角边”", "reasoning": ["在 $\\triangle ABC$ 和 $\\triangle DEC$ 中，$CA=CD$，$\\angle ACB=\\angle DCE$（对顶角相等），$CB=CE$。", "由“边角边”得 $\\triangle ABC\\cong\\triangle DEC$，所以 $AB=DE=35$ 米。"], "contentVersion": "sha256:e3edde4ace60dba7ac83993f5e2ed1dcce095b1045f02a1e720684aa65844cca", "contentVersions": ["sha256:a2550a247f9afdf5192346389e74e512119d056d2c3c44467ebaa391db75b0c5", "sha256:e3edde4ace60dba7ac83993f5e2ed1dcce095b1045f02a1e720684aa65844cca"]}, {"id": "j14-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j14-2"], "pointIds": ["pyjh.cong.010", "pyjh.tri.005"], "prompt": "在 $\\triangle ABC$ 中，$AB=7$，$AC=5$，$AD$ 是 $BC$ 边上的中线。延长 $AD$ 到点 $E$，使 $DE=AD$，连接 $CE$。中线 $AD$ 的长的取值范围是什么？", "options": [{"id": "a", "text": "$2<AD<12$", "feedback": "这是 $AE$ 的范围，$AE=2AD$，还要除以 $2$。"}, {"id": "b", "text": "$1<AD<6$", "feedback": "先证 $\\triangle ABD\\cong\\triangle ECD$ 得 $CE=7$，在 $\\triangle ACE$ 中求 $AE$ 的范围，再取一半。"}, {"id": "c", "text": "$5<AD<7$", "feedback": "$AD$ 不一定介于 $AC$ 与 $AB$ 之间，要把 $AD$ 放进一个三角形里用三边关系。"}, {"id": "d", "text": "$0<AD<6$", "feedback": "只用了 $AE<AC+CE$，还要用 $AE>CE-AC$ 得到下限。"}], "correct": "b", "answer": "$1<AD<6$", "reasoning": ["$BD=CD$，$\\angle ADB=\\angle EDC$，$AD=ED$，由“边角边”得 $\\triangle ABD\\cong\\triangle ECD$，所以 $CE=AB=7$。", "在 $\\triangle ACE$ 中，$7-5<AE<7+5$，即 $2<AE<12$。", "$AE=2AD$，所以 $1<AD<6$。"], "contentVersion": "sha256:34511b9915948af0237c68b99396a33c385e71efe85c8ca3d1648a8534b45d7e", "contentVersions": ["sha256:804516fec817f7b260f3306dc44769bd3d29a12ed7da7e18b34b09d2bc529d42", "sha256:34511b9915948af0237c68b99396a33c385e71efe85c8ca3d1648a8534b45d7e"]}, {"id": "j14-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j14-3"], "pointIds": ["pyjh.cong.016", "pyjh.tri.009"], "prompt": "在 $\\triangle ABC$ 中，$\\angle A=70^\\circ$，点 $O$ 在 $\\triangle ABC$ 内部，且到三条边的距离都相等。$\\angle BOC$ 是多少度？", "options": [{"id": "a", "text": "$140^\\circ$", "feedback": "把 $\\angle BOC$ 当成了 $\\angle A$ 的 $2$ 倍；$O$ 是角平分线的交点，要用内角和计算。"}, {"id": "b", "text": "$110^\\circ$", "feedback": "这是 $\\angle ABC+\\angle ACB$，$\\angle BOC$ 只与它们的一半有关。"}, {"id": "c", "text": "$55^\\circ$", "feedback": "这是 $\\angle OBC+\\angle OCB$，$\\angle BOC$ 是 $180^\\circ$ 减去它。"}, {"id": "d", "text": "$125^\\circ$", "feedback": "$O$ 在三个角的平分线上，$\\angle OBC+\\angle OCB=\\frac12(\\angle ABC+\\angle ACB)$。"}], "correct": "d", "answer": "$125^\\circ$", "reasoning": ["三角形内部到三边距离相等的点在三个内角的平分线上，所以 $BO$，$CO$ 分别平分 $\\angle ABC$，$\\angle ACB$。", "$\\angle ABC+\\angle ACB=180^\\circ-70^\\circ=110^\\circ$，所以 $\\angle OBC+\\angle OCB=55^\\circ$。", "$\\angle BOC=180^\\circ-55^\\circ=125^\\circ$。"], "contentVersion": "sha256:2d40e6fc92302db25a8c65c291f4d27b182f6adb828fee21e92f0d7c3955b012"}, {"id": "j14-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j14-2"], "pointIds": ["pyjh.cong.006", "pyjh.cong.010", "pyjh.tri.010"], "prompt": "在 $\\triangle ABC$ 中，$\\angle ACB=90^\\circ$，$AC=BC$。直线 $l$ 经过点 $C$，点 $A$，$B$ 在 $l$ 的同侧，$AD\\perp l$ 于点 $D$，$BE\\perp l$ 于点 $E$。若 $AD=5$，$BE=2$，$DE$ 的长是多少？", "options": [{"id": "a", "text": "$3$", "feedback": "这是 $A$，$B$ 在 $l$ 两侧时的情况；同侧时 $D$，$E$ 分在 $C$ 的两边，$DE=DC+CE$。"}, {"id": "b", "text": "$7$", "feedback": "由“角角边”得 $\\triangle ADC\\cong\\triangle CEB$，$DC=BE$，$CE=AD$，再相加。"}, {"id": "c", "text": "$5$", "feedback": "只算了 $CE$ 的长，还有 $DC$ 一段。"}, {"id": "d", "text": "$10$", "feedback": "线段的长要相加或相减，不是相乘。"}], "correct": "b", "answer": "$7$", "reasoning": ["$\\angle ACD+\\angle BCE=180^\\circ-90^\\circ=90^\\circ$，又 $\\angle ACD+\\angle CAD=90^\\circ$，所以 $\\angle CAD=\\angle BCE$。", "在 $\\triangle ADC$ 和 $\\triangle CEB$ 中，$\\angle ADC=\\angle CEB=90^\\circ$，$\\angle CAD=\\angle BCE$，$AC=CB$，由“角角边”得两三角形全等。", "所以 $CE=AD=5$，$DC=BE=2$，$DE=DC+CE=7$。"], "contentVersion": "sha256:04df103fedb0c925aea69ee5a77e16c5b7d53f509d79cf6e8c7fd473b879b609", "contentVersions": ["sha256:b50bd582f71f1ba8717b212d8fe734a092801ec35cbc30449d8da8f6dea4b846", "sha256:04df103fedb0c925aea69ee5a77e16c5b7d53f509d79cf6e8c7fd473b879b609"]}, {"id": "j14-test-11-v2", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j14-3"], "pointIds": ["pyjh.cong.013", "pyjh.tri.001"], "prompt": "在 $\\triangle ABC$ 中，$AD$ 平分 $\\angle BAC$ 交 $BC$ 于点 $D$，$DE\\perp AB$ 于点 $E$，$DF\\perp AC$ 于点 $F$。$AB=10$，$AC=8$，$\\triangle ABC$ 的面积是 $27$，$DE$ 的长是多少？", "options": [{"id": "a", "text": "$6$", "feedback": "把所求线段放大了；列面积方程时应使用两块三角形各自的底和同样长的高，检查系数。"}, {"id": "b", "text": "$3$", "feedback": "$DE=DF$，把 $\\triangle ABC$ 分成 $\\triangle ABD$ 和 $\\triangle ACD$，两块面积相加等于 $27$。"}, {"id": "c", "text": "$\\frac{27}{5}$", "feedback": "只算了 $\\triangle ABD$ 一块，它的面积不是 $27$。"}, {"id": "d", "text": "$\\frac{27}{4}$", "feedback": "$\\triangle ACD$ 的面积不是 $27$，两块面积要合起来算。"}], "correct": "b", "answer": "$3$", "reasoning": ["$D$ 在 $\\angle BAC$ 的平分线上，$DE\\perp AB$，$DF\\perp AC$，所以 $DE=DF$。设 $DE=DF=h$。", "$S_{\\triangle ABD}+S_{\\triangle ACD}=S_{\\triangle ABC}$：$\\frac12\\times10h+\\frac12\\times8h=27$。", "$9h=27$，$h=3$，所以 $DE=3$。"], "contentVersion": "sha256:04d46b58e4ae1e61be00ca2654dcce82016e5e6cbf6a5b3aeab47a19e3581f82"}, {"id": "j14-test-12-v2", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j14-2"], "pointIds": ["pyjh.cong.007", "pyjh.cong.005", "pyjh.cong.010"], "prompt": "在 $\\triangle ABC$ 中，$AB=AC$，$D$ 是 $BC$ 的中点，点 $E$，$F$ 分别在 $AB$，$AC$ 上（不与端点重合），且 $AE=AF$。连接 $AD$，$DE$，$DF$，不再连其他线段。下列哪一组中的全等关系都能仅根据已知条件保证成立？", "options": [{"id": "a", "text": "$\\triangle ABD\\cong\\triangle ACD$，$\\triangle AED\\cong\\triangle BED$，$\\triangle AFD\\cong\\triangle CFD$", "feedback": "同一侧的两个小三角形缺少相应的边长条件，不能把某种特殊位置下的全等当成必然关系。"}, {"id": "b", "text": "$\\triangle ABD\\cong\\triangle ACD$，$\\triangle AED\\cong\\triangle AFD$，$\\triangle BED\\cong\\triangle AFD$", "feedback": "跨组配对时，所需的对应边不一定相等；应逐条检查已知条件能否保证。"}, {"id": "c", "text": "$\\triangle ABD\\cong\\triangle ACD$，$\\triangle AED\\cong\\triangle AFD$，$\\triangle BED\\cong\\triangle CFD$", "feedback": "分别用边边边、边角边证明各组对应边角满足条件；特殊形状中还可能出现额外全等关系。"}, {"id": "d", "text": "$\\triangle ABD\\cong\\triangle ACD$，$\\triangle AED\\cong\\triangle AFD$，$\\triangle ABC\\cong\\triangle ABD$", "feedback": "整体三角形与它的一半面积不同，不能全等。"}], "correct": "c", "answer": "$\\triangle ABD\\cong\\triangle ACD$，$\\triangle AED\\cong\\triangle AFD$，$\\triangle BED\\cong\\triangle CFD$", "reasoning": ["$AB=AC$，$BD=CD$，$AD=AD$，由边边边得 $\\triangle ABD\\cong\\triangle ACD$，所以 $\\angle BAD=\\angle CAD$，$\\angle ABD=\\angle ACD$。", "$AE=AF$，$\\angle EAD=\\angle FAD$，$AD=AD$，由边角边得 $\\triangle AED\\cong\\triangle AFD$。", "$BE=AB-AE=AC-AF=CF$，$\\angle EBD=\\angle FCD$，$BD=CD$，由边角边得 $\\triangle BED\\cong\\triangle CFD$。因此 c 中的关系都能保证成立，不排除特殊形状下还有别的全等关系。", "a 中要求的 $AE=BE$、b 中要求的 $BE=AF$ 都不由已知条件保证（例如取 $AE=AF=\\frac13 AB$ 即不满足）；d 中 $AD$ 是中线，$\\triangle ABD$ 的面积只有 $\\triangle ABC$ 的一半，也不能全等。"], "contentVersion": "sha256:77fe1bfc54cad1bb85224ec414b753f771f16c3350fb341d169ee5adc9030141"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body
