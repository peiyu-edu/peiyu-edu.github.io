<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 576" width="430" height="576" role="img" aria-labelledby="title desc">
<title id="title">圆锥上蚂蚁的爬行路线</title>
<desc id="desc">圆锥顶点 S，底面圆心 O，底面直径 AB 水平，A 在左、B 在右。SO 和 AB 为虚线，SA、SB 为实线，C 在母线 SB 上。从 A 到 C 有一条沿圆锥前侧面弯曲的实线路线。</desc>
<style>text { fill:#17202a; } .it { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .nm { font-family:'Times New Roman',Georgia,serif; } .zh { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect width="430" height="576" fill="white"/>
<line x1="212.0" y1="40.0" x2="50.0" y2="496.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="212.0" y1="40.0" x2="374.0" y2="496.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="212.0" y1="40.0" x2="212.0" y2="496.0" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8"/>
<line x1="50.0" y1="496.0" x2="374.0" y2="496.0" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 8"/>
<ellipse cx="212" cy="496" rx="162" ry="60" fill="none" stroke="#17202a" stroke-width="3"/>
<path d="M50,496 C155,491 263.0,373.0 293.0,268.0" fill="none" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text class="it" x="192.0" y="42.0" text-anchor="middle" font-size="30">S</text>
<text class="it" x="30.0" y="506.0" text-anchor="middle" font-size="30">A</text>
<text class="it" x="396.0" y="506.0" text-anchor="middle" font-size="30">B</text>
<text class="it" x="315.0" y="264.0" text-anchor="middle" font-size="30">C</text>
<text class="it" x="234.0" y="487.0" text-anchor="middle" font-size="30">O</text>
</svg>
