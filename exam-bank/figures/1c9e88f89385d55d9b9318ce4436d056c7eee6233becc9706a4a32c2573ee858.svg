<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" role="img" aria-labelledby="title desc"><title id="title">圆锥的题设图</title><desc id="desc">圆锥顶点P，底面圆心O，底面直径AB；底面圆后半部分与直径AB用虚线表示。</desc><style>path,circle{fill:none;stroke:currentColor;stroke-width:2}circle.dot{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M60,300L200,40L340,300" /><path d="M60,300A140,40 0 0 1 340,300" stroke-dasharray="6 5" /><path d="M60,300A140,40 0 0 0 340,300" /><path d="M60,300L340,300" stroke-dasharray="6 5" /><circle class="dot" cx="200" cy="300" r="3.5" /><text x="200" y="30" text-anchor="middle" font-size="24" font-style="italic">P</text><text x="40" y="310" text-anchor="middle" font-size="24" font-style="italic">A</text><text x="360" y="310" text-anchor="middle" font-size="24" font-style="italic">B</text><text x="216" y="290" text-anchor="middle" font-size="24" font-style="italic">O</text></svg>