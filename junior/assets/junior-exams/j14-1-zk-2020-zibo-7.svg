<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 405" width="590" height="405" role="img" aria-labelledby="title desc">
<title id="title">全等三角形 ABC 与 ADE</title>
<desc id="desc">△ABC 与 △ADE 有公共顶点 A。点 D 在边 BC 上，点 E 在 C 的右上方；连接 AD、DE、AE，DE 与 AC 相交。从 A 出发的线段 AB、AD、AC、AE 依次排列。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="590" height="405" fill="white"/>
<polygon points="126.0,120.3 31.8,362.5 485.6,362.5" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<line x1="31.8" y1="362.5" x2="485.6" y2="362.5" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="126.0" y1="120.3" x2="220.2" y2="362.5" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="126.0,120.3 220.2,362.5 554.7,55.7" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<text x="106.0" y="116.3" class="l" text-anchor="middle">A</text>
<text x="17.8" y="396.5" class="l" text-anchor="middle">B</text>
<text x="220.2" y="398.5" class="l" text-anchor="middle">D</text>
<text x="501.6" y="392.5" class="l" text-anchor="middle">C</text>
<text x="572.7" y="61.7" class="l" text-anchor="middle">E</text>
</svg>
