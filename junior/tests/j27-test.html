<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 27 章 反比例函数 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j27-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 27 章 反比例函数 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j27-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j27-test", "sectionId": "j27-test", "chapterId": "j27", "title": "第 27 章 反比例函数 · 章末测验", "label": "章末测验", "sections": ["j27-1", "j27-2", "j27-3"], "items": [{"id": "j27-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j27-1"], "pointIds": ["pyjh.invp.001"], "prompt": "下列函数中，$y$ 是 $x$ 的反比例函数的是哪一个？", "options": [{"id": "a", "text": "$y=\\frac{x}{3}$", "feedback": "这是正比例函数 $y=\\frac13x$。"}, {"id": "b", "text": "$y=\\frac{2}{x+1}$", "feedback": "分母是 $x+1$，$y$ 与 $x+1$ 成反比例，不是与 $x$。"}, {"id": "c", "text": "$y=-\\frac{3}{2x}$", "feedback": "可写成 $y=\\frac{k}{x}$，$k=-\\frac32\\ne0$。"}, {"id": "d", "text": "$y=\\frac{1}{x^2}$", "feedback": "$x$ 的指数是 $-2$，不是 $-1$。"}], "correct": "c", "answer": "$y=-\\frac{3}{2x}$", "reasoning": ["反比例函数形如 $y=\\frac{k}{x}$（$k\\ne0$）。", "$y=-\\frac{3}{2x}=\\frac{-\\frac32}{x}$，$k=-\\frac32$。"], "contentVersion": "sha256:59f0e48063dd72c58bbb5c07fbb342463cfe11e4b8ffefe16242fae4aa011398"}, {"id": "j27-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j27-1"], "pointIds": ["pyjh.invp.003"], "prompt": "反比例函数的图象经过点 $(2,-3)$，它的解析式是什么？", "options": [{"id": "a", "text": "$y=\\frac{6}{x}$", "feedback": "$k=xy=2\\times(-3)$，是负数。"}, {"id": "b", "text": "$y=-\\frac{3}{2x}$", "feedback": "代入 $x=2$ 得 $y=-\\frac34$，不过这个点。"}, {"id": "c", "text": "$y=-\\frac{2}{3x}$", "feedback": "$k$ 是横纵坐标之积，不是它们的商。"}, {"id": "d", "text": "$y=-\\frac{6}{x}$", "feedback": "$k=xy=2\\times(-3)=-6$。"}], "correct": "d", "answer": "$y=-\\frac{6}{x}$", "reasoning": ["设 $y=\\frac{k}{x}$，代入 $(2,-3)$：$-3=\\frac{k}{2}$，$k=-6$。", "解析式为 $y=-\\frac{6}{x}$。"], "contentVersion": "sha256:918118cfdbbf1bf8600fe8a2be86af963a5df00552e6763bd985b8fb94a959d6"}, {"id": "j27-test-03-v2", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j27-2"], "pointIds": ["pyjh.invp.004"], "prompt": "反比例函数 $y=\\frac{m-2}{x}$ 的图象位于第二、四象限，$m$ 的取值范围是什么？", "options": [{"id": "a", "text": "$m<2$", "feedback": "图象在二、四象限，$k=m-2<0$。"}, {"id": "b", "text": "$m>2$", "feedback": "$k>0$ 时图象在第一、三象限。"}, {"id": "c", "text": "$m<-2$", "feedback": "由比例系数的符号列不等式后，移项时常数的符号处理有误。"}, {"id": "d", "text": "$m\\ne2$", "feedback": "$m\\ne2$ 只保证是反比例函数，还要定出 $k$ 的符号。"}], "correct": "a", "answer": "$m<2$", "reasoning": ["$y=\\frac{k}{x}$ 中 $k<0$ 时图象在第二、四象限。", "$m-2<0$，$m<2$。"], "contentVersion": "sha256:ae077122df05d66327635ddefb8a90f6d2a787a1c41e34c3427dee94286e42c9"}, {"id": "j27-test-04-v2", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j27-2"], "pointIds": ["pyjh.invp.005", "pyjh.invp.004"], "prompt": "关于反比例函数 $y=\\frac{3}{x}$，下列说法正确的是哪一个？", "options": [{"id": "a", "text": "图象经过点 $(1,-3)$", "feedback": "$x=1$ 时 $y=3$，不是 $-3$。"}, {"id": "b", "text": "图象位于第二、四象限", "feedback": "$k=3>0$，图象在第一、三象限。"}, {"id": "c", "text": "$y$ 随 $x$ 的增大而减小", "feedback": "跨过两支图象比较函数值时，不能直接套用单支上的增减规律。"}, {"id": "d", "text": "在每个象限内，$y$ 随 $x$ 的增大而减小", "feedback": "$k>0$，在每一支上 $y$ 随 $x$ 增大而减小。"}], "correct": "d", "answer": "在每个象限内，$y$ 随 $x$ 的增大而减小", "reasoning": ["$k=3>0$，图象在第一、三象限。", "在每个象限内，$y$ 随 $x$ 的增大而减小；跨过两个象限就不能这样比较。"], "contentVersion": "sha256:20115957678c6dadf58651fec574e3ce88f3ed8378edcf55c823b7f556ff2354"}, {"id": "j27-test-05-v2", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j27-2"], "pointIds": ["pyjh.invp.007"], "prompt": "$P$ 是双曲线 $y=\\frac{6}{x}$ 上任意一点，过 $P$ 作 $x$ 轴的垂线，垂足为 $A$，$O$ 为原点。$\\triangle POA$ 的面积是多少？", "options": [{"id": "a", "text": "$6$", "feedback": "把坐标轴围成的矩形面积直接当成了三角形面积。"}, {"id": "b", "text": "$12$", "feedback": "三角形面积是 $\\frac12|x||y|$，不是 $2|k|$。"}, {"id": "c", "text": "$3$", "feedback": "$S=\\frac12|x_P|\\cdot|y_P|=\\frac12|k|$。"}, {"id": "d", "text": "$\\frac32$", "feedback": "$\\frac12|k|$ 只取一次一半。"}], "correct": "c", "answer": "$3$", "reasoning": ["设 $P(x,y)$，则 $OA=|x|$，$PA=|y|$，$xy=6$。", "$S_{\\triangle POA}=\\frac12|x||y|=\\frac12|k|=3$，与 $P$ 的位置无关。"], "contentVersion": "sha256:4d0c61b074334f5060babcc67df2db9abebe5a2b0181de350625c9b479479df2"}, {"id": "j27-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j27-2"], "pointIds": ["pyjh.invp.005"], "prompt": "点 $A(-2,y_1)$、$B(-1,y_2)$、$C(3,y_3)$ 都在反比例函数 $y=-\\frac{4}{x}$ 的图象上。$y_1$、$y_2$、$y_3$ 的大小关系是什么？", "options": [{"id": "a", "text": "$y_1<y_2<y_3$", "feedback": "$C$ 在第四象限，$y_3<0$，而 $A$、$B$ 的函数值都是正数。"}, {"id": "b", "text": "$y_3<y_1<y_2$", "feedback": "$y_1=2$，$y_2=4$，$y_3=-\\frac43$。"}, {"id": "c", "text": "$y_2<y_1<y_3$", "feedback": "在第二象限内 $y$ 随 $x$ 增大而增大，$-1>-2$。"}, {"id": "d", "text": "$y_3<y_2<y_1$", "feedback": "$k<0$ 时第二象限内 $y$ 随 $x$ 增大而增大，不是减小。"}], "correct": "b", "answer": "$y_3<y_1<y_2$", "reasoning": ["$k=-4<0$，图象在第二、四象限，每个象限内 $y$ 随 $x$ 增大而增大。", "$A$、$B$ 在第二象限，$-2<-1$，所以 $0<y_1<y_2$；$C$ 在第四象限，$y_3<0$。", "也可直接代入：$y_1=2$，$y_2=4$，$y_3=-\\frac43$，所以 $y_3<y_1<y_2$。"], "contentVersion": "sha256:14a4632c39066543a3b79d5bd27d192697dc4fd0605cedc9c8e06927e5d63491"}, {"id": "j27-test-07-v2", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j27-2"], "pointIds": ["pyjh.invp.006"], "prompt": "正比例函数 $y=2x$ 与反比例函数 $y=\\frac{8}{x}$ 的图象交于 $A$、$B$ 两点，$A$ 在第一象限。点 $B$ 的坐标是什么？", "options": [{"id": "a", "text": "$(-4,-2)$", "feedback": "交点关于原点对称，横、纵坐标各自取相反数，不交换位置。"}, {"id": "b", "text": "$(2,-4)$", "feedback": "该点的象限不符合两个交点所在的象限。"}, {"id": "c", "text": "$(-2,4)$", "feedback": "这个点在第二象限，不在 $y=2x$ 上。"}, {"id": "d", "text": "$(-2,-4)$", "feedback": "联立得 $2x^2=8$，$x=\\pm2$；$A(2,4)$，$B$ 与它关于原点对称。"}], "correct": "d", "answer": "$(-2,-4)$", "reasoning": ["联立 $2x=\\frac8x$，$x^2=4$，$x=\\pm2$。", "$A(2,4)$；$B$ 与 $A$ 关于原点对称，$B(-2,-4)$。"], "contentVersion": "sha256:3f75082bdc2181cc7bfa9728cafe9083b850242f46d155905317441f17610631"}, {"id": "j27-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j27-1"], "pointIds": ["pyjh.invp.002"], "prompt": "函数 $y=(m+1)x^{m^2-2}$ 是反比例函数，$m$ 的值是多少？", "options": [{"id": "a", "text": "$\\pm1$", "feedback": "$m=-1$ 时系数 $m+1=0$，不是反比例函数。"}, {"id": "b", "text": "$-1$", "feedback": "$m=-1$ 时系数为 $0$，函数变成 $y=0$。"}, {"id": "c", "text": "$0$", "feedback": "$m=0$ 时指数是 $-2$，不是 $-1$。"}, {"id": "d", "text": "$1$", "feedback": "指数 $m^2-2=-1$ 得 $m=\\pm1$，且 $m+1\\ne0$。"}], "correct": "d", "answer": "$m=1$", "reasoning": ["反比例函数 $y=kx^{-1}$：指数 $m^2-2=-1$，$m=\\pm1$。", "系数 $m+1\\ne0$，$m\\ne-1$，所以 $m=1$。"], "contentVersion": "sha256:c2cb8b101549f364c3c8edd4f5912329e7a6266f2772bc21046a162039957079"}, {"id": "j27-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j27-3"], "pointIds": ["pyjh.invp.008", "pyjh.invp.009"], "prompt": "一个蓄水池，每小时排水 $8$ 立方米时 $6$ 小时能把水排完。如果要在 $4$ 小时内排完，每小时至少排水多少立方米？", "options": [{"id": "a", "text": "$12$ 立方米", "feedback": "总水量 $48$ 立方米一定，$Q=\\frac{48}{t}$，$t\\le4$ 时 $Q\\ge12$。"}, {"id": "b", "text": "$\\frac{16}{3}$ 立方米", "feedback": "排水时间变短，每小时排水量应该变大。"}, {"id": "c", "text": "$32$ 立方米", "feedback": "$8\\times4$ 是 $4$ 小时按原速度排的水量，不是所需速度。"}, {"id": "d", "text": "$10$ 立方米", "feedback": "时间与排水速度成反比例，不是各差 $2$。"}], "correct": "a", "answer": "$12$ 立方米", "reasoning": ["蓄水量 $V=8\\times6=48$（立方米），排水速度 $Q=\\frac{48}{t}$。", "$Q$ 随 $t$ 减小而增大，$t\\le4$ 时 $Q\\ge\\frac{48}{4}=12$。", "每小时至少排水 $12$ 立方米。"], "contentVersion": "sha256:3fb9aa322532d1fba8412408bb95e3b4fe800f998591d75820d40e33597693b4"}, {"id": "j27-test-10-v2", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j27-2"], "pointIds": ["pyjh.invp.007", "pyjh.invp.004"], "prompt": "点 $A$ 在双曲线 $y=\\frac{k}{x}$ 位于第二象限的一支上，过 $A$ 分别作 $x$ 轴、$y$ 轴的垂线，与两条坐标轴围成的矩形面积是 $6$。$k$ 的值是多少？", "options": [{"id": "a", "text": "$6$", "feedback": "图象在第二象限，$k<0$。"}, {"id": "b", "text": "$-3$", "feedback": "矩形面积就是 $|k|$，不需要除以 $2$。"}, {"id": "c", "text": "$3$", "feedback": "既混淆了矩形与三角形的面积关系，也忽略了比例系数的符号。"}, {"id": "d", "text": "$-6$", "feedback": "矩形面积 $=|x_A|\\cdot|y_A|=|k|=6$，第二象限 $k<0$。"}], "correct": "d", "answer": "$k=-6$", "reasoning": ["设 $A(x,y)$，矩形面积 $=|x||y|=|xy|=|k|=6$。", "$A$ 在第二象限，$x<0$，$y>0$，$k=xy<0$，所以 $k=-6$。"], "contentVersion": "sha256:e1c8766bc2e31223827aa329aa0fefbe94eb6d97402eca99dc635491e26341ca"}, {"id": "j27-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j27-2"], "pointIds": ["pyjh.invp.006", "pyjh.lin.017"], "prompt": "一次函数 $y=-x+5$ 的图象与反比例函数 $y=\\frac{4}{x}$（$x>0$）的图象交于两点。当 $x>0$ 时，使 $-x+5>\\frac{4}{x}$ 成立的 $x$ 的取值范围是什么？", "options": [{"id": "a", "text": "$1<x<4$", "feedback": "两交点横坐标为 $1$、$4$，直线在双曲线上方的部分夹在中间。"}, {"id": "b", "text": "$x<1$ 或 $x>4$", "feedback": "这是直线在双曲线下方的部分。"}, {"id": "c", "text": "$x>4$", "feedback": "$x=5$ 时 $-x+5=0$，比 $\\frac45$ 小。"}, {"id": "d", "text": "$0<x<1$", "feedback": "$x=\\frac12$ 时 $-x+5=4.5$，比 $\\frac{4}{x}=8$ 小。"}], "correct": "a", "answer": "$1<x<4$", "reasoning": ["联立 $-x+5=\\frac4x$，$x^2-5x+4=0$，$x_1=1$，$x_2=4$，交点为 $(1,4)$、$(4,1)$。", "在 $1<x<4$ 时直线在双曲线上方，即 $-x+5>\\frac4x$。", "所以 $1<x<4$。"], "contentVersion": "sha256:f4dd387b9dc20b1b5d8579d814d8e0ae7d12e0cc1daf8eddfc12efebd5d2d05c"}, {"id": "j27-test-12-v2", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j27-3"], "pointIds": ["pyjh.invp.010", "pyjh.invp.009"], "prompt": "压力 $F=600$ 牛一定时，压强 $p$（帕）与受力面积 $S$（平方米）满足 $p=\\frac{F}{S}$。为了让压强不超过 $2000$ 帕，受力面积至少是多少平方米？", "options": [{"id": "a", "text": "$0.03$ 平方米", "feedback": "代入检验：$S=0.03$ 时压强是 $20000$ 帕，远超 $2000$ 帕。"}, {"id": "b", "text": "$3$ 平方米", "feedback": "由压强上限求面积下限时，除法的数量关系处理有误。"}, {"id": "c", "text": "$0.3$ 平方米", "feedback": "$S$ 越大压强越小，$p\\le2000$ 要求 $S\\ge\\frac{600}{2000}$。"}, {"id": "d", "text": "$1.2$ 平方米", "feedback": "$1.2$ 平方米时压强只有 $500$ 帕，不是满足条件的最小面积。"}], "correct": "c", "answer": "$0.3$ 平方米", "reasoning": ["$p=\\frac{600}{S}$，$S>0$，$p$ 随 $S$ 增大而减小。", "$p\\le2000$，即 $\\frac{600}{S}\\le2000$，$S\\ge0.3$。", "受力面积至少 $0.3$ 平方米。"], "contentVersion": "sha256:a4b40a13d869f994cd595f3361dd19e107465db175fd402499622e95d115f41b"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
