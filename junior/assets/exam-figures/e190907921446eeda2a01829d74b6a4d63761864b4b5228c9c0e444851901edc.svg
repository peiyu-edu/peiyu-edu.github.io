<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1296" width="600" height="1296" role="img" aria-labelledby="title desc">
<title id="title">气温的四个统计图选项</title>
<desc id="desc">A、B、C、D 四个统计图。A 是条形图，纵轴天数，横轴最高气温/℃：25 为 2 天，28、29 各 1 天，30 为 2 天，33 为 1 天。B 是频数直方图，纵轴频数（天数），横轴最高气温/℃，分点 25、28、31、34，三组频数依次为 2、4、1。C 是折线图，纵轴最高气温/℃，横轴星期，星期一至星期日依次标 25、25、28、30、33、30、29 并连线。D 是扇形图：25℃ 占 28.6%，33℃ 占 14.3%，30℃ 占 28.5%，29℃ 占 14.3%，28℃ 占 14.3%。</desc>
