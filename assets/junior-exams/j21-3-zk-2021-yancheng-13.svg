<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" width="480" height="310" role="img" aria-labelledby="title desc">
<title id="title">直角三角形与斜边中线</title>
<desc id="desc">直角三角形 ABC，直角顶点 C 在左下并标有直角记号，A 在 C 的正上方，B 在 C 的正右方。D 在斜边 AB 上，连接 CD。</desc>
<style>text { fill:#17202a; font-size:30px; } .i { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .n { font-family:'Times New Roman',Georgia,serif; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect x="0" y="0" width="480" height="310" fill="white"/>
<polyline points="50.0,30.0 50.0,270.0 430.0,270.0 50.0,30.0" fill="none" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/><line x1="50.0" y1="270.0" x2="240.0" y2="150.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><polyline points="50.0,250.0 70.0,250.0 70.0,270.0" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/><text class="i" x="24" y="40" text-anchor="middle">A</text><text class="i" x="24" y="300" text-anchor="middle">C</text><text class="i" x="455" y="285" text-anchor="middle">B</text><text class="i" x="252.0" y="132.0" text-anchor="middle">D</text>
</svg>
