<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 432" role="img" aria-labelledby="title desc"><title id="title">程序框图</title><desc id="desc">程序框图：开始后输入 n=3、A=1、B=2、k=1；判断 k≤n，若是则依次执行 A=A+B、B=A+B、k=k+1，再返回判断；若否则输出 B 并结束。</desc><style>path,circle,ellipse,polyline{fill:none;stroke:currentColor;stroke-width:2}.thin{stroke-width:1.2}.fill{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><rect x="115.0" y="12.0" width="70" height="26" rx="13.0" class="thin" style="fill:none;stroke:currentColor" /><text x="150.0" y="30.0" text-anchor="middle" font-size="15">开始</text><path d="M150.00,38.00L150.00,61.00" class="thin" /><path d="M150.00,62.00L146.00,53.00L154.00,53.00Z" class="fill" /><path d="M63.00,63.00L253.00,63.00L237.00,91.00L47.00,91.00Z" /><text x="150.0" y="82.0" text-anchor="middle" font-size="15">输入n=3,A=1,B=2,k=1</text><path d="M150.00,91.00L150.00,111.00" class="thin" /><path d="M150.00,112.00L146.00,103.00L154.00,103.00Z" class="fill" /><path d="M150.00,113.00L190.00,136.00L150.00,159.00L110.00,136.00Z" /><text x="150.0" y="141.0" text-anchor="middle" font-size="15">k≤n</text><path d="M150.00,159.00L150.00,183.00" class="thin" /><path d="M150.00,184.00L146.00,175.00L154.00,175.00Z" class="fill" /><text x="162.0" y="177.0" text-anchor="middle" font-size="14">是</text><path d="M110.00,184.00L190.00,184.00L190.00,212.00L110.00,212.00Z" /><text x="150.0" y="203.0" text-anchor="middle" font-size="15">A=A+B</text><path d="M150.00,212.00L150.00,235.00" class="thin" /><path d="M150.00,236.00L146.00,227.00L154.00,227.00Z" class="fill" /><path d="M110.00,236.00L190.00,236.00L190.00,264.00L110.00,264.00Z" /><text x="150.0" y="255.0" text-anchor="middle" font-size="15">B=A+B</text><path d="M150.00,264.00L150.00,287.00" class="thin" /><path d="M150.00,288.00L146.00,279.00L154.00,279.00Z" class="fill" /><path d="M110.00,288.00L190.00,288.00L190.00,316.00L110.00,316.00Z" /><text x="150.0" y="307.0" text-anchor="middle" font-size="15">k=k+1</text><path d="M110.00,302.00L60.00,302.00L60.00,102.00L146.00,102.00" /><path d="M150.00,102.00L141.00,98.00L141.00,106.00Z" class="fill" /><path d="M190.00,136.00L240.00,136.00L240.00,332.00L150.00,332.00" /><text x="212.0" y="128.0" text-anchor="middle" font-size="14">否</text><path d="M150.00,332.00L150.00,349.00" class="thin" /><path d="M150.00,350.00L146.00,341.00L154.00,341.00Z" class="fill" /><path d="M113.00,350.00L203.00,350.00L187.00,378.00L97.00,378.00Z" /><text x="150.0" y="369.0" text-anchor="middle" font-size="15">输出B</text><path d="M150.00,378.00L150.00,397.00" class="thin" /><path d="M150.00,398.00L146.00,389.00L154.00,389.00Z" class="fill" /><rect x="115.0" y="399.0" width="70" height="26" rx="13.0" class="thin" style="fill:none;stroke:currentColor" /><text x="150.0" y="417.0" text-anchor="middle" font-size="15">结束</text></svg>
