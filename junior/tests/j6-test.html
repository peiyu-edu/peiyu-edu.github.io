<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 6 章 几何图形初步 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=0346bdf6f187"><link rel="stylesheet" href="../assets/learning-shell.css?v=98f4d1951708"><link rel="stylesheet" href="../assets/learning-contrast.css?v=bc8e3f382635"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=9f35dd2cb533"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=5386fbb9fecf"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=e3d4083f037a"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=9e04f871a3b0"></script></head><body data-stage="junior" data-sec="j6-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 6 章 几何图形初步 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j6-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j6-test", "sectionId": "j6-test", "chapterId": "j6", "title": "第 6 章 几何图形初步 · 章末测验", "label": "章末测验", "sections": ["j6-1", "j6-2", "j6-3"], "items": [{"id": "j6-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j6-1"], "pointIds": ["pyjh.geo.001"], "prompt": "下列图形中，属于立体图形的是哪一个？", "options": [{"id": "a", "text": "圆", "feedback": "圆的各部分都在同一平面内，是平面图形。"}, {"id": "b", "text": "三角形", "feedback": "三角形是平面图形。"}, {"id": "c", "text": "圆锥", "feedback": "圆锥的各部分不都在同一平面内。"}, {"id": "d", "text": "正方形", "feedback": "正方形是平面图形，正方体才是立体图形。"}], "correct": "c", "answer": "圆锥", "reasoning": ["各部分不都在同一平面内的图形是立体图形；各部分都在同一平面内的是平面图形。", "圆、三角形、正方形都是平面图形，圆锥是立体图形。"], "contentVersion": "sha256:5f0a00fdfccc035abede55e75e9ce22a33456061ce51184d38a0504618fb1c5e"}, {"id": "j6-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j6-1"], "pointIds": ["pyjh.geo.003"], "prompt": "把一个圆柱的侧面沿一条高剪开并展平，得到的平面图形是什么？", "options": [{"id": "a", "text": "长方形", "feedback": "侧面展开后，一边是底面周长，另一边是圆柱的高。"}, {"id": "b", "text": "圆", "feedback": "圆是圆柱的底面，不是侧面。"}, {"id": "c", "text": "扇形", "feedback": "扇形是圆锥侧面的展开图。"}, {"id": "d", "text": "三角形", "feedback": "圆柱侧面展开后对边平行且相等，四个角都是直角。"}], "correct": "a", "answer": "长方形", "reasoning": ["圆柱侧面沿高剪开展平，上下两条边由底面圆周展开而来，长度等于底面周长。", "另外两条边是剪开的那条高，所以得到长方形（特殊情况下是正方形）。"], "contentVersion": "sha256:25922d3553b0563843a9b563eb4b377c9c3398cb0dc42621a0ab636eb49e655e"}, {"id": "j6-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j6-2"], "pointIds": ["pyjh.geo.006"], "prompt": "植树时，只要先确定两棵树的位置，就能确定同一行树所在的直线。这里用到的数学道理是什么？", "options": [{"id": "a", "text": "两点之间，线段最短", "feedback": "这条事实讲的是路程长短，不是确定直线。"}, {"id": "b", "text": "两点确定一条直线", "feedback": "经过两点有一条直线，并且只有一条直线。"}, {"id": "c", "text": "直线可以向两方无限延伸", "feedback": "这是直线的特征，说明不了为什么两个位置就能定下一行。"}, {"id": "d", "text": "线段有两个端点", "feedback": "这是线段的特征，不能说明一行树为什么能确定。"}], "correct": "b", "answer": "两点确定一条直线", "reasoning": ["经过两点有一条直线，并且只有一条直线，即两点确定一条直线。", "确定两棵树的位置就确定了这一行树所在的直线。"], "contentVersion": "sha256:f90089cacf7575bff10204a4490418d635a310957cd672a77e392e26e88ebf6e"}, {"id": "j6-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j6-3"], "pointIds": ["pyjh.geo.009"], "prompt": "把 $36.25^\\circ$ 用度、分、秒表示，正确的是哪一项？", "options": [{"id": "a", "text": "$36^\\circ15'$", "feedback": "把 $0.25^\\circ$ 乘 $60$ 化成分。"}, {"id": "b", "text": "$36^\\circ25'$", "feedback": "度、分之间是六十进制，$0.25^\\circ$ 不等于 $25$ 分。"}, {"id": "c", "text": "$36^\\circ2'30''$", "feedback": "$0.25^\\circ\\times60$ 先得分数，不是把 $0.25$ 拆成 $2$ 分 $30$ 秒。"}, {"id": "d", "text": "$36^\\circ12'30''$", "feedback": "$0.25\\times60$ 的结果是整数分，没有秒。"}], "correct": "a", "answer": "$36^\\circ15'$", "reasoning": ["$1^\\circ=60'$，$0.25^\\circ=0.25\\times60'=15'$。", "所以 $36.25^\\circ=36^\\circ15'$。"], "contentVersion": "sha256:01cdc322e90568e719a5f565e3605717bfa69a403d97afd59a93b188de12bc80"}, {"id": "j6-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j6-3"], "pointIds": ["pyjh.geo.011"], "prompt": "一个角是 $35^\\circ$，它的补角是多少度？", "options": [{"id": "a", "text": "$55^\\circ$", "feedback": "这是它的余角；和为 $180^\\circ$ 的两个角才互为补角。"}, {"id": "b", "text": "$145^\\circ$", "feedback": "两个角的和为 $180^\\circ$ 时互为补角。"}, {"id": "c", "text": "$325^\\circ$", "feedback": "补角与 $180^\\circ$ 有关，不是 $360^\\circ$。"}, {"id": "d", "text": "$65^\\circ$", "feedback": "要用 $180^\\circ$ 减去这个角。"}], "correct": "b", "answer": "$145^\\circ$", "reasoning": ["两个角的和等于 $180^\\circ$，这两个角互为补角。", "$180^\\circ-35^\\circ=145^\\circ$。"], "contentVersion": "sha256:2e0cc78d0d1dd499aa843e0f406221ab0563989d6293099ce0c4ec976e940b7c"}, {"id": "j6-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j6-2"], "pointIds": ["pyjh.geo.007"], "prompt": "线段 $AB=10\\,\\text{cm}$，点 $C$ 在线段 $AB$ 上，且 $AC=6\\,\\text{cm}$。$M$ 是 $AC$ 的中点，$N$ 是 $CB$ 的中点，线段 $MN$ 的长是多少？", "options": [{"id": "a", "text": "$3\\,\\text{cm}$", "feedback": "这只是 $MC$ 的长，还要加上 $CN$。"}, {"id": "b", "text": "$2\\,\\text{cm}$", "feedback": "这只是 $CN$ 的长，还要加上 $MC$。"}, {"id": "c", "text": "$5\\,\\text{cm}$", "feedback": "$MN=MC+CN$，分别是 $AC$ 和 $CB$ 的一半。"}, {"id": "d", "text": "$8\\,\\text{cm}$", "feedback": "$MN$ 只包括 $AC$ 的一半与 $CB$ 的一半。"}], "correct": "c", "answer": "$5\\,\\text{cm}$", "reasoning": ["$CB=AB-AC=10-6=4$（cm）。", "$MC=\\frac12AC=3$（cm），$CN=\\frac12CB=2$（cm）。", "$MN=MC+CN=5$（cm），也就是 $\\frac12AB$。"], "contentVersion": "sha256:04f2aa1cfa86f30bd566f6efa515856d9f01a2d724986f08b4e331db0de1a227"}, {"id": "j6-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j6-2"], "pointIds": ["pyjh.geo.007", "pyjh.geo.005"], "prompt": "点 $A$，$B$，$C$ 在同一条直线上，$AB=8\\,\\text{cm}$，$BC=3\\,\\text{cm}$。线段 $AC$ 的长是多少？", "options": [{"id": "a", "text": "$11\\,\\text{cm}$", "feedback": "点 $C$ 也可能在线段 $AB$ 上。"}, {"id": "b", "text": "$5\\,\\text{cm}$", "feedback": "点 $C$ 也可能在线段 $AB$ 的延长线上。"}, {"id": "c", "text": "$11\\,\\text{cm}$ 或 $5\\,\\text{cm}$", "feedback": "题目没有给出点 $C$ 的位置，要分 $C$ 在线段 $AB$ 上和在延长线上两种情况。"}, {"id": "d", "text": "$24\\,\\text{cm}$", "feedback": "线段的长度应相加或相减，不是相乘。"}], "correct": "c", "answer": "$11\\,\\text{cm}$ 或 $5\\,\\text{cm}$", "reasoning": ["若点 $C$ 在线段 $AB$ 的延长线上（$B$ 在 $A$，$C$ 之间），$AC=AB+BC=11$（cm）。", "若点 $C$ 在线段 $AB$ 上，$AC=AB-BC=5$（cm）。", "$BC<AB$，点 $C$ 不可能在 $BA$ 的延长线上，所以 $AC$ 为 $11\\,\\text{cm}$ 或 $5\\,\\text{cm}$。"], "contentVersion": "sha256:32ea001bdb891338acd2d8f4d6850679570ade018bf6c0fd7202390d149be1f0"}, {"id": "j6-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j6-3"], "pointIds": ["pyjh.geo.010"], "prompt": "$\\angle AOB=120^\\circ$，射线 $OC$ 平分 $\\angle AOB$，射线 $OD$ 在 $\\angle AOC$ 的内部，且 $\\angle AOD=20^\\circ$。$\\angle COD$ 是多少度？", "options": [{"id": "a", "text": "$40^\\circ$", "feedback": "先求 $\\angle AOC$，再减去 $\\angle AOD$。"}, {"id": "b", "text": "$60^\\circ$", "feedback": "这是 $\\angle AOC$，$OD$ 在它内部，还要减去 $\\angle AOD$。"}, {"id": "c", "text": "$80^\\circ$", "feedback": "平分后每份是 $\\angle AOB$ 的一半，再相减。"}, {"id": "d", "text": "$100^\\circ$", "feedback": "这是 $\\angle DOB$，题目求的是 $\\angle COD$。"}], "correct": "a", "answer": "$40^\\circ$", "reasoning": ["$OC$ 平分 $\\angle AOB$，$\\angle AOC=\\frac12\\times120^\\circ=60^\\circ$。", "$OD$ 在 $\\angle AOC$ 内部，$\\angle COD=\\angle AOC-\\angle AOD=60^\\circ-20^\\circ=40^\\circ$。"], "contentVersion": "sha256:bb616400558854ae30f7433220bf05b0948d9bb09b3e53df77ef49c61022a222"}, {"id": "j6-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j6-3"], "pointIds": ["pyjh.geo.012"], "prompt": "从灯塔 $A$ 看轮船 $B$，轮船在北偏东 $40^\\circ$ 方向。那么从轮船 $B$ 看灯塔 $A$，灯塔在什么方向？", "options": [{"id": "a", "text": "北偏东 $40^\\circ$", "feedback": "观测点换了，方向要反过来。"}, {"id": "b", "text": "南偏东 $40^\\circ$", "feedback": "东要变成西：$A$ 在 $B$ 的西侧。"}, {"id": "c", "text": "南偏西 $40^\\circ$", "feedback": "两地互看时，南北互换、东西互换，角度不变。"}, {"id": "d", "text": "北偏西 $50^\\circ$", "feedback": "角度不变，仍从南北方向量起。"}], "correct": "c", "answer": "南偏西 $40^\\circ$", "reasoning": ["方向角以南北方向为始边。$B$ 在 $A$ 的北偏东 $40^\\circ$，即 $B$ 在 $A$ 的北边偏东。", "反过来看，$A$ 在 $B$ 的南边偏西；画出两处的南北方向线可以看到，$BA$ 与 $B$ 处南北线的夹角仍是 $40^\\circ$。"], "contentVersion": "sha256:1391afb9a40fe7ca221c728cb5d8620a057cbfeee224cd64130d2897c372d45a"}, {"id": "j6-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j6-3"], "pointIds": ["pyjh.geo.011", "pyjh.eq.009"], "prompt": "一个角的补角比它的余角的 $3$ 倍少 $20^\\circ$，这个角是多少度？", "options": [{"id": "a", "text": "$55^\\circ$", "feedback": "代入检验：$55^\\circ$ 的补角是 $125^\\circ$，它的余角的 $3$ 倍少 $20^\\circ$ 是 $85^\\circ$，两者不相等。"}, {"id": "b", "text": "$35^\\circ$", "feedback": "设这个角为 $x^\\circ$，用 $180-x$ 和 $90-x$ 表示补角和余角，列方程。"}, {"id": "c", "text": "$145^\\circ$", "feedback": "一个角有余角，它必须小于 $90^\\circ$。"}, {"id": "d", "text": "$25^\\circ$", "feedback": "代入检验：补角 $155^\\circ$，余角的 $3$ 倍少 $20^\\circ$ 是 $175^\\circ$，不相等。"}], "correct": "b", "answer": "$35^\\circ$", "reasoning": ["设这个角为 $x^\\circ$，补角为 $(180-x)^\\circ$，余角为 $(90-x)^\\circ$。", "$180-x=3(90-x)-20$，即 $180-x=250-3x$，$2x=70$，$x=35$。", "检验：补角 $145^\\circ$，余角 $55^\\circ$，$3\\times55^\\circ-20^\\circ=145^\\circ$。"], "contentVersion": "sha256:804a6d23c29ad929d462ec910ce680319b5034f36027a3ddc179606f27803547"}, {"id": "j6-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j6-3"], "pointIds": ["pyjh.geo.008", "pyjh.geo.010", "pyjh.geo.009"], "prompt": "钟表上 $3$ 点 $30$ 分时，时针与分针所成的角（小于平角）是多少度？", "options": [{"id": "a", "text": "$90^\\circ$", "feedback": "$3$ 点半时时针已经从 $3$ 走向 $4$，不在 $3$ 上。"}, {"id": "b", "text": "$75^\\circ$", "feedback": "分针每分钟转 $6^\\circ$，时针每分钟转 $0.5^\\circ$，分别算出它们从 $12$ 起转过的角度。"}, {"id": "c", "text": "$60^\\circ$", "feedback": "时针与分针之间是两大格半，每大格 $30^\\circ$。"}, {"id": "d", "text": "$105^\\circ$", "feedback": "这是时针从 $12$ 起转过的角度，不是两针的夹角。"}], "correct": "b", "answer": "$75^\\circ$", "reasoning": ["分针 $30$ 分钟从 $12$ 转过 $30\\times6^\\circ=180^\\circ$。", "时针从 $12$ 转过 $3\\times30^\\circ+30\\times0.5^\\circ=105^\\circ$。", "夹角 $180^\\circ-105^\\circ=75^\\circ$。"], "contentVersion": "sha256:edf70f38ccaa25bb9bb62f4fca995d19ba9c560220f440e2c0321e4fd216a4f9"}, {"id": "j6-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j6-2"], "pointIds": ["pyjh.geo.006", "pyjh.geo.005"], "prompt": "平面上有 $4$ 个点，其中任意 $3$ 个点都不在同一条直线上。经过其中每两个点画一条直线，一共可以画多少条？", "options": [{"id": "a", "text": "$4$ 条", "feedback": "只连了相邻的点，对角的两点之间也能画直线。"}, {"id": "b", "text": "$12$ 条", "feedback": "每条直线被数了两次：从 $A$ 到 $B$ 与从 $B$ 到 $A$ 是同一条。"}, {"id": "c", "text": "$6$ 条", "feedback": "每个点与另外 $3$ 个点各确定一条直线，再除以 $2$。"}, {"id": "d", "text": "$8$ 条", "feedback": "两点确定一条直线，按点两两配对来数。"}], "correct": "c", "answer": "$6$ 条", "reasoning": ["两点确定一条直线，任意三点不共线，所以每两个点确定的直线互不相同。", "每个点与另外 $3$ 个点各确定一条直线，共 $4\\times3=12$，每条数了两次，所以有 $12\\div2=6$ 条。"], "contentVersion": "sha256:dce2c3e0a492eb8db471d3e668ceae425123218eddd48ee5491f1e2f5b730018"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
