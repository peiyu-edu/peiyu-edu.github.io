<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 19 章 二次根式 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j19-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 19 章 二次根式 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j19-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j19-test", "sectionId": "j19-test", "chapterId": "j19", "title": "第 19 章 二次根式 · 章末测验", "label": "章末测验", "sections": ["j19-1", "j19-2", "j19-3"], "items": [{"id": "j19-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j19-1"], "pointIds": ["pyjh.rad.002", "pyjh.rad.001"], "prompt": "若 $\\sqrt{x-3}$ 在实数范围内有意义，则 $x$ 的取值范围是什么？", "options": [{"id": "a", "text": "$x>3$", "feedback": "$x=3$ 时被开方数为 $0$，$\\sqrt0=0$ 有意义，等号要取到。"}, {"id": "b", "text": "$x\\ge3$", "feedback": "二次根式有意义，需要被开方数 $x-3\\ge0$。"}, {"id": "c", "text": "$x\\le3$", "feedback": "被开方数要大于或等于 $0$，不是小于或等于 $0$。"}, {"id": "d", "text": "$x\\ge-3$", "feedback": "由 $x-3\\ge0$ 移项时，$-3$ 移到右边要变成 $+3$。"}], "correct": "b", "answer": "$x\\ge3$", "reasoning": ["二次根式 $\\sqrt a$ 中被开方数 $a\\ge0$，所以 $x-3\\ge0$。", "解得 $x\\ge3$。"], "contentVersion": "sha256:fb66bdc036bb806e49152127920b3d1a00b6280b5fafbb32a57e5a7f074743f0"}, {"id": "j19-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j19-1"], "pointIds": ["pyjh.rad.005"], "prompt": "$\\sqrt{(-5)^2}$ 的值是多少？", "options": [{"id": "a", "text": "$-5$", "feedback": "算术平方根是非负数，结果不可能是负数。"}, {"id": "b", "text": "$5$", "feedback": "先算 $(-5)^2=25$，再求 $25$ 的算术平方根。"}, {"id": "c", "text": "$25$", "feedback": "$(-5)^2=25$ 之后还要开平方。"}, {"id": "d", "text": "$\\sqrt5$", "feedback": "被开方数是 $(-5)^2$，先算出它的值再开方，不能把底数 $-5$ 的绝对值直接放进根号。"}], "correct": "b", "answer": "$5$", "reasoning": ["$(-5)^2=25$。", "$\\sqrt{25}=5$，所以 $\\sqrt{(-5)^2}=5$。"], "contentVersion": "sha256:88c36b24e9eaef2e3d13e36c5645caaa08e7101b66d9d7b7eb7f7ddf66e55e30"}, {"id": "j19-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j19-2"], "pointIds": ["pyjh.rad.007", "pyjh.rad.008"], "prompt": "计算 $\\sqrt6\\times\\sqrt8$，结果化成最简二次根式是哪一项？", "options": [{"id": "a", "text": "$\\sqrt{14}$", "feedback": "乘法法则是被开方数相乘，不是相加。"}, {"id": "b", "text": "$48$", "feedback": "$\\sqrt6\\times\\sqrt8=\\sqrt{48}$，结果仍带根号，不能直接去掉根号。"}, {"id": "c", "text": "$4\\sqrt3$", "feedback": "$\\sqrt6\\times\\sqrt8=\\sqrt{48}=\\sqrt{16\\times3}$，把 $16$ 开出来。"}, {"id": "d", "text": "$16\\sqrt3$", "feedback": "移到根号外的应是 $\\sqrt{16}=4$，不是 $16$。"}], "correct": "c", "answer": "$4\\sqrt3$", "reasoning": ["$\\sqrt6\\times\\sqrt8=\\sqrt{6\\times8}=\\sqrt{48}$。", "$\\sqrt{48}=\\sqrt{16\\times3}=\\sqrt{16}\\times\\sqrt3=4\\sqrt3$。"], "contentVersion": "sha256:9876eb54bc64e8661a4011b40744f4238b3ba782d106ed470dbb79a319b9d52c"}, {"id": "j19-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j19-2"], "pointIds": ["pyjh.rad.010"], "prompt": "下列二次根式中，哪一个是最简二次根式？", "options": [{"id": "a", "text": "$\\sqrt8$", "feedback": "$8=4\\times2$，含开得尽方的因数 $4$，还能化简。"}, {"id": "b", "text": "$\\sqrt{\\frac12}$", "feedback": "被开方数含分母，不是最简二次根式。"}, {"id": "c", "text": "$\\sqrt{0.3}$", "feedback": "被开方数是小数，相当于含分母，不是最简二次根式。"}, {"id": "d", "text": "$\\sqrt{15}$", "feedback": "$15=3\\times5$，被开方数不含分母，也不含开得尽方的因数。"}], "correct": "d", "answer": "$\\sqrt{15}$", "reasoning": ["最简二次根式要求：被开方数不含分母，且不含能开得尽方的因数或因式。", "$\\sqrt8=2\\sqrt2$，$\\sqrt{\\frac12}$ 与 $\\sqrt{0.3}$ 含分母；只有 $\\sqrt{15}$ 两条都满足。"], "contentVersion": "sha256:e885db0c20ed42ba7cf26f2762da6d527b44be2899c086a81868c89d102f7ebb"}, {"id": "j19-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j19-2", "j19-3"], "pointIds": ["pyjh.rad.013", "pyjh.rad.008"], "prompt": "计算 $\\sqrt{12}+\\sqrt{27}$，结果是哪一项？", "options": [{"id": "a", "text": "$\\sqrt{39}$", "feedback": "二次根式相加不能把被开方数直接相加，要先化简再合并。"}, {"id": "b", "text": "$5\\sqrt3$", "feedback": "先化简：$\\sqrt{12}=2\\sqrt3$，$\\sqrt{27}=3\\sqrt3$，再合并。"}, {"id": "c", "text": "$13\\sqrt3$", "feedback": "根号外的系数应是 $\\sqrt4=2$、$\\sqrt9=3$，不是 $4$、$9$。"}, {"id": "d", "text": "$5\\sqrt6$", "feedback": "合并时根号外系数相加，被开方数 $3$ 保持不变。"}], "correct": "b", "answer": "$5\\sqrt3$", "reasoning": ["$\\sqrt{12}=2\\sqrt3$，$\\sqrt{27}=3\\sqrt3$。", "$2\\sqrt3+3\\sqrt3=(2+3)\\sqrt3=5\\sqrt3$。"], "contentVersion": "sha256:156a196af56a22582a48a04343ad0f1c8a44d49aa914d5cc36b747b7f5c0c1f9"}, {"id": "j19-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j19-2"], "pointIds": ["pyjh.rad.011", "pyjh.rad.009"], "prompt": "化简 $\\frac6{\\sqrt3}$，使分母中不含二次根式，结果是哪一项？", "options": [{"id": "a", "text": "$6\\sqrt3$", "feedback": "分子、分母同乘 $\\sqrt3$ 后，分母变成 $3$，还要约分。"}, {"id": "b", "text": "$2$", "feedback": "$\\sqrt3$ 不等于 $3$，不能把分母当成 $3$ 直接相除。"}, {"id": "c", "text": "$\\sqrt2$", "feedback": "$6$ 不在根号内，不能写成 $\\sqrt{\\frac63}$。"}, {"id": "d", "text": "$2\\sqrt3$", "feedback": "分子、分母同乘 $\\sqrt3$：$\\frac{6\\sqrt3}3$，再约分。"}], "correct": "d", "answer": "$2\\sqrt3$", "reasoning": ["分子、分母同乘 $\\sqrt3$：$\\frac6{\\sqrt3}=\\frac{6\\sqrt3}{\\sqrt3\\times\\sqrt3}=\\frac{6\\sqrt3}3$。", "约分得 $2\\sqrt3$。"], "contentVersion": "sha256:c3e5febe454e3df4b3e9c438c7f0595797245c4f7239bbbe4d32cddc831df025"}, {"id": "j19-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j19-1"], "pointIds": ["pyjh.rad.003"], "prompt": "若 $\\sqrt{a-2}+(b+3)^2=0$，则 $a-b$ 的值是多少？", "options": [{"id": "a", "text": "$-1$", "feedback": "由 $b+3=0$ 得 $b=-3$，符号别弄反。"}, {"id": "b", "text": "$1$", "feedback": "由 $a-2=0$ 得 $a=2$，不是 $-2$。"}, {"id": "c", "text": "$-5$", "feedback": "求的是 $a-b$，不是 $b-a$。"}, {"id": "d", "text": "$5$", "feedback": "两个非负数之和为 $0$，则每个都为 $0$：$a=2$，$b=-3$。"}], "correct": "d", "answer": "$5$", "reasoning": ["$\\sqrt{a-2}\\ge0$，$(b+3)^2\\ge0$，两者之和为 $0$，所以两者都等于 $0$。", "$a-2=0$，$b+3=0$，得 $a=2$，$b=-3$。", "$a-b=2-(-3)=5$。"], "contentVersion": "sha256:306e3fac11c38c224d8d7d923386d8f1e3678d2e8b21aa7c0364dc4e5921f51f"}, {"id": "j19-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j19-3"], "pointIds": ["pyjh.rad.015", "pyjh.poly.012"], "prompt": "计算 $(\\sqrt3-1)^2$，结果是哪一项？", "options": [{"id": "a", "text": "$2$", "feedback": "$(a-b)^2\\ne a^2-b^2$，要用完全平方公式。"}, {"id": "b", "text": "$4$", "feedback": "漏掉了中间项 $-2\\times\\sqrt3\\times1$。"}, {"id": "c", "text": "$4-\\sqrt3$", "feedback": "中间项是 $-2ab$，系数 $2$ 不能丢。"}, {"id": "d", "text": "$4-2\\sqrt3$", "feedback": "按完全平方公式展开：$3-2\\sqrt3+1$。"}], "correct": "d", "answer": "$4-2\\sqrt3$", "reasoning": ["由完全平方公式，$(\\sqrt3-1)^2=(\\sqrt3)^2-2\\times\\sqrt3\\times1+1^2$。", "$=3-2\\sqrt3+1=4-2\\sqrt3$。"], "contentVersion": "sha256:7648d553f2b65f250e4885bac0b567794544e65bb0e0f3064a1a75a3db03d4cf"}, {"id": "j19-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j19-1"], "pointIds": ["pyjh.rad.006", "pyjh.rad.002"], "prompt": "使 $\\sqrt{18-n}$ 的值为整数的正整数 $n$ 共有几个？", "options": [{"id": "a", "text": "$3$ 个", "feedback": "被开方数可以是 $0$ 到 $18$ 之间的任何完全平方数，不要漏掉 $0$ 和 $16$。"}, {"id": "b", "text": "$4$ 个", "feedback": "$\\sqrt0=0$ 也是整数，被开方数等于 $0$ 的情形不能漏。"}, {"id": "c", "text": "$5$ 个", "feedback": "$18-n$ 取 $0,1,4,9,16$，逐一对应出正整数 $n$。"}, {"id": "d", "text": "$2$ 个", "feedback": "被开方数不必很大，$1$、$4$ 等较小的完全平方数也要考虑。"}], "correct": "c", "answer": "$5$ 个", "reasoning": ["$\\sqrt{18-n}$ 为整数，需要 $18-n$ 是完全平方数，且 $18-n\\ge0$；又 $n\\ge1$，所以 $0\\le18-n\\le17$。", "$18-n$ 可取 $0,1,4,9,16$，对应 $n=18,17,14,9,2$。", "共 $5$ 个。"], "contentVersion": "sha256:6b90d66e37922109acd5948d97313afa570f2c798481b472c0b8f4d90499a5c1"}, {"id": "j19-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j19-3"], "pointIds": ["pyjh.rad.016", "pyjh.rad.015"], "prompt": "已知 $x=\\sqrt3+1$，$y=\\sqrt3-1$，求 $x^2+xy+y^2$ 的值。", "options": [{"id": "a", "text": "$8$", "feedback": "这是 $x^2+y^2$ 的值，还要加上 $xy$。"}, {"id": "b", "text": "$10$", "feedback": "先求 $x+y=2\\sqrt3$，$xy=2$，再整体代入 $(x+y)^2-xy$。"}, {"id": "c", "text": "$12$", "feedback": "$(x+y)^2=x^2+2xy+y^2$，比所求式多了一个 $xy$，要减去。"}, {"id": "d", "text": "$14$", "feedback": "$x^2+xy+y^2=(x+y)^2-xy$，是减去 $xy$，不是加上。"}], "correct": "b", "answer": "$10$", "reasoning": ["$x+y=2\\sqrt3$，$xy=(\\sqrt3+1)(\\sqrt3-1)=3-1=2$。", "$x^2+xy+y^2=(x+y)^2-xy=(2\\sqrt3)^2-2=12-2=10$。"], "contentVersion": "sha256:823e3315053e52cae6d122598a48afa15b905cdf234c3f5bc06ad9ffdd3c0864"}, {"id": "j19-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j19-2", "j19-3"], "pointIds": ["pyjh.rad.014", "pyjh.rad.009", "pyjh.rad.013"], "prompt": "计算 $\\sqrt{48}\\div\\sqrt3-\\sqrt{\\frac12}\\times\\sqrt{12}+\\sqrt{24}$，结果是哪一项？", "options": [{"id": "a", "text": "$4+\\sqrt6$", "feedback": "先算乘除，再算加减：$4-\\sqrt6+2\\sqrt6$。"}, {"id": "b", "text": "$4+3\\sqrt6$", "feedback": "中间一项前面是减号，$\\sqrt{\\frac12}\\times\\sqrt{12}=\\sqrt6$ 要减去。"}, {"id": "c", "text": "$5\\sqrt6$", "feedback": "$4$ 与 $\\sqrt6$ 不能合并，结果保留两项。"}, {"id": "d", "text": "$16+\\sqrt6$", "feedback": "$\\sqrt{48}\\div\\sqrt3=\\sqrt{16}$，还要开平方。"}], "correct": "a", "answer": "$4+\\sqrt6$", "reasoning": ["先算乘除：$\\sqrt{48}\\div\\sqrt3=\\sqrt{16}=4$，$\\sqrt{\\frac12}\\times\\sqrt{12}=\\sqrt6$，$\\sqrt{24}=2\\sqrt6$。", "再算加减：$4-\\sqrt6+2\\sqrt6=4+\\sqrt6$。"], "contentVersion": "sha256:ee71fbe7c2f4a43a667cf1c2075ee4c0ca9deaccb1f3050e8826dbf9e82de72e"}, {"id": "j19-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j19-2"], "pointIds": ["pyjh.rad.012", "pyjh.rad.008", "pyjh.rad.007"], "prompt": "一个长方形的长为 $\\sqrt{32}\\ \\text{cm}$，宽为 $\\sqrt{18}\\ \\text{cm}$。一个正方形与这个长方形的面积相等，这个正方形的周长是多少厘米？", "options": [{"id": "a", "text": "$14\\sqrt2$", "feedback": "这是长方形的周长；要先求面积，再求正方形的边长。"}, {"id": "b", "text": "$2\\sqrt6$", "feedback": "这是正方形的边长，周长还要乘 $4$。"}, {"id": "c", "text": "$96$", "feedback": "正方形的边长是面积的算术平方根，不是面积本身。"}, {"id": "d", "text": "$8\\sqrt6$", "feedback": "面积 $\\sqrt{32}\\times\\sqrt{18}=24$，边长 $\\sqrt{24}=2\\sqrt6$，再乘 $4$。"}], "correct": "d", "answer": "$8\\sqrt6$", "reasoning": ["长方形面积：$\\sqrt{32}\\times\\sqrt{18}=\\sqrt{576}=24$（$\\text{cm}^2$）。", "正方形边长：$\\sqrt{24}=2\\sqrt6$（$\\text{cm}$）。", "正方形周长：$4\\times2\\sqrt6=8\\sqrt6$（$\\text{cm}$）。"], "contentVersion": "sha256:32ee001600b361ef8afd23d0be26508ae9dda265b8c2062bd86bdfb19f678a8d"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
