<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 13 章 三角形 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j13-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 13 章 三角形 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j13-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j13-test", "sectionId": "j13-test", "chapterId": "j13", "title": "第 13 章 三角形 · 章末测验", "label": "章末测验", "sections": ["j13-1", "j13-2", "j13-3"], "items": [{"id": "j13-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j13-1"], "pointIds": ["pyjh.tri.002"], "prompt": "关于三角形的分类，下列说法正确的是哪一项？", "options": [{"id": "a", "text": "等边三角形不是等腰三角形", "feedback": "等边三角形三条边都相等，当然有两条边相等，它是特殊的等腰三角形。"}, {"id": "b", "text": "三角形按边分类，可以分为三边都不相等的三角形和等腰三角形", "feedback": "按边看只有两种情况：有两边相等（等腰三角形，含等边三角形）或三边都不相等。"}, {"id": "c", "text": "直角三角形不可能是等腰三角形", "feedback": "两条直角边相等的直角三角形就是等腰直角三角形。"}, {"id": "d", "text": "一个三角形中最多可以有两个钝角", "feedback": "两个钝角的和已经大于 $180^\\circ$，而三角形内角和是 $180^\\circ$，所以最多只有一个钝角。"}], "correct": "b", "answer": "三角形按边分类，可以分为三边都不相等的三角形和等腰三角形", "reasoning": ["按边分类：三边都不相等的三角形、等腰三角形；等边三角形是底和腰相等的特殊等腰三角形。", "等腰直角三角形既是直角三角形又是等腰三角形；三角形最多有一个钝角。所以按边分类的说法正确，其余三种说法都不对。"], "contentVersion": "sha256:32a85187068a3da5927eb7d541912722b607bbf3076e494e89003c45e89969e2"}, {"id": "j13-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j13-2"], "pointIds": ["pyjh.tri.005", "pyjh.tri.004"], "prompt": "下列每组数分别是三根小木棒的长度（单位：$\\text{cm}$），用它们首尾相接，能摆成三角形的是哪一组？", "options": [{"id": "a", "text": "$2$，$3$，$5$", "feedback": "$2+3=5$，两边之和等于第三边，三根木棒会摆成一条线段。"}, {"id": "b", "text": "$3$，$4$，$8$", "feedback": "$3+4=7<8$，较短两边之和小于最长边，接不拢。"}, {"id": "c", "text": "$4$，$5$，$6$", "feedback": "较短两边之和 $4+5=9>6$，满足任意两边之和大于第三边。"}, {"id": "d", "text": "$1$，$2$，$4$", "feedback": "$1+2=3<4$，较短两边之和小于最长边，接不拢。"}], "correct": "c", "answer": "$4$，$5$，$6$", "reasoning": ["三角形任意两边之和大于第三边；实际判断时只要看较短两边之和是否大于最长边。", "只有 $4+5>6$ 成立，其余三组较短两边之和都不大于最长边。"], "contentVersion": "sha256:207b69d21742bf8f1821acb2968bf4a25d3cc0a3ef0ce9f52dfd83aab1544564"}, {"id": "j13-test-03-v2", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j13-1"], "pointIds": ["pyjh.tri.003", "pyjh.tri.001"], "prompt": "在 $\\triangle ABC$ 中，点 $D$，$E$ 在边 $BC$ 上，按 $B$，$D$，$E$，$C$ 的顺序排列，连接 $AD$，$AE$。图中一共有多少个三角形？", "options": [{"id": "a", "text": "$3$ 个", "feedback": "只数了 $\\triangle ABD$，$\\triangle ADE$，$\\triangle AEC$ 这三个小三角形，漏了由几部分合成的三角形。"}, {"id": "b", "text": "$4$ 个", "feedback": "只多数了一个大三角形，$\\triangle ABE$，$\\triangle ADC$ 这类由两部分组成的三角形也要数。"}, {"id": "c", "text": "$5$ 个", "feedback": "有些由相邻小三角形合成的三角形容易漏数，可以按底边的两个端点有序检查。"}, {"id": "d", "text": "$6$ 个", "feedback": "每个三角形都以 $A$ 为顶点、以 $BC$ 上的一条线段为底边，这样的线段有 $6$ 条。"}], "correct": "d", "answer": "$6$ 个", "reasoning": ["图中所有三角形都以 $A$ 为一个顶点，另两个顶点在 $BC$ 上，所以只要数 $B$，$D$，$E$，$C$ 中两点组成的线段。", "这样的线段有 $BD$，$BE$，$BC$，$DE$，$DC$，$EC$，共 $4\\times3\\div2=6$ 条，对应 $6$ 个三角形。"], "contentVersion": "sha256:fa481a811217efdbb88f159dad339772c77b8b6b277439fa32e710465c3df4ac"}, {"id": "j13-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j13-1", "j13-3"], "pointIds": ["pyjh.tri.009", "pyjh.tri.002"], "prompt": "在 $\\triangle ABC$ 中，$\\angle A:\\angle B:\\angle C=1:2:3$，那么 $\\angle C$ 是多少度？", "options": [{"id": "a", "text": "$30^\\circ$", "feedback": "这是最小的角 $\\angle A$。"}, {"id": "b", "text": "$60^\\circ$", "feedback": "这是 $\\angle B$，题目求的是 $\\angle C$。"}, {"id": "c", "text": "$90^\\circ$", "feedback": "三个角共 $6$ 份，和为 $180^\\circ$，每份 $30^\\circ$，$\\angle C$ 占 $3$ 份。"}, {"id": "d", "text": "$120^\\circ$", "feedback": "把三个角的和当成了 $240^\\circ$；三角形内角和是 $180^\\circ$。"}], "correct": "c", "answer": "$90^\\circ$", "reasoning": ["设 $\\angle A=x^\\circ$，则 $\\angle B=2x^\\circ$，$\\angle C=3x^\\circ$。", "由内角和定理，$x+2x+3x=180$，$x=30$，所以 $\\angle C=90^\\circ$，这是一个直角三角形。"], "contentVersion": "sha256:abc61fa0c767d205243629c8116efd24639359ec21068ee91eac60a37c33fb5e"}, {"id": "j13-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j13-3"], "pointIds": ["pyjh.tri.011"], "prompt": "三角形的一个外角是 $110^\\circ$，与它不相邻的一个内角是 $40^\\circ$，与它不相邻的另一个内角是多少度？", "options": [{"id": "a", "text": "$30^\\circ$", "feedback": "用 $180^\\circ$ 减去了 $110^\\circ$ 和 $40^\\circ$，把外角当成了内角。"}, {"id": "b", "text": "$70^\\circ$", "feedback": "三角形的一个外角等于与它不相邻的两个内角的和。"}, {"id": "c", "text": "$150^\\circ$", "feedback": "外角等于两个不相邻内角的和，应当相减求另一个内角，不是相加。"}, {"id": "d", "text": "$140^\\circ$", "feedback": "这是 $180^\\circ-40^\\circ$，与外角无关。"}], "correct": "b", "answer": "$70^\\circ$", "reasoning": ["三角形的外角等于与它不相邻的两个内角的和。", "另一个内角为 $110^\\circ-40^\\circ=70^\\circ$。"], "contentVersion": "sha256:7767f35cdaa0eddcc7ea107230319a8b4f7c0ce8bc41c03058cbc37c68b5c1ef"}, {"id": "j13-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j13-1", "j13-2"], "pointIds": ["pyjh.tri.005", "pyjh.tri.002"], "prompt": "一个等腰三角形的两边长分别是 $4\\,\\text{cm}$ 和 $9\\,\\text{cm}$，它的周长是多少？", "options": [{"id": "a", "text": "$17\\,\\text{cm}$", "feedback": "腰长为 $4\\,\\text{cm}$ 时，$4+4<9$，不能组成三角形，要舍去。"}, {"id": "b", "text": "$22\\,\\text{cm}$", "feedback": "腰只能是 $9\\,\\text{cm}$：三边 $9$，$9$，$4$ 满足三边关系。"}, {"id": "c", "text": "$17\\,\\text{cm}$ 或 $22\\,\\text{cm}$", "feedback": "分类后还要用三边关系检验，腰长为 $4\\,\\text{cm}$ 的情况组不成三角形。"}, {"id": "d", "text": "$13\\,\\text{cm}$", "feedback": "等腰三角形有三条边，这里只加了两条。"}], "correct": "b", "answer": "$22\\,\\text{cm}$", "reasoning": ["分两种情况：腰长 $4\\,\\text{cm}$ 或腰长 $9\\,\\text{cm}$。", "腰长 $4\\,\\text{cm}$ 时，三边为 $4$，$4$，$9$，$4+4<9$，不能组成三角形。", "腰长 $9\\,\\text{cm}$ 时，三边为 $9$，$9$，$4$，能组成三角形，周长 $9+9+4=22$（cm）。"], "contentVersion": "sha256:1dcd7125f427b53f231fbefeefcc7fdccc42028178a8d98fde43ab803b516843"}, {"id": "j13-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j13-2"], "pointIds": ["pyjh.tri.005"], "prompt": "一个三角形的两边长分别是 $3$ 和 $7$，第三边的长是偶数，第三边的长有几种可能？", "options": [{"id": "a", "text": "$1$ 种", "feedback": "$4<x<10$ 中的偶数不止一个。"}, {"id": "b", "text": "$2$ 种", "feedback": "第三边 $x$ 满足 $7-3<x<7+3$，即 $4<x<10$，其中偶数是 $6$ 和 $8$。"}, {"id": "c", "text": "$3$ 种", "feedback": "第三边要大于两边之差、小于两边之和，端点 $4$ 和 $10$ 都不能取。"}, {"id": "d", "text": "$5$ 种", "feedback": "$5$，$6$，$7$，$8$，$9$ 是所有整数，题目还要求是偶数。"}], "correct": "b", "answer": "$2$ 种", "reasoning": ["设第三边长为 $x$，由三边关系，$7-3<x<7+3$，即 $4<x<10$。", "其中的偶数只有 $6$ 和 $8$，所以有 $2$ 种可能。"], "contentVersion": "sha256:5542a89c688d4de6f8b2a5360ad16a59f1d3d5ccf4a1f678ccbcb7d54599d7f6"}, {"id": "j13-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j13-2"], "pointIds": ["pyjh.tri.006"], "prompt": "在 $\\triangle ABC$ 中，$AD$ 是 $BC$ 边上的中线，$AB=8\\,\\text{cm}$，$AC=5\\,\\text{cm}$。$\\triangle ABD$ 的周长比 $\\triangle ACD$ 的周长多多少？", "options": [{"id": "a", "text": "$3\\,\\text{cm}$", "feedback": "两个三角形都含 $AD$，又 $BD=CD$，周长差就是 $AB$ 与 $AC$ 的差。"}, {"id": "b", "text": "$13\\,\\text{cm}$", "feedback": "这是 $AB+AC$，周长差要相减。"}, {"id": "c", "text": "$0\\,\\text{cm}$", "feedback": "中线把 $BC$ 分成相等的两段，但 $AB$ 与 $AC$ 不相等，周长不同。"}, {"id": "d", "text": "$1.5\\,\\text{cm}$", "feedback": "中线平分的是边 $BC$，不会把 $AB$ 与 $AC$ 的差再减半。"}], "correct": "a", "answer": "$3\\,\\text{cm}$", "reasoning": ["$AD$ 是中线，所以 $BD=CD$。", "两个周长之差 $(AB+BD+AD)-(AC+CD+AD)=AB-AC=8-5=3$（cm）。"], "contentVersion": "sha256:161ece245e4e951e84904f42e54c52644451fe3a5c8c7cfbddb3e416734b29b6"}, {"id": "j13-test-09-v2", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j13-3"], "pointIds": ["pyjh.tri.010"], "prompt": "一个直角三角形的两个锐角相差 $20^\\circ$，较小的锐角是多少度？", "options": [{"id": "a", "text": "$35^\\circ$", "feedback": "两锐角互余，和为 $90^\\circ$，再由和与差求较小的角。"}, {"id": "b", "text": "$55^\\circ$", "feedback": "这是较大的锐角。"}, {"id": "c", "text": "$80^\\circ$", "feedback": "直角三角形两个锐角的和是 $90^\\circ$，不是 $180^\\circ$。"}, {"id": "d", "text": "$70^\\circ$", "feedback": "这里把和减去差所得的中间量当成了较小角，和差关系还没有处理完。"}], "correct": "a", "answer": "$35^\\circ$", "reasoning": ["直角三角形的两个锐角互余。设较小锐角为 $x^\\circ$，较大锐角为 $(x+20)^\\circ$。", "$x+(x+20)=90$，$x=35$。检验：$35^\\circ+55^\\circ=90^\\circ$，相差 $20^\\circ$。"], "contentVersion": "sha256:f6287aac06808c5ac1984be261efed9d8191ba1860537bd1a4195bd2a6adfacf"}, {"id": "j13-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j13-2", "j13-3"], "pointIds": ["pyjh.tri.012", "pyjh.tri.006", "pyjh.tri.010"], "prompt": "在 $\\triangle ABC$ 中，$\\angle B=40^\\circ$，$\\angle C=70^\\circ$，$AD$ 是 $BC$ 边上的高，$AE$ 是 $\\angle BAC$ 的平分线，点 $D$，$E$ 都在 $BC$ 上。$\\angle DAE$ 是多少度？", "options": [{"id": "a", "text": "$35^\\circ$", "feedback": "这是 $\\angle BAE$，还要和 $\\angle BAD$ 比较求差。"}, {"id": "b", "text": "$20^\\circ$", "feedback": "这是 $\\angle CAD$，$AE$ 与 $AD$ 的夹角还要再算。"}, {"id": "c", "text": "$15^\\circ$", "feedback": "$\\angle BAD=50^\\circ$，$\\angle BAE=35^\\circ$，两者之差就是 $\\angle DAE$。"}, {"id": "d", "text": "$50^\\circ$", "feedback": "这是 $\\angle BAD$，没有减去 $\\angle BAE$。"}], "correct": "c", "answer": "$15^\\circ$", "reasoning": ["$\\angle BAC=180^\\circ-40^\\circ-70^\\circ=70^\\circ$，$AE$ 平分 $\\angle BAC$，所以 $\\angle BAE=35^\\circ$。", "$AD\\perp BC$，在 $\\mathrm{Rt}\\triangle ABD$ 中，$\\angle BAD=90^\\circ-40^\\circ=50^\\circ$。", "$\\angle DAE=\\angle BAD-\\angle BAE=50^\\circ-35^\\circ=15^\\circ$。"], "contentVersion": "sha256:e7bef3db70a9e9fdcea90e8222355d7e0166b61399a9f01f85e54d8fc5e5da1b"}, {"id": "j13-test-11-v2", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j13-3"], "pointIds": ["pyjh.tri.012", "pyjh.tri.011"], "prompt": "在 $\\triangle ABC$ 中，$\\angle A=70^\\circ$，延长 $BC$ 到点 $E$，$BD$ 平分 $\\angle ABC$，$CD$ 平分 $\\angle ACE$，$BD$ 与 $CD$ 交于点 $D$。$\\angle D$ 是多少度？", "options": [{"id": "a", "text": "$70^\\circ$", "feedback": "把原三角形的角直接当成了角平分线形成的夹角，忽略了平分带来的变化。"}, {"id": "b", "text": "$35^\\circ$", "feedback": "$\\angle ACE=\\angle A+\\angle ABC$，两边同时取一半，再在 $\\triangle BCD$ 中用外角推论。"}, {"id": "c", "text": "$125^\\circ$", "feedback": "这是两条内角平分线的夹角 $90^\\circ+\\frac12\\angle A$，这里 $CD$ 平分的是外角。"}, {"id": "d", "text": "$55^\\circ$", "feedback": "混用了不同角平分线构型的公式；这里一条平分内角，另一条平分外角，应重新用外角关系列式。"}], "correct": "b", "answer": "$35^\\circ$", "reasoning": ["$\\angle ACE$ 是 $\\triangle ABC$ 的外角：$\\angle ACE=\\angle A+\\angle ABC$。", "$\\angle DCE$ 是 $\\triangle BCD$ 的外角：$\\angle DCE=\\angle D+\\angle DBC$。", "由角平分线，$\\angle DCE=\\frac12\\angle ACE$，$\\angle DBC=\\frac12\\angle ABC$，代入得 $\\angle D=\\frac12\\angle A=35^\\circ$。"], "contentVersion": "sha256:5010ee072c18edde12be25f114f25ef4a8ace12f00e6b7856624c17e72bf1e1e"}, {"id": "j13-test-12-v2", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j13-2"], "pointIds": ["pyjh.tri.007", "pyjh.tri.006"], "prompt": "在 $\\triangle ABC$ 中，$D$ 是 $BC$ 的中点，$E$ 是 $AD$ 的中点，$F$ 是 $CE$ 的中点，连接 $BE$，$BF$。$\\triangle ABC$ 的面积是 $16$，$\\triangle BEF$ 的面积是多少？", "options": [{"id": "a", "text": "$4$", "feedback": "$\\triangle BEC$ 的面积是 $8$，$BF$ 是它的中线，把它分成面积相等的两部分。"}, {"id": "b", "text": "$2$", "feedback": "把不同分支上的折半连续相乘了；先检查目标三角形是否由两个分支的面积合并而成。"}, {"id": "c", "text": "$8$", "feedback": "这里求到的是中间三角形的面积，还没有继续处理目标三角形所在的分割。"}, {"id": "d", "text": "$1$", "feedback": "中线分出的面积属于不同分支，不能沿一条路径连续折半；应先理清哪些面积需要相加。"}], "correct": "a", "answer": "$4$", "reasoning": ["$AD$ 是 $\\triangle ABC$ 的中线，$S_{\\triangle ABD}=S_{\\triangle ACD}=8$。", "$BE$，$CE$ 分别是 $\\triangle ABD$，$\\triangle ACD$ 的中线，$S_{\\triangle BED}=S_{\\triangle CED}=4$，所以 $S_{\\triangle BEC}=8$。", "$BF$ 是 $\\triangle BEC$ 的中线，$S_{\\triangle BEF}=\\frac12\\times8=4$。"], "contentVersion": "sha256:be5fe49c17032d283c5cbfad92df6b47f57d4a192ad6e0fc182b8810d22ffa4d"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
