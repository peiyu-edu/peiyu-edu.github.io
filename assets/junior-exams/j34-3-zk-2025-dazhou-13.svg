<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 464" width="326" height="464" role="img" aria-labelledby="title desc">
<title id="title">圆锥及其侧面展开图</title>
<desc id="desc">左下方是一个圆锥，底面圆画成虚线椭圆，圆心有一个点，并有一条过圆心的虚线直径。从圆锥一条母线所在位置向右上方展开成一个扇形，扇形以圆锥顶点为圆心，半径等于母线，弧的一端接在底面圆右端。图中没有标字母和数字。</desc>
