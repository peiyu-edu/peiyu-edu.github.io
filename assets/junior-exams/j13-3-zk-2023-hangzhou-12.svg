<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270" role="img" aria-labelledby="title desc">
<title id="title">三角形 ABC 与 BC 的延长线</title>
<desc id="desc">△ABC，A 在上方，BC 水平。点 D 在边 AB 上，点 E 在边 AC 上，连接 DE。边 BC 向右延长到点 F。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="560" height="270" fill="white"/>
<line x1="45.0" y1="225.0" x2="349.0" y2="63.3" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="349.0" y1="63.3" x2="435.0" y2="225.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="45.0" y1="225.0" x2="525.0" y2="225.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="166.6" y1="160.3" x2="400.6" y2="160.3" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="349.0" y="55.3" class="l" text-anchor="middle">A</text>
<text x="25.0" y="235.0" class="l" text-anchor="middle">B</text>
<text x="431.0" y="261.0" class="l" text-anchor="middle">C</text>
<text x="525.0" y="261.0" class="l" text-anchor="middle">F</text>
<text x="158.6" y="148.3" class="l" text-anchor="middle">D</text>
<text x="424.6" y="168.3" class="l" text-anchor="middle">E</text>
</svg>
