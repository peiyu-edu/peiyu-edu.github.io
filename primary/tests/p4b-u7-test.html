one;stroke:var(--muted);stroke-width:2\" /><path d=\"M50,135 L250,135\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><rect x=\"90\" y=\"75\" width=\"60\" height=\"40\" style=\"fill:none;stroke:var(--a);stroke-width:1.5\" /><text x=\"150\" y=\"185\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">已知：向右平移 6 格<\/text><\/svg>"}, {"id": "p4b-u7-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "把一个图形凸出来的一块剪下，平移到另一边的缺口里，正好拼成一个长方形。图形的面积有什么变化？", "answer": "面积不变", "reasoning": ["平移只改变位置，不改变大小。", "剪下的那块还在图形里，所以面积不变。"], "options": [{"id": "a", "text": "面积变小了", "feedback": "剪下的那块又贴回去了，没有扔掉。"}, {"id": "b", "text": "面积变大了", "feedback": "没有添上新的部分，面积不会变大。"}, {"id": "c", "text": "面积不变", "feedback": "对。剪下的那块只是换了位置，没有多也没有少。"}], "correct": "c", "pointIds": ["pyps.p4b.u7.003"], "contentVersion": "sha256:49932b6a3c92aa010b32bd28d0570fbf14fb14f3cece289966962f284dc2c4aa", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 225\" role=\"img\" aria-label=\"上方凸出块和下方缺口大小相同，尚未完成平移\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"45,160 145,160 145,125 195,125 195,160 245,160 245,65 195,65 195,30 145,30 145,65 45,65\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><path d=\"M145,65 L195,65\" style=\"fill:none;stroke:var(--b);stroke-width:2;stroke-dasharray:5 4\" /><path d=\"M170,80 V110\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"150\" y=\"200\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">把凸出的一块移进缺口<\/text><\/svg>"}, {"id": "p4b-u7-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "方格纸上的对称轴是一条竖线。左半边图形是这样画的：从对称轴上一点出发，向左画 3 格，再向上画 2 格，再向右画 3 格回到对称轴上。补全这个轴对称图形后，整个图形是什么形状？长几格、宽几格？", "answer": "长方形，长 6 格、宽 2 格", "reasoning": ["左半边是一个靠着对称轴、横 3 格竖 2 格的长方形的三条边。", "右半边对称地补出横 3 格竖 2 格的另一半。", "合起来是一个长方形，长 3 + 3 = 6（格），宽 2 格。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u7.001"], "contentVersion": "sha256:173ac618c1a41eb11868a60f76330995a382f4acc4d7ecdba01aeb23142d9ada", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 220\" role=\"img\" aria-label=\"只画已知左半边，从轴向左三格向上两格再向右三格\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M30,35 L30,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M50,35 L50,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M70,35 L70,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M90,35 L90,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M110,35 L110,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M130,35 L130,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M150,35 L150,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M170,35 L170,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M190,35 L190,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M210,35 L210,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M230,35 L230,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M250,35 L250,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M270,35 L270,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M30,35 L270,35\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M30,55 L270,55\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M30,75 L270,75\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M30,95 L270,95\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M30,115 L270,115\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M30,135 L270,135\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M30,155 L270,155\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><path d=\"M150,25 L150,165\" style=\"fill:none;stroke:var(--b);stroke-width:2;stroke-dasharray:5 4\" /><path d=\"M150,135 H90 V95 H150\" style=\"fill:none;stroke:var(--a);stroke-width:2\" /><text x=\"150\" y=\"195\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">虚线为对称轴<\/text><\/svg>"}, {"id": "p4b-u7-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个长方形长 8 厘米、宽 5 厘米。在上边中间剪去一个三角形，把它平移到下边正对着的位置贴上（尖朝下）。新图形的面积是多少平方厘米？", "answer": "40 平方厘米", "reasoning": ["剪去的三角形平移后又贴上了，面积没有少。", "新图形的面积等于原来长方形的面积：8 × 5 = 40（平方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u7.003"], "contentVersion": "sha256:ac0a32f8ba45e65ccdbe72ae310b6d418d423e3ccdcbfce8c49359d28186c39f", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 240\" role=\"img\" aria-label=\"长方形上边三角形沿竖直方向平移到下边，尖朝下\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><rect x=\"50\" y=\"50\" width=\"200\" height=\"125\" style=\"fill:none;stroke:var(--fg);stroke-width:1.5\" /><polygon points=\"125,50 175,50 150,90\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><polygon points=\"125,175 175,175 150,215\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><path d=\"M150,95 V165\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"150\" y=\"30\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">8 厘米<\/text><text x=\"275\" y=\"120\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">5 厘米<\/text><\/svg>"}, {"id": "p4b-u7-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "下面哪种运动是平移？", "answer": "电梯从一楼直直地升到五楼", "reasoning": ["平移时物体沿直线移动，方向不改变。", "电梯直直地上升是平移；转动、摆动都不是平移。"], "options": [{"id": "a", "text": "荡秋千", "feedback": "秋千绕着上面的横杆来回摆，不是平移。"}, {"id": "b", "text": "电梯从一楼直直地升到五楼", "feedback": "对。电梯沿直线上升，方向和形状都不变，是平移。"}, {"id": "c", "text": "电风扇的叶片转动", "feedback": "叶片绕着中心转圈，不是平移。"}], "correct": "b", "pointIds": ["pyps.p4b.u7.002"], "contentVersion": "sha256:ece8d43a81128144464dd4dedbf4959f
