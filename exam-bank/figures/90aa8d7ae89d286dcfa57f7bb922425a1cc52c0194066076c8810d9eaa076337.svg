<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 465 465" role="img"><title>程序从k=1、s=1开始，更新s=2s²/(3s−2)，若k≥3则输出，否则k加1后继续。</title><style>svg{color:#172b36;background:#fff}path,rect,circle,ellipse,polygon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}text{fill:currentColor;stroke:none;font-family:"Noto Sans CJK SC",sans-serif}@media(prefers-color-scheme:dark){svg{color:#e5edf1;background:#15212a}}</style><rect x="90" y="15" width="150" height="44" rx="16"/><text x="165.0" y="43.0" font-size="17" text-anchor="middle">开始</text><rect x="75" y="80" width="180" height="44" rx="0"/><text x="165.0" y="108.0" font-size="17" text-anchor="middle">k=1, s=1</text><rect x="65" y="155" width="200" height="44" rx="0"/><text x="165.0" y="183.0" font-size="17" text-anchor="middle">s=2s²/(3s−2)</text><path d="M165.0,235 L240,257.0 L165.0,279 L90,257.0 L165.0,235"/><text x="165.0" y="263.0" font-size="17" text-anchor="middle">k≥3</text><path d="M97,325 L245,325 L233,369 L85,369 L97,325"/><text x="165.0" y="353.0" font-size="17" text-anchor="middle">输出 s</text><rect x="90" y="395" width="150" height="44" rx="16"/><text x="165.0" y="423.0" font-size="17" text-anchor="middle">结束</text><path d="M165,59 L165,80"/><path d="M161,73 L165,80 L169,73"/><path d="M165,124 L165,155"/><path d="M161,148 L165,155 L169,148"/><path d="M165,199 L165,235"/><path d="M161,228 L165,235 L169,228"/><path d="M165,279 L165,325"/><path d="M161,318 L165,325 L169,318"/><path d="M165,369 L165,395"/><path d="M161,388 L165,395 L169,388"/><rect x="300" y="190" width="135" height="44" rx="0"/><text x="367.5" y="218.0" font-size="17" text-anchor="middle">k=k+1</text><path d="M240,257 L368,257 L368,234"/><path d="M368,190 L368,140 L165,140"/><path d="M172,136 L165,140 L172,144"/><text x="282" y="248" font-size="17" text-anchor="middle">否</text><text x="183" y="305" font-size="17" text-anchor="middle">是</text></svg>
