<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img"><title>矩形及对角线</title><desc>矩形ABCD中，AB长2，AD长4，连接对角线AC。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><polygon points="60,60 60,180 300,180 300,60" class=""></polygon><line x1="60" y1="60" x2="300" y2="180" class=""></line><text x="49" y="45">A</text><text x="47" y="208">B</text><text x="313" y="208">C</text><text x="312" y="49">D</text></svg>
