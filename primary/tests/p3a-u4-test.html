<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级上册 第四单元 多位数乘一位数 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p3a-u4-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级上册 第四单元 多位数乘一位数 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3a-u4-test", "sectionId": "p3a-u4-test", "unitId": "p3a-u4", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级上册 第四单元 多位数乘一位数 单元测评", "items": [{"id": "p3a-u4-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "口算：300 × 4 = □；20 × 6 = □", "answer": "1200；120", "reasoning": ["300 × 4：3 个百乘 4 是 12 个百，就是 1200。", "20 × 6：2 个十乘 6 是 12 个十，就是 120。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u4.001"], "contentVersion": "sha256:bd695ef41bb2a3309cb3ef24d3daa77f465ec5123ff76b77543379cc4b681002"}, {"id": "p3a-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "口算：23 × 3 = □", "answer": "69", "reasoning": ["把 23 拆成 20 和 3。", "20 × 3 = 60，3 × 3 = 9，60 + 9 = 69。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u4.002"], "contentVersion": "sha256:af75020dc6d18d53578e34c6637e8eee8621553951997d2d3061c7046c1c786b"}, {"id": "p3a-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：213 × 3", "answer": "639", "reasoning": ["从个位乘起：3 × 3 = 9，写 9。", "十位：1 × 3 = 3，写 3。", "百位：2 × 3 = 6，写 6。得 639。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u4.003"], "contentVersion": "sha256:897431eed89f42ec4f145065bba326c12dd066b72b7c4f6c9abcc7e173eda15d"}, {"id": "p3a-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：46 × 2", "answer": "92", "reasoning": ["个位：6 × 2 = 12，写 2，向十位进 1。", "十位：4 × 2 = 8，再加进位的 1 得 9，写 9。得 92。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u4.004"], "contentVersion": "sha256:11547392ca76f28c32f772078bd793e61e1e5270c96a682adb410964145a4495"}, {"id": "p3a-u4-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "先估一估，再用竖式计算：287 × 3", "answer": "估计约 900；竖式计算得 861", "reasoning": ["估一估：287 接近 300，300 × 3 = 900，得数比 900 小一点。", "个位：7 × 3 = 21，写 1 进 2。十位：8 × 3 = 24，加进位 2 得 26，写 6 进 2。", "百位：2 × 3 = 6，加进位 2 得 8。得 861，和估的 900 差不多。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u4.005"], "contentVersion": "sha256:1f3b52b46ebce7b5af7775f49db0d20cae214e0c080c589d8ecf9b1d7ed10de5"}, {"id": "p3a-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "405 × 6 = ?", "answer": "2430", "reasoning": ["个位：5 × 6 = 30，写 0 进 3。", "十位：0 × 6 = 0，加进位 3 得 3，写 3。", "百位：4 × 6 = 24，写 24。得 2430。"], "options": [{"id": "a", "text": "2430", "feedback": "对。十位上的 0 也要乘 6，0 × 6 = 0，再加个位进上来的 3。"}, {"id": "b", "text": "2400", "feedback": "个位 5 × 6 = 30，要写 0 进 3，十位 0 × 6 再加 3 得 3，不能丢掉进位。"}, {"id": "c", "text": "270", "feedback": "把 405 当成 45 来乘了。中间的 0 占着十位，不能丢。"}], "correct": "a", "pointIds": ["pyps.p3a.u4.006"], "contentVersion": "sha256:8a9c8ab768b08169e15054e6c7ad6ee5dc1a9ce471c2cb1a594663d438cd2129"}, {"id": "p3a-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用简便的方法算：230 × 4", "answer": "920", "reasoning": ["乘数末尾有 0，先算 23 × 4 = 92。", "再在 92 的末尾添上 1 个 0，得 920。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u4.007"], "contentVersion": "sha256:7fe131e2d671fa18e2f5b987f768e758c51c577cba9d8bfcf250568e00172782"}, {"id": "p3a-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪道算式算对了？", "answer": "0 × 8 = 0", "reasoning": ["0 × 8 表示 8 个 0 相加，还是 0。", "0 和任何数相乘都得 0。"], "options": [{"id": "a", "text": "0 × 8 = 0", "feedback": "对。0 和任何数相乘都得 0。"}, {"id": "b", "text": "8 × 0 = 8", "feedback": "8 乘 0 表示 0 个 8，是 0。"}, {"id": "c", "text": "0 × 8 = 8", "feedback": "8 个 0 加起来还是 0，不是 8。"}], "correct": "a", "pointIds": ["pyps.p3a.u4.006"], "contentVersion": "sha256:3b5ee047a6996f0a09545eee7eb9b2d8570b38d5c9c3a82b643f9a29da71fffc"}, {"id": "p3a-u4-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一张门票 48 元。王老师带了 200 元，想买 4 张门票。不用精确计算，估一估钱够不够？", "answer": "够，48 比 50 少，4 张不到 200 元", "reasoning": ["要判断钱够不够，把 48 往大估成 50。", "50 × 4 = 200，往大估都只要 200 元，实际花的钱更少。", "所以 200 元够买 4 张门票。"], "options": [{"id": "a", "text": "估不出来，一定要算出得数", "feedback": "往大估一估就能判断：把 48 看成 50，4 张也只要 200 元。"}, {"id": "b", "text": "不够，4 张要比 200 元多", "feedback": "48 比 50 少，4 张比 200 元少，不会多。"}, {"id": "c", "text": "够，48 比 50 少，4 张不到 200 元", "feedback": "对。往大估成 50 元，50 × 4 = 200，实际花的钱更少，够了。"}], "correct": "c", "pointIds": ["pyps.p3a.u4.008"], "contentVersion": "sha256:d26eebd7abe855518d2d7e3d3739bde7d6510a1761648015d66660bde5879bc4"}, {"id": "p3a-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "学校买了 6 箱牛奶，每箱 24 盒，已经发出去 100 盒。还剩多少盒？", "answer": "24 × 6 − 100 = 44（盒）", "reasoning": ["先求一共有多少盒：24 × 6 = 144（盒）。", "再减去发出去的：144 − 100 = 44（盒）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u4.005", "pyps.p3a.u2.005"], "contentVersion": "sha256:cac592baa1b11e87c289b2603e4ab84a460e989eac60ec77cd1826d10b32a329"}, {"id": "p3a-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一列小火车有 8 节车厢，每节能坐 108 人。这列小火车一共能坐多少人？", "answer": "108 × 8 = 864（人）", "reasoning": ["个位：8 × 8 = 64，写 4 进 6。", "十位：0 × 8 = 0，加进位 6 得 6，写 6。", "百位：1 × 8 = 8，写 8。一共 864 人。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u4.006", "pyps.p3a.u4.005"], "contentVersion": "sha256:3c54206c31589c49cf0b3db4034bac1cc4f41da8ec8cedac8de963da1126bb7f"}], "contentVersion": "sha256:4c0a86260249123ef4b069e6404293cff16c1a269c0177fc803c4c4363cd8a0e"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
