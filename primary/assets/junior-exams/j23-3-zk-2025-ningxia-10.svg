<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 550" width="510" height="550" role="img" aria-labelledby="title desc">
<title id="title">两条直线相交</title>
<desc id="desc">平面直角坐标系中有两条从左下向右上的直线 l1、l2，l1 较陡，l2 较缓，交于第一象限的点 A。从 A 向 y 轴、x 轴各引一条虚线，垂足处分别标 6 和 4。</desc>
