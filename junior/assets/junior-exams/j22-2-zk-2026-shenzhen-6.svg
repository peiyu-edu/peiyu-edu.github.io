<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 295" width="600" height="295" role="img" aria-labelledby="title desc">
<title id="title">无人机距离与时间图象</title>
<desc id="desc">平面直角坐标系，横轴为 t/min，纵轴为 s/km。折线从原点 O 上升到一个最高点，再下降到横轴上的 8 处。最高点向纵轴、横轴各引一条虚线，分别标 3 和 5。</desc>
<style>text { fill:#17202a; font-size:30px; } .i { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .n { font-family:'Times New Roman',Georgia,serif; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect x="0" y="0" width="600" height="295" fill="white"/>
<line x1="30.0" y1="245.0" x2="504.0" y2="245.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><polygon points="519.0,245.0 504.0,251.3 504.0,238.7" fill="#17202a"/><line x1="70.0" y1="265.0" x2="70.0" y2="33.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><polygon points="70.0,18.0 76.3,33.0 63.7,33.0" fill="#17202a"/><polyline points="70.0,245.0 310.0,70.0 454.0,245.0" fill="none" stroke="#17202a" stroke-width="3.5" stroke-linejoin="round"/><line x1="70.0" y1="70.0" x2="310.0" y2="70.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/><line x1="310.0" y1="70.0" x2="310.0" y2="245.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/><text class="n" x="54" y="80" text-anchor="end">3</text><text class="n" x="310" y="283" text-anchor="middle">5</text><text class="n" x="454" y="283" text-anchor="middle">8</text><text class="i" x="50" y="283" text-anchor="middle">O</text><text class="i" x="84" y="40">s<tspan class="n" font-style="normal">/km</tspan></text><text class="i" x="480" y="283">t<tspan class="n" font-style="normal">/min</tspan></text>
</svg>
