<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 470" role="img" aria-labelledby="title desc">
  <title id="title">小正方体堆的三视图</title>
  <desc id="desc">主视图左高2右高3；左视图后排高3前排高2；俯视图四格均占据，前排a、b，后排c、d。字母表示待求堆高。</desc>
  <style>
    :root{--ink:#253930;--fill:#e2eee7;--bg:#fff}text{fill:var(--ink);font:20px sans-serif;text-anchor:middle}path,line,rect{stroke:var(--ink);stroke-width:2;fill:none}.face{fill:var(--fill)}.bg{fill:var(--bg);stroke:none}
    @media(prefers-color-scheme:dark){:root{--ink:#e7eee9;--fill:#243c30;--bg:#15231c}}
  </style>
  <rect class="bg" width="440" height="470"/>
  <text x="98" y="30">主视图</text>
  <path class="face" d="M60 190V114H98V76H136V190Z"/>
  <path d="M98 114V190M60 152H136M98 114H136"/>
  <text x="79" y="102">2</text><text x="117" y="64">3</text>
  <text x="79" y="224">左</text><text x="117" y="224">右</text>
  <text x="318" y="30">左视图</text>
  <path class="face" d="M280 190V76H318V114H356V190Z"/>
  <path d="M318 114V190M280 152H356M280 114H318"/>
  <text x="299" y="64">3</text><text x="337" y="102">2</text>
  <text x="299" y="224">后</text><text x="337" y="224">前</text>
  <text x="206" y="274">俯视图</text>
  <rect class="face" x="150" y="300" width="112" height="112"/>
  <path d="M206 300V412M150 356H262"/>
  <text x="178" y="336">c</text><text x="234" y="336">d</text>
  <text x="178" y="392">a</text><text x="234" y="392">b</text>
  <text x="312" y="336">后排</text><text x="312" y="392">前排</text>
  <text x="220" y="452" style="font-size:18px">每格一列，字母表示堆高</text>
</svg>
