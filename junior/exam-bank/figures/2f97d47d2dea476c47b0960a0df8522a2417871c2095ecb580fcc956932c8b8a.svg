<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">等腰三角形中线与旋转三角形（图1、图2、备用图）</title><desc id="desc">三幅图：都是AB=BC的三角形ABC（A左下、B右下、C右上），O为AC中点，连接OB；三角形DOE由三角形BOC绕O顺时针旋转得到，DE与OA交于M、与AB交于F，OE与AB交于N。图1中OD斜向左下；图2中OD水平向左；备用图同图2，并画出射线BO越过O的延长部分和直线DO越过O向右的延长部分。</desc><style>path,circle,line,polyline,polygon,ellipse,rect{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.cjk{font-family:"Noto Sans CJK SC",sans-serif}.it{font-style:italic}.dash{stroke-dasharray:6 5}.thin{stroke-width:1}.grid{stroke-width:1;stroke-dasharray:4 3;opacity:.6}.dot{fill:currentColor;stroke:none}.solid{fill:currentColor}.shade{fill:currentColor;fill-opacity:.35}.shadenostroke{fill:currentColor;fill-opacity:.35;stroke:none}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M40.00,200.00L213.07,200.00L279.63,40.25Z"/><path d="M159.82,120.12L213.07,200.00"/><path d="M66.54,142.84L193.90,260.03"/><path d="M159.82,120.12L193.90,260.03"/><path d="M159.82,120.12L66.54,142.84"/><text x="28.00" y="220.00" font-size="18" text-anchor="middle" class="it">A</text><text x="221.07" y="220.00" font-size="18" text-anchor="middle" class="it">B</text><text x="287.63" y="32.25" font-size="18" text-anchor="middle" class="it">C</text><text x="157.82" y="108.12" font-size="18" text-anchor="middle" class="it">O</text><text x="52.54" y="136.84" font-size="18" text-anchor="middle" class="it">D</text><text x="199.90" y="280.03" font-size="18" text-anchor="middle" class="it">E</text><text x="91.41" y="195.73" font-size="18" text-anchor="middle" class="it">M</text><text x="124.66" y="220.00" font-size="18" text-anchor="middle" class="it">F</text><text x="199.00" y="220.00" font-size="18" text-anchor="middle" class="it">N</text><text x="159.82" y="335.60" font-size="17" text-anchor="middle" class="cjk">图1</text><path d="M290.00,200.00L463.