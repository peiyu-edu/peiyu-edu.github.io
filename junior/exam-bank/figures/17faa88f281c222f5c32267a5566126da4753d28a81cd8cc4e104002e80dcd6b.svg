<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 345" role="img" aria-labelledby="title desc"><title id="title">最想参加的活动人数条形统计图</title><desc id="desc">纵轴人数，刻度0、18、24、32、36、40；唱歌36、舞蹈24、书法32、绘画18、诵读40，各条顶端有通向纵轴的水平虚线。</desc><style>path,circle,line,polyline,polygon,ellipse{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}.cjk{font-family:"Noto Sans CJK SC",sans-serif;font-style:normal}.n{font-style:normal}.solid{fill:currentColor;stroke:none}.dash{stroke-dasharray:6 5}.thin{stroke-width:1.2}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M70,290L70,20"/><path class="solid" d="M70,14L65,26L75,26Z"/><path d="M70,290L410,290"/><path class="solid" d="M416,290L404,285L404,295Z"/><text x="78" y="26" font-size="16" text-anchor="start" class="cjk">人数/人</text><text x="62" y="187" font-size="14" text-anchor="end" class="n">18</text><text x="62" y="151" font-size="14" text-anchor="end" class="n">24</text><text x="62" y="103" font-size="14" text-anchor="end" class="n">32</text><text x="62" y="79" font-size="14" text-anchor="end" class="n">36</text><text x="62" y="55" font-size="14" text-anchor="end" class="n">40</text><path class="dash thin" d="M70,74L90,74"/><rect x="90" y="74" width="26" height="216" style="fill:currentColor;fill-opacity:.18;stroke:currentColor;stroke-width:1.5"/><text x="103" y="312" font-size="15" text-anchor="middle" class="cjk">唱歌</text><path class="dash thin" d="M70,146L152,146"/><rect x="152" y="146" width="26" height="144" style="fill:currentColor;fill-opacity:.18;stroke:currentColor;stroke-width:1.5"/><text x="165" y="312" font-size="15" text-anchor="middle" class="cjk">舞蹈</text><path class="dash thin" d="M70,98L214,98"/><rect x="214" y="98" width="26" height="192" style="fill:currentColor;fill-opacity:.18;stroke:currentColor;stroke-width:1.5"/><text x="227" y="312" font-size="15" text-anchor="middle" class="cjk">书法</text><path class="dash thin" d="M70,182L276,182"/><rect x="276" y="182" width="26" height="108" style="fill:currentColor;fill-opacity:.18;stroke:currentColor;stroke-width:1.5"/><text x="289" y="312" font-size="15" text-anchor="middle" class="cjk">绘画</text><path class="dash thin" d="M70,50L338,50"/><rect x="338" y="50" width="26" height="240" style="fill:currentColor;fill-opacity:.18;stroke:currentColor;stroke-width:1.5"/><text x="351" y="312" font-size="15" text-anchor="middle" class="cjk">诵读</text><text x="62" y="295" font-size="14" text-anchor="end" class="n">0</text><text x="450" y="312" font-size="14" text-anchor="middle" class="cjk">最想参加</text><text x="450" y="334" font-size="14" text-anchor="middle" class="cjk">的活动</text></svg>
