<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" role="img" aria-labelledby="title desc">
<title id="title">长春站到胜利公园的街道示意图</title>
<desc id="desc">长春市局部街道示意图。上方有长春站，下方有胜利公园及同名地铁站，公园为左下方的绿色区域。深红色的人民大街从长春站竖直向下直达胜利公园，四周还有横竖交错的街道和经过西广场的斜向道路，图中标有四平路、嫩江路、团结路、北京大街。</desc>
