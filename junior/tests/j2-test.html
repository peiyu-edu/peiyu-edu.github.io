<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 2 章 有理数的运算 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=0346bdf6f187"><link rel="stylesheet" href="../assets/learning-shell.css?v=98f4d1951708"><link rel="stylesheet" href="../assets/learning-contrast.css?v=bc8e3f382635"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=9f35dd2cb533"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=5386fbb9fecf"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=e3d4083f037a"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=9e04f871a3b0"></script></head><body data-stage="junior" data-sec="j2-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 2 章 有理数的运算 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j2-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j2-test", "sectionId": "j2-test", "chapterId": "j2", "title": "第 2 章 有理数的运算 · 章末测验", "label": "章末测验", "sections": ["j2-1", "j2-2", "j2-3"], "items": [{"id": "j2-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j2-1"], "pointIds": ["pyjh.rat.008"], "prompt": "计算 $(-8)+5$ 的结果是多少？", "options": [{"id": "a", "text": "$-3$", "feedback": "异号两数相加，取绝对值较大的加数的符号，再用较大的绝对值减去较小的绝对值。"}, {"id": "b", "text": "$3$", "feedback": "符号取错了：绝对值较大的加数是 $-8$。"}, {"id": "c", "text": "$-13$", "feedback": "异号相加应该把绝对值相减，而不是相加。"}, {"id": "d", "text": "$13$", "feedback": "异号相加要相减绝对值，符号也要看绝对值较大的加数。"}], "correct": "a", "answer": "$-3$", "reasoning": ["$-8$ 与 $5$ 异号，$|-8|=8>|5|=5$，结果取负号。", "$8-5=3$，所以 $(-8)+5=-3$。"], "contentVersion": "sha256:5ea92e5adcfe96336aa387bbe130af39fd29dd70364abee3702edef560138158"}, {"id": "j2-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j2-1"], "pointIds": ["pyjh.rat.010"], "prompt": "计算 $3-(-7)$ 的结果是多少？", "options": [{"id": "a", "text": "$10$", "feedback": "减去一个数，等于加上这个数的相反数。"}, {"id": "b", "text": "$-4$", "feedback": "把减法当成了 $3+(-7)$，减数的相反数是 $7$。"}, {"id": "c", "text": "$4$", "feedback": "减去 $-7$ 要变成加 $7$，不是减 $7$ 后取绝对值。"}, {"id": "d", "text": "$-10$", "feedback": "结果的符号错了，$3$ 加上一个正数仍是正数。"}], "correct": "a", "answer": "$10$", "reasoning": ["减去一个数等于加上这个数的相反数：$3-(-7)=3+7$。", "$3+7=10$。"], "contentVersion": "sha256:b0a4eecee7a5c67ba85b0674be62bcd24326ec9333a8c3bc28eec6a8ee28f6f9"}, {"id": "j2-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j2-2"], "pointIds": ["pyjh.rat.016", "pyjh.rat.013"], "prompt": "计算 $(-36)\\div(-4)$ 的结果是多少？", "options": [{"id": "a", "text": "$9$", "feedback": "两数相除，同号得正，并把绝对值相除。"}, {"id": "b", "text": "$-9$", "feedback": "两个负数相除，同号得正。"}, {"id": "c", "text": "$\\frac19$", "feedback": "被除数和除数的位置弄反了。"}, {"id": "d", "text": "$-\\frac19$", "feedback": "位置弄反了，符号也错了。"}], "correct": "a", "answer": "$9$", "reasoning": ["除以 $-4$ 等于乘 $-\\frac14$：$(-36)\\times(-\\frac14)$。", "同号得正，$36\\times\\frac14=9$。"], "contentVersion": "sha256:bafb558392e21a9b9526d3dfb3433145f236043516232e251c96873c3a39c8e4"}, {"id": "j2-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j2-3"], "pointIds": ["pyjh.rat.022", "pyjh.rat.021"], "prompt": "$-2^4$ 的值是多少？", "options": [{"id": "a", "text": "$-16$", "feedback": "没有括号时，乘方只作用在 $2$ 上，前面的负号最后添上。"}, {"id": "b", "text": "$16$", "feedback": "这是 $(-2)^4$ 的值；$-2^4$ 的底数是 $2$。"}, {"id": "c", "text": "$-8$", "feedback": "$2^4$ 表示 $4$ 个 $2$ 相乘，不是 $2\\times4$。"}, {"id": "d", "text": "$8$", "feedback": "乘方不是乘法 $2\\times4$，底数也不是 $-2$。"}], "correct": "a", "answer": "$-16$", "reasoning": ["$-2^4$ 表示 $2^4$ 的相反数，底数是 $2$。", "$2^4=2\\times2\\times2\\times2=16$，所以 $-2^4=-16$。"], "contentVersion": "sha256:4cbd3282a7ce744513747ce53a23a9096501a1061c18f2f4f5c520694a395542"}, {"id": "j2-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j2-3"], "pointIds": ["pyjh.rat.024"], "prompt": "把 $3\\,080\\,000$ 用科学记数法表示，正确的是哪一项？", "options": [{"id": "a", "text": "$3.08\\times10^6$", "feedback": "科学记数法 $a\\times10^n$ 要求 $1\\le|a|<10$，$n$ 等于原数整数位数减 $1$。"}, {"id": "b", "text": "$30.8\\times10^5$", "feedback": "值相等，但 $30.8$ 不满足 $1\\le a<10$。"}, {"id": "c", "text": "$3.08\\times10^5$", "feedback": "$3.08\\times10^5$ 只有六位整数，比原数小。"}, {"id": "d", "text": "$0.308\\times10^7$", "feedback": "值相等，但 $0.308$ 小于 $1$，不符合科学记数法。"}], "correct": "a", "answer": "$3.08\\times10^6$", "reasoning": ["原数有 $7$ 位整数，$n=7-1=6$。", "$a$ 取 $3.08$，满足 $1\\le a<10$，所以写成 $3.08\\times10^6$。"], "contentVersion": "sha256:ba9c2fc611ae3ad4fc04758663c6b847b64c0a5e30083520951fb4c6174cf2d8"}, {"id": "j2-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j2-1"], "pointIds": ["pyjh.rat.011", "pyjh.rat.009"], "prompt": "计算 $(-7)+13+(-5)-(-9)$ 的结果是多少？", "options": [{"id": "a", "text": "$10$", "feedback": "先把减法统一成加法，再把正数、负数分别相加。"}, {"id": "b", "text": "$-8$", "feedback": "$-(-9)$ 应该变成 $+9$，不是 $-9$。"}, {"id": "c", "text": "$4$", "feedback": "漏算了一项，检查一下四项是否都加上了。"}, {"id": "d", "text": "$-10$", "feedback": "符号错了：正数之和比负数之和的绝对值大。"}], "correct": "a", "answer": "$10$", "reasoning": ["统一成加法：$(-7)+13+(-5)+9$。", "正数相加：$13+9=22$；负数相加：$(-7)+(-5)=-12$。", "$22+(-12)=10$。"], "contentVersion": "sha256:1047bf77addc6b3de4a9b9b72de196890c9196b149171dce9332f6054d39c0a7"}, {"id": "j2-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j2-2"], "pointIds": ["pyjh.rat.017", "pyjh.rat.013"], "prompt": "用简便方法计算 $\\left(\\frac12-\\frac23+\\frac34\\right)\\times(-12)$，结果是多少？", "options": [{"id": "a", "text": "$-7$", "feedback": "用分配律把 $-12$ 分别乘括号里的每一项，注意每一项的符号。"}, {"id": "b", "text": "$7$", "feedback": "乘以负数后每一项都要变号，最后的符号错了。"}, {"id": "c", "text": "$-23$", "feedback": "中间一项是 $-\\frac23$，乘 $-12$ 后得正数，不能也记成负数。"}, {"id": "d", "text": "$11$", "feedback": "第一项 $\\frac12\\times(-12)$ 是负数，不能记成正数。"}], "correct": "a", "answer": "$-7$", "reasoning": ["由分配律：$\\frac12\\times(-12)-\\frac23\\times(-12)+\\frac34\\times(-12)$。", "$=-6+8-9=-7$。"], "contentVersion": "sha256:78a2530456a435b0159c19b076d04d707d549c547f61be00f4dd6f40406acf81"}, {"id": "j2-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j2-2", "j2-3"], "pointIds": ["pyjh.rat.023", "pyjh.rat.022", "pyjh.rat.018"], "prompt": "计算 $-1^4-(1-0.5)\\times\\frac13\\times\\left[2-(-3)^2\\right]$，结果是多少？", "options": [{"id": "a", "text": "$\\frac16$", "feedback": "先算乘方，再算括号里的，再乘除，最后加减。"}, {"id": "b", "text": "$\\frac{13}6$", "feedback": "$-1^4$ 的底数是 $1$，值是 $-1$，不是 $1$。"}, {"id": "c", "text": "$-\\frac{17}6$", "feedback": "$(-3)^2$ 是正数 $9$，不是 $-9$。"}, {"id": "d", "text": "$-\\frac{13}6$", "feedback": "方括号里的结果是负数，乘积 $\\frac12\\times\\frac13\\times(-7)$ 前面还有减号，减去负数要变加。"}], "correct": "a", "answer": "$\\frac16$", "reasoning": ["$-1^4=-1$，$(-3)^2=9$，方括号内 $2-9=-7$。", "$(1-0.5)\\times\\frac13\\times(-7)=\\frac12\\times\\frac13\\times(-7)=-\\frac76$。", "原式 $=-1-\\left(-\\frac76\\right)=-1+\\frac76=\\frac16$。"], "contentVersion": "sha256:20b285c431e4198bbbafa71f8a0d73558bffca32cf7de8fce76cbbf644d767b4"}, {"id": "j2-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j2-3"], "pointIds": ["pyjh.rat.025"], "prompt": "近似数 $2.30$ 万精确到哪一位？", "options": [{"id": "a", "text": "百分位", "feedback": "$2.30$ 后面带着单位「万」，要先还原成原来的数再看末位。"}, {"id": "b", "text": "百位", "feedback": "$2.30$ 万 $=23\\,000$，末位的 $0$ 在原数的百位上。"}, {"id": "c", "text": "千位", "feedback": "$2.30$ 末尾的 $0$ 也是有效的，要看最后一位数字。"}, {"id": "d", "text": "个位", "feedback": "要看近似数最后一位数字在原数中的位置，不是原数的最后一位。"}], "correct": "b", "answer": "百位", "reasoning": ["$2.30$ 万 $=2.30\\times10\\,000=23\\,000$。", "近似数最后一位数字 $0$（$2.30$ 的百分位）对应原数的百位，所以精确到百位。"], "contentVersion": "sha256:a34990ab3cfb6cdb5d3050d67d463d522efeb1b91eb70e1a7d78ae9366cf6e7a"}, {"id": "j2-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j2-1", "j2-2"], "pointIds": ["pyjh.rat.012", "pyjh.rat.006", "pyjh.rat.017"], "prompt": "一辆巡逻车下午从岗亭出发，在东西方向的公路上巡逻，规定向东为正。各段行驶记录依次为 $+9$，$-3$，$-5$，$+4$，$-8$，$+6$，$-2$（单位：千米）。若每千米耗油 $0.1$ 升，这一下午共耗油多少升？", "options": [{"id": "a", "text": "$3.7$ 升", "feedback": "耗油与行驶路程有关，与方向无关，要把各段的绝对值相加。"}, {"id": "b", "text": "$0.1$ 升", "feedback": "这是用最后离岗亭的距离算的；向西行驶也耗油。"}, {"id": "c", "text": "$37$ 升", "feedback": "求出了总路程，但还要乘每千米的耗油量。"}, {"id": "d", "text": "$1.9$ 升", "feedback": "只算了向东行驶的路程，向西行驶的路程也要算上。"}], "correct": "a", "answer": "$3.7$ 升", "reasoning": ["总路程是各段的绝对值之和：$9+3+5+4+8+6+2=37$（千米）。", "耗油 $37\\times0.1=3.7$（升）。"], "contentVersion": "sha256:dacda7ed533066b15c86b097ad85010ce598b892fe2136bad01509dcd006e89f"}, {"id": "j2-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j2-2", "j2-3"], "pointIds": ["pyjh.rat.005", "pyjh.rat.015", "pyjh.rat.021", "pyjh.rat.023"], "prompt": "已知 $a$，$b$ 互为相反数，$c$，$d$ 互为倒数，$|m|=2$。求 $m^2-cd+\\frac{a+b}{m}$ 的值。", "options": [{"id": "a", "text": "$3$", "feedback": "互为相反数的两数和为 $0$，互为倒数的两数积为 $1$，$m^2$ 与 $m$ 的符号无关。"}, {"id": "b", "text": "$5$", "feedback": "$cd=1$ 前面是减号，应减去 $1$。"}, {"id": "c", "text": "$-5$", "feedback": "无论 $m=2$ 还是 $m=-2$，$m^2$ 都是正数。"}, {"id": "d", "text": "$1$", "feedback": "$m^2$ 是 $m$ 的平方，不是 $|m|$。"}], "correct": "a", "answer": "$3$", "reasoning": ["$a+b=0$，$cd=1$，$m=\\pm2$，所以 $m^2=4$。", "$\\frac{a+b}{m}=\\frac0m=0$（$m\\ne0$）。", "原式 $=4-1+0=3$。"], "contentVersion": "sha256:f6310641dbfff56d8bd6cd1eb1dba7be5180ca8a27244c9ed080af750d4ea46d"}, {"id": "j2-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j2-1", "j2-2"], "pointIds": ["pyjh.rat.008", "pyjh.rat.010", "pyjh.rat.013", "pyjh.rat.016"], "prompt": "已知 $a<0<b$，且 $|a|>|b|$。下列结论中一定正确的是哪一项？", "options": [{"id": "a", "text": "$a+b>0$", "feedback": "异号两数相加取绝对值较大的加数的符号，这里绝对值较大的是负数。"}, {"id": "b", "text": "$ab>0$", "feedback": "异号两数相乘得负。"}, {"id": "c", "text": "$a-b<0$", "feedback": "把减法化成加相反数，再看两个加数的符号。"}, {"id": "d", "text": "$\\frac ab>-1$", "feedback": "例如 $a=-3$，$b=1$ 时 $\\frac ab=-3$，小于 $-1$。"}], "correct": "c", "answer": "$a-b<0$", "reasoning": ["$a-b=a+(-b)$，其中 $a<0$，$-b<0$，两个负数相加仍为负数，所以 $a-b<0$。", "$a+b$ 取绝对值较大的 $a$ 的符号，是负数；$ab$ 异号得负；$|a|>|b|$ 时 $\\frac ab<-1$。所以其余三项都不成立。"], "contentVersion": "sha256:edb9f90d8c867b15e243cee017d877699ce8b3a973e9121dc49a02ff8ac9c598"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
