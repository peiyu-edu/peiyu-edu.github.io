<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 118" width="590" height="118" role="img" aria-labelledby="title desc">
<title id="title">三个电阻串联的线路 AB</title>
<desc id="desc">从左到右的一条线路，两端为点 A 和点 B，线路上依次串联三个电阻 R1、R2、R3，靠近 A 和靠近 B 的线段上各有一个向右的箭头，标着电流 I。</desc>
<style>text{fill:#17202a;font-size:30px}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic}.r{font-family:Georgia,'Times New Roman',serif}.z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px}line,path,polyline,polygon,circle,rect,ellipse{stroke-linejoin:round}</style>
<rect width="590" height="118" fill="white"/>
<line x1="14.0" y1="52.0" x2="576.0" y2="52.0" stroke="#17202a" stroke-width="2.5"/>
<circle cx="14" cy="52" r="5" fill="#17202a"/>
<circle cx="576" cy="52" r="5" fill="#17202a"/>
<polygon points="82.0,52.0 67.0,58.8 67.0,45.2" fill="#17202a"/>
<polygon points="530.0,52.0 515.0,58.8 515.0,45.2" fill="#17202a"/>
<text class="m" x="14.0" y="36.0" text-anchor="middle">A</text>
<text class="m" x="68.0" y="36.0" text-anchor="middle">I</text>
<text class="m" x="516.0" y="36.0" text-anchor="middle">I</text>
<text class="m" x="576.0" y="36.0" text-anchor="middle">B</text>
<rect x="112" y="38" width="102" height="28" fill="#17202a"/>
<text class="m" x="163.0" y="102.0" text-anchor="middle">R<tspan dy="8" font-size="27" font-style="normal">1</tspan></text>
<rect x="244" y="38" width="102" height="28" fill="#17202a"/>
<text class="m" x="295.0" y="102.0" text-anchor="middle">R<tspan dy="8" font-size="27" font-style="normal">2</tspan></text>
<rect x="376" y="38" width="102" height="28" fill="#17202a"/>
<text class="m" x="427.0" y="102.0" text-anchor="middle">R<tspan dy="8" font-size="27" font-style="normal">3</tspan></text>
</svg>
