<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级上册 第四单元 加法模型和乘法模型 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p4a-u4-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>四年级上册 第四单元 加法模型和乘法模型 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p4a-u4-test", "sectionId": "p4a-u4-test", "unitId": "p4a-u4", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "四年级上册 第四单元 加法模型和乘法模型 单元测评", "items": [{"id": "p4a-u4-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "果园一共收了 960 千克苹果，上午收了 575 千克。下午收了多少千克？", "answer": "385 千克", "reasoning": ["上午收的和下午收的合起来是一共收的。", "求下午收的，用总量减去上午收的：960 − 575 = 385（千克）。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u4.001"], "contentVersion": "sha256:b2a2028262e96b7fd9071b3ad2d698889166c94bee66102d8d45bdc0972d5b6c"}, {"id": "p4a-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "买 6 支同样的笔一共花了 42 元。下面说法对的是哪一项？", "answer": "每支笔 7 元是单价，42 元是总价", "reasoning": ["每件商品的价钱叫单价，买了几件叫数量，一共花的钱叫总价。", "单价 = 总价 ÷ 数量：42 ÷ 6 = 7（元）。"], "options": [{"id": "a", "text": "每支笔 7 元是总价，42 元是单价", "feedback": "说反了。一共花的 42 元才是总价。"}, {"id": "b", "text": "每支笔 7 元是单价，42 元是总价", "feedback": "对。每支的价钱叫单价，一共的钱叫总价，42 ÷ 6 = 7。"}, {"id": "c", "text": "每支笔 36 元是单价", "feedback": "求单价用总价除以数量，不是总价减数量。"}], "correct": "b", "pointIds": ["pyps.p4a.u4.003"], "contentVersion": "sha256:a230c00e152d2ca753fd92b25983966c351c5d13d6051597991c4d11649b6494"}, {"id": "p4a-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一辆汽车的速度是 65 千米/时，4 时行多少千米？", "answer": "260 千米", "reasoning": ["速度 × 时间 = 路程。", "65 × 4 = 260（千米）。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u4.005"], "contentVersion": "sha256:c6e0b8c66e87bbb0df7ac439f9d77ad2f5998b33d0ee87a52644efb3d07c94f2"}, {"id": "p4a-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "小林骑自行车，3 时骑了 45 千米。他的速度是多少？", "answer": "15 千米/时", "reasoning": ["速度 = 路程 ÷ 时间。", "45 ÷ 3 = 15，速度是 15 千米/时。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u4.006"], "contentVersion": "sha256:f6bf1c456602265813bd522f371c51e990afa9591f2f129827267a37529bc8a0"}, {"id": "p4a-u4-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一种文具盒每个 8 元，168 元能买几个？", "answer": "21 个", "reasoning": ["数量 = 总价 ÷ 单价。", "168 ÷ 8 = 21（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u4.003"], "contentVersion": "sha256:456f67b9d5536b5b4745d44de4e127c061a369eac97e272eaeadacd1bf47c229"}, {"id": "p4a-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "书包 58 元，文具盒 26 元，水杯 35 元。小丽带了 90 元，要买书包，再买另外一样。她能买文具盒还是水杯？", "answer": "文具盒", "reasoning": ["书包和文具盒：58 + 26 = 84（元），84 元没超过 90 元。", "书包和水杯：58 + 35 = 93（元），93 元超过了 90 元。", "所以只能买书包和文具盒。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u4.002"], "contentVersion": "sha256:e991520b52bbb22a1fc4dd9f05225c44fb28deff1b4bd40e5dfc31637a8e3cae"}, {"id": "p4a-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一种跳绳原来每根 12 元，现在每根 9 元。买 6 根，比原来便宜了多少元？", "answer": "18 元", "reasoning": ["每根便宜了 12 − 9 = 3（元）。", "6 根便宜了 3 × 6 = 18（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u4.004"], "contentVersion": "sha256:182c3bfd4e6e522299b8897233aa5002b62fd4efbdc565ead21fa78440b5b705"}, {"id": "p4a-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "甲、乙两地相距 560 千米。一辆货车从甲地开往乙地，每时行 70 千米，已经行了 5 时。离乙地还有多少千米？", "answer": "210 千米", "reasoning": ["已经行了 70 × 5 = 350（千米）。", "还剩 560 − 350 = 210（千米）。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u4.007"], "contentVersion": "sha256:080a4a3d00054f4c22874e6e616c537b7f33c515dd53e13c4163a53e4b4bf937"}, {"id": "p4a-u4-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小明家到外婆家 280 千米。爸爸开车上午 8 时出发，中午 12 时到达。平均每时行多少千米？", "answer": "70 千米", "reasoning": ["从上午 8 时到中午 12 时，经过了 4 时。", "280 ÷ 4 = 70，平均每时行 70 千米。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u4.007", "pyps.p4a.u4.006"], "contentVersion": "sha256:da73791cda844a9a3c42e82b93ad8e46c0f7c5207fe1bfd1e5eadc215f3edb86"}, {"id": "p4a-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "篮球每个 75 元，学校买了 12 个，付了 1000 元。应找回多少元？", "answer": "100 元", "reasoning": ["先求总价：75 × 12 = 900（元）。", "再求找回的钱：1000 − 900 = 100（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p4a.u4.004", "pyps.p4a.u3.004"], "contentVersion": "sha256:47f1d8d35bfaa74a8a811b2a921398a9168f0c8bb6fd5a6a677922135b4382dc"}, {"id": "p4a-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "甲车 3 时行了 210 千米，乙车 4 时行了 260 千米。哪辆车快？", "answer": "甲车，每时比乙车多行 5 千米", "reasoning": ["比快慢要比速度，也就是每时行多少千米。", "甲车：210 ÷ 3 = 70（千米/时）；乙车：260 ÷ 4 = 65（千米/时）。", "70 − 65 = 5，甲车快，每时多行 5 千米。"], "options": [{"id": "a", "text": "乙车，因为它行的路程多", "feedback": "乙车行的时间也多，要比每时行多少千米，不能只比路程。"}, {"id": "b", "text": "乙车，每时比甲车多行 5 千米", "feedback": "乙车每时行 65 千米，比甲车的 70 千米少。"}, {"id": "c", "text": "甲车，每时比乙车多行 5 千米", "feedback": "对。甲车 210 ÷ 3 = 70，乙车 260 ÷ 4 = 65，70 − 65 = 5。"}], "correct": "c", "pointIds": ["pyps.p4a.u4.006", "pyps.p4a.u4.005"], "contentVersion": "sha256:99a269c46bae539ea81a0816809e2c751723b7b618c9d44f2f7d290e9d9f4958"}], "contentVersion": "sha256:7881f4796084fc9e8d8d7d678ef32e57c4bc332911dc8cd9329e69e234b25e7f"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
