<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" width="600" height="390" role="img" aria-labelledby="title desc">
<title id="title">第一象限内以原点为位似中心的两个三角形</title>
<desc id="desc">平面直角坐标系，第一象限内有 △ABC 和较小的 △A₁B₁C₁，A₁、B₁、C₁ 分别在原点 O 与 A、B、C 的虚线连线上，△A₁B₁C₁ 靠近原点。图中未标坐标数值。</desc>
<style>text { fill:#17202a; font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; font-size:28px; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .sub { font-size:21px; }</style>
<rect width="600" height="390" fill="white"/>
<line x1="12" y1="340" x2="580" y2="340" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="592,340 576,333 576,347" fill="#17202a"/>
<line x1="45" y1="368" x2="45" y2="28" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="45,12 38,28 52,28" fill="#17202a"/>
<line x1="45" y1="340" x2="536.3" y2="170.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<line x1="45" y1="340" x2="376.5" y2="61.2" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<line x1="45" y1="340" x2="266.0" y2="114.8" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="9 7"/>
<polygon points="536.3,170.0 376.5,61.2 266.0,114.8" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="208.8,283.3 155.5,247.1 118.7,264.9" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<text x="10" y="376" text-anchor="start" class="m">O</text>
<text x="562" y="376" text-anchor="start" class="m">x</text>
<text x="12" y="40" text-anchor="start" class="m">y</text>
<text x="544.3" y="192.0" text-anchor="start" class="m">A</text>
<text x="378.5" y="51.2" text-anchor="start" class="m">B</text>
<text x="258.0" y="112.8" text-anchor="end" class="m">C</text>
<text x="210.8" y="319.3" text-anchor="start" class="m">A<tspan class="sub" dy="7">1</tspan></text>
<text x="177.5" y="254.1" text-anchor="start" class="m">B<tspan class="sub" dy="7">1</tspan></text>
<text x="108.7" y="257.9" text-anchor="end" class="m">C<tspan class="sub" dy="7">1</tspan></text>
</svg>
