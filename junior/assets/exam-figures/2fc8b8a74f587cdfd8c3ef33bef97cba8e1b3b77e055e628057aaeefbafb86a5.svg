<title id="title">圆锥及其侧面展开图</title>
<desc id="desc">左边是一个圆锥，底面椭圆前半为实线、后半为虚线。圆锥顶点同时是右边一个扇形的圆心，扇形的一条半径与圆锥右侧母线重合，两条半径之间标有直角记号。</desc>
