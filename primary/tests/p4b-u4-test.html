{"id": "c", "text": "0.3 元", "feedback": "对。1 元 = 10 角，3 角是十分之三元，写成 0.3 元。"}], "correct": "c", "pointIds": ["pyps.p4b.u4.001"], "contentVersion": "sha256:9b7b87acc9507907e6946ac089ff3f957168bf504d822c0825fe8e062fcb6da4", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 125\" role=\"img\" aria-label=\"三个简化的一角币示意，不复制人民币图案\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><circle cx=\"65\" cy=\"70\" r=\"30\" style=\"fill:var(--hl-soft);stroke:var(--b);stroke-width:2\" /><text x=\"65\" y=\"76\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">1角<\/text><circle cx=\"150\" cy=\"70\" r=\"30\" style=\"fill:var(--hl-soft);stroke:var(--b);stroke-width:2\" /><text x=\"150\" y=\"76\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">1角<\/text><circle cx=\"235\" cy=\"70\" r=\"30\" style=\"fill:var(--hl-soft);stroke:var(--b);stroke-width:2\" /><text x=\"235\" y=\"76\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">1角<\/text><\/svg>"}, {"id": "p4b-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "读出 205.06 这个小数。", "answer": "二百零五点零六", "reasoning": ["整数部分 205 读作二百零五。", "小数点读作「点」，小数部分 06 要一个一个数字读：零六。", "合起来读作二百零五点零六。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u4.003"], "contentVersion": "sha256:68212a4257aec8667a135ade3ff050c7b52304e29a0eaac65ccccfc460b2439b"}, {"id": "p4b-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "0.47 里面有几个 0.01？", "answer": "47 个", "reasoning": ["0.01 是百分之一。", "0.47 是百分之四十七，里面有 47 个 0.01。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u4.002"], "contentVersion": "sha256:8f826dbd73737747c59bbc0da05454742fa6c6b6d70bf9653f85ae9a986c223e"}, {"id": "p4b-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪个数和 0.5 相等？", "answer": "0.50", "reasoning": ["小数的末尾添上 0 或去掉 0，小数的大小不变。", "0.5 末尾添一个 0 是 0.50，所以相等。"], "options": [{"id": "a", "text": "5.0", "feedback": "5.0 就是 5，比 0.5 大得多。"}, {"id": "b", "text": "0.50", "feedback": "对。在小数的末尾添上 0，小数的大小不变。"}, {"id": "c", "text": "0.05", "feedback": "0.05 是 5 个百分之一，比 0.5 小。"}], "correct": "b", "pointIds": ["pyps.p4b.u4.004"], "contentVersion": "sha256:8cf3fb2360fd6bff44a773a01d983ee0f03dbd91e52419f60b07fc03ba95685e"}, {"id": "p4b-u4-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "3.09、3.1、3.089 中，哪个最大？", "answer": "3.1", "reasoning": ["先比整数部分，都是 3。", "再比十分位：3.1 是 1，3.09 和 3.089 都是 0，所以 3.1 最大。"], "options": [{"id": "a", "text": "3.1", "feedback": "对。整数部分相同，比十分位：3.1 的十分位是 1，另外两个是 0。"}, {"id": "b", "text": "3.089", "feedback": "位数多不一定大。它的十分位是 0。"}, {"id": "c", "text": "3.09", "feedback": "整数部分都是 3，十分位上 3.09 是 0，比 3.1 的 1 小。"}], "correct": "a", "pointIds": ["pyps.p4b.u4.005"], "contentVersion": "sha256:2433111285e639ae944385388c0a0ff849b3550fae96b6c921024a8a3a56a773"}, {"id": "p4b-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "把 4.7 的小数点向右移动两位是多少？把 52 的小数点向左移动三位是多少？", "answer": "470，0.052", "reasoning": ["4.7 的小数点向右移动两位，位数不够，用 0 补足：470。", "52 的小数点在 2 的右下角，向左移动三位，位数不够，在前面用 0 补足：0.052。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u4.006"], "contentVersion": "sha256:345503e6a13b4f07257ff7dbe4a39817e283dc945a53120e237d48ccff575ddd"}, {"id": "p4b-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "填一填：3 千克 50 克 = □ 千克；2.6 米 = □ 厘米。", "answer": "3.05，260", "reasoning": ["1 千克 = 1000 克，50 克是 0.050 千克，就是 0.05 千克，所以 3 千克 50 克 = 3.05 千克。", "1 米 = 100 厘米，把 2.6 的小数点向右移动两位，得 260 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u4.008"], "contentVersion": "sha256:32f980ba18fba96ab8e5a16eb354ad60c062e3304abd15034ae9f4e63d2305b2"}, {"id": "p4b-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "4.968 保留两位小数约是多少？保留一位小数约是多少？", "answer": "4.97，5.0", "reasoning": ["保留两位小数，看千分位：8 比 5 大，向百分位进 1，得 4.97。", "保留一位小数，看百分位：6 比 5 大，向十分位进 1，十分位 9 加 1 满十，再向个位进 1，得 5.0。", "保留一位小数，末尾的 0 不能去掉。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u4.009"], "contentVersion": "sha256:fd0a12274a51e8843736bf50d9eaf49800947d3c8bd473872282d360fd0d8dd6"}, {"id": "p4b-u4-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "把 74300 改写成用「万」作单位的数。", "answer": "7.43万", "reasoning": ["1 万 = 10000，在万位右边点上小数点：7.4300。", "去掉末尾的 0，再写上「万」：7.43万。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u4.010"], "contentVersion": "sha256:8c2f49fe0da5b082ce97d6e820bddd4429ccddb862b5cebe76ccd04c29f74d67"}, {"id": "p4b-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一支笔 2.5 元，买 10 支要多少元？", "answer": "25 元", "reasoning": ["买 10 支，就是把 2.5 扩大到原来的 10 倍。", "2.5 的小数点向右移动一位，得 25，要 25 元。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u4.007", "pyps.p4b.u4.006"], "contentVersion": "sha256:1e7c44f16abb8d494dcbb5b8b4a21fa7bfd06a19b2619031a70b5452283b261d"}, {"id": "p4b-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小明身高 1.36 米，小红身高 134 厘米，小刚身高 1 米 38 厘米。谁最高？", "answer": "小刚", "reasoning": ["先统一单位：134 厘米 = 1.34 米，1 米 38 厘米 = 1.38 米。", "1.38 > 1.36 > 1.34，小刚最高。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u4.005", "pyps.p4b.u4.008"], "contentVersion": "sha256:7383bcbe5ca768d8a7cc3e3b812819241d333f51e23f7183278afccc153502e5"}, {"id": "p4b-u4-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个两位小数，四舍五入保留一位小数是 3.5。这个两位小数最大是多少？最小是多少？", "answer": "最大 3.54，最小 3.45", "reasoning": ["百分位四舍：3.5□ 中，百分位最大填 4，得 3.54。", "百分位五入：3.4□ 中，百分位最小填 5，得 3.45。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u4.009"], "contentVersion": "sha256:87e7a2da2bdee607bea7bfc06e59ba4f96eeb720aff17e78541db63b1f102f3a"}], "contentVersion": "sha256:0c13940055f7510f2da5179aaf7155daab0571fca2722581632deebc265fd512"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="
