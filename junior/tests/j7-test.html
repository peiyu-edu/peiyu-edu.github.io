<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 7 章 相交线与平行线 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=0346bdf6f187"><link rel="stylesheet" href="../assets/learning-shell.css?v=98f4d1951708"><link rel="stylesheet" href="../assets/learning-contrast.css?v=bc8e3f382635"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=9f35dd2cb533"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=5386fbb9fecf"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=e3d4083f037a"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=9e04f871a3b0"></script></head><body data-stage="junior" data-sec="j7-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 7 章 相交线与平行线 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j7-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j7-test", "sectionId": "j7-test", "chapterId": "j7", "title": "第 7 章 相交线与平行线 · 章末测验", "label": "章末测验", "sections": ["j7-1", "j7-2", "j7-3", "j7-4"], "items": [{"id": "j7-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j7-1"], "pointIds": ["pyjh.geo.013"], "prompt": "两条直线相交，所成的四个角中有一个角是 $50^\\circ$。与它相邻的一个角（邻补角）是多少度？", "options": [{"id": "a", "text": "$50^\\circ$", "feedback": "这是它的对顶角，对顶角相等；邻补角与它的和是 $180^\\circ$。"}, {"id": "b", "text": "$130^\\circ$", "feedback": "邻补角互补，用 $180^\\circ$ 减去 $50^\\circ$。"}, {"id": "c", "text": "$40^\\circ$", "feedback": "这是它的余角，邻补角的和是 $180^\\circ$ 而不是 $90^\\circ$。"}, {"id": "d", "text": "$310^\\circ$", "feedback": "四个角的和是 $360^\\circ$，但邻补角只是其中一个角。"}], "correct": "b", "answer": "$130^\\circ$", "reasoning": ["邻补角有一条公共边，另一边互为反向延长线，它们的和是 $180^\\circ$。", "$180^\\circ-50^\\circ=130^\\circ$。"], "contentVersion": "sha256:5581e57a98365064622eee87980a51746b3f01ec373cda10e53e8298a5e11e08"}, {"id": "j7-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j7-1", "j7-2"], "pointIds": ["pyjh.geo.014", "pyjh.geo.015", "pyjh.geo.017"], "prompt": "下列说法中，正确的是哪一项？", "options": [{"id": "a", "text": "过一点有且只有一条直线与已知直线平行", "feedback": "点在已知直线上时，过这点没有直线与它平行；要说「过直线外一点」。"}, {"id": "b", "text": "在同一平面内，过一点有且只有一条直线与已知直线垂直", "feedback": "这是垂线的基本事实，点在直线上或直线外都成立。"}, {"id": "c", "text": "不相交的两条直线叫作平行线", "feedback": "要加上「在同一平面内」，空间中不相交的直线不一定平行。"}, {"id": "d", "text": "直线外一点到这条直线的垂线叫作点到直线的距离", "feedback": "距离是垂线段的长度，是一个数，不是一条直线。"}], "correct": "b", "answer": "在同一平面内，过一点有且只有一条直线与已知直线垂直", "reasoning": ["垂线的基本事实：在同一平面内，过一点有且只有一条直线与已知直线垂直。", "平行公理要求「过直线外一点」；平行线的定义要求「在同一平面内」；点到直线的距离是垂线段的长度。"], "contentVersion": "sha256:5f8a55ad1a95ec5c4a0e5a411de9b0b14c5676f5da26142405e799bd81207a2b"}, {"id": "j7-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j7-1"], "pointIds": ["pyjh.geo.016"], "prompt": "直线 $a$，$b$ 被直线 $c$ 所截。$\\angle1$ 在直线 $a$ 的上方、直线 $c$ 的右侧；$\\angle2$ 在直线 $b$ 的上方、直线 $c$ 的右侧。$\\angle1$ 与 $\\angle2$ 是什么位置关系的角？", "options": [{"id": "a", "text": "同位角", "feedback": "两个角在截线 $c$ 的同一侧，并且分别在被截直线 $a$，$b$ 的同一方。"}, {"id": "b", "text": "内错角", "feedback": "内错角在截线的两侧，这里两个角都在 $c$ 的右侧。"}, {"id": "c", "text": "同旁内角", "feedback": "同旁内角都夹在两条被截直线之间，这里两个角都在各自直线的上方。"}, {"id": "d", "text": "对顶角", "feedback": "对顶角有公共顶点，这两个角的顶点不同。"}], "correct": "a", "answer": "同位角", "reasoning": ["同位角：在截线的同侧，并且在两条被截直线的同一方。", "$\\angle1$，$\\angle2$ 都在 $c$ 的右侧，又都在各自直线的上方，所以是同位角。"], "contentVersion": "sha256:c7433dbc97a0d567a02013aafaaac7023b1a0d7d60996ecef9381701f12bc4fd"}, {"id": "j7-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j7-2"], "pointIds": ["pyjh.geo.019"], "prompt": "直线 $a\\parallel b$，直线 $c$ 与它们相交。若一对同旁内角中的一个是 $72^\\circ$，另一个是多少度？", "options": [{"id": "a", "text": "$72^\\circ$", "feedback": "两直线平行时，相等的是同位角、内错角，同旁内角是互补。"}, {"id": "b", "text": "$18^\\circ$", "feedback": "同旁内角的和是 $180^\\circ$，不是 $90^\\circ$。"}, {"id": "c", "text": "$108^\\circ$", "feedback": "两直线平行，同旁内角互补。"}, {"id": "d", "text": "$118^\\circ$", "feedback": "用 $180^\\circ$ 减 $72^\\circ$ 时计算有误。"}], "correct": "c", "answer": "$108^\\circ$", "reasoning": ["两直线平行，同旁内角互补。", "$180^\\circ-72^\\circ=108^\\circ$。"], "contentVersion": "sha256:2383470607ebc8497e5835698c67ddcc4e2920ec904e3984fe6f2eba15671fef"}, {"id": "j7-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j7-3"], "pointIds": ["pyjh.geo.021"], "prompt": "把命题「对顶角相等」改写成「如果……那么……」的形式，正确的是哪一项？", "options": [{"id": "a", "text": "如果两个角相等，那么这两个角是对顶角", "feedback": "题设和结论颠倒了，而且相等的角不一定是对顶角。"}, {"id": "b", "text": "如果两个角是对顶角，那么这两个角相等", "feedback": "「对顶角」是题设，「相等」是结论。"}, {"id": "c", "text": "如果两个角不是对顶角，那么这两个角不相等", "feedback": "这不是原命题的改写，原命题没有说不是对顶角的情况。"}, {"id": "d", "text": "如果两条直线相交，那么它们相等", "feedback": "结论说的是角相等，不是直线相等。"}], "correct": "b", "answer": "如果两个角是对顶角，那么这两个角相等", "reasoning": ["命题由题设和结论组成，「如果」后接题设，「那么」后接结论。", "「对顶角相等」的题设是「两个角是对顶角」，结论是「这两个角相等」。"], "contentVersion": "sha256:b6393dd6f511a10e7e63177728a8282a8bd400fa93fdca339b702f0558af0744"}, {"id": "j7-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j7-3"], "pointIds": ["pyjh.geo.022", "pyjh.rat.006"], "prompt": "要说明命题「若 $|a|=|b|$，则 $a=b$」是假命题，可以举出的反例是哪一项？", "options": [{"id": "a", "text": "$a=3$，$b=3$", "feedback": "这组值满足题设，也满足结论，不能说明命题是假的。"}, {"id": "b", "text": "$a=3$，$b=-3$", "feedback": "满足题设 $|a|=|b|$，却不满足结论 $a=b$。"}, {"id": "c", "text": "$a=2$，$b=-3$", "feedback": "这组值不满足题设 $|a|=|b|$。"}, {"id": "d", "text": "$a=0$，$b=0$", "feedback": "这组值满足题设，也满足结论。"}], "correct": "b", "answer": "$a=3$，$b=-3$", "reasoning": ["反例要满足命题的题设，但不满足它的结论。", "$|3|=|-3|=3$，满足题设；$3\\ne-3$，不满足结论，所以是反例。"], "contentVersion": "sha256:3ef8f4d0eeb0f661f98e7752530827e7b8ccc271f316f74d55cb649b951de7cc"}, {"id": "j7-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j7-1", "j7-2"], "pointIds": ["pyjh.geo.018", "pyjh.geo.016"], "prompt": "直线 $a$，$b$ 被直线 $c$ 所截。下列条件中，能判定 $a\\parallel b$ 的是哪一项？", "options": [{"id": "a", "text": "一对同旁内角都等于 $70^\\circ$", "feedback": "同旁内角互补才能判定平行，$70^\\circ+70^\\circ\\ne180^\\circ$。"}, {"id": "b", "text": "一对对顶角相等", "feedback": "对顶角总是相等，与 $a$，$b$ 是否平行无关。"}, {"id": "c", "text": "一对内错角都等于 $58^\\circ$", "feedback": "内错角相等，两直线平行。"}, {"id": "d", "text": "一对邻补角的和是 $180^\\circ$", "feedback": "邻补角的和总是 $180^\\circ$，与 $a$，$b$ 是否平行无关。"}], "correct": "c", "answer": "一对内错角都等于 $58^\\circ$", "reasoning": ["平行线的判定：同位角相等，或内错角相等，或同旁内角互补，两直线平行。", "只有「内错角都等于 $58^\\circ$」满足判定条件；对顶角相等、邻补角互补在任何情况下都成立。"], "contentVersion": "sha256:f794b474979a322264b94cf8eb62f75fbfb48fa2d996c5272b7d9e2fce52404d"}, {"id": "j7-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j7-2"], "pointIds": ["pyjh.geo.020", "pyjh.geo.019"], "prompt": "$AB\\parallel CD$，点 $A$，$C$ 在左，点 $B$，$D$ 在右。点 $E$ 在两条平行线之间，且在直线 $BD$ 的左侧。若 $\\angle ABE=40^\\circ$，$\\angle CDE=30^\\circ$，则 $\\angle BED$ 是多少度？", "options": [{"id": "a", "text": "$110^\\circ$", "feedback": "过 $E$ 作平行线后，$\\angle BED$ 被分成的两部分分别等于已知的两个角，不必与 $180^\\circ$ 相减。"}, {"id": "b", "text": "$10^\\circ$", "feedback": "$\\angle BED$ 是两个已知角的和，不是差。"}, {"id": "c", "text": "$70^\\circ$", "feedback": "过点 $E$ 作 $AB$ 的平行线，把 $\\angle BED$ 分成两部分，分别用内错角相等。"}, {"id": "d", "text": "$290^\\circ$", "feedback": "这是 $\\angle BED$ 的周角剩余部分。"}], "correct": "c", "answer": "$70^\\circ$", "reasoning": ["过点 $E$ 作 $EF\\parallel AB$（$F$ 在 $E$ 的右侧，与 $B$，$D$ 同侧），则 $EF\\parallel CD$（平行于同一条直线的两条直线平行）。", "$\\angle BEF=\\angle ABE=40^\\circ$，$\\angle FED=\\angle CDE=30^\\circ$（两直线平行，内错角相等）。", "$\\angle BED=\\angle BEF+\\angle FED=70^\\circ$。"], "contentVersion": "sha256:7d5a4f49cf753e66c4da9a768ce0a94d17d065e6d0e8f0daea94b368c395840b"}, {"id": "j7-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j7-4"], "pointIds": ["pyjh.geo.023"], "prompt": "把三角形 $ABC$ 沿 $BC$ 方向平移 $3\\,\\text{cm}$，得到三角形 $DEF$（$A\\to D$，$B\\to E$，$C\\to F$）。若 $BC=5\\,\\text{cm}$，则 $EC$ 的长是多少？", "options": [{"id": "a", "text": "$3\\,\\text{cm}$", "feedback": "这是平移的距离 $BE$。"}, {"id": "b", "text": "$5\\,\\text{cm}$", "feedback": "这是 $BC$（也等于 $EF$），$E$ 已从 $B$ 移动了。"}, {"id": "c", "text": "$8\\,\\text{cm}$", "feedback": "这是 $BF$，题目求的是 $EC$。"}, {"id": "d", "text": "$2\\,\\text{cm}$", "feedback": "对应点所连线段的长等于平移距离，$BE=3\\,\\text{cm}$，再用 $BC$ 减去它。"}], "correct": "d", "answer": "$2\\,\\text{cm}$", "reasoning": ["平移中对应点所连的线段相等，都等于平移距离：$BE=3\\,\\text{cm}$。", "$E$ 在线段 $BC$ 上，$EC=BC-BE=5-3=2$（cm）。"], "contentVersion": "sha256:418ecbc9cfb31e8a19fb80303150a1609c9cf95e0371d407fc15bd3bf4cd1004"}, {"id": "j7-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j7-2"], "pointIds": ["pyjh.geo.019", "pyjh.eq.009"], "prompt": "直线 $a\\parallel b$，被直线 $c$ 所截，一对同旁内角分别为 $(2x+15)^\\circ$ 和 $(3x-10)^\\circ$。这两个角中较小的一个是多少度？", "options": [{"id": "a", "text": "$95^\\circ$", "feedback": "这是较大的那个角。"}, {"id": "b", "text": "$35^\\circ$", "feedback": "这是 $x$ 的值，还要代回求角的度数。"}, {"id": "c", "text": "$85^\\circ$", "feedback": "两直线平行，同旁内角互补，列方程求 $x$ 后代回。"}, {"id": "d", "text": "$90^\\circ$", "feedback": "同旁内角互补，不一定相等；若列成两角相等就错了。"}], "correct": "c", "answer": "$85^\\circ$", "reasoning": ["两直线平行，同旁内角互补：$(2x+15)+(3x-10)=180$。", "$5x+5=180$，$x=35$。", "两角分别为 $2\\times35+15=85$（度）和 $3\\times35-10=95$（度），较小的是 $85^\\circ$。"], "contentVersion": "sha256:222d8a3407482e900d71dde1d41b7502f79e565ab72aed85629238caf03a8c9e"}, {"id": "j7-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j7-4"], "pointIds": ["pyjh.geo.024", "pyjh.geo.023"], "prompt": "一块长方形草地长 $20\\,\\text{m}$，宽 $12\\,\\text{m}$。草地中间修了一条弯曲的小路，小路从一条长边通到对面的另一条长边，沿长边方向量，小路各处的宽都是 $2\\,\\text{m}$。剩下的草地面积是多少？", "options": [{"id": "a", "text": "$240\\,\\text{m}^2$", "feedback": "这是整块长方形的面积，还要去掉小路。"}, {"id": "b", "text": "$216\\,\\text{m}^2$", "feedback": "把小路两侧的草地平移拼在一起，得到长 $(20-2)\\,\\text{m}$、宽 $12\\,\\text{m}$ 的长方形。"}, {"id": "c", "text": "$180\\,\\text{m}^2$", "feedback": "小路只在一个方向上占去 $2\\,\\text{m}$，宽不用减。"}, {"id": "d", "text": "$228\\,\\text{m}^2$", "feedback": "平移后去掉的是 $2\\times12$ 的长方形，不是 $1\\times12$。"}], "correct": "b", "answer": "$216\\,\\text{m}^2$", "reasoning": ["把小路左右两侧的草地平移，使它们拼在一起，形状变了但面积不变。", "拼成的长方形长 $20-2=18$（m），宽 $12\\,\\text{m}$，面积 $18\\times12=216$（$\\text{m}^2$）。"], "contentVersion": "sha256:8fe9d6c9727944a50ec13531ae3bb1f2669b3625e7013663993053f77d6a3a98"}, {"id": "j7-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j7-1", "j7-2"], "pointIds": ["pyjh.geo.019", "pyjh.geo.013", "pyjh.geo.010"], "prompt": "$AB\\parallel CD$（$A$，$C$ 在左，$B$，$D$ 在右），直线 $EF$ 分别交 $AB$，$CD$ 于点 $G$，$H$，点 $E$ 在 $AB$ 上方。若 $\\angle AGE=50^\\circ$，$HN$ 平分 $\\angle GHD$，则 $\\angle GHN$ 是多少度？", "options": [{"id": "a", "text": "$25^\\circ$", "feedback": "$\\angle GHD$ 不等于 $50^\\circ$；它与 $\\angle AGH$ 是内错角。"}, {"id": "b", "text": "$50^\\circ$", "feedback": "这是 $\\angle AGE$ 的度数，不是要求的角。"}, {"id": "c", "text": "$65^\\circ$", "feedback": "先由邻补角求 $\\angle AGH$，再用内错角相等求 $\\angle GHD$，最后平分。"}, {"id": "d", "text": "$130^\\circ$", "feedback": "这是 $\\angle GHD$，还要取它的一半。"}], "correct": "c", "answer": "$65^\\circ$", "reasoning": ["$\\angle AGH=180^\\circ-\\angle AGE=130^\\circ$（邻补角）。", "$AB\\parallel CD$，$\\angle GHD=\\angle AGH=130^\\circ$（两直线平行，内错角相等）。", "$HN$ 平分 $\\angle GHD$，$\\angle GHN=\\frac12\\times130^\\circ=65^\\circ$。"], "contentVersion": "sha256:8c918028e8e71de74ed8fea0e9fd16c4020c159ca18f6867e645fe40873095f3"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
