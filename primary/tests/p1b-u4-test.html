<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级下册 第四单元 100以内的口算加、减法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p1b-u4-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级下册 第四单元 100以内的口算加、减法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1b-u4-test", "sectionId": "p1b-u4-test", "unitId": "p1b-u4", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级下册 第四单元 100以内的口算加、减法 单元测评", "items": [{"id": "p1b-u4-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "34 + 5 = □", "answer": "39", "reasoning": ["个位和个位相加：4 + 5 = 9。", "30 + 9 = 39。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.001"], "contentVersion": "sha256:f1baf4f4bf3d9f62c2b0832e461319632c397a2e490aa0c70834c4ef254651ce"}, {"id": "p1b-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "26 + 30 = □", "answer": "56", "reasoning": ["十位和十位相加：20 + 30 = 50。", "50 + 6 = 56。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.001"], "contentVersion": "sha256:b15ae8257cb1515b27bad96b84a9809411e1d8454d4fd5e93d905f502a9a8df2"}, {"id": "p1b-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "58 − 6 = □", "answer": "52", "reasoning": ["个位减个位：8 − 6 = 2。", "50 + 2 = 52。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.004"], "contentVersion": "sha256:c1f0653a2dfc4169167393f62da074f9c1e536b05d749a29f30c1e260d05a951"}, {"id": "p1b-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "67 − 25 = □", "answer": "42", "reasoning": ["先减整十：67 − 20 = 47。", "再减 5：47 − 5 = 42。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.005"], "contentVersion": "sha256:eb2b3b29cd00b0935da8784774270b2862bd113f058032fa892157bbe5b9cdec"}, {"id": "p1b-u4-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "47 + 8 = □", "answer": "55", "reasoning": ["个位相加：7 + 8 = 15，满十要进到十位。", "40 + 15 = 55。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.003"], "contentVersion": "sha256:3690b6dad01c4fae732d9f6a4590c8fa5471edc4cae20004b8eca4be5570da10"}, {"id": "p1b-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "52 − 7 = □", "answer": "45", "reasoning": ["个位 2 不够减 7，把 52 分成 40 和 12。", "12 − 7 = 5，40 + 5 = 45。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.006"], "contentVersion": "sha256:a51fdb94a1bdb11dd300373366cd57f2eb482459ca78cbc45efb47a47509ed71"}, {"id": "p1b-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "38 + 6 = ？", "answer": "44", "reasoning": ["个位相加：8 + 6 = 14。", "30 + 14 = 44。"], "options": [{"id": "a", "text": "98", "feedback": "6 是 6 个一，要和个位的 8 相加，不能加到十位上。"}, {"id": "b", "text": "44", "feedback": "对。8 + 6 = 14，30 + 14 = 44。"}, {"id": "c", "text": "34", "feedback": "8 + 6 = 14，满十要向十位进 1，十位变成 4。"}], "correct": "b", "pointIds": ["pyps.p1b.u4.003"], "contentVersion": "sha256:734b1edc69a7f802c73b9d49e80032bc1845d4d9d7eb7d58d4600f04dbc0d883"}, {"id": "p1b-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "41 − 5 = ？", "answer": "36", "reasoning": ["个位 1 不够减 5，把 41 分成 30 和 11。", "11 − 5 = 6，30 + 6 = 36。"], "options": [{"id": "a", "text": "44", "feedback": "不能倒过来用 5 减 1。个位 1 不够减 5，要从十位拿 1 个十。"}, {"id": "b", "text": "36", "feedback": "对。11 − 5 = 6，30 + 6 = 36。"}, {"id": "c", "text": "46", "feedback": "从十位拿走了 1 个十，十位要变成 3。"}], "correct": "b", "pointIds": ["pyps.p1b.u4.006"], "contentVersion": "sha256:02b87f2a29cb53e1103fbb76ed25367c6c50d9b6e61173ede2879e7d501c4982"}, {"id": "p1b-u4-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "43 + 25 = □", "answer": "68", "reasoning": ["先加整十：43 + 20 = 63。", "再加 5：63 + 5 = 68。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.002"], "contentVersion": "sha256:7b6401678e570cadb7b29c2716f104c6a2f21b21b0f126f7dbf99a155877ebd7"}, {"id": "p1b-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "有 20 个苹果，每 5 个装一袋。能装满几袋？", "answer": "4 袋", "reasoning": ["装一袋就减去 5 个：20 − 5 = 15，15 − 5 = 10，10 − 5 = 5，5 − 5 = 0。", "减了 4 次正好减完，能装满 4 袋。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.007"], "contentVersion": "sha256:28caa926f0be553ffdacf626fde98370336a6c730424357c0df42405f3156ae7"}, {"id": "p1b-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "56 − 23 + 8 = □", "answer": "41", "reasoning": ["从左往右，先算 56 − 23 = 33。", "再算 33 + 8：3 + 8 = 11，30 + 11 = 41。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.005", "pyps.p1b.u4.003"], "contentVersion": "sha256:f21edc38eb740cdd5aaec34df13e307c1605322141fd9f2851a727cb54add1e6"}, {"id": "p1b-u4-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小红有 36 张卡片，好朋友又送给她 7 张。小红现在有几张卡片？", "answer": "36 + 7 = 43（张）", "reasoning": ["原来有的和又送来的合起来，用加法。", "6 + 7 = 13，30 + 13 = 43：36 + 7 = 43（张）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u4.003"], "contentVersion": "sha256:744e86a1e157c296fde94a5f0ac6941c41fc272053d88839c30aa2d99d4addb2"}], "contentVersion": "sha256:b058996d1f744a9d208c2405ed8e269340d970623131c0d54b3abcc3b588cad5"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
