<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二年级上册 第五单元 7～9 的表内乘、除法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p2a-u5-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>二年级上册 第五单元 7～9 的表内乘、除法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p2a-u5-test", "sectionId": "p2a-u5-test", "unitId": "p2a-u5", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "二年级上册 第五单元 7～9 的表内乘、除法 单元测评", "items": [{"id": "p2a-u5-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "直接写得数：7 × 6 = ？　7 × 7 = ？", "answer": "42，49", "reasoning": ["六七四十二，7 × 6 = 42。", "七七四十九，7 × 7 = 49。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u5.001"], "contentVersion": "sha256:9921fb2c2427698a38b35ed864998c25d11beb89b84a6de0d7a4158f8f49ab9d"}, {"id": "p2a-u5-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "直接写得数：8 × 5 = ？　8 × 8 = ？", "answer": "40，64", "reasoning": ["五八四十，8 × 5 = 40。", "八八六十四，8 × 8 = 64。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u5.002"], "contentVersion": "sha256:5549c180fa20fc46a274626eac60477f8b6d1acd9070c4ac579c12cdfa87fd9e"}, {"id": "p2a-u5-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "直接写得数：9 × 4 = ？　9 × 9 = ？", "answer": "36，81", "reasoning": ["四九三十六，9 × 4 = 36。", "九九八十一，9 × 9 = 81。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u5.003"], "contentVersion": "sha256:4616f6a773d1fda130b54415614054514cd9a8d776a030eda40168a0124fc81b"}, {"id": "p2a-u5-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "直接写得数：56 ÷ 7 = ？　48 ÷ 8 = ？", "answer": "8，6", "reasoning": ["想口诀七八五十六，56 ÷ 7 = 8。", "想口诀六八四十八，48 ÷ 8 = 6。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u5.004"], "contentVersion": "sha256:490cbc28a5687069f317d9277528a94ae6ec597434d40fd851260c0593fee178"}, {"id": "p2a-u5-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "直接写得数：81 ÷ 9 = ？　54 ÷ 9 = ？", "answer": "9，6", "reasoning": ["想口诀九九八十一，81 ÷ 9 = 9。", "想口诀六九五十四，54 ÷ 9 = 6。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u5.005"], "contentVersion": "sha256:d1c58f9609261f62042938c549c3824f38a2ac80e93198d6c969cf81688d0c9f"}, {"id": "p2a-u5-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个星期有 7 天。4 个星期有多少天？", "answer": "28 天", "reasoning": ["4 个星期就是 4 个 7 天。", "7 × 4 = 28（天），想四七二十八。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u5.001"], "contentVersion": "sha256:d7a7a0dbefa5a23edff33615d8c762c7247daaed25d15604055ec1d8f1934a94"}, {"id": "p2a-u5-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "有 32 个小朋友做游戏，每 8 人一组，可以分成几组？", "answer": "4 组", "reasoning": ["求 32 里有几个 8，用除法：32 ÷ 8。", "想口诀四八三十二，32 ÷ 8 = 4（组）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u5.004"], "contentVersion": "sha256:d4d26d68c08804fbfd50df1cf972e6811121123d510305ef0481d1132565ada1"}, {"id": "p2a-u5-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用口诀「七九六十三」，能写出哪几道算式？", "answer": "7 × 9 = 63，9 × 7 = 63，63 ÷ 7 = 9，63 ÷ 9 = 7", "reasoning": ["七九六十三是 7 个 9 或 9 个 7 是 63。", "所以有 7 × 9 = 63、9 × 7 = 63、63 ÷ 7 = 9、63 ÷ 9 = 7。"], "options": [{"id": "a", "text": "7 × 9 = 63，9 × 7 = 63，63 ÷ 7 = 9，63 ÷ 9 = 7", "feedback": "对。一句口诀能写两道乘法和两道除法。"}, {"id": "b", "text": "只有 7 × 9 = 63", "feedback": "还能交换乘数，也能写除法算式。"}, {"id": "c", "text": "7 + 9 = 63，63 − 7 = 9", "feedback": "7 + 9 = 16，不等于 63；口诀说的是乘法。"}], "correct": "a", "pointIds": ["pyps.p2a.u5.005", "pyps.p2a.u5.003"], "contentVersion": "sha256:a4c058c954c520e4ea251174f823b3fdb0f56c33ddf33738a6afd2d64cecd39d"}, {"id": "p2a-u5-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "妈妈买了 4 盒月饼，每盒 6 个。把这些月饼平均分给 8 个人，一共有多少个月饼？每人分几个？", "answer": "一共 24 个，每人 3 个", "reasoning": ["先求一共有多少个：6 × 4 = 24（个）。", "再平均分给 8 人：24 ÷ 8 = 3（个），想三八二十四。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u5.006"], "contentVersion": "sha256:4428929dd8c67bc1cf9d5bbd030101a4cbd9a33fa20b85f7aebca052e515beeb"}, {"id": "p2a-u5-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "花坛里每排摆 9 盆花，摆了 4 排。(1) 一共有几盆花？(2) 如果把这些花改成平均摆 6 排，每排摆几盆？", "answer": "(1) 36 盆　(2) 6 盆", "reasoning": ["先求一共有多少盆：9 × 4 = 36（盆）。", "再平均摆成 6 排：36 ÷ 6 = 6（盆），想六六三十六。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u5.006", "pyps.p2a.u5.003"], "contentVersion": "sha256:bafa5326204e88b16c24138fa903b35923642e23b1f27fbc706535ebafc55f09"}], "contentVersion": "sha256:7750b34b1f8a1765ed7b1ae4f5eac7cef15782d0699fb4b1261f6d735133591e"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
