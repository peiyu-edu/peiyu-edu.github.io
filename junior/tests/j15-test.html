<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 15 章 轴对称 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j15-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 15 章 轴对称 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j15-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j15-test", "sectionId": "j15-test", "chapterId": "j15", "title": "第 15 章 轴对称 · 章末测验", "label": "章末测验", "sections": ["j15-1", "j15-2", "j15-3"], "items": [{"id": "j15-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j15-1"], "pointIds": ["pyjh.sym.001"], "prompt": "下列图形中，不是轴对称图形的是哪一个？", "options": [{"id": "a", "text": "等腰三角形", "feedback": "沿底边上的高所在直线对折，两旁能完全重合。"}, {"id": "b", "text": "长方形", "feedback": "沿两组对边中点连线所在直线对折都能重合。"}, {"id": "c", "text": "三边都不相等的三角形", "feedback": "找不到一条直线，使它沿这条直线折叠后两旁能够完全重合。"}, {"id": "d", "text": "角", "feedback": "角的平分线所在的直线就是它的对称轴。"}], "correct": "c", "answer": "三边都不相等的三角形", "reasoning": ["一个图形沿一条直线折叠，直线两旁的部分能够互相重合，这个图形就是轴对称图形。", "等腰三角形、长方形、角都能找到对称轴；三边都不相等的三角形找不到。"], "contentVersion": "sha256:1ac177c9e77db856de9105a4c47571178e7751297137e98c597c53bcc46d9fde"}, {"id": "j15-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j15-2"], "pointIds": ["pyjh.sym.008"], "prompt": "在平面直角坐标系中，点 $P(-3,2)$ 关于 $x$ 轴对称的点的坐标是什么？", "options": [{"id": "a", "text": "$(3,2)$", "feedback": "这是关于 $y$ 轴对称的点，横坐标变号。"}, {"id": "b", "text": "$(-3,-2)$", "feedback": "关于 $x$ 轴对称，横坐标不变，纵坐标互为相反数。"}, {"id": "c", "text": "$(3,-2)$", "feedback": "横、纵坐标都变号，这是两次对称后的结果。"}, {"id": "d", "text": "$(2,-3)$", "feedback": "对称不会交换横、纵坐标的位置。"}], "correct": "b", "answer": "$(-3,-2)$", "reasoning": ["点 $(x,y)$ 关于 $x$ 轴对称的点的坐标是 $(x,-y)$。", "所以 $P(-3,2)$ 关于 $x$ 轴的对称点是 $(-3,-2)$。"], "contentVersion": "sha256:ac2c84b994ed2cfe5354a770cd2aaee5848806ec9344fe94ebd1e253902600ab"}, {"id": "j15-test-03-v2", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j15-1"], "pointIds": ["pyjh.sym.003"], "prompt": "在 $\\triangle ABC$ 中，$AB=6$，$BC=9$，边 $AC$ 的垂直平分线交 $AC$ 于点 $E$，交 $BC$ 于点 $D$，连接 $AD$。$\\triangle ABD$ 的周长是多少？", "options": [{"id": "a", "text": "$15$", "feedback": "$AD=CD$，所以 $BD+AD=BD+CD=BC$，周长等于 $AB+BC$。"}, {"id": "b", "text": "$21$", "feedback": "周长只加三条边，先列出各边，再用垂直平分线的等距性质化简，避免重复计入边长。"}, {"id": "c", "text": "$12$", "feedback": "$AD$ 不一定等于 $AB$，要用垂直平分线的性质把 $AD$ 换成 $CD$。"}, {"id": "d", "text": "$9$", "feedback": "这里只算了部分边长，还没有把三角形的三条边全部计入。"}], "correct": "a", "answer": "$15$", "reasoning": ["点 $D$ 在 $AC$ 的垂直平分线上，所以 $DA=DC$。", "$\\triangle ABD$ 的周长 $=AB+BD+AD=AB+BD+DC=AB+BC=6+9=15$。"], "contentVersion": "sha256:21739efadca1619edd5c33503e99d9f45687d475c2763a8b0bca28ee226f18d5"}, {"id": "j15-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j15-3"], "pointIds": ["pyjh.sym.011", "pyjh.sym.010"], "prompt": "在 $\\triangle ABC$ 中，$AB=AC$，$AD$ 是 $BC$ 边上的中线，$\\angle BAD=25^\\circ$。$\\angle C$ 是多少度？", "options": [{"id": "a", "text": "$50^\\circ$", "feedback": "这是顶角 $\\angle BAC$，还要求底角。"}, {"id": "b", "text": "$25^\\circ$", "feedback": "这是 $\\angle CAD$ 的度数，不是底角。"}, {"id": "c", "text": "$65^\\circ$", "feedback": "底边上的中线也平分顶角，$\\angle BAC=50^\\circ$，两个底角相等。"}, {"id": "d", "text": "$77.5^\\circ$", "feedback": "把 $25^\\circ$ 当成了顶角；$AD$ 只是平分了顶角。"}], "correct": "c", "answer": "$65^\\circ$", "reasoning": ["等腰三角形底边上的中线也是顶角的平分线（三线合一），所以 $\\angle BAC=2\\times25^\\circ=50^\\circ$。", "$AB=AC$，所以 $\\angle B=\\angle C=\\frac12(180^\\circ-50^\\circ)=65^\\circ$。"], "contentVersion": "sha256:834b64b3be9cd35a2e252ff9fc2dffcb15849cb21b71e8ed35295e4397003f7a"}, {"id": "j15-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j15-3"], "pointIds": ["pyjh.sym.014"], "prompt": "在 $\\mathrm{Rt}\\triangle ABC$ 中，$\\angle C=90^\\circ$，$\\angle A=30^\\circ$，$AB=8$。$BC$ 的长是多少？", "options": [{"id": "a", "text": "$16$", "feedback": "斜边是最长的边，直角边不会比斜边长。"}, {"id": "b", "text": "$8$", "feedback": "$8$ 是斜边 $AB$ 的长，$BC$ 是直角边。"}, {"id": "c", "text": "$4$", "feedback": "$30^\\circ$ 角所对的直角边等于斜边的一半。"}, {"id": "d", "text": "$2$", "feedback": "只取一次一半，不是四分之一。"}], "correct": "c", "answer": "$4$", "reasoning": ["在直角三角形中，$30^\\circ$ 角所对的直角边等于斜边的一半。", "$\\angle A=30^\\circ$ 所对的直角边是 $BC$，所以 $BC=\\frac12AB=4$。"], "contentVersion": "sha256:51720523dab924562085dac6512ea77c59a261e63759e85e2041fc74a6e1c455"}, {"id": "j15-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j15-3"], "pointIds": ["pyjh.sym.010", "pyjh.tri.009"], "prompt": "一个等腰三角形有一个内角是 $70^\\circ$，它的顶角是多少度？", "options": [{"id": "a", "text": "$70^\\circ$", "feedback": "$70^\\circ$ 也可能是底角，要分两种情况。"}, {"id": "b", "text": "$40^\\circ$", "feedback": "$70^\\circ$ 也可能就是顶角，要分两种情况。"}, {"id": "c", "text": "$40^\\circ$ 或 $70^\\circ$", "feedback": "$70^\\circ$ 可能是顶角，也可能是底角；两种情况都能组成三角形。"}, {"id": "d", "text": "$55^\\circ$", "feedback": "$55^\\circ$ 是 $70^\\circ$ 作顶角时的底角，题目问的是顶角。"}], "correct": "c", "answer": "$40^\\circ$ 或 $70^\\circ$", "reasoning": ["若 $70^\\circ$ 是顶角，顶角就是 $70^\\circ$。", "若 $70^\\circ$ 是底角，两个底角都是 $70^\\circ$，顶角 $=180^\\circ-2\\times70^\\circ=40^\\circ$。", "两种情况都成立，所以顶角是 $40^\\circ$ 或 $70^\\circ$。"], "contentVersion": "sha256:c85f50057d7a5e04b1edbff522a66ce1395c60024fdd905c0751332ef5c956f4"}, {"id": "j15-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j15-2"], "pointIds": ["pyjh.sym.008"], "prompt": "若点 $A(a,3)$ 与点 $B(-2,b)$ 关于 $y$ 轴对称，则 $a+b$ 的值是多少？", "options": [{"id": "a", "text": "$1$", "feedback": "关于 $y$ 轴对称，横坐标互为相反数，$a$ 不等于 $-2$。"}, {"id": "b", "text": "$-1$", "feedback": "关于 $y$ 轴对称，纵坐标不变，$b$ 不是 $-3$。"}, {"id": "c", "text": "$5$", "feedback": "横坐标互为相反数得 $a=2$，纵坐标相同得 $b=3$。"}, {"id": "d", "text": "$-5$", "feedback": "横坐标、纵坐标都取了相反数，这是关于原点的情形。"}], "correct": "c", "answer": "$5$", "reasoning": ["关于 $y$ 轴对称的两点，横坐标互为相反数，纵坐标相同。", "所以 $a=2$，$b=3$，$a+b=5$。"], "contentVersion": "sha256:a68e94ffe431f2773da30505f26bda04b2f75a1bb2785a75bbd189ad3187734a"}, {"id": "j15-test-08-v2", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j15-1"], "pointIds": ["pyjh.sym.004", "pyjh.sym.003"], "prompt": "三个村庄 $A$，$B$，$C$ 不在同一直线上，要在它们所在的平面内建一个水站 $P$（允许在 $\\triangle ABC$ 外），使水站到三个村庄的距离都相等。点 $P$ 应选在哪里？", "options": [{"id": "a", "text": "$\\triangle ABC$ 三条中线的交点", "feedback": "中线交点到三个顶点的距离一般不相等。"}, {"id": "b", "text": "$\\triangle ABC$ 三条角平分线的交点", "feedback": "角平分线的交点到三条边的距离相等，不是到三个顶点。"}, {"id": "c", "text": "$\\triangle ABC$ 三条高的交点", "feedback": "高的交点到三个顶点的距离一般不相等。"}, {"id": "d", "text": "$\\triangle ABC$ 三边垂直平分线的交点", "feedback": "到 $A$，$B$ 距离相等的点在 $AB$ 的垂直平分线上，同理还要在 $BC$ 的垂直平分线上。"}], "correct": "d", "answer": "$\\triangle ABC$ 三边垂直平分线的交点", "reasoning": ["$PA=PB$ 的点在线段 $AB$ 的垂直平分线上，$PB=PC$ 的点在线段 $BC$ 的垂直平分线上。", "三个村庄不共线，所以这两条垂直平分线不平行，有唯一交点；交点不一定在三角形内部。", "两条垂直平分线的交点满足 $PA=PB=PC$，它也在 $AC$ 的垂直平分线上，所以选三边垂直平分线的交点。"], "contentVersion": "sha256:f9a438db3c728f712fa35955973f586929b03b265657cc39684b3600ccd23fb6"}, {"id": "j15-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j15-1"], "pointIds": ["pyjh.sym.005"], "prompt": "下列命题中，逆命题是真命题的是哪一个？", "options": [{"id": "a", "text": "对顶角相等", "feedback": "逆命题“相等的角是对顶角”是假命题，相等的角不一定有公共顶点。"}, {"id": "b", "text": "全等三角形的对应角相等", "feedback": "逆命题“对应角相等的三角形全等”是假命题，三个角相等的三角形大小可以不同。"}, {"id": "c", "text": "如果两个数相等，那么它们的绝对值相等", "feedback": "逆命题“绝对值相等的两个数相等”是假命题，例如 $2$ 与 $-2$。"}, {"id": "d", "text": "两直线平行，内错角相等", "feedback": "它的逆命题“内错角相等，两直线平行”是平行线的判定，是真命题。"}], "correct": "d", "answer": "两直线平行，内错角相等", "reasoning": ["把原命题的题设和结论交换，就得到它的逆命题；原命题是真命题，逆命题不一定是真命题。", "逐个写出逆命题判断：只有“内错角相等，两直线平行”是真命题。"], "contentVersion": "sha256:af5629b46b975194bd396dbca31c14cfd7e01c61af96cdec1e95f31c2d7ae2ea", "contentVersions": ["sha256:66f87060ff923b2fb5b2ddfb3e133d3d0f9dd1783036c8ba8981c0b46f7329f2", "sha256:af5629b46b975194bd396dbca31c14cfd7e01c61af96cdec1e95f31c2d7ae2ea"]}, {"id": "j15-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j15-3"], "pointIds": ["pyjh.sym.012", "pyjh.sym.010", "pyjh.tri.009"], "prompt": "在 $\\triangle ABC$ 中，$AB=AC$，$\\angle A=36^\\circ$，$BD$ 平分 $\\angle ABC$ 交 $AC$ 于点 $D$，$BC=5$。$AD$ 的长是多少？", "options": [{"id": "a", "text": "$5$", "feedback": "$\\angle A=\\angle ABD=36^\\circ$ 得 $AD=BD$；$\\angle C=\\angle BDC=72^\\circ$ 得 $BD=BC$。"}, {"id": "b", "text": "$\\frac52$", "feedback": "$BD$ 是角平分线，不是中线，$D$ 不是 $AC$ 的中点。"}, {"id": "c", "text": "$10$", "feedback": "没有哪条线段是 $BC$ 的 $2$ 倍，要用等角对等边一步步转化。"}, {"id": "d", "text": "无法确定", "feedback": "三个角都能求出，可以用等角对等边把 $AD$ 转化到 $BC$。"}], "correct": "a", "answer": "$5$", "reasoning": ["$\\angle ABC=\\angle C=\\frac12(180^\\circ-36^\\circ)=72^\\circ$，$\\angle ABD=\\angle DBC=36^\\circ$。", "在 $\\triangle ABD$ 中，$\\angle A=\\angle ABD=36^\\circ$，所以 $AD=BD$。", "在 $\\triangle BCD$ 中，$\\angle BDC=180^\\circ-36^\\circ-72^\\circ=72^\\circ=\\angle C$，所以 $BD=BC=5$，故 $AD=5$。"], "contentVersion": "sha256:e0a85402fff0c4a3e5a4e256ebc392a4815259f3e132c724981e87f02b3b28a6"}, {"id": "j15-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j15-3"], "pointIds": ["pyjh.sym.013", "pyjh.sym.014"], "prompt": "等边三角形 $ABC$ 的边长是 $6$，$D$ 是 $BC$ 的中点，$DE\\perp AB$ 于点 $E$。$BE$ 的长是多少？", "options": [{"id": "a", "text": "$3$", "feedback": "这是 $BD$ 的长；在 $\\mathrm{Rt}\\triangle BDE$ 中，$BE$ 是 $30^\\circ$ 角所对的边。"}, {"id": "b", "text": "$\\frac32$", "feedback": "$\\angle B=60^\\circ$，$\\angle BDE=30^\\circ$，$BE=\\frac12BD$。"}, {"id": "c", "text": "$\\frac92$", "feedback": "这是 $AE$ 的长，题目求的是 $BE$。"}, {"id": "d", "text": "$\\frac34$", "feedback": "$BD$ 已经是 $BC$ 的一半，再取一半就够了，不用取三次。"}], "correct": "b", "answer": "$\\frac32$", "reasoning": ["等边三角形每个角都是 $60^\\circ$，$D$ 是 $BC$ 中点，$BD=3$。", "$DE\\perp AB$，在 $\\mathrm{Rt}\\triangle BDE$ 中，$\\angle BDE=90^\\circ-60^\\circ=30^\\circ$。", "$30^\\circ$ 角所对的直角边 $BE=\\frac12BD=\\frac32$。"], "contentVersion": "sha256:7dfedfe8cfac2d50397a127b3c6a4d85439a41e4f73a1ee320af67ffc93ee429"}, {"id": "j15-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j15-1"], "pointIds": ["pyjh.sym.003", "pyjh.tri.009"], "prompt": "在 $\\triangle ABC$ 中，$\\angle BAC=110^\\circ$，边 $AB$ 的垂直平分线交 $BC$ 于点 $E$，边 $AC$ 的垂直平分线交 $BC$ 于点 $F$，连接 $AE$，$AF$。$\\angle EAF$ 是多少度？", "options": [{"id": "a", "text": "$70^\\circ$", "feedback": "这是 $\\angle B+\\angle C$，也就是 $\\angle BAE+\\angle CAF$，还要从 $110^\\circ$ 中减去。"}, {"id": "b", "text": "$40^\\circ$", "feedback": "$EA=EB$，$FA=FC$，所以 $\\angle BAE+\\angle CAF=\\angle B+\\angle C=70^\\circ$。"}, {"id": "c", "text": "$55^\\circ$", "feedback": "把 $\\angle BAC$ 直接平分了，$AE$，$AF$ 不是角平分线。"}, {"id": "d", "text": "$20^\\circ$", "feedback": "$\\angle B+\\angle C=70^\\circ$，不是 $90^\\circ$。"}], "correct": "b", "answer": "$40^\\circ$", "reasoning": ["$E$ 在 $AB$ 的垂直平分线上，$EA=EB$，所以 $\\angle BAE=\\angle B$；同理 $\\angle CAF=\\angle C$。", "$\\angle B+\\angle C=180^\\circ-110^\\circ=70^\\circ$，所以 $\\angle BAE+\\angle CAF=70^\\circ$。", "$\\angle EAF=\\angle BAC-(\\angle BAE+\\angle CAF)=110^\\circ-70^\\circ=40^\\circ$。"], "contentVersion": "sha256:cf824ae1b02ec9e12370bb7a312ea75fe4a3dfe4ff08688f79109af0028f88be"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
