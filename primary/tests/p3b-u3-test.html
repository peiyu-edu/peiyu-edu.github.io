ack": "长方形的 4 个角都是直角。"}, {"id": "c", "text": "4 条边都一样长，4 个角都是锐角", "feedback": "长方形的 4 个角都是直角，不是锐角。"}], "correct": "a", "pointIds": ["pyps.p3b.u3.001"], "contentVersion": "sha256:097fbb0cc3f23706f4dcbe87866d650e8d40105c9dacc388016d52a651f14758", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"长方形供判断边和角的特点\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><\/svg>"}, {"id": "p3b-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个长方形，长 8 厘米，宽 5 厘米。它的周长是多少厘米？", "answer": "(8 + 5) × 2 = 26（厘米）", "reasoning": ["长方形的周长 = (长 + 宽) × 2。", "8 + 5 = 13（厘米），13 × 2 = 26（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.003"], "contentVersion": "sha256:e5b52d6cc6bf75989b9f221a5bb8a6b73a1ea89b0bd8314c2d8822d376eca696", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形的已知边长及条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">长 8 厘米<\/text><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">宽 5 厘米<\/text><\/svg>"}, {"id": "p3b-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个正方形，边长 7 分米。它的周长是多少分米？", "answer": "7 × 4 = 28（分米）", "reasoning": ["正方形 4 条边一样长。", "周长 = 边长 × 4：7 × 4 = 28（分米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.003"], "contentVersion": "sha256:1ad0ec67b61795862a85258475c3b42ea216a89d920f6354f9dde581308c9953", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形的已知边长及条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"85\" y=\"38\" width=\"110\" height=\"110\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">边长 7 分米<\/text><text x=\"140\" y=\"174\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><\/svg>"}, {"id": "p3b-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "什么叫一个图形的周长？", "answer": "围成这个图形一周的边的长度", "reasoning": ["沿着一个图形的边走一圈，走过的长度就是它的周长。", "所有的边都要算上，一条也不能漏。"], "options": [{"id": "a", "text": "围成这个图形一周的边的长度", "feedback": "对。沿着边走一圈的长度就是周长。"}, {"id": "b", "text": "这个图形最长的一条边的长度", "feedback": "周长要把一周所有的边都算上。"}, {"id": "c", "text": "这个图形里面有多大", "feedback": "那是图形的大小，不是周长。"}], "correct": "a", "pointIds": ["pyps.p3b.u3.002"], "contentVersion": "sha256:897e80274a29175604c28195b82a9d9c76aa65341c4b6091f0355860389fa328", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形的已知边长及条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\" /><\/svg>"}, {"id": "p3b-u3-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个长方形的周长是 30 厘米，长是 9 厘米。它的宽是多少厘米？", "answer": "6 厘米", "reasoning": ["周长是 2 个长加 2 个宽，一个长加一个宽是周长的一半：30 ÷ 2 = 15（厘米）。", "宽：15 − 9 = 6（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.003"], "contentVersion": "sha256:dcaa2fc9afffc34a7b33112ffd29c0268fc62211232db516dc7056c82b9677b3", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"题中图形的已知边长及条件\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"55\" y=\"38\" width=\"170\" height=\"95\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">长 9 厘米<\/text><text x=\"140\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">周长30厘米<\/text><\/svg>"}, {"id": "p3b-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪个图形不是多边形？", "answer": "圆", "reasoning": ["由几条线段围成的封闭图形叫多边形。", "圆的边是弯的曲线，不是线段，所以圆不是多边形。"], "options": [{"id": "a", "text": "圆", "feedback": "对。圆是由曲线围成的，不是由线段围成的。"}, {"id": "b", "text": "长方形", "feedback": "长方形由 4 条线段围成，是四边形，也是多边形。"}, {"id": "c", "text": "五边形", "feedback": "五边形由 5 条线段围成，是多边形。"}], "correct": "a", "pointIds": ["pyps.p3b.u3.001"], "contentVersion": "sha256:946f7737875b6b546064a6755c6b8ad98af03555bae58e8b2ef73cb961632c5b", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"直边和曲边围成的图形供比较\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><circle cx=\"45\" cy=\"80\" r=\"30\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"110\" y=\"50\" width=\"55\" height=\"60\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><path d=\"M225 40L264 68L249 113H201L186 68Z\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"45\" y=\"145\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">A<\/text><text x=\"138\" y=\"145\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">B<\/text><text x=\"225\" y=\"145\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">C<\/text><\/svg>"}, {"id": "p3b-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一块三角形菜地，三条边分别长 12 米、15 米、18 米。沿着菜地围一圈篱笆，篱笆长多少米？", "answer": "45 米", "reasoning": ["围一圈篱笆的长度就是三角形的周长。", "把三条边加起来：12 + 15 + 18 = 45（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.002"], "contentVersion": "sha256:4e06b07c88f9aac21684a0a5963a68dec267c9640243751af90451524321d57e", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 195\" role=\"img\" aria-label=\"三角形菜地仅标题给12米、15米、18米\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><path d=\"M101.875 27.0044L230 140H25Z\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"40\" y=\"80\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">12米<\/text><text x=\"180\" y=\"75\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">15米<\/text><text x=\"130\" y=\"169\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">18米<\/text><\/svg>"}, {"id": "p3b-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用 6 个边长 1 厘米的小正方形拼成一个长方形。怎样拼，长方形的周长最短？", "answer": "拼成 2 行、每行 3 个，周长 10 厘米", "reasoning": ["一行 6 个：长 6 厘米、宽 1 厘米，周长 (6 + 1) × 2 = 14（厘米）。", "两行 3 个：长 3 厘米、宽 2 厘米，周长 (3 + 2) × 2 = 10（厘米）。", "10 厘米更短。"], "options": [{"id": "a", "text": "拼成 1 行、每行 6 个，周长 14 厘米", "feedback": "这样拼又细又长，周长反而长。"}, {"id": "b", "text": "拼成 2 行、每行 3 个，周长 10 厘米", "feedback": "对。拼得越接近正方形，周长越短。"}, {"id": "c", "text": "两种拼法周长一样长", "feedback": "算一算：一种是 10 厘米，一种是 14 厘米，不一样。"}], "correct": "b", "pointIds": ["pyps.p3b.u3.004"], "contentVersion": "sha256:89ca4f492e3ccfdda8492b281ecfa731cf743d8835e40a74dbe5d2321b83d72c", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"6个边长1厘米正方形，未选择拼法\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><text x=\"140\" y=\"23\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">共6个同样的小正方形<\/text><rect x=\"25\" y=\"45\" width=\"38\" height=\"38\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"98\" y=\"57\" width=\"38\" height=\"38\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"171\" y=\"78\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">...<\/text><rect x=\"217\" y=\"40\" width=\"38\" height=\"38\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"140\" y=\"130\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:16px\">边长 1 厘米<\/text><\/svg>"}, {"id": "p3b-u3-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "把两个边长 5 厘米的正方形拼成一个长方形。这个长方形的周长是多少厘米？", "answer": "30 厘米", "reasoning": ["拼成的长方形长 5 + 5 = 10（厘米），宽 5 厘米。", "周长：(10 + 5) × 2 = 30（厘米）。", "拼在一起的那两条边到了里面，不再算在周长里。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.003", "pyps.p3b.u3.002"], "contentVersion": "sha256:920c50ee1ac1f0d6de3a2b29471c8b4181ded2718382a0693b52cb5f53f7609b", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"两个边长5厘米正方形拼成长方形\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:10px auto\"><rect x=\"40\" y=\"35\" width=\"100\" height=\"100\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><rect x=\"140\" y=\"35\" width=\"100\" height=\"100\" style=\"fill:var(--hl-soft);stroke:var(--fg);stroke-width:2\" /><text x=\"90\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">5厘米<\/text><text x=\"190\" y=\"160\" text-anchor=\"middle\" style=\"fill:var(--fg);stroke:none;font-size:17px\">5厘米<\/text><\/svg>"}, {"id": "p3b-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "用 4 个同样的小正方形拼图。每次让两块的整条边完全重合，拼成一个连在一起且不重叠的图形。转一转、翻一翻能重合的算同一种。一共能拼出几种不同形状的四连方？", "answer": "5 种", "reasoning": ["四连方有一字形、田字形、L 形、T 形和 Z 形。", "转一转、翻一翻能重合的算同一种，所以一共 5 种。"], "options": [{"id": "a", "text": "7 种", "feedback": "转一转、翻一翻能重合的只算一种，不能重复
