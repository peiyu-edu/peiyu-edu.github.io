5 笔，每笔记 1 票。"}], "correct": "c", "pointIds": ["pyps.p3b.u5.001"], "contentVersion": "sha256:3be5c4fad1375d5e927e897b51c87ab5bba9a159eb2b77dda2009ba29439406f"}, {"id": "p3b-u5-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "小芳给「最喜欢的水果」唱票，苹果那一栏写了两个完整的「正」字，后面又写了 1 笔「一」。苹果有几票？", "answer": "11 票", "reasoning": ["一个完整的「正」字是 5 票，两个是 10 票。", "再加 1 笔是 1 票：5 + 5 + 1 = 11（票）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u5.001"], "contentVersion": "sha256:ad97c8c8e5931a4ee2a1f56f0df08882ee1a3a7f169b47fbb26e2efd910c0b52"}, {"id": "p3b-u5-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "三（1）班同学最喜欢的活动：足球——男生 12 人、女生 5 人；跳绳——男生 6 人、女生 14 人；画画——男生 4 人、女生 9 人。最喜欢跳绳的一共有多少人？", "answer": "20 人", "reasoning": ["跳绳那一行：男生 6 人，女生 14 人。", "6 + 14 = 20（人）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u5.002"], "contentVersion": "sha256:281214772bc537eb954af46c1135c08e031f08d6fd3969156817aa9ce384082c"}, {"id": "p3b-u5-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "三（1）班同学最喜欢的活动：足球——男生 12 人、女生 5 人；跳绳——男生 6 人、女生 14 人；画画——男生 4 人、女生 9 人。参加调查的女生一共有多少人？", "answer": "28 人", "reasoning": ["女生那一列：足球 5 人、跳绳 14 人、画画 9 人。", "5 + 14 + 9 = 28（人）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u5.002"], "contentVersion": "sha256:d2bc76080669d2a5f960765b0064e7be66d5dbdb0616e2f83d301847ad207d83"}, {"id": "p3b-u5-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "三（1）班同学最喜欢的活动：足球——男生 12 人、女生 5 人；跳绳——男生 6 人、女生 14 人；画画——男生 4 人、女生 9 人。最喜欢画画的女生比男生多几人？", "answer": "5 人", "reasoning": ["画画：女生 9 人，男生 4 人。", "9 − 4 = 5（人）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u5.002"], "contentVersion": "sha256:41c4f69f8f60ee10cf0241dcc6335935c6b34f6ddc0d207df6d34057bb2cbaf2"}, {"id": "p3b-u5-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "三（1）班同学最喜欢的活动：足球——男生 12 人、女生 5 人；跳绳——男生 6 人、女生 14 人；画画——男生 4 人、女生 9 人。男生、女生合起来看，哪项活动最受欢迎？", "answer": "跳绳", "reasoning": ["足球：12 + 5 = 17（人）。", "跳绳：6 + 14 = 20（人）。", "画画：4 + 9 = 13（人）。", "跳绳人数最多。"], "options": [{"id": "a", "text": "跳绳", "feedback": "对。跳绳一共 20 人，最多。"}, {"id": "b", "text": "足球", "feedback": "足球男生最多，但合起来只有 17 人，比跳绳少。"}, {"id": "c", "text": "画画", "feedback": "画画合起来 13 人，最少。"}], "correct": "a", "pointIds": ["pyps.p3b.u5.002"], "contentVersion": "sha256:b8596617d3e9f0dcd9d0fb573d9844cebf3d28fc3a64c61cae119f0158d3536c"}, {"id": "p3b-u5-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "10 名同学 1 分钟跳绳的个数：85、102、96、110、78、120、99、105、91、88。按「100 个及以上」和「不到 100 个」分成两段，每段各有几人？", "answer": "100 个及以上 4 人，不到 100 个 6 人", "reasoning": ["100 个及以上：102、110、120、105，有 4 人。", "不到 100 个：85、96、78、99、91、88，有 6 人。", "核对：4 + 6 = 10（人），正好是 10 名同学。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u5.003"], "contentVersion": "sha256:2ca6f15e5ec2f04eb848b958f319032a15cf7c1664d5b34386dd01203bbcb28e"}, {"id": "p3b-u5-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "10 名同学 1 分钟跳绳的个数：85、102、96、110、78、120、99、105、91、88。按「不到 80 个」「80～99 个」「100 个及以上」分成三段，每段各有几人？", "answer": "不到 80 个 1 人，80～99 个 5 人，100 个及以上 4 人", "reasoning": ["不到 80 个：78，有 1 人。", "80～99 个：85、96、99、91、88，有 5 人。", "100 个及以上：102、110、120、105，有 4 人。", "核对：1 + 5 + 4 = 10（人）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u5.003"], "contentVersion": "sha256:10047c67f71fce0fc8b87bc897f9e029dd764dfd4f98d37c1fa9c4e926892700"}, {"id": "p3b-u5-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "图书角借书情况：故事书——上周 23 本、本周 31 本；科技书——上周 18 本、本周 25 本。(1) 两周一共借出科技书多少本？(2) 本周借出的书比上周一共多多少本？", "answer": "(1) 43 本；(2) 15 本", "reasoning": ["(1) 科技书：18 + 25 = 43（本）。", "(2) 上周一共 23 + 18 = 41（本），本周一共 31 + 25 = 56（本）。", "56 − 41 = 15（本）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u5.002", "pyps.p3b.u5.001"], "contentVersion": "sha256:6678f0ee5ce2dae1708bed3176786d982e9732ba26330cb936883ee82e68a24e"}, {"id": "p3b-u5-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "10 名同学 1 分钟跳绳的个数：85、102、96、110、78、120、99、105、91、88。按「100 个及以上」和「不到 100 个」分段后，下面哪句话对？", "answer": "不到 100 个的人数比 100 个及以上的多 2 人", "reasoning": ["100 个及以上有 4 人，不到 100 个有 6 人。", "6 − 4 = 2（人），不到 100 个的多 2 人。"], "options": [{"id": "a", "text": "不到 100 个的人数比 100 个及以上的多 2 人", "feedback": "对。不到 100 个有 6 人，100 个及以上有 4 人。"}, {"id": "b", "text": "100 个及以上的人数更多", "feedback": "100 个及以上只有 4 人，比不到 100 个的少。"}, {"id": "c", "text": "两段人数一样多", "feedback": "数一数：一段 6 人，一段 4 人，不一样多。"}], "correct": "a", "pointIds": ["pyps.p3b.u5.003"], "contentVersion": "sha256:ee744a469af0116d0dd15954828ba641cee34a32ba3280552639df908d257ed4"}], "contentVersion": "sha256:ec05d602d98a8f72e4685ffcfe3209bd14f33bc5cce7044825f910782957df97"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
