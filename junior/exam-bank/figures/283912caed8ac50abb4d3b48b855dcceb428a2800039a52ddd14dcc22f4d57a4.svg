<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 230" role="img"><title>正方体展开图</title><desc>正方体展开图：建、美、丽、中横排，共在建上方，国在中下方。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><rect x="45" y="85" width="60" height="60"></rect><text x="75" y="123">建</text><rect x="105" y="85" width="60" height="60"></rect><text x="135" y="123">美</text><rect x="165" y="85" width="60" height="60"></rect><text x="195" y="123">丽</text><rect x="225" y="85" width="60" height="60"></rect><text x="255" y="123">中</text><rect x="45" y="25" width="60" height="60"></rect><text x="75" y="63">共</text><rect x="225" y="145" width="60" height="60"></rect><text x="255" y="183">国</text></svg>
