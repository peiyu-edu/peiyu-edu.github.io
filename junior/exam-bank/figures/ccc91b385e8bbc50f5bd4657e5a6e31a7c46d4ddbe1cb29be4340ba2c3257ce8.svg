<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 50 380 350" role="img" aria-labelledby="title desc"><title id="title">圆O与平行四边形CDEF</title><desc id="desc">圆O的直径AB水平，O处画实心点；C在圆上方，连接CA、CB。平行四边形CDEF中，A在边CD上靠近D，B在边CF上靠近F；DE、EF分别与圆O相切于M、N，连接OM、ON。</desc><style>path,circle{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.p{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><circle cx="230" cy="200" r="110"/><path d="M260.8,94.4L102.4,213.2L208,354L366.4,235.2Z"/><path d="M120,200H340M142,266L230,200L296,288"/><circle class="p" cx="230" cy="200" r="3.5"/><text x="254" y="84" font-size="20">C</text><text x="98" y="196" font-size="20">A</text><text x="222" y="188" font-size="20">O</text><text x="346" y="196" font-size="20">B</text><text x="78" y="226" font-size="20">D</text><text x="374" y="244" font-size="20">F</text><text x="116" y="284" font-size="20">M</text><text x="300" y="312" font-size="20">N</text><text x="200" y="384" font-size="20">E</text></svg>
