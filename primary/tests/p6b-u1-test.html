<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年级下册 第一单元 负数 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p6b-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>六年级下册 第一单元 负数 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p6b-u1-test", "sectionId": "p6b-u1-test", "unitId": "p6b-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "六年级下册 第一单元 负数 单元测评", "items": [{"id": "p6b-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "如果收入 500 元记作 +500 元，那么支出 300 元记作什么？", "answer": "−300 元", "reasoning": ["收入和支出是意义相反的量。", "收入记作正，支出就记作负：支出 300 元记作 −300 元。"], "options": [{"id": "a", "text": "300 元", "feedback": "不写符号的 300 是正数，和 +300 一样，表示收入。"}, {"id": "b", "text": "−300 元", "feedback": "对。收入记正，和它意义相反的支出记负。"}, {"id": "c", "text": "−500 元", "feedback": "支出应记负，但支出的金额是 300 元，不能照抄收入的 500 元。"}], "correct": "b", "pointIds": ["pyps.p6b.u1.001"], "contentVersion": "sha256:19438a9b1b713173b2ebe8100374d9ebce447e26e2c20329165eff1931197fda"}, {"id": "p6b-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面关于 0 的说法，哪句是对的？", "answer": "0 既不是正数，也不是负数", "reasoning": ["比 0 大的数是正数，比 0 小的数是负数。", "0 是分界，既不是正数，也不是负数。"], "options": [{"id": "a", "text": "0 是正数", "feedback": "正数都比 0 大，0 自己不是正数。"}, {"id": "b", "text": "0 是负数", "feedback": "负数都比 0 小，0 自己不是负数。"}, {"id": "c", "text": "0 既不是正数，也不是负数", "feedback": "对。0 是正数和负数的分界。"}], "correct": "c", "pointIds": ["pyps.p6b.u1.002"], "contentVersion": "sha256:f924668b5602795d78dec1b39e56f85d2727e19e0e1247a5a213338f1c69451d"}, {"id": "p6b-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "在 −3，+5，0，−0.8，7/9，−1/2 中，正数有 □，负数有 □。", "answer": "正数有 +5，7/9；负数有 −3，−0.8，−1/2", "reasoning": ["前面有「−」的数是负数：−3，−0.8，−1/2。", "+5 和 7/9 是正数（7/9 前面省略了「+」）。", "0 既不是正数也不是负数，两边都不填。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u1.002"], "contentVersion": "sha256:d42c2cae0228e2cf97088a15d7ba3d611355c443a4da7160e449638eb33313ad"}, {"id": "p6b-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "在数轴上，点 A 在 0 的左边，离 0 有 3 个单位长度。点 A 表示的数是多少？", "answer": "−3", "reasoning": ["数轴上 0 的右边是正数，左边是负数。", "离 0 有 3 个单位长度，点 A 表示 −3。"], "options": [{"id": "a", "text": "−2", "feedback": "要数到离 0 有 3 个单位长度的地方，是 −3。"}, {"id": "b", "text": "3", "feedback": "3 在 0 的右边。0 的左边表示负数。"}, {"id": "c", "text": "−3", "feedback": "对。0 的左边是负数，离 0 有 3 个单位长度，就是 −3。"}], "correct": "c", "pointIds": ["pyps.p6b.u1.003"], "contentVersion": "sha256:ee99cf675623518faec8dfec4602d5e5873d7338f35b3e1c08b8a65575ad9c17", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"数轴思考支架，仅标原点及题干已知位置\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M25,75 L255,75\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><path d=\"M247,69 L255,75 L247,81\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><path d=\"M35,70 L35,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M56,70 L56,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M77,70 L77,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M98,70 L98,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M119,70 L119,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M140,70 L140,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M161,70 L161,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M182,70 L182,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M203,70 L203,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M224,70 L224,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M245,70 L245,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><text x=\"140\" y=\"103\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">0<\/text><circle cx=\"77\" cy=\"75\" r=\"3\" style=\"fill:var(--b);stroke:var(--b);stroke-width:2\"/><text x=\"77\" y=\"55\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">A<\/text><text x=\"140\" y=\"140\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">A 在 0 左边 3 个单位<\/text><\/svg>"}, {"id": "p6b-u1-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "−4 和 −1，哪个数大？", "answer": "−1 大", "reasoning": ["把 −4 和 −1 画在数轴上。", "−1 在 −4 的右边，数轴上右边的数大，所以 −1 > −4。"], "options": [{"id": "a", "text": "−1 大", "feedback": "对。在数轴上 −1 在 −4 的右边，右边的数大。"}, {"id": "b", "text": "−4 大", "feedback": "在数轴上 −4 在 −1 的左边，左边的数小。"}, {"id": "c", "text": "一样大", "feedback": "−4 和 −1 在数轴上是两个不同的点，不一样大。"}], "correct": "a", "pointIds": ["pyps.p6b.u1.004"], "contentVersion": "sha256:9a459a55048b47c7c312eef412dbc06989165fcd3594e247be6f25c803159f49", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"数轴思考支架，仅标原点及题干已知位置\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M25,75 L255,75\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><path d=\"M247,69 L255,75 L247,81\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><path d=\"M35,70 L35,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M56,70 L56,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M77,70 L77,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M98,70 L98,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M119,70 L119,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M140,70 L140,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M161,70 L161,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M182,70 L182,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M203,70 L203,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M224,70 L224,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M245,70 L245,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><text x=\"140\" y=\"103\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">0<\/text><text x=\"140\" y=\"140\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">比较 −4 和 −1<\/text><\/svg>"}, {"id": "p6b-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "如果 −20 元表示支出 20 元，那么 +50 元表示什么？", "answer": "收入 50 元", "reasoning": ["−20 元表示支出，负数表示支出。", "正数就表示和支出意义相反的收入。", "+50 元表示收入 50 元。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u1.001"], "contentVersion": "sha256:0d73b73c45d589bc98ef85ff62ac10bae536d0c949863742a3ae02e39ce8885b"}, {"id": "p6b-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在数轴上，−2 和 3 之间（不算 −2 和 3）有几个整数？", "answer": "4 个（−1，0，1，2）", "reasoning": ["在数轴上从 −2 往右数到 3。", "中间的整数有 −1，0，1，2。", "一共 4 个。别忘了 0 也是整数。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u1.003"], "contentVersion": "sha256:09c90d2843d3d5af734477e3499274c86309430d818b095da7394f4c81016788", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"数轴思考支架，仅标原点及题干已知位置\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M30,70 L250,70\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><text x=\"55\" y=\"103\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">−2<\/text><text x=\"225\" y=\"103\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">3<\/text><text x=\"140\" y=\"77\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">…<\/text><\/svg>"}, {"id": "p6b-u1-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一种饼干的包装袋上写着「净含量（200 ± 5）克」。这表示净含量最多比 200 克多 5 克或少 5 克。下面哪一袋不合格？", "answer": "207 克", "reasoning": ["「200 ± 5」表示净含量与 200 克相差不超过 5 克。", "合格范围是 195 克到 205 克。", "207 克超过了 205 克，不合格。"], "options": [{"id": "a", "text": "204 克", "feedback": "200 + 5 = 205，204 克比 205 克少，在合格范围里。"}, {"id": "b", "text": "207 克", "feedback": "对。最多只能是 200 + 5 = 205 克，207 克超出了。"}, {"id": "c", "text": "196 克", "feedback": "200 − 5 = 195，196 克比 195 克多，在合格范围里。"}], "correct": "b", "pointIds": ["pyps.p6b.u1.001"], "contentVersion": "sha256:7ebd6aecc11857e6e3b24997a2ec615d285ee4ca64973c28b2b3ef12b8fa38b3"}, {"id": "p6b-u1-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "把 −2，3，0，−5，1 按从小到大的顺序排列。", "answer": "−5 < −2 < 0 < 1 < 3", "reasoning": ["把这些数都画在数轴上，从左往右读就是从小到大。", "负数在 0 的左边，−5 在 −2 的左边。", "−5 < −2 < 0 < 1 < 3。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u1.004", "pyps.p6b.u1.003"], "contentVersion": "sha256:e1f83d7d6acb699ca490c2804621c3a99302778c79f75a2909a0eb60a71fdf4a", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 170\" role=\"img\" aria-label=\"数轴思考支架，仅标原点及题干已知位置\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M25,75 L255,75\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><path d=\"M247,69 L255,75 L247,81\" style=\"fill:none;stroke:var(--fg);stroke-width:2\"/><path d=\"M35,70 L35,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M56,70 L56,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M77,70 L77,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M98,70 L98,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M119,70 L119,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M140,70 L140,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M161,70 L161,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M182,70 L182,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M203,70 L203,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M224,70 L224,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><path d=\"M245,70 L245,80\" style=\"fill:none;stroke:var(--muted);stroke-width:2\"/><text x=\"140\" y=\"103\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">0<\/text><text x=\"140\" y=\"140\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">待排列：−2，3，0，−5，1<\/text><\/svg>"}, {"id": "p6b-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "以学校为 0 点，向东为正。小明家在学校东边 300 米，记作 +300 米；小丽家记作 −200 米。小丽家在学校的哪一边？两家相距多少米？", "answer": "小丽家在学校西边 200 米处；两家相距 500 米", "reasoning": ["向东为正，−200 米表示向西 200 米，小丽家在学校西边。", "两家分别在学校的两边。", "相距 300 + 200 = 500（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u1.003", "pyps.p6b.u1.001"], "contentVersion": "sha256:47a1696d01afbf2d1fd08a3ad177173ed9b7e3817457a314a1b0436202e49161", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 200\" role=\"img\" aria-label=\"东西方向与两家相对学校的已知记录\" style=\"width:100%;max-width:280px;height:auto;display:block;margin:8px auto\"><path d=\"M35,70 L245,70\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><circle cx=\"120\" cy=\"70\" r=\"3\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><text x=\"120\" y=\"52\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">学校 0<\/text><text x=\"50\" y=\"110\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">西<\/text><text x=\"230\" y=\"110\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">东<\/text><text x=\"140\" y=\"150\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">小明家 +300 米<\/text><text x=\"140\" y=\"175\" text-anchor=\"middle\" style=\"font-size:17px;fill:var(--fg)\">小丽家 −200 米<\/text><\/svg>"}], "contentVersion": "sha256:cbf2f6a487839f2fa537194679b32cf57ff3c17e55ed68962552c6f1a691a966"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
