<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 350" width="430" height="350" role="img" aria-labelledby="title desc">
<title id="title">第二象限内的线段 OA</title>
<desc id="desc">平面直角坐标系，点 A 在第二象限，线段 OA 从原点 O 连到点 A。坐标轴上没有刻度。</desc>
<style>text { fill:#17202a; font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; font-size:28px; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .sub { font-size:21px; }</style>
<rect width="430" height="350" fill="white"/>
<line x1="20" y1="250" x2="404" y2="250" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="420,250 404,243 404,257" fill="#17202a"/>
<line x1="190" y1="340" x2="190" y2="36" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="190,20 183,36 197,36" fill="#17202a"/>
<line x1="190" y1="250" x2="78" y2="82" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="72" y="80" text-anchor="end" class="m">A</text>
<text x="162" y="284" text-anchor="start" class="m">O</text>
<text x="400" y="284" text-anchor="start" class="m">x</text>
<text x="160" y="44" text-anchor="start" class="m">y</text>
</svg>
