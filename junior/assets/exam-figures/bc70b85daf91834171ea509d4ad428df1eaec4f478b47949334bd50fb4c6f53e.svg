<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585 250" width="585" height="250" role="img" aria-labelledby="title desc">
<title id="title">数轴上两个不等式的解集</title>
<desc id="desc">刻度从 −2 到 4 的数轴上画了两个解集：一个从 2 处的空心圆圈向上再向右画线，另一个从 3 处的实心圆点向上再向右画线。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="585" height="250" fill="white"/>
<line x1="20.0" y1="190.0" x2="570.0" y2="190.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="570.0,190.0 554.0,197.0 554.0,183.0" fill="#17202a"/>
<line x1="60.0" y1="190.0" x2="60.0" y2="180.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="60.0" y="230.0" class="n" text-anchor="middle">−2</text>
<line x1="135.0" y1="190.0" x2="135.0" y2="180.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="135.0" y="230.0" class="n" text-anchor="middle">−1</text>
<line x1="210.0" y1="190.0" x2="210.0" y2="180.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="210.0" y="230.0" class="n" text-anchor="middle">0</text>
<line x1="285.0" y1="190.0" x2="285.0" y2="180.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="285.0" y="230.0" class="n" text-anchor="middle">1</text>
<text x="360.0" y="230.0" class="n" text-anchor="middle">2</text>
<text x="435.0" y="230.0" class="n" text-anchor="middle">3</text>
<line x1="510.0" y1="190.0" x2="510.0" y2="180.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<text x="510.0" y="230.0" class="n" text-anchor="middle">4</text>
<line x1="360.0" y1="181.0" x2="360.0" y2="60.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="360.0" y1="60.0" x2="534.0" y2="60.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="435.0" y1="181.0" x2="435.0" y2="110.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<line x1="435.0" y1="110.0" x2="531.0" y2="110.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="360.0" cy="190.0" r="8" fill="white" stroke="#17202a" stroke-width="2.5"/>
<circle cx="435.0" cy="190.0" r="8" fill="#17202a" stroke="#17202a" stroke-width="2.5"/>
</svg>
