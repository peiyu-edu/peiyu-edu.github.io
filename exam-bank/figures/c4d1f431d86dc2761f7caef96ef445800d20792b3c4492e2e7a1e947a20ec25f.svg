<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 710" role="img" aria-labelledby="title desc"><title id="title">循环程序框图</title><desc id="desc">输入k、a后依次执行a=2a+1、k=k+1，再判断a>10；否分支返回a的赋值，是分支输出k并结束。</desc><style>svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}path,line,rect,polyline{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;font:24px Georgia,serif}.cjk{font-family:"Noto Sans CJK SC",serif}.dash{stroke-dasharray:7 5}.arrow{fill:currentColor;stroke:none}.black{fill:#070d11;stroke:currentColor}</style><rect x="155" y="15" width="130" height="45" rx="22"/><path d="M145 95 H305 L290 145 H130 Z"/><rect x="140" y="195" width="160" height="50"/><rect x="140" y="295" width="160" height="50"/><path d="M220 390 L300 430 L220 470 L140 430 Z M150 535 H305 L290 585 H135 Z"/><rect x="155" y="635" width="130" height="45" rx="22"/><path d="M220 60 V95"/><path class="arrow" d="M220 95 l-5 -12 h10 Z"/><path d="M220 145 V195"/><path class="arrow" d="M220 195 l-5 -12 h10 Z"/><path d="M220 245 V295"/><path class="arrow" d="M220 295 l-5 -12 h10 Z"/><path d="M220 345 V390"/><path class="arrow" d="M220 390 l-5 -12 h10 Z"/><path d="M220 470 V535"/><path class="arrow" d="M220 535 l-5 -12 h10 Z"/><path d="M220 585 V635"/><path class="arrow" d="M220 635 l-5 -12 h10 Z"/><path d="M140 430 H80 V175 H220"/><path class="arrow" d="M220 175 l-12 -5 v10 Z"/><text class="cjk" x="220" y="46" text-anchor="middle">开始</text><text class="cjk" x="220" y="128" text-anchor="middle">输入k,a</text><text class="" x="220" y="230" text-anchor="middle">a=2a+1</text><text class="" x="220" y="330" text-anchor="middle">k=k+1</text><text class="" x="220" y="438" text-anchor="middle">a&gt;10</text><text class="cjk" x="220" y="568" text-anchor="middle">输出k</text><text class="cjk" x="220" y="667" text-anchor="middle">结束</text><text class="cjk" x="110" y="414">否</text><text class="cjk" x="238" y="513">是</text></svg>
