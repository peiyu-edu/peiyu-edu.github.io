<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级上册 第五单元 20以内的进位加法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p1a-u5-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级上册 第五单元 20以内的进位加法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1a-u5-test", "sectionId": "p1a-u5-test", "unitId": "p1a-u5", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级上册 第五单元 20以内的进位加法 单元测评", "items": [{"id": "p1a-u5-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "9 + 5 = □", "answer": "14", "reasoning": ["把 5 分成 1 和 4。", "9 + 1 = 10，10 + 4 = 14。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u5.001"], "contentVersion": "sha256:c02cfb32a3b1b4599b80cf9bbc76cde8391268648e583fb2a2199770a0919b31"}, {"id": "p1a-u5-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "8 + 6 = □", "answer": "14", "reasoning": ["8 再加 2 就是 10，把 6 分成 2 和 4。", "8 + 2 = 10，10 + 4 = 14。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u5.002"], "contentVersion": "sha256:8a1a6950d0a5b5eb60b4273050998a36fa5a72a9c5c30a214d6215451859006f"}, {"id": "p1a-u5-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "7 + 5 = ？", "answer": "12", "reasoning": ["7 再加 3 就是 10，把 5 分成 3 和 2。", "7 + 3 = 10，10 + 2 = 12。"], "options": [{"id": "a", "text": "11", "feedback": "7 再加 3 才是 10，5 分成 3 和 2，10 + 2 = 12。"}, {"id": "b", "text": "13", "feedback": "多加了 1。5 分成 3 和 2，不是 3 和 3。"}, {"id": "c", "text": "12", "feedback": "对。7 + 3 = 10，10 + 2 = 12。"}], "correct": "c", "pointIds": ["pyps.p1a.u5.002"], "contentVersion": "sha256:fb365ba866d1594d1be086343f25f718c768b78edb560a5e2d4eb411446cc79e"}, {"id": "p1a-u5-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "4 + 9 = □", "answer": "13", "reasoning": ["可以想 9 + 4：把 4 分成 1 和 3，9 + 1 = 10，10 + 3 = 13。", "两个数换了位置，得数不变，所以 4 + 9 = 13。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u5.004"], "contentVersion": "sha256:9788c9b0e0478f29de4048879b420dd812ae85a304295d6f8d1a27886e45cd1e"}, {"id": "p1a-u5-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "已经知道 6 + 8 = 14。不用再算，8 + 6 = □", "answer": "14", "reasoning": ["8 + 6 和 6 + 8 只是两个数换了位置。", "两个数换了位置，得数不变，还是 14。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u5.003"], "contentVersion": "sha256:95c9a96e6f3a2f0f33dfff681a882647d11c767b7f373f7d07341747f86629fc"}, {"id": "p1a-u5-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "算 9 + 7 时，先凑成 10。应该把 7 分成几和几？", "answer": "1 和 6", "reasoning": ["9 再加 1 就是 10，所以先从 7 里拿出 1。", "7 分成 1 和 6，9 + 1 = 10，10 + 6 = 16。"], "options": [{"id": "a", "text": "3 和 4", "feedback": "9 + 3 = 12，也没有正好凑成 10。"}, {"id": "b", "text": "1 和 6", "feedback": "对。9 + 1 = 10，再加 6 得 16。"}, {"id": "c", "text": "2 和 5", "feedback": "9 + 2 = 11，没有正好凑成 10。"}], "correct": "b", "pointIds": ["pyps.p1a.u5.001"], "contentVersion": "sha256:2bc2485573407d6fef2cd2fb8efbe8971955c97d6bdf44324e1215aaeebda553"}, {"id": "p1a-u5-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在 □ 里填数：8 + □ = 13", "answer": "5", "reasoning": ["8 先加 2 是 10，10 再加 3 是 13。", "一共加了 2 和 3，2 + 3 = 5，所以填 5。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u5.002"], "contentVersion": "sha256:839481fd47d4fe05f8323ab6a16ba7d76a682d2b8c5aecbae7372162991ce8d9"}, {"id": "p1a-u5-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "在 ○ 里应该填什么？ 7 + 6 ○ 14", "answer": "<", "reasoning": ["先算左边：7 + 3 = 10，10 + 3 = 13。", "13 比 14 小，填 <。"], "options": [{"id": "a", "text": "<", "feedback": "对。7 + 6 = 13，13 比 14 小。"}, {"id": "b", "text": ">", "feedback": "先算左边：7 + 6 = 13，13 比 14 小。"}, {"id": "c", "text": "=", "feedback": "7 + 6 = 13，不等于 14。"}], "correct": "a", "pointIds": ["pyps.p1a.u5.002", "pyps.p1a.u4.003"], "contentVersion": "sha256:3dc208c8dbab58b30f6e19ae8889fa21603b13170f03a56ea21ac1a0049b0c69"}, {"id": "p1a-u5-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "哪个算式的得数和 9 + 6 一样？", "answer": "8 + 7", "reasoning": ["9 + 6：9 + 1 = 10，10 + 5 = 15。", "8 + 7：8 + 2 = 10，10 + 5 = 15。两个得数都是 15。"], "options": [{"id": "a", "text": "8 + 6", "feedback": "8 + 6 = 14，9 + 6 = 15，不一样。"}, {"id": "b", "text": "8 + 7", "feedback": "对。8 + 7 = 15，9 + 6 也是 15。"}, {"id": "c", "text": "9 + 5", "feedback": "9 + 5 = 14，比 9 + 6 少 1。"}], "correct": "b", "pointIds": ["pyps.p1a.u5.002", "pyps.p1a.u5.001"], "contentVersion": "sha256:9e38923474797e699ed0ce2e8975393018f27c6a9e54aaa635f94c0d0b7ff981"}, {"id": "p1a-u5-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "盘子里有 5 个红苹果和 7 个青苹果。这些苹果里，大的有 8 个，小的有 4 个。按颜色分列一个算式，按大小分再列一个算式，算一算一共有几个苹果。", "answer": "5 + 7 = 12（个），8 + 4 = 12（个），一共有 12 个苹果", "reasoning": ["按颜色分：红的 5 个，青的 7 个，5 + 7 = 12。", "按大小分：大的 8 个，小的 4 个，8 + 4 = 12。", "分法不同，都是求一共，都用加法，得数一样。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u5.005"], "contentVersion": "sha256:aa3154e12b5a4f683352339fc1c88297e6a92a6fb9e00deec1cae9fc8e9cecdf"}, {"id": "p1a-u5-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "兰兰送给同学 6 张贴画，自己还剩 7 张。兰兰原来有几张贴画？", "answer": "6 + 7 = 13（张）", "reasoning": ["原来的贴画分成了两部分：送出去的 6 张和剩下的 7 张。", "求原来有几张，就是把两部分合起来：6 + 7 = 13（张）。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u5.006"], "contentVersion": "sha256:ff6dc2ec604ec1b969b30e4c37019fa0669b8d972249626605aa8f89f0e9caae"}, {"id": "p1a-u5-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "7 + 8 = □，9 + 6 = □。两个算式的得数一样吗？", "answer": "15，15，一样", "reasoning": ["7 + 8：把 8 分成 3 和 5，7 + 3 = 10，10 + 5 = 15。", "9 + 6：把 6 分成 1 和 5，9 + 1 = 10，10 + 5 = 15。", "两个算式的得数都是 15，得数一样。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u5.002", "pyps.p1a.u4.003"], "contentVersion": "sha256:3fae101b34d111daaccef5874ab039e4097a919be506d59274733eb82ab10e44"}], "contentVersion": "sha256:6ac1966523cf5111ff46273edc8fd099098059ff6118c31f14496be8cecac088"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
