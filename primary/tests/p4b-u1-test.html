<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级下册 第一单元 四则运算 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p4b-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>四年级下册 第一单元 四则运算 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p4b-u1-test", "sectionId": "p4b-u1-test", "unitId": "p4b-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "四年级下册 第一单元 四则运算 单元测评", "items": [{"id": "p4b-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "已知 527 + 268 = 795，下面哪个算式一定成立？", "answer": "795 − 268 = 527", "reasoning": ["527 和 268 是加数，795 是和。", "一个加数 = 和 − 另一个加数，所以 795 − 268 = 527。"], "options": [{"id": "a", "text": "527 − 268 = 795", "feedback": "527 比 795 小，减去 268 不可能得 795。"}, {"id": "b", "text": "795 + 268 = 527", "feedback": "和再加上一个加数，只会更大，不会变回 527。"}, {"id": "c", "text": "795 − 268 = 527", "feedback": "对。和减去一个加数，等于另一个加数。"}], "correct": "c", "pointIds": ["pyps.p4b.u1.001"], "contentVersion": "sha256:3d6306e9de4af1b37a52279b05e18c1a4f3a609bb6c9342a813819dcbe306801"}, {"id": "p4b-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "□ ÷ 6 = 14，□ 是多少？", "answer": "84", "reasoning": ["被除数 = 商 × 除数。", "14 × 6 = 84，所以 □ = 84。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u1.003"], "contentVersion": "sha256:d0622da173487ad9eb3b60241ced94698a25e31a11351e1be1db969dd6bc5a5f"}, {"id": "p4b-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "100 ÷ 7 = 14……2。用乘法检验，写出检验的算式。", "answer": "14 × 7 + 2 = 100", "reasoning": ["有余数的除法：商 × 除数 + 余数 = 被除数。", "14 × 7 = 98，98 + 2 = 100，回到了被除数，说明算对了。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u1.004"], "contentVersion": "sha256:af6cbcb37bdaa4086b459f1dc57b4010dce6887e17418ac6bcfb3bacd050dc0a"}, {"id": "p4b-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪个算式不能计算？", "answer": "5 ÷ 0", "reasoning": ["想 □ × 0 = 5：任何数乘 0 都得 0，找不到这样的 □。", "所以 5 ÷ 0 不能计算，0 不能作除数。"], "options": [{"id": "a", "text": "5 ÷ 0", "feedback": "对。0 不能作除数。"}, {"id": "b", "text": "0 ÷ 5", "feedback": "0 平均分成 5 份，每份是 0，可以算。"}, {"id": "c", "text": "5 × 0", "feedback": "任何数乘 0 都得 0，可以算。"}], "correct": "a", "pointIds": ["pyps.p4b.u1.006"], "contentVersion": "sha256:0357011ea4dc438c1660b29a04632a92f68a57bcd183a05248f9959d58404725"}, {"id": "p4b-u1-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：150 − (36 + 24) × 2。", "answer": "30", "reasoning": ["先算小括号里的：36 + 24 = 60。", "再算乘法：60 × 2 = 120。", "最后算减法：150 − 120 = 30。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u1.007"], "contentVersion": "sha256:c31179df495f3d7852750fd86ace9745293168273eb1f54b116355000d42e089"}, {"id": "p4b-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "计算：504 ÷ [3 × (8 − 5)]。", "answer": "56", "reasoning": ["先算小括号：8 − 5 = 3。", "再算中括号：3 × 3 = 9。", "最后算除法：504 ÷ 9 = 56。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u1.007"], "contentVersion": "sha256:66bec8adf5b22d2cc2c336fc0ec0a20dc5998e6086cdd6740a5b858aab063a05"}, {"id": "p4b-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "先算 96 − 48 = 48，再算 48 × 3 = 144。合成一道综合算式，正确的是哪一个？", "answer": "(96 − 48) × 3", "reasoning": ["原来是先减后乘，可乘法本来就比减法先算。", "要让减法先算，就给 96 − 48 加上小括号：(96 − 48) × 3。"], "options": [{"id": "a", "text": "96 − (48 × 3)", "feedback": "括号里是乘法，还是先算乘，顺序不对。"}, {"id": "b", "text": "(96 − 48) × 3", "feedback": "对。先算的减法放进小括号里。"}, {"id": "c", "text": "96 − 48 × 3", "feedback": "这样要先算 48 × 3，和原来先算减法的顺序不同。"}], "correct": "b", "pointIds": ["pyps.p4b.u1.008"], "contentVersion": "sha256:1bee184624d6fce07c024f41dcf4676f59da7d6a8fcaa147947f9da4776f2da2"}, {"id": "p4b-u1-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "填一填：0 ÷ 9 = □，9 × 0 = □，0 + 9 = □。", "answer": "0，0，9", "reasoning": ["0 除以一个不是 0 的数，得 0。", "一个数乘 0，得 0。", "一个数加 0，还得原数，0 + 9 = 9。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u1.005"], "contentVersion": "sha256:c10bc2c5dfd2efede333c112b69b3c5a9857730029779860ead516f510ef34ba"}, {"id": "p4b-u1-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "34 名同学去划船。大船每条坐 6 人，租金 30 元；小船每条坐 4 人，租金 24 元。怎样租船最省钱？一共要多少元？", "answer": "租 5 条大船、1 条小船，一共 174 元", "reasoning": ["固定大船条数，再配够坐的小船；小船有空座也按整条收费，多租小船只会更贵。逐项列出费用：", "0 条大船、9 条小船：4 × 9 = 36（个座位），24 × 9 = 216（元）。", "1 条大船、7 条小船：6 + 4 × 7 = 34（个座位），30 + 24 × 7 = 198（元）。", "2 条大船、6 条小船：6 × 2 + 4 × 6 = 36（个座位），30 × 2 + 24 × 6 = 204（元）。", "3 条大船、4 条小船：6 × 3 + 4 × 4 = 34（个座位），30 × 3 + 24 × 4 = 186（元）。", "4 条大船、3 条小船：6 × 4 + 4 × 3 = 36（个座位），30 × 4 + 24 × 3 = 192（元）。", "5 条大船、1 条小船：6 × 5 + 4 = 34（个座位），30 × 5 + 24 = 174（元）。", "6 条大船、0 条小船：6 × 6 = 36（个座位），30 × 6 = 180（元）。", "6 条大船已经够坐；租 7 条或更多大船，仅大船费用就超过 180 元，不会最省。比较以上费用，174 元最少，所以租 5 条大船、1 条小船。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u1.009", "pyps.p4b.u1.007"], "contentVersion": "sha256:8bd619b280197978cbae8257ba991deda43ac257ca7c9d5335bc29a7ca995d52"}, {"id": "p4b-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "食堂运来 360 千克大米，前 4 天每天吃 45 千克，剩下的要 3 天吃完。平均每天要吃多少千克？先列综合算式再计算。", "answer": "(360 − 45 × 4) ÷ 3 = 60（千克）", "reasoning": ["前 4 天吃了 45 × 4 = 180（千克）。", "还剩 360 − 180 = 180（千克）。", "平均每天吃 180 ÷ 3 = 60（千克）。", "列成综合算式：(360 − 45 × 4) ÷ 3。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u1.008", "pyps.p4b.u1.007"], "contentVersion": "sha256:35ef4dbde793e4b96ccfc1355adb67e28955b472a0834fd894a64eb2f71525c3"}, {"id": "p4b-u1-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "小红算 1000 − 368 − 245，得 387。下面哪种检验做完整了？", "answer": "算 387 + 245 + 368，得 1000，说明算对了", "reasoning": ["连续减了两次，检验时要把两个减数都加回去。", "387 + 245 + 368 = 1000，回到了被减数，说明算对了。"], "options": [{"id": "a", "text": "算 387 − 245，得 142，说明算对了", "feedback": "检验减法要用加法，不是再减一次。"}, {"id": "b", "text": "算 387 + 245，得 632，说明算对了", "feedback": "只加回了一个数，还没回到 1000，检验没做完。"}, {"id": "c", "text": "算 387 + 245 + 368，得 1000，说明算对了", "feedback": "对。把两次减去的数都加回去，回到了最初的 1000。"}], "correct": "c", "pointIds": ["pyps.p4b.u1.002"], "contentVersion": "sha256:5d28fd716f3864e4e727631e794b55d617b143368897e383eac10233890275b2"}], "contentVersion": "sha256:334ad620413b4662a469d1167c280758adc42e25666fd43560d2ec284692ef1b"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
