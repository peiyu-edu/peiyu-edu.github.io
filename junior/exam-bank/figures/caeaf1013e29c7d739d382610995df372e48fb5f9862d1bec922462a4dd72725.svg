<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 505" role="img" aria-labelledby="title desc"><title id="title">思维导图与正方形</title><desc id="desc">上图是思维导图：平行四边形经“对角线①（横线待填）”到矩形，矩形经“对角线互相垂直”到正方形；平行四边形经“对角线②（横线待填）”到正方形；平行四边形经“对角线互相垂直”到菱形，菱形经“对角线相等”到正方形。下图是正方形 ABCD，E、F 在对角线 BD 所在直线上，E 在 B 外侧，F 在 D 外侧，连接 AE、EC、CF、FA。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.s{fill:currentColor;fill-opacity:.15}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M6.84,175.90L40.44,117.10L149.64,117.10L116.04,175.90Z" /><text x="81.60" y="151.96" text-anchor="middle" font-size="17">平行四边形</text><path d="M243.30,10.84L344.10,10.84L344.10,75.52L243.30,75.52Z" /><text x="293.70" y="48.64" text-anchor="middle" font-size="17">矩形</text><path d="M484.38,104.92L567.54,104.92L567.54,188.08L484.38,188.08Z" /><text x="525.96" y="152.80" text-anchor="middle" font-size="17">正方形</text><path d="M259.26,233.86L299.16,172.12L338.64,233.86L299.16,295.60Z" /><text x="301.26" y="241.84" text-anchor="middle" font-size="17">菱形</text><path d="M149.64,117.10L243.30,44.44" /><polygon class="f" points="243.30,44.44 238.64,53.12 233.74,46.80" /><path d="M344.10,43.60L484.38,104.92" /><polygon class="f" points="484.38,104.92 474.53,104.98 477.74,97.65" /><path d="M127.80,146.50L484.38,146.50" /><polygon class="f" points="484.38,146.50 475.38,150.50 475.38,142.50" /><path d="M116.04,175.90L259.26,233.86" /><polygon class="f" points="259.26,233.86 249.42,234.19 252.42,226.78" /><path d="M338.64,233.86L484.38,188.08" /><polygon class="f" points="484.38,188.08 476.99,194.59 474.59,186.96" /><text x="185.00" y="68.00" text-anchor="end" font-size="15">对角线</text><text x="203.00" y="56.00" text-anchor="middle" font-size="15">①</text><path d="M192.90,76.36L224.40,51.16" /><text x="375.00" y="46.00" text-anchor="start" font-size="15">对角线互相垂直</text><text x="274.80" y="135.16" text-anchor="middle" font-size="15">对角线</text><text x="321.84" y="130.96" text-anchor="middle" font-size="15">②</text><path d="M303.36,136.84L344.52,136.84" /><text x="225.00" y="246.00" text-anchor="end" font-size="15">对角线互相垂直</text><text x="370.00" y="250.00" text-anchor="start" font-size="15">对角线相等</text><path d="M137.60,390.00L311.84,310.80L484.64,390.00L311.84,470.64Z" /><path d="M137.60,390.00L484.64,390.00" /><path d="M311.84,310.80L231.20,390.00L311.84,470.64L392.48,390.00Z" /><text x="311.84" y="303.80" text-anchor="middle" font-size="18" font-style="italic">C</text><text x="311.84" y="491.64" text-anchor="middle" font-size="18" font-style="italic">A</text><text x="126.60" y="396.00" text-anchor="middle" font-size="18" font-style="italic">F</text><text x="495.64" y="396.00" text-anchor="middle" font-size="18" font-style="italic">E</text><text x="227.20" y="411.00" text-anchor="middle" font-size="18" font-style="italic">D</text><text x="396.48" y="411.00" text-anchor="middle" font-size="18" font-style="italic">B</text></svg>
