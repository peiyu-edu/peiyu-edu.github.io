<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">选项A至D的四个函数图象</title><desc id="desc">四个坐标系，横轴标出负二分之π、O、二分之π，纵轴标出1。图象A：在负二分之π到0之间位于x轴下方，经过原点，在0到二分之π之间位于x轴上方，关于原点对称。图象B：两侧都位于x轴上方，经过原点，关于y轴对称。图象C：左侧在x轴上方，右侧在x轴下方，经过原点，关于原点对称。图象D：两侧都位于x轴下方，经过原点，关于y轴对称。各图象的最高或最低点的纵坐标绝对值略大于1，两端都落在负二分之π和二分之π处。</desc><style>path,circle{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><text x="25" y="106" font-size="18">A.</text><path d="M53,100L285,100" /><path d="M277,95L287,100L277,105" /><path d="M165,190L165,12" /><path d="M160,20L165,10L170,20" /><path d="M165,60L171,60" /><text x="159" y="66" text-anchor="end" font-size="16">1</text><text x="296" y="106" font-size="17" font-style="italic">x</text><text x="175" y="18" font-size="17" font-style="italic">y</text><text x="173" y="120" font-size="17" font-style="italic">O</text><text x="53.893813045895996" y="72" text-anchor="middle" font-size="16">−</text><text x="65.893813045896" y="72" text-anchor="middle" font-size="16">π</text><path d="M57.893813045895996,77L73.893813045896,77" style="stroke-width:1.2" /><text x="65.893813045896" y="93" text-anchor="middle" font-size="16">2</text><text x="264.10618695410403" y="122" text-anchor="middle" font-size="16">π</text><path d="M256.10618695410403,127L272.10618695410403,127" style="stroke-width:1.2" /><text x="264.10618695410403" y="143" text-anchor="middle" font-size="16">2</text><path d="M73.9,100.0L74.8,103.4L75.7,106.6L76.6,109.7L77.5,112.7L78.4,115.6L79.4,118.3L80.3,121.0L81.2,123.5L82.1,125.9L83.0,128.2L83.9,130.5L84.8,132.6L85.7,134.6L86.6,136.5L87.6,138.3L88.5,140.1L89.4,141.7L90.3,143.2L91.2,144.7L92.1,146.1L93.0,147.3L93.9,148.5L94.8,149.7L95.8,150.7L96.7,151.7L97.6,152.5L98.5,153.3L99.4,154.1L100.3,154.8L101.2,155.3L102.1,155.9L103.0,156.3L104.0,1