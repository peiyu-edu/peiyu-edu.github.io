<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 352" width="600" height="352" role="img" aria-labelledby="title desc">
<title id="title">瞭望台与两架无人机方位示意图</title>
<desc id="desc">四边形 ABCD：A 在左上，B 在 A 的正东，线段 AB 水平；D 在左下，C 在右下，线段 DC 水平；连接 AD、BD、BC。过 A 画虚线方向线，竖直虚线与 AD 之间标 30°；过 C 画虚线方向线，竖直虚线向上与 CB 之间标 30°。右上角有方向标：上北、下南、左西、右东。</desc>
