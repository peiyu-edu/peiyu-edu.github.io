<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340" role="img" aria-labelledby="title desc"><title id="title">由四个小矩形组成的海报</title><desc id="desc">一个大矩形被分成四个小矩形：最左一列上下分成A、B两块，A在上且较矮，B在下；中间是竖条C；最右侧是较宽的D。</desc><style>path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M20,20H440V320H20Z"/><path d="M146,20V320M266,20V320M20,140H146"/><text x="74" y="88" font-size="26">A</text><text x="74" y="240" font-size="26">B</text><text x="194" y="180" font-size="26">C</text><text x="340" y="180" font-size="26">D</text></svg>
