<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
  <title id="title">正方体的展开图与未补全字母的直观图</title>
  <desc id="desc">左侧展开图标有八个顶点字母；右侧直观图仅标有题设给出的A、B、C、D、E。</desc>
  <style>
    .canvas { fill:#fff }
    .edge { fill:none;stroke:#233b50;stroke-width:2.5;stroke-linejoin:round }
    .hidden { stroke-dasharray:7 5 }
    text { fill:#233b50;font:italic 22px Georgia,serif }
    @media (prefers-color-scheme:dark) { .canvas { fill:#15212a } .edge { stroke:#e4eef6 } text { fill:#e4eef6 } }
  </style>
  <rect class="canvas" width="600" height="340"/>
  <g class="edge">
    <path d="M120 30H180V270H120V30 M60 90H240V150H60Z M120 90H180 M120 150H180 M120 210H180"/>
    <path d="M370 275H480V155H370Z M370 155L415 115H525V235L480 275 M480 155L525 115"/>
    <path class="hidden" d="M370 275L415 235H525 M415 235V115"/>
  </g>
  <g>
    <text x="98" y="174">A</text><text x="186" y="174">B</text>
    <text x="186" y="81">C</text><text x="98" y="81">D</text>
    <text x="36" y="174">E</text><text x="190" y="229">F</text>
    <text x="246" y="82">G</text><text x="96" y="298">H</text>
    <text x="347" y="301">A</text><text x="482" y="301">B</text>
    <text x="534" y="245">C</text><text x="391" y="229">D</text>
    <text x="344" y="151">E</text>
  </g>
</svg>
