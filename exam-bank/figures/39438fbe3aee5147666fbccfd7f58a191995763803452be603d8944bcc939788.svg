<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" role="img" aria-labelledby="title desc"><title id="title">五个视图：图①至图⑤</title><desc id="desc">图①为直角三角形，底边长2，右侧直角边长1；图②和图③为底边长2、高1的等腰三角形，图②中高为实线，图③中高为虚线；图④为三角形，左侧竖边长2，右侧顶点到该边的水平距离为2，内部无线；图⑤为三角形，右侧竖边长2，左侧顶点到该边的水平距离为2，内部有一条从左顶点到竖边中点的实线。</desc><style>path,line,circle,polygon{fill:none;stroke:currentColor;stroke-width:2}.ax{stroke-width:1.5}.d{stroke-dasharray:6 5}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.it{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><polygon points="15,85 130,85 130,25"/><line x1="150" y1="25" x2="150" y2="85" class="ax"/><line x1="145" y1="25" x2="155" y2="25" class="ax"/><line x1="145" y1="85" x2="155" y2="85" class="ax"/><polygon points="150,25 147,33 153,33" style="fill:currentColor;stroke:none"/><polygon points="150,85 147,77 153,77" style="fill:currentColor;stroke:none"/><text x="164" y="60" font-size="16" text-anchor="middle">1</text><line x1="15" y1="103" x2="130" y2="103" class="ax"/><line x1="15" y1="98" x2="15" y2="108" class="ax"/><line x1="130" y1="98" x2="130" y2="108" class="ax"/><polygon points="15,103 23,100 23,106" style="fill:currentColor;stroke:none"/><polygon points="130,103 122,100 122,106" style="fill:currentColor;stroke:none"/><text x="72" y="122" font-size="16" text-anchor="middle">2</text><text x="72" y="146" font-size="16" text-anchor="middle">图①</text><polygon points="185,85 300,85 242.5,25"/><line x1="242.5" y1="25" x2="242.5" y2="85"/><line x1="318" y1="25" x2="318" y2="85" class="ax"/><line x1="313" y1="25" x2="323" y2="25" class="ax"/><line x1="313" y1="85" x2="323" y2="85" class="ax"/><polygon points="318,25 315,33 321,33" style="fill:currentColor;stroke:none"/><polygon points="318,85 315,77 321,77" style="fill:currentColor;stroke:none"/><text x="332" y="60" font-size="16" text-anchor="middle">1</text><line x1="185" y1="103" x2="300" y2="103" class="ax"/>