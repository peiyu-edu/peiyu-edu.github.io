<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二年级上册 第一单元 分类与整理 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p2a-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>二年级上册 第一单元 分类与整理 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p2a-u1-test", "sectionId": "p2a-u1-test", "unitId": "p2a-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "二年级上册 第一单元 分类与整理 单元测评", "items": [{"id": "p2a-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "盒子里有 3 个红气球、5 个黄气球、2 个红皮球、4 个黄皮球。按颜色分，红色的一共有几个？", "answer": "5 个", "reasoning": ["按颜色分，只看红色还是黄色，不管是气球还是皮球。", "红气球 3 个，红皮球 2 个，3 + 2 = 5（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u1.001"], "contentVersion": "sha256:2d54c88e1cd91d5edc6f7d1738c00ea0dc39eb5ad49519fe5e6b155381ccc9b8"}, {"id": "p2a-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "按形状分下面的图形：△ ○ □ △ ○ △ □ △ ○。哪一类最多？", "answer": "三角形 △", "reasoning": ["一个一个数：三角形 4 个，圆形 3 个，正方形 2 个。", "4 最大，所以三角形最多。"], "options": [{"id": "a", "text": "三角形 △", "feedback": "对。三角形有 4 个，圆形 3 个，正方形 2 个，三角形最多。"}, {"id": "b", "text": "圆形 ○", "feedback": "圆形有 3 个，三角形有 4 个，圆形不是最多的。"}, {"id": "c", "text": "正方形 □", "feedback": "正方形只有 2 个，是最少的。"}], "correct": "a", "pointIds": ["pyps.p2a.u1.001"], "contentVersion": "sha256:291f0cc2dff1b919819a809517765790b37fb4ba3bbb9555947ee44b7487bb7d", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 55\" role=\"img\" aria-label=\"待分类的九个图形：△ ○ □ △ ○ △ □ △ ○\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\">\n      <polygon points=\"25,17 15,36 35,36\" style=\"fill:var(--card);stroke:var(--b);stroke-width:2\"/><circle cx=\"53\" cy=\"28\" r=\"9\" style=\"fill:var(--card);stroke:var(--a);stroke-width:2\"/><rect x=\"72\" y=\"19\" width=\"18\" height=\"18\" rx=\"0\" style=\"fill:var(--card);stroke:var(--c);stroke-width:2\"/><polygon points=\"109,17 99,36 119,36\" style=\"fill:var(--card);stroke:var(--b);stroke-width:2\"/><circle cx=\"137\" cy=\"28\" r=\"9\" style=\"fill:var(--card);stroke:var(--a);stroke-width:2\"/><polygon points=\"165,17 155,36 175,36\" style=\"fill:var(--card);stroke:var(--b);stroke-width:2\"/><rect x=\"184\" y=\"19\" width=\"18\" height=\"18\" rx=\"0\" style=\"fill:var(--card);stroke:var(--c);stroke-width:2\"/><polygon points=\"221,17 211,36 231,36\" style=\"fill:var(--card);stroke:var(--b);stroke-width:2\"/><circle cx=\"249\" cy=\"28\" r=\"9\" style=\"fill:var(--card);stroke:var(--a);stroke-width:2\"/>\n    <\/svg>"}, {"id": "p2a-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "小兰一组同学选最喜欢的水果，记录在表里：苹果 8 人，香蕉 5 人，橙子 9 人，葡萄 6 人。喜欢哪种水果的人最多？", "answer": "橙子", "reasoning": ["比一比四个数：8、5、9、6。", "9 最大，所以喜欢橙子的人最多。"], "options": [{"id": "a", "text": "香蕉", "feedback": "香蕉只有 5 人，是最少的。"}, {"id": "b", "text": "苹果", "feedback": "苹果 8 人，比橙子的 9 人少。"}, {"id": "c", "text": "橙子", "feedback": "对。9 比 8、5、6 都大，喜欢橙子的人最多。"}], "correct": "c", "pointIds": ["pyps.p2a.u1.002"], "contentVersion": "sha256:62b918fd4e9721ea08a1251a9b7bddf2c92267b299954cfaa1e2d188dfb8e214", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"调查记录表：苹果8人，香蕉5人，橙子9人，葡萄6人\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\">\n      <rect x=\"35\" y=\"12\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"12\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">苹果<\/text><text x=\"200\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">8人<\/text><rect x=\"35\" y=\"52\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"52\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"79\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">香蕉<\/text><text x=\"200\" y=\"79\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">5人<\/text><rect x=\"35\" y=\"92\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"92\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"119\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">橙子<\/text><text x=\"200\" y=\"119\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">9人<\/text><rect x=\"35\" y=\"132\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"132\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">葡萄<\/text><text x=\"200\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">6人<\/text>\n    <\/svg>"}, {"id": "p2a-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "还是上一题的表：苹果 8 人，香蕉 5 人，橙子 9 人，葡萄 6 人。这一组一共有多少人？", "answer": "28 人", "reasoning": ["每人只选了一种水果，把四类人数加起来就是一共的人数。", "8 + 5 + 9 + 6 = 28（人）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u1.002"], "contentVersion": "sha256:d1da5e1aa38432055164decf8b55d5ea161f494bdfb4e42cc562bf9dc969e885", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"调查记录表：苹果8人，香蕉5人，橙子9人，葡萄6人\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\">\n      <rect x=\"35\" y=\"12\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"12\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">苹果<\/text><text x=\"200\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">8人<\/text><rect x=\"35\" y=\"52\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"52\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"79\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">香蕉<\/text><text x=\"200\" y=\"79\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">5人<\/text><rect x=\"35\" y=\"92\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"92\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"119\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">橙子<\/text><text x=\"200\" y=\"119\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">9人<\/text><rect x=\"35\" y=\"132\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"132\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">葡萄<\/text><text x=\"200\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">6人<\/text>\n    <\/svg>"}, {"id": "p2a-u1-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "还是这张表：苹果 8 人，香蕉 5 人，橙子 9 人，葡萄 6 人。喜欢橙子的比喜欢香蕉的多几人？", "answer": "4 人", "reasoning": ["求多几人，用大数减小数。", "9 − 5 = 4（人）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u1.002"], "contentVersion": "sha256:9b8d7f5e49a02db4aa5e5d08bd108f79a66a30bc2fd2308043733e0ae3ed209f", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 190\" role=\"img\" aria-label=\"调查记录表：苹果8人，香蕉5人，橙子9人，葡萄6人\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\">\n      <rect x=\"35\" y=\"12\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"12\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">苹果<\/text><text x=\"200\" y=\"39\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">8人<\/text><rect x=\"35\" y=\"52\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"52\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"79\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">香蕉<\/text><text x=\"200\" y=\"79\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">5人<\/text><rect x=\"35\" y=\"92\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"92\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"119\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">橙子<\/text><text x=\"200\" y=\"119\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">9人<\/text><rect x=\"35\" y=\"132\" width=\"120\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><rect x=\"155\" y=\"132\" width=\"90\" height=\"40\" rx=\"0\" style=\"fill:var(--card);stroke:var(--muted);stroke-width:2\"/><text x=\"95\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">葡萄<\/text><text x=\"200\" y=\"159\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">6人<\/text>\n    <\/svg>"}, {"id": "p2a-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "有 4 个大红球、2 个小红球、3 个大蓝球、1 个小蓝球。这次按大小分，大球有几个？小球有几个？", "answer": "大球 7 个，小球 3 个", "reasoning": ["按大小分，只看大还是小，不管颜色。", "大球：4 + 3 = 7（个）；小球：2 + 1 = 3（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u1.003"], "contentVersion": "sha256:c30dd9c2eeb1b04abe55284a8396d54a9546bbc7eb343cc2adb127832c902b55"}, {"id": "p2a-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "还是这 10 个球。按颜色分是 6 个红球、4 个蓝球；按大小分是 7 个大球、3 个小球。下面哪句话对？", "answer": "标准不同，分的结果可能不同，但总数都是 10 个", "reasoning": ["按颜色分：6 + 4 = 10；按大小分：7 + 3 = 10。", "结果不一样，但合起来都是 10 个。"], "options": [{"id": "a", "text": "标准不同，分的结果可能不同，但总数都是 10 个", "feedback": "对。6 + 4 = 10，7 + 3 = 10，换了标准总数不变。"}, {"id": "b", "text": "标准不同，分的结果一样", "feedback": "按颜色分是 6 和 4，按大小分是 7 和 3，结果并不一样。"}, {"id": "c", "text": "按大小分以后，球变多了", "feedback": "球没有增加也没有减少，只是分法不同。"}], "correct": "a", "pointIds": ["pyps.p2a.u1.003"], "contentVersion": "sha256:bea43d1561fba28d5f11f1ed4e9a895d2aa68106d21d65d35a7fcc847076a9f8"}, {"id": "p2a-u1-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "有一些卡片：红色圆形、红色方形、蓝色圆形、蓝色方形。先按颜色分，再把每种颜色的卡片按形状分。最后分成了几小类？", "answer": "4 小类", "reasoning": ["第一层按颜色分成红、蓝 2 类。", "每种颜色里再按形状分成圆形、方形，数最后一层：红圆、红方、蓝圆、蓝方，共 4 小类。"], "options": [{"id": "a", "text": "6 小类", "feedback": "数一数最后一层：红圆、红方、蓝圆、蓝方，没有 6 类。"}, {"id": "b", "text": "2 小类", "feedback": "2 类是只按颜色分的结果，还要在每种颜色里再按形状分。"}, {"id": "c", "text": "4 小类", "feedback": "对。红色里分出圆形、方形，蓝色里也分出圆形、方形，一共 4 小类。"}], "correct": "c", "pointIds": ["pyps.p2a.u1.004"], "contentVersion": "sha256:649ac5fc07ef78d038c1e6eebb8f12cee5a3bfe9c728fe3efefdfc5376b976af", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 174\" role=\"img\" aria-label=\"分别表示红蓝两种颜色和圆方两种形状，未画组合或分类后的盒数\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\">\n      <text x=\"140\" y=\"32\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">已知颜色：红色、蓝色<\/text><text x=\"140\" y=\"90\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">已知形状：<\/text><circle cx=\"95\" cy=\"138\" r=\"9\" style=\"fill:var(--card);stroke:var(--a);stroke-width:2\"/><rect x=\"176\" y=\"129\" width=\"18\" height=\"18\" rx=\"0\" style=\"fill:var(--card);stroke:var(--c);stroke-width:2\"/>\n    <\/svg>"}, {"id": "p2a-u1-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "上一题的卡片里，红色圆形 3 张，红色方形 2 张，蓝色圆形 4 张，蓝色方形 1 张。红色卡片一共几张？所有圆形卡片一共几张？", "answer": "红色 5 张，圆形 7 张", "reasoning": ["红色卡片：红圆 3 张，红方 2 张，3 + 2 = 5（张）。", "圆形卡片：红圆 3 张，蓝圆 4 张，3 + 4 = 7（张）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u1.004"], "contentVersion": "sha256:120314ff04ead327330cd54aaa2cd950f7da1e03f3dc5d1d7ef4d7ac3d7819b7", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 246\" role=\"img\" aria-label=\"仅画每种贴纸的一个样例，张数按题干标注，不画出所有贴纸或待求合计\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\">\n      <text x=\"140\" y=\"27\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">红色、蓝色卡片的已知张数<\/text><circle cx=\"70\" cy=\"70\" r=\"9\" style=\"fill:var(--card);stroke:var(--no);stroke-width:2\"/><text x=\"70\" y=\"112\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">3张<\/text><rect x=\"201\" y=\"61\" width=\"18\" height=\"18\" rx=\"0\" style=\"fill:var(--card);stroke:var(--no);stroke-width:2\"/><text x=\"210\" y=\"112\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">2张<\/text><circle cx=\"70\" cy=\"160\" r=\"9\" style=\"fill:var(--card);stroke:var(--c);stroke-width:2\"/><text x=\"70\" y=\"202\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">4张<\/text><rect x=\"201\" y=\"151\" width=\"18\" height=\"18\" rx=\"0\" style=\"fill:var(--card);stroke:var(--c);stroke-width:2\"/><text x=\"210\" y=\"202\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">1张<\/text>\n    <\/svg>"}, {"id": "p2a-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "书架上有 12 本书。按封面颜色分，红封面有 7 本，其余是绿封面；按厚薄分，厚的有 5 本，其余是薄的。绿封面的有几本？薄的有几本？", "answer": "绿封面 5 本，薄的 7 本", "reasoning": ["不管按什么分，总数都是 12 本。", "绿封面：12 − 7 = 5（本）；薄的：12 − 5 = 7（本）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u1.003", "pyps.p2a.u1.001"], "contentVersion": "sha256:aa53f3bcd77d0bd4500ea0e800eaa5f9702205b25f708d80e8ae7e2f0ed8155c"}], "contentVersion": "sha256:8147f548b6096314f51f1436e18dc6bf0a69db3eed89bf4832d4611d481b2caa"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
