<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="title desc"><title id="title">建筑物与栏杆的观测示意图</title><desc id="desc">地面上左侧是建筑物，高为h，顶端为C；右侧观测场上有竖直栏杆AB，AB长为a，A在地面；C与B之间的距离为b；栏杆到建筑物的距离为d；在B处作水平虚线，它与BC的夹角为θ；建筑物与栏杆之间有一棵树。</desc><style>path,line,circle,rect,polygon{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,"Songti SC",serif}.fill{fill:currentColor}.bar{fill:currentColor;fill-opacity:.45}.dash{stroke-dasharray:6 5}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><line x1="30.0" y1="270.0" x2="590.0" y2="270.0"/><rect x="70" y="70" width="50" height="200"/><text x="95.0" y="130.0" text-anchor="middle" font-size="22">建</text><text x="95.0" y="175.0" text-anchor="middle" font-size="22">筑</text><text x="95.0" y="220.0" text-anchor="middle" font-size="22">物</text><line x1="50.0" y1="170.0" x2="50.0" y2="70.0"/><polygon class="fill" points="50.0,70.0 44.9,82.0 55.1,82.0"/><line x1="50.0" y1="170.0" x2="50.0" y2="270.0"/><polygon class="fill" points="50.0,270.0 55.1,258.0 44.9,258.0"/><line x1="40.0" y1="70.0" x2="70.0" y2="70.0"/><text x="30.0" y="175.0" text-anchor="middle" font-size="22" font-style="italic">h</text><line x1="120.0" y1="70.0" x2="460.0" y2="195.0"/><line x1="294.8" y1="119.4" x2="124.8" y2="56.9"/><polygon class="fill" points="124.8,56.9 134.3,65.7 137.8,56.2"/><line x1="294.8" y1="119.4" x2="464.8" y2="181.9"/><polygon class="fill" points="464.8,181.9 455.3,173.0 451.8,182.5"/><text x="295.0" y="98.0" text-anchor="middle" font-size="22" font-style="italic">b</text><line x1="340.0" y1="195.0" x2="460.0" y2="195.0" class="dash"/><text x="375.0" y="190.0" text-anchor="middle" font-size="18" font-style="italic">θ</text><path class="bar" d="M170 205 L160 190 L172 180 L168 165 L190 170 L205 158 L215 172 L232 170 L226 190 L236 205 L218 212 L205 226 L196 212 L180 218 Z"/><line x1="200.0" y1="216.0" x2="200.0"