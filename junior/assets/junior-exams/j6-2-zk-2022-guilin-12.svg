<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="460" height="80" role="img" aria-labelledby="title desc">
<title id="title">线段 AB 与点 C</title>
<desc id="desc">一条水平线段，从左到右依次是点 A、C、B，点 C 在 A、B 之间。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="460" height="80" fill="white"/>
<line x1="30.0" y1="28.0" x2="430.0" y2="28.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="30.0" y1="16.0" x2="30.0" y2="28.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="230.0" y1="16.0" x2="230.0" y2="28.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="430.0" y1="16.0" x2="430.0" y2="28.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<text x="30.0" y="68.0" class="m" text-anchor="middle">A</text>
<text x="230.0" y="68.0" class="m" text-anchor="middle">C</text>
<text x="430.0" y="68.0" class="m" text-anchor="middle">B</text>
</svg>
