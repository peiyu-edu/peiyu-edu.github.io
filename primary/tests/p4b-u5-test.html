<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级下册 第五单元 三角形 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p4b-u5-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>四年级下册 第五单元 三角形 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p4b-u5-test", "sectionId": "p4b-u5-test", "unitId": "p4b-u5", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "四年级下册 第五单元 三角形 单元测评", "items": [{"id": "p4b-u5-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "自行车的车架、房顶的人字梁常做成三角形，主要是利用了三角形的什么特点？", "answer": "三角形不容易变形，很稳定", "reasoning": ["拉一拉三角形的框架，它不会变形。", "三角形的这个特点叫稳定性。"], "options": [{"id": "a", "text": "三角形不容易变形，很稳定", "feedback": "对。三角形的三条边长度定了，形状就不会变。"}, {"id": "b", "text": "三角形用的材料最少", "feedback": "主要原因是稳定，不是省材料。"}, {"id": "c", "text": "三角形的三条边一样长", "feedback": "车架上三角形的三条边不一定一样长。"}], "correct": "a", "pointIds": ["pyps.p4b.u5.001"], "contentVersion": "sha256:ba08592e9532dcbdf2fd9f752659abc5ca2fb73b167a7bca5f5b53c24110a0db", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 215\" role=\"img\" aria-label=\"房顶三角形支架\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"40,150 150,30 260,150\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><path d=\"M150,30 L150,150\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"150\" y=\"190\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">三角形支架示意<\/text><\/svg>"}, {"id": "p4b-u5-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪组小棒能围成三角形？（单位：厘米）", "answer": "4、6、9", "reasoning": ["三角形任意两边的和大于第三边。", "只要看两根短的加起来是不是比最长的那根长。", "4 + 6 = 10，10 比 9 大，能围成。"], "options": [{"id": "a", "text": "5、5、10", "feedback": "5 + 5 = 10，正好等于第三根，会平平地贴在一起，围不成。"}, {"id": "b", "text": "4、6、9", "feedback": "对。4 + 6 = 10，比 9 长，能围成。"}, {"id": "c", "text": "3、4、8", "feedback": "3 + 4 = 7，比 8 短，两根短的接不上。"}], "correct": "b", "pointIds": ["pyps.p4b.u5.003"], "contentVersion": "sha256:d10da8f3680473599c96bb9a9ce5cc9f380f095fa1633f2997f9bdbcb706a083", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 296\" role=\"img\" aria-label=\"各选项的三根小棒，未把任何一组选成三角形\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><text x=\"20\" y=\"54\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A<\/text><path d=\"M50,30 L120,30\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"215\" y=\"35\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">5<\/text><path d=\"M50,51 L120,51\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"215\" y=\"56\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">5<\/text><path d=\"M50,72 L190,72\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"215\" y=\"77\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">10<\/text><text x=\"20\" y=\"136\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B<\/text><path d=\"M50,112 L106,112\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"215\" y=\"117\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">4<\/text><path d=\"M50,133 L134,133\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"215\" y=\"138\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">6<\/text><path d=\"M50,154 L176,154\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"215\" y=\"159\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">9<\/text><text x=\"20\" y=\"218\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C<\/text><path d=\"M50,194 L92,194\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"215\" y=\"199\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">3<\/text><path d=\"M50,215 L106,215\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"215\" y=\"220\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">4<\/text><path d=\"M50,236 L162,236\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"215\" y=\"241\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">8<\/text><text x=\"150\" y=\"276\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">单位：厘米<\/text><\/svg>"}, {"id": "p4b-u5-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个三角形的两个角分别是 50° 和 65°，第三个角是多少度？", "answer": "65°", "reasoning": ["三角形的内角和是 180°。", "180 − 50 − 65 = 65，第三个角是 65°。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u5.006"], "contentVersion": "sha256:a2c75217110ae72e92d0fd8b55af0a3c927ccac3a5d470f4f03e40f043b87e01", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 230\" role=\"img\" aria-label=\"三角形各顶点用 A、B、C 标记；下方列已知角，未知角不标数值\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"42,155 205.176,155 146.887,30\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><text x=\"42\" y=\"176\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A<\/text><text x=\"205.176\" y=\"176\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B<\/text><text x=\"146.887\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C<\/text><text x=\"50\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A 50°<\/text><text x=\"150\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B 65°<\/text><text x=\"250\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C ?<\/text><\/svg>"}, {"id": "p4b-u5-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一个三角形的三个角分别是 30°、60°、90°，它是什么三角形？", "answer": "直角三角形", "reasoning": ["按角分类，看三角形里最大的那个角。", "最大的角是 90°，是直角，所以是直角三角形。"], "options": [{"id": "a", "text": "钝角三角形", "feedback": "没有比 90° 大的角。"}, {"id": "b", "text": "锐角三角形", "feedback": "有一个角是 90°，不是三个角都是锐角。"}, {"id": "c", "text": "直角三角形", "feedback": "对。有一个角是直角。"}], "correct": "c", "pointIds": ["pyps.p4b.u5.004"], "contentVersion": "sha256:f6a9f199fdc43cfc11ad3cb157cf11d82ea1000d0ffe34c75028cdee489ffb92", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 230\" role=\"img\" aria-label=\"三角形各顶点用 A、B、C 标记；下方列已知角，未知角不标数值\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"42,155 257,155 203.25,61.9023\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><text x=\"42\" y=\"176\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A<\/text><text x=\"257\" y=\"176\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B<\/text><text x=\"203.25\" y=\"51.9023\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C<\/text><text x=\"50\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A 30°<\/text><text x=\"150\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B 60°<\/text><text x=\"250\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C 90°<\/text><\/svg>"}, {"id": "p4b-u5-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个等腰三角形的顶角是 40°，它的一个底角是多少度？", "answer": "70°", "reasoning": ["等腰三角形的两个底角相等。", "两个底角合起来是 180 − 40 = 140（度）。", "140 ÷ 2 = 70，一个底角是 70°。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u5.005", "pyps.p4b.u5.006"], "contentVersion": "sha256:0134396a6acb97c3c65b43fc07c9a7ce07311ead02b205ad23c116414f9a3148", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 230\" role=\"img\" aria-label=\"三角形各顶点用 A、B、C 标记；下方列已知角，未知角不标数值\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"42,155 132.993,155 87.4963,30\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><text x=\"42\" y=\"176\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A<\/text><text x=\"132.993\" y=\"176\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B<\/text><text x=\"87.4963\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C<\/text><text x=\"50\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A ?<\/text><text x=\"150\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B ?<\/text><text x=\"250\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C 40°<\/text><\/svg>"}, {"id": "p4b-u5-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个六边形的内角和是多少度？", "answer": "720°", "reasoning": ["从六边形的一个顶点出发，连接不相邻的顶点，能分成 4 个三角形。", "180 × 4 = 720，内角和是 720°。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u5.008"], "contentVersion": "sha256:80b699cc9c8e035246cc47fffbfd3b95c378c0276a38295b0ef6aa4d4d4ec014", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 210\" role=\"img\" aria-label=\"未画对角线的6边形\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"150,23 240.933,64 240.933,146 150,187 59.0673,146 59.0673,64\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><\/svg>"}, {"id": "p4b-u5-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个三角形中最大的角是 89°，它是什么三角形？", "answer": "锐角三角形", "reasoning": ["最大的角都是锐角，另外两个角也一定是锐角。", "三个角都是锐角的三角形是锐角三角形。"], "options": [{"id": "a", "text": "直角三角形", "feedback": "89° 比 90° 小，不是直角。"}, {"id": "b", "text": "锐角三角形", "feedback": "对。最大的角 89° 是锐角，另外两个角更小，三个角都是锐角。"}, {"id": "c", "text": "钝角三角形", "feedback": "钝角要比 90° 大，89° 不是钝角。"}], "correct": "b", "pointIds": ["pyps.p4b.u5.004"], "contentVersion": "sha256:71ff58ba58bd40255c9e98eab46eaa43ccb6fe8768ce37af15af2f23dc5a5688", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 230\" role=\"img\" aria-label=\"三角形各顶点用 A、B、C 标记；下方列已知角，未知角不标数值\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"42,155 164.893,155 44.1819,30\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><text x=\"42\" y=\"176\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A<\/text><text x=\"164.893\" y=\"176\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B<\/text><text x=\"44.1819\" y=\"24\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C<\/text><text x=\"50\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">A 89°<\/text><text x=\"150\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">B <\/text><text x=\"250\" y=\"210\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">C <\/text><\/svg>"}, {"id": "p4b-u5-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "两根小棒分别长 4 厘米和 9 厘米，再找一根小棒围成三角形。第三根可以是多长？", "answer": "10 厘米", "reasoning": ["任意两根的和都要比第三根长。", "10 厘米时：4 + 9 = 13，比 10 长；4 + 10 = 14，比 9 长，能围成。"], "options": [{"id": "a", "text": "10 厘米", "feedback": "对。4 + 9 = 13 > 10，4 + 10 = 14 > 9，能围成。"}, {"id": "b", "text": "13 厘米", "feedback": "4 + 9 = 13，正好等于 13，围不成。"}, {"id": "c", "text": "5 厘米", "feedback": "4 + 5 = 9，正好等于 9，围不成。"}], "correct": "a", "pointIds": ["pyps.p4b.u5.003"], "contentVersion": "sha256:ebb29d98115f9fdb47a31622ef4ebbdda7a0b8a9e8d44ba4d6b3299db0f865e3", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 119\" role=\"img\" aria-label=\"分开放置的小棒，长度按题干比例绘制\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M25,30 L102.778,30\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"212\" y=\"35\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">4 厘米<\/text><path d=\"M25,67 L200,67\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><text x=\"212\" y=\"72\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">9 厘米<\/text><\/svg>"}, {"id": "p4b-u5-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个等腰三角形有一个角是 100°，另外两个角各是多少度？", "answer": "都是 40°", "reasoning": ["如果 100° 是底角，两个底角就有 200°，超过 180°，不可能。", "所以 100° 是顶角。", "两个底角合起来是 180 − 100 = 80（度），每个是 80 ÷ 2 = 40（度）。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u5.007", "pyps.p4b.u5.005"], "contentVersion": "sha256:bc1b7b7ed0efac0fde9893e41acdafbcf39838576c76d8ba318c27c73d27c3ce", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 200\" role=\"img\" aria-label=\"已知一百角与两条等腰边分开画，不替学生确定钝角的位置\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><path d=\"M65,130 L135,130\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><polygon points=\"135,130 127.583,127.003 127.583,132.997\" style=\"fill:var(--fg);stroke:var(--fg);stroke-width:2\" /><path d=\"M65,130 L52.8446,61.0635\" style=\"fill:none;stroke:var(--b);stroke-width:2\" /><polygon points=\"52.8446,61.0635 51.1813,68.8886 57.084,67.8478\" style=\"fill:var(--b);stroke:var(--b);stroke-width:2\" /><text x=\"85\" y=\"175\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">一个角100°<\/text><path d=\"M200,60 L260,60\" style=\"fill:none;stroke:var(--a);stroke-width:2\" /><path d=\"M200,105 L260,105\" style=\"fill:none;stroke:var(--a);stroke-width:2\" /><text x=\"230\" y=\"145\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">两腰相等<\/text><\/svg>"}, {"id": "p4b-u5-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个直角三角形，两条直角边分别长 3 厘米和 4 厘米。以 4 厘米的直角边为底，这条底上的高是多少厘米？", "answer": "3 厘米", "reasoning": ["高是从顶点到对边的垂直线段。", "两条直角边互相垂直，以 4 厘米的直角边为底，另一条直角边就是它的高，长 3 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u5.002", "pyps.p4a.u5.002"], "contentVersion": "sha256:65259f2ccdae374c95a96461c87d0e3127683d4859629419a86da3dfa0a6e821", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 215\" role=\"img\" aria-label=\"两条直角边三、四厘米，以四厘米边为底\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"60,40 60,160 220,160\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><path d=\"M60,145 H75 V160\" style=\"fill:none;stroke:var(--muted);stroke-width:2\" /><text x=\"25\" y=\"105\" text-anchor=\"start\" style=\"fill:var(--fg);font-size:16px\">3 厘米<\/text><text x=\"145\" y=\"190\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">底：4 厘米<\/text><\/svg>"}, {"id": "p4b-u5-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "把一个三角形沿着一条直线剪成两个小三角形，每个小三角形的内角和是多少？", "answer": "180°", "reasoning": ["每个三角形的内角和都是 180°，和三角形的大小、形状没有关系。", "剪出的两个小三角形也一样，各是 180°。"], "options": [{"id": "a", "text": "180°", "feedback": "对。不管大小，每个三角形的内角和都是 180°。"}, {"id": "b", "text": "360°", "feedback": "360° 是四边形的内角和。"}, {"id": "c", "text": "90°", "feedback": "内角和不是把 180° 平均分给两个三角形。"}], "correct": "a", "pointIds": ["pyps.p4b.u5.006"], "contentVersion": "sha256:c36019500fc54e08432b86b14c263b8f284e598d8ca90dd83fe37c5fd7fd4603", "figure": "<svg class=\"qfig\" viewBox=\"0 0 300 195\" role=\"img\" aria-label=\"三角形由顶点向对边剪开，成为两个小三角形\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\"><polygon points=\"35,160 265,160 115,35\" style=\"fill:none;stroke:var(--fg);stroke-width:2\" /><path d=\"M115,35 L170,160\" style=\"fill:none;stroke:var(--b);stroke-width:2;stroke-dasharray:5 4\" /><\/svg>"}], "contentVersion": "sha256:891c80671e85207934594efcc8ca7033f831080b33a461a940c97c1725c5d696"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
