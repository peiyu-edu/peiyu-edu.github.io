<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 465" width="510" height="465" role="img" aria-labelledby="title desc">
<title id="title">两厂家费用函数图象</title>
<desc id="desc">平面直角坐标系，横轴为 x/盒，纵轴为 y/元。y1 是从原点出发的一条直线。y2 是从原点出发的折线，在横坐标 25、纵坐标 1000 处拐弯（虚线标出），此前在 y1 上方，拐弯后比 y1 平缓，后来与 y1 相交，交点右边 y1 在上方。</desc>
<style>text { fill:#17202a; font-size:30px; } .i { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .n { font-family:'Times New Roman',Georgia,serif; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect x="0" y="0" width="510" height="465" fill="white"/>
