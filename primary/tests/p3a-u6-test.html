<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级上册 第六单元 分数的初步认识 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p3a-u6-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级上册 第六单元 分数的初步认识 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3a-u6-test", "sectionId": "p3a-u6-test", "unitId": "p3a-u6", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级上册 第六单元 分数的初步认识 单元测评", "items": [{"id": "p3a-u6-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "把一个蛋糕平均分成 6 份，每份是这个蛋糕的几分之一？", "answer": "1/6", "reasoning": ["平均分成 6 份，分母是 6。", "取其中 1 份，分子是 1，所以是 1/6。"], "options": [{"id": "a", "text": "1/6", "feedback": "对。平均分成 6 份，每份是 1/6。"}, {"id": "b", "text": "1/5", "feedback": "分成 6 份，分母是 6，不是 5。"}, {"id": "c", "text": "6/1", "feedback": "分母写平均分的份数 6，分子写取的 1 份，是 1/6。"}], "correct": "a", "pointIds": ["pyps.p3a.u6.001"], "contentVersion": "sha256:ce4390a7ebc067c2e67ce89ef96987baac49f8f0bb5e72f78c648220d299e91f"}, {"id": "p3a-u6-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "3/5 里面有几个 1/5？", "answer": "3 个", "reasoning": ["1/5 是平均分成 5 份中的 1 份。", "3/5 是取了 3 份，就是 3 个 1/5。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u6.002"], "contentVersion": "sha256:11e441b7893983bc51ae74fe17a3413acff9adf462c3a4a0df1003542de8788b"}, {"id": "p3a-u6-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "比大小：4/9 ○ 7/9，○ 里填什么？", "answer": "<", "reasoning": ["分母都是 9，每份一样大。", "4 份比 7 份少，所以 4/9 < 7/9。"], "options": [{"id": "a", "text": "=", "feedback": "4 份和 7 份不一样多。"}, {"id": "b", "text": ">", "feedback": "分母相同时，4 份比 7 份少，4/9 小。"}, {"id": "c", "text": "<", "feedback": "对。分母相同，分子小的分数小。"}], "correct": "c", "pointIds": ["pyps.p3a.u6.003"], "contentVersion": "sha256:94a3baa32c9cd51b0a6f7d1f6d0ca945fd231947e1c1499d3ade8ef418b617bd"}, {"id": "p3a-u6-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "比大小：1/3 ○ 1/5，○ 里填什么？", "answer": ">", "reasoning": ["同样大的东西，平均分成 3 份和平均分成 5 份。", "分的份数越多，每份越小，所以 1/3 > 1/5。"], "options": [{"id": "a", "text": ">", "feedback": "对。同样大的东西，分的份数越少，每份越大。"}, {"id": "b", "text": "=", "feedback": "分成 3 份和分成 5 份，每份不一样大。"}, {"id": "c", "text": "<", "feedback": "不能只看 3 比 5 小。分成 5 份，每份反而更小。"}], "correct": "a", "pointIds": ["pyps.p3a.u6.004"], "contentVersion": "sha256:a6dbe94ece8f959846dc8656e7c48be75c5d66ff993833b8d480131a16bf75ca"}, {"id": "p3a-u6-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "计算：2/7 + 3/7 = □", "answer": "5/7", "reasoning": ["2/7 是 2 个 1/7，3/7 是 3 个 1/7。", "合起来是 5 个 1/7，就是 5/7。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u6.005"], "contentVersion": "sha256:cac521e8cd3aa4c6af44aa4b1657352b875cbf01ec2d5dcdb8a2742b4a814d0b"}, {"id": "p3a-u6-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "计算：1 − 3/8 = □", "answer": "5/8", "reasoning": ["把 1 看成 8/8。", "8 个 1/8 去掉 3 个 1/8，还剩 5 个 1/8，就是 5/8。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u6.006"], "contentVersion": "sha256:647af5a61d84e1c71744750ef30dcd105f0640fa02213ae2140e772f3b64691d"}, {"id": "p3a-u6-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "把 12 个苹果平均分成 4 份，1 份是这些苹果的几分之一？", "answer": "1/4", "reasoning": ["把 12 个苹果看成一个整体，平均分成 4 份。", "1 份就是这些苹果的 1/4。"], "options": [{"id": "a", "text": "1/3", "feedback": "每份有 3 个苹果，但分成的是 4 份，1 份是 1/4。"}, {"id": "b", "text": "1/4", "feedback": "对。看平均分成了几份，不看一共有几个苹果。"}, {"id": "c", "text": "1/12", "feedback": "12 是苹果的个数。这里平均分成的是 4 份。"}], "correct": "b", "pointIds": ["pyps.p3a.u6.007"], "contentVersion": "sha256:b880543934973d37f9fd56de0a60262d12b8e16e82d8a14137ce5517b451589f"}, {"id": "p3a-u6-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "18 个气球的 2/3 是多少个？", "answer": "12 个", "reasoning": ["先把 18 个气球平均分成 3 份，每份 18 ÷ 3，是 6 个。", "2/3 是这样的 2 份：6 × 2 = 12（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u6.008"], "contentVersion": "sha256:a9409d725119c85c05d1e5112b7a1c740ce4c5db5fba0712390c291e1074eca8"}, {"id": "p3a-u6-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一杯果汁，小明第一次喝了这杯的 2/9，第二次喝了这杯的 4/9。两次一共喝了这杯的几分之几？还剩几分之几？", "answer": "一共喝了 6/9，还剩 3/9", "reasoning": ["两次一共喝了：2 个 1/9 加 4 个 1/9，是 6 个 1/9，就是 6/9。", "一杯是 9/9，9 个 1/9 去掉 6 个，还剩 3 个，就是 3/9。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u6.005", "pyps.p3a.u6.006"], "contentVersion": "sha256:ff06b55a7be85d38d5208efb60519d0d948ce6da9e34f4080dae249cf273ac1a"}, {"id": "p3a-u6-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一盒有 8 块饼干，平均分给 4 个小朋友。每人分到几块？每人分到的是这盒饼干的几分之几？", "answer": "2 块，1/4", "reasoning": ["8 块平均分给 4 人，每人 8 ÷ 4，是 2 块。", "把这盒饼干平均分成 4 份，每人得 1 份，是这盒的 1/4。"], "options": [{"id": "a", "text": "2 块，1/2", "feedback": "每人分到 2 块没错，但一共分成了 4 份，每份是 1/4。"}, {"id": "b", "text": "4 块，1/2", "feedback": "平均分给的是 4 个人，不是 2 个人。"}, {"id": "c", "text": "2 块，1/4", "feedback": "对。8 块平均分 4 份，每份 2 块，是 4 份中的 1 份。"}], "correct": "c", "pointIds": ["pyps.p3a.u6.007", "pyps.p3a.u6.008"], "contentVersion": "sha256:0665fc9bc449955cd603dfe3e8a6f87a7ec732fbc2bab9d7054fcc1f90ba1745"}, {"id": "p3a-u6-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小红有 24 张贴纸，送给小芳 1/4，送给小丽 1/6。谁得到的贴纸多？多几张？", "answer": "小芳得到的多，多 2 张", "reasoning": ["小芳：24 张平均分成 4 份，取 1 份，24 ÷ 4，是 6 张。", "小丽：24 张平均分成 6 份，取 1 份，24 ÷ 6，是 4 张。", "6 − 4 = 2（张），小芳多 2 张。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u6.008", "pyps.p3a.u6.004"], "contentVersion": "sha256:9ba47d2f485ae54701b17f008f6317fb5de96c53e66c535ae5d3f06d7b96d068"}], "contentVersion": "sha256:72dffb24d63eb3648143f6f416e0a2cbae890e454b51167334132bdea469c7e6"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
