<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-labelledby="title desc"><title id="title">几何体的三视图</title><desc id="desc">几何体的三视图。主视图是一行并排的两个小正方形；左视图也是一行并排的两个小正方形；俯视图共三个小正方形，下面一行两个，上面一行一个，在左侧小正方形的正上方。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.s{fill:currentColor;fill-opacity:.15;stroke:none}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><rect x="20" y="52" width="40" height="40" /><rect x="60" y="52" width="40" height="40" /><text x="60.00" y="122.00" text-anchor="middle" font-size="16">主视图</text><rect x="160" y="52" width="40" height="40" /><rect x="200" y="52" width="40" height="40" /><text x="200.00" y="122.00" text-anchor="middle" font-size="16">左视图</text><rect x="300" y="12" width="40" height="40" /><rect x="300" y="52" width="40" height="40" /><rect x="340" y="52" width="40" height="40" /><text x="340.00" y="122.00" text-anchor="middle" font-size="16">俯视图</text></svg>