<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 17 章 因式分解 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="junior" data-sec="j17-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 17 章 因式分解 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j17-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j17-test", "sectionId": "j17-test", "chapterId": "j17", "title": "第 17 章 因式分解 · 章末测验", "label": "章末测验", "sections": ["j17-1", "j17-2"], "items": [{"id": "j17-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j17-1"], "pointIds": ["pyjh.fact.001"], "prompt": "下列从左到右的变形中，是因式分解的是哪一项？", "options": [{"id": "a", "text": "$(x+1)(x-1)=x^2-1$", "feedback": "这是把积化成和的整式乘法，方向正好相反。"}, {"id": "b", "text": "$x^2-2x+1=x(x-2)+1$", "feedback": "右边最后是加 $1$，整体仍是和的形式，不是几个整式的积。"}, {"id": "c", "text": "$2ax-4ay=2a(x-2y)$", "feedback": "把多项式化成了 $2a$ 与 $x-2y$ 两个整式的积。"}, {"id": "d", "text": "$x^2+1=x\\left(x+\\frac1x\\right)$", "feedback": "因式 $x+\\frac1x$ 不是整式，因式分解要求每个因式都是整式。"}], "correct": "c", "answer": "$2ax-4ay=2a(x-2y)$", "reasoning": ["因式分解是把一个多项式化成几个整式的积的形式。", "$2ax-4ay=2a(x-2y)$ 右边是两个整式的积；其余三项要么方向相反，要么右边不是积，要么因式不是整式。"], "contentVersion": "sha256:34ca0335118ab4c400acfa648afa91d6310d835921a6022212cb592099b4a4ed"}, {"id": "j17-test-02-v2", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j17-1"], "pointIds": ["pyjh.fact.002"], "prompt": "多项式 $12a^2b^3-8a^3b^2$ 各项的最大单项式公因式（系数取正数）是什么？", "options": [{"id": "a", "text": "$4ab$", "feedback": "这是公因式，但字母的公共部分还没有提尽，不满足题目要求的最大单项式公因式。"}, {"id": "b", "text": "$4a^2b^2$", "feedback": "系数取最大公约数 $4$，相同字母取最低次幂。"}, {"id": "c", "text": "$2a^2b^2$", "feedback": "这是公因式，但提取后各项的系数仍有公因数，没有提尽。"}, {"id": "d", "text": "$4a^3b^3$", "feedback": "相同字母要取最低次幂，不是最高次幂。"}], "correct": "b", "answer": "$4a^2b^2$", "reasoning": ["系数：$12$ 与 $8$ 的最大公约数是 $4$。", "字母：$a$ 的次数为 $2$、$3$，取 $a^2$；$b$ 的次数为 $3$、$2$，取 $b^2$。所以系数为正的最大单项式公因式是 $4a^2b^2$。提取后余 $3b-2a$，已无公共的非单位单项式因式。"], "contentVersion": "sha256:9b65268587f2ff9483306e8960208b020f096ef8f1c1ffa5f89e8a67c5263d29"}, {"id": "j17-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j17-1"], "pointIds": ["pyjh.fact.003", "pyjh.fact.004"], "prompt": "把 $-3a^2b+9ab^2-3ab$ 分解因式，结果正确的是哪一项？", "options": [{"id": "a", "text": "$-3ab(a-3b+1)$", "feedback": "首项为负时提出负号，括号内各项都要变号。"}, {"id": "b", "text": "$-3ab(a-3b)$", "feedback": "最后一项 $-3ab$ 提出公因式后剩 $1$，不能漏掉。"}, {"id": "c", "text": "$-3ab(a+3b-1)$", "feedback": "提出 $-3ab$ 后，括号内每一项都要变号，第二、三项的符号写反了。"}, {"id": "d", "text": "$3ab(-a+3b+1)$", "feedback": "提出 $3ab$ 后，最后一项应剩 $-1$。"}], "correct": "a", "answer": "$-3ab(a-3b+1)$", "reasoning": ["公因式为 $3ab$，首项系数为负，提出 $-3ab$。", "$-3a^2b\\div(-3ab)=a$，$9ab^2\\div(-3ab)=-3b$，$-3ab\\div(-3ab)=1$。", "所以 $-3a^2b+9ab^2-3ab=-3ab(a-3b+1)$。"], "contentVersion": "sha256:4756ac3a7e6dad1b507f467e4b917fc478be26399f5097f3a36ab639a379bd7f"}, {"id": "j17-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j17-2"], "pointIds": ["pyjh.fact.006"], "prompt": "把 $9x^2-16y^2$ 分解因式，结果正确的是哪一项？", "options": [{"id": "a", "text": "$(3x+4y)(3x-4y)$", "feedback": "$9x^2=(3x)^2$，$16y^2=(4y)^2$，用平方差公式。"}, {"id": "b", "text": "$(9x+4y)(9x-4y)$", "feedback": "要先把 $9x^2$ 写成 $(3x)^2$，平方差公式里用的是底数。"}, {"id": "c", "text": "$(3x-4y)^2$", "feedback": "平方差分解成两数和与两数差的积，不是完全平方。"}, {"id": "d", "text": "$(4y+3x)(4y-3x)$", "feedback": "这个积展开是 $16y^2-9x^2$，两项顺序反了，相差一个负号。"}], "correct": "a", "answer": "$(3x+4y)(3x-4y)$", "reasoning": ["$9x^2-16y^2=(3x)^2-(4y)^2$。", "由平方差公式 $m^2-n^2=(m+n)(m-n)$，得 $(3x+4y)(3x-4y)$。"], "contentVersion": "sha256:d62248398a0da8047b786d01462dcd56806a0fbb2754b8a60c1e8074091865cb"}, {"id": "j17-test-05-v2", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j17-2"], "pointIds": ["pyjh.fact.007"], "prompt": "若 $x^2+kx+9$ 是一个完全平方式，则 $k$ 的值是多少？", "options": [{"id": "a", "text": "$6$", "feedback": "只检查了一种符号分支，完全平方式的中间项还可能来自另一种符号分支。"}, {"id": "b", "text": "$\\pm6$", "feedback": "$x^2\\pm6x+9=(x\\pm3)^2$。"}, {"id": "c", "text": "$\\pm3$", "feedback": "把平方项底数直接当成了中间项系数，漏掉了两数积的倍数关系。"}, {"id": "d", "text": "$\\pm18$", "feedback": "常数项 $9=3^2$，用的是 $3$，不是 $9$。"}], "correct": "b", "answer": "$\\pm6$", "reasoning": ["$9=3^2$，所以 $x^2+kx+9=(x+3)^2$ 或 $(x-3)^2$。", "$(x\\pm3)^2=x^2\\pm6x+9$，所以 $k=\\pm6$。"], "contentVersion": "sha256:cf51ad48c8619d23c434e9b3cc3832024bcb17391d366a1cda2876082b72e442"}, {"id": "j17-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j17-2"], "pointIds": ["pyjh.fact.008"], "prompt": "把 $2x^3-8x$ 分解因式，结果正确且分解彻底的是哪一项？", "options": [{"id": "a", "text": "$2x(x^2-4)$", "feedback": "$x^2-4$ 还能用平方差公式继续分解，分解不彻底。"}, {"id": "b", "text": "$2x(x-2)^2$", "feedback": "$x^2-4$ 是平方差，不是完全平方式。"}, {"id": "c", "text": "$2x(x+2)(x-2)$", "feedback": "先提公因式 $2x$，再用平方差公式，每个因式都不能再分解。"}, {"id": "d", "text": "$2(x^3-4x)$", "feedback": "公因式没有提尽，括号内还有公因式 $x$。"}], "correct": "c", "answer": "$2x(x+2)(x-2)$", "reasoning": ["先提公因式：$2x^3-8x=2x(x^2-4)$。", "再用平方差公式：$x^2-4=(x+2)(x-2)$，所以 $2x^3-8x=2x(x+2)(x-2)$。"], "contentVersion": "sha256:bccb712d1ff304af5472cbe46df955b39708aed906947a26b7a9d0d20e7f4ab0"}, {"id": "j17-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j17-2"], "pointIds": ["pyjh.fact.007", "pyjh.fact.008"], "prompt": "把 $-x^2+6xy-9y^2$ 分解因式，结果正确的是哪一项？", "options": [{"id": "a", "text": "$(x-3y)^2$", "feedback": "原式首项为负，提出负号后结果前面要有负号。"}, {"id": "b", "text": "$-(x-3y)^2$", "feedback": "先提出负号得 $-(x^2-6xy+9y^2)$，再用完全平方公式。"}, {"id": "c", "text": "$-(x+3y)^2$", "feedback": "提出负号后括号内中间项是 $-6xy$，要用两数差的平方。"}, {"id": "d", "text": "$(3y+x)(3y-x)$", "feedback": "这是 $9y^2-x^2$ 的分解，原式是三项式，不是平方差。"}], "correct": "b", "answer": "$-(x-3y)^2$", "reasoning": ["提出负号：$-x^2+6xy-9y^2=-(x^2-6xy+9y^2)$。", "$x^2-6xy+9y^2=(x-3y)^2$，所以原式 $=-(x-3y)^2$。"], "contentVersion": "sha256:4794d5fc1bbf6b7d495e572aa688d232c10d91ca505d1bd94f7cf5c2123cbf98"}, {"id": "j17-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j17-2"], "pointIds": ["pyjh.fact.009"], "prompt": "把 $(x+y)^2-6(x+y)+9$ 分解因式，结果正确的是哪一项？", "options": [{"id": "a", "text": "$(x+y+3)^2$", "feedback": "中间项是 $-6(x+y)$，应是两数差的平方。"}, {"id": "b", "text": "$(x+y-3)^2$", "feedback": "把 $x+y$ 看作一个整体 $m$，原式就是 $m^2-6m+9$。"}, {"id": "c", "text": "$(x+y-3)(x+y+3)$", "feedback": "原式是完全平方式，不是平方差。"}, {"id": "d", "text": "$(x+y)(x+y-6)$", "feedback": "只对前两项提公因式，漏掉了常数项 $9$。"}], "correct": "b", "answer": "$(x+y-3)^2$", "reasoning": ["设 $m=x+y$，原式 $=m^2-6m+9=(m-3)^2$。", "把 $m$ 换回 $x+y$，得 $(x+y-3)^2$。"], "contentVersion": "sha256:5f06925886b1e8f17bfdc2fce820fc0db761150557fc2f2581489ca69a6afb84"}, {"id": "j17-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j17-1"], "pointIds": ["pyjh.fact.004", "pyjh.fact.003"], "prompt": "把 $a(x-y)-b(y-x)$ 分解因式，结果正确的是哪一项？", "options": [{"id": "a", "text": "$(x-y)(a-b)$", "feedback": "$-b(y-x)=+b(x-y)$，变号后是加 $b$。"}, {"id": "b", "text": "$(x-y)(a+b)$", "feedback": "先把 $y-x$ 变成 $-(x-y)$，再提公因式 $x-y$。"}, {"id": "c", "text": "$(y-x)(a+b)$", "feedback": "提出 $y-x$ 时，第一项 $a(x-y)$ 要变号。"}, {"id": "d", "text": "$(x-y)(b-a)$", "feedback": "第一项 $a(x-y)$ 提出 $x-y$ 后剩 $a$，符号不变。"}], "correct": "b", "answer": "$(x-y)(a+b)$", "reasoning": ["$y-x=-(x-y)$，所以 $-b(y-x)=b(x-y)$。", "原式 $=a(x-y)+b(x-y)=(x-y)(a+b)$。"], "contentVersion": "sha256:c0b2cdb85d62a20036cefe87a0523fcabcf15e1a90cb781d463968bc7627285e"}, {"id": "j17-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j17-1", "j17-2"], "pointIds": ["pyjh.fact.005", "pyjh.fact.008"], "prompt": "已知 $a+b=4$，$ab=-3$，求 $a^3b+2a^2b^2+ab^3$ 的值。", "options": [{"id": "a", "text": "$-48$", "feedback": "先提公因式，再用完全平方公式，整体代入。"}, {"id": "b", "text": "$48$", "feedback": "$ab=-3$ 是负数，结果的符号要算准。"}, {"id": "c", "text": "$-12$", "feedback": "提出 $ab$ 后括号内是 $(a+b)^2$，要平方。"}, {"id": "d", "text": "$-66$", "feedback": "中间项 $2a^2b^2$ 提出 $ab$ 后剩 $2ab$，不能丢；括号内正好是完全平方式。"}], "correct": "a", "answer": "$-48$", "reasoning": ["$a^3b+2a^2b^2+ab^3=ab(a^2+2ab+b^2)=ab(a+b)^2$。", "代入：$-3\\times4^2=-48$。"], "contentVersion": "sha256:3cf2c0ad4fc019967e7c61a8985574edab970f00349e68a22ad5e9b9a8a3de44"}, {"id": "j17-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j17-1", "j17-2"], "pointIds": ["pyjh.fact.010", "pyjh.fact.003"], "prompt": "用简便方法计算 $3\\times5.6^2-3\\times4.4^2$，结果是多少？", "options": [{"id": "a", "text": "$36$", "feedback": "提公因式 $3$ 后，再用平方差公式。"}, {"id": "b", "text": "$3.6$", "feedback": "$5.6-4.4=1.2$，小数点位置算错了。"}, {"id": "c", "text": "$360$", "feedback": "$5.6+4.4=10$，$5.6-4.4=1.2$，乘积的数量级要核对。"}, {"id": "d", "text": "$12$", "feedback": "提出的公因式 $3$ 最后也要乘上。"}], "correct": "a", "answer": "$36$", "reasoning": ["提公因式：原式 $=3(5.6^2-4.4^2)$。", "平方差公式：$=3(5.6+4.4)(5.6-4.4)=3\\times10\\times1.2=36$。"], "contentVersion": "sha256:088efeacf3a4c3b476544df90a0af4f3480db08b13fb4dcb0eeacb69c1fb20ba"}, {"id": "j17-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j17-2"], "pointIds": ["pyjh.fact.010", "pyjh.fact.006"], "prompt": "对任意整数 $n$，$(n+5)^2-(n-1)^2$ 的值一定是下列哪个数的倍数？", "options": [{"id": "a", "text": "$9$", "feedback": "例如 $n=0$ 时值为 $24$，不是 $9$ 的倍数。"}, {"id": "b", "text": "$24$", "feedback": "例如取 $n=-1$，算出的值不是 $24$ 的倍数。"}, {"id": "c", "text": "$12$", "feedback": "用平方差公式把式子化成一个整数与某个整式的积。"}, {"id": "d", "text": "$10$", "feedback": "例如 $n=0$ 时值为 $24$，不是 $10$ 的倍数。"}], "correct": "c", "answer": "$12$", "reasoning": ["$(n+5)^2-(n-1)^2=[(n+5)+(n-1)][(n+5)-(n-1)]=(2n+4)\\times6$。", "$=12(n+2)$，$n$ 是整数时 $n+2$ 是整数，所以值一定是 $12$ 的倍数。", "取 $n=-1$ 得 $12$，取 $n=0$ 得 $24$，可见其余三个数都不一定。"], "contentVersion": "sha256:9f45ced0b466367cf585ea8f2a4ef496bf2a4ee2070103104b17e9d5ead0717a"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
