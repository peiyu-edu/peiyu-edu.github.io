<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" role="img" aria-labelledby="title desc">
  <title id="title">直三棱柱示意图</title>
  <desc id="desc">三角形 ABC 与上方平行的 A1B1C1 构成直三棱柱，D、E 为中点。</desc>
  <g fill="none" stroke="#2F7A56" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M105 232 L360 232 L195 145 Z Z"/>
    <path d="M165 88 L420 88 L255 1 Z Z"/>
    <path d="M105 232 L165 88 M360 232 L420 88 M195 145 L255 1"/>
    <path d="M105 232 L360 232" stroke="#966524"/>
    <path d="M105 232 L360 232 M195 145 L255 1" stroke-dasharray="7 7" opacity=".55"/>
    <path d="M232.5 188.5 L225 72" stroke="#3E5C76"/>
  </g>
  <g fill="#1A2822" font-family="sans-serif" font-size="20">
    <text x="88" y="255">A</text><text x="365" y="255">B</text><text x="185" y="143">C</text>
    <text x="150" y="78">A₁</text><text x="424" y="80">B₁</text><text x="250" y="22">C₁</text>
    <text x="227" y="210" fill="#966524">D</text><text x="215" y="68" fill="#3E5C76">E</text>
  </g>
</svg>
