<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" role="img" aria-labelledby="title desc"><title id="title">数轴上的点M</title><desc id="desc">数轴标出−3到3的整数刻度，点M在1与2之间。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:6 5}.g{stroke-dasharray:3 4;stroke-width:1}.thin{stroke-width:1.5}.fill{fill:currentColor;stroke:none}.shade{fill:var(--shade);stroke:none}.block{fill:var(--shade)}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}text.n{font-style:normal;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}svg{color:#243d45;background:#fff;--shade:#c9d2d2}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--shade:#4a6268}}</style><path d="M18.0,36.0L320.0,36.0"/><path class="fill" d="M329.0,36.0L314.7,40.9L314.7,31.1Z"/><path d="M40.0,30.0L40.0,36.0"/><text x="40.0" y="60.0" font-size="18" text-anchor="middle" class="n">−3</text><path d="M80.0,30.0L80.0,36.0"/><text x="80.0" y="60.0" font-size="18" text-anchor="middle" class="n">−2</text><path d="M120.0,30.0L120.0,36.0"/><text x="120.0" y="60.0" font-size="18" text-anchor="middle" class="n">−1</text><path d="M160.0,30.0L160.0,36.0"/><text x="160.0" y="60.0" font-size="18" text-anchor="middle" class="n">0</text><path d="M200.0,30.0L200.0,36.0"/><text x="200.0" y="60.0" font-size="18" text-anchor="middle" class="n">1</text><path d="M240.0,30.0L240.0,36.0"/><text x="240.0" y="60.0" font-size="18" text-anchor="middle" class="n">2</text><path d="M280.0,30.0L280.0,36.0"/><text x="280.0" y="60.0" font-size="18" text-anchor="middle" class="n">3</text><circle class="fill" cx="222.0" cy="36.0" r="3.5"/><text x="222.0" y="22.0" font-size="19" text-anchor="middle">M</text></svg>
