<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" role="img" aria-labelledby="title desc"><title id="title">七年级条形图与八年级扇形图</title><desc id="desc">左图是七年级学生得分条形图，纵轴表示人数，刻度从 0 到 30，每格 5；A 组 5 人，B 组 14 人，C 组的条形空缺，D 组 6 人。右图是八年级学生得分扇形图：A 组 16%，B 组 24%，C 组 42%，D 组 18%。</desc><style>path,circle,ellipse,polygon,rect,line,polyline{fill:none;stroke:currentColor;stroke-width:1.8}.d{stroke-dasharray:6 5}.t{stroke-width:1.2}.s{fill:currentColor;fill-opacity:.15}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}.i{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><text x="130.00" y="20.00" font-size="15" text-anchor="middle">七年级学生得分条形图</text><text x="450.00" y="20.00" font-size="15" text-anchor="middle">八年级学生得分扇形图</text><line x1="55.00" y1="215.00" x2="255.00" y2="215.00"/><polygon class="f" points="257.00,215.00 246.00,219.00 246.00,211.00"/><line x1="55.00" y1="215.00" x2="55.00" y2="40.00"/><polygon class="f" points="55.00,38.00 59.00,49.00 51.00,49.00"/><line x1="55.00" y1="189.00" x2="240.00" y2="189.00" class="d t"/><text x="48.00" y="194.00" font-size="14" text-anchor="end">5</text><line x1="55.00" y1="163.00" x2="240.00" y2="163.00" class="d t"/><text x="48.00" y="168.00" font-size="14" text-anchor="end">10</text><line x1="55.00" y1="137.00" x2="240.00" y2="137.00" class="d t"/><text x="48.00" y="142.00" font-size="14" text-anchor="end">15</text><line x1="55.00" y1="111.00" x2="240.00" y2="111.00" class="d t"/><text x="48.00" y="116.00" font-size="14" text-anchor="end">20</text><line x1="55.00" y1="85.00" x2="240.00" y2="85.00" class="d t"/><text x="48.00" y="90.00" font-size="14" text-anchor="end">25</text><line x1="55.00" y1="59.00" x2="240.00" y2="59.00" class="d t"/><text x="48.00" y="64.00" font-size="14" text-anchor="end">30</text><text x="48.00" y="230.00" font-size="14" text-anchor="end">0</text><t