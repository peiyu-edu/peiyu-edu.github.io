<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 306" width="540" height="306" role="img" aria-labelledby="title desc">
<title id="title">从点 O 出发的四条射线</title>
<desc id="desc">四条射线都从点 O 出发：OD 水平向右，OC 指向右上，OB 竖直向上，OA 指向左上。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="540" height="306" fill="white"/>
<line x1="175.0" y1="262.0" x2="33.9" y2="67.8" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="175.0" y1="262.0" x2="175.0" y2="32.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="175.0" y1="262.0" x2="377.3" y2="115.1" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<line x1="175.0" y1="262.0" x2="495.0" y2="262.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<text x="165.0" y="294.0" class="m" text-anchor="middle">O</text>
<text x="517.0" y="272.0" class="m" text-anchor="middle">D</text>
<text x="27.9" y="57.8" class="m" text-anchor="middle">A</text>
<text x="175.0" y="22.0" class="m" text-anchor="middle">B</text>
<text x="397.3" y="111.1" class="m" text-anchor="middle">C</text>
</svg>
