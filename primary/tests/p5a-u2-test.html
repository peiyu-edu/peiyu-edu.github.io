<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五年级上册 第二单元 小数乘法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p5a-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>五年级上册 第二单元 小数乘法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p5a-u2-test", "sectionId": "p5a-u2-test", "unitId": "p5a-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "五年级上册 第二单元 小数乘法 单元测评", "items": [{"id": "p5a-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "0.6 × 7 = □", "answer": "4.2", "reasoning": ["先按整数乘：6 × 7 = 42。", "0.6 有一位小数，积也点出一位小数，得 4.2。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u2.001"], "contentVersion": "sha256:f907567dd892fc4e0af02f667170f8476aa8485054ef329c34d97cb9a862f7b4"}, {"id": "p5a-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "2.45 × 4 = □", "answer": "9.8", "reasoning": ["先按整数乘：245 × 4 = 980。", "2.45 有两位小数，积点出两位小数是 9.80。", "小数末尾的 0 可以去掉，得 9.8。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u2.002"], "contentVersion": "sha256:d9761eb3a6d777e97b7fed0ce5f290d08c795d0ec11486876e341980f6c3b805"}, {"id": "p5a-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "1.3 × 2.4 = □", "answer": "3.12", "reasoning": ["先按整数乘：13 × 24 = 312。", "两个乘数一共有两位小数，积点出两位小数，得 3.12。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u2.003"], "contentVersion": "sha256:a239c9364341b074b081626b8dc5acd127dcc4d72f7b3a9ef7db959ef554175a"}, {"id": "p5a-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "0.12 × 0.3 = □", "answer": "0.036", "reasoning": ["先按整数乘：12 × 3 = 36。", "两个乘数一共有三位小数，36 只有两个数位，前面用 0 补足，得 0.036。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u2.004"], "contentVersion": "sha256:c99b422ad9f586f4ef23b38371d5e9a373a66b5f4a3492a2f84cfb10b63aabf9"}, {"id": "p5a-u2-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "不计算，下面哪个算式的积比 5.6 小？", "answer": "5.6 × 0.9", "reasoning": ["在本题的正数范围内，一个数乘大于 0、小于 1 的数，积比原来的数小。", "0.9 < 1，所以 5.6 × 0.9 的积比 5.6 小。"], "options": [{"id": "a", "text": "5.6 × 1", "feedback": "乘 1，积还是 5.6，不比 5.6 小。"}, {"id": "b", "text": "5.6 × 1.2", "feedback": "1.2 比 1 大，积比 5.6 大。"}, {"id": "c", "text": "5.6 × 0.9", "feedback": "对。0.9 比 1 小，积比 5.6 小。"}], "correct": "c", "pointIds": ["pyps.p5a.u2.005"], "contentVersion": "sha256:cbb3c94dbd3430a89b6b00f8d885321ba11625f6e1c76ff364982541fd624a0b"}, {"id": "p5a-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一支钢笔 12 元，一个书包的价钱是钢笔的 4.5 倍。书包多少元？", "answer": "12 × 4.5 = 54（元）", "reasoning": ["求 12 的 4.5 倍是多少，用乘法：12 × 4.5。", "先按整数乘：12 × 45 = 540，再点出一位小数，得 54.0，也就是 54。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u2.006"], "contentVersion": "sha256:25d73f318620693bb5379c79af5a6c4dd7bf9124cd864b9a0ce0bea4998faeb9"}, {"id": "p5a-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "3.14 × 2.5 的积保留一位小数，约是多少？", "answer": "7.9", "reasoning": ["先按整数乘：314 × 25 = 7850，一共三位小数，积是 7.850，也就是 7.85。", "保留一位小数，看百分位上的 5，向前一位进 1，得 7.85 ≈ 7.9。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u2.007"], "contentVersion": "sha256:e4aa5e6c9b2bdbd102d721c969811b226745284da5266c573a27e406bc0f8e79"}, {"id": "p5a-u2-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用简便方法计算：0.25 × 3.7 × 4", "answer": "3.7", "reasoning": ["0.25 和 4 相乘正好得 1，交换 3.7 和 4 的位置，先算 0.25 与 4 的积。", "4 × 0.25 = 1，1 × 3.7 = 3.7。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u2.008"], "contentVersion": "sha256:5e6f528c968ee4ffb949f70ff680698fef7272e2fc3b7589b7fd595305bbd672"}, {"id": "p5a-u2-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "计算 4.8 × 10.1，下面哪种简便算法是对的？", "answer": "4.8 × 10 + 4.8 × 0.1", "reasoning": ["10.1 = 10 + 0.1，用乘法分配律：4.8 × 10 + 4.8 × 0.1。", "48 + 0.48 = 48.48。"], "options": [{"id": "a", "text": "4.8 × 10 + 4.8 × 0.1", "feedback": "对。把 10.1 看成 10 + 0.1，两部分都要乘 4.8。"}, {"id": "b", "text": "4.8 × 10 × 0.1", "feedback": "10.1 是 10 和 0.1 相加，不是相乘。"}, {"id": "c", "text": "4.8 × 10 + 0.1", "feedback": "0.1 也要乘 4.8，不能只加 0.1。"}], "correct": "a", "pointIds": ["pyps.p5a.u2.009"], "contentVersion": "sha256:c5db1870b875a32913e5d9728582359a8e4378f987cbaf5fa82023e5c919b26e"}, {"id": "p5a-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "出租车收费：3 千米以内收 10 元；超过 3 千米的部分，每千米收 2.4 元。李叔叔坐了 8 千米，要付多少元？", "answer": "22 元", "reasoning": ["超出的路程：8 − 3 = 5（千米）。", "超出部分的钱：5 × 2.4 = 12（元）。", "一共：10 + 12 = 22（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u2.011", "pyps.p5a.u2.001"], "contentVersion": "sha256:e198341ab4a67c5ecedf44f6d72afec1389ed946afcb0dbfcadbd502679b7277"}, {"id": "p5a-u2-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "妈妈带了 50 元，要买 4 支笔（每支 3.8 元）和 3 本本子（每本 7.9 元）。带的钱够吗？", "answer": "够，都往大估也只要 40 元", "reasoning": ["把单价都往大估：3.8 元看成 4 元，7.9 元看成 8 元。", "4 × 4 = 16（元），8 × 3 = 24（元），16 + 24 = 40（元）。", "往大估只要 40 元，比 50 元少，所以钱一定够。"], "options": [{"id": "a", "text": "够，都往大估也只要 40 元", "feedback": "对。3.8 元往大估成 4 元，7.9 元往大估成 8 元，一共不超过 40 元。"}, {"id": "b", "text": "不能判断，一定要先算出准确的钱数", "feedback": "都往大估还够，就一定够，不用算准确数。"}, {"id": "c", "text": "不够，要 50 元以上", "feedback": "往大估都只要 40 元，实际花的钱不会更多。"}], "correct": "a", "pointIds": ["pyps.p5a.u2.010", "pyps.p5a.u2.001"], "contentVersion": "sha256:e54fe92b932736d81ad2e644d3dca02e02805141244efe72edf293e190abcf01"}], "contentVersion": "sha256:5e0b2bb9cf337ef96d0a3a70c1391b2f34677dd71d199d66312e43b436752cf6"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
