<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级下册 第六单元 小数的初步认识 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p3b-u6-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级下册 第六单元 小数的初步认识 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3b-u6-test", "sectionId": "p3b-u6-test", "unitId": "p3b-u6", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级下册 第六单元 小数的初步认识 单元测评", "items": [{"id": "p3b-u6-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "3 角写成以元作单位的小数，是多少元？", "answer": "0.3 元", "reasoning": ["1 元 = 10 角，1 角是 1/10 元。", "3 角是 3/10 元，写作 0.3 元。"], "options": [{"id": "a", "text": "0.3 元", "feedback": "对。1 元 = 10 角，3 角是 3/10 元，写作 0.3 元。"}, {"id": "b", "text": "3 元", "feedback": "3 角不到 1 元，要写成零点几元。"}, {"id": "c", "text": "0.03 元", "feedback": "0.03 元是 3 分，不是 3 角。"}], "correct": "a", "pointIds": ["pyps.p3b.u6.001"], "contentVersion": "sha256:4dba1e173f547435b3465b6ccf164294324e4006f96649a732e5c635fa9a8320"}, {"id": "p3b-u6-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "0.6 怎么读？", "answer": "零点六", "reasoning": ["小数点左边是 0，读作零。", "小数点读作点，右边读六。合起来读作零点六。"], "options": [{"id": "a", "text": "六点零", "feedback": "0 在小数点左边，先读零，再读点，再读六。"}, {"id": "b", "text": "零点六", "feedback": "对。小数点读作「点」。"}, {"id": "c", "text": "零六", "feedback": "小数点要读出来，读作「点」。"}], "correct": "b", "pointIds": ["pyps.p3b.u6.001"], "contentVersion": "sha256:b38ed4b93a6cd3330ddc6bce729966fb91bc7cee5394cae7bfffff55e66afb3f"}, {"id": "p3b-u6-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "5 厘米写成以米作单位的小数，是多少米？", "answer": "0.05 米", "reasoning": ["1 米 = 100 厘米，5 厘米是 5/100 米。", "不够 1 分米，分米那一位写 0 占位，写作 0.05 米。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u6.002"], "contentVersion": "sha256:20891b1be2ea5a3b9bd4b3d72abeb3712906fec3775792ccfb36e02691387fc9"}, {"id": "p3b-u6-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "比大小：0.8 ○ 0.5，○ 里填什么？", "answer": ">", "reasoning": ["0.8 是 8 个 0.1，0.5 是 5 个 0.1。", "8 > 5，所以 0.8 > 0.5。"], "options": [{"id": "a", "text": "=", "feedback": "8 个 0.1 和 5 个 0.1 不一样多。"}, {"id": "b", "text": ">", "feedback": "对。8 个 0.1 比 5 个 0.1 多。"}, {"id": "c", "text": "<", "feedback": "0.8 是 8 个 0.1，0.5 只有 5 个 0.1。"}], "correct": "b", "pointIds": ["pyps.p3b.u6.003"], "contentVersion": "sha256:8dc93718038efabeae4259fa43c2dae70dbeafccd6da2553e50f48e5b4534132"}, {"id": "p3b-u6-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面三个数，哪个最大？", "answer": "2.5", "reasoning": ["先比小数点左边：2.5 和 2.05 都是 2，0.9 是 0，0.9 最小。", "再比小数点后面第一位：2.5 是 5，2.05 是 0，2.5 大。", "所以 2.5 最大。"], "options": [{"id": "a", "text": "2.5", "feedback": "对。整数部分一样时，再比小数点后面第一位：5 比 0 大。"}, {"id": "b", "text": "2.05", "feedback": "2.05 小数点后面第一位是 0，比 2.5 的 5 小。"}, {"id": "c", "text": "0.9", "feedback": "0.9 整数部分是 0，比 2 小。"}], "correct": "a", "pointIds": ["pyps.p3b.u6.003"], "contentVersion": "sha256:b86da612ccdaeb3ad9bd380db16772276dabb265aa71e65fe76d4db935ce4fef"}, {"id": "p3b-u6-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "计算：2.4 + 1.5 = □", "answer": "3.9", "reasoning": ["2.4 是 24 个 0.1，1.5 是 15 个 0.1。", "合起来是 24 + 15 = 39 个 0.1，就是 3.9。", "竖式里小数点要对齐。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u6.004"], "contentVersion": "sha256:0aa0d5001f3f31ab4bdb6d9bfa13a9ebd9c00ac8496ef6787131b63b2ea38c97"}, {"id": "p3b-u6-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "计算：5.2 − 3.7 = □", "answer": "1.5", "reasoning": ["5.2 是 52 个 0.1，3.7 是 37 个 0.1。", "52 − 37 = 15，就是 15 个 0.1，是 1.5。", "竖式里小数点对齐，不够减时从个位退 1。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u6.004"], "contentVersion": "sha256:570ac672ccd25d00ae3c5da2ff80cae9d05159b085d297cff7e6287f92851b9d"}, {"id": "p3b-u6-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "4 元 8 角 5 分写成以元作单位的小数，是多少元？", "answer": "4.85 元", "reasoning": ["4 元写在小数点左边。", "8 角写在小数点后面第一位，5 分写在第二位。", "写作 4.85 元。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u6.002"], "contentVersion": "sha256:54ebeb152da97d049ecfe22b67de638968e209dd5415c8aaf57df72bd81ad7c0"}, {"id": "p3b-u6-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小明买一支铅笔 1.5 元，一块橡皮 0.8 元。他付了 5 元，应找回多少元？", "answer": "2.7 元", "reasoning": ["先算一共花了多少：1.5 + 0.8 = 2.3（元）。", "再算找回：5 − 2.3 = 2.7（元）。", "也可以用角来想：15 + 8 = 23（角），50 − 23 = 27（角），27 角就是 2.7 元。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u6.004", "pyps.p3b.u6.001"], "contentVersion": "sha256:4b86b23759637213448e4a3822673ecce9a902e4c954be939330e0d512f06753"}, {"id": "p3b-u6-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "三个同学跳远：小东跳了 1.35 米，小西跳了 1.5 米，小南跳了 1.08 米。谁跳得最远？", "answer": "小西", "reasoning": ["三个数小数点左边都是 1。", "比小数点后面第一位：1.35 是 3，1.5 是 5，1.08 是 0。", "5 最大，小西跳得最远。"], "options": [{"id": "a", "text": "小西", "feedback": "对。1.5 米小数点后面第一位是 5，最大。"}, {"id": "b", "text": "小东", "feedback": "不能看 35 比 5 大。比小数点后面第一位：3 比 5 小。"}, {"id": "c", "text": "小南", "feedback": "1.08 小数点后面第一位是 0，最小。"}], "correct": "a", "pointIds": ["pyps.p3b.u6.003", "pyps.p3b.u6.002"], "contentVersion": "sha256:adcf4f74eb730dfe030b056b5f22a6dd6e83d151b355c52011f892c4718e2692"}, {"id": "p3b-u6-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一根绳子长 1 米，用去 6 分米。还剩多少米？用小数表示。", "answer": "0.4 米", "reasoning": ["1 米 = 10 分米，还剩 10 − 6 = 4（分米）。", "4 分米是 4/10 米，写作 0.4 米。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u6.001", "pyps.p3a.u3.002"], "contentVersion": "sha256:6bd3cf02b09ff20b33bcf351a30dd36710916d0e568bcfb0ede2e69281f9636f"}], "contentVersion": "sha256:e6db8eb05eee82cc1a1cad3f6fc4519d18808f42b2859af222f727d8c6f223b6"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
