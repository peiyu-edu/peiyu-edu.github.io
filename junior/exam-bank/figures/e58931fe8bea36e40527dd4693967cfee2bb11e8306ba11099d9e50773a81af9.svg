<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 305" role="img" aria-labelledby="title desc"><title id="title">几何体与四个选项图形</title><desc id="desc">上方是一个由 4 个相同小正方体组成的几何体：下层 3 个排成一行，中间那个上面再放 1 个，箭头标“正面”指向下层中间。下方是四个选项：A 是上下 2 个正方形；B 是横排 3 个正方形；C 是横排 3 个正方形，中间一个上面再有 1 个正方形；D 是横排 2 个正方形。</desc><style>path,circle,polygon,rect,line,polyline{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.2}.g{stroke-width:.9;stroke-dasharray:5 3}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><rect x="40" y="90" width="40" height="40"/><rect x="80" y="90" width="40" height="40"/><rect x="120" y="90" width="40" height="40"/><rect x="80" y="50" width="40" height="40"/><path d="M40.00,90.00L58.00,74.00L80.00,74.00"/><path d="M160.00,130.00L178.00,114.00L178.00,74.00L160.00,90.00"/><line x1="138.00" y1="74.00" x2="178.00" y2="74.00"/><path d="M80.00,50.00L98.00,34.00L138.00,34.00L120.00,50.00"/><path d="M120.00,50.00L120.00,90.00"/><path d="M138.00,34.00L138.00,74.00L120.00,90.00"/><line x1="62.00" y1="158.00" x2="88.00" y2="136.00" class="t"/><polygon class="f" points="98,128 90,143 82,134"/><text x="60.0" y="180.0" text-anchor="middle" font-size="16">正面</text><text x="30.0" y="266.0" text-anchor="middle" font-size="17">A.</text><rect x="60" y="218" width="36" height="36"/><rect x="60" y="254" width="36" height="36"/><text x="160.0" y="266.0" text-anchor="middle" font-size="17">B.</text><rect x="185" y="254" width="36" height="36"/><rect x="221" y="254" width="36" height="36"/><rect x="257" y="254" width="36" height="36"/><text x="340.0" y="266.0" text-anchor="middle" font-size="17">C.</text><rect x="365" y="254" width="36" height="36"/><rect x="401" y="254" width="36" height="36"/><rect x="437" y="254" width="36" height="36"/><rect x="401" y="218" width="36" height="36"/><text x="520.0" y="266.0" text-anchor="middle" font-size="17">D.</text><rect x="545" y="254" width="36" height="36"/><rect x="581" y="254" width="36" height="36"/></svg>