<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 24 章 数据的分析 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j24-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 24 章 数据的分析 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j24-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j24-test", "sectionId": "j24-test", "chapterId": "j24", "title": "第 24 章 数据的分析 · 章末测验", "label": "章末测验", "sections": ["j24-1", "j24-2", "j24-3", "j24-4"], "items": [{"id": "j24-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j24-1"], "pointIds": ["pyjh.data.001"], "prompt": "某单位招聘，应聘者的笔试成绩为 $85$ 分，面试成绩为 $90$ 分。若笔试与面试成绩按 $6:4$ 的权计算总成绩，该应聘者的总成绩是多少分？", "options": [{"id": "a", "text": "$87.5$ 分", "feedback": "这是两项的普通平均数，两项的权不相等。"}, {"id": "b", "text": "$87$ 分", "feedback": "$\\frac{85\\times6+90\\times4}{6+4}=\\frac{870}{10}$。"}, {"id": "c", "text": "$88$ 分", "feedback": "权的对应弄反了，笔试的权是 $6$。"}, {"id": "d", "text": "$870$ 分", "feedback": "各项乘权相加后，还要除以权的和 $10$。"}], "correct": "b", "answer": "$87$ 分", "reasoning": ["加权平均数 $=\\frac{85\\times6+90\\times4}{6+4}$。", "分子 $510+360=870$，分母 $10$，总成绩为 $87$ 分。"], "contentVersion": "sha256:82a0f4b4f817ce70f88f856e8feb5fd308d3f25125efdc2c1f75bee9e5ee36a3"}, {"id": "j24-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j24-1"], "pointIds": ["pyjh.data.004", "pyjh.data.005"], "prompt": "某小组 $8$ 名同学一周的课外阅读时间（单位：h）依次为 $7,5,3,9,5,10,5,8$。这组数据的中位数和众数分别是多少？", "options": [{"id": "a", "text": "中位数 $7$，众数 $5$", "feedback": "求中位数要先排序，不能直接取原来顺序中间的两个数。"}, {"id": "b", "text": "中位数 $6$，众数 $3$", "feedback": "众数是出现次数最多的数据本身，不是它出现的次数。"}, {"id": "c", "text": "中位数 $5$，众数 $5$", "feedback": "$8$ 个数据时，中位数是排序后第 $4$、$5$ 个数的平均数。"}, {"id": "d", "text": "中位数 $6$，众数 $5$", "feedback": "排序后第 $4$、$5$ 个数是 $5$ 和 $7$，平均为 $6$；$5$ 出现 $3$ 次最多。"}], "correct": "d", "answer": "中位数 $6$，众数 $5$", "reasoning": ["排序：$3,5,5,5,7,8,9,10$，共 $8$ 个。", "中位数是第 $4$、$5$ 个数的平均数：$\\frac{5+7}2=6$。", "$5$ 出现 $3$ 次，次数最多，众数是 $5$。"], "contentVersion": "sha256:4e617ca2d55fbab8203a7287860267848dfdecd678dcff6f8e218b81f39f18ce"}, {"id": "j24-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j24-2"], "pointIds": ["pyjh.data.009", "pyjh.data.008"], "prompt": "数据 $4,6,7,9,9$ 的方差是多少？", "options": [{"id": "a", "text": "$18$", "feedback": "这是离差平方和，方差还要除以数据个数 $5$。"}, {"id": "b", "text": "$0$", "feedback": "这是离差的和，离差的和总是 $0$，要先平方再求和。"}, {"id": "c", "text": "$3.6$", "feedback": "平均数 $7$，离差平方和 $9+1+0+4+4=18$，再除以 $5$。"}, {"id": "d", "text": "$4.5$", "feedback": "方差的分母是数据个数 $5$，不是 $4$。"}], "correct": "c", "answer": "$3.6$", "reasoning": ["平均数 $\\overline x=\\frac{4+6+7+9+9}5=7$。", "离差依次为 $-3,-1,0,2,2$（和为 $0$），离差平方和 $d^2=9+1+0+4+4=18$。", "方差 $s^2=\\frac{18}5=3.6$。"], "contentVersion": "sha256:591a8135efdf896dad832d9a5b3bfe673622d94f1db5c42fb7b4316a5657210c"}, {"id": "j24-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j24-3"], "pointIds": ["pyjh.data.014", "pyjh.data.013"], "prompt": "按课本的取法，求数据 $12,3,18,7,20,9,15,6,14$ 的第一四分位数 $Q_1$ 和第三四分位数 $Q_3$。", "options": [{"id": "a", "text": "$Q_1=7$，$Q_3=15$", "feedback": "$9$ 个数据时，中位数本身不归入左右两侧。"}, {"id": "b", "text": "$Q_1=6.5$，$Q_3=16.5$", "feedback": "排序后中位数是 $12$，左侧 $3,6,7,9$、右侧 $14,15,18,20$ 各取中位数。"}, {"id": "c", "text": "$Q_1=6$，$Q_3=18$", "feedback": "四分位数不是直接取排序后的第 $2$ 个、第 $8$ 个数，要求左右两侧的中位数。"}, {"id": "d", "text": "$Q_1=6.25$，$Q_3=16.75$", "feedback": "左右两侧要各取中位数，不是求两侧数据的平均数。"}], "correct": "b", "answer": "$Q_1=6.5$，$Q_3=16.5$", "reasoning": ["排序：$3,6,7,9,12,14,15,18,20$，共 $9$ 个，中位数 $Q_2=12$。", "奇数个数据，中位数不计入两侧：左侧 $3,6,7,9$，右侧 $14,15,18,20$。", "$Q_1=\\frac{6+7}2=6.5$，$Q_3=\\frac{15+18}2=16.5$。"], "contentVersion": "sha256:ff4e8551942c528c35a05feb01c9e07fd9d30264d00f519826d7aead481c9055"}, {"id": "j24-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j24-4"], "pointIds": ["pyjh.data.017"], "prompt": "要按组内离差平方和最小的原则，把 $8$ 个互不相同的数据分成两组。先把数据从小到大排序后，最多需要比较多少种分法？", "options": [{"id": "a", "text": "$8$ 种", "feedback": "分法对应相邻两数之间的间隔，$8$ 个数据的间隔不是 $8$ 个。"}, {"id": "b", "text": "$7$ 种", "feedback": "排序后只需在相邻两数之间切开，$8$ 个数据有 $7$ 个间隔。"}, {"id": "c", "text": "$1$ 种", "feedback": "不一定从中位数处平分，两组个数可以不同。"}, {"id": "d", "text": "$28$ 种", "feedback": "排序后相近的数挨在一起，跳着把数凑成一组不会更好，只需考虑在相邻两数之间切开。"}], "correct": "b", "answer": "$7$ 种", "reasoning": ["排序后取值相近的数挨在一起，组内差异最小的分法一定是在某两个相邻数之间切开。", "$8$ 个数据有 $8-1=7$ 个间隔，所以最多比较 $7$ 种分法。"], "contentVersion": "sha256:39a4a3a9fbbe096c2ddc1532245a5b7b55e3e36122910d796493b3da7a560053"}, {"id": "j24-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j24-1"], "pointIds": ["pyjh.data.003", "pyjh.data.001"], "prompt": "某班 $40$ 名同学的测试成绩分组统计如下：$60\\le x<70$ 有 $4$ 人，$70\\le x<80$ 有 $10$ 人，$80\\le x<90$ 有 $16$ 人，$90\\le x<100$ 有 $10$ 人。用组中值估计这个班的平均成绩，约为多少分？", "options": [{"id": "a", "text": "约 $80$ 分", "feedback": "直接平均了四个组中值，各组人数不同，要以人数为权。"}, {"id": "b", "text": "约 $78$ 分", "feedback": "用了各组的下限，代表一组数据的应该是组中值。"}, {"id": "c", "text": "约 $83$ 分", "feedback": "组中值为 $65,75,85,95$，以人数为权求加权平均数。"}, {"id": "d", "text": "约 $88$ 分", "feedback": "用了各组的上限，代表一组数据的应该是组中值。"}], "correct": "c", "answer": "约 $83$ 分", "reasoning": ["四组的组中值依次为 $65,75,85,95$。", "$\\frac{65\\times4+75\\times10+85\\times16+95\\times10}{40}=\\frac{3320}{40}=83$。", "组内数据不都等于组中值，所以 $83$ 分是估计值。"], "contentVersion": "sha256:16edb23d53a3f68590219fb4aa58726f2b656bab51ca72f0d4cef347698c1cf3"}, {"id": "j24-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j24-2"], "pointIds": ["pyjh.data.010", "pyjh.data.012"], "prompt": "甲、乙两名射击运动员各射击 $5$ 次，成绩（单位：环）如下：甲 $7,8,9,8,8$；乙 $6,9,8,10,7$。下列判断正确的是哪一项？", "options": [{"id": "a", "text": "乙有一次打出 $10$ 环，所以乙的成绩更稳定", "feedback": "稳定性要看方差，不看最高成绩。"}, {"id": "b", "text": "两人平均数相同，乙的方差较小，乙更稳定", "feedback": "乙的离差平方和是 $4+1+0+4+1=10$，比甲大。"}, {"id": "c", "text": "两人平均数相同，甲的方差较小，甲更稳定", "feedback": "两人平均数都是 $8$ 环，甲方差 $0.4$，乙方差 $2$。"}, {"id": "d", "text": "乙的方差较大，所以乙的平均水平较高", "feedback": "方差只反映波动大小，与平均水平的高低无关。"}], "correct": "c", "answer": "两人平均数相同，甲的方差较小，甲更稳定", "reasoning": ["两人平均数都是 $8$ 环。", "甲：$s^2=\\frac{1+0+1+0+0}5=0.4$；乙：$s^2=\\frac{4+1+0+4+1}5=2$。", "平均数相同，甲的方差较小，成绩波动小，更稳定。"], "contentVersion": "sha256:73e831dda374b880a76683fe0c33031299371df9ac5208d5733179ae5d6b009c"}, {"id": "j24-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j24-3"], "pointIds": ["pyjh.data.016", "pyjh.data.015"], "prompt": "甲、乙两班数学成绩箱线图的五个数（依次为最小值、$Q_1$、中位数、$Q_3$、最大值）是：甲班 $50,65,72,80,95$；乙班 $55,70,76,82,90$。下列说法正确的是哪一项？", "options": [{"id": "a", "text": "甲班的箱体较长，说明甲班的人数较多", "feedback": "箱线图看不出数据个数，箱体长说明中间一半的数据较分散。"}, {"id": "b", "text": "甲班的中位数较高", "feedback": "甲班中位数 $72$，乙班 $76$，比较时看刻度上的数值。"}, {"id": "c", "text": "甲班的最大值较大，所以甲班整体成绩较好", "feedback": "只比较最大值不能判断整体，应先比较中位数。"}, {"id": "d", "text": "乙班的四分位距较小，中间约一半的成绩更集中", "feedback": "乙班 $82-70=12$，甲班 $80-65=15$，乙班箱体较短。"}], "correct": "d", "answer": "乙班的四分位距较小，中间约一半的成绩更集中", "reasoning": ["中位数：乙班 $76$ 高于甲班 $72$。", "四分位距：甲班 $80-65=15$，乙班 $82-70=12$，乙班中间约一半的成绩更集中。", "箱线图不反映数据个数；整体比较先看中位数，不只看最大值。"], "contentVersion": "sha256:568196ce2e786254fba8c38e7874f08c31ce6e3a72fcb8323335ada2061dfbd9"}, {"id": "j24-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j24-2"], "pointIds": ["pyjh.data.011", "pyjh.data.009"], "prompt": "A 组有 $5$ 个数据，离差平方和为 $30$；B 组有 $8$ 个数据，离差平方和为 $40$。哪组数据的离散程度大？", "options": [{"id": "a", "text": "A 组，因为 A 组的方差较大", "feedback": "两组个数不同，比较方差：$s_A^2=\\frac{30}5$，$s_B^2=\\frac{40}8$。"}, {"id": "b", "text": "B 组，因为 B 组的离差平方和较大", "feedback": "两组数据个数不同时，不能直接比较离差平方和。"}, {"id": "c", "text": "两组一样，因为离差的和都是 $0$", "feedback": "离差的和总是 $0$，不能用来比较离散程度。"}, {"id": "d", "text": "B 组，因为 B 组的数据个数较多", "feedback": "数据个数多并不说明波动大。"}], "correct": "a", "answer": "A 组，因为 A 组的方差较大", "reasoning": ["两组数据个数不同，要比较方差。", "$s_A^2=\\frac{30}5=6$，$s_B^2=\\frac{40}8=5$。", "$6>5$，A 组数据的离散程度大。"], "contentVersion": "sha256:236e304cfb06575234a00481d38456c3fb03429f6c73623394ea22d62b79d408"}, {"id": "j24-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j24-2", "j24-4"], "pointIds": ["pyjh.data.018", "pyjh.data.009"], "prompt": "按组内离差平方和最小的原则，把数据 $2,3,7,9,10,14$ 分成两组，应怎样分？", "options": [{"id": "a", "text": "$\\{2,3,7\\}$ 和 $\\{9,10,14\\}$", "feedback": "两组个数不一定相等，算一算：这种分法的组内离差平方和是 $14+14=28$。"}, {"id": "b", "text": "$\\{2,3\\}$ 和 $\\{7,9,10,14\\}$", "feedback": "组内离差平方和 $0.5+26=26.5$，是 $5$ 种分法中最小的。"}, {"id": "c", "text": "$\\{2,3,7,9\\}$ 和 $\\{10,14\\}$", "feedback": "这种分法的组内离差平方和是 $32.75+8=40.75$，不是最小的。"}, {"id": "d", "text": "$\\{2\\}$ 和 $\\{3,7,9,10,14\\}$", "feedback": "只有一个数据的组离差平方和为 $0$，但另一组内部差异很大，合计 $65.2$。"}], "correct": "b", "answer": "$\\{2,3\\}$ 和 $\\{7,9,10,14\\}$", "reasoning": ["数据已排好序，$6$ 个数有 $5$ 种在相邻两数之间切开的分法。", "每组用本组平均数算离差平方和，各分法的组内离差平方和依次为 $65.2$、$26.5$、$28$、$40.75$、$50.8$。", "最小的是 $26.5$，对应 $\\{2,3\\}$ 和 $\\{7,9,10,14\\}$。"], "contentVersion": "sha256:a1cbd75324e7cc47dd73603045ca9421e782c2f3cf9831cc0572aad180b241b2"}, {"id": "j24-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j24-1", "j24-2"], "pointIds": ["pyjh.data.002", "pyjh.data.009"], "prompt": "一组 $5$ 个数据的平均数是 $6$，方差是 $2$。再添加一个数据 $6$，得到 $6$ 个数据的新数据组。新数据组的方差是多少？", "options": [{"id": "a", "text": "$2$", "feedback": "平均数没变，但数据个数从 $5$ 变成 $6$，离差平方和要除以新的个数。"}, {"id": "b", "text": "$\\frac53$", "feedback": "原离差平方和 $5\\times2=10$，新数据的离差为 $0$，新方差 $\\frac{10}6$。"}, {"id": "c", "text": "$10$", "feedback": "这是离差平方和，还要除以数据个数。"}, {"id": "d", "text": "$\\frac{23}3$", "feedback": "把数据 $6$ 本身当成了离差，新数据的离差是 $6-6=0$。"}], "correct": "b", "answer": "$\\frac53$", "reasoning": ["新平均数 $\\frac{6\\times5+6}{6}=6$，没有变。", "原离差平方和 $d^2=5\\times2=10$；新数据 $6$ 的离差为 $0$，新离差平方和仍是 $10$。", "新方差 $s^2=\\frac{10}6=\\frac53$。"], "contentVersion": "sha256:2d1611a3b7042d7d0b4333696fdb7b240a7aa7ef691da8714d6c20be9b0422cf"}, {"id": "j24-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j24-2", "j24-4"], "pointIds": ["pyjh.data.019", "pyjh.data.009"], "prompt": "把数据 $1,2,3,7,8,9$ 分成 $\\{1,2,3\\}$ 和 $\\{7,8,9\\}$ 两组。这种分法的组间离差平方和是多少？", "options": [{"id": "a", "text": "$4$", "feedback": "这是组内离差平方和 $2+2$，组间离差平方和表示两组之间的差异。"}, {"id": "b", "text": "$36$", "feedback": "组间离差平方和不是两组平均数之差的平方，要用各组平均数与总平均数之差。"}, {"id": "c", "text": "$18$", "feedback": "每组平均数与总平均数之差的平方，还要乘本组的数据个数 $3$。"}, {"id": "d", "text": "$54$", "feedback": "总平均数 $5$，两组平均数 $2$、$8$，$3\\times(2-5)^2+3\\times(8-5)^2$。"}], "correct": "d", "answer": "$54$", "reasoning": ["总平均数 $\\overline x=5$，两组平均数分别是 $2$ 和 $8$。", "组间离差平方和 $=3\\times(2-5)^2+3\\times(8-5)^2=27+27=54$。", "检验：总离差平方和 $16+9+4+4+9+16=58$，组内 $2+2=4$，$58-4=54$。"], "contentVersion": "sha256:dcdb2da40c172b6cfeb6810d60823dea2ac8ae10973b0ff956dc4377f5291d6d"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
