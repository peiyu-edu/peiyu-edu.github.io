        <ol class="l3-steps">
          <li>上方选三个实验：基底分解、正交分解、能否做基底。</li>
          <li>「基底分解」里拖 ψ：e₃ 越贴近底面，平行六面体越扁，系数 z 越大。</li>
          <li>「正交分解」里拖 x、y、z：OP 与 i、j、k 的数量积正好是三个系数。</li>
          <li>「能否做基底」可以换四组向量：第三个向量落在前两个向量所在的蓝色平面里时，体积是 0，不能做基底。</li>
          <li>按住拖动可以转动模型，系数、长度和体积随时重算；被挡住的线画成虚线。</li>
        </ol>
      </div>
