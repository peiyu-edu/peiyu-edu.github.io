<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" width="600" height="310" role="img" aria-labelledby="title desc">
<title id="title">获奖作品条形图</title>
<desc id="desc">条形图，纵轴作品数，刻度标 0、10、a、50，横轴等级。一等奖条高 10，二等奖条高 a，三等奖条高 50，优胜奖条高 10，各条顶端有虚线连到纵轴。</desc>
<style>text{fill:#17202a;font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:32px;}.n{font-family:'Times New Roman',Georgia,serif;font-size:30px;}.h{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;}</style>
<rect width="600" height="310" fill="white"/>
<line x1="70.0" y1="262.0" x2="555.0" y2="262.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<polygon points="570.0,262.0 554.0,255.0 554.0,269.0" fill="#17202a"/>
<line x1="70.0" y1="262.0" x2="70.0" y2="30.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<polygon points="70.0,16.0 63.0,32.0 77.0,32.0" fill="#17202a"/>
<text x="82.0" y="42.0" text-anchor="start">作品数</text>
<line x1="70.0" y1="222.0" x2="400.0" y2="222.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 7"/>
<text x="60.0" y="232.0" text-anchor="end" class="n">10</text>
<line x1="70.0" y1="142.0" x2="217.0" y2="142.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 7"/>
<line x1="70.0" y1="62.0" x2="309.0" y2="62.0" stroke="#17202a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10 7"/>
<text x="60.0" y="72.0" text-anchor="end" class="n">50</text>
<text x="60.0" y="152.0" text-anchor="end" class="m">a</text>
<text x="60.0" y="284.0" text-anchor="end" class="n">0</text>
<rect x="87.0" y="222.0" width="76.0" height="40.0" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="125.0" y="296.0" text-anchor="middle">一等奖</text>
<rect x="179.0" y="142.0" width="76.0" height="120.0" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="217.0" y="296.0" text-anchor="middle">二等奖</text>
<rect x="271.0" y="62.0" width="76.0" height="200.0" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="309.0" y="296.0" text-anchor="middle">三等奖</text>
<rect x="363.0" y="222.0" width="76.0" height="40.0" fill="white" stroke="#17202a" stroke-width="3"/>
<text x="401.0" y="296.0" text-anchor="middle">优胜奖</text>
<text x="598.0" y="296.0" text-anchor="end">等级</text>
</svg>
