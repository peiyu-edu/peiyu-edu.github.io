<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二年级下册 第四单元 万以内的加法和减法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p2b-u4-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>二年级下册 第四单元 万以内的加法和减法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p2b-u4-test", "sectionId": "p2b-u4-test", "unitId": "p2b-u4", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "二年级下册 第四单元 万以内的加法和减法 单元测评", "items": [{"id": "p2b-u4-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：254 + 138 = ？", "answer": "392", "reasoning": ["相同数位对齐，从个位加起：4 + 8 = 12，个位写 2，向十位进 1。", "十位 5 + 3 + 1 = 9，百位 2 + 1 = 3，得 392。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u4.001"], "contentVersion": "sha256:9ebdfd9f13a3a320e61bc26e09d80c16c55b799d6c6a56da0ff29ba60f1d790a"}, {"id": "p2b-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：368 + 275 = ？", "answer": "643", "reasoning": ["个位 8 + 5 = 13，写 3 进 1；十位 6 + 7 + 1 = 14，写 4 进 1。", "百位 3 + 2 + 1 = 6，得 643。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u4.002"], "contentVersion": "sha256:938b62ca1dff88a989747e46add816ac7974f59104b47424d17ab1ca0205eb13"}, {"id": "p2b-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：642 − 318 = ？", "answer": "324", "reasoning": ["个位 2 减 8 不够减，从十位退 1 当 10：12 − 8 = 4。", "十位 4 退 1 后剩 3，3 − 1 = 2；百位 6 − 3 = 3，得 324。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u4.003"], "contentVersion": "sha256:106326d4840e1ffa5fac16814b6d0ff3d37de4a03522bd60dbb49e45981991cd"}, {"id": "p2b-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：503 − 267 = ？", "answer": "236", "reasoning": ["个位 3 减 7 不够减，十位是 0，要从百位退 1：百位剩 4，十位变成 10，再退 1 给个位，十位剩 9。", "个位 13 − 7 = 6，十位 9 − 6 = 3，百位 4 − 2 = 2，得 236。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u4.004"], "contentVersion": "sha256:feb7ffb06aa2e7e81c1460eaf0794e418a465198577b6ee46f4ce40d23086485"}, {"id": "p2b-u4-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "小明算 457 + 386 = 833。他算得对吗？", "answer": "不对，应该是 843", "reasoning": ["个位 7 + 6 = 13，写 3 进 1；十位 5 + 8 + 1 = 14，写 4 进 1；百位 4 + 3 + 1 = 8。", "正确得数是 843，可以交换加数验算：386 + 457 = 843。"], "options": [{"id": "a", "text": "对", "feedback": "交换加数再算一遍：386 + 457 = 843，不是 833。"}, {"id": "b", "text": "不对，应该是 843", "feedback": "对。个位满十，要向十位进 1。十位应算 5 + 8 + 1 = 14，他漏加了个位进到十位的 1。"}, {"id": "c", "text": "不对，应该是 733", "feedback": "百位 4 + 3 再加进上来的 1 是 8，得数是八百多。"}], "correct": "b", "pointIds": ["pyps.p2b.u4.002"], "contentVersion": "sha256:8d6dc9aa438eafee701f25cb3e93306f76c5d89cb3b6e01b0012207b17244b38"}, {"id": "p2b-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "在横线上填数：____ + 245 = 600；　720 − ____ = 380", "answer": "355，340", "reasoning": ["求一个加数，用和减另一个加数：600 − 245 = 355。", "求减数，用被减数减差：720 − 380 = 340。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u4.005"], "contentVersion": "sha256:5f173b5cc28f09db08d7ec471f452fbf3d361614e66871994e5392426cd94a14"}, {"id": "p2b-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "验算 800 − 356 = 444 对不对，可以用下面哪个算式？", "answer": "444 + 356", "reasoning": ["减法验算：用差加减数，看是不是等于被减数。", "444 + 356 = 800，所以 800 − 356 = 444 算对了。"], "options": [{"id": "a", "text": "800 + 356", "feedback": "验算减法不是把被减数和减数相加，要用差加减数。"}, {"id": "b", "text": "444 − 356", "feedback": "验算减法用差加减数，看是否等于被减数。"}, {"id": "c", "text": "444 + 356", "feedback": "对。差加减数等于被减数：444 + 356 = 800，说明算对了。"}], "correct": "c", "pointIds": ["pyps.p2b.u4.004", "pyps.p2b.u4.005"], "contentVersion": "sha256:ef9dd5fef88a859351f5c764c4cb3decef283b430800e0160687554fa1df706c"}, {"id": "p2b-u4-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "妈妈带了 500 元，想买一件 268 元的衣服和一双 195 元的鞋。不用精确计算，估一估钱够不够？", "answer": "够", "reasoning": ["往大估：268 元不到 300 元，195 元不到 200 元。", "300 + 200 = 500，实际花的比 500 元少，所以够。精确算：268 + 195 = 463（元）。"], "options": [{"id": "a", "text": "够", "feedback": "对。268 不到 300，195 不到 200，300 + 200 = 500，所以 500 元够。"}, {"id": "b", "text": "不够", "feedback": "往大估：268 < 300，195 < 200，合起来还不到 500 元。"}, {"id": "c", "text": "估不出来", "feedback": "可以把两个价钱都往大估成整百数再比较。"}], "correct": "a", "pointIds": ["pyps.p2b.u4.006", "pyps.p2b.u4.002"], "contentVersion": "sha256:9238cfc0ade9e7dae3df22d7f8674c67b213c3a8b019e1ea4e47bd10ba8027a6"}, {"id": "p2b-u4-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "图书室有故事书 386 本，科技书比故事书多 127 本。科技书有多少本？", "answer": "513 本", "reasoning": ["比故事书多 127 本，用加法：386 + 127。", "个位 6 + 7 = 13 进 1，十位 8 + 2 + 1 = 11 进 1，百位 3 + 1 + 1 = 5，得 513（本）。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u4.002"], "contentVersion": "sha256:41c02eeede5cb5730b0de5b9f1466f18546b363e34e22ee61ce55661b64d1b33"}, {"id": "p2b-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一列火车有 900 个座位，已经坐了 645 人，还空着多少个座位？", "answer": "255 个", "reasoning": ["求还空着的，用减法：900 − 645。", "个位、十位都是 0，要从百位连着退位：900 − 645 = 255（个）。可以用 255 + 645 = 900 验算。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u4.004", "pyps.p2b.u4.005"], "contentVersion": "sha256:b7ff9a338d80a78982da40d7df2fee505de2765986a3254ee72cd6fdf1b71940"}], "contentVersion": "sha256:2739f3109e7050f92051360bf1eb28a5df5d38d73dfb7519d3c89220139833eb"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
