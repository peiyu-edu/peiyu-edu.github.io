<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 215" role="img" aria-labelledby="title desc"><title id="title">矩形ABCD中的线段</title><desc id="desc">矩形ABCD，A在左上，D在右上，B在左下，C在右下。E、F依次在BC上，连接AE、AF；从E画线段交AF于N，并延长交AD于M（M靠近D）。</desc><style>path,circle,line,polyline,polygon,ellipse{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.cjk{font-family:"Noto Sans CJK SC",sans-serif}.dash{stroke-dasharray:6 5}.thin{stroke-width:1}.grid{stroke-width:1;stroke-dasharray:3 3;opacity:.55}.dot{fill:currentColor;stroke:none}.bar{fill:currentColor;fill-opacity:.35}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M40.00,60.00L40.00,180.00L274.00,180.00L274.00,60.00Z"/><path d="M40.00,60.00L80.00,180.00"/><path d="M40.00,60.00L130.00,180.00"/><path d="M80.00,180.00L240.00,60.00"/><text x="40.00" y="51.00" text-anchor="middle" font-size="20" font-style="italic">A</text><text x="280.00" y="51.00" text-anchor="middle" font-size="20" font-style="italic">D</text><text x="232.00" y="51.00" text-anchor="middle" font-size="20" font-style="italic">M</text><text x="40.00" y="203.00" text-anchor="middle" font-size="20" font-style="italic">B</text><text x="80.00" y="203.00" text-anchor="middle" font-size="20" font-style="italic">E</text><text x="130.00" y="203.00" text-anchor="middle" font-size="20" font-style="italic">F</text><text x="274.00" y="203.00" text-anchor="middle" font-size="20" font-style="italic">C</text><text x="134.00" y="164.00" text-anchor="middle" font-size="20" font-style="italic">N</text></svg>
