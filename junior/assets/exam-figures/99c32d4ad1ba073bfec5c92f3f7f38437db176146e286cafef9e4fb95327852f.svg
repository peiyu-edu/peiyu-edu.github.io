<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 585 930" width="585" height="930" role="img" aria-labelledby="title desc">
<title id="title">一周工作量剩余情况统计图</title>
<desc id="desc">题 21－1 图是不完整的条形统计图：横轴类别依次为不剩、剩少量、剩一半、剩大量，纵轴为人数，刻度每格 40。不剩的条形高到 400，剩一半高到 80，剩大量高到 40，剩少量没有画条形。题 21－2 图是扇形统计图，分不剩、剩少量、剩一半、剩大量四块，只标出不剩占 50%。</desc>
