<section class="card"><h2>复习怎么安排</h2><p>第一次完成后隔1天复习；到期独立做对后，依次隔3、7、14天。同一天反复提交不会跳级，没做对或借助提示则回到1天。这里最多安排8道题。</p>
<p>交错练习在作答前收起专题、方法和相关题提示，作答后再显示。做题记录仍保存在「我的学习」。</p>

 "label": "2023 年北京预赛", "lv": 2, "type": "blank"}, {"id": "P010448", "fr": "FR035", "stage": "contrast", "nodes": ["area-height", "feasible-check", "quantity-check"], "focus": "面积比先转为同底方向的线段参数，再检查整参条件与点在线段上的范围。", "label": "2009 年天津预赛 第 2 题", "lv": 2, "type": "blank"}, {"id": "P006837", "fr": "FR035", "stage": "contrast", "nodes": ["correspondence", "right-triangle", "feasible-check"], "focus": "重复构造保留面积比例，逐条检查恒等式和不等式，不能把特殊取等当成恒成立。", "label": "2022 年贵州预赛", "lv": 2, "type": "choice"}, {"id": "P010856", "fr": "FR035", "stage": "transfer", "nodes": ["correspondence", "cosine-rule", "area-height", "quantity-check"], "focus": "先把角平分线比例还原为边长，检查合法三角形后再求面积。", "label": "2010 年湖北预赛 第 2 题", "lv": 2, "type": "blank"}, {"id": "P009453", "fr": "FR035", "stage": "transfer", "nodes": ["angle-range", "correspondence", "area-height", "feasible-check"], "focus": "在纸上分步求边长和面积；代数候选要按正长度排除，再说明面积分割比例。", "label": "2016 年黑龙江预赛 第 20 题", "lv": 2, "type": "proof"}]}]}</script><script src="assets/training.js?v=61d7a99c" defer></script><script src="assets/problems.js?v=61d7a99c"></script>
