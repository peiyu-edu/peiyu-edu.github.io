<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img"><title>等边三角形纸片的折叠</title><desc>等边三角形ABC的边长为10，E、F分别在AB、AC上，沿EF折叠后A落在BC的中点D；AE、AF为虚线，EF、ED、FD为实线。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><line x1="180" y1="40" x2="120" y2="143.923" class="dash"></line><line x1="180" y1="40" x2="240" y2="143.923" class="dash"></line><polygon points="120,143.923 60,247.846 300,247.846 240,143.923" class=""></polygon><line x1="120" y1="143.923" x2="180" y2="247.846" class=""></line><line x1="240" y1="143.923" x2="180" y2="247.846" class=""></line><text x="180" y="26">A</text><text x="42" y="270">B</text><text x="317" y="270">C</text><text x="180" y="275">D</text><text x="99" y="148">E</text><text x="260" y="148">F</text></svg>
