<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 8 章 实数 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="junior" data-sec="j8-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 8 章 实数 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j8-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j8-test", "sectionId": "j8-test", "chapterId": "j8", "title": "第 8 章 实数 · 章末测验", "label": "章末测验", "sections": ["j8-1", "j8-2", "j8-3"], "items": [{"id": "j8-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j8-1"], "pointIds": ["pyjh.real.001"], "prompt": "$16$ 的平方根是什么？", "options": [{"id": "a", "text": "$4$", "feedback": "漏掉了负的那一个：$(-4)^2$ 也等于 $16$。"}, {"id": "b", "text": "$-4$", "feedback": "漏掉了正的那一个。"}, {"id": "c", "text": "$\\pm4$", "feedback": "正数有两个平方根，它们互为相反数。"}, {"id": "d", "text": "$256$", "feedback": "这是 $16$ 的平方，不是平方根。"}], "correct": "c", "answer": "$\\pm4$", "reasoning": ["如果 $x^2=16$，那么 $x$ 叫作 $16$ 的平方根。", "$4^2=16$，$(-4)^2=16$，所以 $16$ 的平方根是 $\\pm4$。"], "contentVersion": "sha256:fe17f8a37ac4fc203deef46474b49c8883675b2d48f2cac0ded76a8f5930f35a"}, {"id": "j8-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j8-1"], "pointIds": ["pyjh.real.002"], "prompt": "$\\sqrt{81}$ 的算术平方根是多少？", "options": [{"id": "a", "text": "$\\pm3$", "feedback": "算术平方根只取非负的那一个。"}, {"id": "b", "text": "$9$", "feedback": "$9$ 是 $\\sqrt{81}$ 本身，题目要的是它的算术平方根。"}, {"id": "c", "text": "$\\pm9$", "feedback": "先算出 $\\sqrt{81}$，再求它的算术平方根，且只取非负值。"}, {"id": "d", "text": "$3$", "feedback": "$\\sqrt{81}=9$，$9$ 的算术平方根是 $3$。"}], "correct": "d", "answer": "$3$", "reasoning": ["$\\sqrt{81}=9$。", "$9$ 的算术平方根是 $\\sqrt9=3$。"], "contentVersion": "sha256:69012e2eb3d6abf5a183085f21e1394df9fc92246448f52949e7d5805b67e8e2"}, {"id": "j8-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j8-2"], "pointIds": ["pyjh.real.008"], "prompt": "$\\sqrt[3]{-27}$ 的值是多少？", "options": [{"id": "a", "text": "$3$", "feedback": "负数的立方根是负数。"}, {"id": "b", "text": "$-3$", "feedback": "$(-3)^3=-27$。"}, {"id": "c", "text": "$\\pm3$", "feedback": "一个数的立方根只有一个。"}, {"id": "d", "text": "$-9$", "feedback": "$(-9)^3=-729$，不是 $-27$。"}], "correct": "b", "answer": "$-3$", "reasoning": ["如果 $x^3=-27$，那么 $x$ 是 $-27$ 的立方根。", "$(-3)^3=-27$，且立方根唯一，所以 $\\sqrt[3]{-27}=-3$。"], "contentVersion": "sha256:be1b874f92cde5ab682030386d28221eb752ea5e263725fbac01adb554b3e003"}, {"id": "j8-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j8-3"], "pointIds": ["pyjh.real.012", "pyjh.real.011"], "prompt": "在 $\\frac{22}7$，$\\sqrt9$，$\\frac\\pi3$，$-\\sqrt[3]8$，$\\sqrt7$，$3.14$，$0$ 这七个数中，无理数有几个？", "options": [{"id": "a", "text": "$1$ 个", "feedback": "$\\frac\\pi3$ 和 $\\sqrt7$ 都是无限不循环小数。"}, {"id": "b", "text": "$2$ 个", "feedback": "先化简能化简的数，再判断是不是无限不循环小数。"}, {"id": "c", "text": "$3$ 个", "feedback": "$\\sqrt9=3$ 是整数，不是无理数。"}, {"id": "d", "text": "$4$ 个", "feedback": "$\\frac{22}7$ 是分数，$-\\sqrt[3]8=-2$ 是整数，都是有理数。"}], "correct": "b", "answer": "$2$ 个", "reasoning": ["$\\sqrt9=3$，$-\\sqrt[3]8=-2$，$\\frac{22}7$，$3.14$，$0$ 都是有理数。", "$\\frac\\pi3$ 和 $\\sqrt7$ 是无限不循环小数，是无理数，共 $2$ 个。"], "contentVersion": "sha256:6f9b10d843508a0a9adac497f3fb93f8afd82dee478a356dd1f1fa8298e8cca9"}, {"id": "j8-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j8-3"], "pointIds": ["pyjh.real.015"], "prompt": "$1-\\sqrt2$ 的绝对值是多少？", "options": [{"id": "a", "text": "$\\sqrt2-1$", "feedback": "$\\sqrt2>1$，$1-\\sqrt2$ 是负数，它的绝对值是它的相反数。"}, {"id": "b", "text": "$1-\\sqrt2$", "feedback": "$1-\\sqrt2<0$，负数的绝对值不是它本身。"}, {"id": "c", "text": "$1+\\sqrt2$", "feedback": "取相反数要把每一项都变号。"}, {"id": "d", "text": "$-1-\\sqrt2$", "feedback": "绝对值不会是负数。"}], "correct": "a", "answer": "$\\sqrt2-1$", "reasoning": ["$\\sqrt2\\approx1.414>1$，所以 $1-\\sqrt2<0$。", "负数的绝对值是它的相反数：$|1-\\sqrt2|=-(1-\\sqrt2)=\\sqrt2-1$。"], "contentVersion": "sha256:3a4f9440d2d531a02ae2b5ac185a90536652889555630dc72e57fa1fd85e2546"}, {"id": "j8-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j8-1"], "pointIds": ["pyjh.real.005"], "prompt": "$\\sqrt{30}$ 的值在哪两个相邻整数之间？", "options": [{"id": "a", "text": "$4$ 和 $5$", "feedback": "$5^2=25<30$，$\\sqrt{30}$ 比 $5$ 大。"}, {"id": "b", "text": "$5$ 和 $6$", "feedback": "找出与 $30$ 相邻的两个完全平方数。"}, {"id": "c", "text": "$6$ 和 $7$", "feedback": "$6^2=36>30$，$\\sqrt{30}$ 比 $6$ 小。"}, {"id": "d", "text": "$15$ 和 $16$", "feedback": "不能用 $30\\div2$ 估算平方根。"}], "correct": "b", "answer": "$5$ 和 $6$", "reasoning": ["$25<30<36$，即 $5^2<30<6^2$。", "所以 $5<\\sqrt{30}<6$。"], "contentVersion": "sha256:b6693525641ac756c2b59af6ede98be619780f14981cf8197d76137c33e93d6a"}, {"id": "j8-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j8-1"], "pointIds": ["pyjh.real.003", "pyjh.real.001"], "prompt": "解方程 $4x^2=9$，$x$ 的值是什么？", "options": [{"id": "a", "text": "$x=\\pm\\frac32$", "feedback": "先化为 $x^2=\\frac94$，再用平方根的意义。"}, {"id": "b", "text": "$x=\\frac32$", "feedback": "方程没有限制 $x$ 为正，负的平方根也满足方程。"}, {"id": "c", "text": "$x=\\pm\\frac94$", "feedback": "$\\frac94$ 是 $x^2$ 的值，还要开平方。"}, {"id": "d", "text": "$x=\\pm\\frac34$", "feedback": "$\\frac94$ 开平方时分子、分母都要开平方，$4$ 的算术平方根是 $2$。"}], "correct": "a", "answer": "$x=\\pm\\frac32$", "reasoning": ["两边除以 $4$：$x^2=\\frac94$。", "$x$ 是 $\\frac94$ 的平方根，$x=\\pm\\frac32$。", "检验：$4\\times\\left(\\pm\\frac32\\right)^2=4\\times\\frac94=9$。"], "contentVersion": "sha256:9fa6ea20be9807f8f697fc2fa928ebeb86315feb506cb4665ed1878569335a92"}, {"id": "j8-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j8-2"], "pointIds": ["pyjh.real.009"], "prompt": "一个正方体木块的体积是 $64\\,\\text{cm}^3$，把它锯成 $8$ 个大小相同的小正方体木块。每个小正方体的棱长是多少？", "options": [{"id": "a", "text": "$4\\,\\text{cm}$", "feedback": "这是原来大正方体的棱长。"}, {"id": "b", "text": "$8\\,\\text{cm}$", "feedback": "这是每个小正方体的体积，还要开立方。"}, {"id": "c", "text": "$2\\,\\text{cm}$", "feedback": "先求小正方体的体积，再求它的立方根。"}, {"id": "d", "text": "$\\frac12\\,\\text{cm}$", "feedback": "小正方体的体积是 $64\\div8$，不是 $8\\div64$。"}], "correct": "c", "answer": "$2\\,\\text{cm}$", "reasoning": ["每个小正方体的体积是 $64\\div8=8$（$\\text{cm}^3$）。", "棱长 $\\sqrt[3]8=2$（cm）。"], "contentVersion": "sha256:0d8a021709e3dac29b97b5f78bb654fb644f869536154b3bc5d6aa603c368861"}, {"id": "j8-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j8-1", "j8-3"], "pointIds": ["pyjh.real.014", "pyjh.real.005"], "prompt": "$-\\sqrt{10}$，$-3.2$，$-3.3$，$-\\sqrt{11}$ 这四个数中，最大的是哪一个？", "options": [{"id": "a", "text": "$-\\sqrt{10}$", "feedback": "两个负数比较，绝对值小的反而大；先比较四个数的绝对值。"}, {"id": "b", "text": "$-3.2$", "feedback": "$3.2^2=10.24>10$，所以 $\\sqrt{10}<3.2$。"}, {"id": "c", "text": "$-3.3$", "feedback": "它的绝对值不是四个数中最小的。"}, {"id": "d", "text": "$-\\sqrt{11}$", "feedback": "被开方数越大，算术平方根越大，它的绝对值不小。"}], "correct": "a", "answer": "$-\\sqrt{10}$", "reasoning": ["比较绝对值：$3.2^2=10.24$，$3.3^2=10.89$，所以 $\\sqrt{10}<3.2<3.3<\\sqrt{11}$。", "负数绝对值小的反而大，最大的是 $-\\sqrt{10}$。"], "contentVersion": "sha256:84a8163f27956c41ae7c9771fec226ff59df8c3a61b98b5c1850893c2133be82"}, {"id": "j8-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j8-1", "j8-2", "j8-3"], "pointIds": ["pyjh.real.016", "pyjh.real.015", "pyjh.real.008", "pyjh.real.002"], "prompt": "计算 $\\sqrt[3]{-8}+\\sqrt{16}-|1-\\sqrt3|$。", "options": [{"id": "a", "text": "$1+\\sqrt3$", "feedback": "$|1-\\sqrt3|=\\sqrt3-1$，减去它时要整体加括号。"}, {"id": "b", "text": "$7-\\sqrt3$", "feedback": "负数的立方根是负数，$\\sqrt[3]{-8}$ 不是 $2$。"}, {"id": "c", "text": "$3-\\sqrt3$", "feedback": "先分别化简立方根、算术平方根和绝对值，再计算。"}, {"id": "d", "text": "$1-\\sqrt3$", "feedback": "$-(\\sqrt3-1)=-\\sqrt3+1$，括号前是减号，两项都要变号。"}], "correct": "c", "answer": "$3-\\sqrt3$", "reasoning": ["$\\sqrt[3]{-8}=-2$，$\\sqrt{16}=4$；$\\sqrt3>1$，$|1-\\sqrt3|=\\sqrt3-1$。", "原式 $=-2+4-(\\sqrt3-1)=-2+4-\\sqrt3+1=3-\\sqrt3$。"], "contentVersion": "sha256:c420c69324b0991cc5f8ba2253a71e85694ecf2b3062d87c266e3313d2731533"}, {"id": "j8-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j8-1"], "pointIds": ["pyjh.real.001", "pyjh.eq.009"], "prompt": "一个正数的两个平方根分别是 $2a-1$ 和 $a-5$，这个正数是多少？", "options": [{"id": "a", "text": "$2$", "feedback": "这是 $a$ 的值，还要求出平方根，再求这个正数。"}, {"id": "b", "text": "$3$", "feedback": "这是它的一个平方根，还要平方。"}, {"id": "c", "text": "$9$", "feedback": "一个正数的两个平方根互为相反数，和为 $0$。"}, {"id": "d", "text": "$81$", "feedback": "平方根是 $\\pm3$，正数是 $3^2$，不是 $9^2$。"}], "correct": "c", "answer": "$9$", "reasoning": ["正数的两个平方根互为相反数：$(2a-1)+(a-5)=0$，$3a=6$，$a=2$。", "两个平方根是 $3$ 和 $-3$，这个正数是 $3^2=9$。"], "contentVersion": "sha256:2ef1818133223d013e139e72fe6df34f2eec6f2e0a8c5d828eef99e91040b596"}, {"id": "j8-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j8-1", "j8-2"], "pointIds": ["pyjh.real.002", "pyjh.real.008", "pyjh.rat.006"], "prompt": "已知 $\\sqrt{x-2}+|y+10|=0$，求 $x+y$ 的立方根。", "options": [{"id": "a", "text": "$2$", "feedback": "$x+y$ 是负数，它的立方根也是负数。"}, {"id": "b", "text": "$-2$", "feedback": "算术平方根和绝对值都是非负数，和为 $0$ 时两者都为 $0$。"}, {"id": "c", "text": "$\\pm2$", "feedback": "一个数的立方根只有一个。"}, {"id": "d", "text": "$-8$", "feedback": "这是 $x+y$ 的值，还要求立方根。"}], "correct": "b", "answer": "$-2$", "reasoning": ["$\\sqrt{x-2}\\ge0$，$|y+10|\\ge0$，两个非负数的和为 $0$，则它们都为 $0$。", "$x-2=0$，$y+10=0$，所以 $x=2$，$y=-10$，$x+y=-8$。", "$\\sqrt[3]{-8}=-2$。"], "contentVersion": "sha256:e50d984e5f3582a78afbe6204da591841d2d2a3c1c14bb09d9a27a0852cda502"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
