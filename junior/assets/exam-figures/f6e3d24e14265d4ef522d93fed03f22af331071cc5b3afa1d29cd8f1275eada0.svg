<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 548 504" width="548" height="504" role="img" aria-labelledby="title desc">
<title id="title">人民广场位置示意图</title>
<desc id="desc">中央是圆形的人民广场，外面围着一圈环岛道路，环路上共连 6 条道路。下方入口是人民大街，箭头表示车辆从人民大街驶入后沿环路逆时针行驶。出口 B 在正上方，出口 A 在右上方，出口 C 在左上方；右下和左下另有两条道路，未标字母。图右侧有指北箭头。</desc>
