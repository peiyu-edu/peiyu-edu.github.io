<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 26 章 二次函数 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j26-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 26 章 二次函数 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j26-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j26-test", "sectionId": "j26-test", "chapterId": "j26", "title": "第 26 章 二次函数 · 章末测验", "label": "章末测验", "sections": ["j26-1", "j26-2", "j26-3", "j26-4"], "items": [{"id": "j26-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j26-1"], "pointIds": ["pyjh.qfun.001"], "prompt": "下列函数中，$y$ 是 $x$ 的二次函数的是哪一个？", "options": [{"id": "a", "text": "$y=3x-1$", "feedback": "自变量的最高次数是 $1$，是一次函数。"}, {"id": "b", "text": "$y=\\frac{1}{x^2}$", "feedback": "右边不是整式，不是二次函数。"}, {"id": "c", "text": "$y=(x+1)^2-x^2$", "feedback": "展开后 $x^2$ 抵消，得 $y=2x+1$。"}, {"id": "d", "text": "$y=2(x-1)^2$", "feedback": "展开得 $y=2x^2-4x+2$，二次项系数 $2\\ne0$。"}], "correct": "d", "answer": "$y=2(x-1)^2$", "reasoning": ["二次函数要能整理成 $y=ax^2+bx+c$（$a\\ne0$），右边是整式。", "$y=2(x-1)^2=2x^2-4x+2$，符合。", "$y=(x+1)^2-x^2$ 化简后二次项抵消；$y=\\frac{1}{x^2}$ 右边不是整式。"], "contentVersion": "sha256:d951761c85314d095448d491e5bb12bd484bb85b82beebfbb8eabb85df9c2516"}, {"id": "j26-test-02-v3", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j26-2"], "pointIds": ["pyjh.qfun.005"], "prompt": "抛物线 $y=-2(x-3)^2+5$ 的顶点坐标是什么？", "options": [{"id": "a", "text": "$(-3,5)$", "feedback": "括号内的减号不能直接当作顶点横坐标的负号。"}, {"id": "b", "text": "$(3,5)$", "feedback": "对照顶点式 $y=a(x-h)^2+k$，$h=3$，$k=5$。"}, {"id": "c", "text": "$(3,-5)$", "feedback": "括号外常数的符号读反了，请重新对照顶点式。"}, {"id": "d", "text": "$(-3,-5)$", "feedback": "$h$ 与 $k$ 的符号都读反了。"}], "correct": "b", "answer": "$(3,5)$", "reasoning": ["顶点式 $y=a(x-h)^2+k$ 的顶点是 $(h,k)$。", "$y=-2(x-3)^2+5$ 中 $h=3$，$k=5$，顶点为 $(3,5)$。"], "contentVersion": "sha256:4617ae3c0ab7f02f2ba59960bc286539be861879c4ece37dcea98c6c8d5908ea"}, {"id": "j26-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j26-2"], "pointIds": ["pyjh.qfun.006"], "prompt": "二次函数 $y=x^2-4x+1$ 图象的对称轴和函数的最小值分别是什么？", "options": [{"id": "a", "text": "直线 $x=-2$，最小值 $13$", "feedback": "对称轴是 $x=-\\frac{b}{2a}$，$b=-4$ 时为正。"}, {"id": "b", "text": "直线 $x=2$，最小值 $1$", "feedback": "$1$ 是 $x=0$ 时的函数值，最小值在顶点处取得。"}, {"id": "c", "text": "直线 $x=2$，最小值 $-3$", "feedback": "配方：$y=(x-2)^2-3$。"}, {"id": "d", "text": "直线 $x=4$，最小值 $1$", "feedback": "对称轴要用 $-\\frac{b}{2a}$，分母是 $2a$。"}], "correct": "c", "answer": "对称轴是直线 $x=2$，最小值是 $-3$", "reasoning": ["配方：$y=x^2-4x+4-3=(x-2)^2-3$。", "$a=1>0$，开口向上，对称轴是直线 $x=2$，当 $x=2$ 时 $y$ 有最小值 $-3$。"], "contentVersion": "sha256:59c42c5219418f3a1970c321cb0e2c94cae05aba0e8683b9d6655930f0a1a249"}, {"id": "j26-test-04-v2", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j26-2"], "pointIds": ["pyjh.qfun.005"], "prompt": "把抛物线 $y=2x^2$ 先向左平移 $1$ 个单位，再向下平移 $3$ 个单位，得到的抛物线是哪一条？", "options": [{"id": "a", "text": "$y=2(x-1)^2-3$", "feedback": "括号内的符号把水平平移方向弄反了。"}, {"id": "b", "text": "$y=2(x+1)^2+3$", "feedback": "括号外常数的符号把竖直平移方向弄反了。"}, {"id": "c", "text": "$y=2(x+1)^2-3$", "feedback": "左加右减在括号内，上加下减在括号外。"}, {"id": "d", "text": "$y=2(x-1)^2+3$", "feedback": "左右、上下两个方向都弄反了。"}], "correct": "c", "answer": "$y=2(x+1)^2-3$", "reasoning": ["顶点从 $(0,0)$ 移到 $(-1,-3)$，形状不变，$a=2$。", "所以新抛物线为 $y=2(x+1)^2-3$。"], "contentVersion": "sha256:d221f2559f4270aa516c8c8c3e086a43f9d432d03b5620edcdacedbe0a80d33e"}, {"id": "j26-test-05-v2", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j26-3"], "pointIds": ["pyjh.qfun.011"], "prompt": "抛物线 $y=x^2-2x-3$ 与 $x$ 轴的交点坐标是什么？", "options": [{"id": "a", "text": "$(-1,0)$ 和 $(3,0)$", "feedback": "令 $y=0$：$x^2-2x-3=0$，$(x+1)(x-3)=0$。"}, {"id": "b", "text": "$(1,0)$ 和 $(-3,0)$", "feedback": "因式为零时，求出的根与因式中常数的符号不能照抄。"}, {"id": "c", "text": "$(0,-3)$", "feedback": "这是与 $y$ 轴的交点（令 $x=0$），不是与 $x$ 轴的交点。"}, {"id": "d", "text": "$(-1,0)$ 和 $(0,-3)$", "feedback": "与 $x$ 轴的交点纵坐标都是 $0$，$(0,-3)$ 在 $y$ 轴上。"}], "correct": "a", "answer": "$(-1,0)$ 和 $(3,0)$", "reasoning": ["与 $x$ 轴的交点纵坐标为 $0$，令 $x^2-2x-3=0$。", "$(x+1)(x-3)=0$，$x_1=-1$，$x_2=3$。", "交点为 $(-1,0)$ 和 $(3,0)$。"], "contentVersion": "sha256:25f95622835565a160dbd21758c494402b68ccb85830f0c7253d047d4c721e17"}, {"id": "j26-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j26-2"], "pointIds": ["pyjh.qfun.007"], "prompt": "点 $A(-1,y_1)$、$B(2,y_2)$、$C(4,y_3)$ 都在抛物线 $y=-(x-1)^2+k$ 上。$y_1$、$y_2$、$y_3$ 的大小关系是什么？", "options": [{"id": "a", "text": "$y_1>y_2>y_3$", "feedback": "不能只看横坐标的大小，要看各点离对称轴 $x=1$ 的远近。"}, {"id": "b", "text": "$y_3>y_1>y_2$", "feedback": "开口向下，离对称轴越远函数值越小，$C$ 离得最远。"}, {"id": "c", "text": "$y_2>y_1>y_3$", "feedback": "到对称轴的距离：$B$ 是 $1$，$A$ 是 $2$，$C$ 是 $3$；开口向下，越近越大。"}, {"id": "d", "text": "$y_2>y_3>y_1$", "feedback": "$C$ 到对称轴的距离 $3$ 比 $A$ 的 $2$ 大，函数值更小。"}], "correct": "c", "answer": "$y_2>y_1>y_3$", "reasoning": ["抛物线开口向下，对称轴是直线 $x=1$，离对称轴越远，函数值越小。", "$A$、$B$、$C$ 到对称轴的距离分别是 $2$、$1$、$3$。", "所以 $y_2>y_1>y_3$。"], "contentVersion": "sha256:96bfbe9ee8a00ec93a4ad0094c8758724bf2e460d537e524b7d956903c0fbe1a"}, {"id": "j26-test-07-v2", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j26-2"], "pointIds": ["pyjh.qfun.008"], "prompt": "二次函数 $y=ax^2+bx+c$ 的图象开口向下，对称轴在 $y$ 轴右侧，与 $y$ 轴交于正半轴。下列判断正确的是哪一个？", "options": [{"id": "a", "text": "$a<0,\\ b<0,\\ c>0$", "feedback": "一次项系数的符号判断与对称轴所在的位置不符，请检查对称轴公式。"}, {"id": "b", "text": "$a>0,\\ b<0,\\ c<0$", "feedback": "开口向下说明 $a<0$。"}, {"id": "c", "text": "$a<0,\\ b>0,\\ c<0$", "feedback": "与 $y$ 轴交点是 $(0,c)$，在正半轴说明 $c>0$。"}, {"id": "d", "text": "$a<0,\\ b>0,\\ c>0$", "feedback": "开口向下 $a<0$；$-\\frac{b}{2a}>0$ 得 $b>0$；交点 $(0,c)$ 在正半轴。"}], "correct": "d", "answer": "$a<0,\\ b>0,\\ c>0$", "reasoning": ["开口向下：$a<0$。", "对称轴 $x=-\\frac{b}{2a}$ 在 $y$ 轴右侧：$-\\frac{b}{2a}>0$，$a<0$，所以 $b>0$（左同右异）。", "与 $y$ 轴交点 $(0,c)$ 在正半轴：$c>0$。"], "contentVersion": "sha256:1f16c28c4e0d603ddbc25446c560b17c8a420d3560ab0699248e6df7832bd353"}, {"id": "j26-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j26-2"], "pointIds": ["pyjh.qfun.009"], "prompt": "一条抛物线经过 $(0,3)$、$(1,0)$、$(3,0)$ 三点，它的解析式是什么？", "options": [{"id": "a", "text": "$y=x^2+4x+3$", "feedback": "代入 $(1,0)$：$1+4+3\\ne0$。"}, {"id": "b", "text": "$y=-x^2+4x-3$", "feedback": "代入 $(0,3)$：得 $y=-3$，不对。"}, {"id": "c", "text": "$y=x^2-4x+3$", "feedback": "设 $y=a(x-1)(x-3)$，代入 $(0,3)$ 得 $a=1$。"}, {"id": "d", "text": "$y=3x^2-12x+9$", "feedback": "它过 $(1,0)$、$(3,0)$，但 $x=0$ 时 $y=9$。"}], "correct": "c", "answer": "$y=x^2-4x+3$", "reasoning": ["抛物线与 $x$ 轴交于 $(1,0)$、$(3,0)$，设 $y=a(x-1)(x-3)$。", "代入 $(0,3)$：$3a=3$，$a=1$。", "$y=(x-1)(x-3)=x^2-4x+3$。"], "contentVersion": "sha256:1f1120f707dc90a3ca8a427f5a604c4325092342663a93fb888276e4d4b05093"}, {"id": "j26-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j26-3"], "pointIds": ["pyjh.qfun.012"], "prompt": "抛物线 $y=x^2-2x+m$ 与 $x$ 轴有两个公共点，$m$ 的取值范围是什么？", "options": [{"id": "a", "text": "$m<1$", "feedback": "$\\Delta=4-4m>0$。"}, {"id": "b", "text": "$m\\le1$", "feedback": "$m=1$ 时 $\\Delta=0$，只有一个公共点。"}, {"id": "c", "text": "$m>1$", "feedback": "$\\Delta=4-4m>0$ 解出来是小于号。"}, {"id": "d", "text": "$m<-1$", "feedback": "解 $4-4m>0$ 时把 $4$ 移到右边，再除以 $-4$。"}], "correct": "a", "answer": "$m<1$", "reasoning": ["两个公共点即方程 $x^2-2x+m=0$ 有两个不相等的实数根。", "$\\Delta=(-2)^2-4m=4-4m>0$，$m<1$。"], "contentVersion": "sha256:4a0a0173d7549d70bfed7f359560753254fcc9f96451a24931870d3d4b02cc2d"}, {"id": "j26-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j26-1", "j26-4"], "pointIds": ["pyjh.qfun.015", "pyjh.qfun.003"], "prompt": "用长 $20$ 米的篱笆围一个矩形菜园，一边靠墙（墙长 $8$ 米），另外三边用篱笆。设垂直于墙的一边长 $x$ 米，菜园面积的最大值是多少平方米？", "options": [{"id": "a", "text": "$50$ 平方米", "feedback": "$x=5$ 时平行于墙的一边长 $10$ 米，超过墙长 $8$ 米。"}, {"id": "b", "text": "$48$ 平方米", "feedback": "$S=x(20-2x)$，$6\\le x<10$，顶点不在范围内，在 $x=6$ 处取最大值。"}, {"id": "c", "text": "$64$ 平方米", "feedback": "三边篱笆总长 $20$ 米，围不出 $8\\times8$ 的矩形。"}, {"id": "d", "text": "$42$ 平方米", "feedback": "取值范围内 $S$ 随 $x$ 增大而减小，最大值在 $x$ 最小时取得。"}], "correct": "b", "answer": "$48$ 平方米", "reasoning": ["平行于墙的一边长 $(20-2x)$ 米，$S=x(20-2x)=-2x^2+20x$。", "$0<20-2x\\le8$，所以 $6\\le x<10$。", "对称轴 $x=5$ 不在范围内；在 $6\\le x<10$ 上 $S$ 随 $x$ 增大而减小，$x=6$ 时 $S$ 最大，为 $6\\times8=48$。"], "contentVersion": "sha256:0b8f8af3f6d4108141e3828f0bbe3d6a01d78d6c6bf1b3edbef336130dc1bcea"}, {"id": "j26-test-11-v2", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j26-4"], "pointIds": ["pyjh.qfun.016"], "prompt": "某商品进价每件 $40$ 元。售价为 $x$ 元（$40\\le x\\le80$）时，每天销量为 $(-10x+800)$ 件。售价定为多少元时每天利润最大？最大利润是多少元？", "options": [{"id": "a", "text": "$60$ 元，$2000$ 元", "feedback": "单件利润与销量需要相乘，这里的总利润计算有误。"}, {"id": "b", "text": "$70$ 元，$3000$ 元", "feedback": "这是 $x=70$ 时的利润，不是最大值。"}, {"id": "c", "text": "$50$ 元，$3000$ 元", "feedback": "$W=-10(x-40)(x-80)$ 的对称轴在两根正中间。"}, {"id": "d", "text": "$60$ 元，$4000$ 元", "feedback": "$W=-10(x-60)^2+4000$。"}], "correct": "d", "answer": "售价 $60$ 元，最大利润 $4000$ 元", "reasoning": ["每天利润 $W=(x-40)(-10x+800)=-10(x-40)(x-80)$。", "配方：$W=-10x^2+1200x-32000=-10(x-60)^2+4000$。", "$-10<0$，$x=60$ 在 $40\\le x\\le80$ 内，所以售价 $60$ 元时利润最大，为 $4000$ 元。"], "contentVersion": "sha256:37f301b68702b2f4de59d908dfcad1d324a88976500f63b8664f4e9f866cbd4b"}, {"id": "j26-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j26-2", "j26-4"], "pointIds": ["pyjh.qfun.018", "pyjh.qfun.006"], "prompt": "二次函数 $y=x^2-2x-3$，当 $-2\\le x\\le2$ 时，$y$ 的最大值和最小值分别是多少？", "options": [{"id": "a", "text": "最大值 $5$，最小值 $-3$", "feedback": "对称轴 $x=1$ 在范围内，最小值在顶点处取得。"}, {"id": "b", "text": "最大值 $5$，最小值 $-4$", "feedback": "顶点 $(1,-4)$ 在范围内给出最小值；端点中 $x=-2$ 离对称轴更远，给出最大值。"}, {"id": "c", "text": "最大值 $-3$，最小值 $-4$", "feedback": "两个端点的函数值都要算，$x=-2$ 时更大。"}, {"id": "d", "text": "没有最大值，最小值 $-4$", "feedback": "自变量限定在闭区间内，端点处能取到最大值。"}], "correct": "b", "answer": "最大值 $5$，最小值 $-4$", "reasoning": ["$y=(x-1)^2-4$，开口向上，对称轴 $x=1$ 在 $-2\\le x\\le2$ 内，最小值是 $-4$。", "端点：$x=-2$ 时 $y=5$，$x=2$ 时 $y=-3$；离对称轴更远的 $x=-2$ 处最大。", "所以最大值 $5$，最小值 $-4$。"], "contentVersion": "sha256:fe426eabe12e08bf9e379f46ef3d8f81e716ad24525a0f175920eeb861af5431"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
