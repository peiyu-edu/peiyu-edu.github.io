<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级下册 第二单元 除数是一位数的除法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p3b-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级下册 第二单元 除数是一位数的除法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3b-u2-test", "sectionId": "p3b-u2-test", "unitId": "p3b-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级下册 第二单元 除数是一位数的除法 单元测评", "items": [{"id": "p3b-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "口算：600 ÷ 3 = □；2400 ÷ 6 = □", "answer": "200；400", "reasoning": ["600 是 6 个百，6 个百 ÷ 3 = 2 个百，是 200。", "2400 是 24 个百，24 个百 ÷ 6 = 4 个百，是 400。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u2.001"], "contentVersion": "sha256:cda7753a551d6c07a144774b6ac4488b06ba5162b6605ae18acb5ebd727bfbaa"}, {"id": "p3b-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "口算：84 ÷ 4 = □", "answer": "21", "reasoning": ["把 84 拆成 80 和 4。", "80 ÷ 4 得 20，4 ÷ 4 得 1，20 + 1 = 21。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u2.002"], "contentVersion": "sha256:286216ccc2de6b20771926ce9a75eb62948ccb8256a54e8a42a7057c1a74d791"}, {"id": "p3b-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：75 ÷ 5", "answer": "15", "reasoning": ["先用十位上的 7 除以 5，商 1，写在十位上，余 2。", "余下的 2 个十和个位的 5 合起来是 25，25 ÷ 5 商 5，写在个位上。", "商是 15。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u2.004"], "contentVersion": "sha256:db51bfbd5380c65ee18569a6fb67a27616f6beb71f525c4d8eba1ae417127491"}, {"id": "p3b-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "用竖式计算：864 ÷ 4", "answer": "216", "reasoning": ["百位：8 ÷ 4 商 2。", "十位：6 ÷ 4 商 1，余 2。", "余下的 2 个十和 4 合成 24，24 ÷ 4 商 6。商是 216。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u2.005"], "contentVersion": "sha256:f2a286eac59dbde527d1b73c646aa475aa63466582ac6e0e7ed71481ee9400b3"}, {"id": "p3b-u2-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "用竖式计算 158 ÷ 6，并验算。", "answer": "158 ÷ 6 = 26……2；验算：26 × 6 + 2 = 158", "reasoning": ["百位上 1 比 6 小，看前两位：15 ÷ 6 商 2，余 3。", "余下的 3 个十和 8 合成 38，38 ÷ 6 商 6，余 2。", "验算：商 × 除数 + 余数，26 × 6 + 2 = 158，和被除数一样。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u2.006"], "contentVersion": "sha256:ac299d1d7a8181c9412377a53fe335b072ed1ad25440142be410c1c4e3c9cceb"}, {"id": "p3b-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "618 ÷ 3 = ?", "answer": "206", "reasoning": ["百位：6 ÷ 3 商 2。", "十位：1 比 3 小，不够商 1，在十位上商 0。", "1 个十和 8 合成 18，18 ÷ 3 商 6。商是 206。"], "options": [{"id": "a", "text": "206", "feedback": "对。十位上 1 不够除以 3，商 0 占住十位。"}, {"id": "b", "text": "26", "feedback": "十位不够商 1 时要写 0 占位，漏了 0 就变成 26 了。"}, {"id": "c", "text": "260", "feedback": "0 应该在十位上，个位是 18 ÷ 3 = 6。"}], "correct": "a", "pointIds": ["pyps.p3b.u2.007"], "contentVersion": "sha256:bc2a9c3435a1a879cb4d072f535ffe697d12a16cba09268cc4ed316f6269aee9"}, {"id": "p3b-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "920 ÷ 4 = ?", "answer": "230", "reasoning": ["百位：9 ÷ 4 商 2，余 1。", "1 个百和 2 个十合成 12 个十，12 ÷ 4 商 3。", "个位是 0，0 ÷ 4 商 0。商是 230。"], "options": [{"id": "a", "text": "203", "feedback": "0 应该在个位上，十位是 12 ÷ 4 = 3。"}, {"id": "b", "text": "230", "feedback": "对。个位上 0 不够除以 4，商 0 占住个位。"}, {"id": "c", "text": "23", "feedback": "个位上还要商 0，不能丢。"}], "correct": "b", "pointIds": ["pyps.p3b.u2.008"], "contentVersion": "sha256:255432f8b802271a1dbc84bfc6d79cdb23e999eb071fba701b8d4495ea149999"}, {"id": "p3b-u2-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "王老师用 3 天读完一本 298 页的书。平均每天大约读多少页？", "answer": "大约 100 页", "reasoning": ["298 接近 300，300 又正好能被 3 整除。", "298 ÷ 3 ≈ 100，每天大约读 100 页。"], "options": [{"id": "a", "text": "大约 10 页", "feedback": "商的位数错了。300 页 3 天读完，每天大约 100 页。"}, {"id": "b", "text": "大约 1000 页", "feedback": "3 天一共才 298 页，每天不可能读 1000 页。"}, {"id": "c", "text": "大约 100 页", "feedback": "对。把 298 看成 300，300 ÷ 3 = 100。"}], "correct": "c", "pointIds": ["pyps.p3b.u2.003"], "contentVersion": "sha256:14257c3eec64b5f5a937b1a7216488806ea62622e82b00f3907c34e08a602609"}, {"id": "p3b-u2-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "三年级有 3 个班，每班分成 4 个小组。全年级一共种了 96 棵树。平均每个小组种多少棵？", "answer": "96 ÷ 3 ÷ 4 = 8（棵）", "reasoning": ["先算每班种多少棵：96 ÷ 3 = 32（棵）。", "再算每个小组种多少棵：32 ÷ 4 = 8（棵）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u2.009"], "contentVersion": "sha256:b6c7a8c40537b108898aa348da23a71f898859ac8481242a29b38846bc2a62ed"}, {"id": "p3b-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "3 盒彩笔一共 72 元。照这样计算，买 5 盒要多少元？", "answer": "120 元", "reasoning": ["先求 1 盒多少元：72 ÷ 3 = 24（元）。", "再求 5 盒：24 × 5 = 120（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u2.010"], "contentVersion": "sha256:d5a23858b2d502347fe5df4bac744411005fef880af41b60f9fb61e7910499c7"}, {"id": "p3b-u2-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一本书，每天读 24 页，6 天读完。如果要 8 天读完，每天要读多少页？", "answer": "18 页", "reasoning": ["先求这本书一共有多少页：24 × 6 = 144（页）。", "再平均分到 8 天：144 ÷ 8 = 18（页）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u2.010", "pyps.p3b.u2.006"], "contentVersion": "sha256:ffb078515be385b8a904c8eadf5d56c9bc160a96607fd99d83536006f7607f63"}, {"id": "p3b-u2-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "100 个同学去划船，每条船最多坐 8 人。至少要租几条船？", "answer": "13 条", "reasoning": ["100 ÷ 8 = 12……4，坐满 12 条船，还剩 4 人。", "剩下的 4 人也要坐船，还要再租 1 条：12 + 1 = 13（条）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u2.006", "pyps.p3b.u2.004"], "contentVersion": "sha256:2521057e93328ef88c3b682248c00169170aeab448ab43c524b1f8955452fffa"}], "contentVersion": "sha256:87d594ff98887ff0c7a801c77608dd68e30d757e95321aee7e29f50e11649a67"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
