<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二年级上册 第二单元 1～6 的表内乘法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p2a-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>二年级上册 第二单元 1～6 的表内乘法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p2a-u2-test", "sectionId": "p2a-u2-test", "unitId": "p2a-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "二年级上册 第二单元 1～6 的表内乘法 单元测评", "items": [{"id": "p2a-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "4 + 4 + 4 可以写成哪个乘法算式？", "answer": "4 × 3", "reasoning": ["4 + 4 + 4 是 3 个 4 相加。", "3 个 4 写成 4 × 3 或 3 × 4，都等于 12。"], "options": [{"id": "a", "text": "4 × 4", "feedback": "4 × 4 表示 4 个 4，这里只有 3 个 4。"}, {"id": "b", "text": "4 × 3", "feedback": "对。3 个 4 相加，写成 4 × 3。"}, {"id": "c", "text": "4 + 3", "feedback": "这是加法，也不等于 4 + 4 + 4。"}], "correct": "b", "pointIds": ["pyps.p2a.u2.001"], "contentVersion": "sha256:13327e49b8a781aee445e7fcbe92ddbee19309fb06ccea612d862742e4e178dd"}, {"id": "p2a-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "在 2 × 6 = 12 这个算式里，12 叫什么？", "answer": "积", "reasoning": ["乘号两边的 2 和 6 叫乘数。", "得数 12 叫积。"], "options": [{"id": "a", "text": "和", "feedback": "和是加法得数的名字。"}, {"id": "b", "text": "乘数", "feedback": "2 和 6 才是乘数。"}, {"id": "c", "text": "积", "feedback": "对。乘法算出来的得数叫积。"}], "correct": "c", "pointIds": ["pyps.p2a.u2.001"], "contentVersion": "sha256:147bdabca69dbf060c16484ce4628e941834fdb7f03289d7da6e3c35f8eaf454"}, {"id": "p2a-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "直接写得数：5 × 4 = ？　3 × 6 = ？　6 × 6 = ？", "answer": "20，18，36", "reasoning": ["四五二十，5 × 4 = 20。", "三六十八，3 × 6 = 18；六六三十六，6 × 6 = 36。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u2.003", "pyps.p2a.u2.006"], "contentVersion": "sha256:13568f1fffb3161a6c0fce2472f98abd0368a26da31d980461b7483eb38cb919"}, {"id": "p2a-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "在横线上填数：____ × 4 = 4 × 6", "answer": "6", "reasoning": ["交换两个乘数的位置，积不变。", "4 × 6 = 6 × 4，所以填 6。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u2.002"], "contentVersion": "sha256:bc153b664ef6904ee716fbdaf5bb314adcf579865988bbd27be70e257fe90286"}, {"id": "p2a-u2-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "计算：4 × 5 + 4 = ？　6 × 3 − 6 = ？", "answer": "24，12", "reasoning": ["先算乘法，再算加法或减法。", "4 × 5 = 20，20 + 4 = 24；6 × 3 = 18，18 − 6 = 12。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u2.005"], "contentVersion": "sha256:f96e9602d00281a857a6ed4790a39028013de61be2af8b76695930021df036e2"}, {"id": "p2a-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用口诀「三四十二」可以算哪一组算式？", "answer": "3 × 4 和 4 × 3", "reasoning": ["三四十二说的是 3 个 4 或 4 个 3 是 12。", "所以 3 × 4 和 4 × 3 都用这句口诀。"], "options": [{"id": "a", "text": "3 × 3 和 4 × 4", "feedback": "3 × 3 用三三得九，4 × 4 用四四十六。"}, {"id": "b", "text": "3 × 4 和 4 × 3", "feedback": "对。3 × 4 和 4 × 3 都等于 12，都用三四十二。"}, {"id": "c", "text": "3 + 4 和 4 + 3", "feedback": "这是加法，3 + 4 = 7，不用乘法口诀。"}], "correct": "b", "pointIds": ["pyps.p2a.u2.004"], "contentVersion": "sha256:13e43bcd5ce610f0525b419047183b2de11a2d45fcdc241659382b2162661939"}, {"id": "p2a-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪道题可以用乘法算？", "answer": "3 盘桃，每盘都是 5 个，一共几个？", "reasoning": ["每份一样多才能用乘法。", "3 盘、每盘 5 个，是 3 个 5，5 × 3 = 15（个）。"], "options": [{"id": "a", "text": "3 盘桃，每盘都是 5 个，一共几个？", "feedback": "对。3 个 5，每份一样多，可以写成 5 × 3 = 15。"}, {"id": "b", "text": "3 盘桃，第一盘 4 个，第二盘 5 个，第三盘 6 个，一共几个？", "feedback": "每盘个数不一样，要用加法：4 + 5 + 6。"}, {"id": "c", "text": "一盘有 5 个桃，吃了 3 个，还剩几个？", "feedback": "这是求剩下的，用减法 5 − 3。"}], "correct": "a", "pointIds": ["pyps.p2a.u2.007"], "contentVersion": "sha256:6ca39479b2c3d1a4fb460a36540dce5fa8c54e240d56f6ce81e6dd43c8924470"}, {"id": "p2a-u2-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一个本子 4 元。买 6 个这样的本子，要多少元？", "answer": "24 元", "reasoning": ["6 个本子，每个 4 元，就是 6 个 4 元。", "4 × 6 = 24（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u2.008"], "contentVersion": "sha256:6a3c236f83753ed565a575bb146e1f7fb0d1321bc850e67f60277a44edbe1427"}, {"id": "p2a-u2-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "礼堂里每排摆 3 把椅子，摆了 5 排，又在旁边多摆了 2 把。一共摆了多少把椅子？", "answer": "17 把", "reasoning": ["5 排、每排 3 把，先算 3 × 5 = 15（把）。", "再加上多摆的 2 把：15 + 2 = 17（把）。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u2.005", "pyps.p2a.u2.008"], "contentVersion": "sha256:d7b61eecd8bab3bbe3eec72a40ba1352e7cda33eb60842f4ad8c145a9b8941b3", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 290\" role=\"img\" aria-label=\"只画排列两端，中间省略；已知5行，每行3个，旁边另有2个；总数待求\" style=\"display:block;width:100%;max-width:300px;height:auto;margin:8px auto\">\n      <text x=\"140\" y=\"25\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">每行3个<\/text><circle cx=\"65\" cy=\"60\" r=\"7\" style=\"fill:var(--a)\"/><text x=\"140\" y=\"66\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:24px\">…<\/text><circle cx=\"215\" cy=\"60\" r=\"7\" style=\"fill:var(--a)\"/><circle cx=\"65\" cy=\"150\" r=\"7\" style=\"fill:var(--a)\"/><text x=\"140\" y=\"156\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:24px\">…<\/text><circle cx=\"215\" cy=\"150\" r=\"7\" style=\"fill:var(--a)\"/><text x=\"140\" y=\"113\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:24px\">⋮<\/text><text x=\"140\" y=\"192\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">共5行<\/text><text x=\"140\" y=\"240\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">旁边另有2个<\/text><circle cx=\"125\" cy=\"265\" r=\"7\" style=\"fill:var(--b)\"/><circle cx=\"155\" cy=\"265\" r=\"7\" style=\"fill:var(--b)\"/>\n    <\/svg>"}, {"id": "p2a-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "在横线上填 >、< 或 =：5 × 6 ____ 6 × 5；　3 × 6 ____ 4 × 4；　2 × 6 ____ 3 × 5", "answer": "=，>，<", "reasoning": ["5 × 6 和 6 × 5 只是交换了乘数，积都是 30，填 =。", "3 × 6 = 18，4 × 4 = 16，18 > 16；2 × 6 = 12，3 × 5 = 15，12 < 15。"], "options": [], "correct": null, "pointIds": ["pyps.p2a.u2.006", "pyps.p2a.u2.002"], "contentVersion": "sha256:d03218a2025fb4fd9d21f04c6ce27efc465b56cfcf5995f04ee2e47ebafef5a1"}], "contentVersion": "sha256:4b6def20cf0553c285efbc10d613618bfb0d573fc1ae40ffc2517990ee30a051"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></
