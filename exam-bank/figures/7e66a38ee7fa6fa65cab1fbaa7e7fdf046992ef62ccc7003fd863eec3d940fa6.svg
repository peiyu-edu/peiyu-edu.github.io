<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 516" role="img" aria-labelledby="title desc"><title id="title">程序框图</title><desc id="desc">开始，赋值n=1，A=1，B=2；判断n≤3，是则依次执行A=A+B、B=A+B、n=n+1后回到判断，否则输出B，结束。</desc><style>path,rect,polygon{fill:none;stroke:currentColor;stroke-width:1.8}.ar{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,'Noto Serif CJK SC',serif;font-size:19px}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style>
<rect x="95" y="12" width="90" height="36" rx="18"/><text x="140" y="37" text-anchor="middle">开始</text>
<path d="M140,48V70"/><polygon class="ar" points="135,68 145,68 140,78"/>
<rect x="60" y="78" width="160" height="36"/><text x="140" y="103" text-anchor="middle"><tspan font-style="italic">n</tspan>=1, <tspan font-style="italic">A</tspan>=1, <tspan font-style="italic">B</tspan>=2</text>
<path d="M140,114V130"/><polygon class="ar" points="135,128 145,128 140,138"/>
<polygon points="140,138 196,166 140,194 84,166"/><text x="140" y="172" text-anchor="middle"><tspan font-style="italic">n</tspan>≤3?</text>
<path d="M140,194V214"/><polygon class="ar" points="135,212 145,212 140,222"/><text x="150" y="214">是</text>
<rect x="88" y="222" width="104" height="34"/><text x="140" y="245" text-anchor="middle" font-style="italic">A=A+B</text>
<path d="M140,256V270"/><polygon class="ar" points="135,268 145,268 140,278"/>
<rect x="88" y="278" width="104" height="34"/><text x="140" y="301" text-anchor="middle" font-style="italic">B=A+B</text>
<path d="M140,312V326"/><polygon class="ar" points="135,324 145,324 140,334"/>
<rect x="88" y="334" width="104" height="34"/><text x="140" y="357" text-anchor="middle" font-style="italic">n=n+1</text>
<path d="M88,351H30V166H74"/><polygon class="ar" points="74,161 74,171 84,166"/>
<path d="M196,166H250V392H140V402"/><polygon class="ar" points="135,400 145,400 140,410"/><text x="214" y="156">否</text>
<polygon points="102,410 196,410 178,446 84,446"/><text x="140" y="434" text-anchor="middle">输出<tspan font-style="italic">B</tspan></text>
<path d="M140,446V462"/><polygon class="ar" points="135,460 145,460 140,470"/>
<rect x="95" y="470" width="90" height="36" rx="18"/><text x="140" y="495" text-anchor="middle">结束</text>
</svg>
