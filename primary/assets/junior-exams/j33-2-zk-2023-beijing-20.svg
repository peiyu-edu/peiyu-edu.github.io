<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 234" width="600" height="234" role="img" aria-labelledby="title desc">
<title id="title">平行四边形 ABCD 中的 E、F 及连线</title>
<desc id="desc">平行四边形 ABCD，A、D 在上，B、C 在下。点 E 在 BC 上，点 F 在 AD 上。连接 AE、CF、AC、EF，AC 与 EF 相交。</desc>
<style>text{fill:#17202a;font-size:30px}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic}.r{font-family:Georgia,'Times New Roman',serif}.z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px}line,path,polyline,polygon,circle,rect,ellipse{stroke-linejoin:round}</style>
<rect width="600" height="234" fill="white"/>
<polygon points="36,190 426,190 556,48 166,48" fill="none" stroke="#17202a" stroke-width="2.5"/>
<line x1="166.0" y1="48.0" x2="166.0" y2="190.0" stroke="#17202a" stroke-width="2.5"/>
<line x1="426.0" y1="48.0" x2="426.0" y2="190.0" stroke="#17202a" stroke-width="2.5"/>
<line x1="166.0" y1="48.0" x2="426.0" y2="190.0" stroke="#17202a" stroke-width="2.5"/>
<line x1="166.0" y1="190.0" x2="426.0" y2="48.0" stroke="#17202a" stroke-width="2.5"/>
<text class="m" x="18.0" y="200.0" text-anchor="middle">B</text>
<text class="m" x="166.0" y="222.0" text-anchor="middle">E</text>
<text class="m" x="426.0" y="222.0" text-anchor="middle">C</text>
<text class="m" x="166.0" y="36.0" text-anchor="middle">A</text>
<text class="m" x="426.0" y="36.0" text-anchor="middle">F</text>
<text class="m" x="576.0" y="58.0" text-anchor="middle">D</text>
</svg>
