<p class="crumb"><a href="../index.html">专题地图</a> › 并排比较</p><h1>并排比较</h1><p class="lead">看起来很像，为什么方法不同？</p><div class="compare-grid"><section class="card stem"><h2><a href="../p/P018206.html">一试训练题</a></h2><p class="hint-text">P018206 · 平面几何综合</p><p>非退化三角形垂心H、外心O及外接半径R满足AH=√2R。求角A全部可能值。</p></section><section class="card stem"><h2><a href="../p/P018096.html">一试训练题</a></h2><p class="hint-text">P018096 · 三角函数综合</p><p>锐角三角形中<span class="katex"><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8193em;vertical-align:-0.136em;"></span><span class="mord mathnormal">A</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.8193em;vertical-align:-0.136em;"></span><span class="mord mathnormal" style="margin-right:0.05017em;">B</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≤</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.07153em;">C</span></span></span></span>。求sin C最小值。</p></section></div><section class="card"><button type="button" class="btn ghost" data-reveal-link data-pair="P018206-P018096">看方法为什么不同</button><div class="link-reason" hidden><p>从三角函数值反推角之前先确定角的活动区间；锐角限制会改变单调支与可保留的解。</p><p>一题允许任意非退化三角形并涉及垂心长度的绝对值，另一题明确为锐角三角形且C是最大角。</p></div></section><div id="comparison" data-a="P018206" data-b="P018096" data-pair="P018206-P018096"></div>
