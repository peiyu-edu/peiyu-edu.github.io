<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" role="img" aria-labelledby="title desc"><title id="title">直角三角尺与纸条</title><desc id="desc">两边平行的纸条水平放置，一个带内三角形镂空的直角三角尺放在上面：直角顶点在纸条上边上，另一个锐角顶点在纸条下边上，第三个顶点在纸条外的上方。纸条上边被三角尺遮住的部分画成虚线。三角尺的直角边与纸条下边形成的角标为角1，另一条直角边与纸条上边形成的角标为角2。</desc><style>path,circle,ellipse,polygon,rect,line,polyline{fill:none;stroke:currentColor;stroke-width:1.8}.d{stroke-dasharray:6 5}.t{stroke-width:1.2}.s{fill:currentColor;fill-opacity:.15}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}.i{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M130.88,18.27L182.00,367.00L323.72,248.08Z"/><path d="M182.93,141.69L201.33,267.24L252.35,224.43Z"/><line x1="18.00" y1="248.08" x2="164.57" y2="248.08"/><line x1="164.57" y1="248.08" x2="323.72" y2="248.08" class="d"/><line x1="323.72" y1="248.08" x2="402.00" y2="248.08"/><line x1="18.00" y1="367.00" x2="402.00" y2="367.00"/><path d="M18,248.08429220799025C48,278.08429220799025 -4,327 18,367"/><path d="M402,248.08429220799025C372,278.08429220799025 424,327 402,367"/><path class="t" d="M228.00,367.00A46,46 0 0 0 217.24,337.43"/><text x="242.00" y="357.00" font-size="16" text-anchor="middle">1</text><path class="t" d="M304.43,225.10A30,30 0 0 0 293.72,248.08"/><text x="275.72" y="238.08" font-size="16" text-anchor="middle">2</text></svg>