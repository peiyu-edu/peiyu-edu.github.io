<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 412" width="460" height="412" role="img" aria-labelledby="title desc">
<title id="title">标有棱长的长方体</title>
<desc id="desc">一个长方体的直观图，看不见的棱画成虚线。正面朝前，上方前棱标 4，左侧竖直棱标 5，左上方前后方向的棱标 3，单位是 cm。正面下方有箭头指向长方体，标“主视方向”。</desc>
<style>text{fill:#17202a;} .m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:30px;} .n{font-family:Georgia,'Times New Roman',serif;font-size:30px;} .z{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:30px;} .h{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round;}</style>
<rect width="460" height="412" fill="white"/>
<line x1="240.0" y1="20.0" x2="240.0" y2="270.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="2 7"/>
<line x1="240.0" y1="270.0" x2="440.0" y2="270.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="2 7"/>
<line x1="170.0" y1="340.0" x2="240.0" y2="270.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="2 7"/>
<path d="M170 90H370V340H170Z" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170 90L240 20H440L370 90" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M440 20V270L370 340" fill="none" stroke="#17202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="186.0" y="44.0" class="n" text-anchor="middle" font-size="30">3</text>
<text x="280.0" y="130.0" class="n" text-anchor="middle" font-size="30">4</text>
<text x="146.0" y="228.0" class="n" text-anchor="middle" font-size="30">5</text>
<line x1="252.0" y1="364.0" x2="284.0" y2="330.0" stroke="#17202a" stroke-width="2.8" stroke-linecap="round"/>
<polygon points="292.0,320.0 277.9,327.5 287.1,335.2" fill="#17202a"/>
<text x="10.0" y="398.0" class="z" text-anchor="start" font-size="28">单位：cm</text>
<text x="305.0" y="398.0" class="z" text-anchor="middle" font-size="28">主视方向</text>
</svg>
