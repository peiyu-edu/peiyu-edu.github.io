<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级下册 第一单元 生活中的运动现象 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p3b-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级下册 第一单元 生活中的运动现象 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3b-u1-test", "sectionId": "p3b-u1-test", "unitId": "p3b-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级下册 第一单元 生活中的运动现象 单元测评", "items": [{"id": "p3b-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "用三条线段搭一个 A 形图样：左右两条一样长的斜线在上端相接，下端在同一条水平线上；再用一条水平线段连接两条斜线的中点。只看这三条线段组成的图样，它是轴对称图形吗？", "answer": "是，沿上端交点和横线中点所在的直线对折能完全重合", "reasoning": ["两条斜线一样长，下端在同一条水平线上，左右位置对应。", "沿上端交点和横线中点所在的直线对折，两条斜线重合，横线的左右两半重合，所以是轴对称图形。"], "options": [{"id": "a", "text": "不是，因为下面没有封口", "feedback": "轴对称图形不一定要封口，关键是对折后能否完全重合。"}, {"id": "b", "text": "是，沿上端交点和横线中点所在的直线对折能完全重合", "feedback": "对。两条斜线能重合，横线的左右两半也能重合。"}, {"id": "c", "text": "不能确定，要先知道图样有多大", "feedback": "只要保持题中三条线段的位置关系，放大或缩小都不影响对折后完全重合。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.001"], "contentVersion": "sha256:4356f0ef2f46a01dc2f97a280235a90044bded1431d5e8efd61cd2f4f9d45f59"}, {"id": "p3b-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一个正方形有几条对称轴？", "answer": "4 条", "reasoning": ["正方形横着对折、竖着对折都能完全重合，有 2 条。", "沿两个相对的角斜着对折也能完全重合，又有 2 条。", "一共 4 条。"], "options": [{"id": "a", "text": "4 条", "feedback": "对。横着、竖着对折各 1 条，沿两条斜线对折各 1 条。"}, {"id": "b", "text": "2 条", "feedback": "还漏了沿两条斜线对折的 2 条。"}, {"id": "c", "text": "1 条", "feedback": "正方形不止一种对折方法能完全重合。"}], "correct": "a", "pointIds": ["pyps.p3b.u1.002"], "contentVersion": "sha256:0e31cdd39f05d212a434df23593f0b9ebcafab601d5fd5fe6743b3357fb22c19"}, {"id": "p3b-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪一个是平移现象？", "answer": "电梯在楼里上下运动", "reasoning": ["平移是沿着直线移动，物体的朝向不变。", "电梯上下运动是平移；风车和指针都在绕着一个点转，是旋转。"], "options": [{"id": "a", "text": "钟面上的指针走动", "feedback": "指针绕着中心转，是旋转。"}, {"id": "b", "text": "电梯在楼里上下运动", "feedback": "对。电梯沿直线移动，朝向不变，是平移。"}, {"id": "c", "text": "风车转动", "feedback": "风车绕着中间转，是旋转。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.003", "pyps.p3b.u1.004"], "contentVersion": "sha256:21f58dee0dccb49d31c19ea7cda11528c858282ec86c1f1ed10ea2369c937125"}, {"id": "p3b-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "钟面上的分针从指着 12 走到指着 3，分针是怎样运动的？", "answer": "顺时针旋转", "reasoning": ["分针绕着钟面中心转，是旋转。", "钟表指针走的方向叫顺时针，所以是顺时针旋转。"], "options": [{"id": "a", "text": "逆时针旋转", "feedback": "逆时针是和钟表指针走的方向相反。"}, {"id": "b", "text": "顺时针旋转", "feedback": "对。分针和钟表指针走的方向一样，是顺时针。"}, {"id": "c", "text": "平移", "feedback": "分针绕着钟面中心转，不是沿直线移动。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.004"], "contentVersion": "sha256:217082f1194c21ee2dcadf3134607d400e879f6d2676a76fdfa7d136a4bc92e4"}, {"id": "p3b-u1-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个长方形（长和宽不一样长）有几条对称轴？", "answer": "2 条", "reasoning": ["长方形横着对折、竖着对折都能完全重合。", "沿两个相对的角斜着对折，两边对不上。", "所以长方形有 2 条对称轴。"], "options": [{"id": "a", "text": "2 条", "feedback": "对。横着对折、竖着对折各 1 条。"}, {"id": "b", "text": "1 条", "feedback": "横着、竖着对折都能完全重合，有 2 条。"}, {"id": "c", "text": "4 条", "feedback": "斜着沿两个角对折，长方形两边对不上，所以只有 2 条。"}], "correct": "a", "pointIds": ["pyps.p3b.u1.002"], "contentVersion": "sha256:eebdd174384bb01606cc079c0b87efa56817bb53ac1e5b47bb156f1958948db1"}, {"id": "p3b-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用线段画一个「中」形图样：先画一个长和宽不一样长的长方形边框，再画一条竖线穿过上、下两条边的中点，竖线向上、向下伸出边框的长度相同。沿下面哪条线对折，两边能完全重合？", "answer": "中间竖线所在的直线", "reasoning": ["题中的竖线穿过上、下两条边的中点，把长方形边框分成左右相同的两半。", "沿中间竖线对折，左右边框重合，上、下两边各自的两半重合，中间竖线也重合。"], "options": [{"id": "a", "text": "左边框所在的直线", "feedback": "沿左边框对折，右侧的图样会折到左边空白处，不能完全重合。"}, {"id": "b", "text": "中间竖线所在的直线", "feedback": "对。长方形的左右两半能重合，中间竖线也重合。"}, {"id": "c", "text": "右边框所在的直线", "feedback": "沿右边框对折，左侧的图样会折到右边空白处，不能完全重合。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.001"], "contentVersion": "sha256:cc4c142015d5ddd19b20fca3fde69cf7a49c1c2a2a8219416a4acdef51c14e5d"}, {"id": "p3b-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一扇门的一侧用合页固定在门框上。关门时，这扇门绕着装合页的那条边转动。它的运动属于哪一种？", "answer": "旋转", "reasoning": ["题中门的一侧用合页固定，关门时门绕着这一侧转动。", "这种绕着固定的一侧转动的运动是旋转。"], "options": [{"id": "a", "text": "旋转", "feedback": "对。门绕着门轴转动，是旋转。"}, {"id": "b", "text": "平移", "feedback": "这扇门绕着装合页的一侧转动，是旋转；沿直轨道滑动的推拉门才是平移。"}, {"id": "c", "text": "既不是平移，也不是旋转", "feedback": "门绕着一条边（门轴）转动，是旋转。"}], "correct": "a", "pointIds": ["pyps.p3b.u1.004", "pyps.p3b.u1.003"], "contentVersion": "sha256:ab74d834f8cf0f808eeccfc15b36bcf3c99afaf930d5d4145c694c60f85de53b"}, {"id": "p3b-u1-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "把长方形纸条横放，每次都把右半边向左对折，边缘叠齐，共折 2 次。在四层纸上画半个纸人：以最后一次形成的右折边为纸人的中线，头和身体贴着右折边，手臂向左伸到纸的左边。折剪示意：〔左边：手端留连接〕—手臂—〔右折边：半个头和身体〕。沿半个纸人的外轮廓剪，右折边上头和身体处不剪开，左边手端留一小段不剪开，其余多余的纸剪去。全部展开，能得到几个手拉手的纸人？", "answer": "2 个", "reasoning": ["每次把右半边向左折，最后形成的右折边叠着两处纸人的中线。", "头和身体处的折边不剪开，相邻两层展开合成 1 个完整纸人，四层共得到 2 个。", "纸条中间折痕处的手端没有剪断，所以两个纸人手拉手。"], "options": [{"id": "a", "text": "4 个", "feedback": "4 是叠好的纸的层数。按题中画法，相邻两层展开才合成 1 个完整纸人。"}, {"id": "b", "text": "1 个", "feedback": "只展开最后一次对折时，看到的是 1 个完整纸人的双层叠样；再全部展开，还会有另 1 个纸人。"}, {"id": "c", "text": "2 个", "feedback": "对。相邻两层展开合成 1 个纸人，四层全部展开得到 2 个；手端留下的连接使两个纸人手拉手。"}], "correct": "c", "pointIds": ["pyps.p3b.u1.005"], "contentVersion": "sha256:9605124c3e4a7293299df220d3e09bb7881a4c199018080fb1f0e82444655014"}, {"id": "p3b-u1-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "长和宽不一样长的长方形、正方形、三条边一样长的三角形，这三个图形中，哪个的对称轴最多？", "answer": "正方形", "reasoning": ["长和宽不一样长的长方形，横着、竖着对折各有 1 条对称轴，共 2 条。", "正方形横着、竖着对折各有 1 条，沿两个相对的角对折各有 1 条，共 4 条。", "三条边一样长的三角形，从每个顶点到与它相对的那条边的中点的直线都是对称轴，共 3 条。", "比较 2、4、3，正方形的对称轴最多。"], "options": [{"id": "a", "text": "长和宽不一样长的长方形", "feedback": "这种长方形有 2 条对称轴，比正方形的 4 条少。"}, {"id": "b", "text": "正方形", "feedback": "对。正方形有 4 条，题中的长方形有 2 条，三条边一样长的三角形有 3 条。"}, {"id": "c", "text": "三条边一样长的三角形", "feedback": "这种三角形有 3 条对称轴，比正方形的 4 条少。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.002", "pyps.p3b.u1.001"], "contentVersion": "sha256:41ce82e491aa8faca59b21ffb1973443e7990f0206466a255743e1fd80c4fdfb"}, {"id": "p3b-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "一辆汽车在平直的公路上向前开，车身保持朝向不变。看车身相对于地面的运动，再看车轮绕着车轴的转动，分别属于哪一种运动？", "answer": "车身相对地面平移，车轮绕车轴旋转", "reasoning": ["相对于地面，车身沿直线前进，朝向不变，是平移。", "看车轮绕车轴的转动，它是旋转。", "同时，车轮还随车轴一起向前移动；车轮相对地面的整个运动，包含向前移动和绕车轴转动。"], "options": [{"id": "a", "text": "车身相对地面平移，车轮绕车轴旋转", "feedback": "对。车身相对地面沿直线向前且朝向不变；车轮绕车轴转动。同时，车轮也随车轴一起向前移动。"}, {"id": "b", "text": "车身相对地面平移，车轮绕车轴也平移", "feedback": "车轮虽然随车轴向前移动，但题目问的是绕车轴的转动，这属于旋转。"}, {"id": "c", "text": "车身相对地面旋转，车轮绕车轴平移", "feedback": "车身保持朝向不变、沿直线前进，是平移；车轮绕车轴的转动是旋转。"}], "correct": "a", "pointIds": ["pyps.p3b.u1.003", "pyps.p3b.u1.004"], "contentVersion": "sha256:fa1c8a65de801f1b01f66330bff588b29c1ea14d8fb5ba48da9c14d166b85dcd"}, {"id": "p3b-u1-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "钟的分针现在指着 12。要把它拨到指着 9，怎样拨走过的格数最少？", "answer": "逆时针拨", "reasoning": ["顺时针从 12 走到 9，要经过 1、2……一直到 9，走 9 个大格。", "逆时针从 12 往回走到 9，只走 3 个大格。", "所以逆时针拨走得少。"], "options": [{"id": "a", "text": "顺时针拨", "feedback": "顺时针从 12 到 9 要走 9 个大格，多了。"}, {"id": "b", "text": "逆时针拨", "feedback": "对。逆时针从 12 拨到 9 只走 3 个大格。"}, {"id": "c", "text": "两种拨法一样多", "feedback": "顺时针要走 9 个大格，逆时针只要 3 个大格，不一样多。"}], "correct": "b", "pointIds": ["pyps.p3b.u1.004"], "contentVersion": "sha256:abbb6b2866ba087382454da86aa0fb7877af5646ce0cd9eba71489c0cdb0d7d9"}], "contentVersion": "sha256:812a0037f24602c24c711f4e28f3e9aa59f999d68b719f722daebbf68378e229"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
