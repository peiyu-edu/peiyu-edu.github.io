<path d="M232.0 10.9 A236.0 236.0 0 0 1 156.4 414.0" fill="none" stroke="#17202a" stroke-width="3"/>
<ellipse cx="82.8" cy="414.0" rx="73.6" ry="31.0" fill="none" stroke="#17202a" stroke-width="3" stroke-dasharray="9 7"/>
<line x1="9.2" y1="414.0" x2="156.4" y2="414.0" stroke="#17202a" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 7"/>
<circle cx="82.8" cy="414.0" r="6" fill="#17202a"/>
</svg>
