<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 350" width="580" height="350" role="img" aria-labelledby="title desc">
<title id="title">平行四边形与对角线</title>
<desc id="desc">平行四边形 ABCD，A 在左、C 在右、D 在上、B 在下。对角线 AC 与 BD 相交于点 O。</desc>
<style>text { fill:#17202a; font-size:30px; } .i { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .n { font-family:'Times New Roman',Georgia,serif; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect x="0" y="0" width="580" height="350" fill="white"/>
<polyline points="46.0,172.0 290.0,40.0 534.0,172.0 290.0,304.0 46.0,172.0" fill="none" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/><line x1="46.0" y1="172.0" x2="534.0" y2="172.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><line x1="290.0" y1="40.0" x2="290.0" y2="304.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><text class="i" x="22" y="182" text-anchor="middle">A</text><text class="i" x="558" y="182" text-anchor="middle">C</text><text class="i" x="290" y="28" text-anchor="middle">D</text><text class="i" x="290" y="338" text-anchor="middle">B</text><text class="i" x="312" y="208" text-anchor="middle">O</text>
</svg>
