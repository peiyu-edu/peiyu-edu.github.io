<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 31 章 概率初步 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j31-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 31 章 概率初步 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j31-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j31-test", "sectionId": "j31-test", "chapterId": "j31", "title": "第 31 章 概率初步 · 章末测验", "label": "章末测验", "sections": ["j31-1", "j31-2", "j31-3"], "items": [{"id": "j31-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j31-1"], "pointIds": ["pyjh.prob.001"], "prompt": "不透明盒内只有四张除数字外完全相同的卡片，分别写着 $0,2,5,7$。充分混匀后随机抽取一张。下列哪个事件是不可能事件？", "options": [{"id": "a", "text": "抽到的数是偶数", "feedback": "请检查盒内是否既有满足条件的卡片，也有不满足的卡片。"}, {"id": "b", "text": "抽到的数小于 $0$", "feedback": "盒内没有负数卡片，符合不可能事件的定义。"}, {"id": "c", "text": "抽到的数不大于 $7$", "feedback": "请逐张检查这个条件是否始终成立。"}, {"id": "d", "text": "抽到的数是 $5$", "feedback": "盒内确实有这张卡片，不能把机会小当作不可能。"}], "correct": "b", "answer": "抽到的数小于 $0$", "reasoning": ["四张卡片均非负，抽到负数没有任何可能结果。", "偶数对应 $0,2$，数字 $5$ 对应一张，均为随机事件；不大于 $7$ 对所有卡片成立，是必然事件。"], "contentVersion": "sha256:f808a1b6cd978f8c4340de7974c19d99e0d7c82caef6f36ef3d86548e5debb04"}, {"id": "j31-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j31-1"], "pointIds": ["pyjh.prob.003"], "prompt": "一个理想转盘分成 $10$ 个全等扇形，其中 $3$ 格橙色、$2$ 格绿色、$5$ 格蓝色。每格被指到的机会相同，指针落在分界线上忽略不计。转一次，指针落在非蓝色区域的概率是多少？", "options": [{"id": "a", "text": "$\\dfrac{3}{10}$", "feedback": "你只数了一种非蓝色格，请检查还有没有遗漏。"}, {"id": "b", "text": "$\\dfrac{2}{3}$", "feedback": "颜色名称不是等可能的基本结果，请按等分格计数。"}, {"id": "c", "text": "$\\dfrac12$", "feedback": "非蓝色共有五格，十格等可能，所占比例为一半。"}, {"id": "d", "text": "$\\dfrac15$", "feedback": "这个数只计入了绿色格，请核对事件范围。"}], "correct": "c", "answer": "$\\dfrac12$", "reasoning": ["基本结果是 $10$ 个等可能的格，而非三种颜色。", "非蓝色包括橙色和绿色，共 $3+2=5$ 格，故 $P=5/10=1/2$。"], "contentVersion": "sha256:fe3ae728b48977fd127415d64f17538205ec103af0bbf74f6aecd7e95016b747"}, {"id": "j31-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j31-1"], "pointIds": ["pyjh.prob.003"], "prompt": "五张除数字外完全相同的卡片分别写着 $-2,-1,0,1,2$，充分混匀后随机抽取一张，记所抽数字为 $x$。事件“$x^2=1$”发生的概率是多少？", "options": [{"id": "a", "text": "$\\dfrac15$", "feedback": "请同时检查正数卡片和负数卡片。"}, {"id": "b", "text": "$\\dfrac35$", "feedback": "请区分平方等于一与平方不大于一，检查零是否符合题设。"}, {"id": "c", "text": "$1$", "feedback": "请检查是否每张卡片都满足这个等式。"}, {"id": "d", "text": "$\\dfrac25$", "feedback": "满足条件的有正、负两个数，共占五张中的两张。"}], "correct": "d", "answer": "$\\dfrac25$", "reasoning": ["逐张计算平方得到 $4,1,0,1,4$。", "满足条件的卡片是 $-1$ 和 $1$；五张等可能，概率为 $2/5$。"], "contentVersion": "sha256:a244a867ca9ff14f43c099fe25a86a179f10694e005b54a14452cb014419a97b", "contentVersions": ["sha256:afa0aceb1c2654dd5a6a92ba5ef0b52853f2167b16e8a575c4d5e7b7d0a53ffd", "sha256:a244a867ca9ff14f43c099fe25a86a179f10694e005b54a14452cb014419a97b"]}, {"id": "j31-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j31-2"], "pointIds": ["pyjh.prob.004"], "prompt": "甲盒三张卡片的数字为 $1,2,4$，乙盒两张卡片的数字为 $1,3$。各盒卡片除数字外完全相同，分别充分混匀；从每盒随机抽一张，两盒抽取互不影响。两数之和为 $5$ 的概率是多少？", "options": [{"id": "a", "text": "$\\dfrac13$", "feedback": "六种等可能的配对中，有两种符合要求。"}, {"id": "b", "text": "$\\dfrac16$", "feedback": "请逐行检查配对，可能漏掉了另一种顺序来源不同的结果。"}, {"id": "c", "text": "$\\dfrac25$", "feedback": "两盒的卡片不是合并后抽一张，应先列出配对。"}, {"id": "d", "text": "$\\dfrac12$", "feedback": "请把所有配对列全，再数满足条件的格。"}], "correct": "a", "answer": "$\\dfrac13$", "reasoning": ["按甲盒数字逐行列出：$(1,1),(1,3),(2,1),(2,3),(4,1),(4,3)$。", "六种配对等可能，其中 $(2,3),(4,1)$ 的和为 $5$，概率为 $2/6=1/3$。"], "contentVersion": "sha256:6ae2d61a16049187b01fd4611765e6a46e85c1c724ebbf2aa9ca835676bfc015"}, {"id": "j31-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j31-3"], "pointIds": ["pyjh.prob.008"], "prompt": "在相同投掷条件下，一种不规则小木块被重复投掷 $350$ 次，各次结果互不影响，其中标记面朝上 $147$ 次。这组试验中标记面朝上的频率是多少？", "options": [{"id": "a", "text": "$0.58$", "feedback": "你算的是标记面没有朝上的频率，请核对事件。"}, {"id": "b", "text": "$147$", "feedback": "这是发生次数，还没有除以试验总次数。"}, {"id": "c", "text": "$0.42$", "feedback": "频率等于发生次数除以试验总次数。"}, {"id": "d", "text": "$\\dfrac{350}{147}$", "feedback": "分子与分母的含义颠倒了，也可检查频率的取值范围。"}], "correct": "c", "answer": "$0.42$", "reasoning": ["本组发生次数为 $147$，总次数为 $350$。", "频率 $147/350=0.42$。这是本组数据，不据此断定概率恰好为 $0.42$。"], "contentVersion": "sha256:6dd015f06fbd65059334905f6662741850f7c9a78f3efd955ac7496ec5f0337c"}, {"id": "j31-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j31-1", "j31-3"], "pointIds": ["pyjh.prob.002", "pyjh.prob.003", "pyjh.prob.008"], "prompt": "一枚理想均匀硬币每次正反面机会相同，每次抛掷条件相同且结果互不影响。已经连续 $6$ 次正面朝上，第 $7$ 次反面朝上的概率是多少？", "options": [{"id": "a", "text": "大于 $\\dfrac12$", "feedback": "前几次的结果不会让下一次必须补偿。"}, {"id": "b", "text": "等于 $\\dfrac12$", "feedback": "硬币及下一次试验条件没有改变，正反面仍等可能。"}, {"id": "c", "text": "小于 $\\dfrac12$", "feedback": "连续出现正面不表示下一次仍更偏向正面。"}, {"id": "d", "text": "等于 $1$", "feedback": "请检查题目是否给出了必然反面的条件。"}], "correct": "b", "answer": "等于 $\\dfrac12$", "reasoning": ["每次试验结果互不影响，前六次没有改变第七次的条件。", "第七次的两种结果仍等可能，反面朝上的概率为 $1/2$。有限次数内不需要补足某种结果。"], "contentVersion": "sha256:7ea0a5cb423bda7f8921d239553986dfb0a605dee71db5cf4486db842281c81c"}, {"id": "j31-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j31-2"], "pointIds": ["pyjh.prob.006"], "prompt": "四张除数字外完全相同的卡片写着 $0,1,2,4$。充分混匀后随机抽一张，不放回，再从余下卡片中随机抽一张。每次剩余各张被抽到的机会相同。两数之差的绝对值为 $2$ 的概率是多少？", "options": [{"id": "a", "text": "$\\dfrac14$", "feedback": "请检查不放回时能否两次抽到同一张卡片。"}, {"id": "b", "text": "$\\dfrac16$", "feedback": "绝对值不分正负，但抽取的先后仍有不同结果，检查是否漏数。"}, {"id": "c", "text": "$\\dfrac23$", "feedback": "请区分满足条件的配对与不满足条件的配对。"}, {"id": "d", "text": "$\\dfrac13$", "feedback": "十二种有序结果中，符合条件的有四种。"}], "correct": "d", "answer": "$\\dfrac13$", "reasoning": ["依次抽取共有 $4\\times3=12$ 种等可能结果，同一张卡片不能再次出现。", "满足条件的是 $(0,2),(2,0),(2,4),(4,2)$，故概率为 $4/12=1/3$。"], "contentVersion": "sha256:0ba60476eb306ab0ceb892a718379931c20a592a208348c911fbffb93d22fe24"}, {"id": "j31-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j31-3"], "pointIds": ["pyjh.prob.008", "pyjh.prob.009"], "prompt": "一枚理想均匀硬币在相同条件下重复抛掷，各次结果互不影响。同一串试验中，前 $100$ 次有 $49$ 次正面，前 $200$ 次有 $96$ 次正面。下列说法哪一个正确？", "options": [{"id": "a", "text": "两次记录可能都正确，频率不保证随次数增加而每次都更接近 $0.5$。", "feedback": "有限试验会有起伏，不要求每个检查点都更接近概率。"}, {"id": "b", "text": "记录一定有错，因为试验次数增加后频率离 $0.5$ 更远了。", "feedback": "频率在概率附近波动，不具有你所要求的单调性。"}, {"id": "c", "text": "正面概率由 $0.49$ 变成了 $0.48$。", "feedback": "变化的是试验频率，请检查硬币和条件是否改变。"}, {"id": "d", "text": "再抛 $100$ 次一定恰好有 $54$ 次正面，使前 $300$ 次正面总数为 $150$。", "feedback": "后续结果没有补齐指定总数的义务。"}], "correct": "a", "answer": "两次记录可能都正确，频率不保证随次数增加而每次都更接近 $0.5$。", "reasoning": ["前 $100$ 次频率 $49/100=0.49$，前 $200$ 次频率 $96/200=0.48$，与 $0.5$ 的差分别为 $0.01,0.02$。", "后 $100$ 次正面数为 $96-49=47$，记录可实现。次数增多不保证每个检查点更近；概率仍为 $0.5$，后续正面次数也不固定。"], "contentVersion": "sha256:c92e32cda02ddaddba572d505f274a73bc1812fcfb88b07fd2cc217f869fc67b"}, {"id": "j31-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j31-3"], "pointIds": ["pyjh.prob.008", "pyjh.prob.009"], "prompt": "一袋外观形状大小相同的小球，只凭颜色区分红白，总数不变。要用摸到红球的频率估计这袋球原有的红球比例，下列哪种试验安排满足本章大量重复试验的要求？", "options": [{"id": "a", "text": "只摸一次，以是否红色直接确定比例。", "feedback": "单次结果的偶然性不能支撑这种频率估计。"}, {"id": "b", "text": "每次摸后不放回，一直摸到袋空，把每次都当作条件相同的重复试验。", "feedback": "余下球的数量和颜色组成会改变；摸空可做清点，但不满足题目所问的重复试验要求。"}, {"id": "c", "text": "每次随机摸一个，记录颜色后放回并充分混匀，大量重复；各次抽取结果互不影响。", "feedback": "放回并混匀保留了每次的条件，大量记录可用于估计。"}, {"id": "d", "text": "每次摸后放回，但逐渐加入白球，再把所有记录混在一起。", "feedback": "加球改变了被估计的对象与每次抽取条件。"}], "correct": "c", "answer": "每次随机摸一个，记录颜色后放回并充分混匀，大量重复；各次抽取结果互不影响。", "reasoning": ["要估计同一袋球原有的比例，每次抽取必须保持袋内组成等条件相同，且各次结果互不影响。", "记录、放回、充分混匀、大量重复符合要求。摸空袋能精确清点原来比例，但不能把逐次不放回说成同条件重复试验。"], "contentVersion": "sha256:d41429993d98780b2deacc19503a5526a8b296b2b63e5b6d46636c5c8e0e0a4d"}, {"id": "j31-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j31-2"], "pointIds": ["pyjh.prob.005", "pyjh.prob.007"], "prompt": "某小游戏连续显示 $3$ 个字母，每次只显示“左”或“右”，两者机会相同，三次结果互不影响。若恰好出现 $1$ 个“右”，甲赢；其他情形乙赢；没有平局且双方奖品相同。下列判断哪一个正确？", "options": [{"id": "a", "text": "公平，因为甲乙各有一种获胜规则。", "feedback": "获胜规则的条数不代表它包含的等可能结果数。"}, {"id": "b", "text": "不公平，乙赢的概率为 $\\dfrac58$。", "feedback": "八条等可能路径中，甲占三条，乙占五条。"}, {"id": "c", "text": "不公平，甲赢的概率为 $\\dfrac58$。", "feedback": "请核对恰好一个“右”对应哪些完整路径。"}, {"id": "d", "text": "公平，因为“右”的个数 $0,1,2,3$ 四种情况等可能。", "feedback": "不同个数包含的路径数量不同，不能把个数类别当成等可能结果。"}], "correct": "b", "answer": "不公平，乙赢的概率为 $\\dfrac58$。", "reasoning": ["逐层分成左、右，三层共八条等可能路径：左左左、左左右、左右左、左右右、右左左、右左右、右右左、右右右。", "恰好一个右的三条是左左右、左右左、右左左。甲概率 $3/8$，乙概率 $5/8$，两者不等，游戏不公平。"], "contentVersion": "sha256:2c5c80fc9cd4c0ff3c6e2431bdffe558fee017f302a3bc975662d9cac596f1f9", "contentVersions": ["sha256:122058a7fe3abfa41305d49d7c1eb89c13210141fc197f3a316fe81b83ee55ad", "sha256:2c5c80fc9cd4c0ff3c6e2431bdffe558fee017f302a3bc975662d9cac596f1f9"]}, {"id": "j31-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j31-2"], "pointIds": ["pyjh.prob.006"], "prompt": "袋中有四个除颜色外完全相同的小球，红球记为红1、红2，白球记为白1、白2。方案甲：随机摸一个，记录并放回、混匀，再随机摸一个，各次结果互不影响。方案乙：随机摸一个后不放回，再从余下球随机摸一个。每次现有各球被摸到的机会相同。两次颜色不同的概率，按“甲、乙”的顺序是哪一对？", "options": [{"id": "a", "text": "$(\\dfrac12,\\dfrac23)$", "feedback": "按实体球列表，放回有十六格，不放回有十二格，两种不同颜色的有序格数相同。"}, {"id": "b", "text": "$(\\dfrac12,\\dfrac12)$", "feedback": "不放回后可选球减少，请重新核对表格对角线。"}, {"id": "c", "text": "$(\\dfrac23,\\dfrac12)$", "feedback": "请核对两个方案的先后顺序。"}, {"id": "d", "text": "$(\\dfrac14,\\dfrac13)$", "feedback": "请检查是否只计入先红后白，漏了先白后红。"}], "correct": "a", "answer": "$(\\dfrac12,\\dfrac23)$", "reasoning": ["给四个球编号，放回方案有 $16$ 种等可能有序结果，不放回去掉四个同球对角线后有 $12$ 种。", "两种方案中不同颜色的结果均有 $8$ 种：先红后白四种，先白后红四种。故甲为 $8/16=1/2$，乙为 $8/12=2/3$。"], "contentVersion": "sha256:f934d2c293aad409c6c438b3c2153fa401913dd071e6aa24f9fd156176aa2a23", "contentVersions": ["sha256:3ae8eb94033dc21ddc479b48e244779cd2d50ec0816a7b0d4986da5146609b65", "sha256:f934d2c293aad409c6c438b3c2153fa401913dd071e6aa24f9fd156176aa2a23"]}, {"id": "j31-test-12-v2", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j31-3"], "pointIds": ["pyjh.prob.009", "pyjh.prob.010"], "prompt": "某种种子在相同培养条件下做发芽试验，各粒是否发芽互不影响。累计播种数与累计发芽数依次为 $(300,210)$，$(1000,718)$，$(5000,3595)$，$(10000,7204)$。先用次数较多时的频率，把发芽概率估计到 $0.01$，再据此估计：希望获得约 $900$ 株幼苗，应播种多少粒？", "options": [{"id": "a", "text": "大约 $648$ 粒", "feedback": "已知的是目标幼苗数，请检查乘除方向。"}, {"id": "b", "text": "大约 $1152$ 粒", "feedback": "增加的那部分种子也可能不发芽，不能仅在目标数上加损失比例。"}, {"id": "c", "text": "大约 $1250$ 粒", "feedback": "大次数频率在0.72附近，按目标数除以估计概率，并保留大约。"}, {"id": "d", "text": "一定播种 $1250$ 粒就恰好得到 $900$ 株", "feedback": "频率估计与实际发芽都有波动，不能保证恰好达到目标。"}], "correct": "c", "answer": "大约 $1250$ 粒", "reasoning": ["累计频率为 $0.70,0.718,0.719,0.7204$；较多次数时接近 $0.72$，按要求估计发芽概率约为 $0.72$。", "设播种数约为 $N$，则 $0.72N\\approx900$，得 $N\\approx900/0.72=1250$。这不是恰好得到 $900$ 株的保证。"], "contentVersion": "sha256:1a7d9cab75fd675ac1d6457fa967e994ecbcc74478b31cf259028ea2c1c119d8"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
