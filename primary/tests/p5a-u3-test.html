<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>五年级上册 第三单元 小数除法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p5a-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>五年级上册 第三单元 小数除法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p5a-u3-test", "sectionId": "p5a-u3-test", "unitId": "p5a-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "五年级上册 第三单元 小数除法 单元测评", "items": [{"id": "p5a-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "8.4 ÷ 4 = □", "answer": "2.1", "reasoning": ["按整数除法算：84 ÷ 4 = 21。", "商的小数点和被除数的小数点对齐，得 2.1。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u3.001"], "contentVersion": "sha256:b6844cfea7bc08b32bcb009570c0cb373a8aee22c766429038ae4d55e57fe47d"}, {"id": "p5a-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "7.5 ÷ 6 = □", "answer": "1.25", "reasoning": ["7 ÷ 6 商 1 余 1；15 个十分之一除以 6，商 2 余 3。", "余数 3 后面添 0，30 个百分之一除以 6，商 5，正好除尽。", "得 1.25。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u3.002"], "contentVersion": "sha256:fff0e8a4b323dc2bc57dd7e40693f1960e8638eadf7f59042460dd386f6d394d"}, {"id": "p5a-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "0.56 ÷ 7 = □", "answer": "0.08", "reasoning": ["整数部分 0 不够商 1，商 0；5 个十分之一不够分成 7 份，十分位上商 0 占位。", "56 个百分之一除以 7，商 8，得 0.08。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u3.003"], "contentVersion": "sha256:e2ba43fe2afc07c57955050f0e5f01d4d6d6c7801698f0e9290430b6d581bcdf"}, {"id": "p5a-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪个数是循环小数？", "answer": "0.353535…（35 依次不断重复）", "reasoning": ["循环小数要从某一位起，一个或几个数字依次不断重复出现。", "0.353535… 中 35 不断重复，是循环小数。"], "options": [{"id": "a", "text": "3.1415", "feedback": "这个数只有四位小数，是有限小数。"}, {"id": "b", "text": "0.3535", "feedback": "这个数只有四位小数，写完就结束了，不是循环小数。"}, {"id": "c", "text": "0.353535…（35 依次不断重复）", "feedback": "对。从十分位起，35 依次不断重复出现。"}], "correct": "c", "pointIds": ["pyps.p5a.u3.004"], "contentVersion": "sha256:f0e7a8f9369e9ad01246ae4a238f00ad6661c53aafe9b8a87c82dea5940a144d"}, {"id": "p5a-u3-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "2.88 ÷ 0.9 = □", "answer": "3.2", "reasoning": ["除数 0.9 有一位小数，除数和被除数的小数点都向右移一位，变成 28.8 ÷ 9。", "288 ÷ 9 = 32，商的小数点对齐，得 3.2。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u3.007"], "contentVersion": "sha256:135c56960d63bdaa11ee76dd3c9cdcaf55c89600bebd38bbf87df84e997a84fa"}, {"id": "p5a-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "1.8 ÷ 0.36 = □", "answer": "5", "reasoning": ["除数 0.36 有两位小数，小数点都向右移两位：0.36 变成 36，1.8 变成 180（末尾补一个 0）。", "180 ÷ 36 = 5。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u3.008"], "contentVersion": "sha256:bbb2e80c22564b877f456e10821af47d61f3eeefad2ea77c46933fa908decdf8"}, {"id": "p5a-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "20 ÷ 7 的商保留两位小数，约是多少？", "answer": "2.86", "reasoning": ["要保留两位小数，先除到千分位：20 ÷ 7 = 2.857…", "看千分位上的 7，向百分位进 1，得 2.86。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u3.006"], "contentVersion": "sha256:7972b1535b87499cf301233d794ccf6f0a7052901f8edc1d4d201b1929c7a22f"}, {"id": "p5a-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "不计算，下面哪个算式的商比 4.5 大？", "answer": "4.5 ÷ 0.9", "reasoning": ["在本题的正数范围内，一个数除以大于 0、小于 1 的数，商比原来的数大。", "0.9 < 1，所以 4.5 ÷ 0.9 的商比 4.5 大。"], "options": [{"id": "a", "text": "4.5 ÷ 1.5", "feedback": "除数 1.5 比 1 大，商比 4.5 小。"}, {"id": "b", "text": "4.5 ÷ 0.9", "feedback": "对。除数 0.9 比 1 小，商比 4.5 大。"}, {"id": "c", "text": "4.5 ÷ 1", "feedback": "除以 1，商还是 4.5。"}], "correct": "b", "pointIds": ["pyps.p5a.u3.009"], "contentVersion": "sha256:48dc3479fbf82cfdf8710772e749cbede7b3e5fa68a799390528961cc3805972"}, {"id": "p5a-u3-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪个算式的商是有限小数？", "answer": "3 ÷ 8", "reasoning": ["3 ÷ 8 = 0.375，除到千分位就除尽了，是有限小数。", "另外两个算式永远除不尽，商是无限小数。"], "options": [{"id": "a", "text": "2 ÷ 3", "feedback": "2 ÷ 3 = 0.666…，6 不断重复，是无限小数。"}, {"id": "b", "text": "3 ÷ 8", "feedback": "对。3 ÷ 8 = 0.375，除到千分位正好除尽。"}, {"id": "c", "text": "5 ÷ 6", "feedback": "5 ÷ 6 = 0.8333…，3 不断重复，是无限小数。"}], "correct": "b", "pointIds": ["pyps.p5a.u3.005"], "contentVersion": "sha256:572a77ca9cbcca4beb135a970dabb43d498592ff8876737db5c47051aa738985"}, {"id": "p5a-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "每个瓶子最多装 2.5 千克油。要装 18 千克油，至少需要几个瓶子？", "answer": "8 个", "reasoning": ["18 ÷ 2.5 = 7.2（个）。", "装满 7 个瓶子后还剩一些油，还要再用 1 个瓶子。", "所以要用进一法，7 + 1 = 8（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u3.010"], "contentVersion": "sha256:bf162f69ca2d8b093ab2b4f582f30558ea6f6d8d1629739cdaa2efb3e793ab4d"}, {"id": "p5a-u3-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一根彩带长 15 米，每 1.2 米做一朵花。最多能做几朵花？", "answer": "12 朵", "reasoning": ["15 ÷ 1.2 = 12.5（朵）。", "剩下的彩带不够再做一朵，要用去尾法，最多做 12 朵。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u3.010"], "contentVersion": "sha256:3974c85b049d8da472b29ca6d5e11ca42d641cedcc6639d19777c64fc8f72002"}, {"id": "p5a-u3-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "妈妈买 2.5 千克苹果花了 19 元。照这样的价钱，买 4 千克苹果要多少元？", "answer": "30.4 元", "reasoning": ["先求每千克多少元：19 ÷ 2.5 = 7.6（元）。", "再求 4 千克多少元：4 × 7.6 = 30.4（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p5a.u3.007", "pyps.p5a.u2.001"], "contentVersion": "sha256:f137787cf335ddf847b49fed5bb014470b54cda6d318d13d3bc887fda79acfc2"}], "contentVersion": "sha256:83c2c0cbc85e8f16248afd32a40ceae0096531269e14287ed7478102b8c30d9f"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
