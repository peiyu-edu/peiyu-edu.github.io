<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级上册 第一单元 5以内数的认识和加、减法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p1a-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级上册 第一单元 5以内数的认识和加、减法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1a-u1-test", "sectionId": "p1a-u1-test", "unitId": "p1a-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级上册 第一单元 5以内数的认识和加、减法 单元测评", "items": [{"id": "p1a-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "数一数：○ ○ ○ ○ 一共有几个圆圈？", "answer": "4", "reasoning": ["一个一个点着数：1、2、3、4。", "数到最后一个是 4，就是 4 个。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u1.001"], "contentVersion": "sha256:cf64a17036c8f1268cc9cc683aae9b37cf32e6fff5165fd897e03f95a74ef7d6"}, {"id": "p1a-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "按顺序填数：1、2、□、4、5", "answer": "3", "reasoning": ["2 添上 1 是 3，3 再添上 1 是 4。", "所以 2 和 4 中间是 3。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u1.002"], "contentVersion": "sha256:764b5614ef502c2a9e22e2949f5252f15a277addf859f22a4494aaa4c7bb3ced"}, {"id": "p1a-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "在 ○ 里填 >、< 还是 =？ 4 ○ 2", "answer": ">", "reasoning": ["4 个和 2 个一个对一个，4 个那边还多出来。", "4 比 2 大，写 4 > 2。"], "options": [{"id": "a", "text": "<", "feedback": "开口朝着大的数。4 比 2 大，开口要朝 4。"}, {"id": "b", "text": "=", "feedback": "4 和 2 不一样多。"}, {"id": "c", "text": ">", "feedback": "对。4 个和 2 个一个对一个，4 个那边多出 2 个，4 比 2 大。"}], "correct": "c", "pointIds": ["pyps.p1a.u1.003"], "contentVersion": "sha256:af6bc6c20f35923e994206be6383cc1bb9568fc4e6585e7a2a8ca3a4fc42b9de"}, {"id": "p1a-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "2 + 3 = □", "answer": "5", "reasoning": ["2 个和 3 个合起来。", "2 和 3 合成 5，所以 2 + 3 = 5。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u1.006"], "contentVersion": "sha256:1c60f5318c2531613151482d21e3245a1060b970af653793e6028e14c88ae249"}, {"id": "p1a-u1-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "5 − 1 = □", "answer": "4", "reasoning": ["一共 5 个，去掉 1 个。", "5 分成 1 和 4，去掉 1 个还剩 4 个。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u1.008"], "contentVersion": "sha256:ac222ac1da211af9a141afbe8563cba7c94569d46f37bef452a02b5647ad9e77"}, {"id": "p1a-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "5 可以分成 2 和 □。", "answer": "3", "reasoning": ["5 个圆片，先拿出 2 个。", "剩下的是 3 个，所以 5 可以分成 2 和 3。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u1.005"], "contentVersion": "sha256:95c832597cd83b6e224d0d4429d46017a7ecabf9ccf1cf8e440b516a99ecc531"}, {"id": "p1a-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "5 个小朋友排成一排：○ ● ○ ○ ○，● 是小红。从左边数，小红排第 2。从右边数，小红排第几？", "answer": "第 4", "reasoning": ["从右边数，要从最右边那个小朋友开始数。", "第 1、第 2、第 3、第 4，数到小红，小红从右边数排第 4。"], "options": [{"id": "a", "text": "第 2", "feedback": "这是从左边数的。换成从右边数，要从最右边的小朋友数起。"}, {"id": "b", "text": "第 5", "feedback": "一共有 5 个小朋友，可是小红不在最左边。"}, {"id": "c", "text": "第 4", "feedback": "对。从右边数：第 1、第 2、第 3、第 4，数到小红。"}], "correct": "c", "pointIds": ["pyps.p1a.u1.004"], "contentVersion": "sha256:e515b0aea93186d3195c0b8577e56776c81120d906a80ad985e4a10012664f04", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 130\" role=\"img\" aria-label=\"仅标左端、左起第二的小红和右端，中间省略；一共五个小朋友\" style=\"max-width:280px\"><text x=\"140\" y=\"22\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:18px\">一共5个小朋友<\/text><circle cx=\"30\" cy=\"62\" r=\"17\" style=\"fill:var(--card);stroke:var(--a);stroke-width:2\"/><circle cx=\"90\" cy=\"62\" r=\"17\" style=\"fill:var(--card);stroke:var(--a);stroke-width:2\"/><text x=\"90\" y=\"68\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">红<\/text><text x=\"163\" y=\"68\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:22px\">……<\/text><circle cx=\"245\" cy=\"62\" r=\"17\" style=\"fill:var(--card);stroke:var(--a);stroke-width:2\"/><text x=\"30\" y=\"109\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">左端<\/text><text x=\"90\" y=\"109\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">左起第2<\/text><text x=\"245\" y=\"109\" text-anchor=\"middle\" style=\"fill:var(--fg);font-size:16px\">右端<\/text><\/svg>"}, {"id": "p1a-u1-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "3 − 3 = □", "answer": "0", "reasoning": ["一共 3 个，3 个都去掉了。", "一个也没有了，用 0 表示，所以 3 − 3 = 0。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u1.010"], "contentVersion": "sha256:53bad5c1f00c157b01b62fe8010de4c79160788425788de2f2b86fb4c20ad757"}, {"id": "p1a-u1-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "4 = □，□ 里可以填哪个算式？", "answer": "1 + 3", "reasoning": ["等号两边要同样多。", "1 + 3 = 4，所以填 1 + 3。"], "options": [{"id": "a", "text": "2 + 3", "feedback": "2 + 3 = 5，和 4 不一样多。"}, {"id": "b", "text": "1 + 3", "feedback": "对。1 + 3 = 4，等号两边同样多。"}, {"id": "c", "text": "5 − 2", "feedback": "5 − 2 = 3，和 4 不一样多。"}], "correct": "b", "pointIds": ["pyps.p1a.u1.007"], "contentVersion": "sha256:4bd3a9505dc459cee6385ad3d64eec87e18fed3e51fc730d156836b85b5705d1"}, {"id": "p1a-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "树上有 2 只小鸟，又飞来 3 只。现在树上有几只小鸟？", "answer": "2 + 3 = 5（只）", "reasoning": ["原来有 2 只，又飞来 3 只，是把两部分合起来。", "合起来用加法：2 + 3 = 5（只）。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u1.006"], "contentVersion": "sha256:9851adc9e8d353be47268ab11b85bf06bd9994f7a6147094f0388ce8ed0f7225"}, {"id": "p1a-u1-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "盘子里有 5 个桃，吃了 2 个。盘子里还剩几个桃？", "answer": "5 − 2 = 3（个）", "reasoning": ["一共 5 个，吃掉的 2 个要去掉。", "去掉用减法：5 − 2 = 3（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u1.008"], "contentVersion": "sha256:b01de91219d02728270ea98421d97034ccda304b181f5a6417dbe05f8ec4b52b"}, {"id": "p1a-u1-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小兔拔了 4 个萝卜，全都吃完了。小兔还剩几个萝卜？列算式算一算。", "answer": "4 − 4 = 0（个）", "reasoning": ["一共 4 个，吃完了就是 4 个都去掉。", "一个也没有了，用 0 表示：4 − 4 = 0（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u1.010", "pyps.p1a.u1.009"], "contentVersion": "sha256:abce73b5b6069e916d67d8961c3b8d92b796abd478e28dd24bbb54849ab23206"}], "contentVersion": "sha256:581c6bc29ef375c5b3bb3bbd8f2a3aa5081c729cfd1bfe50fcf1815611e08f32"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
