<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二年级下册 第二单元 数量间的乘除关系 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p2b-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>二年级下册 第二单元 数量间的乘除关系 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p2b-u2-test", "sectionId": "p2b-u2-test", "unitId": "p2b-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "二年级下册 第二单元 数量间的乘除关系 单元测评", "items": [{"id": "p2b-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "有 3 朵红花、12 朵黄花。把 3 朵红花看作 1 份，黄花有这样的几份？黄花的朵数是红花的几倍？", "answer": "4 份，4 倍", "reasoning": ["3 朵、3 朵地圈黄花：3、6、9、12，圈了 4 次。", "黄花有 4 个 3 朵，所以是红花的 4 倍。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u2.001"], "contentVersion": "sha256:4fce9a1a085874afdf10788e5c64ad62e6445ac895809d26438eafaa2e5b9ea6"}, {"id": "p2b-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "小猫有 5 只，小狗有 15 只。小狗的只数是小猫的几倍？", "answer": "3 倍", "reasoning": ["求 15 里有几个 5，用除法：15 ÷ 5。", "想三五十五，15 ÷ 5 = 3，小狗是小猫的 3 倍。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u2.002"], "contentVersion": "sha256:9352aa5238cc255e00c440d7e00a58d4baaa9fca3796b333492bc0a702c645d5"}, {"id": "p2b-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "小明有 4 本故事书，小红的故事书是小明的 3 倍。小红有几本？", "answer": "12 本", "reasoning": ["求 4 的 3 倍，就是 3 个 4。", "4 × 3 = 12（本）。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u2.003"], "contentVersion": "sha256:1facf21d2c168ad54c275dd57a3d4809591019b568903c6074826e11adf678f0"}, {"id": "p2b-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "果园里苹果树有 24 棵，是梨树的 6 倍。梨树有几棵？", "answer": "4 棵", "reasoning": ["苹果树是梨树的 6 倍，就是 24 里有 6 个梨树那么多。", "24 ÷ 6 = 4（棵），想四六二十四。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u2.004"], "contentVersion": "sha256:e842495bb596af6bed5d97cf6f50467a6bb7febc1f1ca01f557979d48bdaa98f"}, {"id": "p2b-u2-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "36 是 9 的几倍？", "answer": "4 倍", "reasoning": ["求 36 里有几个 9，用除法：36 ÷ 9。", "想四九三十六，36 ÷ 9 = 4。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u2.002"], "contentVersion": "sha256:f317e665202b8b82e93f5f5486e0658641b9cd46c36f7d08633a193b7e9b4e7f"}, {"id": "p2b-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "「5 的 3 倍」和「比 5 多 3」分别是多少？", "answer": "5 的 3 倍是 15，比 5 多 3 是 8", "reasoning": ["5 的 3 倍是 3 个 5：5 × 3 = 15。", "比 5 多 3：5 + 3 = 8。"], "options": [{"id": "a", "text": "都是 8", "feedback": "比 5 多 3 是 8，可 5 的 3 倍是 3 个 5。"}, {"id": "b", "text": "都是 15", "feedback": "5 的 3 倍是 15，可比 5 多 3 是 5 + 3。"}, {"id": "c", "text": "5 的 3 倍是 15，比 5 多 3 是 8", "feedback": "对。5 的 3 倍用乘法 5 × 3，比 5 多 3 用加法 5 + 3。"}], "correct": "c", "pointIds": ["pyps.p2b.u2.003"], "contentVersion": "sha256:d253970bdc4a04d19b7307c1783ae3f2217f5f7a9d208f8fc37643d62bb14f12"}, {"id": "p2b-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一根红绳长 18 米，是一根绿绳长度的 3 倍。绿绳长几米？", "answer": "6 米", "reasoning": ["红绳是绿绳的 3 倍，红绳里有 3 个绿绳那么长。", "18 ÷ 3 = 6（米），想三六十八。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u2.004"], "contentVersion": "sha256:281fe52a9f4fa17506fee16487560df55b8f64fe02928ad38945e588b74c574f"}, {"id": "p2b-u2-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "小兰折了 6 只纸鹤，小军折的是小兰的 2 倍，小芳折的比小军少 5 只。(1) 小军折了几只？(2) 小芳折了几只？", "answer": "(1) 12 只　(2) 7 只", "reasoning": ["(1) 小军：6 的 2 倍，6 × 2 = 12（只）。", "(2) 小芳比小军少 5 只：12 − 5 = 7（只）。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u2.005"], "contentVersion": "sha256:34b70296c12d3b296e6c5078d72f865ff2cec8632f983bc9deb28382ca8b043d"}, {"id": "p2b-u2-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "院子里有 4 只鸡，鸭的只数是鸡的 3 倍。(1) 鸭有几只？(2) 鸡和鸭一共几只？", "answer": "(1) 12 只　(2) 16 只", "reasoning": ["(1) 鸭：4 的 3 倍，4 × 3 = 12（只）。", "(2) 一共：12 + 4 = 16（只）。"], "options": [], "correct": null, "pointIds": ["pyps.p2b.u2.005"], "contentVersion": "sha256:cd2f72b409f1de6f9bf785cdf14900ced1cb576e014213b64534c3f35ec4298a"}, {"id": "p2b-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "「学校买了 8 个篮球，________，足球有几个？」补上哪个条件，就能算出足球有几个？", "answer": "足球的个数是篮球的 2 倍", "reasoning": ["要算足球的个数，补上的条件要说出足球和篮球的数量关系。", "补上「足球是篮球的 2 倍」，足球有 8 × 2 = 16（个）。"], "options": [{"id": "a", "text": "篮球是红色的", "feedback": "篮球的颜色和足球的个数没有关系。"}, {"id": "b", "text": "足球的个数是篮球的 2 倍", "feedback": "对。足球是 8 的 2 倍：8 × 2 = 16（个）。"}, {"id": "c", "text": "足球比篮球多", "feedback": "没说多几个，算不出足球有几个。"}], "correct": "b", "pointIds": ["pyps.p2b.u2.006", "pyps.p2b.u2.003"], "contentVersion": "sha256:3a40813e9522faad80b010ead7ce4ca7e905a7dfc5d211c60ceff1c772f0427f"}], "contentVersion": "sha256:1933f41463db24d03995d1a0bbb5fc79f5d54c48578823ff4c7afce8e61adee1"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
