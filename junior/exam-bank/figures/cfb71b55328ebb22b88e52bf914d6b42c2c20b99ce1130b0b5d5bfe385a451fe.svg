<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 515" role="img"><title>吉林第19题图</title><desc>矩形ABCD中AB=6cm、AD=3cm，A、B在上方，D、C在下方；P从A沿AB、BC向C运动，连接DP，图中P位于AB上并将三角形ADP涂阴影；下方另有同一矩形的备用图。</desc><style>:root{color:#173b40}@media(prefers-color-scheme:dark){:root{color:#e5eeeb}}line,path,polygon,polyline,circle,rect{stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:"Times New Roman","Songti SC",serif}</style><polygon points="50,50 290,50 290,170 50,170" fill="none"/><text x="35" y="40" font-size="20">A</text><text x="292" y="40" font-size="20">B</text><text x="292" y="194" font-size="20">C</text><text x="34" y="194" font-size="20">D</text><polygon points="50,50 130,50 50,170" fill="currentColor" fill-opacity="0.22"/><text x="122" y="40" font-size="20">P</text><polygon points="50,300 290,300 290,420 50,420" fill="none"/><text x="35" y="290" font-size="20">A</text><text x="292" y="290" font-size="20">B</text><text x="292" y="444" font-size="20">C</text><text x="34" y="444" font-size="20">D</text><text x="130" y="480" font-size="20">备用图</text></svg>
