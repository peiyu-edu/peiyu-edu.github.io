<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc"><title id="title">阅读时长扇形统计图</title><desc id="desc">一个圆被分成五个扇形，依次标 A、B、C、D、E；B 标 20%，E 标 n%。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.5}.s{fill:currentColor;fill-opacity:.15;stroke:none}.f{fill:currentColor;stroke:none}.g{fill:currentColor;fill-opacity:.55;stroke:currentColor}.th{stroke-width:1}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><circle cx="120" cy="120" r="100" /><path d="M120.00,120.00L220.00,120.00" /><path d="M120.00,120.00L150.90,215.11" /><path d="M120.00,120.00L45.69,53.09" /><path d="M120.00,120.00L130.45,20.55" /><path d="M120.00,120.00L186.91,45.69" /><text x="180.29" y="98.16" text-anchor="middle" font-size="16">A</text><text x="168.54" y="149.27" text-anchor="middle" font-size="16">B</text><text x="168.54" y="168.27" text-anchor="middle" font-size="15">20%</text><text x="73.87" y="154.96" text-anchor="middle" font-size="16">C</text><text x="96.71" y="64.32" text-anchor="middle" font-size="16">D</text><text x="148.47" y="50.05" text-anchor="middle" font-size="16">E</text><text x="148.47" y="69.05" text-anchor="middle" font-size="15">n%</text></svg>