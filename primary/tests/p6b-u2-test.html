<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年级下册 第二单元 百分数（二） 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p6b-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>六年级下册 第二单元 百分数（二） 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p6b-u2-test", "sectionId": "p6b-u2-test", "unitId": "p6b-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "六年级下册 第二单元 百分数（二） 单元测评", "items": [{"id": "p6b-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "「今年小麦比去年增产二成。」这里的「二成」是多少？", "answer": "20%", "reasoning": ["几成就是十分之几，也就是百分之几十。", "二成 = 20%。"], "options": [{"id": "a", "text": "20%", "feedback": "对。几成就是百分之几十，二成就是 20%。"}, {"id": "b", "text": "2%", "feedback": "一成是 10%，二成是 20%，不是 2%。"}, {"id": "c", "text": "200%", "feedback": "二成是十分之二，不是 2 倍。"}], "correct": "a", "pointIds": ["pyps.p6b.u2.001"], "contentVersion": "sha256:2130a1a6935458deeb88ff11fe17260a893c4baa4c7bbe3e30e74afef1431cc0"}, {"id": "p6b-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一双运动鞋原价 200 元，打七五折出售。现价是多少元？", "answer": "200 × 75% = 150（元）", "reasoning": ["七五折就是按原价的 75% 出售。", "200 × 75% = 150（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u2.002"], "contentVersion": "sha256:5c32f0ed0ad5235397ac4e33ece8cc62a95cc019df1cc0730d6e3bc6d6ab25b1"}, {"id": "p6b-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一家商店本月营业额是 50 万元，按营业额的 3% 缴纳税款。这家商店本月要缴纳税款多少万元？", "answer": "50 × 3% = 1.5（万元）", "reasoning": ["应纳税额 = 营业额 × 税率。", "50 × 3% = 1.5（万元）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u2.004"], "contentVersion": "sha256:6fc45b31214cdccea75218e388ae566e8df3600971ed47a5ab98274f4f195575"}, {"id": "p6b-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "李叔叔把 2000 元存入银行，存期 3 年，年利率是 2.75%。到期时一共能取回多少元？", "answer": "2000 + 2000 × 2.75% × 3 = 2165（元）", "reasoning": ["利息 = 本金 × 利率 × 存期 = 2000 × 2.75% × 3 = 165（元）。", "本息和 = 本金 + 利息 = 2000 + 165 = 2165（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u2.005"], "contentVersion": "sha256:f22d5314e70bd2746e97237e210b89ac0c70ed422a39959f0355f08c08aa5233"}, {"id": "p6b-u2-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一件外套打八折后卖 240 元。这件外套原价多少元？", "answer": "240 ÷ 80% = 300（元）", "reasoning": ["原价是单位「1」，还不知道。", "八折就是现价是原价的 80%。", "240 ÷ 80% = 300（元）。检验：300 × 80% = 240，对。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u2.002"], "contentVersion": "sha256:ef5425c4a8cafda563de9ccd66274bcea85a62225588adecf7d9a977519a83f8"}, {"id": "p6b-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "某工厂去年生产零件 500 吨，今年比去年减产一成五。今年生产零件多少吨？", "answer": "500 ×（1 − 15%）= 425（吨）", "reasoning": ["一成五就是 15%，以去年的产量为单位「1」。", "今年是去年的 1 − 15% = 85%。", "500 × 85% = 425（吨）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u2.003"], "contentVersion": "sha256:22a37bb5d3a46097feb0705477b3d2eee8703e22a8fb7c993b16a8493dbfe885"}, {"id": "p6b-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一台电风扇原价 400 元，打九折出售。买这台电风扇比原价便宜多少元？", "answer": "40 元", "reasoning": ["九折就是按原价的 90% 出售，便宜了 1 − 90% = 10%。", "400 × 10% = 40（元）。也可以 400 − 400 × 90% = 400 − 360 = 40（元）。"], "options": [{"id": "a", "text": "90 元", "feedback": "九折不是便宜 90 元，是按原价的 90% 卖。"}, {"id": "b", "text": "40 元", "feedback": "对。九折便宜了原价的 10%，400 × 10% = 40（元）。"}, {"id": "c", "text": "360 元", "feedback": "360 元是现价，问的是便宜了多少。"}], "correct": "b", "pointIds": ["pyps.p6b.u2.002"], "contentVersion": "sha256:e776a36d66611fff772b9abc56d564803fd00d31392c12ba3bcab3ded434bea6"}, {"id": "p6b-u2-t08", "number": 8, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "同一种商品原价都是 250 元。甲店打八折；乙店「每满 100 元减 20 元」。买一件这种商品，在哪家店付的钱少？", "answer": "甲店", "reasoning": ["都算成实际要付多少钱再比较。", "甲店：250 × 80% = 200（元）。", "乙店：250 元里有 2 个 100 元，减 2 × 20 = 40（元），付 250 − 40 = 210（元）。", "200 < 210，在甲店付的钱少。"], "options": [{"id": "a", "text": "乙店", "feedback": "250 元里只有 2 个满 100 元，只减 40 元，付 210 元，比甲店多。"}, {"id": "b", "text": "一样多", "feedback": "都算成实际付的钱：甲店 200 元，乙店 210 元，不一样。"}, {"id": "c", "text": "甲店", "feedback": "对。甲店付 250 × 80% = 200（元），乙店付 250 − 40 = 210（元）。"}], "correct": "c", "pointIds": ["pyps.p6b.u2.006"], "contentVersion": "sha256:013b6ccf734f3efbc85c05b5024d11a1d6684803cee98c2ab81ef1c70676ffaf"}, {"id": "p6b-u2-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "王叔叔把 10000 元存入银行，存期 2 年，年利率是 2.25%。他想到期后用本息和买一台 10500 元的电脑，钱够吗？", "answer": "不够，还差 50 元", "reasoning": ["利息：10000 × 2.25% × 2 = 450（元）。", "本息和：10000 + 450 = 10450（元）。", "10450 < 10500，不够，还差 10500 − 10450 = 50（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u2.005"], "contentVersion": "sha256:a2b147961d0befadeb4672163f13e5a6ed67fa8bb79fc4d7b96460f925a0a4b7"}, {"id": "p6b-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "某果园今年产苹果 104 吨，比去年增产三成。去年产苹果多少吨？", "answer": "104 ÷（1 + 30%）= 80（吨）", "reasoning": ["增产三成，以去年的产量为单位「1」，去年的还不知道。", "今年是去年的 1 + 30% = 130%。", "104 ÷ 130% = 80（吨）。检验：80 × 130% = 104，对。"], "options": [], "correct": null, "pointIds": ["pyps.p6b.u2.003", "pyps.p6b.u2.001"], "contentVersion": "sha256:d15b4e2c17fe9d7536f65fdead055a98595ed90bd40563cc1b0ab968ec75bf0a"}], "contentVersion": "sha256:0fd01808fac5dd36e1a1e36447ac86cd8ce84251c764c692d03d0b08aff730fa"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
