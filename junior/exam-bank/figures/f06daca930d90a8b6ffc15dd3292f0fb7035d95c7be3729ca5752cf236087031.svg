<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 325" role="img"><title>四川巴中第17题图</title><desc>平行四边形ABCD中O为AC中点，过O的直线交AD于E、交BC于F，连接AF、CE，图中还画出AC；第（2）问给定EF⊥AC、BC=AC、∠B=70°。</desc><style>:root{color:#173b40}@media(prefers-color-scheme:dark){:root{color:#e5eeeb}}line,path,polygon,polyline,circle,rect{stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:"Times New Roman","Songti SC",serif}</style><polygon points="110,90 50,270 290,270 350,90" fill="none"/><line x1="110" y1="90" x2="290" y2="270"/><line x1="270" y1="90" x2="130" y2="270"/><line x1="110" y1="90" x2="130" y2="270"/><line x1="290" y1="270" x2="270" y2="90"/><text x="96" y="76" font-size="20">A</text><text x="28" y="292" font-size="20">B</text><text x="297" y="293" font-size="20">C</text><text x="356" y="76" font-size="20">D</text><text x="263" y="76" font-size="20">E</text><text x="123" y="297" font-size="20">F</text><text x="217" y="188" font-size="20">O</text></svg>
