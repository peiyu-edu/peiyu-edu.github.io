<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 265" width="560" height="265" role="img" aria-labelledby="title desc">
<title id="title">矩形与对角线</title>
<desc id="desc">矩形 ABCD，A、D 在上，B、C 在下。画出对角线 AC，O 在 AC 上，连接 BO。M 在上边 AD 的中点处，连接 MO。</desc>
<style>text { fill:#17202a; font-size:30px; } .i { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .n { font-family:'Times New Roman',Georgia,serif; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect x="0" y="0" width="560" height="265" fill="white"/>
<polyline points="55.0,50.0 505.0,50.0 505.0,238.0 55.0,238.0 55.0,50.0" fill="none" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/><line x1="55.0" y1="50.0" x2="505.0" y2="238.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><line x1="55.0" y1="238.0" x2="280.0" y2="144.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><line x1="280.0" y1="50.0" x2="280.0" y2="144.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><text class="i" x="28" y="58" text-anchor="middle">A</text><text class="i" x="533" y="58" text-anchor="middle">D</text><text class="i" x="28" y="250" text-anchor="middle">B</text><text class="i" x="533" y="250" text-anchor="middle">C</text><text class="i" x="280" y="30" text-anchor="middle">M</text><text class="i" x="280" y="196" text-anchor="middle">O</text>
</svg>
