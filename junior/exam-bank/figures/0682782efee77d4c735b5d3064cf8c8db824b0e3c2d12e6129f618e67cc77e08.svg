<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 85" role="img" aria-labelledby="title desc"><title id="title">公路旁六处住宅与学校</title><desc id="desc">一条东西向公路，自西向东依次标出点A1至A6，之后是一段虚线，再到学校。</desc><style>path,polyline,line,circle{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.dash{stroke-dasharray:6 5}.thin{stroke-width:1.5}.dot{fill:currentColor}.fill{fill:currentColor;fill-opacity:.15}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M10.0,40.0L470.0,40.0"/><path d="M470.0,40.0L560.0,40.0" class="dash"/><path d="M560.0,40.0L640.0,40.0"/><circle cx="40" cy="40" r="4" class="dot"/><text x="40.0" y="72.0" text-anchor="middle" font-size="20" font-style="italic">A<tspan font-size="13" dy="5" font-style="normal">1</tspan></text><circle cx="120" cy="40" r="4" class="dot"/><text x="120.0" y="72.0" text-anchor="middle" font-size="20" font-style="italic">A<tspan font-size="13" dy="5" font-style="normal">2</tspan></text><circle cx="200" cy="40" r="4" class="dot"/><text x="200.0" y="72.0" text-anchor="middle" font-size="20" font-style="italic">A<tspan font-size="13" dy="5" font-style="normal">3</tspan></text><circle cx="280" cy="40" r="4" class="dot"/><text x="280.0" y="72.0" text-anchor="middle" font-size="20" font-style="italic">A<tspan font-size="13" dy="5" font-style="normal">4</tspan></text><circle cx="360" cy="40" r="4" class="dot"/><text x="360.0" y="72.0" text-anchor="middle" font-size="20" font-style="italic">A<tspan font-size="13" dy="5" font-style="normal">5</tspan></text><circle cx="440" cy="40" r="4" class="dot"/><text x="440.0" y="72.0" text-anchor="middle" font-size="20" font-style="italic">A<tspan font-size="13" dy="5" font-style="normal">6</tspan></text><circle cx="600" cy="40" r="4" class="dot"/><text x="600.0" y="72.0" text-anchor="middle" font-size="20">学校</text></svg>
