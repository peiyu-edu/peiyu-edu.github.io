<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级下册 第四单元 图形的面积 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p3b-u4-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级下册 第四单元 图形的面积 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3b-u4-test", "sectionId": "p3b-u4-test", "unitId": "p3b-u4", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级下册 第四单元 图形的面积 单元测评", "items": [{"id": "p3b-u4-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一张邮票的面积大约是 4（　）。括号里填哪个单位最合适？", "answer": "平方厘米", "reasoning": ["1 平方厘米差不多是指甲盖那么大。", "邮票大约有 4 个指甲盖那么大，所以填平方厘米。"], "options": [{"id": "a", "text": "平方厘米", "feedback": "对。邮票很小，用平方厘米。"}, {"id": "b", "text": "平方分米", "feedback": "1 平方分米差不多有手掌那么大，4 个那么大的邮票太大了。"}, {"id": "c", "text": "平方米", "feedback": "4 平方米比一张床还大，太大了。"}], "correct": "a", "pointIds": ["pyps.p3b.u4.002"], "contentVersion": "sha256:d5c77a685eb333a291828798c85b51a7c489c89f94995a1ba3edee88a76f93c3"}, {"id": "p3b-u4-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个长方形，长 9 厘米，宽 6 厘米。它的面积是多少？", "answer": "9 × 6 = 54（平方厘米）", "reasoning": ["长方形的面积 = 长 × 宽。", "9 × 6 = 54（平方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003"], "contentVersion": "sha256:bb2390db82d0a289de0b38551fede8fc008c293c886d6fc178cb1904312dc847"}, {"id": "p3b-u4-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个正方形，边长 8 米。它的面积是多少？", "answer": "8 × 8 = 64（平方米）", "reasoning": ["正方形的面积 = 边长 × 边长。", "8 × 8 = 64（平方米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003"], "contentVersion": "sha256:32d72bc413fc3ec5b66a07235e94c204ad82302c0c5760f128902a9117f0ae01"}, {"id": "p3b-u4-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "图形甲正好铺满 12 个同样大的小方格，图形乙正好铺满 10 个这样的小方格。哪个图形的面积大？", "answer": "甲大", "reasoning": ["用同样大的小方格比面积，看谁占的格子多。", "甲 12 格，乙 10 格，12 > 10，甲的面积大。"], "options": [{"id": "a", "text": "一样大", "feedback": "12 格和 10 格不一样多。"}, {"id": "b", "text": "乙大", "feedback": "乙只有 10 格，比甲的 12 格少。"}, {"id": "c", "text": "甲大", "feedback": "对。小方格一样大，甲占的格子多，面积大。"}], "correct": "c", "pointIds": ["pyps.p3b.u4.001"], "contentVersion": "sha256:2f68209c5bd2e330b9184cdafd1bbf2c29de57d68cad8f829a387088c0d9708d"}, {"id": "p3b-u4-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "填空：3 平方米 = □ 平方分米；500 平方厘米 = □ 平方分米", "answer": "300；5", "reasoning": ["1 平方米 = 100 平方分米，3 平方米 = 300 平方分米。", "100 平方厘米 = 1 平方分米，500 平方厘米里有 5 个 100 平方厘米，是 5 平方分米。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.004"], "contentVersion": "sha256:35f0e5231f832fc185c0610e315603584b6577dfa94ccf35516b6c9773614b9e"}, {"id": "p3b-u4-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个正方形边长 4 厘米。关于它的周长和面积，下面哪句话对？", "answer": "周长 16 厘米，面积 16 平方厘米，两个量不能比大小", "reasoning": ["周长：4 × 4 = 16（厘米）。面积：4 × 4 = 16（平方厘米）。", "周长是长度，面积是面的大小，单位不同，不能比大小。"], "options": [{"id": "a", "text": "周长 16 厘米，面积 16 平方厘米，两个量不能比大小", "feedback": "对。周长是长度，面积是面的大小，单位不同，不能比。"}, {"id": "b", "text": "周长和面积相等", "feedback": "数相同，但一个是厘米、一个是平方厘米，意思不一样，不能说相等。"}, {"id": "c", "text": "面积比周长大", "feedback": "周长和面积不是同一种量，不能比大小。"}], "correct": "a", "pointIds": ["pyps.p3b.u4.003", "pyps.p3b.u4.002", "pyps.p3b.u3.003"], "contentVersion": "sha256:a9a1677dfea6aaeae2eb80e71fb601db816a57c6a8f1c591dbd89727663b2ca6"}, {"id": "p3b-u4-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个长方形的面积是 48 平方厘米，长是 8 厘米。它的宽是多少厘米？", "answer": "6 厘米", "reasoning": ["面积 = 长 × 宽，8 × 宽 = 48。", "想六八四十八，宽是 6 厘米。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003"], "contentVersion": "sha256:4595777272e2a064acc7f2c94c7774bf440afece2a696f985fea4609d3c0499c"}, {"id": "p3b-u4-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪个换算是对的？", "answer": "1 平方分米 = 100 平方厘米", "reasoning": ["1 平方分米是边长 1 分米的正方形，边长也就是 10 厘米。", "面积是 10 × 10 = 100（平方厘米）。"], "options": [{"id": "a", "text": "1 平方米 = 10 平方分米", "feedback": "边长 1 米 = 10 分米，面积是 10 × 10 = 100 平方分米。"}, {"id": "b", "text": "1 平方分米 = 10 平方厘米", "feedback": "长度单位差 10，面积单位差 100。"}, {"id": "c", "text": "1 平方分米 = 100 平方厘米", "feedback": "对。边长 1 分米就是 10 厘米，10 × 10 = 100。"}], "correct": "c", "pointIds": ["pyps.p3b.u4.004"], "contentVersion": "sha256:7c7b6206f0f0bd4a33cc5626d43a4f8df331acec3a102f062370db1d83b3bd56"}, {"id": "p3b-u4-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一块长方形菜地，长 15 米，宽 6 米。它的面积和周长各是多少？", "answer": "面积 90 平方米，周长 42 米", "reasoning": ["面积：15 × 6 = 90（平方米）。", "周长：(15 + 6) × 2 = 42（米）。", "面积用平方米，周长用米，别把单位写混。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003", "pyps.p3b.u3.003"], "contentVersion": "sha256:802a7e5c58768f27060c273f2889788aa55ad4a75e40ee98ca350623ddc0f114"}, {"id": "p3b-u4-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "用边长 2 分米的正方形方砖，铺一块长 8 分米、宽 6 分米的长方形地面。正好要多少块？", "answer": "12 块", "reasoning": ["沿长边一排能铺 8 ÷ 2，是 4 块；沿宽边能铺 6 ÷ 2，是 3 排。", "4 × 3 = 12（块）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003", "pyps.p3b.u4.001"], "contentVersion": "sha256:c02927058bebe78cdf0f894922c447ca1e19787d519ce67911f1f54fd135f979"}, {"id": "p3b-u4-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一张长方形纸，长 9 厘米，宽 5 厘米。从中剪下一个最大的正方形，剩下部分的面积是多少？", "answer": "20 平方厘米", "reasoning": ["最大的正方形边长和宽一样，是 5 厘米，面积 5 × 5 = 25（平方厘米）。", "整张纸面积 9 × 5 = 45（平方厘米）。", "剩下：45 − 25 = 20（平方厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u4.003"], "contentVersion": "sha256:6faeb40643e0d99adf8ebc970c3ffe7ff6f9c57bd5a4c3b0e423a1b5df15c07f"}], "contentVersion": "sha256:6fb4ea343206230a9cf5a378120e729e98d90b16fee47f383be1dede5233ddfb"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
