<title id="title">等边三角形按规律排列的前 3 个图形</title>
<desc id="desc">三个由等边三角形组成的图形。第 1 个连接大等边三角形三边的中点，分成 4 个小等边三角形。第 2 个把第 1 个中三个角上的小三角形各按同样方法再分一次，中间倒立的不分。第 3 个再把第 2 个中 9 个最小的、角上的三角形各分一次。</desc>
