<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 235" role="img"><title>直角曲尺与平行线</title><desc>直角曲尺的直角顶点A和端点B分别位于平行直线a、b上，图中标有∠1和∠2，∠1为127°。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><line x1="35" y1="70" x2="320" y2="70" class=""></line><line x1="35" y1="142.216" x2="320" y2="142.216" class=""></line><polygon points="160,70 255.836,142.216 245.6054,155.7922 149.7694,83.5762" class="shade"></polygon><polygon points="160,70 75.748,181.804 89.3242,192.0346 173.5762,80.2306" class=""></polygon><text x="155" y="53">A</text><text x="265" y="181">B</text><text x="337" y="77">a</text><text x="337" y="150">b</text><text x="90" y="133">1</text><text x="207" y="94">2</text></svg>
