<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 290" width="580" height="290" role="img" aria-labelledby="title desc">
<title id="title">三角形平移后的图形</title>
<desc id="desc">点 B、E、C、F 依次在一条水平直线上，点 A、D 在直线上方且 AD 与直线平行。图中实线有 AB、BF、FD、DA，以及 AC、DE，AC 与 DE 相交。</desc>
<style>text{fill:#17202a;font-family:'PingFang SC','Noto Sans CJK SC',sans-serif;font-size:28px;}.m{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:32px;}.n{font-family:'Times New Roman',Georgia,serif;font-size:30px;}.h{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round;}</style>
<rect width="580" height="290" fill="white"/>
<polyline points="286.0,50.0 34.0,240.0 546.0,240.0 486.0,50.0 286.0,50.0" fill="none" stroke="#17202a" stroke-width="3" stroke-linejoin="round"/>
<line x1="286.0" y1="50.0" x2="346.0" y2="240.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<line x1="486.0" y1="50.0" x2="234.0" y2="240.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/>
<text x="286.0" y="38.0" text-anchor="middle" class="m">A</text>
<text x="486.0" y="38.0" text-anchor="middle" class="m">D</text>
<text x="34.0" y="276.0" text-anchor="middle" class="m">B</text>
<text x="234.0" y="276.0" text-anchor="middle" class="m">E</text>
<text x="346.0" y="276.0" text-anchor="middle" class="m">C</text>
<text x="546.0" y="276.0" text-anchor="middle" class="m">F</text>
</svg>
