<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>六年级上册 第三单元 分数除法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p6a-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>六年级上册 第三单元 分数除法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p6a-u3-test", "sectionId": "p6a-u3-test", "unitId": "p6a-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "六年级上册 第三单元 分数除法 单元测评", "items": [{"id": "p6a-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "5/8 的倒数是 □，6 的倒数是 □。", "answer": "8/5；1/6", "reasoning": ["乘积是 1 的两个数互为倒数。", "5/8 × 8/5 = 1，5/8 的倒数是 8/5。", "6 看成 6/1，倒数是 1/6。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u3.001", "pyps.p6a.u3.002"], "contentVersion": "sha256:988d1f6f52a877ee51dc23207b488249e22903ff9da478743bf7068df6242fc0"}, {"id": "p6a-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪句话是对的？", "answer": "1 的倒数是 1", "reasoning": ["1 × 1 = 1，所以 1 的倒数是 1。", "0 没有倒数；0.5 的倒数是 2。"], "options": [{"id": "a", "text": "0.5 的倒数是 5", "feedback": "0.5 = 1/2，倒数是 2。0.5 × 5 = 2.5，不是 1。"}, {"id": "b", "text": "0 的倒数是 0", "feedback": "0 乘任何数都得 0，得不到 1，所以 0 没有倒数。"}, {"id": "c", "text": "1 的倒数是 1", "feedback": "对。1 × 1 = 1。"}], "correct": "c", "pointIds": ["pyps.p6a.u3.002"], "contentVersion": "sha256:3a4bc17500e393d3b0fc466293fab5640be37034186a6cf04342a1660d4ecb5e"}, {"id": "p6a-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "6/7 ÷ 3 = □", "answer": "2/7", "reasoning": ["除以 3 等于乘 3 的倒数 1/3。", "6/7 × 1/3 = 2/7。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u3.003"], "contentVersion": "sha256:cde274a2131d02f52c3be839609150ba0d8187d019d65af7b9870b84a9f45a45"}, {"id": "p6a-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "4/9 ÷ 2/3 = □", "answer": "2/3", "reasoning": ["除以 2/3 等于乘它的倒数 3/2。", "4/9 × 3/2：4 和 2 约分，3 和 9 约分。", "2/3 × 1/1 = 2/3。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u3.004"], "contentVersion": "sha256:66b48c76023d0b3fdfefec13f0646edab90fb93215efa8f4cc1c3bb67b3f2ff2"}, {"id": "p6a-u3-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "不计算，下面哪个算式的商大于 3/5？", "answer": "3/5 ÷ 3/4", "reasoning": ["一个正数除以大于 0 且小于 1 的数，商比这个正数大。", "3/4 < 1，所以 3/5 ÷ 3/4 > 3/5。"], "options": [{"id": "a", "text": "3/5 ÷ 3/4", "feedback": "对。3/4 比 1 小，除以它，商比 3/5 大。"}, {"id": "b", "text": "3/5 ÷ 1", "feedback": "除以 1，商等于 3/5，不是大于。"}, {"id": "c", "text": "3/5 ÷ 2", "feedback": "除以比 1 大的数，商比 3/5 小。"}], "correct": "a", "pointIds": ["pyps.p6a.u3.005"], "contentVersion": "sha256:47f706119fed2c6c06a0f32e4cf412ef4f98d3e8b16bdb66577d5688991ccc38"}, {"id": "p6a-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "5/6 ÷ 5/12 × 3/4 = □", "answer": "3/2", "reasoning": ["只有乘除，从左往右算。", "5/6 ÷ 5/12 = 5/6 × 12/5 = 2。", "2 × 3/4 = 3/2。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u3.004", "pyps.p6a.u2.006"], "contentVersion": "sha256:a126753416325ed3ed47afc947a9d5d19f55d39ef533ac0ea4bb6bfc2a25a57f"}, {"id": "p6a-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "小明看一本故事书，已经看了 60 页，正好是全书的 2/5。这本书一共有多少页？", "answer": "60 ÷ 2/5 = 150（页）", "reasoning": ["全书页数是单位「1」，它的 2/5 是 60 页。", "求单位「1」，用除法：60 ÷ 2/5 = 60 × 5/2 = 150（页）。", "检验：150 × 2/5 = 60，对。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u3.006"], "contentVersion": "sha256:0b8d04ce02e75b4740287a5a97df4c7e85da3b73f923ed3fbbda32438395b883"}, {"id": "p6a-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "某校男生有 240 人，正好是女生人数的 4/5。女生有多少人？", "answer": "300 人", "reasoning": ["「是女生人数的 4/5」，女生人数是单位「1」，还不知道。", "240 ÷ 4/5 = 240 × 5/4 = 300（人）。"], "options": [{"id": "a", "text": "60 人", "feedback": "240 ÷ 4 = 60 只是女生人数的 1/5，还要乘 5。"}, {"id": "b", "text": "300 人", "feedback": "对。女生人数是单位「1」，240 ÷ 4/5 = 300（人）。"}, {"id": "c", "text": "192 人", "feedback": "这是 240 × 4/5。单位「1」是女生人数，还不知道，要用除法。"}], "correct": "b", "pointIds": ["pyps.p6a.u3.006"], "contentVersion": "sha256:6be5457dba4132b5e48c4d30d6a9e0d9381704dff533e33fe78b598e8801f9a4"}, {"id": "p6a-u3-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一项工程，甲队单独做 10 天完成，乙队单独做 15 天完成。两队合做，几天能完成？", "answer": "1 ÷（1/10 + 1/15）= 6（天）", "reasoning": ["把整项工程看成 1。甲队每天做 1/10，乙队每天做 1/15。", "两队每天一共做 1/10 + 1/15 = 3/30 + 2/30 = 1/6。", "合做时间 = 1 ÷ 1/6 = 6（天）。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u3.008", "pyps.p6a.u3.007"], "contentVersion": "sha256:4d5194e51b2bff25b92d175e9630b438375227bff3872fdb233955eb0ad00eba"}, {"id": "p6a-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "修一条路，甲队单独修 12 天修完，乙队单独修 6 天修完。两队合修 2 天后，还剩这条路的几分之几没修？", "answer": "1 −（1/12 + 1/6）× 2 = 1/2", "reasoning": ["把这条路看成 1。两队每天一共修 1/12 + 1/6 = 1/12 + 2/12 = 1/4。", "合修 2 天修了 1/4 × 2，得 1/2。", "还剩 1 − 1/2 = 1/2。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u3.008", "pyps.p6a.u3.007"], "contentVersion": "sha256:c760f21fe125c2b2bc58489beeb7ccd6b0a4625007eebe114ae53475657671e7"}, {"id": "p6a-u3-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一件衬衫现价 120 元，比原价便宜了 1/5。这件衬衫原价多少元？", "answer": "120 ÷（1 − 1/5）= 150（元）", "reasoning": ["比原价便宜 1/5，原价是单位「1」，还不知道。", "现价是原价的 1 − 1/5 = 4/5，也就是原价的 4/5 是 120 元。", "120 ÷ 4/5 = 150（元）。检验：150 × 4/5 = 120，对。"], "options": [], "correct": null, "pointIds": ["pyps.p6a.u3.006", "pyps.p6a.u2.009"], "contentVersion": "sha256:fe3d70aa33ec3e05ce61def53234ae588ed635640a75b232700265e791c3e919"}], "contentVersion": "sha256:a0f76749064321fecca69622aeab1f89b050ba3de643d220d3f1637c03a3e0f5"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
