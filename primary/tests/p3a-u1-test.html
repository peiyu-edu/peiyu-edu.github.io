<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级上册 第一单元 观察物体 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p3a-u1-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级上册 第一单元 观察物体 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3a-u1-test", "sectionId": "p3a-u1-test", "unitId": "p3a-u1", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级上册 第一单元 观察物体 单元测评", "items": [{"id": "p3a-u1-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "桌上放着一个皮球。从前面、上面、左面看这个球，看到的形状是怎样的？", "answer": "都是圆", "reasoning": ["球圆圆的，没有平的面，也没有尖角。", "不管从前面、上面还是左面看，看到的都是圆。"], "options": [{"id": "a", "text": "都是圆", "feedback": "对。球从哪个方向看都是圆。"}, {"id": "b", "text": "前面看是圆，上面看是正方形", "feedback": "球没有平平的面，从上面看也是圆。"}, {"id": "c", "text": "三个方向看到的都不一样", "feedback": "球很特别，从哪个方向看都一样，都是圆。"}], "correct": "a", "pointIds": ["pyps.p3a.u1.001"], "contentVersion": "sha256:f7edc5ba311aeb6f6b2f3cd7cdffea2f989abec5222011fa6c9af11d8a2002a2"}, {"id": "p3a-u1-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一个圆柱形的茶叶罐竖着放在桌上。从正上面往下看，看到的是什么形状？", "answer": "圆", "reasoning": ["茶叶罐竖着放，最上面是圆形的盖子。", "从正上面往下看，看到的就是这个圆。"], "options": [{"id": "a", "text": "三角形", "feedback": "圆柱上没有三角形的面。"}, {"id": "b", "text": "长方形", "feedback": "从前面看才是长方形，从上面往下看是圆。"}, {"id": "c", "text": "圆", "feedback": "对。竖着放的圆柱，上面是一个圆形的盖子。"}], "correct": "c", "pointIds": ["pyps.p3a.u1.001"], "contentVersion": "sha256:2b5e851fb36fa962f31bf3be33103175aafca734102861efbcd85768fd3bc05e"}, {"id": "p3a-u1-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一辆玩具汽车放在桌上，车头正对着小明。小明看到的是这辆汽车的哪一面？", "answer": "前面", "reasoning": ["车头就是汽车的前面。", "车头对着小明，所以小明看到的是汽车的前面。"], "options": [{"id": "a", "text": "前面", "feedback": "对。车头朝着小明，小明看到的是车的前面。"}, {"id": "b", "text": "后面", "feedback": "车尾朝着小明时才看到后面。"}, {"id": "c", "text": "左面", "feedback": "车的左面在车身的一侧，车头朝着小明时看不到正侧面。"}], "correct": "a", "pointIds": ["pyps.p3a.u1.002"], "contentVersion": "sha256:bb5abec4087d32bf5b779869ddd9765b280c9b18b536871ccc8f89dbe57b9c54"}, {"id": "p3a-u1-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "一个正方体的 6 个面上分别写着 1、2、3、4、5、6。1 的对面是 6，2 的对面是 5。3 的对面是几？", "answer": "4", "reasoning": ["正方体有 6 个面，分成 3 组相对的面。", "1 和 6 是一组，2 和 5 是一组，剩下的 3 和 4 就是一组。", "所以 3 的对面是 4。"], "options": [{"id": "a", "text": "1", "feedback": "1 的对面已经是 6 了。"}, {"id": "b", "text": "4", "feedback": "对。三组相对的面已经有两组，剩下的 3 和 4 是一组。"}, {"id": "c", "text": "2", "feedback": "2 的对面已经是 5 了。"}], "correct": "b", "pointIds": ["pyps.p3a.u1.004"], "contentVersion": "sha256:ede6747a49cb6d1caeaa4aa0d6a5342a98bab87c0af4d0d5c7cf91cb66af2e65"}, {"id": "p3a-u1-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "一个积木，只从前面看，看到的是一个正方形。这个积木可能是什么？", "answer": "可能是正方体，也可能是长方体", "reasoning": ["只看一个面，不能一下子确定是什么积木。", "正方体从前面看是正方形；两头是正方形的长方体，从那一头看也是正方形。", "所以它可能是正方体，也可能是长方体。"], "options": [{"id": "a", "text": "只能是正方体", "feedback": "有的长方体两头的面是正方形，从那一头看也是正方形。"}, {"id": "b", "text": "一定是球", "feedback": "球从哪里看都是圆，不会是正方形。"}, {"id": "c", "text": "可能是正方体，也可能是长方体", "feedback": "对。正方体的面是正方形，有的长方体也有正方形的面。"}], "correct": "c", "pointIds": ["pyps.p3a.u1.003"], "contentVersion": "sha256:d8fdd08d48974dbc081f5a079c5cb472127651b1c8ffa72bca3e9fbcfc57b65b"}, {"id": "p3a-u1-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个正方体，每组相对的两个面上的数加起来都是 7。它的上面是 2，前面是 4。下面和后面各是几？", "answer": "下面是 5，后面是 3", "reasoning": ["下面是上面的对面：7 − 2 = 5。", "后面是前面的对面：7 − 4 = 3。"], "options": [], "correct": null, "pointIds": ["pyps.p3a.u1.004"], "contentVersion": "sha256:2acb614c72f2189c95baaa70ec549a08d528e03faa6e111b9a563ad58050d633"}, {"id": "p3a-u1-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "把一个长方体纸盒沿着边剪开，摊平成一整片。下面哪两个面在展开图里一定不挨在一起？", "answer": "上面和下面", "reasoning": ["长方体的 6 个面分成 3 组相对的面：前和后、上和下、左和右。", "相对的两个面在纸盒上不挨着，展开后中间也隔着别的面。", "上面和下面是一组相对的面，所以一定不挨在一起。"], "options": [{"id": "a", "text": "前面和右面", "feedback": "前面和右面在纸盒上是挨着的，展开后可以连在一起。"}, {"id": "b", "text": "上面和前面", "feedback": "上面和前面在纸盒上本来就挨着，展开后可以连在一起。"}, {"id": "c", "text": "上面和下面", "feedback": "对。上面和下面是一组相对的面，展开后中间隔着别的面。"}], "correct": "c", "pointIds": ["pyps.p3a.u1.005"], "contentVersion": "sha256:1033346be2a7db88235a9631b880e80c1a779e4e0cfa551c45ff0cf24c96d025"}, {"id": "p3a-u1-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "把 6 个同样大的正方形排成一长条（一行 6 个），能折成一个正方体吗？", "answer": "不能，折起来会有面叠在一起，还会缺面", "reasoning": ["正方体前、右、后、左 4 个面能围成一圈。", "一行 6 个正方形，围一圈用掉 4 个，第 5、6 个会叠在第 1、2 个上面。", "上面和下面没有正方形去盖，所以折不成正方体。"], "options": [{"id": "a", "text": "能", "feedback": "折一折试试：一长条围一圈后，后面两个面叠在前面上，正方体的上、下两面没有。"}, {"id": "b", "text": "不能，折起来会有面叠在一起，还会缺面", "feedback": "对。一行 6 个，围一圈只要 4 个，多出来的会叠住，上下两面却没有。"}, {"id": "c", "text": "只能折成长方体", "feedback": "6 个同样大的正方形排成一行，什么盒子都折不成。"}], "correct": "b", "pointIds": ["pyps.p3a.u1.006"], "contentVersion": "sha256:f619d619cacc358962967540b093a5c931fea265cb816dc376af74f2473d4f56"}, {"id": "p3a-u1-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "6 个同样大的正方形摆成这样：中间一行 4 个，从左到右写着 A、B、C、D；A 的上面接着一个 E，D 的下面接着一个 F。把它折成正方体，和 A 相对的是哪个面？", "answer": "C", "reasoning": ["中间一行 A、B、C、D 4 个面折起来围成一圈。", "围成一圈后，隔着一个面的两个面是相对的：A 和 C 相对，B 和 D 相对。", "E 和 F 一个盖在上面、一个盖在下面，它们俩相对。"], "options": [{"id": "a", "text": "B", "feedback": "B 和 A 挨在一起，折起来是相邻的面。"}, {"id": "b", "text": "C", "feedback": "对。中间一行 4 个面围成一圈，隔着一个面的 A 和 C 相对。"}, {"id": "c", "text": "E", "feedback": "E 和 A 挨着，折起来 E 是盖在顶上的，和 A 相邻。"}], "correct": "b", "pointIds": ["pyps.p3a.u1.006", "pyps.p3a.u1.004", "pyps.p3a.u1.005"], "contentVersion": "sha256:a26234a04b511fc5be98e0d5353e823ece02f1fd14965bb01f13e2d2b728704a"}, {"id": "p3a-u1-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "桌上放着一个积木。从前面看是长方形，从正上面看是圆。下面哪个选项符合这两个条件？", "answer": "竖着放的圆柱", "reasoning": ["在给出的选项中，从上面看是圆的有圆柱和球。", "再看前面：球从前面看是圆，圆柱竖着放时从前面看是长方形。", "两个方向合起来，在给出的选项中，只有竖着放的圆柱符合。"], "options": [{"id": "a", "text": "竖着放的圆柱", "feedback": "对。竖着的圆柱，前面看是长方形，上面看是圆。"}, {"id": "b", "text": "正方体", "feedback": "正方体从上面看是正方形，不是圆。"}, {"id": "c", "text": "球", "feedback": "球从前面看也是圆，不是长方形。"}], "correct": "a", "pointIds": ["pyps.p3a.u1.003", "pyps.p3a.u1.001"], "contentVersion": "sha256:4d8b782fbb39a67a6e8d31acf63bf575bc84d8e1d53c79fdd6381bfe27f56a47"}], "contentVersion": "sha256:f9b085a79c1dcd579a868cdeeafac657f4031e1aa79327ccfa9f3de1011e3d36"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
