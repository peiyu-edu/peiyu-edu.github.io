<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img" aria-labelledby="title desc"><title id="title">销售额与销量的关系图象</title><desc id="desc">横轴为销量（千克），纵轴为销售额（元）。折线从原点到横坐标100、纵坐标300的点，再较平缓地上升到纵坐标450的终点；两个拐点处有到坐标轴的虚线，终点的横坐标没有标出。</desc><style>path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}.ax{stroke-width:1.5}.dash{stroke-width:1.2;stroke-dasharray:5 4}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path class="ax" d="M40,230L330,230M322,225L330,230L322,235M70,255L70,25M65,33L70,25L75,33"/><path class="dash" d="M70,110.0L180.0,110.0L180.0,230M70,50.0L273.5,50.0L273.5,230"/><path d="M70.0,230.0L180.0,110.0L273.5,50.0"/><text x="64" y="116.0" font-size="16" text-anchor="end">300</text><text x="64" y="56.0" font-size="16" text-anchor="end">450</text><text x="62" y="250" font-size="16" text-anchor="end">0</text><text x="180.0" y="250" font-size="16" text-anchor="middle">100</text><text x="78" y="30" font-size="16">销售额/元</text><text x="290" y="258" font-size="16">销量/千克</text></svg>
