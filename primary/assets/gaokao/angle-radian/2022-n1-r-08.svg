<svg xmlns="http://www.w3.org/2000/svg" width="500" height="370" viewBox="0 0 500 370" role="img" aria-labelledby="title desc">
  <title id="title">圆弧、弦与弓高示意图</title>
  <desc id="desc">O为圆心，A、B为小弧的端点，C为弦AB中点，D为弧上使CD垂直AB的点。图形按数学条件自行绘制。</desc>
  <rect width="500" height="370" rx="12" fill="#fff"/>
  <g fill="none" stroke="#253b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 160 154.115427 A 180 180 0 0 1 340 154.115427"/>
    <path d="M 160 154.115427 L 250 310 L 340 154.115427 Z"/>
    <path d="M 250 130 L 250 154.115427"/>
    <path d="M 250 143.115427 L 261 143.115427 L 261 154.115427" stroke-width="2"/>
  </g>
  <g fill="#253b47" font-family="Georgia,'Times New Roman',serif" font-size="30" font-style="italic">
    <text x="132" y="165" text-anchor="end">A</text>
    <text x="355" y="165">B</text>
    <text x="250" y="195" text-anchor="middle">C</text>
    <text x="250" y="108" text-anchor="middle">D</text>
    <text x="250" y="352" text-anchor="middle">O</text>
  </g>
</svg>
