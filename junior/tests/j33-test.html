<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 33 章 锐角三角函数 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j33-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 33 章 锐角三角函数 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j33-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j33-test", "sectionId": "j33-test", "chapterId": "j33", "title": "第 33 章 锐角三角函数 · 章末测验", "label": "章末测验", "sections": ["j33-1", "j33-2"], "items": [{"id": "j33-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j33-1"], "pointIds": ["pyjh.trig.002", "pyjh.pyth.003"], "prompt": "在直角三角形 $ABC$ 中，$\\angle C=90^\\circ$，$AC=24$，$BC=7$。$\\cos B$ 的值是（　）。", "options": [{"id": "a", "text": "$\\dfrac{24}{25}$", "feedback": "先圈出所讨论的角，余弦的分子应是这个角的邻直角边。"}, {"id": "b", "text": "$\\dfrac7{25}$", "feedback": "斜边由两条直角边用勾股定理求出。"}, {"id": "c", "text": "$\\dfrac{25}{7}$", "feedback": "锐角的余弦应小于 1，请检查分子分母的位置。"}, {"id": "d", "text": "$\\dfrac7{24}$", "feedback": "余弦的分母是斜边，不能用另一条直角边。"}], "correct": "b", "answer": "$\\dfrac7{25}$", "reasoning": ["$AB=\\sqrt{24^2+7^2}=25$。", "对 $\\angle B$，邻直角边为 $BC$，所以 $\\cos B=\\dfrac{BC}{AB}=\\dfrac7{25}$。"], "contentVersion": "sha256:9281feb3bc6ec681fff43810f98f686da7fee50beb7279429013a09bdaf1851a"}, {"id": "j33-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j33-1"], "pointIds": ["pyjh.trig.004"], "prompt": "计算 $2\\sin30^\\circ+\\tan45^\\circ-\\cos60^\\circ$，结果是（　）。", "options": [{"id": "a", "text": "$\\dfrac12$", "feedback": "检查正切项是否被遗漏。"}, {"id": "b", "text": "$2$", "feedback": "检查最后一个余弦项是否被遗漏。"}, {"id": "c", "text": "$\\dfrac32$", "feedback": "先分别代入特殊角的值，再按运算顺序计算。"}, {"id": "d", "text": "$1$", "feedback": "检查减去的余弦值，不能把角的大小直接当函数值。"}], "correct": "c", "answer": "$\\dfrac32$", "reasoning": ["由特殊直角三角形得 $\\sin30^\\circ=\\dfrac12$、$\\tan45^\\circ=1$、$\\cos60^\\circ=\\dfrac12$。", "原式 $=2\\times\\dfrac12+1-\\dfrac12=\\dfrac32$。"], "contentVersion": "sha256:5f153260bd4a529ec9038e715ef0d72ff8db8748e1336f18bf80a19f5db67005"}, {"id": "j33-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j33-1"], "pointIds": ["pyjh.trig.001", "pyjh.trig.003", "pyjh.trig.004"], "prompt": "直角三角形的两个锐角为 $A$、$B$。把三边同时放大为原来的 $3$ 倍，记对应锐角为 $A\\prime$、$B\\prime$。下列说法一定正确的是（　）。", "options": [{"id": "a", "text": "$\\sin A\\prime=3\\sin A$", "feedback": "放大时，比值的分子、分母会同时变化。"}, {"id": "b", "text": "对每个这样的三角形，都有 $0<\\tan A<1$", "feedback": "正切是两条直角边之比，大小顺序并没有固定。"}, {"id": "c", "text": "$\\sin(2A)=2\\sin A$（当 $2A$ 仍为锐角时）", "feedback": "用一组特殊角检验角度翻倍的说法，注意函数值不随角度成比例。"}, {"id": "d", "text": "$\\sin A\\prime=\\sin A=\\cos B$，且这个比值在 $0$ 与 $1$ 之间", "feedback": "对应边成比例，且两个锐角互余。"}], "correct": "d", "answer": "$\\sin A\\prime=\\sin A=\\cos B$，且这个比值在 $0$ 与 $1$ 之间", "reasoning": ["三边同乘 $3$，对应锐角不变，$\\dfrac{3a}{3c}=\\dfrac ac$，故 $\\sin A\\prime=\\sin A$。", "两个锐角互余，$A$ 的对边也是 $B$ 的邻直角边，所以 $\\sin A=\\cos B$；正的直角边小于斜边，故比值严格在 $0$ 与 $1$ 之间。", "正切可以大于或等于 $1$；当 $A=30^\\circ$ 时，$\\sin60^\\circ=\\dfrac{\\sqrt3}2\\ne2\\sin30^\\circ$。"], "contentVersion": "sha256:d5c53155ae10584e984bb7ca685b05b6836a6e3e2d4e4c47cda51e0a09b244a1"}, {"id": "j33-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j33-1"], "pointIds": ["pyjh.trig.006"], "prompt": "测角仪采用角度制（DEG）。已知锐角 $\\alpha$ 满足 $\\tan\\alpha=0.6494$。已算得 $\\tan32^\\circ\\approx0.6249$，$\\tan33^\\circ\\approx0.6494$，$\\tan34^\\circ\\approx0.6745$。利用这些读数，$\\alpha$ 取最接近的整数度数约为（　）。", "options": [{"id": "a", "text": "$33^\\circ$", "feedback": "将已知的比值与给出的角度制读数对应。"}, {"id": "b", "text": "$32^\\circ$", "feedback": "检查这一角度的读数与目标比值之间的差距。"}, {"id": "c", "text": "$34^\\circ$", "feedback": "检查这一角度的读数与目标比值之间的差距。"}, {"id": "d", "text": "$57^\\circ$", "feedback": "求出的应是正切值对应的角，不要直接换成它的余角。"}], "correct": "a", "answer": "$33^\\circ$", "reasoning": ["给出的角度制读数中，$33^\\circ$ 的正切值与 $0.6494$ 对应。", "锐角的正切随角度增大而增大；由值反求角并取最接近的整数度数，得 $\\alpha\\approx33^\\circ$。这不是精确等式。"], "contentVersion": "sha256:fb80dac9807049cf63a601babc636ba3df7685e7d3a12f352ff23831f7938e50"}, {"id": "j33-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j33-2"], "pointIds": ["pyjh.trig.007"], "prompt": "规定 $\\angle C=90^\\circ$。下列哪组额外条件能确定一个确实存在的直角三角形 $ABC$ 的所有边长与锐角（允许图形翻转）？", "options": [{"id": "a", "text": "$\\angle A=38^\\circ$，$\\angle B=52^\\circ$", "feedback": "只有角度时，边长仍可同时放大或缩小。"}, {"id": "b", "text": "$AB=8\\,\\mathrm{cm}$，$AC=10\\,\\mathrm{cm}$", "feedback": "先辨认斜边，再检查斜边是否比直角边长。"}, {"id": "c", "text": "$AC=11\\,\\mathrm{cm}$，$\\angle A=60^\\circ$", "feedback": "一条正的边和一个锐角能确定三边及另一锐角。"}, {"id": "d", "text": "只知道 $AB=14\\,\\mathrm{cm}$", "feedback": "仅一条边不能排除不同形状的直角三角形。"}], "correct": "c", "answer": "$AC=11\\,\\mathrm{cm}$，$\\angle A=60^\\circ$", "reasoning": ["选项 c 中，$\\angle B=30^\\circ$，$AB=\\dfrac{11}{\\cos60^\\circ}=22\\,\\mathrm{cm}$，$BC=11\\tan60^\\circ=11\\sqrt3\\,\\mathrm{cm}$。三边满足勾股定理。", "a 只有两个角，大小不定；b 中斜边比直角边短，三角形不存在；d 只有斜边，锐角仍可变化。"], "contentVersion": "sha256:3d5d203e40cd18b68a9b9f88a9f0e2c1e4e35cbc26dff5401c81af6ee16cae57"}, {"id": "j33-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j33-1"], "pointIds": ["pyjh.trig.005"], "prompt": "锐角 $A$ 满足 $\\sin A=\\dfrac8{17}$。不使用额外的三角恒等式，构造直角三角形并求 $\\tan A$，结果是（　）。", "options": [{"id": "a", "text": "$\\dfrac{15}{17}$", "feedback": "这是邻边与斜边的比，请再核对正切定义。"}, {"id": "b", "text": "$\\dfrac8{15}$", "feedback": "可把对边与斜边分别设为 8k、17k，再补第三边。"}, {"id": "c", "text": "$\\dfrac{15}{8}$", "feedback": "请检查正切的分子是对边还是邻边。"}, {"id": "d", "text": "$\\dfrac89$", "feedback": "第三边不能用斜边减对边求出。"}], "correct": "b", "answer": "$\\dfrac8{15}$", "reasoning": ["设对边 $8k$、斜边 $17k$，其中 $k>0$。", "由勾股定理，邻直角边为 $\\sqrt{(17k)^2-(8k)^2}=15k$。", "$\\tan A=\\dfrac{8k}{15k}=\\dfrac8{15}$，用到的只是定义与勾股定理。"], "contentVersion": "sha256:eecd4756b9fe25a03fc764a60f994cbc9b40f439f29021867d8306f2ab1b8e5f"}, {"id": "j33-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j33-2"], "pointIds": ["pyjh.trig.009"], "prompt": "一根竖直测量杆顶端为 $T$，底端为 $O$，杆高 $27\\,\\mathrm m$。地面点 $P$ 与 $O$ 在同一水平地面上。从 $T$ 向下看 $P$，视线 $TP$ 与向下的竖直射线 $TO$ 成 $30^\\circ$。水平距离 $OP$ 为（　）。", "options": [{"id": "a", "text": "$27\\sqrt3\\,\\mathrm m$", "feedback": "题给角从竖直方向量起，不能直接把它当成俯角。"}, {"id": "b", "text": "$54\\,\\mathrm m$", "feedback": "请分清水平距离与沿视线的距离。"}, {"id": "c", "text": "$18\\sqrt3\\,\\mathrm m$", "feedback": "这个长度对应沿视线的距离，题目问的是水平距离。"}, {"id": "d", "text": "$9\\sqrt3\\,\\mathrm m$", "feedback": "先标出顶端处的角，再用两条直角边的比。"}], "correct": "d", "answer": "$9\\sqrt3\\,\\mathrm m$", "reasoning": ["$TO\\perp OP$，$\\angle OTP=30^\\circ$。俯角是视线与水平线的夹角，实际为 $60^\\circ$。", "在直角三角形 $TOP$ 中，$\\tan30^\\circ=\\dfrac{OP}{TO}$，故 $OP=27\\times\\dfrac{\\sqrt3}3=9\\sqrt3\\,\\mathrm m$。", "核验：从 $P$ 看 $T$ 的仰角为 $60^\\circ$，$OP=27/\\tan60^\\circ$，结果相同。"], "contentVersion": "sha256:35a92b4f62f484765a57f8e90e9b6861de4629cea17f5b12680dae1e091d6546"}, {"id": "j33-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j33-2"], "pointIds": ["pyjh.trig.010"], "prompt": "在水平地图上，补给站 $P$ 位于观测点 $O$ 的北偏东 $30^\\circ$ 方向，直线距离 $OP=26\\,\\mathrm{km}$。过 $O$ 作南北方向直线，$P$ 到这条直线的垂直距离为（　）。", "options": [{"id": "a", "text": "$13\\,\\mathrm{km}$", "feedback": "从 P 向南北线作垂线，找出对应的对边与斜边。"}, {"id": "b", "text": "$13\\sqrt3\\,\\mathrm{km}$", "feedback": "这个长度表示向北的分量，并非到南北线的垂直距离。"}, {"id": "c", "text": "$\\dfrac{26\\sqrt3}3\\,\\mathrm{km}$", "feedback": "OP 已经是斜边，不能当成邻直角边。"}, {"id": "d", "text": "$26\\,\\mathrm{km}$", "feedback": "到方向线的垂直距离不是到观测点的直线距离。"}], "correct": "a", "answer": "$13\\,\\mathrm{km}$", "reasoning": ["作 $PQ\\perp$ 过 $O$ 的南北线，垂足为 $Q$。由于北偏东 $30^\\circ$，$Q$ 在 $O$ 正北方且 $\\angle POQ=30^\\circ$。", "$PQ=OP\\sin30^\\circ=26\\times\\dfrac12=13\\,\\mathrm{km}$。"], "contentVersion": "sha256:c736186a252b1c8926fdb3d0faae0edcaca9497be2b6eb3058d7e25e1da2277d"}, {"id": "j33-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j33-2"], "pointIds": ["pyjh.trig.008", "pyjh.trig.009"], "prompt": "竖直旗杆底端为 $O$、顶端为 $T$。仪器位于水平地面上的点 $P$，$PO=23\\,\\mathrm m$；观测中心 $E$ 在 $P$ 正上方 $1.4\\,\\mathrm m$，从 $E$ 看 $T$ 的仰角为 $38^\\circ$。已知 $\\tan38^\\circ\\approx0.7813$，$\\sin38^\\circ\\approx0.6157$。旗杆总高按给定近似值计算并精确到 $0.1\\,\\mathrm m$，约为（　）。", "options": [{"id": "a", "text": "$18.0\\,\\mathrm m$", "feedback": "仰角模型算出的是旗杆顶端高于观测中心的高度，还要回到旗杆总高。"}, {"id": "b", "text": "$15.6\\,\\mathrm m$", "feedback": "水平距离对应邻直角边，不能按斜边选函数。"}, {"id": "c", "text": "$19.4\\,\\mathrm m$", "feedback": "保留中间精度，加上观测中心离地高度，最后取近似。"}, {"id": "d", "text": "$30.8\\,\\mathrm m$", "feedback": "请检查已知水平距离与所求高差之间的正切关系，乘除不要颠倒。"}], "correct": "c", "answer": "$19.4\\,\\mathrm m$", "reasoning": ["过 $E$ 作水平线交旗杆于 $H$，则 $EH=PO=23\\,\\mathrm m$，$OH=1.4\\,\\mathrm m$，且 $EH\\perp HT$。", "$HT=EH\\tan38^\\circ\\approx23\\times0.7813=17.9699\\,\\mathrm m$。", "$OT=OH+HT\\approx19.3699\\,\\mathrm m\\approx19.4\\,\\mathrm m$。中间不先把高差取整。"], "contentVersion": "sha256:39591c1a0abcf2b048000a2531110f68089034a4c2bdc6fa2c3320589921e646"}, {"id": "j33-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j33-1", "j33-2"], "pointIds": ["pyjh.trig.004", "pyjh.trig.012"], "prompt": "在三角形 $ABC$ 中，$AB=18\\,\\mathrm{cm}$，$\\angle A=30^\\circ$，$\\angle B=45^\\circ$。从 $C$ 向 $AB$ 作高 $CD$，垂足为 $D$。$CD$ 的长度为（　）。", "options": [{"id": "a", "text": "$9(\\sqrt3+1)\\,\\mathrm{cm}$", "feedback": "两段底边在原三角形内部，应按相加关系列式。"}, {"id": "b", "text": "$9(\\sqrt3-1)\\,\\mathrm{cm}$", "feedback": "把公共高设为未知量，用两个直角三角形分别表示底边。"}, {"id": "c", "text": "$6\\sqrt3\\,\\mathrm{cm}$", "feedback": "不能把整条底边直接当作其中一个直角三角形的邻边。"}, {"id": "d", "text": "$9\\,\\mathrm{cm}$", "feedback": "整条底边并不是含 30° 角直角三角形的斜边。"}], "correct": "b", "answer": "$9(\\sqrt3-1)\\,\\mathrm{cm}$", "reasoning": ["两个底角均为锐角，垂足 $D$ 位于线段 $AB$ 内。设 $CD=h\\,\\mathrm{cm}$，$h>0$。", "在两个直角三角形中，$AD=\\dfrac h{\\tan30^\\circ}=\\sqrt3h$，$DB=\\dfrac h{\\tan45^\\circ}=h$。", "$AD+DB=18$，故 $h=\\dfrac{18}{\\sqrt3+1}=9(\\sqrt3-1)$。没有在斜三角形中直接使用直角三角函数定义。"], "contentVersion": "sha256:9b698b0122b2846b36c80919b7098a3f56c9743090ec3fca7e2217261773565e"}, {"id": "j33-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j33-1", "j33-2"], "pointIds": ["pyjh.trig.004", "pyjh.trig.009"], "prompt": "竖直信号塔的底端为 $O$、顶端为 $T$。地面观测点 $A$、$B$ 与 $O$ 在同一水平地面的同一直线上，且 $O$ 在线段 $AB$ 内，$AB=36\\,\\mathrm m$。观测位置均按地面点处理，从 $A$、$B$ 看 $T$ 的仰角分别为 $30^\\circ$、$60^\\circ$。塔高为（　）。", "options": [{"id": "a", "text": "$18\\sqrt3\\,\\mathrm m$", "feedback": "塔底在两个观测点之间，两段水平距离应相加，不能相减。"}, {"id": "b", "text": "$12\\sqrt3\\,\\mathrm m$", "feedback": "观测点间距离不能直接当成某一个点到塔底的距离。"}, {"id": "c", "text": "$27\\sqrt3\\,\\mathrm m$", "feedback": "从两个观测点列出的关系必须同时满足同一个塔高。"}, {"id": "d", "text": "$9\\sqrt3\\,\\mathrm m$", "feedback": "设共同塔高，再用水平距离的和列方程。"}], "correct": "d", "answer": "$9\\sqrt3\\,\\mathrm m$", "reasoning": ["设塔高 $OT=h\\,\\mathrm m$，$h>0$。由直角三角形 $AOT$、$BOT$ 得 $AO=\\sqrt3h$，$BO=\\dfrac h{\\sqrt3}$。", "$O$ 在 $AB$ 内，故 $AO+BO=36$，即 $\\left(\\sqrt3+\\dfrac1{\\sqrt3}\\right)h=36$。", "$h=9\\sqrt3\\,\\mathrm m$；回代 $AO=27\\,\\mathrm m$，$BO=9\\,\\mathrm m$，两者均正且和为 $36\\,\\mathrm m$。"], "contentVersion": "sha256:396b3491ed51929d9a62b3b75faca52304b245f5cd7173692326da9cc3914304"}, {"id": "j33-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j33-2"], "pointIds": ["pyjh.trig.011", "pyjh.pyth.003"], "prompt": "一条直坡道的坡度（铅直高度比水平宽度）为 $1:2$，坡面长 $3\\sqrt5\\,\\mathrm m$。现保持铅直高度不变，改建为坡度 $1:4$ 的直坡道。改建后比原来增加的水平宽度、改建后的坡面长依次是（　）。", "options": [{"id": "a", "text": "$6\\,\\mathrm m$，$3\\sqrt{17}\\,\\mathrm m$", "feedback": "先用原坡的直角三角形求高，再把同一高度代入新坡。"}, {"id": "b", "text": "$6\\,\\mathrm m$，$12\\,\\mathrm m$", "feedback": "新坡的水平宽度与坡面长是不同线段，后者是斜边。"}, {"id": "c", "text": "$3\\sqrt5\\,\\mathrm m$，$\\dfrac{3\\sqrt{85}}2\\,\\mathrm m$", "feedback": "原坡度的分母是水平宽度，不能用坡面长替代。"}, {"id": "d", "text": "$9\\,\\mathrm m$，$3\\sqrt{17}\\,\\mathrm m$", "feedback": "要算宽度的增加量，应将新旧水平宽度相减。"}], "correct": "a", "answer": "$6\\,\\mathrm m$，$3\\sqrt{17}\\,\\mathrm m$", "reasoning": ["设原坡高 $h>0$，水平宽度为 $2h$。由 $h^2+(2h)^2=(3\\sqrt5)^2$，得 $5h^2=45$，所以 $h=3\\,\\mathrm m$，原水平宽度 $6\\,\\mathrm m$。", "新坡高仍为 $3\\,\\mathrm m$，坡度为 $1:4$，水平宽度为 $12\\,\\mathrm m$，所以增加 $12-6=6\\,\\mathrm m$。", "新坡面长 $\\sqrt{3^2+12^2}=3\\sqrt{17}\\,\\mathrm m$；新坡更缓，但坡面更长，不能用水平宽度代替坡面长。"], "contentVersion": "sha256:e8ceaad4b8cfc9ad1da4aeaedcb4bfd615cc10481b1bdb02f0b00016eeafc2c2"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
