<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 350" role="img" aria-labelledby="title desc"><title id="title">三角形ABC绕点A旋转得到三角形AB′C′</title><desc id="desc">点A在右上；三角形ABC中B在左下、C在A的下方偏右；三角形AB′C′中B′在左上、C′在B′与A之间偏下。两个三角形共顶点A。</desc><style>path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M281,116L181,317L288,264Z"/><path d="M281,116L63,49L124,143Z"/><text x="298" y="114" font-size="20" text-anchor="middle">A</text><text x="48" y="40" font-size="20" text-anchor="middle">B′</text><text x="118" y="172" font-size="20" text-anchor="middle">C′</text><text x="174" y="342" font-size="20" text-anchor="middle">B</text><text x="306" y="274" font-size="20" text-anchor="middle">C</text></svg>
