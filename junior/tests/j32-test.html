<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 32 章 相似 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="junior" data-sec="j32-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 32 章 相似 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j32-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j32-test", "sectionId": "j32-test", "chapterId": "j32", "title": "第 32 章 相似 · 章末测验", "label": "章末测验", "sections": ["j32-1", "j32-2", "j32-3"], "items": [{"id": "j32-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j32-1"], "pointIds": ["pyjh.sim.002"], "prompt": "四条正长度线段 $a,b,c,d$ 按此顺序成比例，即 $a/b=c/d$。已知 $a=3\\text{ cm}$、$b=8\\text{ cm}$、$c=0.12\\text{ m}$，则 $d$ 为多少？", "options": [{"id": "a", "text": "$0.32\\text{ cm}$", "feedback": "米和厘米不能直接混用，先把已知长度统一单位。"}, {"id": "b", "text": "$4.5\\text{ cm}$", "feedback": "最后一对线段的比不能颠倒，检查交叉相乘的位置。"}, {"id": "c", "text": "$32\\text{ cm}$", "feedback": "同一单位下按给定顺序列比例，交叉乘积相等。"}, {"id": "d", "text": "$17\\text{ cm}$", "feedback": "成比例比较的是倍数，不能把前两条线段的差搬到后两条。"}], "correct": "c", "answer": "$32\\text{ cm}$", "reasoning": ["统一单位：$c=12\\text{ cm}$。", "$3/8=12/d$，所以 $3d=96$，$d=32\\text{ cm}$。", "代回 $12/32=3/8$，正长度条件满足。"], "contentVersion": "sha256:bafc77f05fea02df92c220144ab7ab1ccbdfb5aaa5b379c51d7e3bda2c697059"}, {"id": "j32-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j32-1"], "pointIds": ["pyjh.sim.003", "pyjh.sim.004"], "prompt": "按顶点顺序，四边形 $ABCD$ 与四边形 $RSPQ$ 相似。已知 $AB=7$、$RS=10.5$、$CD=12$，四边形 $ABCD$ 的周长为 $40$（长度单位相同）。$PQ$ 和四边形 $RSPQ$ 的周长依次是多少？", "options": [{"id": "a", "text": "$18,\\ 60$", "feedback": "先按顶点位置确定对应边，周长与对应边按相同倍数变化。"}, {"id": "b", "text": "$8,\\ 80/3$", "feedback": "放大倍数的方向写反了，先看哪一个四边形更大。"}, {"id": "c", "text": "$18,\\ 90$", "feedback": "周长是长度的和，不能像面积那样把相似比平方。"}, {"id": "d", "text": "$15.5,\\ 43.5$", "feedback": "对应边和周长按倍数变化，不能统一加上某条边的差。"}], "correct": "a", "answer": "$18,\\ 60$", "reasoning": ["$A,B,C,D$ 依次对应 $R,S,P,Q$，所以 $CD$ 对应 $PQ$。", "从 $ABCD$ 到 $RSPQ$ 的长度倍数为 $10.5/7=3/2$。", "$PQ=12\\times3/2=18$；周长为 $40\\times3/2=60$。"], "contentVersion": "sha256:1822ee0818571efdfec422d8d5079b44f25fc8da7d08dfb990add3b3ac222576"}, {"id": "j32-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j32-1"], "pointIds": ["pyjh.sim.003"], "prompt": "要找一对相似四边形。下面四组测量记录中，哪一组足以保证两个图形相似？矩形的尺寸均按长、宽记录。", "options": [{"id": "a", "text": "两个矩形的尺寸分别是 $8\\times5$ 和 $12\\times9$", "feedback": "矩形的角虽相等，仍须检查长边与短边的放大倍数是否一致。"}, {"id": "b", "text": "边长分别为 $3$ 和 $6$ 的两个菱形，其中一个内角分别为 $60^\\circ$ 和 $80^\\circ$", "feedback": "菱形的边成比例，还需要对应角相等。"}, {"id": "c", "text": "一个边长为 $4$ 的正方形和一个周长为 $16$、边长为 $5,3$ 的矩形", "feedback": "周长相等不能替代每一组对应边成比例。"}, {"id": "d", "text": "两个矩形的尺寸分别是 $7\\times5$ 和 $14\\times10$", "feedback": "四个直角对应相等，长、宽都按同一个倍数变化。"}], "correct": "d", "answer": "两个矩形的尺寸分别是 $7\\times5$ 和 $14\\times10$", "reasoning": ["矩形相似还需对应边成比例。第四组长边比 $14/7=2$，短边比 $10/5=2$，故相似。", "第一组 $12/8\\ne9/5$；第二组内角集合不同；第三组正方形的邻边比为 $1$，矩形为 $5/3$。"], "contentVersion": "sha256:750f8238b884f79962df9c0f59b5ee66420b31da868dba27c29229d3552ec12e"}, {"id": "j32-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j32-2"], "pointIds": ["pyjh.sim.007"], "prompt": "一个三角形的三边长为 $6,8,10$。下面哪组长度能作为与它相似的三角形的三边长？各组已按从小到大排列。", "options": [{"id": "a", "text": "$9,11,13$", "feedback": "三条边各加同一个数，通常不能使三组比值相等。"}, {"id": "b", "text": "$9,12,15$", "feedback": "三组对应边按同一倍数变化，符合三边成比例的判定。"}, {"id": "c", "text": "$12,16,21$", "feedback": "不能只检查前两条边，第三组对应边的比也须相同。"}, {"id": "d", "text": "$8,10,12$", "feedback": "每边增加同样长度，不代表三组对应边成比例。"}], "correct": "b", "answer": "$9,12,15$", "reasoning": ["按从小到大配对，第二组有 $9/6=12/8=15/10=3/2$，由三边成比例可判相似。", "其余三组至少一组比值不同。四个候选均满足三角形两短边和大于最长边，不能靠不存在来排除。"], "contentVersion": "sha256:2ba1d2fcfbd2dc0bf4f69bd97206debb4ce5dbc2737f2a10105452ebbb572d82"}, {"id": "j32-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j32-3"], "pointIds": ["pyjh.sim.015"], "prompt": "以原点 $O$ 为位似中心，将一个非退化三角形按新图与原图的位似比 $3/2$ 作图，并指定对应点位于 $O$ 的异侧。原顶点 $P(-6,4)$ 的对应点坐标是多少？", "options": [{"id": "a", "text": "$(-9,6)$", "feedback": "这是沿原方向放大的位置，题目指定了异侧。"}, {"id": "b", "text": "$(9,6)$", "feedback": "异侧要求从中心出发反向取点，不能只改变一个坐标的方向。"}, {"id": "c", "text": "$(-4,8/3)$", "feedback": "这把放大改成了缩小，且没有满足异侧要求。"}, {"id": "d", "text": "$(9,-6)$", "feedback": "原点为中心，两个坐标都反向并按给定倍数变化。"}], "correct": "d", "answer": "$(9,-6)$", "reasoning": ["位似比是正的距离比 $3/2$；异侧对应坐标乘以 $-3/2$。", "$P^{\\prime}=((-6)(-3/2),4(-3/2))=(9,-6)$。", "$OP^{\\prime}/OP=3/2$，且两点在过原点的同一直线上、方向相反。"], "contentVersion": "sha256:dd68b9b78d007b3f6948752598873753054d76b3d5c975e008186200dd4baf8c"}, {"id": "j32-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j32-2"], "pointIds": ["pyjh.sim.006", "pyjh.sim.009"], "prompt": "在两个非退化三角形中，$\\angle A=\\angle E$、$\\angle B=\\angle F=90^\\circ$。已知 $AB=9$、$EF=15$。$M$ 是 $AC$ 的中点，$N$ 是 $ED$ 的中点，且 $BM=6$。求中线 $FN$ 的长。", "options": [{"id": "a", "text": "$18/5$", "feedback": "先确认哪一条中线和哪一条中线对应，再检查比的方向。"}, {"id": "b", "text": "$12$", "feedback": "对应长度不是按已知两条边的差增加。"}, {"id": "c", "text": "$10$", "feedback": "两角确定顶点对应，中线和对应边按同一倍数变化。"}, {"id": "d", "text": "$50/3$", "feedback": "中线是长度量，不能用面积的平方倍数。"}], "correct": "c", "answer": "$10$", "reasoning": ["由两角分别相等，$A\\leftrightarrow E$、$B\\leftrightarrow F$、$C\\leftrightarrow D$，得 $\\triangle ABC\\backsim\\triangle EFD$。", "$BM$ 与 $FN$ 是对应中线，第二个三角形与第一个的相似比为 $EF/AB=15/9=5/3$。", "$FN=6\\times5/3=10$。"], "contentVersion": "sha256:f1697f9132a552adb76857045331b77462e818932214bcc120be4f94143d9f24"}, {"id": "j32-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j32-2"], "pointIds": ["pyjh.sim.008"], "prompt": "关于任意两个非退化三角形 $ABC$、$DEF$，下列哪组条件一定能保证按所写顺序有 $\\triangle ABC\\backsim\\triangle DEF$？", "options": [{"id": "a", "text": "$AB/DE=AC/DF$，且 $\\angle B=\\angle E$", "feedback": "相等角不是这两组边的夹角，这组条件可能出现两个不同形状。"}, {"id": "b", "text": "$AB/DE=BC/EF$，且 $\\angle B=\\angle E$", "feedback": "相等角恰是两组成比例边的夹角，可以用相似的两边夹角判定。"}, {"id": "c", "text": "只有 $\\angle A=\\angle D$", "feedback": "一个角不能确定三角形形状，需要核对更多对应条件。"}, {"id": "d", "text": "只有 $AB=DE$、$BC=EF$", "feedback": "两条边相等不能限制两边的夹角，形状仍可变化。"}], "correct": "b", "answer": "$AB/DE=BC/EF$，且 $\\angle B=\\angle E$", "reasoning": ["第二组两边的夹角分别是 $\\angle B$、$\\angle E$，符合两边成比例且夹角相等的判定，对应顺序也一致。", "第一组是非夹角条件，不能作为一般判定；一个角或仅两条边也都不足。", "例如第一组可取 $B=E=(0,0)$、$A=D=(5,0)$、$C=(1,1)$、$F=(4,4)$；$AB=DE=5$、$AC=DF=\\sqrt{17}$，两角同为 $45^\\circ$，但 $BC=\\sqrt2$、$EF=4\\sqrt2$，不相似。"], "contentVersion": "sha256:f988d9ea975fbc674f8893c9c0eb876d5d9405aa21593c78da4d9b61e96b413c"}, {"id": "j32-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j32-2"], "pointIds": ["pyjh.sim.005"], "prompt": "在非退化三角形 $ABC$ 中，$D$ 在 $AB$ 内部，$E$ 在 $AC$ 内部，且 $DE\\parallel BC$。已知 $AD=4$、$DB=6$、$DE=15/2$，则 $BC$ 的长是多少？", "options": [{"id": "a", "text": "$45/4$", "feedback": "分点后的一段不是整条边，相似比不能把部分之比直接代入。"}, {"id": "b", "text": "$3$", "feedback": "检查小三角形与大三角形的比是否写反。"}, {"id": "c", "text": "$27/2$", "feedback": "图形相似比较倍数，不能把另一边的增加量直接加过来。"}, {"id": "d", "text": "$75/4$", "feedback": "平行线保证对应角相等，先求整条边再列对应边比例。"}], "correct": "d", "answer": "$75/4$", "reasoning": ["$AB=AD+DB=10$。由平行可得 $\\triangle ADE\\backsim\\triangle ABC$。", "$DE/BC=AD/AB=4/10=2/5$，所以 $BC=(15/2)\\times5/2=75/4$。", "$0<AD/AB<1$，截出的是小三角形，所得 $BC>DE$。"], "contentVersion": "sha256:96e3b16bcf8d679982ae0a7bc9b6e5ae4921d040ebdbf00fedd14c9bae8aad86"}, {"id": "j32-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j32-3"], "pointIds": ["pyjh.sim.014"], "prompt": "在每格边长为 $1$ 的直角坐标网格中，位似中心是 $T(1,-2)$。原三角形的顶点为 $A(3,1)$、$B(5,-2)$、$C(1,2)$。按新图与原图的位似比 $2$ 作同侧位似图形。$A$ 的对应点坐标是多少？", "options": [{"id": "a", "text": "$(5,4)$", "feedback": "从实际中心出发数横、竖格数，分别加倍后仍从该中心出发。"}, {"id": "b", "text": "$(6,2)$", "feedback": "不能把原点当作中心直接乘坐标，先找从实际中心到顶点的位移。"}, {"id": "c", "text": "$(4,6)$", "feedback": "只算出从中心出发的格数，还没有写成该点的坐标。"}, {"id": "d", "text": "$(-3,-8)$", "feedback": "这是反向取点，题目要求同侧。"}], "correct": "a", "answer": "$(5,4)$", "reasoning": ["从 $T$ 到 $A$ 向右 $2$ 格、向上 $3$ 格。", "加倍后从 $T(1,-2)$ 向右 $4$ 格、向上 $6$ 格，得到 $(5,4)$。", "同样数格可得 $B^{\\prime}(9,-2)$、$C^{\\prime}(1,6)$；三条对应点连线过 $T$，对应边平行或共线。"], "contentVersion": "sha256:95d0cbbf0687ef8767a8e5cba93300aef2dcc7599e535adf44873255eb0ef54b"}, {"id": "j32-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j32-2"], "pointIds": ["pyjh.sim.006", "pyjh.pyth.001"], "prompt": "在直角三角形 $ABC$ 中，$\\angle A=90^\\circ$、$AB=6$、$AC=8$。从 $A$ 向斜边 $BC$ 作垂线，垂足为 $H$。只用本章相似判定及前置知识，求 $BH:HC$。", "options": [{"id": "a", "text": "$3:4$", "feedback": "斜边被垂足分出的两段，不能直接按两条直角边的比取值。"}, {"id": "b", "text": "$16:9$", "feedback": "检查靠近B的一段与哪条直角边对应，避免把前后顺序颠倒。"}, {"id": "c", "text": "$9:16$", "feedback": "用两角相等先证小三角形和原三角形相似，再求两段。"}, {"id": "d", "text": "$9:25$", "feedback": "所求的分母是另一小段，不是整条斜边。"}], "correct": "c", "answer": "$9:16$", "reasoning": ["由勾股定理 $BC=\\sqrt{6^2+8^2}=10$。", "$\\angle BHA=\\angle BAC=90^\\circ$ 且 $\\angle ABH=\\angle ABC$，所以 $\\triangle BHA\\backsim\\triangle BAC$。", "由对应边 $BH/BA=BA/BC$，得 $BH=36/10=18/5$。", "$HC=10-18/5=32/5$，于是 $BH:HC=9:16$。这里是由相似推导，不直接引用射影定理。"], "contentVersion": "sha256:5d1e158ece585932e494274274ec32a6ee0b8d0391e14b9cde104a9fef2fad17"}, {"id": "j32-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j32-2"], "pointIds": ["pyjh.sim.011"], "prompt": "在同一水平地面上，一根竖直标杆高 $1.6\\text{ m}$，一棵树也竖直。某时刻太阳光线可看作平行，两者影子的末端恰为同一点 $S$。沿同一条地面直线，依次为树根 $Q$、杆底 $P$、影端 $S$，且 $QP=7.8\\text{ m}$、$PS=1.2\\text{ m}$。在这一模型下，树高为多少？", "options": [{"id": "a", "text": "$10.4\\text{ m}$", "feedback": "树的影长是树根到影端的全长，不能把两底之间的距离当成影长。"}, {"id": "b", "text": "$12\\text{ m}$", "feedback": "先按点的顺序求完整影长，再利用平行光线构成相似三角形。"}, {"id": "c", "text": "$6.75\\text{ m}$", "feedback": "树高与树影、杆高与杆影要按相同顺序列比。"}, {"id": "d", "text": "$13.6\\text{ m}$", "feedback": "相似计算得到的是树的全高，无需再加上标杆高度。"}], "correct": "b", "answer": "$12\\text{ m}$", "reasoning": ["$QS=QP+PS=7.8+1.2=9\\text{ m}$。", "竖直物体与水平地面构成直角，平行光线给出相等锐角，两测高三角形由两角相等而相似。", "设树高为 $h$，$h/9=1.6/1.2$，解得 $h=12\\text{ m}$。", "这是给定理想化测量模型的结果；不把现实中的近似平行当作无条件严格结论。"], "contentVersion": "sha256:a8aef293ab566b7c573047ef0fc821a07b441126020c47372fada5dd19392633"}, {"id": "j32-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j32-2", "j32-3"], "pointIds": ["pyjh.sim.010", "pyjh.sim.013"], "prompt": "两个非退化三角形 $ABC$ 与 $A^{\\prime}B^{\\prime}C^{\\prime}$ 位似，前者面积为 $20$，后者面积为 $45$。位似中心 $O$ 严格位于一对对应点 $A$、$A^{\\prime}$ 之间，且 $AA^{\\prime}=25$。求 $OA$。", "options": [{"id": "a", "text": "$10$", "feedback": "先把面积比转成正的长度比，再利用异侧时两段相加。"}, {"id": "b", "text": "$15$", "feedback": "所求是原图顶点到中心的距离，需区分两段对应哪一个图形。"}, {"id": "c", "text": "$50$", "feedback": "中心在两点之间时，两段相加为已知全长，不能取差。"}, {"id": "d", "text": "$100/13$", "feedback": "面积比不能直接当长度比，先取正的平方根。"}], "correct": "a", "answer": "$10$", "reasoning": ["后者与前者的面积比为 $45/20=9/4$，故长度比 $OA^{\\prime}/OA=3/2$，取正值。", "$O$ 严格在两点之间，所以 $OA+OA^{\\prime}=25$。", "设 $OA=x>0$，则 $x+(3/2)x=25$，得 $x=10$，$OA^{\\prime}=15$。", "检验两段和为 $25$，距离比为 $3/2$，面积比为其平方。"], "contentVersion": "sha256:f780f30b6a2d6e3b3b0fef1a28616d82f4641bdc96c25bc4f35f57f63670bb93"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习</footer></div></body></html>
