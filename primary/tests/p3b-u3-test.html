<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三年级下册 第三单元 长方形和正方形 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=515d933de1ca"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=64b97d1c8bfc"><script defer src="../assets/learning-state.js?v=683b48c89f09"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=f819c1328a46"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=509ae0e24823"></script></head><body data-stage="primary" data-sec="p3b-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>三年级下册 第三单元 长方形和正方形 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p3b-u3-test", "sectionId": "p3b-u3-test", "unitId": "p3b-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "三年级下册 第三单元 长方形和正方形 单元测评", "items": [{"id": "p3b-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪一句说的是长方形的特点？", "answer": "4 个角都是直角，相对的两条边一样长", "reasoning": ["长方形有 4 条边、4 个角。", "4 个角都是直角，相对的两条边一样长。"], "options": [{"id": "a", "text": "4 个角都是直角，相对的两条边一样长", "feedback": "对。这就是长方形的特点。"}, {"id": "b", "text": "只有 2 个角是直角", "feedback": "长方形的 4 个角都是直角。"}, {"id": "c", "text": "4 条边都一样长，4 个角都是锐角", "feedback": "长方形的 4 个角都是直角，不是锐角。"}], "correct": "a", "pointIds": ["pyps.p3b.u3.001"], "contentVersion": "sha256:c93d5b912ef546ca948ee3889a0dc6d6023e909a5c959aec79bf4883510bc8af"}, {"id": "p3b-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个长方形，长 8 厘米，宽 5 厘米。它的周长是多少厘米？", "answer": "(8 + 5) × 2 = 26（厘米）", "reasoning": ["长方形的周长 = (长 + 宽) × 2。", "8 + 5 = 13（厘米），13 × 2 = 26（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.003"], "contentVersion": "sha256:404f124d139ff205c8198f74747ccd685d9c26d619bdb5cce9f5fe9800ff087b"}, {"id": "p3b-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "一个正方形，边长 7 分米。它的周长是多少分米？", "answer": "7 × 4 = 28（分米）", "reasoning": ["正方形 4 条边一样长。", "周长 = 边长 × 4：7 × 4 = 28（分米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.003"], "contentVersion": "sha256:3c32ababe28570ef6422b47c3d344c7c5ba7b5d2aa53d47bfcecc0869d84ff9a"}, {"id": "p3b-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "什么叫一个图形的周长？", "answer": "围成这个图形一周的边的长度", "reasoning": ["沿着一个图形的边走一圈，走过的长度就是它的周长。", "所有的边都要算上，一条也不能漏。"], "options": [{"id": "a", "text": "围成这个图形一周的边的长度", "feedback": "对。沿着边走一圈的长度就是周长。"}, {"id": "b", "text": "这个图形最长的一条边的长度", "feedback": "周长要把一周所有的边都算上。"}, {"id": "c", "text": "这个图形里面有多大", "feedback": "那是图形的大小，不是周长。"}], "correct": "a", "pointIds": ["pyps.p3b.u3.002"], "contentVersion": "sha256:1a6cb3c97c63c2a7f8e89a3d0d4018e5c104f050159e73bbfc13140d3d88278c"}, {"id": "p3b-u3-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一个长方形的周长是 30 厘米，长是 9 厘米。它的宽是多少厘米？", "answer": "6 厘米", "reasoning": ["周长是 2 个长加 2 个宽，一个长加一个宽是周长的一半：30 ÷ 2 = 15（厘米）。", "宽：15 − 9 = 6（厘米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.003"], "contentVersion": "sha256:309f4578b294d8212a4c56405e092b34b5bd233b6a2f17aa52aec9b273c876dc"}, {"id": "p3b-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "下面哪个图形不是多边形？", "answer": "圆", "reasoning": ["由几条线段围成的封闭图形叫多边形。", "圆的边是弯的曲线，不是线段，所以圆不是多边形。"], "options": [{"id": "a", "text": "圆", "feedback": "对。圆是由曲线围成的，不是由线段围成的。"}, {"id": "b", "text": "长方形", "feedback": "长方形由 4 条线段围成，是四边形，也是多边形。"}, {"id": "c", "text": "五边形", "feedback": "五边形由 5 条线段围成，是多边形。"}], "correct": "a", "pointIds": ["pyps.p3b.u3.001"], "contentVersion": "sha256:78cdbce90fbae4bc86176e706ff164c73e5cde24c4df8b8704f51187b605b2e2"}, {"id": "p3b-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "一块三角形菜地，三条边分别长 12 米、15 米、18 米。沿着菜地围一圈篱笆，篱笆长多少米？", "answer": "45 米", "reasoning": ["围一圈篱笆的长度就是三角形的周长。", "把三条边加起来：12 + 15 + 18 = 45（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.002"], "contentVersion": "sha256:5827f1b58130a80e325cf84935fe6f4345bf05eacd77c9901c2f0b997d324cfa"}, {"id": "p3b-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "用 6 个边长 1 厘米的小正方形拼成一个长方形。怎样拼，长方形的周长最短？", "answer": "拼成 2 行、每行 3 个，周长 10 厘米", "reasoning": ["一行 6 个：长 6 厘米、宽 1 厘米，周长 (6 + 1) × 2 = 14（厘米）。", "两行 3 个：长 3 厘米、宽 2 厘米，周长 (3 + 2) × 2 = 10（厘米）。", "10 厘米更短。"], "options": [{"id": "a", "text": "拼成 1 行、每行 6 个，周长 14 厘米", "feedback": "这样拼又细又长，周长反而长。"}, {"id": "b", "text": "拼成 2 行、每行 3 个，周长 10 厘米", "feedback": "对。拼得越接近正方形，周长越短。"}, {"id": "c", "text": "两种拼法周长一样长", "feedback": "算一算：一种是 10 厘米，一种是 14 厘米，不一样。"}], "correct": "b", "pointIds": ["pyps.p3b.u3.004"], "contentVersion": "sha256:7dfd0340c7528d58b5b56609291cde04c47e7852581b96dbaf6c40c79baac45a"}, {"id": "p3b-u3-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "把两个边长 5 厘米的正方形拼成一个长方形。这个长方形的周长是多少厘米？", "answer": "30 厘米", "reasoning": ["拼成的长方形长 5 + 5 = 10（厘米），宽 5 厘米。", "周长：(10 + 5) × 2 = 30（厘米）。", "拼在一起的那两条边到了里面，不再算在周长里。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.003", "pyps.p3b.u3.002"], "contentVersion": "sha256:0dc6b531e8bdd7a969c6c5004d558efe189bbd72af3a0ac8eb305c31684d4e30"}, {"id": "p3b-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "用 4 个同样的小正方形拼图。每次让两块的整条边完全重合，拼成一个连在一起且不重叠的图形。转一转、翻一翻能重合的算同一种。一共能拼出几种不同形状的四连方？", "answer": "5 种", "reasoning": ["四连方有一字形、田字形、L 形、T 形和 Z 形。", "转一转、翻一翻能重合的算同一种，所以一共 5 种。"], "options": [{"id": "a", "text": "7 种", "feedback": "转一转、翻一翻能重合的只算一种，不能重复数。"}, {"id": "b", "text": "4 种", "feedback": "请按顺序列举：把一字形、田字形、L 形、T 形、Z 形逐个画出，再检查有没有漏掉或重复。"}, {"id": "c", "text": "5 种", "feedback": "对。一字形、田字形、L 形、T 形、Z 形，一共 5 种。"}], "correct": "c", "pointIds": ["pyps.p3b.u3.005"], "contentVersion": "sha256:c403cb8b52cfc2bde60301a539637dac95aef22f09a3e21f32c3dd50081962cc"}, {"id": "p3b-u3-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "用四连方拼一个长 6 格、宽 2 格的长方形，正好要几个四连方？", "answer": "3 个", "reasoning": ["先算长方形一共有多少格：6 × 2 = 12（格）。", "每个四连方占 4 格，12 格里有 3 个 4 格，要 3 个四连方。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.005"], "contentVersion": "sha256:ba6f07e6af42b78cac9b6f29435546c7fb4f9dd09349cf8408f6a23da60b798b"}, {"id": "p3b-u3-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "学校有一个长方形花坛，长 12 米，宽 8 米。一条长边靠着墙，另外三边围上篱笆。篱笆长多少米？", "answer": "28 米", "reasoning": ["靠墙的那条长边不用围。", "要围的是另一条长边和两条宽：12 + 8 + 8 = 28（米）。"], "options": [], "correct": null, "pointIds": ["pyps.p3b.u3.003", "pyps.p3b.u3.002"], "contentVersion": "sha256:1ee232e0034c82b8dd70bca5287b477f55888e0f5a880adb16d8cca72bfd4f2e"}], "contentVersion": "sha256:091d1dcb19c3d75a8a7e7b7272e79c12b11b92d78fd4c722f555d12418ad6de8"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
