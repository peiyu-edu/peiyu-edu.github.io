<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 200" role="img" aria-labelledby="title desc">
<title id="title">题设图</title><desc id="desc">两行六列单位方格，P位于从左数第三条内部竖线与中间横线的交点。</desc>
