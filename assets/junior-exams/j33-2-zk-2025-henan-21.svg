<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 408" width="590" height="408" role="img" aria-labelledby="title desc">
<title id="title">纪念碑测量示意图</title>
<desc id="desc">测量示意图。一条水平地面线上从左到右有点 F、M、D、C。纪念碑 AB 竖直立在有台阶的平台上，B 在平台面上，C 在地面上，A、B、C 在同一竖直线上，BC 为虚线，B 处有直角记号。D 处竖直标杆 DE，M 处观测者 MN，N 为眼睛。虚线 AD 和 EF 分别是纪念碑顶端和标杆顶端的太阳光线；虚线 N、E、A 在一条直线上；N 到 B 有水平虚线。</desc>
