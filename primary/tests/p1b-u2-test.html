<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级下册 第二单元 20以内的退位减法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p1b-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级下册 第二单元 20以内的退位减法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1b-u2-test", "sectionId": "p1b-u2-test", "unitId": "p1b-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级下册 第二单元 20以内的退位减法 单元测评", "items": [{"id": "p1b-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "13 − 9 = □", "answer": "4", "reasoning": ["13 分成 10 和 3。", "10 − 9 = 1，1 + 3 = 4。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u2.001"], "contentVersion": "sha256:3141e12707d6e53cc6930defab52185fe44d9635ff5b9b2d14da3178a02bff7d"}, {"id": "p1b-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "15 − 8 = □", "answer": "7", "reasoning": ["15 分成 10 和 5。", "10 − 8 = 2，2 + 5 = 7。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u2.003"], "contentVersion": "sha256:2f00b6a8154fbf438e835defeb8cf003d701ff19046db1845626fa72f82f8bb6"}, {"id": "p1b-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "12 − 7 = □", "answer": "5", "reasoning": ["想：7 加几等于 12？7 + 5 = 12。", "所以 12 − 7 = 5。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u2.004"], "contentVersion": "sha256:3503ebcc3e3cfdac1d67b5cb28ce3db139752705cb0b5ee2ee2bfa2fa1219926"}, {"id": "p1b-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "11 − 5 = □", "answer": "6", "reasoning": ["想：5 加几等于 11？5 + 6 = 11。", "所以 11 − 5 = 6。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u2.005"], "contentVersion": "sha256:6c33615cb124ae6a1588f8802390923f79c152b0db142ec11dff6eba79605535"}, {"id": "p1b-u2-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "14 − 6 = ？", "answer": "8", "reasoning": ["14 分成 10 和 4。", "10 − 6 = 4，4 + 4 = 8。"], "options": [{"id": "a", "text": "8", "feedback": "对。10 − 6 = 4，4 + 4 = 8。"}, {"id": "b", "text": "7", "feedback": "差了 1。10 − 6 = 4，4 再加个位上的 4 是 8。"}, {"id": "c", "text": "2", "feedback": "不能倒过来用 6 减 4。个位 4 不够减 6，要从 10 里减。"}], "correct": "a", "pointIds": ["pyps.p1b.u2.004"], "contentVersion": "sha256:0fad2632d5d15808e9e2e6b1f5d09d3f73cec056d3b94989ca6bf15d9907a20b"}, {"id": "p1b-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "想：9 + □ = 16，所以 16 − 9 = □。两个 □ 里填的数一样，是几？", "answer": "7", "reasoning": ["9 + 7 = 16。", "所以 16 − 9 = 7，两个 □ 都填 7。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u2.002"], "contentVersion": "sha256:5c748161424f8e62184780c8d6ef705faf5b44edb9b9a243b42a4c6befffe1f6"}, {"id": "p1b-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "12 − 3 = □，12 − 4 = □，12 − 5 = □", "answer": "9，8，7", "reasoning": ["12 − 3：10 − 3 = 7，7 + 2 = 9。", "12 − 4 = 8，12 − 5 = 7。减去的数多 1，得数就少 1。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u2.005"], "contentVersion": "sha256:c1c35ec1a09b1b3db55a7301c4759c022b66664f7ef0fa8476112602f26665e5"}, {"id": "p1b-u2-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "盒子里一共有 13 个球，其中红球 7 个，黄球 6 个。要用一共的个数，分别减去红球、黄球的个数，求出另一种球有几个。应该选哪一组算式？", "answer": "13 − 7 = 6，13 − 6 = 7", "reasoning": ["一共 13 个，去掉 7 个红球，剩下黄球：13 − 7 = 6。", "去掉 6 个黄球，剩下红球：13 − 6 = 7。"], "options": [{"id": "a", "text": "13 − 7 = 5，13 − 6 = 8", "feedback": "两道都算错了。13 − 7 = 6，13 − 6 = 7。"}, {"id": "b", "text": "7 − 6 = 1，13 − 1 = 12", "feedback": "这两道算式和「一共、红球、黄球」的关系对不上。"}, {"id": "c", "text": "13 − 7 = 6，13 − 6 = 7", "feedback": "对。去掉红球剩黄球，去掉黄球剩红球。"}], "correct": "c", "pointIds": ["pyps.p1b.u2.004"], "contentVersion": "sha256:2d220700f693857780fc57ed4c9da1233bcae88d4da02794a0b715a82e581565"}, {"id": "p1b-u2-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "在 ○ 里填 >、< 还是 =？ 17 − 9 ○ 9", "answer": "<", "reasoning": ["先算左边：10 − 9 = 1，1 + 7 = 8。", "8 比 9 小，填 <。"], "options": [{"id": "a", "text": "<", "feedback": "对。17 − 9 = 8，8 比 9 小。"}, {"id": "b", "text": ">", "feedback": "先算左边：17 − 9 = 8，8 比 9 小。"}, {"id": "c", "text": "=", "feedback": "17 − 9 = 8，不等于 9。"}], "correct": "a", "pointIds": ["pyps.p1b.u2.001"], "contentVersion": "sha256:1f85d84702f3be942fadae8639f258fed5749d2e452784fb1410067b01715a53"}, {"id": "p1b-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "花园里有 16 朵花，其中红花有 9 朵，其余是黄花。花丛里还飞着 3 只蝴蝶。黄花有几朵？", "answer": "16 − 9 = 7（朵）", "reasoning": ["问的是黄花，蝴蝶的 3 只用不上。", "一共 16 朵，去掉红花 9 朵，剩下的是黄花：16 − 9 = 7（朵）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u2.006"], "contentVersion": "sha256:64c8386a20f54caef4f231af3dad91f4a65361017572757799bfe11758982204"}, {"id": "p1b-u2-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "亮亮有 12 支铅笔，送给同学一些后，自己还剩 5 支。亮亮送给同学几支？", "answer": "12 − 5 = 7（支）", "reasoning": ["12 支分成两部分：送出的和剩下的 5 支。", "求送出的，用一共减去剩下的：12 − 5 = 7（支）。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u2.006"], "contentVersion": "sha256:7604a81192c0379a003016f0bb57f21bf6acb37d06c287f042f6076d909c5112"}, {"id": "p1b-u2-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "13 − 4 = 9，13 − 5 = □，13 − 6 = □。从上往下看，减去的数多 1，得数就 □ 1（填「多」或「少」）。", "answer": "8，7，少", "reasoning": ["13 − 5 = 8，13 − 6 = 7。", "9、8、7，一个比一个少 1：减去的数多 1，得数就少 1。"], "options": [], "correct": null, "pointIds": ["pyps.p1b.u2.005", "pyps.p1b.u2.004"], "contentVersion": "sha256:f479ba036e110c0cdcd7112979aa01cadc99c34f69baab85fc542e2f3279dcdf"}], "contentVersion": "sha256:0ab29d4272d5c34f156cdfcbdcd39a9e11ea852ee059a75e72f06d9675538e7d"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
