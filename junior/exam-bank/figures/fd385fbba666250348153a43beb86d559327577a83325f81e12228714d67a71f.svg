<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 276" role="img" aria-labelledby="title desc"><title id="title">两人关于记英语单词的对话</title><desc id="desc">男孩：我每天记m个英语单词。女孩：我每天记n个英语单词，你记的比我多。男孩：是呀，我们记七天再比较。女孩：记七天你的总数还是比我多。</desc><style>svg{color:#243d45;background:#fff;--fill:#d5dfdf;--fill2:#a9bcbc;--bg:#fff}path,circle,ellipse,line,polyline,polygon,rect{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}text{fill:currentColor;stroke:none;font-family:Georgia,'Noto Serif CJK SC',serif}.f{fill:var(--fill)}.f2{fill:var(--fill2)}.dot{fill:currentColor}.bg{fill:var(--bg)}.thin{stroke-width:1.4}.dash{stroke-dasharray:6 5}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--fill:#405b62;--fill2:#2b4149;--bg:#15272d}}</style><text x="34.00" y="43.00" text-anchor="middle" font-size="20">男孩</text><rect x="70" y="14" width="220" height="44" rx="10" class="thin"/><text x="84.00" y="43.00" text-anchor="start" font-size="20">我每天记<tspan font-style="italic">m</tspan>个英语单词</text><text x="526.00" y="116.00" text-anchor="middle" font-size="20">女孩</text><rect x="210" y="72" width="280" height="74" rx="10" class="thin"/><text x="224.00" y="101.00" text-anchor="start" font-size="20">我每天记<tspan font-style="italic">n</tspan>个英语单词，</text><text x="224.00" y="131.00" text-anchor="start" font-size="20">你记的比我多</text><text x="34.00" y="189.00" text-anchor="middle" font-size="20">男孩</text><rect x="70" y="160" width="260" height="44" rx="10" class="thin"/><text x="84.00" y="189.00" text-anchor="start" font-size="20">是呀，我们记七天再比较</text><text x="526.00" y="247.00" text-anchor="middle" font-size="20">女孩</text><rect x="210" y="218" width="280" height="44" rx="10" class="thin"/><text x="224.00" y="247.00" text-anchor="start" font-size="20">记七天你的总数还是比我多</text></svg>