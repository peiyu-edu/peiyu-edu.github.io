<h1>教师汇总</h1>
<p class="lead">选择学生在「我的学习」中下载的完整记录，可一次选择多份。处理只在本页内存中进行，不上传、不改变学生原记录。</p>
<section class="card"><label for="teacher-files">导入学生记录（每份不超过2MB）</label>
<input id="teacher-files" type="file" accept="application/json,.json" multiple>
<p class="hint-text">同一份学习记录的多份快照只采用最新一份。旧版记录没有编号时，按姓名合并；同名学生请先区分姓名。共用设备时，请先导出前一人的记录，再清空记录后交给下一人，避免把不同学生混为一人。</p>
<p class="hint-text">做对率以有首次作答记录的题为分母；待自评的首次成绩尚不计为做对。解答题依据学生自评，供教学复盘使用。</p>
<p id="teacher-message" role="status" aria-live="polite"></p>
<button type="button" class="pill" id="teacher-clear">清空本页汇总</button></section>
