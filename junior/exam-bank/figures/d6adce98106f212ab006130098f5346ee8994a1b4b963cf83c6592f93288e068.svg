<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" role="img" aria-labelledby="title desc"><title id="title">圆转化为直角三角形</title><desc id="desc">⊙O 的一条竖直直径下端为 D，圆心 O 处有一点。圆上方靠左有点 A、B，扇形 AOB 涂有阴影。直线 DC 与圆相切于 D，水平向右，其上依次有 M、N、C。连接 OM、ON、OC，△ODC 中 OD⊥DC。</desc><style>path,circle,ellipse,polygon,rect,line{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.2}.s{fill:currentColor;fill-opacity:.2;stroke:currentColor;stroke-width:1.5}.n{fill:currentColor;fill-opacity:.25;stroke:none}.f{fill:currentColor;stroke:none}.w{stroke-width:7;stroke-linecap:butt;stroke-opacity:.55}text{fill:currentColor;stroke:none;font-family:Georgia,'PingFang SC','Noto Sans CJK SC',serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><path d="M84,90L45.82,51.82A54,54 0 0 1 61.18,41.06Z" class="s"/><circle cx="84.00" cy="90.00" r="54.00"/><line x1="84.00" y1="36.00" x2="84.00" y2="144.00"/><line x1="84.00" y1="144.00" x2="423.29" y2="144.00"/><line x1="84.00" y1="90.00" x2="278.40" y2="144.00" class="t"/><line x1="84.00" y1="90.00" x2="297.25" y2="144.00" class="t"/><line x1="84.00" y1="90.00" x2="423.29" y2="144.00"/><circle cx="84.00" cy="90.00" r="3.00" class="f"/><text x="70.00" y="103.00" text-anchor="middle" font-size="16" font-style="italic">O</text><text x="84.00" y="164.00" text-anchor="middle" font-size="16" font-style="italic">D</text><text x="272.40" y="164.00" text-anchor="middle" font-size="16" font-style="italic">M</text><text x="305.25" y="164.00" text-anchor="middle" font-size="16" font-style="italic">N</text><text x="425.29" y="164.00" text-anchor="middle" font-size="16" font-style="italic">C</text><text x="35.82" y="48.82" text-anchor="middle" font-size="16" font-style="italic">A</text><text x="59.18" y="33.06" text-anchor="middle" font-size="16" font-style="italic">B</text></svg>