<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img"><title>三角形及角平分线</title><desc>等腰三角形ABC中，AB与AC均长5，BC长6，D在AB上，CD为∠ACB的角平分线。</desc><style>:root{--ink:#193d44;--paper:#fffdf8;--shade:#c9dce0}@media(prefers-color-scheme:dark){:root{--ink:#e5eeeb;--paper:#15272d;--shade:#47646b}}path,line,polyline,polygon,circle,ellipse,rect{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linejoin:round}text{fill:var(--ink);font:22px "Songti SC",serif;text-anchor:middle}.shade{fill:var(--shade)}.dash{stroke-dasharray:6 5}</style><polygon points="180,50 60,210 300,210" class=""></polygon><line x1="125.455" y1="122.727" x2="300" y2="210" class=""></line><text x="180" y="36">A</text><text x="43" y="229">B</text><text x="317" y="229">C</text><text x="108" y="122">D</text></svg>
