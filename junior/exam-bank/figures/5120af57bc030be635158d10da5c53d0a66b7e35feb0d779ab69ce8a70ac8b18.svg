<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-labelledby="title desc"><title id="title">山高测量示意</title><desc id="desc">左图是山的灰色剖面示意：山脚A，山腰B，山顶C，从B向下、从B向右再从C向下有虚线。右图：水平线上依次有A、F、D三点；AB与水平线夹角为53°，由B向水平线作虚线段BF，BF垂直于水平线；由B作水平虚线BE交CD于E，BC与BE的夹角为45°；CD垂直于水平线。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:7 5}.dot{fill:currentColor;stroke:none}.s{fill:currentColor;fill-opacity:.3;stroke:none}.ss{fill:currentColor;fill-opacity:.3}.b{fill:#fff}.bl{stroke:#fff}.t{stroke-width:9}text{fill:currentColor;stroke:none;font-family:'Times New Roman',Times,'Songti SC','Noto Serif CJK SC',serif;font-size:24px}.bar1{stroke-width:16;stroke-linecap:butt}.bar2{stroke:#fff;stroke-width:12}.i{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}.b{fill:#15272d}.bl{stroke:#15272d}.bar2{stroke:#15272d}}</style><path d="M40,285L118,190C135,180 150,185 165,160C175,140 185,130 190,120C205,105 230,100 235,75C245,62 255,68 265,85C280,110 300,125 325,165C345,190 350,220 360,235L390,285Z" class="ss"/><path d="M118,190L118,285" class="d"/><path d="M118,190L247,190L247,68" class="d"/><text x="30" y="316" text-anchor="middle" class="i">A</text><text x="100" y="186" text-anchor="middle" class="i">B</text><text x="247" y="58" text-anchor="middle" class="i">C</text><path d="M480,287L860,287"/><path d="M556,287L638,178L782,34L782,287"/><path d="M638,178L638,287" class="d"/><path d="M638,178L782,178" class="d"/><path d="M569.24,269.43A22,22 0 0 1 578,287"/><path d="M650.73,165.27A18,18 0 0 1 656,178"/><text x="600" y="276" text-anchor="middle">53°</text><text x="708" y="168" text-anchor="middle">45°</text><text x="550" y="317" text-anchor="middle" class="i">A</text><text x="638" y="317" text-anchor="middle" class="i">F</text><text x="782" y="317" text-anchor="middle" class="i">D</text><text x="622" y="172" text-anchor="middle" class="i">B</text><text x="804" y