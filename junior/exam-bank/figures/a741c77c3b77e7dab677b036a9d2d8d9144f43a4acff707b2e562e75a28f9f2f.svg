<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-labelledby="title desc"><title id="title">四幅剪纸图案</title><desc id="desc">四幅线描剪纸图案，分别标A、B、C、D。A：两只瑞兽左右相对，中上方有冠饰，下方是折线花边。B：两条鱼左右相对、头都朝上，中间是一个孩童，上方有拱形。C：两条龙左右相对，中上方有宝塔，外围是方框。D：两条鲤鱼，一条在左上，一条在右下。</desc>
