<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 285" role="img" aria-labelledby="title desc"><title id="title">路程与时间的函数图象</title><desc id="desc">横轴x（单位h），纵轴y（单位km）。折线从纵轴上y=180处下降到x轴，上升到横坐标为3、纵坐标为90的点，再下降到x轴上的点E，最后上升到点F，点F的纵坐标为180。图中有虚线标出180、90和横坐标3，并从F向x轴作虚线。</desc>
