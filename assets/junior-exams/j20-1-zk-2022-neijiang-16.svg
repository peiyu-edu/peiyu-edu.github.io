<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 575 426" width="575" height="426" role="img" aria-labelledby="title desc">
<title id="title">弦图与其变化图</title>
<desc id="desc">图①是赵爽弦图：大正方形内接一个斜放的正方形，斜放正方形内由四个直角三角形围出中间的小正方形。图②是斜放的大正方形 ABCD，D 在上、C 在右、B 在下、A 在左；H 在 AD 上，G 在 DC 上，F 在 CB 上，E 在 BA 上，连成正方形 EFGH；EFGH 内由线段 HK、GN、FM、ET 围出中间的小正方形 MNKT。</desc>
<style>text { fill:#17202a; } .m { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
