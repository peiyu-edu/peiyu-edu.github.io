<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 5 章 一元一次方程 · 章末测验 · 培玉初中数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/katex/katex.min.css"><link rel="stylesheet" href="../assets/site.css?v=0346bdf6f187"><link rel="stylesheet" href="../assets/learning-shell.css?v=98f4d1951708"><link rel="stylesheet" href="../assets/learning-contrast.css?v=bc8e3f382635"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=9f35dd2cb533"><script defer src="../assets/katex/katex.min.js"></script><script defer src="../assets/katex/auto-render.min.js"></script><script defer src="../assets/learning-state.js?v=5386fbb9fecf"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=e3d4083f037a"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=9e04f871a3b0"></script></head><body data-stage="junior" data-sec="j5-test"><div class="wrap"><header class="top"><img src="../assets/logo.svg" alt=""><a class="brand" href="../index.html">培玉 · 初中数学</a><span class="sp"></span></header><main class="cq-page"><h1>第 5 章 一元一次方程 · 章末测验</h1><p class="cq-intro">整套做完再提交。提交后逐题显示对错、错因提示和解析。成绩只按第一次独立完成计，重做会单独显示，答错的题进入「错题本」。</p><div id="chapter-quiz" data-quiz-id="j5-test"><p class="cq-loading">正在载入测验…</p></div><script type="application/json" id="chapter-quiz-data">{"id": "j5-test", "sectionId": "j5-test", "chapterId": "j5", "title": "第 5 章 一元一次方程 · 章末测验", "label": "章末测验", "sections": ["j5-1", "j5-2", "j5-3"], "items": [{"id": "j5-test-01-v1", "number": 1, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j5-1"], "pointIds": ["pyjh.eq.003", "pyjh.eq.001"], "prompt": "下列方程中，哪一个是一元一次方程？", "options": [{"id": "a", "text": "$x^2-1=0$", "feedback": "未知数的次数是 $2$。"}, {"id": "b", "text": "$2x-y=1$", "feedback": "含有两个未知数。"}, {"id": "c", "text": "$3x-5=2x+1$", "feedback": "只含一个未知数，未知数的次数是 $1$，等号两边都是整式。"}, {"id": "d", "text": "$\\frac1x=2$", "feedback": "未知数在分母里，等号左边不是整式。"}], "correct": "c", "answer": "$3x-5=2x+1$", "reasoning": ["一元一次方程：只含一个未知数，未知数的次数都是 $1$，等号两边都是整式。", "逐项检查，只有 $3x-5=2x+1$ 同时满足三条。"], "contentVersion": "sha256:8004b3bbef9e86e285059a0a17fa027db539baeb60e26f46e98d822733a2b5e1"}, {"id": "j5-test-02-v1", "number": 2, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j5-1"], "pointIds": ["pyjh.eq.002"], "prompt": "$x=2$ 是下列哪个方程的解？", "options": [{"id": "a", "text": "$3x-1=5$", "feedback": "把 $x=2$ 代入两边，看左右是否相等。"}, {"id": "b", "text": "$2x+1=3$", "feedback": "代入后左边是 $5$，右边是 $3$。"}, {"id": "c", "text": "$x-5=3$", "feedback": "代入后左边是 $-3$，右边是 $3$。"}, {"id": "d", "text": "$4x=2$", "feedback": "代入后左边是 $8$，右边是 $2$。"}], "correct": "a", "answer": "$3x-1=5$", "reasoning": ["使方程左右两边相等的未知数的值是方程的解，用代入检验。", "$3\\times2-1=5$，左右相等；其余三个方程代入后左右不等。"], "contentVersion": "sha256:78ac7a569266d656f97b9082f58239908566aecf0f3bfbf05919c72a3335d155"}, {"id": "j5-test-03-v1", "number": 3, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j5-1"], "pointIds": ["pyjh.eq.004"], "prompt": "已知 $a=b$，下列变形中不一定成立的是哪一项？", "options": [{"id": "a", "text": "$a+3=b+3$", "feedback": "等式两边加同一个数，结果仍相等。"}, {"id": "b", "text": "$a-1=b-1$", "feedback": "等式两边减同一个数，结果仍相等。"}, {"id": "c", "text": "$2a=2b$", "feedback": "等式两边乘同一个数，结果仍相等。"}, {"id": "d", "text": "$\\frac ac=\\frac bc$", "feedback": "等式两边只能除以同一个不为 $0$ 的数，$c$ 可能为 $0$。"}], "correct": "d", "answer": "$\\frac ac=\\frac bc$", "reasoning": ["等式的性质：两边加（或减）同一个数仍相等；两边乘同一个数、或除以同一个不为 $0$ 的数仍相等。", "题中没有说明 $c\\ne0$，当 $c=0$ 时 $\\frac ac$ 没有意义，所以这项不一定成立。"], "contentVersion": "sha256:baf2dd7c7a75734252d0508820ec5be5fa856c498e708ab8966ae434124298c0"}, {"id": "j5-test-04-v1", "number": 4, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j5-2"], "pointIds": ["pyjh.eq.006", "pyjh.eq.009"], "prompt": "解方程 $5x-3=2x+9$，$x$ 等于多少？", "options": [{"id": "a", "text": "$x=2$", "feedback": "移项要变号：$-3$ 移到右边变成 $+3$。"}, {"id": "b", "text": "$x=4$", "feedback": "移项、合并同类项，再把系数化为 $1$。"}, {"id": "c", "text": "$x=\\frac{12}7$", "feedback": "$2x$ 移到左边要变成 $-2x$。"}, {"id": "d", "text": "$x=-4$", "feedback": "合并后 $3x=12$，两边同除以 $3$ 得正数。"}], "correct": "b", "answer": "$x=4$", "reasoning": ["移项：$5x-2x=9+3$。", "合并同类项：$3x=12$；系数化为 $1$：$x=4$。", "检验：左边 $5\\times4-3=17$，右边 $2\\times4+9=17$。"], "contentVersion": "sha256:d4708315bd7188ffbd4a45dc92cfe00b4043b2ac7c74431065c8081fae18c5dc"}, {"id": "j5-test-05-v1", "number": 5, "tier": "basic", "tierLabel": "基础", "sectionIds": ["j5-2"], "pointIds": ["pyjh.eq.007"], "prompt": "解方程 $3(x-2)=x+4$，$x$ 等于多少？", "options": [{"id": "a", "text": "$x=5$", "feedback": "去括号时 $3$ 要乘括号里的每一项。"}, {"id": "b", "text": "$x=3$", "feedback": "去括号时 $3$ 也要乘 $-2$，得 $-6$。"}, {"id": "c", "text": "$x=-1$", "feedback": "移项时 $-6$ 移到右边要变成 $+6$。"}, {"id": "d", "text": "$x=10$", "feedback": "合并后两边还要同除以 $x$ 的系数 $2$。"}], "correct": "a", "answer": "$x=5$", "reasoning": ["去括号：$3x-6=x+4$。", "移项、合并：$2x=10$，所以 $x=5$。"], "contentVersion": "sha256:1da19df880e00234280c500494db380a8cc5ac43a3806c75c9a85f8bf08fe848"}, {"id": "j5-test-06-v1", "number": 6, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j5-2"], "pointIds": ["pyjh.eq.008", "pyjh.eq.009"], "prompt": "解方程 $\\frac{x+1}2-\\frac{2x-1}3=1$，$x$ 等于多少？", "options": [{"id": "a", "text": "$x=4$", "feedback": "去分母时等号右边的 $1$ 也要乘 $6$。"}, {"id": "b", "text": "$x=-5$", "feedback": "去括号 $-2(2x-1)$ 时，$-1$ 乘 $-2$ 得 $+2$。"}, {"id": "c", "text": "$x=-1$", "feedback": "两边同乘分母的最小公倍数 $6$，再去括号、移项、合并。"}, {"id": "d", "text": "$x=1$", "feedback": "合并后得 $-x=1$，系数化为 $1$ 时要除以 $-1$。"}], "correct": "c", "answer": "$x=-1$", "reasoning": ["两边乘 $6$：$3(x+1)-2(2x-1)=6$。", "去括号：$3x+3-4x+2=6$，合并得 $-x+5=6$，即 $-x=1$。", "$x=-1$。检验：左边 $\\frac02-\\frac{-3}3=1$，等于右边。"], "contentVersion": "sha256:cf0f53651ee10a4b84d20dc55144581643db95e1850c1e756e62076d59612197"}, {"id": "j5-test-07-v1", "number": 7, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j5-1", "j5-2"], "pointIds": ["pyjh.eq.002", "pyjh.eq.006"], "prompt": "若 $x=3$ 是关于 $x$ 的方程 $2x-a=1+x$ 的解，则 $a$ 的值是多少？", "options": [{"id": "a", "text": "$a=2$", "feedback": "把 $x=3$ 代入方程，得到关于 $a$ 的方程。"}, {"id": "b", "text": "$a=-2$", "feedback": "代入得 $6-a=4$，移项时注意符号。"}, {"id": "c", "text": "$a=4$", "feedback": "$4$ 是右边 $1+3$ 的值，还要再求 $a$。"}, {"id": "d", "text": "$a=10$", "feedback": "$6-a=4$ 中，$a$ 前面是减号。"}], "correct": "a", "answer": "$a=2$", "reasoning": ["方程的解满足方程，代入 $x=3$：$6-a=1+3$。", "$6-a=4$，所以 $a=2$。"], "contentVersion": "sha256:0becc1b94df40a82650a7c70eb17d4d6cf0dc238936db8e9fa3079cd96af0323"}, {"id": "j5-test-08-v1", "number": 8, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j5-3"], "pointIds": ["pyjh.eq.011", "pyjh.eq.010"], "prompt": "一项工程，甲单独做 $12$ 天完成，乙单独做 $24$ 天完成。甲先单独做 $3$ 天，剩下的由甲、乙合作，还需要几天完成？", "options": [{"id": "a", "text": "$8$ 天", "feedback": "这是两人合作完成全部工程的天数，甲已先做了一部分。"}, {"id": "b", "text": "$5$ 天", "feedback": "先做的 $3$ 天完成的是甲的工作量，不能直接从合作天数里减去 $3$。"}, {"id": "c", "text": "$6$ 天", "feedback": "设合作 $x$ 天，甲完成的加上合作完成的等于全部工作量 $1$。"}, {"id": "d", "text": "$9$ 天", "feedback": "这是甲一共做的天数，题目问的是合作的天数。"}], "correct": "c", "answer": "$6$ 天", "reasoning": ["设还需合作 $x$ 天。甲的工作效率 $\\frac1{12}$，乙的工作效率 $\\frac1{24}$。", "列方程：$\\frac3{12}+\\left(\\frac1{12}+\\frac1{24}\\right)x=1$，即 $\\frac14+\\frac18x=1$。", "解得 $x=6$。检验：$\\frac14+\\frac68=1$，符合题意。"], "contentVersion": "sha256:24c4c2c95cf5981662963f99b37a6306c8fa1135b416f4461fb4a3b813070e1f"}, {"id": "j5-test-09-v1", "number": 9, "tier": "variant", "tierLabel": "变式", "sectionIds": ["j5-3"], "pointIds": ["pyjh.eq.012", "pyjh.eq.010"], "prompt": "某商品的进价是 $200$ 元，按标价打八折出售，仍可获利 $20\\%$。这种商品的标价是多少元？", "options": [{"id": "a", "text": "$275$ 元", "feedback": "利润率 $20\\%$ 是相对进价说的，利润是 $200\\times20\\%$ 元，不是 $20$ 元。"}, {"id": "b", "text": "$250$ 元", "feedback": "打八折后的售价要比进价多出利润，不是恰好等于进价。"}, {"id": "c", "text": "$240$ 元", "feedback": "这是打折后的实际售价，还要求打折前的标价。"}, {"id": "d", "text": "$300$ 元", "feedback": "售价 $=$ 标价 $\\times0.8$，利润 $=$ 售价 $-$ 进价 $=$ 进价 $\\times20\\%$。"}], "correct": "d", "answer": "$300$ 元", "reasoning": ["设标价为 $x$ 元，售价为 $0.8x$ 元。", "利润 $=$ 进价 $\\times$ 利润率：$0.8x-200=200\\times20\\%$。", "$0.8x=240$，$x=300$。检验：$300\\times0.8=240$，$240-200=40=200\\times20\\%$。"], "contentVersion": "sha256:397ee3d81cfa3d379861bbd57c4b6ce360c8c1bd70e593d8e6371aeaf59db5d7"}, {"id": "j5-test-10-v1", "number": 10, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j5-3"], "pointIds": ["pyjh.eq.015", "pyjh.eq.010"], "prompt": "甲、乙两地相距 $420$ 千米。一辆快车从甲地、一辆慢车从乙地同时出发，相向而行，快车每小时行 $80$ 千米，慢车每小时行 $60$ 千米。出发后多少小时两车相距 $70$ 千米？", "options": [{"id": "a", "text": "$2.5$ 小时", "feedback": "这只是相遇前的一种情况，相遇后两车继续行驶也会相距 $70$ 千米。"}, {"id": "b", "text": "$3.5$ 小时", "feedback": "这只是相遇后的情况，相遇前也有一次相距 $70$ 千米。"}, {"id": "c", "text": "$3$ 小时", "feedback": "这是两车相遇的时间，此时两车相距 $0$ 千米。"}, {"id": "d", "text": "$2.5$ 小时或 $3.5$ 小时", "feedback": "相距 $70$ 千米可能发生在相遇前，也可能发生在相遇后，要分两种情况列方程。"}], "correct": "d", "answer": "$2.5$ 小时或 $3.5$ 小时", "reasoning": ["设出发后 $x$ 小时两车相距 $70$ 千米，两车每小时共行 $140$ 千米。", "相遇前：$140x+70=420$，$x=2.5$。", "相遇后：$140x-70=420$，$x=3.5$。两车 $3$ 小时相遇，两个解都在实际范围内。"], "contentVersion": "sha256:8fe9bd3af66da71e112c898a63daef44ae5aea039b63269f0bab83977e60727e"}, {"id": "j5-test-11-v1", "number": 11, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j5-3"], "pointIds": ["pyjh.eq.014", "pyjh.eq.010"], "prompt": "某地居民用水按月阶梯计价：每户每月用水不超过 $15$ 吨的部分，每吨 $3$ 元；超过 $15$ 吨的部分，每吨 $5$ 元。某户某月交水费 $85$ 元，这个月用水多少吨？", "options": [{"id": "a", "text": "$17$ 吨", "feedback": "不能全部按每吨 $5$ 元计算，前 $15$ 吨是每吨 $3$ 元。"}, {"id": "b", "text": "$\\frac{85}3$ 吨", "feedback": "$85$ 元超过了 $15\\times3=45$ 元，说明用水超过 $15$ 吨，超出部分按每吨 $5$ 元。"}, {"id": "c", "text": "$23$ 吨", "feedback": "先判断用水超过 $15$ 吨，再按两段计费列方程。"}, {"id": "d", "text": "$8$ 吨", "feedback": "这是超出 $15$ 吨的部分，还要加上前面的 $15$ 吨。"}], "correct": "c", "answer": "$23$ 吨", "reasoning": ["用水 $15$ 吨时水费为 $15\\times3=45$ 元 $<85$ 元，所以用水超过 $15$ 吨。", "设用水 $x$ 吨，$45+5(x-15)=85$，解得 $x=23$。", "$23>15$，符合题意。"], "contentVersion": "sha256:8b1dfcc6fb79c8dcdbdb3b7f615c2d0065f6d8387abc92615709a30d37f2c94f"}, {"id": "j5-test-12-v1", "number": 12, "tier": "synthesis", "tierLabel": "综合", "sectionIds": ["j5-3"], "pointIds": ["pyjh.eq.013", "pyjh.eq.010"], "prompt": "甲印刷店印宣传单，收制版费 $50$ 元，另外每份收 $0.3$ 元；乙印刷店不收制版费，每份收 $0.5$ 元。印多少份时，两家店的费用相同？", "options": [{"id": "a", "text": "$100$ 份", "feedback": "这是 $50\\div0.5$，没有考虑甲店每份也要收费。"}, {"id": "b", "text": "$250$ 份", "feedback": "两店费用相等时，$50+0.3x=0.5x$。"}, {"id": "c", "text": "$500$ 份", "feedback": "每份的差价是 $0.5-0.3=0.2$ 元，不是 $0.1$ 元。"}, {"id": "d", "text": "$62.5$ 份", "feedback": "两店每份价格应相减，不是相加；份数也应是整数。"}], "correct": "b", "answer": "$250$ 份", "reasoning": ["设印 $x$ 份时费用相同，甲店 $(50+0.3x)$ 元，乙店 $0.5x$ 元。", "$50+0.3x=0.5x$，$0.2x=50$，$x=250$。", "超过 $250$ 份时甲店更省，少于 $250$ 份时乙店更省。"], "contentVersion": "sha256:02300a3b4acf7f8ed9737855819b90af05a4a6a6ca186c27bec5214f82707611"}]}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../tests.html">章末测验</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 章末测验为原创练习，不是考试真题</footer></div></body></html>
