<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 385" role="img" aria-labelledby="title desc"><title id="title">港口A、B、C的方位</title><desc id="desc">左上方有方向标，上为北。点A处向北的线与AC成53°，C在A的北偏东方向；点B处向北的线与BA成18.4°，A在B的北偏西方向；连接AB、BC、CA。</desc><style>path,circle,ellipse{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:6 5}.g{stroke-dasharray:3 4;stroke-width:1}.thin{stroke-width:1.5}.fill{fill:currentColor;stroke:none}.shade{fill:var(--shade);stroke:none}.block{fill:var(--shade)}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}text.n{font-style:normal;font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif}svg{color:#243d45;background:#fff;--shade:#c9d2d2}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--shade:#4a6268}}</style><path d="M70.0,228.0L110.0,348.0L230.0,108.0Z"/><path d="M70.0,228.0L70.0,170.0"/><path d="M110.0,348.0L110.0,290.0"/><path class="thin" d="M70.0,202.0A26,26 0 0 1 90.8,212.4"/><path class="thin" d="M110.0,318.0A30,30 0 0 0 100.5,319.5"/><text x="88.0" y="198.0" font-size="15" text-anchor="middle" class="n">53°</text><text x="74.0" y="318.0" font-size="15" text-anchor="middle" class="n">18.4°</text><text x="56.0" y="236.0" font-size="19" text-anchor="middle">A</text><text x="110.0" y="372.0" font-size="19" text-anchor="middle">B</text><text x="236.0" y="100.0" font-size="19" text-anchor="middle">C</text><path d="M190.0,86.0L190.0,34.0"/><path class="fill" d="M190.0,26.0L194.3,38.7L185.7,38.7Z"/><path d="M164.0,60.0L216.0,60.0"/><path class="fill" d="M224.0,60.0L211.3,64.3L211.3,55.7Z"/><text x="190.0" y="24.0" font-size="16" text-anchor="middle" class="n">北</text><text x="190.0" y="106.0" font-size="16" text-anchor="middle" class="n">南</text><text x="150.0" y="66.0" font-size="16" text-anchor="middle" class="n">西</text><text x="232.0" y="66.0" font-size="16" text-anchor="middle" class="n">东</text></svg>
