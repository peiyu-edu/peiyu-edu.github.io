<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一年级上册 第二单元 6～10的认识和加、减法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=93bfb82e353b"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p1a-u2-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>一年级上册 第二单元 6～10的认识和加、减法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p1a-u2-test", "sectionId": "p1a-u2-test", "unitId": "p1a-u2", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "一年级上册 第二单元 6～10的认识和加、减法 单元测评", "items": [{"id": "p1a-u2-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "数一数：| | | | | | | 一共有几根小棒？", "answer": "7", "reasoning": ["一根一根点着数：1、2、3、4、5、6、7。", "数到最后一根是 7，就是 7 根。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.001"], "contentVersion": "sha256:bb41708d46d5d4be082908a24a3d9a1de4ada7be343bf5ca109bb7fa0fea7334", "figure": "<svg class=\"qfig\" viewBox=\"0 0 280 105\" role=\"img\" aria-label=\"一排待点数的小棒\" style=\"max-width:280px\"><path d=\"M35,24 L35,84\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M67,24 L67,84\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M99,24 L99,84\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M131,24 L131,84\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M163,24 L163,84\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M195,24 L195,84\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><path d=\"M227,24 L227,84\" style=\"fill:none;stroke:var(--b);stroke-width:2\"/><\/svg>"}, {"id": "p1a-u2-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "在 ○ 里填 >、< 还是 =？ 8 ○ 6", "answer": ">", "reasoning": ["数数时 6、7、8，8 在 6 的后面。", "8 比 6 大，写 8 > 6。"], "options": [{"id": "a", "text": ">", "feedback": "对。数数时 8 在 6 的后面，8 比 6 大。"}, {"id": "b", "text": "=", "feedback": "8 和 6 不一样大。"}, {"id": "c", "text": "<", "feedback": "开口朝着大的数。8 比 6 大，开口要朝 8。"}], "correct": "a", "pointIds": ["pyps.p1a.u2.002"], "contentVersion": "sha256:2cf4bd3b774134ef254726260fc5dfb552e86874f4ac0d25332a9bbf7abee98a"}, {"id": "p1a-u2-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "9 可以分成 4 和 □。", "answer": "5", "reasoning": ["9 个圆片，先拿出 4 个。", "剩下 5 个，所以 9 可以分成 4 和 5。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.003"], "contentVersion": "sha256:03489b5beedcfbad1135ab50262fa30cc59a51878cc4b66566e77cfef1d126b7"}, {"id": "p1a-u2-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "10 − 3 = □", "answer": "7", "reasoning": ["想：10 可以分成 3 和 7。", "10 去掉 3，还剩 7，所以 10 − 3 = 7。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.010"], "contentVersion": "sha256:820800661e311c341f797cb217691b407cf1c8b3aab4d63aab5cb4d07cb85869"}, {"id": "p1a-u2-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "9 添上 1 是 □。", "answer": "10", "reasoning": ["数数时 9 的后面是 10。", "9 添上 1 是 10。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.008"], "contentVersion": "sha256:a23bc4e615b907152de4e16f8ab4edc65093469f2dc20dcbf6660ccb66929671"}, {"id": "p1a-u2-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "3 和 □ 合起来是 10。", "answer": "7", "reasoning": ["想 10 的分与合：10 可以分成 3 和 7。", "所以 3 和 7 合起来是 10。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.009"], "contentVersion": "sha256:b5e39f26174b1abaec2401ece4114738c7a8a4ec496256fd12a6bc6649481b74"}, {"id": "p1a-u2-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "2 + 3 + 4 = □", "answer": "9", "reasoning": ["先算前两个数：2 + 3 = 5。", "再用得数接着算：5 + 4 = 9。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.011"], "contentVersion": "sha256:b9bdab9635671e5ee911662a06a885c791c2b1e9836492397cef9009bb782784"}, {"id": "p1a-u2-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "9 − 4 + 3 = □", "answer": "8", "reasoning": ["从左往右，先算 9 − 4 = 5。", "再算 5 + 3 = 8。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.012"], "contentVersion": "sha256:bdcb5baa8b0bedd561df9bac2f28c917e3c909f6d95b525ddeb580876b1fec31"}, {"id": "p1a-u2-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "比 7 大 1 的数是几？", "answer": "8", "reasoning": ["比 7 大 1 的数，就是数数时紧挨在 7 后面的数。", "7 后面是 8。"], "options": [{"id": "a", "text": "6", "feedback": "6 比 7 小 1，不是大 1。"}, {"id": "b", "text": "8", "feedback": "对。数数时 7 后面紧挨着的是 8，8 比 7 大 1。"}, {"id": "c", "text": "9", "feedback": "9 比 7 大 2。"}], "correct": "b", "pointIds": ["pyps.p1a.u2.002"], "contentVersion": "sha256:9e05da8ca6bfcd0dbc9bf2292c3722cf7259df5c97c86b7a8cd0a2ece03596de"}, {"id": "p1a-u2-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "左边有 4 个气球，右边有 5 个气球。一共有几个气球？", "answer": "4 + 5 = 9（个）", "reasoning": ["求一共有几个，就是把左边和右边合起来。", "合起来用加法：4 + 5 = 9（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.005"], "contentVersion": "sha256:e86a1033bf7f5a5a129b21c993d499fe7ba1e987f42a0b83974a14d999eff1b0"}, {"id": "p1a-u2-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一共有 10 个皮球，拿走了 6 个。还剩几个皮球？", "answer": "10 − 6 = 4（个）", "reasoning": ["一共 10 个，拿走的 6 个要去掉。", "求还剩几个用减法：10 − 6 = 4（个）。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.006"], "contentVersion": "sha256:af5b4c72ff3e898d2520828f8f6265b652c467dd8aa22b063c88ce056913cda1"}, {"id": "p1a-u2-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "停车场有 8 辆小汽车和 3 辆大客车。开走了 2 辆小汽车。还剩几辆小汽车？", "answer": "8 − 2 = 6（辆）", "reasoning": ["问的是小汽车，大客车的 3 辆用不上。", "小汽车有 8 辆，开走 2 辆：8 − 2 = 6（辆）。"], "options": [], "correct": null, "pointIds": ["pyps.p1a.u2.007"], "contentVersion": "sha256:acb43d167396ae12fda864f5362c78896c95a7e9ddce8b676fdf457644b099a3"}], "contentVersion": "sha256:896bf2be08f99e4df9f0563dd4011b210adf352a132d860279a8c658d4917138"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
