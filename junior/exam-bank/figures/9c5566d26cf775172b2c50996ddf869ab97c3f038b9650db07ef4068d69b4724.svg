<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 285" role="img" aria-labelledby="title desc"><title id="title">矩形中t等于3秒时P和Q的位置</title><desc id="desc">矩形ABCD，点P在AD上，点Q在AB上，连接PQ，表示t=3秒时的位置。</desc><style>svg{color:#243d45;background:#fff;--front:#c8d4d4;--top:#f2f5f3;--side:#a6bbbb}path{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.front{fill:var(--front)}.top{fill:var(--top)}.side{fill:var(--side)}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--front:#405b62;--top:#5b737a;--side:#2b4149}}</style><path d="M70.000,65.000L70.000,240.000L315.000,240.000L315.000,65.000Z"/><path d="M175.000,65.000L70.000,170.000"/><text x="51.000" y="66.000" text-anchor="middle" font-size="25">A</text><text x="51.000" y="255.000" text-anchor="middle" font-size="25">B</text><text x="331.000" y="255.000" text-anchor="middle" font-size="25">C</text><text x="332.000" y="67.000" text-anchor="middle" font-size="25">D</text><text x="175.000" y="50.000" text-anchor="middle" font-size="25">P</text><text x="50.000" y="178.000" text-anchor="middle" font-size="25">Q</text></svg>
