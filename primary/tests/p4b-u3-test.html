<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级下册 第三单元 运算定律 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p4b-u3-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>四年级下册 第三单元 运算定律 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p4b-u3-test", "sectionId": "p4b-u3-test", "unitId": "p4b-u3", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "四年级下册 第三单元 运算定律 单元测评", "items": [{"id": "p4b-u3-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "下面哪个等式用的是加法交换律？", "answer": "35 + 48 = 48 + 35", "reasoning": ["两个数相加，交换加数的位置，和不变，这叫加法交换律。", "35 + 48 和 48 + 35 得数相等，正是交换了两个加数。"], "options": [{"id": "a", "text": "(35 + 48) + 2 = 35 + (48 + 2)", "feedback": "这是改变了先加哪两个数，用的是加法结合律。"}, {"id": "b", "text": "48 − 35 = 35 − 48", "feedback": "这个等式不成立，减法不能交换两个数的位置。"}, {"id": "c", "text": "35 + 48 = 48 + 35", "feedback": "对。两个加数交换了位置，和不变。"}], "correct": "c", "pointIds": ["pyps.p4b.u3.001"], "contentVersion": "sha256:806ffdd7a29736ec3c0e57c3654174f03e088917714dbd14937cb6041de25eb7"}, {"id": "p4b-u3-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "choice", "prompt": "25 × 17 × 4 = 17 × (25 × 4) 这一步用了什么？", "answer": "乘法交换律和乘法结合律", "reasoning": ["原来先算 25 × 17，变成先算 25 × 4。", "交换 25 和 17 的位置用了乘法交换律，再先算 25 × 4 用了乘法结合律。"], "options": [{"id": "a", "text": "乘法交换律和乘法结合律", "feedback": "对。先把 25 和 17 交换位置，再把 25 和 4 先乘。"}, {"id": "b", "text": "只用了乘法结合律", "feedback": "数的顺序也变了，25 跑到 17 后面，还用了交换律。"}, {"id": "c", "text": "乘法分配律", "feedback": "这里只有乘法，没有「和乘一个数」。"}], "correct": "a", "pointIds": ["pyps.p4b.u3.006"], "contentVersion": "sha256:4a6082b4c7395a8a83ac72827aa850674ef4226607494c436b5539517b36f1cd"}, {"id": "p4b-u3-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "简便计算：76 + 135 + 24。", "answer": "235", "reasoning": ["76 和 24 能凑成整百，先把它们相加。", "76 + 24 = 100，100 + 135 = 235。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u3.003"], "contentVersion": "sha256:5f5dc50169bdacd888b2911faf6d87f7d3c99c20f8ffca27109988d591015159"}, {"id": "p4b-u3-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "简便计算：568 − 133 − 67。", "answer": "368", "reasoning": ["连续减去两个数，等于减去这两个数的和。", "133 + 67 = 200，568 − 200 = 368。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u3.004"], "contentVersion": "sha256:65d878af516b463aae3fc41ca8bfb962d22c5b16b92f977071c6962c5d082218"}, {"id": "p4b-u3-t05", "number": 5, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "简便计算：125 × 9 × 8。", "answer": "9000", "reasoning": ["125 × 8 = 1000，先算这两个数。", "1000 × 9 = 9000。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u3.006"], "contentVersion": "sha256:e713fc9182482648bc9848e3dd42e1b925d1e6d27bcacd4fa0aab8eed0764bc4"}, {"id": "p4b-u3-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "简便计算：101 × 37。", "answer": "3737", "reasoning": ["把 101 看成 100 + 1。", "100 × 37 = 3700，1 × 37 = 37。", "3700 + 37 = 3737。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u3.008"], "contentVersion": "sha256:8bde6ac27fc05f43eabf331cde306e3567db257ba3d3019822152191449d0adf"}, {"id": "p4b-u3-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "简便计算：46 × 72 + 46 × 28。", "answer": "4600", "reasoning": ["两个积里都有 46，把 72 和 28 先加起来。", "72 + 28 = 100，46 × 100 = 4600。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u3.009"], "contentVersion": "sha256:c46db1d5666f3e03738be5ef40f24afbeb6a5642025a88ef91cafb6b3fc80b7d"}, {"id": "p4b-u3-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "560 ÷ 7 ÷ 2 和下面哪个算式的得数相等？", "answer": "560 ÷ 2 ÷ 7", "reasoning": ["560 ÷ 7 = 80，80 ÷ 2 = 40。", "560 ÷ 2 = 280，280 ÷ 7 = 40。", "两个算式得数都是 40。"], "options": [{"id": "a", "text": "560 ÷ 2 ÷ 7", "feedback": "对。连续除以两个数，可以交换两个除数的先后，得数都是 40。"}, {"id": "b", "text": "560 ÷ 7 × 2", "feedback": "后面变成了乘 2，得数变成 160，不相等。"}, {"id": "c", "text": "560 ÷ 7 + 2", "feedback": "后面变成了加 2，得数是 82，不相等。"}], "correct": "a", "pointIds": ["pyps.p4b.u3.010"], "contentVersion": "sha256:e58cec06f0afbd90e2159aaed1356c3f8d6931f360cd15e747dee42b358abe5b"}, {"id": "p4b-u3-t09", "number": 9, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "计算 125 × 24，下面哪种拆法对？", "answer": "125 × 8 × 3", "reasoning": ["把 24 拆成 8 × 3，因为 125 × 8 = 1000 好算。", "125 × 8 = 1000，1000 × 3 = 3000。"], "options": [{"id": "a", "text": "125 × 20 × 4", "feedback": "20 × 4 = 80，不是 24。"}, {"id": "b", "text": "125 × 8 + 3", "feedback": "把 24 拆成两个数相乘，是 8 × 3，不能写成加 3。"}, {"id": "c", "text": "125 × 8 × 3", "feedback": "对。8 × 3 = 24，先算 125 × 8 = 1000，再乘 3 得 3000。"}], "correct": "c", "pointIds": ["pyps.p4b.u3.011"], "contentVersion": "sha256:36a2855bdccf33b6f55907c81299fa071b5d4b6bff6b39262ffb58efd2d03c6f"}, {"id": "p4b-u3-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一件上衣 68 元，一条裤子 32 元。学校给合唱队买 5 件上衣和 5 条裤子，一共多少元？用简便方法计算。", "answer": "500 元", "reasoning": ["5 件上衣和 5 条裤子，就是 5 套衣服，每套 68 + 32 = 100（元）。", "100 × 5 = 500（元）。", "也可以分开算：68 × 5 = 340，32 × 5 = 160，340 + 160 = 500（元），得数相同。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u3.007", "pyps.p4a.u4.003"], "contentVersion": "sha256:7b17e6cb7a2106b25f19f72276ea301e91f6c30e3c5580c9046b57c5d5c7aafc"}, {"id": "p4b-u3-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "王阿姨带了 1000 元，买电饭锅用了 285 元，买电风扇用了 215 元。还剩多少元？用简便方法计算。", "answer": "500 元", "reasoning": ["1000 − 285 − 215，可以先算两次用去的钱。", "285 + 215 = 500，1000 − 500 = 500（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u3.004", "pyps.p4b.u3.003"], "contentVersion": "sha256:17b04c84c5227ea824518804edd0143dd4bf9e6d92016b8a1f55279afd5a048a"}, {"id": "p4b-u3-t12", "number": 12, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "小明算 25 × (40 + 4) 时写成 25 × 40 + 4 = 1004。他错在哪里？正确的得数是多少？", "answer": "括号里的 4 也要乘 25，正确得数是 1100", "reasoning": ["一个数乘两个数的和，要用这个数分别乘这两个数，再相加。", "25 × 40 = 1000，25 × 4 = 100，1000 + 100 = 1100。"], "options": [{"id": "a", "text": "他算对了，得数就是 1004", "feedback": "括号里的 40 和 4 都要乘 25，他漏乘了 4。"}, {"id": "b", "text": "应该写成 25 × 40 × 4，得 4000", "feedback": "括号里是加法，40 和 4 是相加，不是相乘。"}, {"id": "c", "text": "括号里的 4 也要乘 25，正确得数是 1100", "feedback": "对。25 × 40 + 25 × 4 = 1000 + 100 = 1100。"}], "correct": "c", "pointIds": ["pyps.p4b.u3.007"], "contentVersion": "sha256:55d5c5145f5195198a07c3560deb085cd35c460fec9d0d74259830c9e5681733"}], "contentVersion": "sha256:34a3ce9f2c9525d1211d08c2347a323797f5f53c70a2d82ba4a655531d1f77cd"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
