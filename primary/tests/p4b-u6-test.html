<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四年级下册 第六单元 小数的加法和减法 单元测评 · 培玉小学数学</title><link rel="icon" href="../assets/logo.svg"><link rel="stylesheet" href="../assets/site.css?v=5faad6921482"><link rel="stylesheet" href="../assets/learning-shell.css?v=a4ed628c8256"><link rel="stylesheet" href="../assets/learning-contrast.css?v=727819d54b96"><link rel="stylesheet" href="../assets/learning-palette.css?v=af6b88a0c8a4"><link rel="stylesheet" href="../assets/learning-chapter-quiz.css?v=561643564f0e"><script defer src="../assets/cn-quotes.js?v=bf7f303db75a"></script><script defer src="../assets/learning-state.js?v=63d2f6949c83"></script><script defer src="../assets/learning-data.js?v=bbbf3aa7c419"></script><script defer src="../assets/learning-shell.js?v=66d3732a4c54"></script><script defer src="../assets/learning-contrast-state.js?v=c65a32056158"></script><script defer src="../assets/learning-chapter-quiz.js?v=f099fb75045e"></script></head><body data-stage="primary" data-sec="p4b-u6-test"><div class="wrap"><header class="top"><a class="brand" href="../index.html">培玉 · 小学数学</a><span class="sp"></span></header><main class="cq-page"><h1>四年级下册 第六单元 小数的加法和减法 单元测评</h1><p class="cq-intro">选择题、数字和短算式自动判分，整套提交后看反馈。其他填空先写，再看答案，最后自己评「对 / 不对」。首次成绩只计算自动判分题，自评另列；重做不覆盖首次成绩。答错和自评不对的题进入错题本。</p><div id="chapter-quiz"></div><script id="chapter-quiz-data" type="application/json">{"id": "p4b-u6-test", "sectionId": "p4b-u6-test", "unitId": "p4b-u6", "stage": "primary", "gradingPolicy": "numeric-exact-or-self-check-v1", "label": "单元测评", "title": "四年级下册 第六单元 小数的加法和减法 单元测评", "items": [{"id": "p4b-u6-t01", "number": 1, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：3.45 + 2.31。", "answer": "5.76", "reasoning": ["小数点对齐，也就是相同数位对齐。", "百分位 5 + 1 = 6，十分位 4 + 3 = 7，个位 3 + 2 = 5。", "得数是 5.76。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u6.001"], "contentVersion": "sha256:8622030788534765f4c2b46694742b1d488da234a1c7961afb716f18f4f3fd6f"}, {"id": "p4b-u6-t02", "number": 2, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：8.76 − 4.52。", "answer": "4.24", "reasoning": ["小数点对齐。", "百分位 6 − 2 = 4，十分位 7 − 5 = 2，个位 8 − 4 = 4。", "得数是 4.24。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u6.001"], "contentVersion": "sha256:88542f1bd1feb7856a8a6bdfd2ed8df15949b4af86f39130b0f0615b043f9d68"}, {"id": "p4b-u6-t03", "number": 3, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：6.5 + 2.37。", "answer": "8.87", "reasoning": ["小数点对齐：6.5 的百分位上没有数，看作 0，写成 6.50。", "6.50 加 2.37，得 8.87。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u6.002"], "contentVersion": "sha256:533bc652e8df0b9aa944c62d50b1e278111215700f6edddac6d67335801862bc"}, {"id": "p4b-u6-t04", "number": 4, "tier": "basic", "tierLabel": "基础", "type": "fill", "prompt": "计算：10 − 3.46。", "answer": "6.54", "reasoning": ["把 10 写成 10.00，小数点对齐。", "从百分位减起，不够减就向前一位借 1：10.00 减 3.46 得 6.54。", "验算：6.54 加 3.46 得 10.00，也就是 10。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u6.002"], "contentVersion": "sha256:4301dc8ca16e4a6767b581f22d85e18673cad76c535fd3f20b320a180ec1eb1e"}, {"id": "p4b-u6-t05", "number": 5, "tier": "variant", "tierLabel": "变式", "type": "choice", "prompt": "12.5 − 3.75 等于多少？", "answer": "8.75", "reasoning": ["把 12.5 写成 12.50，和 3.75 小数点对齐。", "百分位：10 − 5 = 5；十分位：14 − 7 = 7；个位：11 − 3 = 8。", "得数是 8.75。"], "options": [{"id": "a", "text": "8.85", "feedback": "百分位 0 减 5 不够减，要向十分位借 1，十分位就只剩 4 了。"}, {"id": "b", "text": "9.75", "feedback": "十分位向个位借了 1，个位剩 1，不够减 3，还要向十位借。"}, {"id": "c", "text": "8.75", "feedback": "对。把 12.5 看作 12.50，从百分位减起，两次退位。"}], "correct": "c", "pointIds": ["pyps.p4b.u6.002"], "contentVersion": "sha256:12d5869960b2f66f84009c6686356c2ee8a8fb530431da43d9137914daa4de8d"}, {"id": "p4b-u6-t06", "number": 6, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "计算：7.8 − 2.35 + 1.55。", "answer": "7", "reasoning": ["没有括号，从左往右算。", "7.8 减 2.35 得 5.45。", "5.45 加 1.55 得 7.00，就是 7。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u6.003"], "contentVersion": "sha256:e0e2b3cce72d3f4f59202537c26d051d54b379a5f995bedd6cabb3481b7bc8cc"}, {"id": "p4b-u6-t07", "number": 7, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "简便计算：4.36 + 2.8 + 5.64。", "answer": "12.8", "reasoning": ["4.36 和 5.64 相加正好是 10，先把它们加起来。", "加法交换律在小数加法里也能用：先算 4.36 加 5.64 得 10。", "10 再加 2.8，得 12.8。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u6.004"], "contentVersion": "sha256:cb80906f1966174da046bb7cf9de4cdcc40732a8afec088bdc9481e673301258"}, {"id": "p4b-u6-t08", "number": 8, "tier": "variant", "tierLabel": "变式", "type": "fill", "prompt": "简便计算：9.6 − 2.37 − 1.63。", "answer": "5.6", "reasoning": ["连续减去两个数，等于减去这两个数的和。", "2.37 加 1.63 正好是 4。", "9.6 减去 4，得 5.6。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u6.004"], "contentVersion": "sha256:cd3ae9b9ffb493ea81ee81cb7d763333719809ccf4c486fc17444907878ee6c4"}, {"id": "p4b-u6-t09", "number": 9, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "妈妈买菜用了 23.5 元，买水果用了 18.65 元，付了 50 元。应找回多少元？", "answer": "7.85 元", "reasoning": ["先算一共用了多少：23.5 加 18.65 得 42.15（元）。", "再算找回多少：50 减 42.15 得 7.85（元）。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u6.003"], "contentVersion": "sha256:9ea82fe41bd7315c4dd3eaf325a1a0e0be9f8260503ae623bdf25d33d67ab1ff"}, {"id": "p4b-u6-t10", "number": 10, "tier": "comprehensive", "tierLabel": "综合", "type": "fill", "prompt": "一根绳子长 5 米，第一次剪下 1.25 米，第二次剪下 175 厘米。还剩多少米？", "answer": "2 米", "reasoning": ["先统一单位：175 厘米 = 1.75 米。", "两次一共剪下 1.25 加 1.75，得 3 米。", "5 米减去 3 米，还剩 2 米。"], "options": [], "correct": null, "pointIds": ["pyps.p4b.u6.002", "pyps.p4b.u4.008"], "contentVersion": "sha256:2e74bc603cf0a68613a6e8e43f3e6f088558d91d9e0c5d3cf57c7d622baf61c8"}, {"id": "p4b-u6-t11", "number": 11, "tier": "comprehensive", "tierLabel": "综合", "type": "choice", "prompt": "列竖式计算小数加减法时，要先对齐什么？", "answer": "小数点，也就是相同数位对齐", "reasoning": ["小数加减法和整数加减法一样，相同数位才能相加减。", "小数点对齐，相同数位就对齐了。"], "options": [{"id": "a", "text": "最后一位数字", "feedback": "像 6.5 和 2.37，末尾对齐会把十分位和百分位对在一起。"}, {"id": "b", "text": "小数点，也就是相同数位对齐", "feedback": "对。小数点对齐了，相同数位才能对齐。"}, {"id": "c", "text": "最前面一位数字", "feedback": "像 12.5 和 3.75，最前面对齐会把十位和个位对在一起。"}], "correct": "b", "pointIds": ["pyps.p4b.u6.001", "pyps.p4b.u6.002"], "contentVersion": "sha256:28b213a85b1adc6f50af584983e3135b255aab178218c6c2fb85e5da6cd1e19e"}], "contentVersion": "sha256:75dad9b7d24410651d8ef87f0d1994e036877939dd39df99b1993e44b28703e0"}</script></main><nav class="lf-resources" aria-label="补充学习资源"><a href="../overview.html">学习总览</a><a href="../textbook-map.html">教材地图</a><a href="../manipulatives.html">教具总览</a><a href="../teacher-trial.html">教师试用</a></nav><footer>培玉智能 · 单元测评</footer></div></body></html>
