<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 470" width="635" height="470" role="img" aria-labelledby="title desc">
<title id="title">杆秤示意图</title>
<desc id="desc">杆秤示意图：一条水平秤杆。杆上从左到右依次是点 B、A、C。B 处向下有一条竖线，下面挂一个圆锥形吊绳的圆形秤盘；A 处有一小段向上的提纽；C 处有一个圆点，向下挂着秤砣。</desc>
<style>text { fill:#17202a; font-size:30px; } .i { font-family:Georgia,'Times New Roman',serif; font-style:italic; } .n { font-family:'Times New Roman',Georgia,serif; } .z { font-family:'PingFang SC','Noto Sans CJK SC',sans-serif; }</style>
<rect x="0" y="0" width="635" height="470" fill="white"/>
<line x1="85.0" y1="73.0" x2="625.0" y2="73.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><line x1="108.0" y1="73.0" x2="108.0" y2="452.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><line x1="160.0" y1="73.0" x2="160.0" y2="38.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><circle cx="197" cy="73" r="5" fill="#17202a"/><line x1="197.0" y1="73.0" x2="197.0" y2="153.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><rect x="179" y="153" width="36" height="52" rx="9" fill="#17202a"/><line x1="108.0" y1="150.0" x2="13.0" y2="417.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><line x1="108.0" y1="150.0" x2="197.0" y2="417.0" stroke="#17202a" stroke-width="3" stroke-linecap="round"/><ellipse cx="105" cy="417" rx="92" ry="35" fill="none" stroke="#17202a" stroke-width="3"/><text class="i" x="108" y="51" text-anchor="middle">B</text><text class="i" x="198" y="51" text-anchor="middle">C</text><text class="i" x="152" y="123" text-anchor="middle">A</text>
</svg>
