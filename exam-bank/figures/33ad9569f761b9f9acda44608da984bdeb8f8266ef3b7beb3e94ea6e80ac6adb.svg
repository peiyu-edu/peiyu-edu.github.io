<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" role="img" aria-labelledby="title desc"><title id="title">三棱锥 P-ABC</title><desc id="desc">三棱锥 P-ABC，D，E，O 分别为 BP，AP，BC 的中点，点 F 在 AC 上。实线 PB，PC，PA，AB，AC，BE，EF，AD；虚线 BC，DO，AO，BF。</desc><style>path,line,circle,polygon{fill:none;stroke:currentColor;stroke-width:2}.ax{stroke-width:1.5}.d{stroke-dasharray:6 5}text{fill:currentColor;stroke:none;font-family:Georgia,serif}.it{font-style:italic}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><line x1="185" y1="35" x2="45" y2="220"/><line x1="185" y1="35" x2="445" y2="220"/><line x1="185" y1="35" x2="100" y2="325"/><line x1="100" y1="325" x2="45" y2="220"/><line x1="100" y1="325" x2="445" y2="220"/><line x1="45" y1="220" x2="142.5" y2="180"/><line x1="142.5" y1="180" x2="272.5" y2="272.5"/><line x1="100" y1="325" x2="115" y2="127.5"/><line class="d" x1="45" y1="220" x2="445" y2="220"/><line class="d" x1="115" y1="127.5" x2="245" y2="220"/><line class="d" x1="100" y1="325" x2="245" y2="220"/><line class="d" x1="45" y1="220" x2="272.5" y2="272.5"/><text class="it" x="179" y="25" font-size="18">P</text><text class="it" x="91" y="123.5" font-size="18">D</text><text class="it" x="122" y="172" font-size="18">E</text><text class="it" x="23" y="228" font-size="18">B</text><text class="it" x="453" y="228" font-size="18">C</text><text class="it" x="241" y="210" font-size="18">O</text><text class="it" x="276.5" y="296.5" font-size="18">F</text><text class="it" x="92" y="351" font-size="18">A</text></svg>
