<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 710" role="img"><title>广东第21题图</title><desc>三幅直线相交示意：图1为两条直线相交，图2为三条直线两两相交且不共点，图3为三条直线共点；各图以α标记相交所成的最小角。</desc><style>:root{color:#173b40}@media(prefers-color-scheme:dark){:root{color:#e5eeeb}}line,path,polygon,polyline,circle,rect{stroke:currentColor;stroke-width:2;stroke-linejoin:round}text{fill:currentColor;stroke:none;font-family:"Times New Roman","Songti SC",serif}</style><line x1="30" y1="100" x2="290" y2="100"/><line x1="30" y1="45" x2="270" y2="155"/><text x="67" y="91" font-size="20">α</text><text x="129" y="190" font-size="20">图1</text><line x1="30" y1="350" x2="290" y2="350"/><line x1="60" y1="230" x2="260" y2="380"/><line x1="60" y1="380" x2="180" y2="230"/><text x="148" y="338" font-size="20">α</text><text x="129" y="417" font-size="20">图2</text><line x1="30" y1="550" x2="290" y2="550"/><line x1="60" y1="500" x2="260" y2="600"/><line x1="100" y1="640" x2="220" y2="460"/><text x="78" y="542" font-size="20">α</text><text x="129" y="682" font-size="20">图3</text></svg>
