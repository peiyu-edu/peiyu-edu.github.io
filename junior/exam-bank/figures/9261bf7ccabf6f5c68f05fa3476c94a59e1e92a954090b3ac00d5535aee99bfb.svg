<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 220" role="img" aria-labelledby="title desc"><title id="title">两条平行线与相交线段</title><desc id="desc">AB 与 CD 水平平行，AB 在上、CD 在下。线段 AD 与 BC 相交于点 E。从 A 向 BC 作垂线，垂足为 F；从 D 向 BC 作垂线，垂足为 G；F、G 处有直角记号。</desc><style>path,circle,polygon,rect,line,polyline{fill:none;stroke:currentColor;stroke-width:2}.d{stroke-dasharray:6 5}.t{stroke-width:1.2}.g{stroke-width:.9;stroke-dasharray:5 3}.f{fill:currentColor;stroke:none}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}</style><line x1="140.00" y1="30.00" x2="380.00" y2="30.00"/><line x1="30.00" y1="192.50" x2="390.00" y2="192.50"/><line x1="30.00" y1="192.50" x2="380.00" y2="30.00"/><line x1="140.00" y1="30.00" x2="390.00" y2="192.50"/><line x1="140.00" y1="30.00" x2="182.56" y2="121.67"/><line x1="390.00" y1="192.50" x2="326.16" y2="55.00"/><path d="M178.77,113.51L170.61,117.30L174.40,125.46" class="t"/><path d="M329.95,63.16L338.11,59.37L334.32,51.21" class="t"/><text x="126.0" y="32.0" text-anchor="middle" font-size="18" font-style="italic">A</text><text x="394.0" y="36.0" text-anchor="middle" font-size="18" font-style="italic">B</text><text x="16.0" y="198.5" text-anchor="middle" font-size="18" font-style="italic">C</text><text x="405.0" y="200.5" text-anchor="middle" font-size="18" font-style="italic">D</text><text x="242.0" y="82.0" text-anchor="middle" font-size="18" font-style="italic">E</text><text x="184.6" y="146.7" text-anchor="middle" font-size="18" font-style="italic">F</text><text x="348.2" y="79.0" text-anchor="middle" font-size="18" font-style="italic">G</text></svg>