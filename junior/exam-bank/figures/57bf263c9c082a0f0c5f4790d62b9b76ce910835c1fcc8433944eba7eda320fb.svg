<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 245" role="img" aria-labelledby="title desc"><title id="title">圆与切线</title><desc id="desc">AB 是⊙O 的直径，BC 是⊙O 的切线，AC 交⊙O 于点 D．</desc>
<style>path,circle,line,polyline,polygon{fill:none;stroke:currentColor;stroke-width:2}text{fill:currentColor;stroke:none;font-family:Georgia,serif}svg{color:#243d45;background:#fff}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d}}.g{fill:#b4b4b4;stroke:currentColor;stroke-width:2}.h{fill:#fff;stroke:currentColor;stroke-width:2}.k{fill:currentColor;stroke:currentColor}.d{stroke-dasharray:6 5}.t{stroke-width:1.2;stroke-dasharray:5 4}.i{font-style:italic}.z{font-family:"Noto Sans CJK SC",sans-serif}@media(prefers-color-scheme:dark){.g{fill:#5d7076}.h{fill:#15272d}}</style>
<circle cx="110" cy="120" r="90"/>
<line x1="110.0" y1="30.0" x2="110.0" y2="210.0"/>
<line x1="110.0" y1="210.0" x2="290.0" y2="210.0"/>
<line x1="110.0" y1="30.0" x2="290.0" y2="210.0"/>
<circle cx="110" cy="120" r="3" class="k"/>
<text x="110.0" y="22.0" font-size="20" text-anchor="middle" class="i">A</text>
<text x="110.0" y="234.0" font-size="20" text-anchor="middle" class="i">B</text>
<text x="306.0" y="216.0" font-size="20" text-anchor="middle" class="i">C</text>
<text x="216.0" y="114.0" font-size="20" text-anchor="middle" class="i">D</text>
<text x="90.0" y="126.0" font-size="20" text-anchor="middle" class="i">O</text>
</svg>
