<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" role="img" aria-labelledby="title desc"><title id="title">圆锥及其侧面展开扇形</title><desc id="desc">圆锥顶点A，底面圆心O，高OA用虚线画出并标12和直角记号，B在底面圆上，虚线半径OB，AB为母线；以A为顶点、AB为一条半径的阴影扇形表示侧面展开图，弧旁标10π。</desc><style>path,circle,ellipse,line{fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.d{stroke-dasharray:6 5}.thin{stroke-width:1.5}.fill{fill:currentColor;stroke:none}.shade{fill:var(--shade)}text{fill:currentColor;stroke:none;font-family:Georgia,serif;font-style:italic}text.n{font-style:normal}svg{color:#243d45;background:#fff;--shade:#c9d2d2}@media(prefers-color-scheme:dark){svg{color:#e2efee;background:#15272d;--shade:#4a6268}}</style><path class="shade" d="M110.0,170.0L164.4,305.9A146.4,146.4 0 0 0 160.5,32.6Z"/><path d="M50,300A60,14 0 0 0 170,300"/><path class="d" d="M50,300A60,14 0 0 1 170,300"/><path d="M110.0,170.0L50,300"/><path d="M110.0,170.0L164.4,305.9"/><path class="d" d="M110.0,170.0L110.0,300.0"/><path class="d" d="M110.0,300.0L164.4,305.9"/><path class="thin" d="M110,291L119,292L119,301"/><text x="96.0" y="172.0" font-size="22" text-anchor="middle">A</text><text x="176.4" y="325.9" font-size="22" text-anchor="middle">B</text><text x="97.0" y="307.0" font-size="20" text-anchor="middle">O</text><text x="95.0" y="245.0" font-size="20" text-anchor="middle" class="n">12</text><text x="266.4" y="174.9" font-size="20" class="n">10π</text></svg>
