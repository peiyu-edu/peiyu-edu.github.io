<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img" aria-labelledby="title desc">
<title id="title">题设图</title><desc id="desc">平行四边形ABCD，A、B位于左侧，C、D位于右侧，四边均为实线。</desc>
<style>:root{--ink:#172c3c;--shade:#c8d5de;--strong:#6e8798;--paper:#fff}text{font-family:"Noto Sans CJK SC",sans-serif;fill:var(--ink)}@media(prefers-color-scheme:dark){:root{--ink:#eff4f8;--shade:#405969;--strong:#91a8b7;--paper:#12212d}}</style>
<path d="M100.000,100.000 L40.000,220.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M40.000,220.000 L280.000,220.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M280.000,220.000 L340.000,100.000" fill="none" stroke="var(--ink)" stroke-width="2" /><path d="M340.000,100.000 L100.000,100.000" fill="none" stroke="var(--ink)" stroke-width="2" /><text x="93" y="88" font-size="18" text-anchor="middle">A</text><text x="30" y="243" font-size="18" text-anchor="middle">B</text><text x="288" y="243" font-size="18" text-anchor="middle">C</text><text x="348" y="88" font-size="18" text-anchor="middle">D</text></svg>