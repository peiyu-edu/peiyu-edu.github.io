<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 385" width="560" height="385" role="img" aria-labelledby="title desc">
<title id="title">三角形 ABC 与 DEF 在同一直线上</title>
<desc id="desc">△ABC 和 △DEF，点 B、E、C、F 从左到右依次在一条水平直线上，A、D 在直线同侧。△DEF 的位置像是把 △ABC 向右平移；AC 与 DE 相交。</desc>
<style>text{fill:#17202a;font-size:28px}.l{font-family:Georgia,'Times New Roman',serif;font-style:italic}.n{font-family:'Times New Roman',Times,serif}.c{font-family:'PingFang SC','Noto Sans CJK SC',sans-serif}</style>
<rect width="560" height="385" fill="white"/>
<polygon points="267.8,50.0 30.0,340.0 360.6,340.0" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<polygon points="404.1,50.0 166.3,340.0 496.9,340.0" fill="none" stroke="#17202a" stroke-width="2.5" stroke-linejoin="round"/>
<text x="263.8" y="42.0" class="l" text-anchor="middle">A</text>
<text x="408.1" y="42.0" class="l" text-anchor="middle">D</text>
<text x="30.0" y="376.0" class="l" text-anchor="middle">B</text>
<text x="166.3" y="376.0" class="l" text-anchor="middle">E</text>
<text x="360.6" y="376.0" class="l" text-anchor="middle">C</text>
<text x="496.9" y="376.0" class="l" text-anchor="middle">F</text>
</svg>
