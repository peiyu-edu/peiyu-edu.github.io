<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 160" role="img" aria-labelledby="title desc">
  <title id="title">两次取中点的线段</title>
  <desc id="desc">A、M、N、B从左至右，M是AB中点，N是MB中点，AB长18厘米。</desc>
  <style>
    :root{--ink:#253930;--bg:#fff}text{fill:var(--ink);font:22px sans-serif;text-anchor:middle}path{stroke:var(--ink);stroke-width:2;fill:none}.bg{fill:var(--bg)}
    @media(prefers-color-scheme:dark){:root{--ink:#e7eee9;--bg:#15231c}}
  </style>
  <rect class="bg" width="440" height="160"/>
  <path d="M50 70H390M50 64V76M220 64V76M305 64V76M390 64V76"/>
  <text x="50" y="44">A</text><text x="220" y="44">M</text>
  <text x="305" y="44">N</text><text x="390" y="44">B</text>
  <path d="M50 98V108H390V98"/>
  <text x="220" y="143">AB = 18 cm</text>
</svg>
